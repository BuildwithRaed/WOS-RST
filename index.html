<style>
  /* ============================================================
     GLOBAL THEME & LAYOUT
     Dark color palette (CSS custom properties), sidebar layout,
     nav groups, cards/panels, tables, forms, and shared components
     used across every page of the tracker.
     ============================================================ */
  :root{
    --bg:#0d1117;
    --panel:#151b23;
    --panel-2:#1b2330;
    --line:#2a3442;
    --ice:#6fd3f2;
    --ice-dim:#2c5568;
    --frost:#e8f2f6;
    --muted:#8694a3;
    --amber:#e8a23c;
    --good:#5bc98a;
    --danger:#e0645f;
    --radius:10px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html{ overflow-x:hidden; }
  body{
    margin:0;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 15% 0%, rgba(111,211,242,0.06), transparent 40%),
      var(--bg);
    color:var(--frost);
    min-height:100vh;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  /* iPad/touch: avoid accidental text selection when tapping cards, stars,
     and other interactive (non-text) UI repeatedly. */
  .skin-card, .stat-card, .thumb, [data-starctl], [data-rosterpick]{
    -webkit-user-select:none; user-select:none;
  }
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
  .app{ display:flex; flex-direction:column; min-height:100vh; }
  nav.topnav{
    display:flex; align-items:center; gap:4px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); padding:10px 16px; position:sticky; top:0; z-index:20;
    background:var(--bg);
  }
  .topnav .brand{ display:flex; align-items:center; gap:10px; margin-right:14px; flex-shrink:0; }
  .topnav .brand .mark{
    width:30px;height:30px;border-radius:8px;
    background:linear-gradient(160deg, var(--ice-dim), #0f2733);
    border:1px solid var(--ice-dim);
    display:flex;align-items:center;justify-content:center;
    color:var(--ice); font-weight:700; font-size:14px; flex-shrink:0;
  }
  .topnav .brand h1{ font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
  #mobileMenuBtn{
    display:none; align-items:center; gap:6px; margin-left:10px;
    background:transparent; border:1px solid var(--line); color:var(--frost);
    border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer;
  }
  #mobileMenuOverlay{
    display:none; position:fixed; inset:0; background:var(--bg); z-index:100;
    overflow-y:auto; padding:16px;
  }
  #mobileMenuOverlay.open{ display:block; }
  .mm-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .mm-header h2{ font-size:16px; margin:0; }
  .mm-close{ background:transparent; border:1px solid var(--line); color:var(--frost); border-radius:8px; width:36px; height:36px; font-size:16px; cursor:pointer; }
  .mm-category{ border-bottom:1px solid var(--line); }
  .mm-category-btn{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    background:transparent; border:none; color:var(--frost); text-align:start;
    padding:14px 4px; font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .mm-category-btn .caret{ font-size:11px; color:var(--muted); transition:transform .15s; }
  .mm-category.open .mm-category-btn .caret{ transform:rotate(180deg); }
  .mm-pages{ display:none; padding-block:0 12px; padding-inline:14px 4px; }
  .mm-category.open .mm-pages{ display:block; }
  .mm-pages button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:start;
    background:transparent; border:none; color:var(--muted);
    padding:10px 8px; border-radius:8px; font-size:13.5px; cursor:pointer; margin-bottom:2px;
  }
  .mm-pages button.active{ background:rgba(111,211,242,0.1); color:var(--ice); }
  .mm-pages button .ic{ width:18px; text-align:center; flex-shrink:0; font-size:13px; }
  .topnav-groups{ display:flex; align-items:center; gap:2px; flex-wrap:wrap; flex:1; }
  .topnav-group{ position:relative; }
  .topnav-group-btn{
    display:flex; align-items:center; gap:6px; background:transparent; border:none;
    color:var(--muted); padding:8px 12px; border-radius:8px; font-size:12.5px;
    letter-spacing:0.2px; cursor:pointer; white-space:nowrap;
  }
  .topnav-group-btn:hover{ background:var(--panel-2); color:var(--frost); }
  .topnav-group-btn.current{ background:rgba(111,211,242,0.1); color:var(--ice); }
  .topnav-group-btn .caret{ font-size:9px; opacity:0.6; transition:transform .15s; }
  .topnav-group.open .topnav-group-btn .caret{ transform:rotate(180deg); }
  .topnav-dropdown{
    display:none; position:absolute; top:calc(100% + 6px); inset-inline-start:0; min-width:200px;
    max-width:calc(100vw - 24px); max-height:calc(100vh - 60px); overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:6px; box-shadow:0 8px 24px rgba(0,0,0,0.35); z-index:30;
  }
  .topnav-group.open .topnav-dropdown{ display:block; }
  .topnav-dropdown button{
    display:flex; align-items:center; gap:10px; width:100%; text-align:start;
    background:transparent; border:none; color:var(--muted);
    padding:8px 10px; border-radius:8px; font-size:13px; cursor:pointer; margin-bottom:2px;
  }
  .topnav-dropdown button:hover{ background:var(--panel-2); color:var(--frost); }
  .topnav-dropdown button.active{ background:rgba(111,211,242,0.1); color:var(--ice); }
  .topnav-dropdown button .ic{ width:16px; text-align:center; flex-shrink:0; font-size:13px; }
  /* margin-inline-start (not margin-left) so the gear sits at the far end of
     the bar in both directions - in Arabic the whole bar is mirrored. */
  .topnav-settings{ position:relative; margin-inline-start:auto; flex-shrink:0; }
  .topnav-settings-btn{
    display:flex; align-items:center; justify-content:center;
    background:transparent; border:1px solid var(--line); color:var(--frost);
    border-radius:8px; width:36px; height:36px; font-size:15px; cursor:pointer;
  }
  .topnav-settings-panel{
    /* inset-inline-end keeps the panel tucked under the gear button in both
       directions. A physical right:0 opened it off the left edge of the screen
       in Arabic, where the gear sits on the left. */
    display:none; position:absolute; top:calc(100% + 6px); inset-inline-end:0;
    width:240px; max-width:calc(100vw - 24px);
    /* Never taller than the screen - short laptop screens, phones in
       landscape, and the taller owner-login version of this panel. */
    max-height:calc(100vh - 60px); overflow-y:auto; overscroll-behavior:contain;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px; box-shadow:0 8px 24px rgba(0,0,0,0.35); z-index:30;
    text-align:start;
  }
  .topnav-settings-panel input, .topnav-settings-panel select, .topnav-settings-panel button{ max-width:100%; box-sizing:border-box; }
  .topnav-settings.open .topnav-settings-panel{ display:block; }
  @media (max-width:760px){
    .topnav .brand h1{ display:none; }
    .topnav-group-btn{ padding:7px 9px; font-size:12px; }
    .topnav-groups{ display:none; }
    #mobileMenuBtn{ display:flex; }
  }
  #addCategoryBtn{
    display:flex; align-items:center; gap:8px; width:calc(100% - 20px); margin:6px 10px 14px;
    background:transparent; border:1px dashed var(--line); color:var(--ice);
    padding:8px 10px; border-radius:8px; font-size:12.5px; cursor:pointer;
  }
  #addCategoryBtn:hover{ border-color:var(--ice-dim); background:var(--panel-2); }
  main{ flex:1; padding:24px 28px 60px; max-width:1100px; width:100%; margin:0 auto; }
  .site-footer{ max-width:1100px; width:100%; margin:0 auto; padding:16px 28px 28px; border-top:1px solid var(--line); color:var(--muted); font-size:11.5px; line-height:1.55; text-align:center; }
  .site-footer p{ margin:0 0 6px; }
  .site-footer a{ color:var(--muted); text-decoration:underline; }
  @media (max-width:640px){ .site-footer{ padding:12px 12px 22px; font-size:11px; } }
  .page-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:20px; }
  .page-head h2{ font-size:20px; margin:0; font-weight:600; }
  .page-head .sub{ font-size:12.5px; color:var(--muted); margin-top:2px; }
  .grid{ display:grid; gap:14px; }
  .g4{ grid-template-columns:repeat(4,1fr); }
  .g3{ grid-template-columns:repeat(3,1fr); }
  .g2{ grid-template-columns:repeat(2,1fr); }
  .g6{ grid-template-columns:repeat(6,1fr); }
  /* Budgets: cards flow into columns (masonry) so a tall card never leaves
     a hole beside it; 1 column on phones, 2 on tablets/laptops, 3 on wide
     monitors. */
  .budget-cols{ columns:1; column-gap:16px; }
  .budget-cols > .panel{ break-inside:avoid; -webkit-column-break-inside:avoid; margin:0 0 16px; display:block; }
  @media (min-width:900px){ .budget-cols{ columns:2; } }
  @media (min-width:1500px){ .budget-cols{ columns:3; } }
  .budget-wrap{ max-width:1400px; margin:0 auto; }
  /* Current -> target level pairs (T11 / T12): side by side on wide
     screens, stacked with small captions on phones so nothing is cut off. */
  .lvl-pair{ display:flex; gap:4px; align-items:center; min-width:0; }
  .lvl-cell{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .lvl-cap{ display:none; font-size:9px; }
  .lvl-pair select{ font-size:12.5px; }
  @media (max-width:1100px){
    .t12-grid-4, .t12-grid-3{ grid-template-columns:repeat(2, minmax(0, 1fr)) !important; }
  }
  @media (max-width:760px){
    .lvl-pair{ flex-direction:column; align-items:stretch; gap:4px; }
    .lvl-arrow{ display:none; }
    .lvl-cap{ display:block; }
    .lvl-pair select{ width:100% !important; }
  }
  /* Grid column counts for phone/tablet are handled in the comprehensive
     @media (max-width:760px) block below. */

  /* ============================================================
     PHONE (narrow, <=480px): fixes overflow from the many fixed
     pixel widths used throughout (inputs/selects set to 80-200px
     for desktop table-style layouts), oversized headings/metrics,
     and the top navbar not fitting all groups in one row.
     ============================================================ */
  @media (max-width:760px){
    main{ padding:14px 12px 50px; }
    h1{ font-size:16px; }
    h2{ font-size:16px; }
    .page-head h2{ font-size:17px; }
    .page-head .sub{ font-size:11.5px; }
    .metric .val{ font-size:20px; }
    .metric{ padding:12px 14px; }
    .stat-card{ padding:12px 14px; }
    .panel{ padding:14px; }
    /* Narrower single/double column defaults for every stat grid. */
    .g4, .g3, .g6{ grid-template-columns:repeat(2,1fr) !important; gap:10px; }
    .g2{ grid-template-columns:1fr !important; }

    /* Any fixed-width input/select (the app uses many, e.g. width:80px-200px
       for desktop table-style rows) shrinks to fit its own row instead of
       forcing the row wider than the screen. */
    input, select, textarea{ max-width:100%; box-sizing:border-box; }
    input[style*="width:"]:not([type="checkbox"]):not([type="radio"]):not([style*="width:100%"]):not([style*="width: 100%"]):not([style*="flex-shrink:0"]):not([style*="flex-shrink: 0"]):not(.keep-w),
    select[style*="width:"]:not([style*="width:100%"]):not([style*="width: 100%"]):not([style*="flex-shrink:0"]):not([style*="flex-shrink: 0"]):not(.keep-w){ width:auto !important; min-width:0; flex:1 1 70px; }
    /* Checkboxes never stretch to fill a row (that was pushing their labels away). */
    input[type="checkbox"], input[type="radio"]{ flex:0 0 auto !important; }

    /* Rows of inputs (admin tables, calculators) wrap instead of overflowing. */
    form.inline{ flex-wrap:wrap; }
    .row-inline{ flex-wrap:wrap; }

    /* Top navbar: the group row is replaced by the Menu button + full
       overlay below, so just keep the bar itself compact. */
    nav.topnav{ padding:8px 10px; gap:2px; }

    /* Modals/dropdowns never exceed the viewport width. */
    .modal-box{ max-width:calc(100vw - 24px) !important; width:calc(100vw - 24px); }
    .topnav-settings-panel{ inset-inline-end:-8px; }

    /* Tables: keep horizontal scroll contained to the table itself, not
       the whole page, and shrink cell padding/font a bit. */
    table{ font-size:11.5px; }
    table th, table td{ padding:4px 6px !important; }

    /* Skin/island card grids: 2 per row instead of forcing a wide minimum. */
    /* Skin Gallery / Islands intentionally stay at 3 columns (.gallery-grid)
       even on phone, matching the in-game gallery layout. */

    button.btn{ padding:8px 12px; font-size:12.5px; }

    /* The app has ~80 inline "display:flex" rows throughout (stat rows,
       card headers, form rows, etc.). The real fix for cramped/overflowing
       rows is letting their children shrink below their natural content
       width (selects in particular refuse to shrink by default, which was
       forcing rows to wrap even when there was enough room) - wrap stays
       on as a fallback for when shrinking alone still isn't enough. */
    [style*="display:flex"] > *{ min-width:0; }
    [style*="display:flex"]{ flex-wrap:wrap; }
    [style*="display: flex"] > *{ min-width:0; }
    [style*="display: flex"]{ flex-wrap:wrap; }
    /* Roster heroes: keep the portrait beside its name/stats instead of
       stacking, even though the broad rule above wraps flex rows by default. */
    .roster-row{ flex-wrap:nowrap !important; align-items:flex-start !important; }
    #rosterHeroesGrid{ grid-template-columns:1fr !important; }

    /* Any other element with an inline pixel-based grid-template-columns
       (a handful of admin/table layouts) scrolls within itself rather
       than forcing the whole page wider than the screen. */
    [style*="grid-template-columns:"]{ max-width:100%; overflow-x:auto; }
  }
  .metric{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .metric .label{ font-size:12px; color:var(--muted); }
  .metric .val{ font-size:26px; font-weight:600; margin-top:6px; }
  .stat-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px;
  }
  .stat-card .label{ font-size:11px; color:var(--muted); letter-spacing:0.3px; }
  .stat-card .val{ font-size:24px; font-weight:600; margin:6px 0 10px; }
  .stat-bar-track{ height:5px; background:var(--panel-2); border-radius:4px; overflow:hidden; margin-bottom:12px; }
  .stat-bar-fill{ height:100%; background:var(--ice); }
  .src-row{ display:flex; align-items:center; justify-content:space-between; font-size:12px; padding:3px 0; color:var(--muted); }
  .src-row .src-name{ display:flex; align-items:center; gap:6px; }
  .src-row .src-val{ color:var(--frost); font-weight:500; }
  .troop-head{ display:flex; align-items:center; gap:8px; margin:26px 0 12px; }
  .troop-head .dot{ width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; background:var(--panel-2); border:1px solid var(--line); }
  .troop-head h3{ font-size:15px; margin:0; font-weight:600; flex:1; }
  .troop-head .count{ font-size:12px; color:var(--muted); }
  .health-bar-track{ height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden; }
  .health-bar-fill{ height:100%; background:var(--good); }
  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:18px 20px; margin-bottom:16px;
  }
  .panel h2{ font-size:14px; margin:0 0 4px; font-weight:600; }
  .panel .desc{ font-size:12.5px; color:var(--muted); margin:0 0 14px; }
  .row{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-top:1px solid var(--line); gap:12px; }
  .row:first-of-type{ border-top:none; }
  .row .name{ font-size:13.5px; }
  .row .meta{ font-size:12px; color:var(--muted); }
  .pill{
    font-size:11px; padding:2px 8px; border-radius:999px; background:var(--panel-2);
    color:var(--muted); border:1px solid var(--line);
  }
  .bar-track{ height:6px; background:var(--panel-2); border-radius:4px; overflow:hidden; width:120px; }
  .bar-fill{ height:100%; background:var(--ice); }
  .empty{
    text-align:center; padding:36px 10px; color:var(--muted); font-size:13.5px;
  }
  .empty .big{ font-size:14px; color:var(--frost); margin-bottom:4px; }
  form.inline{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    /* Admin row tables scroll inside their own box (header stays put) so
     long lists don't turn into a whole-page scroll. */
  .adm-scroll{ max-height:70vh; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  .adm-scroll thead th{ position:sticky; top:0; background:var(--panel); z-index:2; }
input,select,textarea{
    background:var(--panel-2); border:1px solid var(--line); color:var(--frost);
    padding:8px 10px; border-radius:8px; font-size:16px;
  }
  /* iPadOS/iOS Safari auto-zooms the whole page when a focused input's
     font-size is under 16px - keeping it at 16px+ avoids that. Buttons
     don't trigger zoom on tap, so they keep their own smaller size below. */
  textarea{ font-size:16px; }
  input[type="checkbox"]{ min-width:18px; min-height:18px; }
  input:focus,select:focus,textarea:focus{ outline:1px solid var(--ice); border-color:var(--ice); }
  textarea{ padding:8px 10px; border-radius:8px; box-sizing:border-box; }
  button.btn{
    background:var(--ice-dim); border:1px solid var(--ice-dim); color:var(--frost);
    padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer;
  }
  button.btn:hover{ filter:brightness(1.15); }
  button.btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--muted); }
  button.btn.small{ padding:5px 10px; font-size:12px; }
  .field-num{ width:90px; }
  .flex1{ flex:1; min-width:140px; }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--panel-2); border:1px solid var(--line); color:var(--frost);
    padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s;
    pointer-events:none; z-index:50;
  }
  .toast.show{ opacity:1; }
  .err{ color:var(--danger); font-size:12px; margin-top:6px; }
  .del{ background:transparent; border:none; color:var(--muted); cursor:pointer; font-size:15px; padding:2px 6px; }
  .del:hover{ color:var(--danger); }
  .skin-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
  .skin-card{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    overflow:hidden; cursor:pointer; transition:border-color .15s; text-align:start;
  }
  .skin-card:hover{ border-color:var(--ice-dim); }
  .skin-card.owned{ border-color:var(--good); }
  .skin-card .thumb{
    width:100%; aspect-ratio:1; background:var(--panel-2); display:flex; align-items:center; justify-content:center;
    overflow:hidden; padding:14%; border-radius:10px 10px 0 0;
  }
  .skin-card .thumb img{ width:100%; height:100%; object-fit:contain; border-radius:6px; }
  .skin-card .thumb .ph{ font-size:26px; color:var(--muted); font-weight:600; }
  /* Dashboard roster portrait: obvious clickable square */
  .roster-pick{ border:2px solid var(--ice); box-shadow:0 0 0 1px rgba(0,0,0,.35) inset; transition:border-color .15s, transform .15s; }
  .roster-pick:hover{ border-color:var(--frost); transform:scale(1.04); }
  /* Islands: same card/box size as elsewhere, but the image fills almost the whole thumbnail */
  .island-thumb{ padding:2% !important; border-radius:10px 10px 0 0 !important; }
  .island-thumb img{ object-fit:contain !important; border-radius:8px !important; }
  .skin-card .info{ padding:8px 10px 10px; }
  .skin-card .sname{ font-size:12.5px; font-weight:500; margin-bottom:4px; color:#fff; }
  .skin-card .sbonus{ font-size:12px; color:var(--ice); }
  .skin-card .sowned{ font-size:11px; margin-top:4px; color:var(--muted); }
  .skin-card.owned .sowned{ color:var(--good); }

    color:var(--frost); font-size:15px; cursor:pointer; position:relative;

  /* Swipe-card navigation (arrows + dots/counter). Swiping still works on
     touchscreens; these give mouse and keyboard users the same control. */
  .swipe-nav{ display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:nowrap; }
  .swipe-nav .swipe-arrow{
    flex-shrink:0; display:flex; align-items:center; justify-content:center;

  .swipe-nav .swipe-arrow:hover:not(:disabled){ border-color:var(--ice); color:var(--ice); }

  .swipe-nav .swipe-dots{ display:flex; align-items:center; justify-content:center; gap:4px; flex-wrap:wrap; min-width:0; }
  /* Dot hit area is 22px so it's easy to tap, while the dot itself stays small. */
  .swipe-nav .swipe-dot{
    width:22px; height:22px; padding:0; border:none; background:transparent; cursor:pointer;

  /* Selects inside the packs table are see-through so they sit flat in the
     header row - their popup list still needs a solid background, or the

  select option{ background:var(--panel); color:var(--frost); }

  .cat-tabs{ display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; flex:1; }

  .cat-tabs button.active{ background:var(--ice-dim); color:var(--frost); border-color:var(--ice-dim); }

     PHONE LAYOUT FIXES (<=760px)

  .badge-lvl::before{ content:" \00b7  "; }
  .badge-name, .badge-lvl{ display:inline; }
  /* Shared backpack/materials row: a wrapping grid on every screen size. */
  .mat-row{ display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:12px 10px; margin-bottom:14px; }
  .mat-row .mat-name{ white-space:normal; line-height:1.25; }

  .mat-row > div{ display:flex; flex-direction:column; }
  .mat-row > div > :first-child{ flex:1; align-items:flex-start !important; }

     so a card left alone on the last row doesn't stretch full width. */
  @media (min-width:761px){
    .stats-row-scroll{ display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); overflow-x:visible; }
    /* These two hold fixed-width items, so they keep wrapping as a flex row. */
    .stats-row-scroll.facility-cards, #expertsInventory{ display:flex; flex-wrap:wrap; }
    /* Experts event panels are half width: keep ATK/DEF/LETH/HP on one row. */
    .stats-row-scroll.sr-4{ grid-template-columns:repeat(4, minmax(0, 1fr)); }
    .stats-row-scroll.sr-4 > .metric{ min-width:0; }
    /* Backpack cells a little wider, so names like "Charm Guides" fit on one line. */
    .mat-row{ grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); }
  }
  /* Tablet portrait (and narrow desktop windows): the full nav doesn't fit
     on one line below ~1000px, so use the Menu button like phone does. */
  @media (max-width:999px){
    .topnav-groups{ display:none; }
    #mobileMenuBtn{ display:flex; }
    .stat-key{ display:none; }
    #rosterHeroesGrid{ grid-template-columns:1fr !important; }
    .stats-row-scroll.sr-3col{ grid-template-columns:repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width:760px){
    /* Summary/stat rows: uniform grid instead of a hidden horizontal scroll. */
    .stats-row-scroll{
      display:grid; grid-template-columns:repeat(auto-fit, minmax(74px, 1fr));
      gap:8px; overflow-x:visible;
    }
    .stats-row-scroll > *, .stats-row-scroll .metric{ min-width:0 !important; }
    .stats-row-scroll.sr-2col{ grid-template-columns:1fr 1fr; }
    .stats-row-scroll.sr-3col{ grid-template-columns:repeat(3, minmax(0, 1fr)); }

    /* Experts backpack: two items per row on phones. */
    #expertsInventory{ grid-template-columns:1fr 1fr; gap:12px; }
    #expertsInventory > div{ flex:0 0 auto !important; min-width:0 !important; }

    /* Pets Level: stats card full width, Current/Target side by side. */
    .pet-level-row{ grid-template-columns:1fr 1fr; }
    .pet-level-row > :first-child{ grid-column:1 / -1; }

    /* Facility buildings: 2 per row, cards fill their column. */
    .stats-row-scroll.facility-cards{ grid-template-columns:1fr 1fr; gap:10px; }
    .facility-cards > .skin-card{ width:auto !important; }

    /* Heroes Special Skills: Jeronimo and Natalia stacked. */
    .hero-special-grid{ grid-template-columns:1fr !important; overflow-x:visible !important; }

    /* Research Center: six tiers become two rows of three. */
    .rc-tier-grid{ grid-template-columns:repeat(3, minmax(0, 1fr)) !important; overflow-x:visible !important; }
    /* T12: 4-item rows become 2x2, the 5-slot row becomes 3 + 2. */
    .t12-grid{ overflow-x:visible !important; }
    .t12-grid > *{ min-width:0; }
    .t12-grid-4{ grid-template-columns:repeat(2, minmax(0, 1fr)) !important; }
    .t12-grid-5{ grid-template-columns:repeat(3, minmax(0, 1fr)) !important; }

    /* Research speed + speedups: wraps instead of pushing Speedups off screen. */
    .rs-row{ flex-wrap:wrap !important; row-gap:8px; }

    /* Pets Refine rows: slimmer bar so "of max" stays on the same line. */
    [data-refinerowfor] > div{ min-width:60px !important; }

    /* Dashboard: drop the ATT/DEF/DMG/HP prefix so labels stay on one line. */
    .stat-key{ display:none; }

    /* Islands: name on the first line, level always visible underneath. */
    .badge-name, .badge-lvl{ display:block; }
    .badge-name{ overflow:hidden; text-overflow:ellipsis; }
    .badge-lvl{ font-size:10px; opacity:0.85; margin-top:1px; }
    .badge-lvl::before{ content:none; }
  }

<script>
  // ============================================================
  // SUPABASE CONFIG & CORE HELPERS
  // Every visitor gets their own anonymous session automatically (their
  // calculator progress is private to them, tied to this browser). The
  // owner logs in with a real email/password to unlock Admin - see
  // ensureAuthSession() below and the OWNER_EMAIL check.
  const SUPABASE_URL = "https://hzourauekkiorojrhpko.supabase.co";
  const SUPABASE_KEY = "sb_publishable_jYL-ovML6Pq2GqJr-ouaGQ_2-uUMzb7";
  const OWNER_EMAIL = "BuildwithRaed@outlook.com";
  // progression_tables/progression_rows (Chief Gear & Hero Gear material cost
  // data) is pure shared reference data with a user_id column left over from
  // the single-user era - every visitor reads the owner's copy, regardless
  // of who's logged in, since the numbers are the same for everyone.
  const PROGRESSION_OWNER_ID = "4a1b1beb-90a1-4282-b491-4156d2293093";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let USER_ID = null;
  let CURRENT_SESSION = null;
  let IS_OWNER = false;

  // Keeps CURRENT_SESSION in sync with supabase-js's own auto-refreshed token,
  // so a long-open tab never ends up sending a stale/expired access_token.
  // Without this, sb() below would keep reusing whatever token was captured
  // at the last ensureAuthSession() call, which expires after ~1hr.
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    if (session) {
      CURRENT_SESSION = session;
      USER_ID = session.user.id;
      IS_OWNER = (session.user.email || "").toLowerCase() === OWNER_EMAIL.toLowerCase();
    }
  });

  // Ensures a session exists (signing in anonymously if needed), and sets
  // USER_ID / IS_OWNER from it. Called once before the app renders, and
  // again after any login/logout so the whole app reflects the new session.
  async function ensureAuthSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      CURRENT_SESSION = session;
    } else {
      const { data, error } = await supabaseClient.auth.signInAnonymously();
      if (error) {
        console.error("Anonymous sign-in failed:", error.message);
        throw error;
      }
      CURRENT_SESSION = data.session;
    }
    USER_ID = CURRENT_SESSION.user.id;
    IS_OWNER = (CURRENT_SESSION.user.email || "").toLowerCase() === OWNER_EMAIL.toLowerCase();
  }

  // Thin wrapper around the Supabase REST (PostgREST) API. Uses the current
  // session's access token (not just the bare anon key) so that database
  // rules based on auth.uid()/auth.jwt() resolve correctly per visitor.
  // Shared in-flight refresh promise: if several sb() calls hit a bad token
  // at once (e.g. the Dashboard's parallel Promise.all batch), they should
  // all wait on ONE refresh instead of each firing their own refreshSession()
  // — concurrent refreshes can race and hand back inconsistent tokens, which
  // is one way a "JWT issued at future" error can show up in the first place.
  let SESSION_REFRESH_INFLIGHT = null;
  function refreshSessionOnce() {
    if (!SESSION_REFRESH_INFLIGHT) {
      SESSION_REFRESH_INFLIGHT = supabaseClient.auth.refreshSession().finally(() => {
        SESSION_REFRESH_INFLIGHT = null;
      });
    }
    return SESSION_REFRESH_INFLIGHT;
  }

  async function sb(path, opts = {}, _retried = false) {
    const token = (CURRENT_SESSION && CURRENT_SESSION.access_token) || SUPABASE_KEY;
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...opts,
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${token}`,
        "Content-Type": "application/json",
        Prefer: opts.prefer || "return=representation",
        ...(opts.headers || {}),
      },
    });
    if (!res.ok) {
      const text = await res.text().catch(() => "");
      // Covers every JWT-claim rejection PostgREST can return (PGRST303) -
      // expired, issued-at-future (usually device clock drift, or several
      // concurrent refreshes racing each other), not-yet-valid, etc. - not
      // just the "expired" case. One shared refresh + retry recovers
      // silently instead of surfacing a dead page to the user.
      if (res.status === 401 && /jwt/i.test(text) && !_retried) {
        const { data, error } = await refreshSessionOnce();
        if (!error && data.session) {
          CURRENT_SESSION = data.session;
          return sb(path, opts, true);
        }
      }
      throw new Error(`${res.status} ${text}`);
    }
    const text = await res.text();
    const data = text ? JSON.parse(text) : null;
    // The API hands back at most 1,000 rows per request. A read that hits
    // that limit (the expert affinity table passed it once Justus was
    // added) keeps fetching the next pages until the table is complete.
    const isGet = !opts.method || opts.method.toUpperCase() === "GET";
    if (isGet && Array.isArray(data) && data.length >= 1000 && !(opts.headers && opts.headers.Range)) {
      let all = data, from = data.length;
      for (let guard = 0; guard < 50; guard++) {
        const page = await sb(path, { ...opts, headers: { ...(opts.headers || {}), "Range-Unit": "items", Range: `${from}-${from + 999}` } }, _retried);
        if (!Array.isArray(page) || !page.length) break;
        all = all.concat(page);
        from += page.length;
        if (page.length < 1000) break;
      }
      return all;
    }
    return data;
  }

// Generic persistence for calculator selections (Charm, Chief Gear, Hero
// Gear) so they survive navigation/reloads and can feed live "current"
// totals into the Stats dashboard, not just the page you're on.
// Speed: every saved calculator state for this user is fetched in ONE request
// (the first time any page asks for one) and kept in memory, instead of one
// round trip per state - the Dashboard alone used to make ~25 of them, mostly
// one after another. Saves update the in-memory copy too, so it stays current.
// Values are handed out as copies, so pages behave exactly as if each state
// had just been fetched fresh.
let CALC_STATE_CACHE = null; // { calc_name: state } for CALC_STATE_CACHE_USER
let CALC_STATE_CACHE_USER = null;
let CALC_STATE_PROMISE = null;
function cloneState(v) {
  if (v == null) return v;
  try { return structuredClone(v); } catch (e) { return JSON.parse(JSON.stringify(v)); }
}
function preloadCalcStates() {
  if (CALC_STATE_CACHE_USER !== USER_ID) {
    // First load, or a different user logged in: start over.
    CALC_STATE_CACHE = null;
    CALC_STATE_PROMISE = null;
    CALC_STATE_CACHE_USER = USER_ID;
  }
  if (!CALC_STATE_PROMISE) {
    const uid = USER_ID;
    CALC_STATE_PROMISE = sb(`calc_state?user_id=eq.${uid}&select=calc_name,state`)
      .then((rows) => {
        if (uid !== USER_ID) return;
        const map = {};
        (rows || []).forEach((r) => { map[r.calc_name] = r.state; });
        CALC_STATE_CACHE = map;
      })
      .catch(() => {
        // Fall back to per-state requests if the bulk fetch fails.
        CALC_STATE_PROMISE = null;
      });
  }
  return CALC_STATE_PROMISE || Promise.resolve();
}
async function loadCalcState(calcName) {
  await preloadCalcStates();
  if (CALC_STATE_CACHE && CALC_STATE_CACHE_USER === USER_ID) {
    const v = CALC_STATE_CACHE[calcName];
    return v === undefined ? null : cloneState(v);
  }
  try {
    const [row] = await sb(`calc_state?user_id=eq.${USER_ID}&calc_name=eq.${encodeURIComponent(calcName)}&select=state`);
    return row ? row.state : null;
  } catch (err) {
    return null;
  }
}
async function saveCalcState(calcName, state) {
  if (CALC_STATE_CACHE && CALC_STATE_CACHE_USER === USER_ID) CALC_STATE_CACHE[calcName] = cloneState(state);
  try {
    await sb(`calc_state?on_conflict=user_id,calc_name`, {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates" },
      body: JSON.stringify({ user_id: USER_ID, calc_name: calcName, state, updated_at: new Date().toISOString() }),
    });
  } catch (err) {
    // best-effort; a failed save shouldn't block using the calculator
  }
}

// Item icons come from an external image host; if one fails to load
// (seen intermittently on iPhone), retry it once after a short delay.
document.addEventListener("error", (e) => {
  const img = e.target;
  if (!(img instanceof HTMLImageElement) || img.dataset.retried || !img.src) return;
  img.dataset.retried = "1";
  const src = img.src;
  setTimeout(() => { img.src = src + (src.includes("?") ? "&" : "?") + "r=1"; }, 800);
}, true);

// Shows a small bottom-of-screen confirmation/error message.
function toast(msg, isErr) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.borderColor = isErr ? "var(--danger)" : "var(--line)";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

// Escapes user-supplied text before injecting into innerHTML.
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

// OVERVIEW / STATS DASHBOARD
// Aggregates buff data across all categories into per-troop-type

let DASHBOARD_STATS_LIVE = null; // [{troop, stat, total, sources}] from the last dashboard computation
async function renderOverview(opts = {}) {
  // Speed: everything the Dashboard needs is requested in one parallel batch
  // (saved states come from the shared calc_state cache), instead of several
  // waves of requests that each waited for the previous one to finish.
  preloadCalcStates();
  const skinsPromise = sb(`skins?user_id=eq.${USER_ID}&select=name,category,bonus_type,bonus_value,bonus_level1,bonus_type2,bonus_value2,bonus_level2,bonus_type3,bonus_value3,bonus_level3,bonus_type4,bonus_value4,bonus_level4,display_group,owned,current_level,max_level,count_in_max`);
  const [[columns, rows], allSkins, ISLAND_CATEGORIES, ROSTER_HERO_CATALOG, ROSTER_SAVED, ROSTER_PLAYER_HEROES, ROSTER_STAR_ROWS, ROSTER_WIDGET_ROWS,
    , GALLERY_SAVED, JERO_SAVED, NATALIA_SAVED, ALBUM_SAVED] = await Promise.all([
    ensureBuffTable().then(() => Promise.all([
      sb(`buff_columns?table_id=eq.${BUFF_TABLE_ID}&select=id,name,category`),
      sb(`buff_rows?table_id=eq.${BUFF_TABLE_ID}&select=id,name,buff_cells(value,column_id)`),
    ])),
    skinsPromise,
    // Which skins.category values actually represent an Island sub-category
    // (Attack/Defense/Lighthouse/MVP/Islands Guide, etc) - driven by the same
    // table the Islands page itself uses, cached across the session so this
    // small, rarely-changing table isn't re-fetched on every page visit.
    ensureIslandCategories(),
    // Roster heroes (Infantry/Lancers/Marksman) - fetched here, early, so
    // the stat totals below can include them when a troop's "used" flag is on.
    sb(`heroes?select=id,name,image_url,troop_type,generation,rarity,exp_attack,exp_defense,widget_lethality,widget_health&order=generation.desc.nullslast,name.asc`),
    loadCalcState("dashboard_roster"),
    sb(`player_heroes?select=id,hero_id,current_level,current_stars&user_id=eq.${USER_ID}`),
    sb(`hero_gen_star_stats?select=generation,step,atk_pct,def_pct,shards&order=generation,step`),
    sb(`hero_gen_widget_stats?select=generation,level,leth_pct,hp_pct&order=generation,level`),
    // live data from the calculators, for the Charm/Chief/Hero Gears/etc. sources below
    Promise.all([ensureCharmData(), loadChiefGearRows(), ensureHeroGearData(), ensureT12StateData(), ensureRCData(), ensureT11StateData(), ensurePetsData(), ensureVipData(), ensureExpertsTroopStatsData(), ensureExpertsResearchDataGlobal(), skinsPromise.then(ensureGlobeLevelData), ensureResearchPageCountedData()]),
    loadCalcState("collection_gallery"),
    loadCalcState("hero_stars_jero"),
    loadCalcState("hero_stars_natalia"),
    loadCalcState("album_tundra"),
  ]);
  // ---- Roster heroes: shared lookups, needed by statFor()/liveCalcValue() below ----
  const ROSTER_STATE = ROSTER_SAVED || {};
  const ROSTER_PH_BY_HERO = {};
  ROSTER_PLAYER_HEROES.forEach((p) => { ROSTER_PH_BY_HERO[p.hero_id] = p; });
  const ROSTER_STAR_STATS_BY_GEN = {};
  ROSTER_STAR_ROWS.forEach((r) => { (ROSTER_STAR_STATS_BY_GEN[r.generation] = ROSTER_STAR_STATS_BY_GEN[r.generation] || {})[r.step] = r; });
  const ROSTER_WIDGET_STATS_BY_GEN = {};
  ROSTER_WIDGET_ROWS.forEach((r) => { (ROSTER_WIDGET_STATS_BY_GEN[r.generation] = ROSTER_WIDGET_STATS_BY_GEN[r.generation] || {})[r.level] = r; });
  // current_stars is stored as star.sub (e.g. 3.4 = 3★ + 4 of 6 shards).
  const rosterStarsOf = (heroId) => {
    const v = Number((ROSTER_PH_BY_HERO[heroId] || {}).current_stars) || 0;
    const star = Math.min(5, Math.floor(v));
    const sub = Math.min(6, Math.round((v - star) * 10));
    return { star, sub };
  };
  // Backward compat: entries may be a bare heroId string or { heroId, widget, used }.
  const rosterEntryFor = (troopKey) => {
    const e = ROSTER_STATE[troopKey];
    if (!e) return { heroId: "", widget: 0, used: true };
    if (typeof e === "string") return { heroId: e, widget: 0, used: true };
    return { heroId: e.heroId || "", widget: Number(e.widget) || 0, used: e.used !== false };
  };
  // Roster Heroes' contribution to a given troop+stat: ATT/DEF come from
  // the hero's star level, DMG/HP from their widget (Exclusive Gear) level.
  // Returns 0 if that troop's roster slot is empty or turned off.
  function rosterCalcValue(troop, statKey, useMax) {
    const { heroId, widget, used } = rosterEntryFor(troop);
    if (!used || !heroId) return 0;
    const hero = ROSTER_HERO_CATALOG.find((h) => h.id === heroId);
    if (!hero) return 0;
    if (statKey === "ATT" || statKey === "DEF") {
      const table = ROSTER_STAR_STATS_BY_GEN[hero.generation];
      if (!table) return 0;
      const step = useMax ? 30 : (() => { const { star, sub } = rosterStarsOf(hero.id); return star * 6 + sub; })();
      const row = table[step];
      if (!row) return 0;
      return Number(statKey === "ATT" ? row.atk_pct : row.def_pct) || 0;
    }
    if (statKey === "DMG" || statKey === "HP") {
      const table = ROSTER_WIDGET_STATS_BY_GEN[hero.generation];
      if (!table) return 0;
      const level = useMax ? 10 : widget;
      const row = table[level];
      if (!row) return 0;
      return Number(statKey === "DMG" ? row.leth_pct : row.hp_pct) || 0;
    }
    return 0;
  }
  const GALLERY_STATE = GALLERY_SAVED || { Attack: 2, Defense: 2, Lethality: 2, Health: 2 };
  const GALLERY_MAX = { Attack: 6, Defense: 6, Lethality: 6, Health: 4 };
  const JERO_STARS = (JERO_SAVED || {})["__shared__"] ?? 0;
  const NATALIA_STARS = (NATALIA_SAVED || {})["__shared__"] ?? 0;
  const ALBUM_STATE = ALBUM_SAVED || { Attack: 2, Defense: 2 };
  // Alliance Tech rows are already in allSkins (same table, same user) - no extra request.
  const ALLIANCE_TECH_CACHE = allSkins.filter((s) => s.category === "Alliance Tech");
  const colById = Object.fromEntries(columns.map((c) => [c.id, c.category || c.name]));
  // Categories that used to be shown as flat buff sources but now have a
  // dedicated page (T11/T12/Research Center replaced War Acd./Research;
  // Pets Level/Pets Refine replaced the old Pets category). Their old
  // static buff_cells numbers are stale and must not double-count toward
  // dashboard totals.
  // Strict whitelist: only these raw categories may contribute to dashboard
  // stat totals, matching exactly the pages in the sidebar. Anything else
  // (old retired categories, Expert, Exp. Research, Chief Bonus, etc.) is
  // excluded entirely, whether or not it's been explicitly retired.
  const ALLOWED_STAT_CATEGORIES = new Set([
    "Charm", "Chief", "Chief Bonus", "Hero Gears", "Skins", "Islands",
    "Vip Tier", "Jero", "Natalia", "Facility",
    "Alliance Buff", "Album Buff", "Gallery",
    "Research Center", "T11 Helios Research", "T12 Research", "Experts", "Experts Research",
    "Roster Heroes",
  ]);
  // Every page that's live-wired into the dashboard: its current value is
  // computed fresh (not a stale static number) and overwrites/augments
  // whatever static buff_cells value exists under the same source name.
  const LIVE_CALC_KEYS = [
    "Charm", "Chief", "Chief Bonus", "Hero Gears", "T12 Research", "Research Center",
    "Facility", "Gallery", "T11 Helios Research", "Jero", "Natalia",
    "Pets Refine", "Pets Level", "VIP", "Album Buff", "Alliance Buff", "Experts", "Experts Research",
    "Roster Heroes",
  ];
  // Fixed display order for the stat breakdown (top-3 preview and full
  // modal), matching the order sources appear in the sidebar. Anything
  // not in this list falls back to value-sorted order at the end.
  const SOURCE_DISPLAY_ORDER = [
    "VIP", "Jero", "Natalia", "Skins", "Islands", "Roster Heroes",
    "Chief", "Chief Bonus", "Charm", "Hero Gears",
    "Pets Level", "Pets Refine",
    "Facility", "Alliance Buff", "Album Buff", "Gallery",
    "Research Center", "T11 Helios Research", "T12 Research", "Experts", "Experts Research",
  ];
  function sortBySourceOrder(entries) {
    return entries.slice().sort((a, b) => {
      const ia = SOURCE_DISPLAY_ORDER.indexOf(a[0]);
      const ib = SOURCE_DISPLAY_ORDER.indexOf(b[0]);
      const ra = ia === -1 ? Infinity : ia;
      const rb = ib === -1 ? Infinity : ib;
      if (ra !== rb) return ra - rb;
      return b[1] - a[1];
    });
  }

  const TROOP_TYPES = [
    { key: "Infantry", icon: "\u2694" },
    { key: "Lancers", icon: "\u26E8" },
    { key: "Marksman", icon: "\u25CE" },
  ];
  const STATS = [
    { key: "ATT", label: "Attack" },
    { key: "DEF", label: "Defense" },
    { key: "DMG", label: "Lethality" },
    { key: "HP", label: "Health" },
  ];

  // The 3 calculators use "Lancer" (singular); the dashboard's buff rows use "Lancers"
  const DASH_TO_CALC_TROOP = { Infantry: "Infantry", Lancers: "Lancer", Marksman: "Marksman" };

  // Live current/max value a given calculator contributes to a troop+stat,
  // or null if that calculator doesn't affect this stat at all.
  function liveCalcValue(calcKey, troop, statKey, useMax) {
    const calcTroop = DASH_TO_CALC_TROOP[troop] || troop;
    if (calcKey === "Roster Heroes") {
      return rosterCalcValue(troop, statKey, useMax);
    }
    if (calcKey === "Experts") {
      const rawStat = STAT_KEY_TO_RAW[statKey];
      const stats = computeExpertsTroopStatsGlobal(useMax);
      return stats[rawStat] || 0;
    }
    if (calcKey === "Experts Research") {
      const statMap = { ATT: "ATK", DEF: "DEF", DMG: "DMG", HP: "HP" };
      const rawStat = statMap[statKey];
      const stats = computeExpertsResearchTroopStatsGlobal(calcTroop, useMax);
      return stats[rawStat] || 0;
    }
    if (calcKey === "Charm") {
      if (statKey !== "DMG" && statKey !== "HP") return null;
      const stats = computeCharmStats(useMax ? maxedCharmState() : CHARM_CALC_STATE);
      return stats[calcTroop] || 0;
    }
    if (calcKey === "Chief") {
      if (statKey !== "ATT" && statKey !== "DEF") return null;
      const stats = computeChiefGearRawStat(useMax ? maxedChiefGearState() : CHIEF_GEAR_STATE);
      const rawStat = statKey === "ATT" ? "Attack" : "Defense";
      return stats[calcTroop]?.[rawStat] || 0;
    }
    if (calcKey === "Hero Gears") {
      const rawStat = STAT_KEY_TO_RAW[statKey];
      // The breakdown modal can switch between the 3 real gear loadouts
      // (Set 1/2/3); everywhere else defaults to Set 1.
      const setState = HERO_GEAR_SETS[BREAKDOWN_HERO_GEAR_SET] || HERO_GEAR_STATE;
      const stats = computeHeroGearStats(useMax ? maxedHeroGearState() : setState);
      return stats[calcTroop]?.[rawStat] || 0;
    }
    if (calcKey === "T12 Research") {
      if (RESEARCH_PAGE_COUNTED.t12 === false) return 0;
      const rawStat = STAT_KEY_TO_RAW[statKey];
      if (useMax) {
        return T12_ITEM_DEFS.filter((d) => d.stat === rawStat).reduce((sum, d) => sum + d.max * (d.pct || 1), 0);
      }
      if (!T12_STATE || !T12_STATE[calcTroop]) return 0;
      return computeT12Stats(T12_STATE[calcTroop])[rawStat] || 0;
    }
    if (calcKey === "Research Center") {
      const rawStat = STAT_KEY_TO_RAW[statKey];
      if (!RC_NODES_CACHE) return 0;
      const bases = [...(RC_BASE_CATEGORIES.Shared || []), ...(RC_BASE_CATEGORIES[calcTroop] || [])];
      let total = 0;
      bases.forEach((base) => {
        RC_TIERS.forEach((tier) => {
          const trackName = `${base} ${tier}`;
          const levels = RC_NODES_CACHE[trackName] || [];
          levels.forEach((r) => {
            if (r.stat !== rawStat) return;
            if (useMax) total += Number(r.stat_pct) || 0;
            else if (!useMax && r.level <= ((RC_STATE && RC_STATE[trackName]) || 0)) total += Number(r.stat_pct) || 0;
          });
        });
      });
      return total;
    }
    if (calcKey === "Chief Bonus") {
      // 3-piece bonus = Defense for all troops; 6-piece bonus = Attack for all troops
      if (statKey !== "ATT" && statKey !== "DEF") return null;
      const state = useMax ? maxedChiefGearState() : CHIEF_GEAR_STATE;
      const { threeBonus, sixBonus } = computeChiefGearSetBonus(state);
      return statKey === "DEF" ? threeBonus : sixBonus;
    }
    if (calcKey === "Facility") {
      const rawStat = STAT_KEY_TO_RAW[statKey];
      if (rawStat !== "Attack" && rawStat !== "Defense") return null;
      let total = 0;
      for (const s of allSkins) {
        if (s.category !== "Facility") continue;
        if (!useMax && !s.owned) continue;
        const matches = s.bonus_type === rawStat || s.bonus_type === `${calcTroop} ${rawStat}` || s.bonus_type === "All" || s.bonus_type === "All Troops";
        if (matches && s.bonus_value != null) total += Number(s.bonus_value);
      }
      return total;
    }
    if (calcKey === "Gallery") {
      const rawStat = STAT_KEY_TO_RAW[statKey];
      if (useMax) return GALLERY_MAX[rawStat] || 0;
      return GALLERY_STATE[rawStat] || 0;
    }
    if (calcKey === "T11 Helios Research") {
      if (RESEARCH_PAGE_COUNTED.t11 === false) return 0;
      const rawStat = STAT_KEY_TO_RAW[statKey];
      if (!T11_NODES_CACHE) return 0;
      return computeT11Stats(calcTroop, useMax)[rawStat] || 0;
    }
    if (calcKey === "Jero") {
      if (statKey !== "DMG" && statKey !== "HP") return null;
      const maxPct = 15;
      if (useMax) return maxPct;
      return (maxPct / 5) * JERO_STARS;
    }
    if (calcKey === "Natalia") {
      if (statKey !== "ATT" && statKey !== "DEF") return null;
      const maxPct = 10;
      if (useMax) return maxPct;
      return (maxPct / 5) * NATALIA_STARS;
    }
    if (calcKey === "Pets Refine") {
      if (statKey !== "DMG" && statKey !== "HP") return null;
      if (!PET_REFINE_CACHE) return 0;
      const isLeth = statKey === "DMG";
      const statField = calcTroop === "Infantry" ? (isLeth ? "il" : "ih") : calcTroop === "Lancer" ? (isLeth ? "ll" : "lh") : isLeth ? "ml" : "mh";
      const maxField = calcTroop === "Infantry" ? (isLeth ? "infantry_lethality_pct" : "infantry_health_pct") : calcTroop === "Lancer" ? (isLeth ? "lancer_lethality_pct" : "lancer_health_pct") : isLeth ? "marksman_lethality_pct" : "marksman_health_pct";
      let total = 0;
      Object.keys(PET_REFINE_CACHE).forEach((pet) => {
        if (!isPetUnlocked(pet)) return;
        if (useMax) {
          const petRows = PET_REFINE_CACHE[pet];
          total += Number(petRows[petRows.length - 1][maxField]) * 100;
        } else {
          const s = (PET_REFINE_TYPED_STATE && PET_REFINE_TYPED_STATE[pet]) || {};
          const petRows = PET_REFINE_CACHE[pet];
          const cap = Math.round(Number(petRows[petRows.length - 1][maxField]) * 10000) / 100;
          total += Math.min(Number(s[statField]) || 0, cap);
        }
      });
      return total;
    }
    if (calcKey === "Pets Level") {
      // single combined ATK/DEF stat per pet, applied to both Attack and
      // Defense equally for all 3 troops (the source data never split them)
      if (statKey !== "ATT" && statKey !== "DEF") return null;
      if (!PETS_NODES_CACHE) return 0;
      let total = 0;
      Object.keys(PETS_NODES_CACHE).forEach((pet) => {
        if (!isPetUnlocked(pet)) return;
        const levels = PETS_NODES_CACHE[pet];
        if (useMax) {
          for (let i = levels.length - 1; i >= 0; i--) {
            if (levels[i].atk_def_pct != null) {
              total += Number(levels[i].atk_def_pct) * 100;
              break;
            }
          }
        } else {
          const s = PETS_STATE ? PETS_STATE[pet] : null;
          const fromIdx = s && typeof s === "object" ? s.from : s ?? -1;
          if (fromIdx != null && fromIdx >= 0 && levels[fromIdx] && levels[fromIdx].atk_def_pct != null) {
            total += Number(levels[fromIdx].atk_def_pct) * 100;
          }
        }
      });
      return total;
    }
    if (calcKey === "VIP") {
      const rawStat = STAT_KEY_TO_RAW[statKey];
      if (!VIP_ROWS_CACHE || !VIP_ROWS_CACHE.length) return 0;
      const row = useMax ? VIP_ROWS_CACHE[VIP_ROWS_CACHE.length - 1] : VIP_ROWS_CACHE[VIP_SELECTED_INDEX ?? 0];
      return row && row[rawStat] != null ? row[rawStat] : 0;
    }
    if (calcKey === "Album Buff") {
      if (statKey !== "ATT" && statKey !== "DEF") return null;
      if (useMax) return 14;
      return ALBUM_STATE[STAT_KEY_TO_RAW[statKey]] || 0;
    }
    if (calcKey === "Alliance Buff") {
      const rawStat = STAT_KEY_TO_RAW[statKey];
      let total = 0;
      ALLIANCE_TECH_CACHE.forEach((it) => {
        if (it.bonus_type !== rawStat) return;
        // troop scope lives in the item NAME ("Infantry Attack I", "Troops
        // Attack I"), not bonus_type - every item shares the same generic
        // bonus_type regardless of which troop it actually applies to.
        const name = it.name || "";
        const isTroopsWide = /^Troops?\s/i.test(name);
        const isThisTroop = new RegExp(`^${calcTroop}s?\\s`, "i").test(name);
        if (!isTroopsWide && !isThisTroop) return;
        const maxVal = Number(it.bonus_value) || 0;
        if (useMax) {
          total += maxVal;
        } else {
          const maxLvl = Number(it.max_level) || 5;
          const perLevel = maxLvl ? maxVal / maxLvl : 0;
          total += perLevel * (Number(it.current_level) || 0);
        }
      });
      return total;
    }
    return null;
  }

  // Speed: the first paint asks for each of the 12 stat lines twice (once for
  // the averages row, once for its card). Reuse those results during that first
  // paint only; after it, every call recomputes fresh (breakdown modal,
  // Hero Gear set switcher, roster changes).
  let statPassMemo = new Map();
  function statFor(troop, stat) {
    const key = `cur|${troop}|${stat}`;
    if (statPassMemo && statPassMemo.has(key)) return statPassMemo.get(key);
    const result = statForFresh(troop, stat);
    if (statPassMemo) statPassMemo.set(key, result);
    return result;
  }
  function maxStatFor(troop, statKey) {
    const key = `max|${troop}|${statKey}`;
    if (statPassMemo && statPassMemo.has(key)) return statPassMemo.get(key);
    const result = maxStatForFresh(troop, statKey);
    if (statPassMemo) statPassMemo.set(key, result);
    return result;
  }
  function statForFresh(troop, stat) {
    const row = rows.find((r) => r.name.toLowerCase() === `${troop} ${stat}`.toLowerCase());
    const bySource = {};
    if (row) {
      for (const c of row.buff_cells) {
        if (c.value == null) continue;
        const src = colById[c.column_id] || "Other";
        if (!ALLOWED_STAT_CATEGORIES.has(src)) continue;
        bySource[src] = (bySource[src] || 0) + Number(c.value);
      }
    }
    const { islandsCur, skinsCur } = liveCurrentFor(troop, stat);
    if ("Islands" in bySource || islandsCur) bySource["Islands"] = islandsCur;
    if ("Skins" in bySource || skinsCur) bySource["Skins"] = skinsCur;
    LIVE_CALC_KEYS.forEach((calcKey) => {
      try {
        const v = liveCalcValue(calcKey, troop, stat, false);
        if (v != null && (calcKey in bySource || v)) bySource[calcKey] = v;
      } catch (err) {
        console.error("liveCalcValue failed for", calcKey, err);
      }
    });
    const sources = sortBySourceOrder(Object.entries(bySource)).slice(0, 3);
    const total = Object.values(bySource).reduce((a, b) => a + b, 0);
    return { total, sources };
  }

  // Maps a stat key (ATT/DEF/DMG/HP) to the raw stat name skins/islands use
  const STAT_KEY_TO_RAW = { ATT: "Attack", DEF: "Defense", DMG: "Lethality", HP: "Health" };
  const SKIN_STAT_SLOTS = [
    ["bonus_type", "bonus_value", "bonus_level1"],
    ["bonus_type2", "bonus_value2", "bonus_level2"],
    ["bonus_type3", "bonus_value3", "bonus_level3"],
    ["bonus_type4", "bonus_value4", "bonus_level4"],
  ];
  // Live max (ignoring owned/level) that Islands + Skin Gallery could grant
  // a given troop+stat, used to replace those two columns' static reference
  // numbers with a real, up-to-date ceiling.
  // Live current (owned only) that Islands + Skin Gallery grant right now,
  // mirroring liveMaxFor but filtered to s.owned so toggling ownership on
  // those pages updates the dashboard immediately.
  function liveCurrentFor(troop, statKey) {
    const rawStat = STAT_KEY_TO_RAW[statKey];
    let islandsCur = 0;
    let skinsCur = 0;
    const NON_SKIN_CATEGORIES = new Set(["Facility", "Alliance Tech"]);
    const currentGlobeNames = new Set(namesForGlobeLevelGlobal(GLOBE_LEVEL_GLOBAL));
    for (const s of allSkins) {
      // Globe-wired skins (Frost Sphere tiers + per-level extras): only the
      // single currently-selected/derived level's items count, even if
      // other tiers were also accidentally left marked owned.
      if (ALL_GLOBE_WIRED_NAMES_GLOBAL.has(s.name) && !currentGlobeNames.has(s.name)) continue;
      const lvl = s.current_level ?? 0;
      const maxLvl = s.max_level ?? 10;
      const isIsland = ISLAND_CATEGORIES.has(s.category);
      const isLeveled = isIsland && (s.max_level != null || s.current_level != null);
      if (!isLeveled && !s.owned) continue;
      SKIN_STAT_SLOTS.forEach(([tk, vk, lk]) => {
        if (s[vk] == null) return;
        const t = s[tk];
        const matches = t === rawStat || t === `${troop} ${rawStat}` || t === `Troops ${rawStat}`;
        if (!matches) return;
        const value = Number(s[vk]);
        const unlockLvl = s[lk];
        // Islands: threshold unlock (full value once current_level reaches
        // the slot's unlock level) or linear scaling by current/max level.
        // Everything else: simple owned = full value, not owned = 0.
        const cur = isLeveled ? (unlockLvl != null ? (lvl >= unlockLvl ? value : 0) : (value * lvl) / (maxLvl || 1)) : value;
        if (isIsland) islandsCur += cur;
        else if (!NON_SKIN_CATEGORIES.has(s.category)) skinsCur += cur;
      });
    }
    return { islandsCur, skinsCur };
  }

  function liveMaxFor(troop, statKey) {
    const rawStat = STAT_KEY_TO_RAW[statKey];
    let islandsMax = 0;
    let skinsMax = 0;
    const NON_SKIN_CATEGORIES = new Set(["Facility", "Alliance Tech"]);
    const currentGlobeNames = new Set(namesForGlobeLevelGlobal(GLOBE_LEVEL_GLOBAL));
    for (const s of allSkins) {
      // Globe-wired skins (Frost Sphere tiers + per-level extras) don't count
      // toward max at all until a globe level is picked, and only the
      // currently selected level's items count afterward - not every tier.
      if (ALL_GLOBE_WIRED_NAMES_GLOBAL.has(s.name) && !currentGlobeNames.has(s.name)) continue;
      if (s.count_in_max === false) continue;
      SKIN_STAT_SLOTS.forEach(([tk, vk]) => {
        if (s[vk] == null) return;
        const t = s[tk];
        // troop-specific label (e.g. "Infantry Attack") only counts for that troop;
        // a plain raw stat ("Attack") buffs all three troop types equally
        const matches = t === rawStat || t === `${troop} ${rawStat}` || t === `Troops ${rawStat}`;
        if (!matches) return;
        const val = Number(s[vk]);
        if (ISLAND_CATEGORIES.has(s.category)) {
          islandsMax += val;
        } else if (!NON_SKIN_CATEGORIES.has(s.category)) {
          skinsMax += val;
        }
      });
    }
    return { islandsMax, skinsMax };
  }

  function maxStatForFresh(troop, statKey) {
    const row = rows.find((r) => r.name.toLowerCase() === `${troop} ${statKey}`.toLowerCase());
    const bySource = {};
    if (row) {
      for (const c of row.buff_cells) {
        if (c.value == null) continue;
        const src = colById[c.column_id] || "Other";
        if (!ALLOWED_STAT_CATEGORIES.has(src)) continue;
        bySource[src] = (bySource[src] || 0) + Number(c.value);
      }
    }
    const { islandsMax, skinsMax } = liveMaxFor(troop, statKey);
    if ("Islands" in bySource || islandsMax) bySource["Islands"] = islandsMax;
    if ("Skins" in bySource || skinsMax) bySource["Skins"] = skinsMax;
    LIVE_CALC_KEYS.forEach((calcKey) => {
      try {
        const v = liveCalcValue(calcKey, troop, statKey, true);
        if (v != null && (calcKey in bySource || v)) bySource[calcKey] = v;
      } catch (err) {
        console.error("liveCalcValue (max) failed for", calcKey, err);
      }
    });
    const total = Object.values(bySource).reduce((a, b) => a + b, 0);
    return total;
  }

  // averages across all 12 stat lines, for the top metric row
  const allStats = [];
  for (const t of TROOP_TYPES) for (const s of STATS) allStats.push({ troop: t.key, stat: s.key, ...statFor(t.key, s.key) });
  DASHBOARD_STATS_LIVE = allStats;
  // The Budgets page only needs the numbers, not the page.
  if (opts.computeOnly) return allStats;
  const avgByStat = STATS.map((s) => {
    const vals = allStats.filter((x) => x.stat === s.key).map((x) => x.total);
    const avg = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    const maxVals = TROOP_TYPES.map((t) => maxStatFor(t.key, s.key));
    const avgMax = maxVals.length ? maxVals.reduce((a, b) => a + b, 0) / maxVals.length : 0;
    return { ...s, avg, avgMax };
  });
  // sum of all 4 stats per troop type, for the Total Infantry/Lancers/Marksman row
  const totalByTroop = TROOP_TYPES.map((t) => {
    const sum = allStats.filter((x) => x.troop === t.key).reduce((a, x) => a + x.total, 0);
    return { ...t, sum };
  });

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>${esc(t("stats_dashboard"))}</h2>
      </div>
    </div>
    ${IS_OWNER ? `<div id="ownerTotalTableWrap" style="margin-top:16px;"></div>` : ""}
    <div id="dashboardRoster" style="margin-top:16px;"></div>
    <div id="troopSections"></div>
    <div class="grid g4" id="metricRow" style="margin-top:16px;"></div>
  `;

  document.getElementById("metricRow").innerHTML = avgByStat
    .map(
      (s) => `<div class="metric"><div class="label">${esc(t("avg_prefix"))} ${esc(tStatLabel(s.label))} ${esc(t("avg_bonus_suffix"))}</div><div class="val">${s.avg.toFixed(0)}%</div><div class="meta" style="font-size:11px; margin-top:2px;">${esc(t("avg_maxed"))}: ${s.avgMax.toFixed(0)}%</div></div>`
    )
    .join("");

  // ---- Owner-only TOTAL breakdown table (CUR/MAX/DIFF per troop+stat line)
  // - hidden entirely from non-owners, and collapsed by default even for the
  // owner since it's a dense reference table rather than something needed on
  // every visit. CUR/MAX/DIFF are each tinted a different color so the eye
  // can scan straight down a column instead of reading every cell.
  if (IS_OWNER) {
    const ownerWrap = document.getElementById("ownerTotalTableWrap");
    const fmtPct = (v) => `${v.toFixed(1)}%`;
    const COL_TINT = { cur: "rgba(224,100,95,0.12)", max: "rgba(91,201,138,0.12)", diff: "rgba(232,162,60,0.14)" };
    const renderOwnerTotalTable = () => {
      const shown = localStorage.getItem("dashboard_owner_total_shown") === "1";
      const totalRows = allStats.map((x) => {
        const max = maxStatFor(x.troop, x.stat);
        const diff = max - x.total;
        return { troop: x.troop, stat: x.stat, cur: x.total, max, diff };
      });
      const avgRow = {
        cur: totalRows.reduce((a, r) => a + r.cur, 0) / totalRows.length,
        max: totalRows.reduce((a, r) => a + r.max, 0) / totalRows.length,
        diff: totalRows.reduce((a, r) => a + r.diff, 0) / totalRows.length,
      };
      ownerWrap.innerHTML = `
        <div class="panel">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:${shown ? "12px" : "0"};">
            <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer;">
              <input type="checkbox" id="ownerTotalToggle" ${shown ? "checked" : ""} style="width:14px; height:14px; cursor:pointer; flex-shrink:0;" />
              <span style="font-weight:600;">${esc(t("total_owner_only"))}</span>
            </label>
          </div>
          ${shown ? `
          <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
              <thead><tr>
                ${["#", "CUR.", "MAX.", "DIFF."]
                  .map((h) => `<th style="text-align:start; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${h}</th>`)
                  .join("")}
              </tr></thead>
              <tbody>
                ${totalRows
                  .map(
                    (r) => `<tr>
                      <td style="padding:5px 8px; font-weight:600;">${esc(troopDisplayName(r.troop))} ${esc(r.stat)}</td>
                      <td style="padding:5px 8px; background:${COL_TINT.cur};">${fmtPct(r.cur)}</td>
                      <td style="padding:5px 8px; background:${COL_TINT.max};">${fmtPct(r.max)}</td>
                      <td style="padding:5px 8px; background:${COL_TINT.diff};">${fmtPct(r.diff)}</td>
                    </tr>`
                  )
                  .join("")}
                <tr style="border-top:1px solid var(--line);">
                  <td style="padding:5px 8px; font-weight:600;">AVERAGE</td>
                  <td style="padding:5px 8px; font-weight:600; background:${COL_TINT.cur};">${fmtPct(avgRow.cur)}</td>
                  <td style="padding:5px 8px; font-weight:600; background:${COL_TINT.max};">${fmtPct(avgRow.max)}</td>
                  <td style="padding:5px 8px; font-weight:600; background:${COL_TINT.diff};">${fmtPct(avgRow.diff)}</td>
                </tr>
              </tbody>
            </table>
          </div>
          ` : ""}
        </div>`;
      document.getElementById("ownerTotalToggle").addEventListener("change", (e) => {
        localStorage.setItem("dashboard_owner_total_shown", e.target.checked ? "1" : "0");
        renderOwnerTotalTable();
      });
    };
    renderOwnerTotalTable();
  }

  // ---- Roster heroes: the 3 heroes affecting Infantry / Lancers / Marksman ----
  const rosterEl = document.getElementById("dashboardRoster");
  if (rosterEl) {
    const heroCatalog = ROSTER_HERO_CATALOG;
    const phByHero = ROSTER_PH_BY_HERO;
    const starStatsByGen = ROSTER_STAR_STATS_BY_GEN;
    const widgetStatsByGen = ROSTER_WIDGET_STATS_BY_GEN;
    const starsOf = rosterStarsOf;
    const saveStars = async (heroId, star, sub) => {
      const value = Number((star + sub / 10).toFixed(1));
      const existing = phByHero[heroId];
      if (existing) {
        await sb(`player_heroes?id=eq.${existing.id}`, { method: "PATCH", body: JSON.stringify({ current_stars: value, updated_at: new Date().toISOString() }) });
        existing.current_stars = value;
      } else {
        const [row] = await sb(`player_heroes`, { method: "POST", body: JSON.stringify({ user_id: USER_ID, hero_id: heroId, current_level: 0, current_stars: value }) });
        phByHero[heroId] = row || { hero_id: heroId, current_stars: value };
      }
    };
    // Six-pointed "snowflake" star split into 6 shard segments, each clickable.
    const segStarSvg = (starIndex, filledSegs) => {
      const c = 16, rOut = 15, rIn = 6;
      const segs = [];
      // Fill order goes counter-clockwise from the top:
      // 1 top, 2 upper-left, 3 lower-left, 4 bottom, 5 lower-right, 6 upper-right.
      const TIP_ANGLES = [-90, -150, 150, 90, 30, -30];
      for (let i = 0; i < 6; i++) {
        const a = TIP_ANGLES[i] * Math.PI / 180;
        const aL = (TIP_ANGLES[i] - 30) * Math.PI / 180;
        const aR = (TIP_ANGLES[i] + 30) * Math.PI / 180;
        const tip = [c + rOut * Math.cos(a), c + rOut * Math.sin(a)];
        const l = [c + rIn * Math.cos(aL), c + rIn * Math.sin(aL)];
        const r = [c + rIn * Math.cos(aR), c + rIn * Math.sin(aR)];
        const filled = i < filledSegs;
        segs.push(`<polygon data-starseg="${starIndex}|${i + 1}" points="${c},${c} ${l[0].toFixed(2)},${l[1].toFixed(2)} ${tip[0].toFixed(2)},${tip[1].toFixed(2)} ${r[0].toFixed(2)},${r[1].toFixed(2)}" fill="${filled ? "#5fd3f2" : "#2a3442"}" stroke="#0b0f16" stroke-width="1.6" stroke-linejoin="round" style="cursor:pointer;"><title>${starIndex}\u2605 \u2014 shard ${i + 1}/6</title></polygon>`);
      }
      segs.push(`<circle cx="${c}" cy="${c}" r="1.6" fill="#0b0f16" pointer-events="none" />`);
      return `<svg viewBox="0 0 32 32" width="32" height="32" style="display:block;">${segs.join("")}</svg>`;
    };
    // Widget (Exclusive Gear) stats scale linearly: max value / 10 per level.
    const widgetStatsText = (hero, level) => {
      if (!hero || !level) return "";
      const table = widgetStatsByGen[hero.generation];
      const row = table && table[level];
      if (!row) return "";
      return pairLabel("LETH", "HP", row.leth_pct, row.hp_pct);
    };
    // Combines two equal-valued stats into one label ("ATK & DEF 12.3%"), or
    // shows both when they differ.
    const pairLabel = (a, b, av, bv) => {
      const fa = Number(av).toFixed(2), fb = Number(bv).toFixed(2);
      return fa === fb ? `${a} & ${b} ${fa}%` : `${a} ${fa}% \u00b7 ${b} ${fb}%`;
    };
    const starStatsText = (hero) => {
      if (!hero) return "";
      const { star, sub } = starsOf(hero.id);
      const step = star * 6 + sub; // 0..30 shard steps
      const table = starStatsByGen[hero.generation];
      const row = table && table[step];
      if (!row) return "";
      return pairLabel("ATK", "DEF", row.atk_pct, row.def_pct);
    };
    const starsHtml = (hero) => {
      if (!hero) return "";
      const { star, sub } = starsOf(hero.id);
      return Array.from({ length: 5 }, (_, i) => i + 1)
        .map((n) => segStarSvg(n, n <= star ? 6 : n === star + 1 ? sub : 0))
        .join("");
    };
    const roster = ROSTER_STATE;
    // Each troop's dropdown only lists heroes of that class.
    const ROSTER_TROOP_CLASS = { Infantry: "Infantry", Lancers: "Lancer", Marksman: "Marksman" };
    const entryFor = rosterEntryFor;
    const renderRoster = () => {
      const collapsed = localStorage.getItem("dashboard_roster_collapsed") === "1";
      const assignedTroops = TROOP_TYPES.filter((t) => entryFor(t.key).heroId);
      const allUsed = assignedTroops.length > 0 && assignedTroops.every((t) => entryFor(t.key).used);
      const pickHeroPlaceholder = t("pick_hero_placeholder");
      const noneLabel = t("none_label");
      const genPrefix = t("gen_prefix");
      const widgetLevelLabel = t("widget_level_label");
      rosterEl.innerHTML = `
      <div class="panel" style="margin-bottom:16px;">
        <div id="rosterCollapseToggle" style="display:flex; align-items:center; justify-content:space-between; cursor:pointer; user-select:none;">
          <h2 style="margin:0;">${esc(t("roster_heroes_title"))}</h2>
          <div style="display:flex; align-items:center; gap:12px;">
            <label style="display:flex; align-items:center; gap:4px; cursor:pointer; flex-shrink:0; flex-wrap:nowrap;" title="Include roster heroes' stats in the Dashboard totals" onclick="event.stopPropagation()">
              <input type="checkbox" id="rosterUsedAll" ${allUsed ? "checked" : ""} style="width:14px; height:14px; cursor:pointer; flex-shrink:0;" />
              <span class="meta" style="font-size:10px; white-space:nowrap;">${esc(t("count_in_dashboard"))}</span>
            </label>
            <span class="meta" style="font-size:16px; transition:transform .15s; transform:rotate(${collapsed ? "-90deg" : "0deg"});">&#9660;</span>
          </div>
        </div>
        <div id="rosterCollapseBody" style="${collapsed ? "display:none;" : ""}">
        <div class="grid g3" id="rosterHeroesGrid" style="gap:16px;">
          ${TROOP_TYPES.map((t) => {
            const { heroId, widget, used } = entryFor(t.key);
            const hero = heroCatalog.find((h) => h.id === heroId);
            return `
            <div class="roster-row" style="display:flex; align-items:center; gap:12px; ${hero && !used ? "opacity:0.55;" : ""}">
              <div data-rosterpick="${esc(t.key)}" class="roster-pick" title="Click to choose hero" style="width:64px; height:64px; border-radius:10px; background:var(--panel-2); overflow:hidden; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer;">
                ${hero && hero.image_url ? `<img src="${esc(hero.image_url)}" alt="" style="width:100%; height:100%; object-fit:cover;" loading="lazy" />` : `<span class="meta" style="font-size:10px; text-align:center;">${pickHeroPlaceholder}</span>`}
              </div>
              <div style="flex:1; min-width:0;">
                <div style="display:flex; align-items:center; gap:8px; flex-wrap:nowrap; margin-bottom:2px;">
                  <span style="font-weight:600; font-size:14px;">${hero ? esc(dataName(hero.name)) : esc(noneLabel)}${hero && hero.generation ? ` <span class="meta" style="font-size:10.5px;">${esc(genPrefix)} ${hero.generation}</span>` : ""}</span>
                </div>
                <div data-starctl="${esc(hero ? hero.id : "")}" style="display:flex; align-items:center; gap:4px; margin-top:4px;">${starsHtml(hero)}</div>
                ${hero ? `<div class="meta" style="font-size:11px; color:var(--frost); margin-top:4px;">${[starStatsText(hero), widgetStatsText(hero, widget)].filter(Boolean).join(" &nbsp;\u00b7&nbsp; ") || "&nbsp;"}</div>` : ""}
                <div style="display:flex; align-items:center; gap:6px; margin-top:6px;">
                  <span class="meta" style="font-size:11px;">${esc(widgetLevelLabel)}</span>
                  <select data-rosterwidget="${esc(t.key)}" style="width:88px;">
                    <option value="0" ${!widget ? "selected" : ""}>${esc(noneLabel)}</option>
                    ${Array.from({ length: 10 }, (_, i) => i + 1).map((i) => `<option value="${i}" ${i === widget ? "selected" : ""}>${i}</option>`).join("")}
                  </select>
                </div>
              </div>
            </div>`;
          }).join("")}
        </div>
        </div>
      </div>`;
      rosterEl.querySelector("#rosterCollapseToggle").addEventListener("click", () => {
        const nowCollapsed = localStorage.getItem("dashboard_roster_collapsed") === "1";
        localStorage.setItem("dashboard_roster_collapsed", nowCollapsed ? "0" : "1");
        renderRoster();
      });
      const save = async () => { await saveCalcState("dashboard_roster", roster); };
      const rosterUsedAllBox = document.getElementById("rosterUsedAll");
      if (rosterUsedAllBox) {
        rosterUsedAllBox.addEventListener("change", async () => {
          TROOP_TYPES.forEach((t) => {
            const cur = entryFor(t.key);
            if (cur.heroId) roster[t.key] = { heroId: cur.heroId, widget: cur.widget, used: rosterUsedAllBox.checked };
          });
          await save();
          // Re-render the whole dashboard so the stat totals/breakdown reflect the change.
          renderOverview();
        });
      }
      rosterEl.querySelectorAll("[data-starctl]").forEach((wrap) => {
        const heroId = wrap.dataset.starctl;
        wrap.querySelectorAll("[data-starseg]").forEach((seg) => {
          seg.addEventListener("click", async () => {
            const [n, j] = seg.dataset.starseg.split("|").map(Number);
            const cur = starsOf(heroId);
            let star = j >= 6 ? n : n - 1, sub = j >= 6 ? 0 : j;
            if (star === cur.star && sub === cur.sub) {
              if (sub > 0) sub -= 1; else if (star > 0) { star -= 1; sub = 5; }
            }
            await saveStars(heroId, star, sub);
            renderRoster();
          });
        });
      });
      // Clicking the portrait opens a picker grid of that class's heroes.
      rosterEl.querySelectorAll("[data-rosterpick]").forEach((box) => {
        box.addEventListener("click", () => {
          const troopKey = box.dataset.rosterpick;
          const cur = entryFor(troopKey);
          const choices = heroCatalog.filter((h) => h.troop_type === ROSTER_TROOP_CLASS[troopKey]);
          let modal = document.getElementById("rosterPickModal");
          if (!modal) {
            modal = document.createElement("div");
            modal.id = "rosterPickModal";
            modal.className = "modal-overlay";
            document.body.appendChild(modal);
            modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
          }
          modal.innerHTML = `
            <div class="modal-box" style="max-width:640px; max-height:80vh; overflow-y:auto;">
              <h2>${esc(t("pick_hero_title"))} ${esc(troopDisplayName(troopKey))} ${esc(t("hero_suffix"))}</h2>
              <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:10px; margin-top:12px;">
                <div data-pickhero="" style="cursor:pointer; text-align:center; border:1px solid ${cur.heroId ? "var(--line)" : "var(--ice)"}; border-radius:10px; padding:6px;">

                ${choices.map((h) => `
                <div data-pickhero="${esc(h.id)}" style="cursor:pointer; text-align:center; border:1px solid ${h.id === cur.heroId ? "var(--ice)" : "var(--line)"}; border-radius:10px; padding:6px;">
                  <div style="width:100%; aspect-ratio:1; border-radius:8px; background:var(--panel-2); overflow:hidden;">
                    ${h.image_url ? `<img src="${esc(h.image_url)}" alt="" style="width:100%; height:100%; object-fit:cover;" loading="lazy" />` : ""}

            </div>`;
          modal.querySelector("#rosterPickClose").addEventListener("click", () => { modal.style.display = "none"; });
          modal.querySelectorAll("[data-pickhero]").forEach((card) => {
            card.addEventListener("click", async () => {
              roster[troopKey] = { heroId: card.dataset.pickhero || "", widget: cur.widget, used: cur.used };
              await save();
              modal.style.display = "none";
              renderRoster();
            });
          });
          modal.style.display = "flex";
        });
      });
      rosterEl.querySelectorAll("select[data-rosterwidget]").forEach((sel) => {
        sel.addEventListener("change", async () => {

          renderRoster();

    renderRoster();
  }

  const sections = document.getElementById("troopSections");
  const statsTrackedLabel = t("stats_tracked");
  const maxPossibleLabel = t("max_possible");
  const clickBreakdownLabel = t("click_full_breakdown");
  sections.innerHTML = TROOP_TYPES.map(
    (t) => `
    <div class="troop-head">
      <div class="dot">${t.icon}</div>
      <h3>${esc(troopDisplayName(t.key))}</h3>
      <div class="count">4 ${esc(statsTrackedLabel)}</div>
    </div>
    <div class="grid g4">
      ${STATS.map((s) => {
        const { total, sources } = statFor(t.key, s.key);
        const maxTotal = maxStatFor(t.key, s.key);
        const pct = maxTotal > 0 ? Math.min(100, Math.round((total / maxTotal) * 100)) : 0;
        const diff = Math.max(0, maxTotal - total);
        return `<div class="stat-card" data-drilldown="${esc(t.key)}|${esc(s.key)}" style="cursor:pointer; position:relative;">
          ${diff > 0 ? `<div style="position:absolute; top:10px; right:12px; font-size:12px; font-weight:600; color:#e0b030; white-space:nowrap;">+${diff.toFixed(1)}%</div>` : ""}
          <div class="label" style="padding-right:${diff > 0 ? "56px" : "0"};"><span class="stat-key">${esc(s.key)} &middot; </span>${esc(tStatLabel(s.label)).toUpperCase()}</div>
          <div class="val">${total.toFixed(1)}%</div>
          <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%"></div></div>
          <div class="metric" style="margin-top:8px; padding:8px 10px;">
            <div class="label" style="font-size:10.5px;">${esc(maxPossibleLabel)}</div>
            <div class="val" style="font-size:16px;">${maxTotal.toFixed(1)}%</div>
          </div>
