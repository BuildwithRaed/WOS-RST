// Real data confirmed for Infantry; Lancer/Marksman not yet
// available from the source wiki (tabbed content, static fetch
// only reaches the Infantry tab) - shown as "coming soon".
// ============================================================
const T11_TROOPS = ["Infantry", "Lancer", "Marksman"];
let T11_NODES_CACHE = null;
let T11_STATE = null;
let T11_TARGET = null; // { troop: { track: targetLevel } } - missing = max
function t11TargetOf(troop, track, maxLvl) {
  const v = T11_TARGET && T11_TARGET[troop] && T11_TARGET[troop][track];
  return typeof v === "number" ? Math.min(maxLvl, Math.max(0, v)) : maxLvl;
}

async function ensureT11StateData() {
  if (!T11_NODES_CACHE) {
    const rows = await sb(`t11_helios_nodes?select=track,troop,level,meat,wood,coal,iron,steel,refined_fc,fc_shard,time_hours,stat,stat_pct&order=troop,sort_order`);
    T11_NODES_CACHE = {};
    rows.forEach((r) => {
      if (!T11_NODES_CACHE[r.troop]) T11_NODES_CACHE[r.troop] = {};
      if (!T11_NODES_CACHE[r.troop][r.track]) T11_NODES_CACHE[r.troop][r.track] = [];
      T11_NODES_CACHE[r.troop][r.track].push(r);
    });
  }
  if (T11_STATE) return;
  const [saved, savedTarget] = await Promise.all([loadCalcState("t11_helios"), loadCalcState("t11_helios_target")]);
  T11_STATE = saved || {};
  T11_TARGET = savedTarget || {};
  T11_TROOPS.forEach((troop) => {
    if (!T11_STATE[troop]) T11_STATE[troop] = {};
    if (!T11_TARGET[troop]) T11_TARGET[troop] = {};
  });
}

// Pure stat computation, reusable by both the T11 page and the Dashboard.
function computeT11Stats(troop, useMax) {
  const tracks = (T11_NODES_CACHE && T11_NODES_CACHE[troop]) || {};
  const stats = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
  Object.entries(tracks).forEach(([track, levels]) => {
    const cur = useMax ? Infinity : ((T11_STATE && T11_STATE[troop] && T11_STATE[troop][track]) || 0);
    levels.forEach((r) => {
      if (r.level > cur || !r.stat) return;
      stats[r.stat] += Number(r.stat_pct) || 0;
    });
  });
  return stats;
}

    Object.entries(tracks).forEach(([track, levels]) => {
      const cur = (T11_STATE[troop][track] || 0);
      const target = t11TargetOf(troop, track, levels.length);
      levels.forEach((r) => {
        if (r.level <= cur || r.level > target) return;
        totals.meat += Number(r.meat) || 0;
        totals.wood += Number(r.wood) || 0;
        totals.coal += Number(r.coal) || 0;
        totals.iron += Number(r.iron) || 0;
        totals.steel += Number(r.steel) || 0;
        totals.refined_fc += Number(r.refined_fc) || 0;

    Object.entries(tracks).forEach(([track, levels]) => {
      const cur = T11_STATE[troop][track] || 0;
      levels.forEach((r) => {
        if (r.level > cur || !r.stat) return;
        stats[r.stat] += Number(r.stat_pct) || 0;
      });
    });
    return stats;
  }

  function computeMaxStats(troop) {
    const tracks = T11_NODES_CACHE[troop] || {};
    const stats = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
    Object.values(tracks).forEach((levels) => {
      levels.forEach((r) => {
        if (!r.stat) return;
        stats[r.stat] += Number(r.stat_pct) || 0;
      });
    });

  }

      if (!T11_NODES_CACHE[troop]) return;
      const t = computeNeeded(troop);
      Object.keys(grand).forEach((k) => (grand[k] += t[k]));
    });
    const matTotals = {
      Steel: Math.round(grand.steel),
      "FC Shard": Math.round(grand.fc_shard),
      Meat: Math.round(grand.meat),
      Wood: Math.round(grand.wood),
      Coal: Math.round(grand.coal),
      Iron: Math.round(grand.iron),
      "Research Speedups (minutes)": Math.round(applyResearchSpeed(grand.time_hours) * 60),
    };

      </div>

          <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">HP</div><div class="val" style="font-size:13px;">+${stats.Health.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${maxStats.Health.toFixed(1)}%</div></div>
        </div>
        <div class="stats-row-scroll" style="margin-bottom:14px;">
          ${t12ResourceCard(T12_RESOURCE_ICONS.steel, t("resource_steel"), Math.round(needed.steel).toLocaleString())}
          ${t12ResourceCard(T12_RESOURCE_ICONS.fc_shard, t("resource_fc_shard"), Math.round(needed.fc_shard).toLocaleString())}
          ${t12ResourceCard(null, t("time_label"), t12FormatTime(applyResearchPct(needed.time_hours)))}
        </div>
        ${Object.keys(tracks)
          .map((track) => {
            const levels = tracks[track];
            const maxLvl = levels.length;
            const cur = T11_STATE[troop][track] || 0;
            const target = t11TargetOf(troop, track, maxLvl);
            const optsFor = (sel) => Array.from({ length: maxLvl + 1 }, (_, i) => `<option value="${i}" ${i === sel ? "selected" : ""}>${i === 0 ? "0" + t("none_suffix") : i}${i === maxLvl ? t("max_suffix") : ""}</option>`).join("");
            return `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap;">
            <div class="meta" style="min-width:0; flex:1 1 120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(dataName(track))}</div>
            <div class="lvl-pair" style="flex:0 1 220px;">
              <label class="lvl-cell"><span class="lvl-cap meta">${esc(t("research_current"))}</span><select data-t11track="${esc(troop)}|${esc(track)}" title="${esc(t("research_current"))}" style="width:100%; min-width:0; padding:5px 8px;">${optsFor(cur)}</select></label>

    })();
    wireTroopSwipe(troopsEl, T11_TROOPS, t11ActiveTroop, (t) => { t11ActiveTroop = t; render(); });

    troopsEl.querySelectorAll("[data-t11track]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const [troop, track] = sel.dataset.t11track.split("|");
        T11_STATE[troop][track] = Number(sel.value);

        renderGrandTotal();
        render();
      });
    });
    troopsEl.querySelectorAll("[data-t11target]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const [troop, track] = sel.dataset.t11target.split("|");
        T11_TARGET[troop] = T11_TARGET[troop] || {};
        T11_TARGET[troop][track] = Number(sel.value);
        await saveCalcState("t11_helios_target", T11_TARGET);
        renderGrandTotal();
        render();
      });
    });
  }

  renderGrandTotal();
  render();
}

// Content hidden from visitors (unreleased experts/pets, ...). The owner

// Visitors never see a hidden card and it never counts in their totals.

// Site-wide settings edited from Admin (site_config table: public read,
// owner write). Loaded once at start; missing keys fall back to defaults.

    rows.forEach((r) => { SITE_CONFIG[r.key] = r.value; });

function siteConfig(key, fallback) { return (SITE_CONFIG && SITE_CONFIG[key] != null) ? SITE_CONFIG[key] : fallback; }
async function saveSiteConfig(key, value) {
  await sb(`site_config`, { method: "POST", prefer: "resolution=merge-duplicates,return=representation", body: JSON.stringify({ key, value, updated_at: new Date().toISOString() }) });
  if (!SITE_CONFIG) SITE_CONFIG = {};

}
// Packs page resource list as configured in Admin -> Pack Resources:
// { custom: [{ name, icon, contents: { "Design Plan": 1, ... } }], hidden: [name], order: [name] }
function packResourceConfig() {
  const c = siteConfig("pack_resources", {}) || {};
  return { custom: Array.isArray(c.custom) ? c.custom.filter((x) => x && x.name) : [], hidden: Array.isArray(c.hidden) ? c.hidden : [], order: Array.isArray(c.order) ? c.order : [], gives: (c.gives && typeof c.gives === "object") ? c.gives : {}, removed: Array.isArray(c.removed) ? c.removed : [] };
}
function packCustomResource(name) {
  const lower = String(name || "").toLowerCase();
  return packResourceConfig().custom.find((x) => String(x.name).toLowerCase() === lower) || null;
}
function isHiddenFromVisitors(kind, name) { return !!(UI_HIDDEN && UI_HIDDEN[`${kind}:${name}`]); }
function hiddenForVisitor(kind, name) { return !IS_OWNER && isHiddenFromVisitors(kind, name); }
async function setHiddenFromVisitors(kind, name, hidden) {
  await sb(`ui_visibility`, { method: "POST", prefer: "resolution=merge-duplicates,return=representation", body: JSON.stringify({ key: `${kind}:${name}`, hidden: !!hidden, label: name, updated_at: new Date().toISOString() }) });
  if (!UI_HIDDEN) UI_HIDDEN = {};
  UI_HIDDEN[`${kind}:${name}`] = !!hidden;
}
// Owner-only button on a card: toggles whether visitors can see it.
function visibilityBtnHtml(kind, name) {
  if (!IS_OWNER) return "";
  const hidden = isHiddenFromVisitors(kind, name);
  return `<button type="button" class="btn ghost small" data-vishide="${esc(kind)}|${esc(name)}" title="${esc(t(hidden ? "vis_hidden_hint" : "vis_visible_hint"))}" style="font-size:10px; padding:2px 6px; ${hidden ? "color:var(--amber); border-color:var(--amber);" : ""}">${esc(t(hidden ? "vis_hidden" : "vis_visible"))}</button>`;
}
function wireVisibilityBtns(rootEl, onChange) {
  rootEl.querySelectorAll("[data-vishide]").forEach((b) => b.addEventListener("click", async () => {
    const [kind, name] = b.dataset.vishide.split("|");
    await setHiddenFromVisitors(kind, name, !isHiddenFromVisitors(kind, name));

}
// The lock/unlock checkmark on cards is owner-only: a visitor's cards are
// always unlocked (except hidden ones), whatever was saved earlier.
function unlockedFor(kind, name, savedFlag) {
  if (hiddenForVisitor(kind, name)) return false;
  if (!IS_OWNER) return true;
  return savedFlag === false ? false : true;
}

  "Kathy Sigils": "icons/item_icon_570010.png",
  "Gareth Sigils": "icons/item_icon_570000.png", // not yet on wiki, using Common Sigil as placeholder
};

const EXPERT_RESEARCH_STAT_LABEL = { ATK: "Attack", DEF: "Defense", DMG: "Lethality", HP: "Health" };
async function renderExpertsResearchPage() {
  await ensureExpertsRosterGlobal();
  const saved = (await loadCalcState("experts_research")) || {};
  // Shared with Experts Level's "Your Inventory" - same sigil pool covers
  // both hero leveling and research paths.
  const invSaved = (await loadCalcState("experts_inventory")) || {};
  const rows = await sb(`expert_research_nodes?select=expert,path_number,path_name,level,stat_type,stat_value,sigil_cost,sigil_per_level,stat_type2,stat_value2&order=sort_order`);
  const RESEARCH_CACHE = {}; // { "Cyrille": { 1: [rows...], 2: [...], 3: [...] } }
  const PATH_NAMES = {}; // { "Cyrille": { 1: "Hunting Skill - Proficient", ... } }
  rows.forEach((r) => {
    if (!RESEARCH_CACHE[r.expert]) RESEARCH_CACHE[r.expert] = {};
    if (!RESEARCH_CACHE[r.expert][r.path_number]) RESEARCH_CACHE[r.expert][r.path_number] = [];
    RESEARCH_CACHE[r.expert][r.path_number].push(r);
    if (r.path_name) {
      if (!PATH_NAMES[r.expert]) PATH_NAMES[r.expert] = {};
      PATH_NAMES[r.expert][r.path_number] = r.path_name;
    }
  });
  const EXPERTS_IN_ORDER = EXPERTS_IN_ORDER_GLOBAL.filter((e) => !hiddenForVisitor("experts", e));
  function pathNumbersFor(expert) {
    return Object.keys(RESEARCH_CACHE[expert] || {})
      .map(Number)
      .sort((a, b) => a - b);
  }

  EXPERTS_IN_ORDER.forEach((expert) => {
    if (!saved[expert]) saved[expert] = {};
    pathNumbersFor(expert).forEach((p) => {
      if (typeof saved[expert][p] !== "object") saved[expert][p] = { current: 0, desired: 0 };
    });
  });

  const unlockedState = (await loadCalcState("experts_research_unlocked")) || {};
  function isResearchUnlocked(expert) {
    return unlockedFor("experts", expert, unlockedState[expert]);
  }

  // Main stat per expert: scales continuously every level (1-200), unlike the
  // rotating stat which only changes at the 10 milestone levels (20,40,...200).
  // Rate confirmed from source data: 0.01% per level per path.
  const EXPERT_MAIN_STAT = EXPERT_MAIN_STAT_GLOBAL_MAP;
  // Gareth's and Justus's main stat only applies to a specific troop type
  // (Lancers / Infantry respectively), unlike every other expert's main
  // stat which applies to all troops.
  const EXPERT_MAIN_STAT_TROOP = EXPERT_MAIN_STAT_TROOP_GLOBAL_MAP;
  // Rate per level so the main stat reaches 54% at level 200 (54/200) for
  // the 9 confirmed experts; Gareth/Justus keep the original 0.01%/level
  // rate until their target max is confirmed too.
  const MAIN_STAT_RATE_DEFAULT = 0.01; // % per level

  // Sigils between two levels. A row with "sigils per level" set charges that
  // for EVERY level in its block (after the previous row's level, up to its
  // own); rows without it keep the old behaviour: one lump at that level.
  function pathSigils(pathRows, fromLevel, toLevel) {
    const rows = pathRows.slice().sort((a, b) => Number(a.level) - Number(b.level));
    let sigil = 0, prev = 0;
    rows.forEach((r) => {
      const lvl = Number(r.level) || 0;
      const per = r.sigil_per_level == null || r.sigil_per_level === "" ? null : Number(r.sigil_per_level);
      if (per != null && !Number.isNaN(per)) {
        const lo = Math.max(prev, fromLevel), hi = Math.min(lvl, toLevel);
        if (hi > lo) sigil += (hi - lo) * per;
      } else if (lvl > fromLevel && lvl <= toLevel) {
        sigil += Number(r.sigil_cost) || 0;
      }
      prev = lvl;
    });
    return sigil;
  }
  // What the NEXT level after `level` costs on this path (for the card line).
  function pathNextLevelSigils(pathRows, level) {
    if (level >= 200) return null;
    const rows = pathRows.slice().sort((a, b) => Number(a.level) - Number(b.level));
    const r = rows.find((x) => Number(x.level) > level);
    if (!r) return null;
    const per = r.sigil_per_level == null || r.sigil_per_level === "" ? null : Number(r.sigil_per_level);
    if (per != null && !Number.isNaN(per)) return per;
    // Per-level rows (1, 2, 3 …): the very next row is the next level's cost.
    if (Number(r.level) === level + 1) return Number(r.sigil_cost) || 0;
    return null;
  }
  function pathCost(expert, pathNum, fromLevel, toLevel) {
    const pathRows = (RESEARCH_CACHE[expert] || {})[pathNum] || [];
    let sigil = pathSigils(pathRows, fromLevel, toLevel);
    const stats = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
    pathRows.forEach((r) => {
      if (r.level > fromLevel && r.level <= toLevel) {
        if (stats[r.stat_type] != null) stats[r.stat_type] += Number(r.stat_value) || 0;
      }
    });
    // Main stat accumulates continuously per level, independent of milestone rows.
    // Gareth/Justus use a different rate per page: 0.3%/level on page 1
    // (paths 1-3, max 60% at level 200), 0.5%/level on page 2 (paths 4-6,
    // max 100% at level 200).
    const mainStat = EXPERT_MAIN_STAT[expert];
    if (mainStat && stats[mainStat] != null) {
      const clampedFrom = Math.max(0, Math.min(200, fromLevel));
      const clampedTo = Math.max(0, Math.min(200, toLevel));
      const levelsCrossed = Math.max(0, clampedTo - clampedFrom);
      let rate = MAIN_STAT_RATE_DEFAULT;
      if (expert === "Gareth") {
        rate = pathNum <= 3 ? 0.03 : 0.05; // 6% max page 1, 10% max page 2
      } else if (expert === "Justus") {
        rate = pathNum <= 3 ? 0.03 : 0.05; // 6% max page 1, 10% max page 2 (48% total)
      }
      stats[mainStat] += levelsCrossed * rate;
    }
    return { sigil, stats };
  }
  // Rotation stat only (excludes the main stat), for the per-path breakdown display
  function pathRotationOnly(expert, pathNum, fromLevel, toLevel) {
    const pathRows = (RESEARCH_CACHE[expert] || {})[pathNum] || [];
    const sigil = pathSigils(pathRows, fromLevel, toLevel);
    const stats = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
    pathRows.forEach((r) => {
      if (r.level > fromLevel && r.level <= toLevel) {
        if (stats[r.stat_type] != null) stats[r.stat_type] += Number(r.stat_value) || 0;
      }
    });
    return { sigil, stats };
  }

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>${esc(t("experts_research_title"))}</h2>
              </div>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>${esc(t("troops_stats_title"))}</h2>
      <p class="desc">${esc(t("experts_research_desc"))}</p>
      <div class="stats-row-scroll" id="expResearchTotals"></div>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <div id="expResearchTroopDots" style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:10px;"></div>
      <h2 style="display:flex; align-items:baseline; gap:6px;"><span id="expResearchTroopTitle"></span><span class="meta" id="expResearchTroopExpert" style="font-size:11px; font-weight:400;"></span></h2>
      <div class="stats-row-scroll" id="expResearchTroopStats" style="margin-top:10px;"></div>
    </div>
    <div id="expResearchSwipeCounter" style="text-align:center; margin-bottom:10px;"></div>
    <div id="expResearchGrid"></div>
    <div class="panel" style="margin-top:16px;">
      <h2>${esc(t("total_sigils_needed"))}</h2>
      <p class="desc">${esc(t("across_unlocked_experts_desc"))}</p>
      <div class="stats-row-scroll" id="expResearchSigils"></div>
      <div id="expResearchPacks"></div>
    </div>
  `;

  const sigilsEl = document.getElementById("expResearchSigils");
  const totalsEl = document.getElementById("expResearchTotals");
  const TROOP_STAT_COLORS = { Infantry: "#7ee6a8", Lancer: "var(--ice)", Marksman: "#f0a3c4" };
  const TROOP_STAT_ORDER = ["Infantry", "Lancer", "Marksman"];
  const TROOP_STAT_EXPERT = {
    Infantry: "Justus",
    Lancer: "Gareth",
    Marksman: null,
  };
  let expResearchActiveTroop = TROOP_STAT_ORDER[0];
  const troopDotsEl = document.getElementById("expResearchTroopDots");
  const troopTitleEl = document.getElementById("expResearchTroopTitle");
  const troopExpertEl = document.getElementById("expResearchTroopExpert");
  const troopStatsEl = document.getElementById("expResearchTroopStats");
  function computeStatTotals(includeExperts) {
    const totals = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
    const maxTotals = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
    EXPERTS_IN_ORDER.forEach((expert) => {
      if (!includeExperts.has(expert)) return;
      if (!isResearchUnlocked(expert)) return;
      pathNumbersFor(expert).forEach((p) => {
        const st = saved[expert][p];
        const { stats } = pathCost(expert, p, 0, st.current);
        Object.keys(stats).forEach((k) => (totals[k] += stats[k]));
        const { stats: mStats } = pathCost(expert, p, 0, 200);
        Object.keys(mStats).forEach((k) => (maxTotals[k] += mStats[k]));
      });
    });
    return { totals, maxTotals };
  }
  // Two decimals: the main stat moves 0.01% per level, which one decimal hides.
  function statTotalsHtml(totals, maxTotals) {
    return `
      <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">ATK</div><div class="val" style="font-size:13px;">+${totals.ATK.toFixed(2)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${maxTotals.ATK.toFixed(2)}%</div></div>
      <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">DEF</div><div class="val" style="font-size:13px;">+${totals.DEF.toFixed(2)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${maxTotals.DEF.toFixed(2)}%</div></div>
      <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">LETH</div><div class="val" style="font-size:13px;">+${totals.DMG.toFixed(2)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${maxTotals.DMG.toFixed(2)}%</div></div>
      <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">HP</div><div class="val" style="font-size:13px;">+${totals.HP.toFixed(2)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${maxTotals.HP.toFixed(2)}%</div></div>
    `;
  }
  const GENERAL_EXPERTS = new Set(EXPERTS_IN_ORDER.filter((e) => e !== "Gareth" && e !== "Justus"));
  function renderTotals() {
    let totalSigil = 0;
    let maxSigil = 0;
    const sigilNeededByExpert = {};
    EXPERTS_IN_ORDER.forEach((expert) => {
      if (!isResearchUnlocked(expert)) return;
      let expertSigil = 0;
      pathNumbersFor(expert).forEach((p) => {
        const st = saved[expert][p];
        const { sigil } = pathCost(expert, p, st.current, st.desired);
        totalSigil += sigil;
        expertSigil += sigil;
        const { sigil: mSigil } = pathCost(expert, p, 0, 200);
        maxSigil += mSigil;
      });
      sigilNeededByExpert[expert] = expertSigil;
    });

    // Offset against Your Inventory (Experts Level page, same shared pool):
    // each expert's own sigils apply first, General Sigils cover the rest.
    let sigilShortfall = 0;
    EXPERTS_IN_ORDER.forEach((expert) => {
      const owned = Number(invSaved[`${expert} Sigils`]) || 0;
      sigilShortfall += Math.max(0, (sigilNeededByExpert[expert] || 0) - owned);
    });
    const stillSigil = Math.max(0, sigilShortfall - (Number(invSaved["General Sigils"]) || 0));

    sigilsEl.innerHTML = `
      <div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">${esc(t("total_sigils"))}</div><div class="val" style="font-size:13px;">${Math.round(totalSigil).toLocaleString()}</div><div class="meta" style="font-size:8.5px; margin-top:2px; color:${stillSigil > 0 ? "#e0a030" : "var(--good)"};">${stillSigil > 0 ? Math.round(stillSigil).toLocaleString() + " " + t("needed_suffix") : t("have_enough")}</div></div>
    `;
    const packGroups = [{ label: null, totals: { "General Sigils": sigilShortfall } }];
    const packOwned = { "General Sigils": Number(invSaved["General Sigils"]) || 0 };
    renderPackCostBlock(document.getElementById("expResearchPacks"), "experts_research", packGroups, packOwned);
    recordBudgetNeeds("experts_research", packGroups);

    // General stat totals: everyone except Gareth/Justus (troop-restricted)
    const general = computeStatTotals(GENERAL_EXPERTS);
    totalsEl.innerHTML = statTotalsHtml(general.totals, general.maxTotals);

    // Infantry: general + Justus's Health; Lancer: general + Gareth's Lethality; Marksman: general only
    const troopData = {
      Infantry: computeStatTotals(new Set([...GENERAL_EXPERTS, "Justus"])),
      Lancer: computeStatTotals(new Set([...GENERAL_EXPERTS, "Gareth"])),
      Marksman: { totals: { ATK: 0, DEF: 0, DMG: 0, HP: 0 }, maxTotals: { ATK: 0, DEF: 0, DMG: 0, HP: 0 } },
    };
    function renderActiveTroopStats() {
      renderSwipeDots(troopDotsEl, TROOP_STAT_ORDER, expResearchActiveTroop, TROOP_STAT_COLORS, (tr) => {
        expResearchActiveTroop = tr;
        renderActiveTroopStats();
      });
      troopTitleEl.textContent = troopDisplayName(expResearchActiveTroop);
      troopTitleEl.style.color = TROOP_STAT_COLORS[expResearchActiveTroop];
      troopExpertEl.textContent = TROOP_STAT_EXPERT[expResearchActiveTroop] ? `(${TROOP_STAT_EXPERT[expResearchActiveTroop]})` : "";
      const d = troopData[expResearchActiveTroop];
      troopStatsEl.innerHTML = statTotalsHtml(d.totals, d.maxTotals);
      wireTroopSwipe(troopStatsEl.closest(".panel"), TROOP_STAT_ORDER, expResearchActiveTroop, (t) => {
        expResearchActiveTroop = t;
        renderActiveTroopStats();
      });
    }
    renderActiveTroopStats();
  }

  const gridEl = document.getElementById("expResearchGrid");
  function pathLevelOpts(expert, pathNum, selected) {
    const opts = [];
    for (let n = 0; n <= 200; n++) {
      opts.push(`<option value="${n}" ${n === selected ? "selected" : ""}>${n}</option>`);
    }
    return opts.join("");
  }

  const EXPERT_RESEARCH_IMG = Object.fromEntries(EXPERTS_LIST.map((e) => [e.key, e.img]));
  function mainStatCurrentTotal(expert) {
    const mainStat = EXPERT_MAIN_STAT[expert];
    if (!mainStat) return 0;
    let total = 0;
    pathNumbersFor(expert).forEach((p) => {
      const st = saved[expert][p];
      const levels = Math.max(0, Math.min(200, st.current));
      let rate = MAIN_STAT_RATE_DEFAULT;
      if (expert === "Gareth" || expert === "Justus") {
        rate = p <= 3 ? 0.03 : 0.05;
      }
      total += levels * rate;
    });
    return total;
  }
  function expertCardHtml(expert, page) {
    const pathNums = pathNumbersFor(expert);
    const pages = [];
    for (let i = 0; i < pathNums.length; i += 3) pages.push(pathNums.slice(i, i + 3));
    const safePage = Math.min(page || 0, pages.length - 1);
    const pageEntries = pages[safePage] || [];
    const unlocked = isResearchUnlocked(expert);
    const img = EXPERT_RESEARCH_IMG[expert];
    const mainStatLabel = tStatLabel(EXPERT_RESEARCH_STAT_LABEL[EXPERT_MAIN_STAT[expert]]);
    const mainStatTotal = mainStatCurrentTotal(expert);
    return `
      <div class="panel" style="${unlocked ? "" : "opacity:0.5;"} text-align:center;">
        <div style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-bottom:4px;">
          ${IS_OWNER ? `<input type="checkbox" data-expresearchunlock="${esc(expert)}" ${unlocked ? "checked" : ""} style="width:16px; height:16px; cursor:pointer; justify-self:start;" />` : "<span></span>"}
          <div style="min-width:0; text-align:center;">
            ${img ? `<img src="${esc(img)}" alt="${esc(dataName(expert))}" style="width:52px; height:52px; border-radius:8px; object-fit:cover; margin-bottom:4px;" loading="lazy" />` : ""}
            <div class="name" style="font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(dataName(expert))}</div>
            ${expertBadgeHtml(expert)}
            <div class="meta" style="font-size:10px; color:var(--frost);">${mainStatLabel} +${mainStatTotal.toFixed(2)}%</div>
            ${EXPERT_MAIN_STAT_TROOP[expert] ? `<div class="meta" style="font-size:9px; color:var(--muted);">${esc(troopDisplayName(EXPERT_MAIN_STAT_TROOP[expert]))} ${esc(t("only_suffix"))}</div>` : ""}
            ${IS_OWNER ? `<div style="margin-top:4px;">${visibilityBtnHtml("experts", expert)}</div>` : ""}
          </div>
          <button class="btn ghost small" data-expresearchmax="${esc(expert)}" style="justify-self:end;">${esc(t("max_button"))}</button>
        </div>
        ${
          EXPERT_MAIN_STAT_TROOP[expert]
            ? `<div class="meta" style="font-size:10px; margin-bottom:8px; color:var(--frost);">${esc(t("max_page_note"))}</div>`
            : ""
        }
        ${
          pages.length > 1
            ? `<div id="expResearchPageDots" style="margin-bottom:8px;"></div>`
            : ""
        }
        <div style="text-align:start;" id="expResearchPathsList">
        ${pageEntries
          .map((p, idx) => {
            const st = saved[expert][p];
            const pathName = (PATH_NAMES[expert] || {})[p] || `${t("path_label")} ${p}`;
            const { sigil, stats } = pathRotationOnly(expert, p, st.current, st.desired);
            const perLevel = pathNextLevelSigils((RESEARCH_CACHE[expert] || {})[p] || [], st.current);
            const statParts = Object.entries(stats)
              .filter(([, v]) => v > 0)
              .map(([k, v]) => `+${v.toFixed(1)}% ${tStatLabel(EXPERT_RESEARCH_STAT_LABEL[k])}`)
              .join(", ");
            return `
          <div style="padding:8px 0; ${idx < pageEntries.length - 1 ? "border-bottom:1px solid var(--line);" : ""}">
            <div class="meta" style="font-size:12px; margin-bottom:4px;">${esc(dataName(pathName))}</div>
            <div style="display:flex; gap:6px; margin-bottom:4px;">
              <div style="flex:1;">
                <div class="meta" style="font-size:10px;">${esc(t("current_label"))}</div>
                <select data-expresearchcur="${esc(expert)}|${p}" style="width:100%;">${pathLevelOpts(expert, p, st.current)}</select>
              </div>
              <div style="flex:1;">
                <div class="meta" style="font-size:10px;">${esc(t("target_label"))}</div>
                <select data-expresearchdes="${esc(expert)}|${p}" style="width:100%;">${pathLevelOpts(expert, p, st.desired)}</select>
              </div>
            </div>
            <div class="meta" style="font-size:10px; text-align:end; color:var(--ice);">${Math.round(sigil).toLocaleString()} ${esc(t("resource_sigils"))}${statParts ? " \u00b7 " + statParts : ""}</div>
            ${perLevel != null ? `<div class="meta" style="font-size:10px; text-align:end;">${esc(t("research_next_level"))} ${Math.round(perLevel).toLocaleString()} ${esc(t("resource_sigils"))}</div>` : ""}
          </div>`;
          })
          .join("")}
        </div>
      </div>`;
  }

  const expResearchCounterEl = document.getElementById("expResearchSwipeCounter");
  let activeResearchIdx = 0;
  let activeResearchPage = 0;
  function renderGrid() {
    renderSwipeCounter(expResearchCounterEl, EXPERTS_IN_ORDER.length, activeResearchIdx, (next) => {
      activeResearchIdx = next;
      activeResearchPage = 0;
      renderGrid();
    });
    const expert = EXPERTS_IN_ORDER[activeResearchIdx];
    gridEl.innerHTML = expertCardHtml(expert, activeResearchPage);
    wireIndexSwipe(gridEl, EXPERTS_IN_ORDER.length, activeResearchIdx, (next) => {
      activeResearchIdx = next;
      activeResearchPage = 0;
      renderGrid();
    });

    // Inner swipe for path pages (1, 2, ...) within the same expert - scoped
    // to just the paths list so it doesn't also trigger the outer
    // expert-to-expert swipe above. stopPropagation prevents both firing
    // from the same gesture.
    const pathsListEl = document.getElementById("expResearchPathsList");
    if (pathsListEl) {
      const pathNums = pathNumbersFor(expert);
      const pageCount = Math.ceil(pathNums.length / 3);
      // Page dots for this expert's paths, tappable/clickable like the rest.
      const pageDotsEl = document.getElementById("expResearchPageDots");
      if (pageDotsEl && pageCount > 1) {
        const pageList = Array.from({ length: pageCount }, (_, i) => i);
        renderSwipeDots(pageDotsEl, pageList, Math.min(activeResearchPage, pageCount - 1), null, (pg) => {
          activeResearchPage = pg;
          renderGrid();
        });
      }
      wireSwipeGesture(pathsListEl, (dir) => {
        const next = activeResearchPage + dir;
        if (next >= 0 && next < pageCount) {
          activeResearchPage = next;
          renderGrid();
        }
      }, { stopPropagation: true });
    }

    const container = gridEl;
    {
      wireVisibilityBtns(container, () => { renderTotals(); renderGrid(); });
      container.querySelectorAll("input[data-expresearchunlock]").forEach((cb) => {
        cb.addEventListener("change", async () => {
          const expert = cb.dataset.expresearchunlock;
          unlockedState[expert] = cb.checked;
          await saveCalcState("experts_research_unlocked", unlockedState);
          renderTotals();
          renderGrid();
        });
      });
      container.querySelectorAll("[data-expresearchmax]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const expert = btn.dataset.expresearchmax;
          const paths = pathNumbersFor(expert);
          const bothMaxed = paths.every((p) => saved[expert][p].current >= 200 && saved[expert][p].desired >= 200);
          const currentZeroTargetMaxed = paths.every((p) => saved[expert][p].current <= 0 && saved[expert][p].desired >= 200);
          const bothZero = paths.every((p) => saved[expert][p].current <= 0 && saved[expert][p].desired <= 0);
          // Cycle: (0,0) -> (200,200) -> (0,200) -> (0,0) -> ...
          let nextCurrent, nextTarget;
          if (bothZero) {
            nextCurrent = 200;
            nextTarget = 200;
          } else if (bothMaxed) {
            nextCurrent = 0;
            nextTarget = 200;
          } else if (currentZeroTargetMaxed) {
            nextCurrent = 0;
            nextTarget = 0;
          } else {
            // mixed/partial state: snap to fully maxed first
            nextCurrent = 200;
            nextTarget = 200;
          }
          paths.forEach((p) => {
            saved[expert][p].current = nextCurrent;
            saved[expert][p].desired = nextTarget;
          });
          await saveCalcState("experts_research", saved);
          renderTotals();
          renderGrid();
        });
      });
      container.querySelectorAll("select[data-expresearchcur]").forEach((sel) => {
        sel.addEventListener("change", async () => {
          const [expert, p] = sel.dataset.expresearchcur.split("|");
          const newCurrent = Number(sel.value);
          saved[expert][p].current = newCurrent;
          if (newCurrent > 0 && saved[expert][p].desired <= 0) {
            saved[expert][p].desired = newCurrent;
          }
          await saveCalcState("experts_research", saved);
          renderTotals();
          renderGrid();
        });
      });
      container.querySelectorAll("select[data-expresearchdes]").forEach((sel) => {
        sel.addEventListener("change", async () => {
          const [expert, p] = sel.dataset.expresearchdes.split("|");
          saved[expert][p].desired = Number(sel.value);
          await saveCalcState("experts_research", saved);
          renderTotals();
          renderGrid();
        });
      });
    }
  }

  renderTotals();
  renderGrid();
}

async function renderExpertsPage() {
  // Experts hidden from visitors (Admin → Visibility / the eye on a card)
  // stay out of everything on this page for them: cards, totals, backpack.
  await ensureExpertsRosterGlobal();
  await ensureUiVisibility();
  const EXPERTS_SHOWN = EXPERTS_LIST.filter((e) => !hiddenForVisitor("experts", e.key));
  const saved = (await loadCalcState("experts")) || {};
  const unlockedState = (await loadCalcState("experts_unlocked")) || {};
  function isExpertUnlocked(expert) {
    return unlockedFor("experts", expert, unlockedState[expert]);
  }
  const invSaved = (await loadCalcState("experts_inventory")) || {};
  const skillRows = await sb(`expert_skill_nodes?select=expert,skill,level,exp_cost,book_cost,stat_type,stat_value&order=sort_order`);
  const affinityRows = await sb(`expert_affinity_nodes?select=expert,level,affinity_cost,sigil_cost,stat_type,stat_value,stat_type2,stat_value2&order=sort_order`);
  const SKILL_CACHE = {}; // { "Cyrille|Entrapment": [ {level,exp_cost,book_cost}, ... ] }
  skillRows.forEach((r) => {
    const key = `${r.expert}|${r.skill}`;
    if (!SKILL_CACHE[key]) SKILL_CACHE[key] = [];
    SKILL_CACHE[key].push(r);
  });
  const AFFINITY_CACHE = {}; // { "Cyrille": [ {level,affinity_cost,sigil_cost}, ... ] }
  affinityRows.forEach((r) => {
    if (!AFFINITY_CACHE[r.expert]) AFFINITY_CACHE[r.expert] = [];
    AFFINITY_CACHE[r.expert].push(r);
  });
  function skillMaxLevel(hero, skill) {
    const rows = SKILL_CACHE[`${hero}|${skill}`];
    return rows ? rows.length : EXPERT_SKILL_MAX_LEVEL;
  }
  function skillCost(hero, skill, fromLevel, toLevel) {
    const rows = SKILL_CACHE[`${hero}|${skill}`];
    if (!rows) return { exp: 0, book: 0 };
    let exp = 0, book = 0;
    rows.forEach((r) => {
      if (r.level > fromLevel && r.level <= toLevel) {
        exp += Number(r.exp_cost) || 0;
        book += Number(r.book_cost) || 0;
      }
    });
    return { exp, book };
  }
  // EXP already banked on that skill (the in-game progress bar) counts
  // toward the next level, so it comes straight off what's still needed.
  function skillExpHave(st) {
    return Math.max(0, Number(st && st.expHave) || 0);
  }
  function skillNeed(hero, skill, st) {
    const { exp, book } = skillCost(hero, skill, st.current, st.desired);
    const have = st.current < st.desired ? Math.min(skillExpHave(st), exp) : 0;
    return { exp, book, have, expNeed: Math.max(0, exp - have) };
  }
  function heroCost(hero, fromLevel, toLevel) {
    const rows = AFFINITY_CACHE[hero];
    if (!rows) return { affinity: 0, sigil: 0 };
    let affinity = 0, sigil = 0;
    rows.forEach((r) => {
      if (r.level > fromLevel && r.level <= toLevel) {
        affinity += Number(r.affinity_cost) || 0;
        sigil += Number(r.sigil_cost) || 0;
      }
    });
    return { affinity, sigil };
  }

  EXPERTS_SHOWN.forEach((e) => {
    // New expert: target defaults to the top of its affinity data, so a
    // table that only holds the max (one row at 100) still shows its cost.
    if (!saved[e.key]) saved[e.key] = { current: 0, desired: Math.max(1, ...(AFFINITY_CACHE[e.key] || []).map((r) => Number(r.level) || 0)), skills: {} };
    e.skills.forEach((s) => {
      const max = skillMaxLevel(e.key, s);
      if (!saved[e.key].skills[s]) saved[e.key].skills[s] = { current: 0, desired: max };
    });
  });

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>${esc(t("expertspage_title"))}</h2>
      </div>
    </div>
    <div class="rs-row" style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:14px;">
      <span class="meta" style="font-size:10px;">${esc(t("speedups_label"))}</span>
      <input type="text" inputmode="decimal" id="expertsGeneralSpeedupInput" class="keep-w" value="${Number(invSaved[GENERAL_SPEEDUP_KEY]) || 0}" style="width:66px; flex-shrink:0; padding:4px 6px;" />
      <span class="meta" style="font-size:10px;">${esc(t("minutes_short"))}</span>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>${esc(t("troops_stats_title"))}</h2>
      <p class="desc">${esc(t("experts_base_stats_desc"))}</p>
      <div class="stats-row-scroll" id="expertsStatHeader"></div>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>${esc(t("backpack_title"))}</h2>
      <div class="stats-row-scroll" id="expertsInventory"></div>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>${esc(t("resources_needed_title"))}</h2>
      <div class="stats-row-scroll sr-2col" id="expertsTotals"></div>
      <div id="expertsPacks"></div>
    </div>
    <div id="expertsSwipeCounter" style="text-align:center; margin-bottom:10px;"></div>
    <div id="expertsGrid"></div>
    <div class="grid g2" style="margin-bottom:16px; gap:16px; margin-top:16px;">
      <div class="panel">
        <h2>${esc(t("foundry_title"))}</h2>
        <p class="desc">${esc(t("foundry_desc"))}</p>
        <div class="stats-row-scroll sr-4" id="expertsFoundryHeader"></div>
      </div>
      <div class="panel">
        <h2>${esc(t("svs_title"))}</h2>
        <p class="desc">${esc(t("svs_desc"))}</p>
        <div class="stats-row-scroll sr-4" id="expertsSvsHeader"></div>
      </div>
    </div>
    <div class="grid g2" style="gap:16px;">
      <div class="panel">
        <h2>${esc(t("frostfire_mine_title"))}</h2>
        <p class="desc">${esc(t("frostfire_mine_desc"))}</p>
        <div class="stats-row-scroll sr-4" id="expertsFrostfireHeader"></div>
      </div>
      <div class="panel">
        <h2>${esc(t("tundra_trade_routes_title"))}</h2>
        <p class="desc">${esc(t("tundra_trade_routes_desc"))}</p>
        <div class="stats-row-scroll sr-4" id="expertsTundraHeader"></div>
      </div>
    </div>
  `;

  const statHeaderEl = document.getElementById("expertsStatHeader");
  const TROOP_STAT_HEROES = new Set(["Romulus", "Gareth"]);
  function addLevelBaseToTotals(totals, hero, includeTalent) {
    const rows = AFFINITY_CACHE[hero] || [];
    const lvl = saved[hero] ? saved[hero].current : 0;
    const row = rows.find((r) => r.level === lvl);
    if (!row) return;
    if (row.stat_type) {
      row.stat_type.split(",").forEach((statName) => {
        if (totals[statName] != null) totals[statName] += Number(row.stat_value) || 0;
      });
    }
    if (includeTalent && row.stat_type2) {
      row.stat_type2.split(",").forEach((statName) => {
        if (totals[statName] != null) totals[statName] += Number(row.stat_value2) || 0;
      });
    }
  }
  function computeBaseTroopStats() {
    const totals = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
    // All 10 experts' level-based base stats, confirmed exact from uploaded Experts_Data.xlsx
    const ALL_EXPERTS_LEVEL_BASE = EXPERTS_SHOWN.map((e) => e.key);
    ALL_EXPERTS_LEVEL_BASE.forEach((hero) => addLevelBaseToTotals(totals, hero));
    // Romulus's Last Line + Spirit of Aeetis, Gareth's Porcupine + Undefeated Will
    addSkillStatsToTotals(totals, "Romulus", "Last Line");
    addSkillStatsToTotals(totals, "Romulus", "Spirit of Aeetis");
    addSkillStatsToTotals(totals, "Gareth", "Porcupine");
    addSkillStatsToTotals(totals, "Gareth", "Undefeated Will");
    return totals;
  }
  function computeBaseTroopStatsMax() {
    const totals = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
    ["Cyrille", "Agnes", "Holger", "Romulus", "Baldur", "Fabian", "Valeria", "Ronne", "Kathy", "Gareth"].forEach((hero) => {
      const rows = AFFINITY_CACHE[hero] || [];
      if (!rows.length) return;
      // Use the true peak value across all levels, not just the last row -
      // some experts' curves dip at level 100 due to a relationship-tier
      // reset, so the last row isn't always the highest one.
      const peak = rows.reduce((best, r) => (Number(r.stat_value) > Number(best.stat_value) ? r : best), rows[0]);
      if (peak.stat_type) {
        peak.stat_type.split(",").forEach((statName) => {
          if (totals[statName] != null) totals[statName] += Number(peak.stat_value) || 0;
        });
      }
    });
    // Romulus's + Gareth's confirmed skills, at their own max levels
    addSkillMaxToTotals(totals, "Romulus", "Last Line");
    addSkillMaxToTotals(totals, "Romulus", "Spirit of Aeetis");
    addSkillMaxToTotals(totals, "Gareth", "Porcupine");
    addSkillMaxToTotals(totals, "Gareth", "Undefeated Will");
    return totals;
  }
  function statHeaderHtml(totals, maxTotals) {
    const rows = [
      ["ATK", "Attack"],
      ["DEF", "Defense"],
      ["LETH", "Lethality"],
      ["HP", "Health"],
    ];
    return rows
      .map(
        ([label, key]) =>
          `<div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">${label}</div><div class="val" style="font-size:13px;">+${totals[key].toFixed(1)}%</div>${

          }</div>`

      .join("");

  function addSkillStatsToTotals(totals, hero, skill) {
    const rows = SKILL_CACHE[`${hero}|${skill}`];
    const st = saved[hero] && saved[hero].skills[skill];
    if (!rows || !st) return;
    // rows are cumulative per level; find the row at (or below) the current level
    let match = null;
    rows.forEach((r) => {
      if (r.level <= st.current) match = r;
    });
    if (!match || !match.stat_type) return;
    match.stat_type.split(",").forEach((statName) => {
      if (totals[statName] != null) totals[statName] += Number(match.stat_value) || 0;
    });
  }
  function addSkillMaxToTotals(totals, hero, skill) {
    const rows = SKILL_CACHE[`${hero}|${skill}`];

    const last = rows[rows.length - 1];
    if (!last.stat_type) return;
    last.stat_type.split(",").forEach((statName) => {
      if (totals[statName] != null) totals[statName] += Number(last.stat_value) || 0;
    });
  }

  const foundryEl = document.getElementById("expertsFoundryHeader");

      });

  function renderFoundryHeader() {

  const svsEl = document.getElementById("expertsSvsHeader");

  const frostfireEl = document.getElementById("expertsFrostfireHeader");

  const totalsEl = document.getElementById("expertsTotals");
  function renderTotals() {
    let totalExp = 0, totalBook = 0, totalAffinity = 0, totalSigil = 0;
    let maxExp = 0, maxBook = 0, maxAffinity = 0, maxSigil = 0;
    const sigilNeededByExpert = {};
    EXPERTS_SHOWN.forEach((e) => {
      if (!isExpertUnlocked(e.key)) return;
      e.skills.forEach((sk) => {
        const st = saved[e.key].skills[sk];
        const { expNeed, book } = skillNeed(e.key, sk, st);
        totalExp += expNeed;
        totalBook += book;
        const skillMax = skillMaxLevel(e.key, sk);
        const { exp: mExp, book: mBook } = skillCost(e.key, sk, 0, skillMax);
        maxExp += mExp;
        maxBook += mBook;
      });
      const hs = saved[e.key];
      const { affinity, sigil } = heroCost(e.key, hs.current, hs.desired);
      totalAffinity += affinity;
      totalSigil += sigil;
      sigilNeededByExpert[e.key] = sigil;
      const heroMaxLvl = (AFFINITY_CACHE[e.key] || []).length || EXPERT_HERO_MAX_LEVEL;
      const { affinity: mAff, sigil: mSig } = heroCost(e.key, 0, heroMaxLvl);
      maxAffinity += mAff;
      maxSigil += mSig;
    });

    // Offset against Your Inventory: Books/Affinity subtract directly;
    // Sigils use each expert's own sigils first, General Sigils cover the rest;
    // Time subtracts owned Speedup minutes.
    const stillBook = Math.max(0, totalBook - (Number(invSaved["Books of Knowledge"]) || 0));
    const stillAffinity = Math.max(0, totalAffinity - affinityOwnedFrom(invSaved));
    let sigilShortfall = 0;
    EXPERTS_SHOWN.forEach((e) => {
      const owned = Number(invSaved[`${e.key} Sigils`]) || 0;
      sigilShortfall += Math.max(0, (sigilNeededByExpert[e.key] || 0) - owned);
    });
    const stillSigil = Math.max(0, sigilShortfall - (Number(invSaved["General Sigils"]) || 0));
    const totalTimeHours = totalExp / 3600;
    const ownedSpeedupHours = expertSpeedupOwnedFrom(invSaved) / 60;
    const stillTimeHours = Math.max(0, totalTimeHours - ownedSpeedupHours);

    totalsEl.innerHTML = `

      <div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">${esc(t("resource_affinity"))}</div><div class="val" style="font-size:13px;">${Math.round(totalAffinity).toLocaleString()}</div><div class="meta" style="font-size:9px; margin-top:2px; color:${stillAffinity > 0 ? "#e0a030" : "var(--good)"};">${stillAffinity > 0 ? Math.round(stillAffinity).toLocaleString() + " " + t("needed_suffix") : t("have_enough")}</div></div>
      <div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">${esc(t("resource_sigils"))}</div><div class="val" style="font-size:13px;">${Math.round(totalSigil).toLocaleString()}</div><div class="meta" style="font-size:9px; margin-top:2px; color:${stillSigil > 0 ? "#e0a030" : "var(--good)"};">${stillSigil > 0 ? Math.round(stillSigil).toLocaleString() + " " + t("needed_suffix") : t("have_enough")}</div></div>
    `;
    // Packs: sigils are what's left after each expert's own sigils, so
    // General Sigils (and packs) only need to cover that shortfall.
    const packGroups = [{ label: null, totals: { "Books of Knowledge": totalBook, "Affinity": totalAffinity, "General Sigils": sigilShortfall, "Speedups (minutes)": Math.round(totalTimeHours * 60) } }];
    const packOwned = { "Books of Knowledge": Number(invSaved["Books of Knowledge"]) || 0, "Affinity": affinityOwnedFrom(invSaved), "General Sigils": Number(invSaved["General Sigils"]) || 0, "Speedups (minutes)": expertSpeedupOwnedFrom(invSaved) };
    renderPackCostBlock(document.getElementById("expertsPacks"), "experts", packGroups, packOwned);
    recordBudgetNeeds("experts", packGroups);
  }

  const gridEl = document.getElementById("expertsGrid");
  function levelOpts(max, selected) {
    return Array.from({ length: max + 1 }, (_, i) => i)
      .map((n) => `<option value="${n}" ${n === selected ? "selected" : ""}>${n}</option>`)
      .join("");

    const row = rows.find((r) => r.level === level);
    if (!row) return "";
    // Only Affinity (stat_type) - this is the always-on hero-level stat.
    // stat_type2 is that expert's Talent, which only applies during their
    // specific event (Foundry/SvS/Frostfire/Tundra), so it's shown only
    // under those matching headers, not here.
    if (!row.stat_type) return "";
    return `<div class="meta" style="font-size:10px; margin-top:3px; color:var(--ice);">+${Number(row.stat_value).toFixed(2)}% ${row.stat_type.split(",").join("/")}</div>`;
  }

  const expertsCounterEl = document.getElementById("expertsSwipeCounter");
  let activeExpertIdx = 0;

    renderSwipeCounter(expertsCounterEl, EXPERTS_SHOWN.length, activeExpertIdx, (next) => { activeExpertIdx = next; renderGrid(); });

          <div style="text-align:center;">

            <div class="name" style="font-size:16px; font-weight:700;">${esc(dataName(e.key))}</div>
            ${expertBadgeHtml(e.key)}
            ${IS_OWNER ? `<div style="margin-top:4px;">${visibilityBtnHtml("experts", e.key)}</div>` : ""}
          </div>
          <button class="btn ghost small" data-expmax="${esc(e.key)}" style="width:60px; justify-self:end;">${esc(t("max_button"))}</button>
        </div>
        <div style="display:flex; justify-content:center; gap:10px; width:100%; max-width:320px; margin:0 auto 12px; text-align:start;">
          <div style="flex:1;">

            <select data-expcur="${esc(e.key)}" style="width:100%;">${levelOpts(EXPERT_HERO_MAX_LEVEL, s.current)}</select>
            ${levelStatLine(e.key, s.current)}
          </div>
          <div style="flex:1;">
            <div class="meta" style="font-size:10px; margin-bottom:2px;">${esc(t("target_label"))}</div>
            <select data-expdes="${esc(e.key)}" style="width:100%;">${levelOpts(EXPERT_HERO_MAX_LEVEL, s.desired)}</select>
            ${levelStatLine(e.key, s.desired)}
          </div>
        </div>
        <div style="border-top:1px solid var(--line); padding-top:10px; text-align:start;">
          ${e.skills
            .map((sk) => {
              const max = skillMaxLevel(e.key, sk);
              const st = s.skills[sk];
              const { exp, book, have: expHaveUsed, expNeed } = skillNeed(e.key, sk, st);
              const expHaveVal = skillExpHave(st);
              const skillRows = SKILL_CACHE[`${e.key}|${sk}`];
              let curRow = null, desRow = null;
              if (skillRows) {
                skillRows.forEach((r) => {
                  if (r.level <= st.current) curRow = r;
                  if (r.level <= st.desired) desRow = r;
                });
              }
              const fmtStat = (r) => (r && r.stat_type ? `+${Number(r.stat_value).toFixed(2)}% ${r.stat_type.split(",").join("/")}` : null);

            }
            ${
              exp || book
                ? `<div class="meta" style="font-size:10px; text-align:end; margin-top:2px;">${Math.round(expNeed).toLocaleString()} EXP \u00b7 ${Math.round(book).toLocaleString()} Books${
                    expHaveUsed > 0 ? ` <span style="color:var(--good);">(${Math.round(exp).toLocaleString()} \u2212 ${Math.round(expHaveUsed).toLocaleString()})</span>` : ""
                  }</div>`
                : ""
            }
            <div style="display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-top:3px;">
              <span class="meta" style="font-size:10px;">${esc(t("skill_exp_have"))}</span>
              <input type="number" min="0" step="1" inputmode="numeric" data-expskillexp="${esc(e.key)}|${esc(sk)}" value="${expHaveVal || ""}" placeholder="0" style="width:110px; flex-shrink:0; padding:4px 8px; font-size:12px; text-align:end;" />
              <button type="button" class="btn ghost small" data-expskillmax="${esc(e.key)}|${esc(sk)}" ${st.current >= max ? "disabled" : ""} title="${esc(t("skill_maxed_tip"))}" style="padding:3px 8px; font-size:11px; flex-shrink:0;">${st.current >= max ? "\u2713 " : ""}${esc(t("skill_maxed"))}</button>
            </div>
          </div>`;
            })
            .join("")}
        </div>
      </div>`;
    wireIndexSwipe(gridEl, EXPERTS_SHOWN.length, activeExpertIdx, (next) => { activeExpertIdx = next; renderGrid(); });

    gridEl.querySelectorAll("select[data-expcur]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        saved[sel.dataset.expcur].current = Number(sel.value);
        await saveCalcState("experts", saved);
        renderStatHeader();
        renderFoundryHeader();
        renderSvsHeader();
        renderFrostfireHeader();
        renderTundraHeader();
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("select[data-expdes]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        saved[sel.dataset.expdes].desired = Number(sel.value);
        await saveCalcState("experts", saved);
        renderTotals();
        renderGrid();
      });
    });
    wireVisibilityBtns(gridEl, () => { renderTotals(); renderGrid(); });
    gridEl.querySelectorAll("input[data-expunlock]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const expert = cb.dataset.expunlock;
        unlockedState[expert] = cb.checked;
        await saveCalcState("experts_unlocked", unlockedState);
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("[data-expmax]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const hero = btn.dataset.expmax;
        const s = saved[hero];
        const heroMaxLvl = (AFFINITY_CACHE[hero] || []).length || EXPERT_HERO_MAX_LEVEL;
        const heroExpert = EXPERTS_SHOWN.find((e) => e.key === hero);
        const heroAlreadyMaxed = s.current >= heroMaxLvl;
        const skillsAlreadyMaxed = heroExpert.skills.every((sk) => {
          const max = skillMaxLevel(hero, sk);
          return s.skills[sk].current >= max;
        });
        const allMaxed = heroAlreadyMaxed && skillsAlreadyMaxed;
        if (allMaxed) {
          s.current = 0;
          heroExpert.skills.forEach((sk) => {
            s.skills[sk].current = 0;
          });
        } else {
          s.current = heroMaxLvl;
          heroExpert.skills.forEach((sk) => {
            const max = skillMaxLevel(hero, sk);
            s.skills[sk].current = max;
          });
        }
        await saveCalcState("experts", saved);
        renderStatHeader();
        renderFoundryHeader();
        renderSvsHeader();
        renderFrostfireHeader();
        renderTundraHeader();
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("select[data-expskillcur]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const [hero, skill] = sel.dataset.expskillcur.split("|");
        saved[hero].skills[skill].current = Number(sel.value);
        await saveCalcState("experts", saved);
        renderStatHeader();
        renderFoundryHeader();
        renderSvsHeader();
        renderFrostfireHeader();
        renderTundraHeader();
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("select[data-expskilldes]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const [hero, skill] = sel.dataset.expskilldes.split("|");
        saved[hero].skills[skill].desired = Number(sel.value);
        await saveCalcState("experts", saved);
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("[data-expskillmax]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const [hero, skill] = btn.dataset.expskillmax.split("|");
        const max = skillMaxLevel(hero, skill);
        saved[hero].skills[skill].current = max;
        saved[hero].skills[skill].desired = max;
        delete saved[hero].skills[skill].expHave;
        await saveCalcState("experts", saved);
        renderStatHeader();
        renderFoundryHeader();
        renderSvsHeader();
        renderFrostfireHeader();
        renderTundraHeader();
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("input[data-expskillexp]").forEach((inp) => {
      inp.addEventListener("change", async () => {
        const [hero, skill] = inp.dataset.expskillexp.split("|");
        const v = Math.max(0, Math.floor(Number(inp.value) || 0));
        if (v) saved[hero].skills[skill].expHave = v;
        else delete saved[hero].skills[skill].expHave;
        await saveCalcState("experts", saved);
        renderTotals();
        renderGrid();
      });
    });
  }

  const invEl = document.getElementById("expertsInventory");
  function renderInventory() {

        <img src="${EXPERT_INVENTORY_ICONS[f] || (f.endsWith(" Sigils") ? "icons/item_icon_570000.png" : "icons/item_icon_570201.png")}" data-iconfallback="${f.endsWith(" Sigils") ? "icons/item_icon_570000.png" : "icons/item_icon_570201.png"}" alt="" style="width:20px; height:20px; object-fit:contain; flex-shrink:0;" loading="lazy" />
        <div style="flex:1; min-width:0;">
          <div class="meta" style="font-size:9px; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(materialDisplayName(f))}</div>
          <input type="text" inputmode="numeric" data-expinv="${esc(f)}" value="${invSaved[f] || 0}" style="width:100%; min-width:0; padding:4px 6px; box-sizing:border-box;" />
        </div>
      </div>`;
    invEl.innerHTML = expertInventoryFields().map(fieldRow).join("");
    invEl.style.gap = "10px 12px";
    invEl.querySelectorAll("img[data-iconfallback]").forEach((img) => img.addEventListener("error", () => { img.src = img.dataset.iconfallback; img.removeAttribute("data-iconfallback"); }, { once: true }));

    invEl.querySelectorAll("input[data-expinv]").forEach((input) => {
      input.addEventListener("change", async () => {
        let val = parseInt(input.value, 10);
        if (Number.isNaN(val) || val < 0) val = 0;
        input.value = val;
        invSaved[input.dataset.expinv] = val;
        budgetInvalidate();
        await saveCalcState("experts_inventory", invSaved);
