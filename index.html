        </div>`;
      }).join("")}
    </div>
  `
  ).join("");
  statPassMemo = null; // first paint done - recompute fresh from here on

  sections.querySelectorAll("[data-drilldown]").forEach((card) => {
    card.addEventListener("click", () => {
      try {
        const [troop, statKey] = card.dataset.drilldown.split("|");
        const statMeta = STATS.find((s) => s.key === statKey);
        // recompute the full (non-truncated) source lists for this troop+stat,
        // including every live-wired page (Charm/Chief/Hero Gears/Islands/
        // Skins/Facility/Gallery/T11/T12/Research Center/Jero/Natalia/
        // Pets Level/Pets Refine/VIP). Re-runnable so the modal can switch
        // between the 3 Hero Gear sets.
        const computeBreakdown = () => {
          const { total } = statFor(troop, statKey);
          const maxTotal = maxStatFor(troop, statKey);
          const row = rows.find((r) => r.name.toLowerCase() === `${troop} ${statKey}`.toLowerCase());
          const bySourceCur = {};
          const bySourceMax = {};
          if (row) {
            for (const c of row.buff_cells) {
              if (c.value == null) continue;
              const src = colById[c.column_id] || "Other";
              if (!ALLOWED_STAT_CATEGORIES.has(src)) continue;
              bySourceCur[src] = (bySourceCur[src] || 0) + Number(c.value);
              bySourceMax[src] = (bySourceMax[src] || 0) + Number(c.value);
            }
          }
          const { islandsMax, skinsMax } = liveMaxFor(troop, statKey);
          if ("Islands" in bySourceMax || islandsMax) bySourceMax["Islands"] = islandsMax;
          if ("Skins" in bySourceMax || skinsMax) bySourceMax["Skins"] = skinsMax;
          const { islandsCur, skinsCur } = liveCurrentFor(troop, statKey);
          if ("Islands" in bySourceCur || islandsCur) bySourceCur["Islands"] = islandsCur;
          if ("Skins" in bySourceCur || skinsCur) bySourceCur["Skins"] = skinsCur;
          LIVE_CALC_KEYS.forEach((calcKey) => {
            try {
              const vCur = liveCalcValue(calcKey, troop, statKey, false);
              if (vCur != null && (calcKey in bySourceCur || vCur)) bySourceCur[calcKey] = vCur;
              const vMax = liveCalcValue(calcKey, troop, statKey, true);
              if (vMax != null && (calcKey in bySourceMax || vMax)) bySourceMax[calcKey] = vMax;
            } catch (innerErr) {
              console.error("liveCalcValue failed for", calcKey, innerErr);
            }
          });
          const allNames = [...new Set([...Object.keys(bySourceCur), ...Object.keys(bySourceMax)])];
          const combined = sortBySourceOrder(allNames.map((name) => [name, bySourceMax[name] || 0])).map(
            ([name]) => ({ name, cur: bySourceCur[name] || 0, max: bySourceMax[name] || 0 })
          );
          return { total, maxTotal, combined };
        };
        BREAKDOWN_HERO_GEAR_SET = "Set 1";
        const first = computeBreakdown();
        openDrilldownModal(`${troopDisplayName(troop)} ${tStatLabel(statMeta.label)}`, first.total, first.maxTotal, first.combined, computeBreakdown);
      } catch (err) {
        console.error("Drilldown modal failed to open", err);
      }
    });
  });
}

function openDrilldownModal(title, total, maxTotal, sources, recompute) {
  let modal = document.getElementById("drilldownModal");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "drilldownModal";
    modal.className = "modal-overlay";
    modal.style.display = "none";
    document.body.appendChild(modal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
        BREAKDOWN_HERO_GEAR_SET = "Set 1";
      }
    });
  }
  const setTabsHtml = recompute
    ? `<div class="seg" id="drilldownSetTabs" style="margin-top:10px;">
        ${HERO_GEAR_SET_NAMES.map((n) => `<button data-bdset="${esc(n)}" class="${n === BREAKDOWN_HERO_GEAR_SET ? "active" : ""}">${esc(gearSetDisplayName(n))}</button>`).join("")}
      </div>
      <p class="meta" style="font-size:10.5px; margin-top:4px;">${esc(t("hero_gear_switch_note"))}</p>`
    : "";
  modal.innerHTML = `
    <div class="modal-box" style="max-width:480px; max-height:80vh; overflow-y:auto;">
      <h2>${esc(title)}</h2>
      ${setTabsHtml}
      <div class="desc" style="display:flex; flex-wrap:wrap; gap:6px 16px; margin:0 0 16px;">
        <span>${esc(t("current_label"))}: <strong style="color:var(--frost); white-space:nowrap;">${total.toFixed(1)}%</strong></span>
        <span>${esc(t("max_possible"))}: <strong style="color:var(--ice); white-space:nowrap;">${maxTotal.toFixed(1)}%</strong></span>
        <span>${esc(t("difference_label"))}: <strong style="color:var(--warn, #e0a030); white-space:nowrap;">+${(maxTotal - total).toFixed(1)}%</strong></span>
      </div>
      <div style="display:grid; grid-template-columns:1fr auto auto auto; gap:4px 12px; margin-top:12px; align-items:center;">
        <div class="meta" style="font-size:10.5px;"></div>
        <div class="meta" style="font-size:10.5px; text-align:end;">${esc(t("current_label"))}</div>
        <div class="meta" style="font-size:10.5px; text-align:end;">${esc(t("max_label"))}</div>
        <div class="meta" style="font-size:10.5px; text-align:end;">${esc(t("diff_label"))}</div>
        ${
          sources.length
            ? sources
                .map((s) => {
                  const diff = s.max - s.cur;
                  return `<div class="src-name" style="padding:6px 0; border-bottom:1px solid var(--line); white-space:nowrap; font-size:12.5px;">${esc(displaySourceName(s.name))}</div><div class="src-val" style="padding:6px 0; border-bottom:1px solid var(--line); text-align:end;">+${s.cur.toFixed(1)}%</div><div class="src-val" style="padding:6px 0; border-bottom:1px solid var(--line); text-align:end; color:var(--ice);">+${s.max.toFixed(1)}%</div><div class="src-val" style="padding:6px 0; border-bottom:1px solid var(--line); text-align:end; color:${diff > 0 ? "#e0a030" : "var(--muted)"};">${diff > 0 ? "+" + diff.toFixed(1) + "%" : "\u2014"}</div>`;
                })
                .join("")
            : `<div class="src-name" style="grid-column:1/-1;">${esc(t("no_sources_yet"))}</div>`
        }
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="drilldownClose">Close</button>
      </div>
    </div>
  `;
  document.getElementById("drilldownClose").addEventListener("click", () => {
    modal.style.display = "none";
    BREAKDOWN_HERO_GEAR_SET = "Set 1";
  });
  if (recompute) {
    modal.querySelectorAll("[data-bdset]").forEach((btn) => {
      btn.addEventListener("click", () => {
        BREAKDOWN_HERO_GEAR_SET = btn.dataset.bdset;
        const next = recompute();
        openDrilldownModal(title, next.total, next.maxTotal, next.combined, recompute);
      });
    });
  }
  modal.style.display = "flex";
}


// ============================================================
// HERO GEAR CALCULATOR (under Calculators nav)
// Two tracks per gear piece: Mastery Forging (1-20, Lethality/
// Health stat curve) and a combined Enhance track (0-200) where
// levels 101-200 are the "Red Gear"/Mithril milestones, which
// grant Attack/Defense/Lethality/Health at levels 120/160/200.
// 3 troop types x 4 pieces (Goggles/Gloves/Belt/Boots) = 12 sets,
// each independently tracked in HERO_GEAR_STATE.
// ============================================================
const GEAR_LEVELING_TABLES = ["Hero Gear Mastery Forging", "Enhance Combined"];
const HERO_GEAR_TRACK_LABELS = {
  "Hero Gear Mastery Forging": "Mastery Forging",
  "Enhance Combined": "Enhance (0\u2013200)",
};
const HERO_GEAR_PIECE_NAMES = ["Goggles", "Gloves", "Belt", "Boots"];
const HERO_GEAR_MASTERY_STATS = {
  Goggles: ["Lethality"],
  Boots: ["Lethality"],
  Gloves: ["Health"],
  Belt: ["Health"],
};
const HERO_GEAR_ENHANCE_CONTINUOUS_STATS = {
  Goggles: ["Lethality"],
  Boots: ["Lethality"],
  Gloves: ["Health"],
  Belt: ["Health"],
};
const HERO_GEAR_ENHANCE_MILESTONE_STATS = {
  Goggles: ["Attack"],
  Boots: ["Attack"],
  Gloves: ["Defense"],
  Belt: ["Defense"],
};
const HERO_GEAR_TROOPS = ["Infantry", "Lancer", "Marksman"];
function makeEmptyHeroGearState() {
  const state = {};
  HERO_GEAR_TROOPS.forEach((troop) => {
    state[troop] = {};
    HERO_GEAR_PIECE_NAMES.forEach((piece) => {
      state[troop][piece] = {};
      GEAR_LEVELING_TABLES.forEach((t) => (state[troop][piece][t] = { from: 0, to: null }));
    });
  });
  return state;
}
// Set 1 is the only set that feeds the Dashboard's aggregate stats.
const HERO_GEAR_STATE = makeEmptyHeroGearState();
const HERO_GEAR_STATE_SET2 = makeEmptyHeroGearState();
const HERO_GEAR_STATE_SET3 = makeEmptyHeroGearState();
const HERO_GEAR_SET_NAMES = ["Set 1", "Set 2", "Set 3"];
const HERO_GEAR_SETS = { "Set 1": HERO_GEAR_STATE, "Set 2": HERO_GEAR_STATE_SET2, "Set 3": HERO_GEAR_STATE_SET3 };
const HERO_GEAR_STORAGE_KEYS = { "Set 1": "hero_gear", "Set 2": "hero_gear_set2", "Set 3": "hero_gear_set3" };
let heroGearActiveSet = "Set 1";
let heroGearActiveTroop = "Infantry";
// Which hero gear set the Dashboard breakdown modal is currently showing.
let BREAKDOWN_HERO_GEAR_SET = "Set 1";
let HERO_GEAR_TABLES_CACHE = null;

// Renders the Quick Select + per-piece calculator + totals + stats.
// Loads + caches Hero Gear progression tables and any saved selections.
// Safe to call from anywhere (Hero Gear Calc page or the Dashboard) since
// it's a no-op once HERO_GEAR_TABLES_CACHE is populated.
async function ensureHeroGearData() {
  if (HERO_GEAR_TABLES_CACHE) return;
  const results = await Promise.all(
    ["Hero Gear Mastery Forging", "Hero Gear Enhancement", "Hero Gear Mithril"].map(async (name) => {
      const [table] = await sb(`progression_tables?name=eq.${encodeURIComponent(name)}&user_id=eq.${PROGRESSION_OWNER_ID}&select=id`);
      if (!table) return { name, rows: [] };
      const rows = await sb(`progression_rows?table_id=eq.${table.id}&select=id,level,stage,materials,stat,stat2,power,display_label,mithril,mythic_gear,xp_component,essence_stones&order=sort_order.asc`);
      return { name, rows };
    })
  );
  const rawCache = Object.fromEntries(results.map((r) => [r.name, r.rows]));
  const enhanceRows = (rawCache["Hero Gear Enhancement"] || []).map((r) => ({ ...r, level: r.level }));
  const empowerRows = (rawCache["Hero Gear Mithril"] || []).map((r) => ({ ...r, level: r.level + 100 }));
  rawCache["Enhance Combined"] = [...enhanceRows, ...empowerRows];
  HERO_GEAR_TABLES_CACHE = rawCache;

  for (const setName of HERO_GEAR_SET_NAMES) {
    const state = HERO_GEAR_SETS[setName];
    HERO_GEAR_TROOPS.forEach((troop) => {
      HERO_GEAR_PIECE_NAMES.forEach((piece) => {
        GEAR_LEVELING_TABLES.forEach((t) => {
          const st = state[troop][piece][t];
          if (st.to === null) st.to = Math.max(0, HERO_GEAR_TABLES_CACHE[t].length - 1);
        });
      });
    });

    const saved = await loadCalcState(HERO_GEAR_STORAGE_KEYS[setName]);
    if (saved) {
      HERO_GEAR_TROOPS.forEach((troop) => {
        HERO_GEAR_PIECE_NAMES.forEach((piece) => {
          GEAR_LEVELING_TABLES.forEach((t) => {
            const savedVal = saved?.[troop]?.[piece]?.[t]?.from;
            if (typeof savedVal === "number") state[troop][piece][t].from = savedVal;
          });
        });
      });
    }
  }
}

  const activeStorageKey = HERO_GEAR_STORAGE_KEYS[heroGearActiveSet];

  const optsByTrack = {};
  GEAR_LEVELING_TABLES.forEach((t) => {
    optsByTrack[t] = HERO_GEAR_TABLES_CACHE[t].map((r, i) => `<option value="${i}">${esc(rowLabel(r))}</option>`).join("");
  });

  const tracksEl = document.getElementById("heroGearTracks");
  // One icon per troop type and piece: icons/hero-gear-<troop>-<piece>.png
  const HERO_GEAR_ICONS = { Goggles: "goggles", Gloves: "gloves", Belt: "belt", Boots: "boots" };
  const heroGearIcon = (troop, piece) => `icons/hero-gear-icons/hero-gear-${String(troop).toLowerCase()}-${HERO_GEAR_ICONS[piece] || String(piece).toLowerCase()}.png`;
  const pieceCard = (troop, piece) => `
    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <div style="width:60px;"></div>
        <div style="text-align:center;">
          <img src="${heroGearIcon(troop, piece)}" alt="${esc(pieceDisplayName(piece))}" style="width:88px; height:88px; object-fit:contain; margin-bottom:4px;" loading="lazy" />
          <div class="name" style="font-size:15px; font-weight:700;">${esc(pieceDisplayName(piece))}</div>
        </div>
        <button class="btn ghost small" data-heropiecemax="${esc(troop)}|${esc(piece)}" style="width:60px;">${esc(t("max_button"))}</button>
      </div>
      <div style="border-top:1px solid var(--line); padding-top:10px;">
        ${GEAR_LEVELING_TABLES.map(
          (t) => `
        <div style="padding:6px 0;">
          <div class="meta" style="font-size:12px; margin-bottom:4px;">${esc(trackDisplayName(t))}</div>
          <div style="display:flex; gap:6px;">
            <select data-troop="${esc(troop)}" data-piece="${esc(piece)}" data-track="${esc(t)}" data-role="from" style="flex:1;">${optsByTrack[t]}</select>

        ).join("")}
      </div>
    </div>`;

  const HERO_GEAR_TROOP_COLORS = { Infantry: "#7ee6a8", Lancer: "var(--ice)", Marksman: "#f0a3c4" };
  const heroGearDotsEl = document.getElementById("heroGearTroopDots");
  // Performance: these dropdowns pull from tables with ~85-200 levels each
  // (Mastery Forging, and Enhancement+Empowerment combined), 2 dropdowns x
  // 2 tracks x 4 pieces = ~2,300 <option> tags rebuilt per troop. Rebuilding
  // that from scratch on every single swipe is heavy enough to visibly jank.
  // Each troop's panel is built lazily - only the first time you actually
  // swipe to it, then cached - so repeat swipes never rebuild it again.
  const builtPanels = {}; // troop -> its built (and cached) panel element
  function buildPanel(troop) {
    if (builtPanels[troop]) return builtPanels[troop];
    const wrap = document.createElement("div");
    wrap.dataset.troopanel = troop;
    wrap.style.display = "none";
    wrap.innerHTML = `
      <div class="name" style="font-size:14px; margin-bottom:10px; color:${HERO_GEAR_TROOP_COLORS[troop]};">${esc(troopDisplayName(troop))}</div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px;">
        ${HERO_GEAR_PIECE_NAMES.map((piece) => pieceCard(troop, piece)).join("")}
      </div>`;

    wrap.querySelectorAll("[data-heropiecemax]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const [troop, piece] = btn.dataset.heropiecemax.split("|");
        const maxIdxByTrack = {};
        GEAR_LEVELING_TABLES.forEach((t) => {
          maxIdxByTrack[t] = Math.max(0, (HERO_GEAR_TABLES_CACHE[t] || []).length - 1);
        });
        const bothMaxed = GEAR_LEVELING_TABLES.every((t) => {
          const st = activeState[troop][piece][t];
          return st.from >= maxIdxByTrack[t] && st.to >= maxIdxByTrack[t];
        });
        const currentZeroTargetMaxed = GEAR_LEVELING_TABLES.every((t) => {
          const st = activeState[troop][piece][t];
          return st.from <= 0 && st.to >= maxIdxByTrack[t];
        });
        const bothZero = GEAR_LEVELING_TABLES.every((t) => {
          const st = activeState[troop][piece][t];
          return st.from <= 0 && st.to <= 0;
        });
        // Cycle: (0,0) -> (max,max) -> (0,max) -> (0,0) -> ...
        let mode;
        if (bothZero) mode = "max";
        else if (bothMaxed) mode = "half";
        else if (currentZeroTargetMaxed) mode = "zero";
        else mode = "max";
        GEAR_LEVELING_TABLES.forEach((t) => {
          const st = activeState[troop][piece][t];
          if (mode === "max") {
            st.from = maxIdxByTrack[t];
            st.to = maxIdxByTrack[t];
          } else if (mode === "half") {
            st.from = 0;
            st.to = maxIdxByTrack[t];
          } else {
            st.from = 0;
            st.to = 0;
          }
        });
        saveCalcState(activeStorageKey, activeState);
        renderGearLevelingGroup(target);
      });
    });

    wrap.querySelectorAll("select[data-troop]").forEach((sel) => {
      const { troop, piece, track, role } = sel.dataset;
      sel.value = String(activeState[troop][piece][track][role]);
      sel.addEventListener("change", () => {
        activeState[troop][piece][track][role] = Number(sel.value);
        saveCalcState(activeStorageKey, activeState);
        updateHeroGearTotals();
      });
    });

    tracksEl.appendChild(wrap);
    builtPanels[troop] = wrap;
    return wrap;
  }
  function showPanel(troop) {
    buildPanel(troop);
    Object.keys(builtPanels).forEach((tr) => {
      builtPanels[tr].style.display = tr === troop ? "block" : "none";
    });
  }
  // Wired once - tracksEl itself is never rebuilt after this, only which
  // panel is visible changes. Reads heroGearActiveTroop fresh on every
  // swipe (rather than via wireTroopSwipe, which captures the current
  // troop's index ONCE at wire-time - that would go stale the moment you
  // swipe past the first card, since this only wires a single time).
  function goToHeroGearTroop(troop) {
    heroGearActiveTroop = troop;
    showPanel(heroGearActiveTroop);
    renderSwipeDots(heroGearDotsEl, HERO_GEAR_TROOPS, heroGearActiveTroop, HERO_GEAR_TROOP_COLORS, goToHeroGearTroop);
  }
  let swipeWired = false;
  function wireSwipeOnce() {
    if (swipeWired) return;
    swipeWired = true;
    wireSwipeGesture(tracksEl, (dir) => {
      const idx = HERO_GEAR_TROOPS.indexOf(heroGearActiveTroop);
      const next = idx + dir;
      if (next < 0 || next >= HERO_GEAR_TROOPS.length) return;
      heroGearActiveTroop = HERO_GEAR_TROOPS[next];
      showPanel(heroGearActiveTroop);
      renderSwipeDots(heroGearDotsEl, HERO_GEAR_TROOPS, heroGearActiveTroop, HERO_GEAR_TROOP_COLORS, goToHeroGearTroop);
    });
  }
  function renderTracks() {
    renderSwipeDots(heroGearDotsEl, HERO_GEAR_TROOPS, heroGearActiveTroop, HERO_GEAR_TROOP_COLORS, goToHeroGearTroop);
    showPanel(heroGearActiveTroop);
    wireSwipeOnce();
  }
  renderTracks();

  updateHeroGearTotals();
}

// Sums materials (XP/Mithril/Mythic Gear/Essence Stones) needed
// across all 12 gear-piece/track selections into one totals grid.
// Shared "how much do I own" bar shown above a calculator's materials
// totals. calcKey scopes persistence per calculator (charm/chief_gear/
// hero_gear) since the same material name could mean different things
// in different contexts. Returns the rendered HTML string; also wires
// up the input change handlers once inserted into the DOM.
const MATERIAL_OWNED_CACHE = {};
async function ensureMaterialOwnedCache(calcKey) {
  if (!MATERIAL_OWNED_CACHE[calcKey]) {
    MATERIAL_OWNED_CACHE[calcKey] = (await loadCalcState(`material_owned_${calcKey}`)) || {};
  }
  return MATERIAL_OWNED_CACHE[calcKey];
}

async function updateHeroGearTotals() {
  if (!HERO_GEAR_TABLES_CACHE) return;
  const HERO_GEAR_MATERIAL_COLS = [
    ["mithril", "Mithril"],
    ["mythic_gear", "Mythic Gear"],
    ["xp_component", "XP Component"],
    ["essence_stones", "Essence Stones"],
  ];

  // One real inventory covers all 3 loadouts (owned amounts are shared
  // under a single key), while needed / still-needed reflects only the
  // set currently selected on the page.
  const matTotals = {};
  const setState = HERO_GEAR_SETS[heroGearActiveSet];
  HERO_GEAR_TROOPS.forEach((troop) => {
    HERO_GEAR_PIECE_NAMES.forEach((piece) => {
      GEAR_LEVELING_TABLES.forEach((t) => {
        const rows = HERO_GEAR_TABLES_CACHE[t];
        if (!rows.length) return;
        const st = setState[troop][piece][t];
        const fromIdx = Math.min(st.from, st.to);
        const toIdx = Math.max(st.from, st.to);
        for (let i = fromIdx + 1; i <= toIdx; i++) {
          HERO_GEAR_MATERIAL_COLS.forEach(([col, label]) => {
            const v = Number(rows[i][col]) || 0;
            if (v) matTotals[label] = (matTotals[label] || 0) + v;
          });
        }
      });
    });
  });

  renderChiefGearResourcesBar("heroGearOwned", matTotals, ["XP Component", "Essence Stones", "Mithril", "Mythic Gear"], updateHeroGearTotals, "hero_gear");

  updateHeroGearCurrentStats();
}

// Computes current Attack/Defense/Lethality/Health bonus per troop
// type: Mastery Forging contributes Lethality+Health only; Mithril
// milestones crossed on the Enhance track contribute all 4 stats.
// Pure computation, reusable by both this page and the Stats dashboard.
// stateObj must have the same shape as HERO_GEAR_STATE.
function computeHeroGearStats(stateObj) {
  if (!HERO_GEAR_TABLES_CACHE) return {};
  const mfRows = HERO_GEAR_TABLES_CACHE["Hero Gear Mastery Forging"];
  const enhRows = HERO_GEAR_TABLES_CACHE["Enhance Combined"];
  if (!mfRows || !mfRows.length) return {};

  const out = {};
  HERO_GEAR_TROOPS.forEach((troop) => {
    const statTotals = { Attack: 0, Defense: 0, Health: 0, Lethality: 0 };
    const continuousMax = { Health: 0, Lethality: 0 };
    HERO_GEAR_PIECE_NAMES.forEach((piece) => {
      const mfIdx = stateObj[troop][piece]["Hero Gear Mastery Forging"].from;
      const mfStat = parseStatPct(mfRows[mfIdx]?.stat) || 0;
      HERO_GEAR_MASTERY_STATS[piece].forEach((stat) => {
        statTotals[stat] += mfStat;
      });
      if (enhRows && enhRows.length) {
        const enhIdx = stateObj[troop][piece]["Enhance Combined"].from;
        const continuousStat = parseStatPct(enhRows[enhIdx]?.stat) || 0;
        HERO_GEAR_ENHANCE_CONTINUOUS_STATS[piece].forEach((stat) => {
          continuousMax[stat] += continuousStat;
        });
        let milestoneStat = 0;
        for (let i = 0; i <= enhIdx; i++) {
          const v = parseStatPct(enhRows[i].stat2);
          if (v != null) milestoneStat += v;
        }
        HERO_GEAR_ENHANCE_MILESTONE_STATS[piece].forEach((stat) => {
          statTotals[stat] += milestoneStat;
        });
      }
    });
    statTotals.Health += continuousMax.Health;
    statTotals.Lethality += continuousMax.Lethality;
    out[troop] = statTotals;
  });
  return out;
}

// Builds a synthetic "everything at max level" state, same shape as
// HERO_GEAR_STATE, for computing the Max Possible ceiling.
function maxedHeroGearState() {
  const out = {};
  HERO_GEAR_TROOPS.forEach((troop) => {
    out[troop] = {};
    HERO_GEAR_PIECE_NAMES.forEach((piece) => {
      out[troop][piece] = {};
      GEAR_LEVELING_TABLES.forEach((t) => {
        out[troop][piece][t] = { from: Math.max(0, (HERO_GEAR_TABLES_CACHE[t] || []).length - 1) };
      });
    });
  });
  return out;
}

function updateHeroGearCurrentStats() {
  const el = document.getElementById("heroGearCurrentStats");
  if (!el || !HERO_GEAR_TABLES_CACHE) return;
  const statsByTroop = computeHeroGearStats(HERO_GEAR_SETS[heroGearActiveSet]);
  const maxByTroop = computeHeroGearStats(maxedHeroGearState());
  const results = HERO_GEAR_TROOPS.map((troop) => ({ troop, statTotals: statsByTroop[troop], maxTotals: maxByTroop[troop] }));

  const HG_STAT_ABBR = { Attack: "ATK", Defense: "DEF", Lethality: "LETH", Health: "HP" };
  el.innerHTML = results
    .map(
      (r) => `
    <div style="margin-bottom:14px;">
      <div class="meta" style="margin-bottom:8px; font-weight:600; color:var(--frost);">${esc(troopDisplayName(r.troop))}</div>
      <div class="stats-row-scroll">
        <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">${HG_STAT_ABBR.Attack}</div><div class="val" style="font-size:13px; margin-top:3px;">+${r.statTotals.Attack.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${r.maxTotals.Attack.toFixed(1)}%</div></div>
        <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">${HG_STAT_ABBR.Defense}</div><div class="val" style="font-size:13px; margin-top:3px;">+${r.statTotals.Defense.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${r.maxTotals.Defense.toFixed(1)}%</div></div>
        <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">${HG_STAT_ABBR.Lethality}</div><div class="val" style="font-size:13px; margin-top:3px;">+${r.statTotals.Lethality.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${r.maxTotals.Lethality.toFixed(1)}%</div></div>
        <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">${HG_STAT_ABBR.Health}</div><div class="val" style="font-size:13px; margin-top:3px;">+${r.statTotals.Health.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${r.maxTotals.Health.toFixed(1)}%</div></div>

async function renderPacksPage() {
  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>${esc(t("packs_title"))}</h2>
        <p class="desc">${esc(t("packs_desc"))}</p>
      </div>
      <button class="btn" id="packsAddTable">${esc(t("add_table_button"))}</button>
    </div>
    <div id="packsPageTabs" style="margin-bottom:6px;"></div>
    <div id="packsList"></div>
  `;

  const listEl = document.getElementById("packsList");
  const [tablesLoaded] = await Promise.all([
    sb(`pack_tables?user_id=eq.${USER_ID}&select=*&order=sort_order.asc`),
    ensurePackLinks(),
  ]);
  let tables = tablesLoaded;
  PACK_TABLES_ALL = tables;
  PACK_TABLES_CACHE = null; // pages re-read them fresh after any edit here
  // First visit: the in-game pack tables are created automatically (once
  // per account, so deleting one later doesn't bring it back).
  if (IS_OWNER && !(await loadCalcState("pack_presets_seeded"))) {
    await saveCalcState("pack_presets_seeded", { at: Date.now() });
    const added = await packAddPresets(tables);
    if (added) { toast(`${added} ${t("pack_presets_added")}`); renderPacksPage(); return; }
  }


  function blankRow(colCount) {
    return { cells: Array(colCount).fill(""), is_total: false };
  }

  // Gems is a fixed, universal WOS price table (not something that varies
  // per-pack like FC/Speedups), so it's looked up directly rather than
  // scaled from Row 1 - it fills on every row, including Row 1 itself.
  const AMOUNT_TO_GEMS = { 0.99: 500, 2.99: 1500, 4.99: 2500, 9.99: 5000, 19.99: 10000, 49.99: 25000, 99.99: 50000 };

  // The Amount column itself follows this same fixed sequence in every
  // table. Typing Row 1's Amount as one of these values auto-fills every
  // row below it with the next value in the sequence - e.g. Row 1 = 0.99
  // fills Row 2 with 2.99, Row 3 with 4.99, and so on for however many
  // rows exist (or however far the sequence goes, whichever is shorter).
  const AMOUNT_SEQUENCE = [0.99, 2.99, 4.99, 9.99, 19.99, 49.99, 99.99];
  function applyAmountSequence(panel, t, onlyRowIndex) {
    const row0Amount = parseNum(panel.querySelector('[data-pt-cell][data-row="0"][data-col="0"]')?.value);
    const startIdx = AMOUNT_SEQUENCE.findIndex((v) => Math.abs(v - row0Amount) < 0.001);
    if (startIdx === -1) return;
    const rowEls = panel.querySelectorAll("tbody tr");
    rowEls.forEach((tr, ri) => {
      if (ri === 0) return; // Row 1 is what was just typed - never overwritten
      if (onlyRowIndex != null && ri !== onlyRowIndex) return; // scoped to one row - leaves other rows' manual edits alone
      const seqVal = AMOUNT_SEQUENCE[startIdx + ri];
      if (seqVal == null) return; // sequence ran out before the rows did
      const amountCell = tr.querySelector('[data-pt-cell][data-col="0"]');
      if (amountCell) amountCell.value = fmtNum(seqVal);
    });
  }

  // Row 1 (the first row) sets the scale for every OTHER column (not Gems -
  // see AMOUNT_TO_GEMS above): its ratio to the Amount (column 0) is measured
  // from Row 1's own values. Typing an Amount into any other row then
  // auto-fills that row's remaining (non-Gems) columns using that ratio -
  // e.g. if Row 1 is $4.99 / 60 FC / 35 Speedups, FC is locked at 12.02x the
  // amount and Speedups at ~7.01x, and typing "9.99" as Amount on Row 2 fills
  // FC/Speedups automatically.
  function parseNum(str) {
    const n = parseFloat(String(str).replace(/[^0-9.-]/g, ""));
    return Number.isFinite(n) ? n : null;
  }
  function fmtNum(n) {
    return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }
  // Which column holds the price - the only one that may have decimals.
  function priceColOf(tb) {
    const ci = packLinkFor(tb.id).priceCol;
    return typeof ci === "number" ? ci : 0;
  }
  // Quantities are whole items: auto-filled values round to the nearest
  // whole number (48 at $0.99 scaled to $2.99 is 144.97 -> 145, and to
  // $1.99 is 96.48 -> 96). Only the price column keeps decimals.
  function fmtQty(n) {
    return Math.round(Number(n) || 0).toLocaleString();
  }
  function fmtCell(tb, ci, n) {
    return ci === priceColOf(tb) ? fmtNum(n) : fmtQty(n);
  }
  // Gems always fills on any typed Amount, in every table, regardless of
  // the Scale toggle - it's a fixed, universal game price point, not a
  // per-table custom ratio like FC/Speedups.
  // The Gems column is found by name (not assumed to be the last one).
  function gemsColOf(tb) {
    return tb.columns.findIndex((c) => /gem/i.test(String(c || "")));
  }
  // Gems for a price: the fixed game table, or the same 500-per-dollar
  // rule for any other price (4.99 -> 2,500, 9.99 -> 5,000, 49.99 -> 25,000).
  function gemsForPrice(amount) {
    const key = Math.round(amount * 100) / 100;
    if (AMOUNT_TO_GEMS[key] != null) return AMOUNT_TO_GEMS[key];
    return Math.round((amount + 0.01) * 500);
  }
  function applyGemsLookup(panel, t, onlyRowIndex) {
    const lastCi = gemsColOf(t);
    if (lastCi === -1) return;
    panel.querySelectorAll("tbody tr").forEach((tr) => {
      const ri = Number(tr.dataset.row);
      if (onlyRowIndex != null && ri !== onlyRowIndex) return; // scoped to one row - leaves other rows' manual edits alone
      const amount = parseNum(tr.querySelector(`[data-pt-cell][data-col="${priceColOf(t)}"]`)?.value);
      if (amount == null || amount <= 0) return;
      const gemsCell = tr.querySelector(`[data-pt-cell][data-col="${lastCi}"]`);
      if (gemsCell) gemsCell.value = fmtQty(gemsForPrice(amount));
    });
  }
  // Fills every OTHER column (not Gems, not Amount) using the ratio each
  // one holds to the Amount in Row 1 - only runs when Scale is on for
  // this table, since it assumes a fixed proportional relationship that
  // not every table's data actually follows.
  // Every other column follows the game's tier multipliers, not the raw
  // price ratio: the tiers 4.99 / 9.99 / 19.99 / 49.99 / 99.99 are x1, x2,
  // x4, x10, x20 of the first (exactly like Gems 2,500 -> 5,000 -> 10,000
  // -> 25,000 -> 50,000), so 12 in row 1 fills 24 / 48 / 120 / 240. The
  // price column itself is never touched.
  function applyRatioScale(panel, t, onlyRowIndex) {
    const gemsCi = gemsColOf(t);
    const priceCi = priceColOf(t);
    const row0Amount = parseNum(panel.querySelector(`[data-pt-cell][data-row="0"][data-col="${priceCi}"]`)?.value);
    if (!row0Amount) return;
    const base = t.columns.map((_, ci) => {
      if (ci === priceCi || ci === gemsCi) return null; // Amount and Gems are handled separately
      const v = parseNum(panel.querySelector(`[data-pt-cell][data-row="0"][data-col="${ci}"]`)?.value);
      return v == null ? null : v;
    });
    panel.querySelectorAll("tbody tr").forEach((tr) => {
      const ri = Number(tr.dataset.row);
      if (ri === 0) return; // row 1 is the source, never auto-filled itself
      if (onlyRowIndex != null && ri !== onlyRowIndex) return; // scoped to one row - leaves other rows' manual edits alone
      const amount = parseNum(tr.querySelector(`[data-pt-cell][data-col="${priceCi}"]`)?.value);
      if (amount == null) return;
      const mult = gemsForPrice(amount) / gemsForPrice(row0Amount);
      t.columns.forEach((_, ci) => {
        if (base[ci] == null) return;
        const cell = tr.querySelector(`[data-pt-cell][data-col="${ci}"]`);
        if (cell) cell.value = fmtCell(t, ci, base[ci] * mult);
      });
    });
  }
  // Runs both - used when the Scale toggle is switched on, to fill
  // everything (ratio columns + Gems) in one go.
  function applyScale(panel, t) {
    applyRatioScale(panel, t);
    applyGemsLookup(panel, t);
    refreshTotalsIn(panel, t);
  }
  // Re-sums every column straight from the cells on screen, so the totals
  // row is right after typing, auto-fill, adding a row, or toggling Scale.
  function refreshTotalsIn(panel, t) {
    t.columns.forEach((_, ci) => {
      let sum = 0;
      panel.querySelectorAll(`[data-pt-cell][data-col="${ci}"]`).forEach((inp) => { sum += parseNum(inp.value) || 0; });
      const cell = panel.querySelector(`[data-pt-total="${ci}"]`);
      if (cell) cell.textContent = sum ? fmtNum(sum) : "";
    });
  }

  // Filter tabs: which calculator page the tables are assigned to. A
  // table assigned to several pages shows under each of them.
  let packsFilter = localStorage.getItem("packs_filter") || "all";
  const pageTabs = [{ key: "all" }, ...PACK_PAGE_GROUPS.map((g) => ({ key: g.key, group: g })), { key: "none" }];
  function tableMatchesFilter(tb) {
    if (packsFilter === "all") return true;
    const pages = packLinkFor(tb.id).pages;
    if (packsFilter === "none") return !pages.length;
    const g = PACK_PAGE_GROUPS.find((x) => x.key === packsFilter);
    return !!g && g.pages.some((k) => pages.includes(k));
  }
  function renderPageTabs() {

    const countFor = (key) => { const keep = packsFilter; packsFilter = key; const n = tables.filter(tableMatchesFilter).length; packsFilter = keep; return n; };
    el.innerHTML = `<div class="cat-tabs">${pageTabs.map((pt) => {
      const label = pt.key === "all" ? t("packs_filter_all") : pt.key === "none" ? t("packs_filter_none") : packGroupLabel(pt.group);
      return `<button data-packsfilter="${esc(pt.key)}" class="${pt.key === packsFilter ? "active" : ""}">${esc(label)} <span class="meta" style="font-size:10px;">${countFor(pt.key)}</span></button>`;
    }).join("")}</div>`;
    el.querySelectorAll("[data-packsfilter]").forEach((b) => b.addEventListener("click", () => {
      packsFilter = b.dataset.packsfilter;
      localStorage.setItem("packs_filter", packsFilter);
      renderAll();
    }));
  }
  function renderAll() {
    renderPageTabs();
    if (!tables.length) {
      listEl.innerHTML = `<div class="empty"><div class="big">${esc(t("no_tables_yet"))}</div>${esc(t("no_tables_hint"))}</div>`;

    const ordered = tables.map((tb, ti) => ({ tb, ti })).filter(({ tb }) => tableMatchesFilter(tb)).sort((a, b) => {
      const ga = groupOf(a.tb), gb = groupOf(b.tb);

    wireTable();

  // The "Used for" block under each table: which pages it prices, which

  // The header control for one column:

  //  - Gems column   -> fixed label, nothing to choose
  //  - anything else -> the resource list (plus a custom name)
  function packColumnControlHtml(tb, ci) {
    const link = packLinkFor(tb.id);
    const cur = String(tb.columns[ci] || "").trim();
    if (ci === link.priceCol || (packIsNonResourceColumn(cur) && cur.toLowerCase() !== "gems")) {
      return `<select data-pt-currencypick data-col="${ci}" class="pack-col-pick" title="${esc(t("pack_currency"))}" style="width:100%; max-width:60px; font-size:11px; font-weight:600; text-align:center; padding:3px 2px; background:none; border:none;">
        ${PACK_CURRENCIES.map((c) => `<option value="${esc(c.code)}" ${c.code === link.currency ? "selected" : ""}>${esc(c.symbol)}</option>`).join("")}
      </select>`;
    }
    if (cur.toLowerCase() === "gems") {
      return `<span class="pack-col-fixed" title="${esc(cur)}">${esc(cur)}</span>`;
    }
    const known = packResourceChoices(cur);
    const isKnown = known.some((n) => n.toLowerCase() === cur.toLowerCase());
    return `<select data-pt-colpick data-col="${ci}" class="pack-col-pick" title="${esc(cur)}" style="width:100%; max-width:60px; font-size:11px; font-weight:600; text-align:center; padding:3px 2px; background:none; border:none;">

      <option value="__remove__">${esc(t("pack_remove_column"))}</option>

  }
  function packLinkEditorHtml(tb) {
    const link = packLinkFor(tb.id);
    const resOpts = (selected) =>
      `<option value="">${esc(t("pack_col_unused"))}</option>` +
      packResourceChoices(selected).map((n) => `<option value="${esc(n)}" ${n === selected ? "selected" : ""}>${esc(materialDisplayName(n))}</option>`).join("");
    return `
      <details class="pack-link" data-packlink="${esc(tb.id)}" style="margin-top:12px; border-top:1px solid var(--line); padding-top:10px;">

        <p class="desc" style="font-size:11px; margin:8px 0;">${esc(t("pack_used_for_desc"))}</p>
        ${Object.values(packEffectiveCols(tb)).filter((r) => PACK_BUNDLE_NOTES[r]).map((r) => `<p class="desc" style="font-size:10.5px; margin:0 0 8px; color:var(--ice);">${esc(materialDisplayName(r))}: ${esc(PACK_BUNDLE_NOTES[r])}</p>`).join("")}
        <div style="display:flex; flex-wrap:wrap; gap:8px 14px; margin-bottom:10px;">
          ${PACK_PAGE_GROUPS.map((g) => `
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:12px;">
              <input type="checkbox" data-packgroup="${esc(g.key)}" ${g.pages.some((k) => link.pages.includes(k)) ? "checked" : ""} style="flex-shrink:0;" />

        </div>
        ${(() => {

              <input type="radio" name="${name}-${esc(tb.id)}" ${attr}="${val}" ${cur === val ? "checked" : ""} style="flex-shrink:0; margin-top:2px;" />
              <span style="flex:1 1 0; min-width:0;"><span style="font-weight:600;">${esc(label)}</span>${desc ? `<br><span class="meta" style="font-size:10.5px;">${esc(desc)}</span>` : ""}</span>
            </label>`;
          return `<div data-pkhowwrap style="display:${link.linkSet ? "none" : "block"};"><div class="meta" style="font-size:11px; font-weight:600; margin-bottom:6px;">${esc(t("pk_q1"))}</div>
          <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:10px;">
            ${radio("pkhow", "any", how, t("pk_any"), t("pk_any_desc"), "data-pkhow")}
            ${radio("pkhow", "tiers", how, t("pk_tiers"), t("pk_tiers_desc"), "data-pkhow")}
            ${radio("pkhow", "choice", how, t("pk_choice"), t("pk_choice_desc"), "data-pkhow")}
          </div>
          <div data-pkgiveswrap style="display:${how === "tiers" ? "block" : "none"}; margin:0 0 12px 24px; padding-inline-start:10px; border-inline-start:2px solid var(--line);">
            <div class="meta" style="font-size:11px; font-weight:600; margin-bottom:6px;">${esc(t("pk_q2"))}</div>
            <div style="display:flex; flex-direction:column; gap:6px;">
              ${radio("pkgives", "all", gives, t("pk_all"), t("pk_all_desc"), "data-pkgives")}
              ${radio("pkgives", "one_each", gives, t("pk_one_each"), t("pk_one_each_desc"), "data-pkgives")}
              ${radio("pkgives", "one_locked", gives, t("pk_one_locked"), t("pk_one_locked_desc"), "data-pkgives")}
            </div>
          </div></div>`;
        })()}
        ${(() => {
          // Same pack, several tables (Classic / Sublime / Exquisite...):
          // tick the partner tables; each step then picks one of them.
          const others = tables.filter((x) => x.id !== tb.id);
          if (!others.length) return "";
          const setId = link.linkSet;
          const members = setId ? packLinkSetMembers(setId).map((x) => String(x.id)) : [];
          const mode = link.lockOption ? "locked" : "each";
          return `<details data-pksamewrap ${setId ? "open" : ""} style="margin:0 0 12px; font-size:12px;">
            <summary style="cursor:pointer; color:var(--ice);">${esc(t("pk_same_title"))}${members.length > 1 ? ` (${members.length})` : ""}</summary>
            <p class="desc" style="font-size:10.5px; margin:6px 0 8px;">${esc(t("pk_same_desc"))}</p>
            <div style="display:flex; flex-direction:column; gap:5px; max-height:180px; overflow:auto; padding-inline-start:4px;">
              ${others.map((x) => `<label style="display:flex; align-items:center; gap:6px; cursor:pointer;"><input type="checkbox" data-pksame="${esc(x.id)}" ${members.includes(String(x.id)) ? "checked" : ""} style="flex-shrink:0;" /><span>${esc(x.title || "")}</span></label>`).join("")}
            </div>
            <div data-pksamemode style="display:${members.length > 1 ? "flex" : "none"}; flex-direction:column; gap:6px; margin-top:10px;">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="radio" name="pksamemode-${esc(tb.id)}" data-pksamemode="each" ${mode === "each" ? "checked" : ""} /><span>${esc(t("pk_same_each"))}</span></label>
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer;"><input type="radio" name="pksamemode-${esc(tb.id)}" data-pksamemode="locked" ${mode === "locked" ? "checked" : ""} /><span>${esc(t("pk_same_locked"))}</span></label>
            </div>

        ${(() => {
          const r = link.reset;
          const preset = typeof r === "number" ? (PACK_RESET_PRESETS.find((p) => p.days === r) || { key: "custom" }).key : r;
          return `
        <div style="display:flex; align-items:center; gap:8px 14px; flex-wrap:wrap; margin-bottom:6px; font-size:12px;">
          <label style="display:flex; align-items:center; gap:6px;">
            <span>${esc(t("pack_reset_every"))}</span>
            <select data-packreset style="font-size:12px;">

            <span class="meta" data-packresetdayslabel style="font-size:11px; ${preset === "custom" ? "" : "display:none;"}">${esc(t("pack_days_short_long"))}</span>
            <span class="meta" data-packanchorlabel style="font-size:11px; ${typeof r === "number" ? "" : "display:none;"}">${esc(t("pack_next_on"))}</span>
            <input type="date" data-packanchor value="${esc(link.resetDay || "")}" style="font-size:12px; padding:3px 6px; ${typeof r === "number" ? "" : "display:none;"}" />

          <label style="display:flex; align-items:center; gap:6px; ${typeof r === "number" && !link.sequential ? "" : "display:none;"}" data-packbuyswrap>
            <span>${esc(t("pack_buys_per_reset"))}</span>
            <input type="number" min="1" step="1" data-packbuys value="${link.buys}" style="width:56px; font-size:12px; padding:3px 6px;" />
          </label>
        </div>
        <p class="desc" style="font-size:10.5px; margin:0 0 10px;">${esc(t("pack_reset_desc"))}</p>`;
        })()}
        <div class="grid" style="grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:8px;">
          ${tb.columns.map((c, ci) => {
            // Price column, Gems, and any column already named after a
            // resource are sorted out by the header dropdown itself.
            if (ci === link.priceCol || packIsNonResourceColumn(c) || packResourceByName(c)) return "";
            return `
            <div>
              <div class="meta" style="font-size:10px; margin-bottom:3px;">${esc(c || "#" + (ci + 1))}</div>
              <select data-packcol="${ci}" style="width:100%;">${resOpts((link.cols || {})[ci])}</select>
            </div>`;
          }).join("")}
        </div>
      </details>`;
  }
  function wirePackLinkEditors() {
    listEl.querySelectorAll("[data-packlink]").forEach((box) => {
      const id = box.dataset.packlink;
      const current = () => {
        PACK_LINKS[id] = PACK_LINKS[id] || { pages: [], priceCol: 0, cols: {} };
        return PACK_LINKS[id];
      };
      box.querySelectorAll("[data-packgroup]").forEach((cb) => {
        cb.addEventListener("change", async () => {
          const l = current();
          const g = PACK_PAGE_GROUPS.find((x) => x.key === cb.dataset.packgroup);
          l.pages = Array.isArray(l.pages) ? l.pages : [];
          if (cb.checked) g.pages.forEach((k) => { if (!l.pages.includes(k)) l.pages.push(k); });
          else l.pages = l.pages.filter((k) => !g.pages.includes(k));
          await savePackLinks();
          const sum = box.querySelector("summary");
          const n = packGroupsChecked(l.pages);
          if (sum) sum.textContent = t("pack_used_for") + (n ? ` (${n})` : "");
          renderPageTabs();
        });
      });
      // Purchase type questions -> the underlying flags.
      const pick = (attr) => (box.querySelector(`[${attr}]:checked`) || {}).dataset?.[attr.replace("data-", "").replace(/-([a-z])/g, (m, c) => c.toUpperCase())];
      const isLadderKind = () => pick("data-pkhow") === "tiers";
      const applyKind = async () => {
        const l = current();
        const how = pick("data-pkhow"), gives = pick("data-pkgives") || "all";
        l.sequential = how === "tiers";
        l.choice = how === "choice";
        const opt = how === "tiers" && gives !== "all";
        l.colOptions = opt;
        if (l.linkSet) { l.sequential = true; l.choice = false; l.colOptions = false; l.option = true; }
        else { l.option = false; l.lockOption = opt && gives === "one_locked"; }
        box.querySelector("[data-pkgiveswrap]").style.display = how === "tiers" ? "block" : "none";
        syncResetUi();
        await savePackLinks();
      };
      box.querySelectorAll("[data-pkhow],[data-pkgives]").forEach((r) => r.addEventListener("change", applyKind));
      // Same pack, several tables: keep every member's flags in step.
      const sameBoxes = [...box.querySelectorAll("[data-pksame]")];
      const applySame = async () => {
        const l = current();
        const picked = sameBoxes.filter((cb) => cb.checked).map((cb) => cb.dataset.pksame);
        const setId = l.linkSet || String(id);
        const oldMembers = packLinkSetMembers(setId).map((x) => String(x.id)).filter((x) => x !== String(id));
        oldMembers.filter((x) => !picked.includes(x)).forEach((x) => { if (PACK_LINKS[x]) { delete PACK_LINKS[x].linkSet; PACK_LINKS[x].option = false; } });
        const lockedMode = (box.querySelector("[data-pksamemode]:checked") || {}).dataset?.pksamemode === "locked";
        if (picked.length) {
          [String(id), ...picked].forEach((x) => {
            PACK_LINKS[x] = PACK_LINKS[x] || { pages: [], priceCol: 0, cols: {} };
            const m = PACK_LINKS[x];
            m.linkSet = setId; m.sequential = true; m.choice = false; m.colOptions = false; m.option = true; m.lockOption = lockedMode;
          });
        } else {
          delete l.linkSet; l.option = false;
        }
        const modeWrap = box.querySelector("[data-pksamemode]");
        if (modeWrap) modeWrap.style.display = picked.length ? "flex" : "none";
        // Linked = bought in steps; the purchase-type questions step aside.
        const howWrap = box.querySelector("[data-pkhowwrap]");
        if (howWrap) howWrap.style.display = picked.length ? "none" : "block";
        const tiersRadio = box.querySelector('[data-pkhow="tiers"]');
        if (picked.length && tiersRadio) tiersRadio.checked = true;
        syncResetUi();
        const sum = box.querySelector("[data-pksamewrap] summary");
        if (sum) sum.textContent = t("pk_same_title") + (picked.length ? ` (${picked.length + 1})` : "");
        await savePackLinks();
      };
      sameBoxes.forEach((cb) => cb.addEventListener("change", applySame));
      box.querySelectorAll("[data-pksamemode]").forEach((r) => r.addEventListener("change", applySame));
      const resetSel = box.querySelector("[data-packreset]");
      const resetDays = box.querySelector("[data-packresetdays]");
      const resetDaysLabel = box.querySelector("[data-packresetdayslabel]");
      const buysWrap = box.querySelector("[data-packbuyswrap]");
      const buysIn = box.querySelector("[data-packbuys]");
      const anchorIn = box.querySelector("[data-packanchor]");
      const anchorLabel = box.querySelector("[data-packanchorlabel]");
      const syncResetUi = () => {
        const custom = resetSel.value === "custom";
        resetDays.style.display = custom ? "" : "none";
        resetDaysLabel.style.display = custom ? "" : "none";
        const isNumberReset = custom || PACK_RESET_PRESETS.some((p) => p.key === resetSel.value);
        anchorIn.style.display = isNumberReset ? "" : "none";
        anchorLabel.style.display = isNumberReset ? "" : "none";
        const isNumber = custom || PACK_RESET_PRESETS.some((p) => p.key === resetSel.value);
        buysWrap.style.display = isNumber && !isLadderKind() ? "" : "none";
        if (buysWrap.style.display === "" && buysWrap.querySelector("span")) buysWrap.querySelector("span").textContent = pick("data-pkhow") === "choice" ? t("pack_buys_per_reset_choice") : t("pack_buys_per_reset");
      };
      const saveReset = async () => {
        const l = current();
        const v = resetSel.value;
        if (v === "unlimited" || v === "once") l.reset = v;
        else if (v === "custom") l.reset = Math.max(1, Math.round(Number(resetDays.value) || 7));
        else l.reset = PACK_RESET_PRESETS.find((p) => p.key === v).days;
        l.buys = Math.max(1, Math.round(Number(buysIn.value) || 1));
        // The anchor date only means something for a repeating pack.
        if (typeof l.reset === "number" && anchorIn.value) l.resetDay = anchorIn.value; else delete l.resetDay;
        syncResetUi();
        await savePackLinks();
      };
      if (resetSel) resetSel.addEventListener("change", saveReset);
      if (resetDays) resetDays.addEventListener("change", saveReset);
      if (buysIn) buysIn.addEventListener("change", saveReset);
      if (anchorIn) anchorIn.addEventListener("change", saveReset);
      box.querySelectorAll("[data-packcol]").forEach((sel) => {
        sel.addEventListener("change", async () => {
          const l = current();
          l.cols = l.cols || {};
          if (sel.value) l.cols[sel.dataset.packcol] = sel.value;
          else delete l.cols[sel.dataset.packcol];
          await savePackLinks();
        });
      });
    });
  }

  function wireTable() {
    listEl.querySelectorAll("[data-packtable]").forEach((panel) => {
      const ti = Number(panel.dataset.packtable);
      const t = tables[ti];

      // Pulls every input's current DOM value (title, column names, cells)
      // back into `t` before any structural change re-renders the table -
      // otherwise typed/auto-scaled values that were only ever in the DOM
      // (not yet saved) would be lost the moment a row/column is added or
      // removed, since renderAll() rebuilds the table HTML from `t` itself.
      function syncFromDom() {
        const titleInput = panel.querySelector("[data-pt-title]");
        if (titleInput) t.title = titleInput.value;
        panel.querySelectorAll("[data-pt-colname]").forEach((inp) => {
          t.columns[Number(inp.dataset.col)] = inp.value;
        });
        panel.querySelectorAll("[data-pt-cell]").forEach((inp) => {
          t.rows[Number(inp.dataset.row)].cells[Number(inp.dataset.col)] = inp.value;
        });
      }

      // Persists the whole table to Supabase - creates it (POST) the first
      // time anything changes on a brand-new table, then PATCHes it from
      // then on. There's no Save button; every edit (typing, adding/removing
      // rows or columns, toggling scale) calls this so nothing is ever lost.
      async function persistTable() {
        PACK_PLAN_CACHE.clear();
        if (typeof budgetInvalidate === "function") budgetInvalidate();
        const payload = { title: t.title.trim() || "Table name here", columns: t.columns, rows: t.rows, sort_order: ti, scale_enabled: t.scale_enabled !== false, updated_at: new Date().toISOString() };
        try {
          if (String(t.id).startsWith("new-")) {
            const [saved] = await sb(`pack_tables`, { method: "POST", body: JSON.stringify({ user_id: USER_ID, ...payload }) });
            t.id = saved.id;
          } else {
            await sb(`pack_tables?id=eq.${t.id}`, { method: "PATCH", body: JSON.stringify(payload) });
          }
        } catch (err) {
          toast("Couldn't save that change", true);
        }
      }

      // Live auto-fill. Typing Row 1's Amount cascades the fixed Amount
      // sequence into every row below it. Typing ANY of Row 1's cells
      // (Amount or any other column, including a newly-added #1/#2, etc.)
      // recomputes ratios and re-fills every row - otherwise a column added
      // after other rows already had amounts would never pick up a ratio
      // until the Amount cell happened to be retyped. Gems always fills
      // (fixed universal price point); the ratio fill for every other
      // column only runs when Scale is on for tables that actually follow
      // a fixed proportional relationship.
      // The totals row follows every keystroke (and every auto-fill), so
      // it never waits for a re-render to catch up.
      const refreshTotals = () => refreshTotalsIn(panel, t);
      panel.addEventListener("input", (e) => {
        const cell = e.target.closest("[data-pt-cell]");
        if (!cell) return;
        if (cell.dataset.row === "0" && cell.dataset.col === "0") applyAmountSequence(panel, t);
        if (cell.dataset.col === "0") applyGemsLookup(panel, t);
        if (t.scale_enabled !== false && (cell.dataset.col === "0" || cell.dataset.row === "0")) applyRatioScale(panel, t);
        refreshTotals();
      });
      panel.addEventListener("change", (e) => { if (e.target.closest("[data-pt-cell]")) refreshTotals(); });

      // Persist on blur (change), not every keystroke - covers title,
      // column names, and cell edits (including whatever applyScale just
      // filled in programmatically, since syncFromDom re-reads the DOM).
      // A typed quantity is rounded up as soon as you leave the field, so
      // what's stored matches what's shown. The price column is left alone.
      // Typed values are kept exactly as typed (no reformatting on blur);
      // only the quantity columns' decimals are dropped, since items are whole.
      panel.addEventListener("change", (e) => {
        const cell = e.target.closest("[data-pt-cell]");
        if (!cell) return;
        const ci = Number(cell.dataset.col);
        if (ci === priceColOf(t)) return;
        if (/[.,]\d/.test(cell.value)) { const n = parseNum(cell.value); if (n != null) cell.value = String(Math.trunc(n)); }
      }, true);

      panel.addEventListener("change", (e) => {
        if (e.target.closest("[data-pt-title], [data-pt-colname], [data-pt-cell]")) {
          syncFromDom();
          persistTable();
        }
      });
      panel.querySelectorAll("[data-pt-rowmax]").forEach((inp) => inp.addEventListener("change", async () => {
        if (String(t.id).startsWith("new-")) { syncFromDom(); await persistTable(); }
        await ensurePackLinks();
        const l = (PACK_LINKS[String(t.id)] = PACK_LINKS[String(t.id)] || { pages: [], priceCol: 0, cols: {} });
        l.rowMax = (l.rowMax && typeof l.rowMax === "object") ? l.rowMax : {};
        const v = Math.round(Number(inp.value) || 0);
        if (v > 0) l.rowMax[inp.dataset.row] = v; else delete l.rowMax[inp.dataset.row];
        await savePackLinks();
        PACK_TABLES_CACHE = null;
      }));
      const groupInput = panel.querySelector("[data-pt-group]");
      if (groupInput) groupInput.addEventListener("change", async () => {
        syncFromDom();
        if (String(t.id).startsWith("new-")) await persistTable(); // needs a real id to link to
        await ensurePackLinks();
        const l = (PACK_LINKS[String(t.id)] = PACK_LINKS[String(t.id)] || { pages: [], priceCol: 0, cols: {} });
        l.group = groupInput.value.trim();
        await savePackLinks();
        PACK_TABLES_CACHE = null;
        renderAll();
      });

      // Picking a column's name also files it: "$" makes it the price column,
      // a resource assigns that resource, and Gems/custom names assign nothing.
      panel.querySelectorAll("[data-pt-currencypick]").forEach((sel) => {
        sel.addEventListener("change", async () => {
          const ci = Number(sel.dataset.col);
          syncFromDom();
          t.columns[ci] = packCurrencySymbol(sel.value);
          await persistTable();
          await ensurePackLinks();
          const l = (PACK_LINKS[String(t.id)] = PACK_LINKS[String(t.id)] || { pages: [], priceCol: 0, cols: {} });
          l.currency = sel.value;
          l.priceCol = ci;
          delete (l.cols || {})[ci];
          await savePackLinks();
          PACK_TABLES_CACHE = null;
          renderAll();
        });
      });
      panel.querySelectorAll("[data-pt-colpick]").forEach((sel) => {
        sel.addEventListener("change", async () => {
          const ci = Number(sel.dataset.col);
          let value = sel.value;
          if (value === "__remove__") {
            // Delete this column (and its cell in every row); the price and Gems columns stay.
            if (!confirm(t("pack_remove_column_confirm").replace("{name}", materialDisplayName(t.columns[ci] || "")))) { renderAll(); return; }
            syncFromDom();
            t.columns.splice(ci, 1);
            t.rows.forEach((r) => r.cells.splice(ci, 1));
            await ensurePackLinks();
            const l0 = PACK_LINKS[String(t.id)];
            if (l0) {
              if (l0.priceCol > ci) l0.priceCol--;
              const cols = {}; Object.entries(l0.cols || {}).forEach(([k, v]) => { const n = Number(k); if (n < ci) cols[n] = v; else if (n > ci) cols[n - 1] = v; }); l0.cols = cols;
              await savePackLinks();
            }
            renderAll();
            await persistTable();
            return;
          }
          if (value === "__custom__") {
            const typed = prompt(t("pack_custom_name_prompt"), t.columns[ci] || "");
            if (typed == null || !typed.trim()) { renderAll(); return; }
            value = typed.trim();
          }
          syncFromDom();
          t.columns[ci] = value;
          await persistTable();
          await ensurePackLinks();
          const l = (PACK_LINKS[String(t.id)] = PACK_LINKS[String(t.id)] || { pages: [], priceCol: 0, cols: {} });
          l.cols = l.cols || {};
          if (packIsNonResourceColumn(value) && value.toLowerCase() !== "gems") l.priceCol = ci;
          // Any earlier manual choice for this column is replaced by the name.
          delete l.cols[ci];
          await savePackLinks();
          PACK_TABLES_CACHE = null;
          renderAll();
        });
      });

      panel.querySelector("[data-pt-scaletoggle]").addEventListener("change", async (e) => {
        t.scale_enabled = e.target.checked;
        if (t.scale_enabled) {
          // The whole point of turning this on: immediately fill every row
          // from Row 1's ratios (and the Amount sequence itself), not just
          // wait for the next keystroke.
          applyAmountSequence(panel, t);
          applyScale(panel, t);
          syncFromDom();
        }
        await persistTable();
      });

      panel.querySelector("[data-pt-addcol]").addEventListener("click", async () => {
        syncFromDom();
        // Insert before the last column (Gems), not after it, so Gems stays last.
        const insertAt = t.columns.length - 1;
        t.columns.splice(insertAt, 0, `#${t.columns.length - 1}`);
        t.rows.forEach((r) => r.cells.splice(insertAt, 0, ""));
        renderAll();
        await persistTable();
      });
      panel.querySelector("[data-pt-addrow]").addEventListener("click", async () => {
        syncFromDom();
        t.rows.push(blankRow(t.columns.length));
        const newRowIndex = t.rows.length - 1;
        renderAll();
        // The new row starts blank - immediately fill it (Amount from the
        // fixed sequence, Gems, and ratio columns) instead of waiting for
        // the user to type something in it first. Scoped to just this one
        // row so any other rows you've already hand-edited aren't touched.
        // renderAll() rebuilt the DOM, so re-select the fresh panel rather
        // than using the stale one.
        const freshPanel = listEl.querySelector(`[data-packtable="${ti}"]`);
        if (freshPanel) {
          applyAmountSequence(freshPanel, t, newRowIndex);
          applyGemsLookup(freshPanel, t, newRowIndex);
          if (t.scale_enabled !== false) applyRatioScale(freshPanel, t, newRowIndex);
          freshPanel.querySelectorAll("[data-pt-cell]").forEach((inp) => {
            t.rows[Number(inp.dataset.row)].cells[Number(inp.dataset.col)] = inp.value;
          });
          refreshTotalsIn(freshPanel, t);
        }
        await persistTable();
      });
      // Duplicate: a full copy of the table (cells, columns, title) and of
      // its settings (pages, availability, ladder/choice, row limits,
      // group), placed right after the original.
      // Restore a game-pack table's original columns and numbers.
      const restoreBtn = panel.querySelector("[data-pt-restore]");
      if (restoreBtn) restoreBtn.addEventListener("click", async () => {
        const preset = PACK_PRESET_TABLES.find((pp) => pp.title === t.title);
        if (!preset || !confirm(t("pack_restore_confirm"))) return;
        t.columns = preset.columns.slice();
        t.rows = preset.rows.map((r) => ({ ...r, cells: r.cells.slice() }));
        t.scale_enabled = false;
        await persistTable();
        PACK_TABLES_CACHE = null;
        renderAll();
      });
      panel.querySelector("[data-pt-duplicate]").addEventListener("click", async () => {
        syncFromDom();
        if (String(t.id).startsWith("new-")) await persistTable();
        await ensurePackLinks();
        const payload = { title: `${t.title} (${window.t("pack_copy_suffix")})`, columns: t.columns.slice(), rows: t.rows.map((r) => ({ ...r, cells: r.cells.slice() })), sort_order: ti + 1, scale_enabled: t.scale_enabled !== false, updated_at: new Date().toISOString() };
        let saved;
        try {
          [saved] = await sb(`pack_tables`, { method: "POST", body: JSON.stringify({ user_id: USER_ID, ...payload }) });
        } catch (err) { toast("Couldn't duplicate table", true); return; }
        const src = PACK_LINKS[String(t.id)];
        if (src) PACK_LINKS[String(saved.id)] = JSON.parse(JSON.stringify(src));
        await savePackLinks();
        tables.splice(ti + 1, 0, { ...payload, id: saved.id });
        tables.forEach((tb, i) => { tb.sort_order = i; });
        PACK_TABLES_CACHE = null;
        renderAll();
        await Promise.all(tables.filter((tb) => !String(tb.id).startsWith("new-")).map((tb) => sb(`pack_tables?id=eq.${tb.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: tb.sort_order }) }).catch(() => null)));
      });
      panel.querySelector("[data-pt-delete]").addEventListener("click", async () => {
        if (!confirm(`Delete "${t.title}"? This can't be undone.`)) return;
        if (!String(t.id).startsWith("new-")) {
          try {
            await sb(`pack_tables?id=eq.${t.id}`, { method: "DELETE" });
          } catch (err) {
            toast("Couldn't delete table", true);
            return;
          }
        }
        tables.splice(ti, 1);
        renderAll();
      });
      panel.querySelector("[data-pt-delcollast]").addEventListener("click", async () => {
        syncFromDom();
        // Remove the last removable column - i.e. the one just before Gems
        // (Amount at 0 and Gems at the end are always locked in place).
        const ci = t.columns.length - 2;
        if (ci <= 0) { toast("Nothing left to remove between Amount and Gems", true); return; }
        t.columns.splice(ci, 1);
        t.rows.forEach((r) => r.cells.splice(ci, 1));
        renderAll();
        await persistTable();
      });
      panel.querySelector("[data-pt-delrowlast]").addEventListener("click", async () => {
        syncFromDom();
        if (t.rows.length <= 1) { toast("Keep at least one row (Row 1 sets the scale)", true); return; }
        t.rows.pop();
        renderAll();
        await persistTable();
      });
    });
  }

  document.getElementById("packsAddTable").addEventListener("click", async () => {
    tables.unshift({
      id: `new-${Date.now()}`,
      title: "Table name here",
      columns: ["$", "#1", "#2", "Gems"],
      rows: [blankRow(4)],
      sort_order: 0,
      scale_enabled: true,
    });
    // Renumber everyone so the new table is first and existing tables shift
    // down, then persist that new order for any table already saved (so a
    // reload reflects it immediately, not just after each is re-saved).
    tables.forEach((tb, i) => { tb.sort_order = i; });
    renderAll();
    const updates = tables
      .filter((tb) => !String(tb.id).startsWith("new-"))
      .map((tb) => sb(`pack_tables?id=eq.${tb.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: tb.sort_order }) }).catch(() => null));
    await Promise.all(updates);
  });

  renderAll();
}

// BACKPACK / INVENTORY PAGE
// Item catalog + quantity-on-hand tracker.
// ============================================================
async function renderInventory() {
  const [items, inventory] = await Promise.all([
    sb(`items?select=id,name,category,tier&order=name.asc`),
    sb(`player_inventory?select=id,item_id,quantity&user_id=eq.${USER_ID}`),
  ]);
  const invByItem = Object.fromEntries(inventory.map((i) => [i.item_id, i]));

  content.innerHTML = `
    <div class="panel">
      <h2>${esc(t("your_backpack"))}</h2>
      <p class="desc">${esc(t("manage_item_catalog_desc"))}</p>
      <div id="invList"></div>
    </div>
  `;

  const listEl = document.getElementById("invList");
  if (!items.length) {
    listEl.innerHTML = `<div class="empty"><div class="big">${esc(t("no_items_yet"))}</div>${esc(t("add_item_above"))}</div>`;
    return;
  }
  listEl.innerHTML = items
    .map((it) => {
      const inv = invByItem[it.id];
      const qty = inv ? Number(inv.quantity) : 0;
      return `<div class="row">
        <div>
          <div class="name">${esc(it.name)} <span class="pill">${esc(it.category)}${it.tier ? " &middot; " + esc(it.tier) : ""}</span></div>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="meta mono">${qty.toLocaleString()}</div>
          <button class="btn small ghost" data-item="${it.id}" data-inv="${inv ? inv.id : ""}" data-qty="${qty}">${esc(t("update_button"))}</button>
        </div>
      </div>`;
    })
    .join("");

  listEl.querySelectorAll("button[data-item]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const qty = prompt(t("quantity_prompt"), btn.dataset.qty);
      if (qty === null) return;
      const itemId = btn.dataset.item;
      const invId = btn.dataset.inv;
      const body = { quantity: Number(qty) || 0, updated_at: new Date().toISOString() };
      try {
        if (invId) {
          await sb(`player_inventory?id=eq.${invId}`, { method: "PATCH", body: JSON.stringify(body) });
        } else {
          await sb(`player_inventory`, { method: "POST", body: JSON.stringify({ user_id: USER_ID, item_id: itemId, ...body }) });
        }
        toast("Inventory updated");
        renderInventory();
      } catch (err) {
        toast("Couldn't update inventory", true);
      }
    });
  });
}

// ============================================================
// GENERIC BUFF CATEGORY SYSTEM
// A single shared "master" matrix table (buff_tables/columns/rows/
// cells) backs every dynamic nav category (Facility, Research,
// Chief, Charm, Pets, VIP Tier, War Acd., etc). Each category is a
// column; each row is a named stat line (e.g. "Infantry ATT").
// Categories can be grouped into sub-nav (see CATEGORY_GROUPS) or
// nested under Heroes/Extra Buff.
// ============================================================
// Fetches (or lazily creates) the one shared buff matrix table.
let BUFF_TABLE_PROMISE = null;
function ensureBuffTable() {
  if (BUFF_TABLE_ID) return Promise.resolve(BUFF_TABLE_ID);
  // Callers running at the same time share one lookup (and can never both
  // create a table).
  if (!BUFF_TABLE_PROMISE) {
    BUFF_TABLE_PROMISE = ensureBuffTableOnce().catch((e) => { BUFF_TABLE_PROMISE = null; throw e; });
  }
  return BUFF_TABLE_PROMISE;
}
async function ensureBuffTableOnce() {
  if (BUFF_TABLE_ID) return BUFF_TABLE_ID;
  // The buff matrix is site reference data: everyone (visitors included)
  // reads the owner's master table. Only the owner can ever create one.
  const existing = await sb(`buff_tables?select=id&user_id=eq.${PROGRESSION_OWNER_ID}&name=neq.VIP%20Tier&order=created_at.asc&limit=1`);
  if (existing && existing.length) {
    BUFF_TABLE_ID = existing[0].id;
  } else if (IS_OWNER) {
    const [created] = await sb(`buff_tables`, {
      method: "POST",
      body: JSON.stringify({ user_id: USER_ID, name: "Buffs", sort_order: 0 }),
    });
    BUFF_TABLE_ID = created.id;
  } else {
    BUFF_TABLE_ID = null;
  }
  return BUFF_TABLE_ID;
}

// Rebuilds the sidebar's dynamic category buttons from the buff
// matrix's columns, excluding any pulled into Heroes/Extra Buff/
// grouped sub-nav so they don't appear twice.
async function loadBuffCategories() {
  await ensureBuffTable();
  const columns = !BUFF_TABLE_ID ? [] : await sb(`buff_columns?table_id=eq.${BUFF_TABLE_ID}&select=id,name,category&order=sort_order.asc`);
  const grouped = [];
  const seen = new Map();
  for (const c of columns) {
    const key = c.category || c.name;
    if (!seen.has(key)) {
      seen.set(key, { name: key, columns: [] });
      grouped.push(seen.get(key));
    }
    seen.get(key).columns.push(c);
  }
  BUFF_CATEGORIES = grouped;

  const HERO_SUBCATS = new Set(["Jero", "Natalia", "Hero Gears"]);
  const GROUPED_CHILDREN = new Set(Object.values(CATEGORY_GROUPS).flat());
  const EXTRA_BUFF_SET = new Set(EXTRA_BUFF_SUBCATS);
  const HIDDEN_BUFF_CATS = new Set(["Chief Bonus", "Charm", "Chief", "Extra Buff", "Buff", "Skins", "Islands", "War Acd.", "Research", "Pets", "Expert", "Exp. Research"]);
  const holder = document.getElementById("dynamicTabs");
  if (holder) {
    holder.innerHTML = BUFF_CATEGORIES.filter(
      (c) => !HERO_SUBCATS.has(c.name) && !GROUPED_CHILDREN.has(c.name) && !EXTRA_BUFF_SET.has(c.name) && !HIDDEN_BUFF_CATS.has(c.name)
    )
      .map((c) => `<button data-tab="buffcat:${esc(c.name)}"><span class="ic">&#9670;</span>${esc(EXTRA_BUFF_LABELS[c.name] || c.name)}</button>`)
      .join("");
  }
  document.querySelectorAll("#tabs button[data-tab]").forEach((b) => {
    b.classList.toggle("active", b.dataset.tab === TAB);
  });
}

// Top-level wrapper for a single buff category page.
async function renderCategoryPage(categoryName) {
  await renderCategoryInto(content, categoryName, renderCategoryPage);
}

// Renders one category's row list (name + value) into any target
// element, with inline add/update controls. Reused by top-level
// category pages, Heroes sub-nav, and grouped sub-nav pages.
async function renderCategoryInto(target, categoryName, rerenderFn) {
  await ensureBuffTable();
  const cat = BUFF_CATEGORIES.find((c) => c.name === categoryName);
  if (!cat) {
    target.innerHTML = `<div class="empty">Category not found.</div>`;
    return;
  }
  const refresh = rerenderFn || ((name) => renderCategoryInto(target, name, rerenderFn));
  const rows = await sb(`buff_rows?table_id=eq.${BUFF_TABLE_ID}&select=id,name,sort_order,buff_cells(value,column_id)&order=sort_order.asc`);

  target.innerHTML = `
    <div class="panel">
      <h2>${esc(categoryName)}</h2>
      <p class="desc">Values tracked for this category.</p>
      <div id="catRows-${esc(categoryName)}"></div>
      <form class="inline" id="addRowForm-${esc(categoryName)}" style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">
        <input class="flex1" name="rowName" placeholder="Add a stat line, e.g. Infantry ATT" />
        <input class="field-num" name="rowValue" type="number" step="any" placeholder="Value" />
        <button class="btn small" type="submit">Add</button>
      </form>
      <div class="err" id="addRowErr-${esc(categoryName)}"></div>
    </div>
  `;

  const rowsEl = target.querySelector(`#catRows-${CSS.escape(categoryName)}`);
  const colIds = cat.columns.map((c) => c.id);
  const rowsHtml = rows
    .map((r) => {
      const cellsByCol = Object.fromEntries(r.buff_cells.map((c) => [c.column_id, c.value]));
      const v = colIds.map((id) => cellsByCol[id]).find((x) => x != null);
      return `<div class="row">
        <div class="name">${esc(r.name)}</div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="meta mono">${v != null ? Number(v).toLocaleString() : "\u2014"}</div>
          <button class="btn small ghost" data-row="${r.id}" data-val="${v ?? ""}">Update</button>
        </div>
      </div>`;
    })
    .join("");
  rowsEl.innerHTML = rowsHtml || `<div class="empty"><div class="big">No stat lines yet.</div>Add one below.</div>`;

  rowsEl.querySelectorAll("button[data-row]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const val = prompt("Value:", btn.dataset.val);
      if (val === null) return;
      const num = Number(val);
      if (Number.isNaN(num)) { toast("Enter a valid number", true); return; }
      try {
        await sb(`buff_cells`, {
          method: "POST",
          headers: { Prefer: "resolution=merge-duplicates,return=representation" },
          body: JSON.stringify({ row_id: btn.dataset.row, column_id: cat.columns[0].id, value: num }),
        });
        toast("Updated");
        refresh(categoryName);
      } catch (err) {
        toast("Couldn't update value", true);
      }
    });
  });

  target.querySelector(`#addRowForm-${CSS.escape(categoryName)}`).addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = target.querySelector(`#addRowErr-${CSS.escape(categoryName)}`);
    errEl.textContent = "";
    const name = f.rowName.value.trim();
    if (!name) { errEl.textContent = "Enter a stat line name first"; return; }
    const valueRaw = f.rowValue.value.trim();
    try {
      const [rowRow] = await sb(`buff_rows`, {
        method: "POST",
        body: JSON.stringify({ table_id: BUFF_TABLE_ID, name, sort_order: rows.length }),
      });
      if (valueRaw !== "") {
        await sb(`buff_cells`, {
          method: "POST",
          body: JSON.stringify({ row_id: rowRow.id, column_id: cat.columns[0].id, value: Number(valueRaw) }),
        });
      }
      toast("Stat line added");
      refresh(categoryName);
    } catch (err) {
      errEl.textContent = "Couldn't add stat line \u2014 name may already exist";
    }
  });
}

// Renders a comma-separated materials string with inline icons.
function renderMaterialsWithIcons(materials) {
  if (!materials) return "\u2014";
  return materials
    .split(",")
    .map((part) => {
      const trimmed = part.trim();
      const lower = trimmed.toLowerCase();
      const iconKey = Object.keys(MATERIAL_ICONS).find((k) => lower.includes(k));

        ? `<img src="${MATERIAL_ICONS[iconKey]}" alt="" style="width:15px; height:15px; object-fit:contain; vertical-align:-3px; margin-right:3px;" loading="lazy" />`
