async function renderAdminFlatLevels(body, cfg) {
  const cols = ["id", ...cfg.cols.map((c) => c.key)].join(",");
  const rows = await sb(`${cfg.table}?select=${cols}&order=${cfg.orderCol}.asc`);

  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Add a row</h2>
      <form class="inline" id="adminFlatAddForm">
        ${cfg.cols.map((c) => `<input class="field-num" name="${c.key}" placeholder="${esc(c.label)}" ${c.type === "number" ? 'type="number" step="any"' : ""} style="width:130px;" />`).join("")}
        <button class="btn" type="submit">Add row</button>
      </form>
      <div class="err" id="adminFlatAddErr"></div>
    </div>
    <div class="panel">
      <h2>${esc(cfg.title)} (${rows.length})</h2>
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <thead><tr>
            ${cfg.cols.map((c) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${esc(c.label)}</th>`).join("")}
            <th></th>
          </tr></thead>
          <tbody>
            ${rows
              .map(
                (r) => `
              <tr data-flatrow="${r.id}">
                ${cfg.cols
                  .map(
                    (c) =>
                      `<td style="padding:4px;"><input data-f="${c.key}" ${c.type === "number" ? 'type="number" step="any"' : ""} value="${esc(r[c.key] ?? "")}" style="width:110px;" /></td>`
                  )
                  .join("")}
                <td style="padding:4px; white-space:nowrap;">
                  <button class="btn small ghost" data-flatsave="${r.id}">Save</button>
                  <button class="btn small ghost" data-flatdel="${r.id}" style="color:var(--danger);">Delete</button>
                </td>
              </tr>`
              )
              .join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  body.querySelectorAll("[data-flatsave]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.flatsave;
      const tr = body.querySelector(`tr[data-flatrow="${id}"]`);
      const patch = {};
      tr.querySelectorAll("[data-f]").forEach((el) => {
        const c = cfg.cols.find((c) => c.key === el.dataset.f);
        let v = el.value;
        if (c.type === "number") v = v === "" ? null : Number(v);
        patch[el.dataset.f] = v;
      });
      try {
        await sb(`${cfg.table}?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });
        if (cfg.onSave) cfg.onSave();
        toast("Saved");
      } catch (err) {
        toast("Couldn't save", true);
      }
    });
  });
  body.querySelectorAll("[data-flatdel]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this row?")) return;
      try {
        await sb(`${cfg.table}?id=eq.${btn.dataset.flatdel}`, { method: "DELETE" });
        if (cfg.onSave) cfg.onSave();
        toast("Deleted");
        renderAdminFlatLevels(body, cfg);
      } catch (err) {
        toast("Couldn't delete", true);
      }
    });
  });

  document.getElementById("adminFlatAddForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminFlatAddErr");
    errEl.textContent = "";
    const payload = {};
    cfg.cols.forEach((c) => {
      let v = f[c.key].value;
      if (c.key === "sort_order" && v === "") {
        const maxOrder = rows.reduce((m, r) => Math.max(m, r.sort_order || 0), -1);
        v = maxOrder + 1;
      } else if (c.type === "number") {
        v = v === "" ? 0 : Number(v);
      }
      payload[c.key] = v;
    });
    try {
      await sb(`${cfg.table}`, { method: "POST", body: JSON.stringify(payload) });
      if (cfg.onSave) cfg.onSave();
      toast("Row added");
      renderAdminFlatLevels(body, cfg);
    } catch (err) {
      errEl.textContent = "Couldn't add row";
    }
  });
}

// ---- VIP editor (buff matrix: rows = tiers, columns = Attack/Defense/Lethality/Health) ----
async function renderAdminVip(body) {
  let [table] = await sb(`buff_tables?name=eq.VIP Tier&user_id=eq.${USER_ID}&select=id`);
  if (!table) {
    const [created] = await sb(`buff_tables`, { method: "POST", body: JSON.stringify({ user_id: USER_ID, name: "VIP Tier", sort_order: 0 }) });
    table = created;
  }
  let columns = await sb(`buff_columns?table_id=eq.${table.id}&select=id,name&order=sort_order.asc`);
  const STAT_NAMES = ["Attack", "Defense", "Lethality", "Health"];
  // Auto-create the 4 stat columns if missing.
  for (const statName of STAT_NAMES) {
    if (!columns.find((c) => c.name === statName)) {
      const [created] = await sb(`buff_columns`, { method: "POST", body: JSON.stringify({ table_id: table.id, name: statName, category: statName, sort_order: STAT_NAMES.indexOf(statName) }) });
      columns.push(created);
    }
  }
  const colByName = Object.fromEntries(columns.map((c) => [c.name, c.id]));
  const rows = await sb(`buff_rows?table_id=eq.${table.id}&select=id,name,sort_order,buff_cells(id,value,column_id)&order=sort_order.asc`);

  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Add a VIP tier</h2>
      <form class="inline" id="adminVipAddForm">
        <input class="flex1" name="name" placeholder="Tier name (e.g. VIP 12)" required />
        <button class="btn" type="submit">Add tier</button>
      </form>
      <div class="err" id="adminVipAddErr"></div>
    </div>
    <div class="panel">
      <h2>VIP tiers (${rows.length})</h2>
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <thead><tr>
            <th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">Tier</th>
            ${STAT_NAMES.map((s) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${s} %</th>`).join("")}
            <th></th>
          </tr></thead>
          <tbody>
            ${rows
              .map((r) => {
                const cellByCol = Object.fromEntries(r.buff_cells.map((c) => [c.column_id, c.value]));
                return `
              <tr data-viprow="${r.id}">
                <td style="padding:4px;"><input data-vipname value="${esc(r.name)}" style="width:100px;" /></td>
                ${STAT_NAMES.map((s) => `<td style="padding:4px;"><input data-vipstat="${esc(s)}" type="number" step="any" value="${cellByCol[colByName[s]] ?? ""}" style="width:90px;" /></td>`).join("")}
                <td style="padding:4px; white-space:nowrap;">
                  <button class="btn small ghost" data-vipsave="${r.id}">Save</button>
                  <button class="btn small ghost" data-vipdel="${r.id}" style="color:var(--danger);">Delete</button>
                </td>
              </tr>`;
              })
              .join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  body.querySelectorAll("[data-vipsave]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.vipsave;
      const tr = body.querySelector(`tr[data-viprow="${id}"]`);
      const name = tr.querySelector("[data-vipname]").value.trim();
      try {
        await sb(`buff_rows?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ name }) });
        for (const s of STAT_NAMES) {
          const v = tr.querySelector(`[data-vipstat="${s}"]`).value;
          const colId = colByName[s];
          const existing = await sb(`buff_cells?row_id=eq.${id}&column_id=eq.${colId}&select=id`);
          if (existing.length) {
            await sb(`buff_cells?id=eq.${existing[0].id}`, { method: "PATCH", body: JSON.stringify({ value: v === "" ? null : Number(v) }) });
          } else if (v !== "") {
            await sb(`buff_cells`, { method: "POST", body: JSON.stringify({ row_id: id, column_id: colId, value: Number(v) }) });
          }
        }
        VIP_ROWS_CACHE = null;
        toast("Saved");
      } catch (err) {
        toast("Couldn't save", true);
      }
    });
  });
  body.querySelectorAll("[data-vipdel]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this VIP tier?")) return;
      try {
        await sb(`buff_rows?id=eq.${btn.dataset.vipdel}`, { method: "DELETE" });
        VIP_ROWS_CACHE = null;
        toast("Deleted");
        renderAdminVip(body);
      } catch (err) {
        toast("Couldn't delete", true);
      }
    });
  });

  document.getElementById("adminVipAddForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminVipAddErr");
    errEl.textContent = "";
    const name = f.name.value.trim();
    if (!name) { errEl.textContent = "Enter a tier name"; return; }
    try {
      const maxOrder = rows.reduce((m, r) => Math.max(m, r.sort_order || 0), 0);
      await sb(`buff_rows`, { method: "POST", body: JSON.stringify({ table_id: table.id, name, sort_order: maxOrder + 1 }) });
      VIP_ROWS_CACHE = null;
      toast("Tier added");
      renderAdminVip(body);
    } catch (err) {
      errEl.textContent = "Couldn't add tier";
    }
  });
}

// ---- Facility / Alliance Tech editor (skins table, filtered by category) ----
async function renderAdminSkinsCategory(body, category) {
  const rows = await sb(
    `skins?user_id=eq.${USER_ID}&category=eq.${encodeURIComponent(category)}&select=id,name,image_url,bonus_type,bonus_value,current_level,max_level,owned,sort_order,show_count_toggle&order=sort_order.asc`
  );

  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Add a ${esc(category)} item</h2>
      <form class="inline" id="adminSkinsAddForm">
        <input class="flex1" name="name" placeholder="Name" required />
        <span style="display:inline-flex; gap:4px; align-items:center;"><input class="field-num" name="image_url" placeholder="Image URL" style="width:180px;" />${uploadBtnHtml()}</span>
        <input class="field-num" name="bonus_type" placeholder="Bonus stat (e.g. Attack)" style="width:130px;" />
        <input class="field-num" name="bonus_value" type="number" step="any" placeholder="Bonus %" style="width:90px;" />
        <input class="field-num" name="max_level" type="number" placeholder="Max level" style="width:90px;" />
        <button class="btn" type="submit">Add item</button>
      </form>
      <div class="err" id="adminSkinsAddErr"></div>
    </div>
    <div class="panel">
      <h2>${esc(category)} (${rows.length})</h2>
      <p class="desc">"Has count trigger" shows a "Count in max" checkbox on that item's card and moves it below the divider line (used on Frame for unverified items).</p>
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <thead><tr>
            ${["Name", "Image URL", "Bonus stat", "Bonus %", "Current lvl", "Max lvl", "Owned", "Has count trigger", "Order", ""]
              .map((h) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${h}</th>`)
              .join("")}
          </tr></thead>
          <tbody>
            ${rows
              .map(
                (r) => `
              <tr data-skinrow="${r.id}">
                <td style="padding:4px;"><input data-f="name" value="${esc(r.name)}" style="width:110px;" /></td>
                <td style="padding:4px;"><span style="display:inline-flex; gap:4px; align-items:center;"><input data-f="image_url" value="${esc(r.image_url || "")}" style="width:150px;" />${uploadBtnHtml()}</span></td>
                <td style="padding:4px;"><input data-f="bonus_type" value="${esc(r.bonus_type || "")}" style="width:100px;" /></td>
                <td style="padding:4px;"><input data-f="bonus_value" type="number" step="any" value="${r.bonus_value ?? ""}" style="width:70px;" /></td>
                <td style="padding:4px;"><input data-f="current_level" type="number" value="${r.current_level ?? ""}" style="width:70px;" /></td>
                <td style="padding:4px;"><input data-f="max_level" type="number" value="${r.max_level ?? ""}" style="width:70px;" /></td>
                <td style="padding:4px;"><input data-f="owned" type="checkbox" ${r.owned ? "checked" : ""} /></td>
                <td style="padding:4px;"><input data-f="show_count_toggle" type="checkbox" ${r.show_count_toggle ? "checked" : ""} /></td>
                <td style="padding:4px;"><input data-f="sort_order" type="number" value="${r.sort_order ?? 0}" style="width:56px;" /></td>
                <td style="padding:4px; white-space:nowrap;">
                  <button class="btn small ghost" data-skinmoveup="${r.id}" title="Move up" style="padding:4px 8px;">&#8593;</button>
                  <button class="btn small ghost" data-skinmovedown="${r.id}" title="Move down" style="padding:4px 8px;">&#8595;</button>
                  <button class="btn small ghost" data-skinsave="${r.id}">Save</button>
                  <button class="btn small ghost" data-skindel="${r.id}" style="color:var(--danger);">Delete</button>
                </td>
              </tr>`
              )
              .join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  body.querySelectorAll("[data-skinmoveup]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const idx = rows.findIndex((r) => r.id === btn.dataset.skinmoveup);
      if (idx <= 0) return;
      const a = rows[idx], b = rows[idx - 1];
      await Promise.all([
        sb(`skins?id=eq.${a.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: b.sort_order }) }),
        sb(`skins?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: a.sort_order }) }),
      ]);
      renderAdminSkinsCategory(body, category);
    });
  });
  body.querySelectorAll("[data-skinmovedown]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const idx = rows.findIndex((r) => r.id === btn.dataset.skinmovedown);
      if (idx === -1 || idx >= rows.length - 1) return;
      const a = rows[idx], b = rows[idx + 1];
      await Promise.all([
        sb(`skins?id=eq.${a.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: b.sort_order }) }),
        sb(`skins?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: a.sort_order }) }),
      ]);
      renderAdminSkinsCategory(body, category);
    });
  });

  body.querySelectorAll("[data-skinsave]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.skinsave;
      const tr = body.querySelector(`tr[data-skinrow="${id}"]`);
      const patch = {};
      tr.querySelectorAll("[data-f]").forEach((el) => {
        const f = el.dataset.f;
        if (f === "owned" || f === "show_count_toggle") { patch[f] = el.checked; return; }
        let v = el.value;
        if (["bonus_value", "current_level", "max_level", "sort_order"].includes(f)) v = v === "" ? null : Number(v);
        else if (v.trim() === "") v = null;
        patch[f] = v;
      });
      try {
        await sb(`skins?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });
        toast("Saved");
      } catch (err) {
        toast("Couldn't save", true);
      }
    });
  });
  body.querySelectorAll("[data-skindel]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this item?")) return;
      try {
        await sb(`skins?id=eq.${btn.dataset.skindel}`, { method: "DELETE" });
        toast("Deleted");
        renderAdminSkinsCategory(body, category);
      } catch (err) {
        toast("Couldn't delete", true);
      }
    });
  });

  document.getElementById("adminSkinsAddForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminSkinsAddErr");
    errEl.textContent = "";
    const name = f.name.value.trim();
    if (!name) { errEl.textContent = "Enter a name"; return; }
    try {
      const maxOrder = rows.reduce((m, r) => Math.max(m, r.sort_order || 0), 0);
      await sb(`skins`, {
        method: "POST",
        body: JSON.stringify({
          user_id: USER_ID,
          category,
          name,
          image_url: f.image_url.value.trim() || null,
          bonus_type: f.bonus_type.value.trim() || null,
          bonus_value: f.bonus_value.value === "" ? null : Number(f.bonus_value.value),
          max_level: f.max_level.value === "" ? null : Number(f.max_level.value),
          current_level: 0,
          owned: false,
          sort_order: maxOrder + 1,
        }),
      });
      toast("Item added");
      renderAdminSkinsCategory(body, category);
    } catch (err) {
      errEl.textContent = "Couldn't add item";
    }
  });
}

// ---- Progression Tables editor (Chief Gear, Hero Gear Mastery Forging/Enhancement/Empowerment) ----
async function renderAdminProgression(body, nameFilter) {
  let tables = await sb(`progression_tables?select=id,name&order=name.asc`);
  if (nameFilter) tables = tables.filter((t) => nameFilter.includes(t.name));
  if (!ADMIN_ACTIVE_PROGRESSION || !tables.find((t) => t.id === ADMIN_ACTIVE_PROGRESSION)) {
    ADMIN_ACTIVE_PROGRESSION = tables[0] ? tables[0].id : null;
  }
  const activeTableName = tables.find((t) => t.id === ADMIN_ACTIVE_PROGRESSION)?.name || "";
  const isChiefGear = activeTableName === "Chief Gear";
  const isHeroGear = activeTableName.startsWith("Hero Gear");
  const materialCols = isChiefGear
    ? [
        { key: "hardened_alloy", label: "Hardened Alloy", type: "number" },
        { key: "polishing_solution", label: "Polishing Solution", type: "number" },
        { key: "design_plan", label: "Design Plan", type: "number" },
        { key: "amber", label: "Amber", type: "number" },
      ]
    : isHeroGear
    ? [
        { key: "mithril", label: "Mithril", type: "number" },
        { key: "mythic_gear", label: "Mythic Gear", type: "number" },
        { key: "xp_component", label: "XP Component", type: "number" },
        { key: "essence_stones", label: "Essence Stones", type: "number" },
      ]
    : [{ key: "materials", label: "Materials", type: "text" }];
  const cols = [
    { key: "sort_order", label: "Order", type: "number" },
    { key: "tier", label: "Tier", type: "text" },
    { key: "stars", label: "Stars", type: "number" },
    { key: "level", label: "Level", type: "number" },
    { key: "stage", label: "Stage", type: "text" },
    { key: "stat", label: "Stat", type: "text" },
    ...(isChiefGear ? [] : [{ key: "stat2", label: "Stat 2", type: "text" }]),
    ...materialCols,
    { key: "power", label: "Power", type: "number" },
    { key: "display_label", label: "Dropdown text (override)", type: "text" },
  ];

  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Pick a table</h2>
      <select id="adminProgPicker" style="width:260px;">
        ${tables.map((t) => `<option value="${t.id}" ${t.id === ADMIN_ACTIVE_PROGRESSION ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
      </select>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>Add a row</h2>
      <form class="inline" id="adminProgAddForm">
        ${cols.map((c) => `<input class="field-num" name="${c.key}" placeholder="${esc(c.label)}" ${c.type === "number" ? 'type="number" step="any"' : ""} style="width:100px;" />`).join("")}
        <button class="btn" type="submit">Add row</button>
      </form>
      <div class="err" id="adminProgAddErr"></div>
    </div>
    <div class="panel">
      <h2 id="adminProgHeading">Rows</h2>
      <div id="adminProgWrap" style="overflow-x:auto;"></div>
    </div>
  `;

  document.getElementById("adminProgPicker").addEventListener("change", (e) => {
    ADMIN_ACTIVE_PROGRESSION = e.target.value;
    renderAdminProgression(body, nameFilter);
  });

  function invalidateCaches() {
    CHIEF_GEAR_ROWS = null;
    HERO_GEAR_TABLES_CACHE = null;
  }

  async function loadRows() {
    const selectCols = ["id", ...cols.map((c) => c.key)].join(",");
    const rows = await sb(`progression_rows?table_id=eq.${ADMIN_ACTIVE_PROGRESSION}&select=${selectCols}&order=sort_order.asc`);
    document.getElementById("adminProgHeading").textContent = `Rows (${rows.length})`;
    const wrap = document.getElementById("adminProgWrap");
    wrap.innerHTML = `
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <thead><tr>
          ${cols.map((c) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${esc(c.label)}</th>`).join("")}
          <th></th>
        </tr></thead>
        <tbody>
          ${rows
            .map(
              (r) => `
            <tr data-progrow="${r.id}">
              ${cols
                .map(
                  (c) =>
                    `<td style="padding:4px;"><input data-f="${c.key}" ${c.type === "number" ? 'type="number" step="any"' : ""} value="${esc(r[c.key] ?? "")}" style="width:${c.key === "materials" ? "220px" : "90px"};" /></td>`
                )
                .join("")}
              <td style="padding:4px; white-space:nowrap;">
                <button class="btn small ghost" data-progsave="${r.id}">Save</button>
                <button class="btn small ghost" data-progdel="${r.id}" style="color:var(--danger);">Delete</button>
              </td>
            </tr>`
                )
            .join("")}
        </tbody>
      </table>
    `;

    wrap.querySelectorAll("[data-progsave]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.progsave;
        const tr = wrap.querySelector(`tr[data-progrow="${id}"]`);
        const patch = {};
        tr.querySelectorAll("[data-f]").forEach((el) => {
          const c = cols.find((c) => c.key === el.dataset.f);
          let v = el.value;
          if (c.type === "number") v = v === "" ? null : Number(v);
          else if (v.trim() === "") v = null;
          patch[el.dataset.f] = v;
        });
        try {
          await sb(`progression_rows?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });
          invalidateCaches();
          toast("Saved");
        } catch (err) {
          toast("Couldn't save", true);
        }
      });
    });
    wrap.querySelectorAll("[data-progdel]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this row?")) return;
        try {
          await sb(`progression_rows?id=eq.${btn.dataset.progdel}`, { method: "DELETE" });
          invalidateCaches();
          toast("Deleted");
          loadRows();
        } catch (err) {
          toast("Couldn't delete", true);
        }
      });
    });
  }

  document.getElementById("adminProgAddForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminProgAddErr");
    errEl.textContent = "";
    const payload = { table_id: ADMIN_ACTIVE_PROGRESSION };

    const STAR_CURVE = [0.13789, 0.14963, 0.16137, 0.17311, 0.18485, 0.20598, 0.22242, 0.23886, 0.25530, 0.27174, 0.28818, 0.31775, 0.34073, 0.36376, 0.38679, 0.40977, 0.43280, 0.47422, 0.50645, 0.53862, 0.57085, 0.60307, 0.63529, 0.69330, 0.73836, 0.78347, 0.82858, 0.87370, 0.91881, 1];

        const g = (f) => num(tr.querySelector(`[data-wf="${f}"]`).value);
        const le = g("leth_pct");
        if (le != null) widgetPayload.push({ generation: selectedGen, level: Number(tr.dataset.widgetlvl), leth_pct: le, hp_pct: le });
      });
      try {
        if (starPayload.length) await sb(`hero_gen_star_stats`, { method: "POST", body: JSON.stringify(starPayload), prefer: "resolution=merge-duplicates,return=minimal" });
        if (widgetPayload.length) await sb(`hero_gen_widget_stats`, { method: "POST", body: JSON.stringify(widgetPayload), prefer: "resolution=merge-duplicates,return=minimal" });
        // keep hero max fields in sync with the 5★ / level-10 rows
        const maxStar = starPayload.find((p) => p.step === 30), maxW = widgetPayload.find((p) => p.level === 10);
        const heroPatch = {};
        if (maxStar) { heroPatch.exp_attack = maxStar.atk_pct; heroPatch.exp_defense = maxStar.def_pct; }
        if (maxW) { heroPatch.widget_lethality = maxW.leth_pct; heroPatch.widget_health = maxW.hp_pct; }
        if (Object.keys(heroPatch).length) await sb(`heroes?generation=eq.${selectedGen}`, { method: "PATCH", body: JSON.stringify(heroPatch), prefer: "return=minimal" });
        toast(`Gen ${selectedGen} stats saved`);
      } catch (err) {
        toast("Couldn't save stats", true);
      }
    });
  }
  fillHeroPick();
}

// Reorderable category button row, shared by Skin Gallery and Islands admin
// tabs. cats is the full [{id,category,sort_order}] list in current order.
function adminCategoryPickerHtml(cats, activeCat) {
  return cats
    .map(
      (c, idx) => `
    <div style="display:inline-flex; align-items:center; gap:2px;">
      <button class="btn ${c.category === activeCat ? "" : "ghost"} small" data-catselect="${esc(c.category)}">${esc(c.category)}</button>
      <button class="btn ghost small" data-catmoveup="${c.id}" ${idx === 0 ? "disabled" : ""} title="Move left" style="padding:4px 6px;">&#8592;</button>
      <button class="btn ghost small" data-catmovedown="${c.id}" ${idx === cats.length - 1 ? "disabled" : ""} title="Move right" style="padding:4px 6px;">&#8594;</button>
    </div>`
    )
    .join("");
}
function wireAdminCategoryReorder(container, page, cats, onChange) {
  container.querySelectorAll("[data-catmoveup]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const idx = cats.findIndex((c) => c.id === btn.dataset.catmoveup);
      if (idx <= 0) return;
      const a = cats[idx], b = cats[idx - 1];
      await Promise.all([
        sb(`skin_page_categories?id=eq.${a.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: b.sort_order }) }),
        sb(`skin_page_categories?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: a.sort_order }) }),
      ]);
      onChange();
    });
  });
  container.querySelectorAll("[data-catmovedown]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const idx = cats.findIndex((c) => c.id === btn.dataset.catmovedown);
      if (idx === -1 || idx >= cats.length - 1) return;
      const a = cats[idx], b = cats[idx + 1];
      await Promise.all([
        sb(`skin_page_categories?id=eq.${a.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: b.sort_order }) }),
        sb(`skin_page_categories?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: a.sort_order }) }),
      ]);
      onChange();
    });
  });
}

    { key: "marksman_health_pct", label: "Marksman Health %", type: "number" },
    { key: "sort_order", label: "Order", type: "number" },
  ];

  async function loadRefineRows() {
    const cols = ["id", ...refineCols.map((c) => c.key)].join(",");
    const rows = await sb(`pet_refine_nodes?select=${cols}&pet=eq.${encodeURIComponent(ADMIN_ACTIVE_PET_REFINE)}&order=sort_order`);
    document.getElementById("adminPetRefineRowsHeading").textContent = `Rows for ${ADMIN_ACTIVE_PET_REFINE} (${rows.length})`;
    const wrap = document.getElementById("adminPetRefineRowsWrap");
    wrap.innerHTML = `
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <thead><tr>
          ${refineCols.map((c) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${esc(c.label)}</th>`).join("")}
          <th></th>
        </tr></thead>
        <tbody>
          ${rows
            .map(
              (r) => `
            <tr data-petrefinerow="${r.id}">
              ${refineCols
                .map(
                  (c) =>
                    `<td style="padding:4px;"><input data-f="${c.key}" ${c.type === "number" ? 'type="number" step="any"' : ""} value="${esc(r[c.key] ?? "")}" style="width:90px;" /></td>`
                )
                .join("")}
              <td style="padding:4px; white-space:nowrap;">
                <button class="btn small ghost" data-petrefinesave="${r.id}">Save</button>
                <button class="btn small ghost" data-petrefinedel="${r.id}" style="color:var(--danger);">Delete</button>
              </td>
            </tr>`
                )
            .join("")}
        </tbody>
      </table>
    `;

    wrap.querySelectorAll("[data-petrefinesave]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.petrefinesave;
        const tr = wrap.querySelector(`tr[data-petrefinerow="${id}"]`);
        const patch = {};
        tr.querySelectorAll("[data-f]").forEach((el) => {
          const c = refineCols.find((c) => c.key === el.dataset.f);
          let v = el.value;
          if (c.type === "number") v = v === "" ? null : Number(v);
          else if (v.trim() === "") v = null;
          patch[el.dataset.f] = v;
        });
        try {
          await sb(`pet_refine_nodes?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });
          PET_REFINE_CACHE = null;
          toast("Saved");
        } catch (err) {
          toast("Couldn't save", true);
        }
      });
    });
    wrap.querySelectorAll("[data-petrefinedel]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this row?")) return;
        try {
          await sb(`pet_refine_nodes?id=eq.${btn.dataset.petrefinedel}`, { method: "DELETE" });
          PET_REFINE_CACHE = null;
          toast("Deleted");
          loadRefineRows();
        } catch (err) {
          toast("Couldn't delete", true);
        }
      });
    });
  }

  document.getElementById("adminAddPetRefineRowForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminAddPetRefineRowErr");
    errEl.textContent = "";
    const allPct = f.all_pct.value === "" ? 0 : Number(f.all_pct.value);
    try {
      const existing = await sb(`pet_refine_nodes?pet=eq.${encodeURIComponent(ADMIN_ACTIVE_PET_REFINE)}&select=sort_order,category&order=sort_order.desc&limit=1`);
      const nextOrder = existing.length ? (existing[0].sort_order || 0) + 1 : 0;
      const category = existing.length ? existing[0].category : null;
      const payload = {
        pet: ADMIN_ACTIVE_PET_REFINE,
        category,
        stage: f.stage.value.trim() || null,
        infantry_lethality_pct: allPct,
        infantry_health_pct: allPct,
        lancer_lethality_pct: allPct,
        lancer_health_pct: allPct,
        marksman_lethality_pct: allPct,
        marksman_health_pct: allPct,
        sort_order: nextOrder,
      };
      await sb(`pet_refine_nodes`, { method: "POST", body: JSON.stringify(payload) });
      PET_REFINE_CACHE = null;
      toast("Row added");
      f.reset();
      loadRefineRows();
    } catch (err) {
      errEl.textContent = "Couldn't add row";
    }
  });

  await loadRefineRows();
}

// Clears any text/number input's value when it's focused while showing a
// bare zero (0, 0.00, etc) so the user can start typing immediately instead
// of having to manually delete the placeholder zero first. Applies to every
// input across the whole app via event delegation, so it works uniformly
// without needing to be wired into each individual field.
document.addEventListener(
  "focusin",
  (e) => {
    const el = e.target;
    if (!el || el.tagName !== "INPUT") return;
    const type = (el.type || "text").toLowerCase();
    if (type !== "text" && type !== "number") return;
    if (/^0(\.0+)?$/.test(el.value.trim())) {
      el.value = "";
    }
  },
  true
);

// ---- Image upload to Supabase Storage (skin-images bucket) ----
// Any admin image input can get a "⬆ Upload" button beside it (rendered by
// uploadBtnHtml). Clicking opens a file picker; the file is uploaded and the
// public URL is written into the adjacent input.
async function uploadImageToStorage(file) {
  const ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "") || "png";
  const path = `${crypto.randomUUID()}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/skin-images/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": file.type || "application/octet-stream", "x-upsert": "true" },
    body: file,
  });
  if (!res.ok) throw new Error(`Upload failed (${res.status})`);
  return `${SUPABASE_URL}/storage/v1/object/public/skin-images/${path}`;
}
function uploadBtnHtml() {
  return `<button type="button" class="btn ghost small" data-imgupload title="Upload image" style="padding:4px 8px; white-space:nowrap;">&#8679; Upload</button>`;
}
let IMG_UPLOAD_PICKER = null;
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-imgupload]");
  if (!btn) return;
  e.preventDefault();
  const input = btn.previousElementSibling && btn.previousElementSibling.tagName === "INPUT" ? btn.previousElementSibling : null;
  if (!input) return;
  if (!IMG_UPLOAD_PICKER) {
    IMG_UPLOAD_PICKER = document.createElement("input");
    IMG_UPLOAD_PICKER.type = "file";
    IMG_UPLOAD_PICKER.accept = "image/*";
    IMG_UPLOAD_PICKER.style.display = "none";
    document.body.appendChild(IMG_UPLOAD_PICKER);
  }
  IMG_UPLOAD_PICKER.onchange = async () => {
    const file = IMG_UPLOAD_PICKER.files && IMG_UPLOAD_PICKER.files[0];
    IMG_UPLOAD_PICKER.value = "";
    if (!file) return;
    const orig = btn.innerHTML;
    btn.innerHTML = "Uploading\u2026";
    btn.disabled = true;
    try {
      const url = await uploadImageToStorage(file);
      input.value = url;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.dispatchEvent(new Event("change", { bubbles: true }));
      toast("Image uploaded \u2014 remember to Save");
    } catch (err) {
      toast("Upload failed", true);
    } finally {
      btn.innerHTML = orig;
      btn.disabled = false;
    }
  };
  IMG_UPLOAD_PICKER.click();
});

// Small login control in the sidebar: lets the owner log in with a real
// email/password to unlock Admin. Everyone else stays on their automatic
// anonymous session and never sees anything beyond a "Owner login" link.
function renderOwnerLoginUI() {
  const el = document.getElementById("ownerLoginArea");
  document.getElementById("adminNavGroup").style.display = IS_OWNER ? "block" : "none";

  if (IS_OWNER) {
    el.innerHTML = `
      <div class="meta" style="font-size:11px; color:var(--good); margin-bottom:6px;">&#10003; Logged in as owner</div>
      <button class="btn ghost small" id="ownerLogoutBtn" style="width:100%;">Log out</button>
    `;
    document.getElementById("ownerLogoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      await ensureAuthSession();
      renderOwnerLoginUI();
      if (TAB === "adminpage") { TAB = "overview"; document.querySelector('#tabs button[data-tab="overview"]').click(); }
    });
    return;
  }

  el.innerHTML = `<button class="btn ghost small" id="ownerLoginOpenBtn" style="width:100%;">Owner login</button>`;
  document.getElementById("ownerLoginOpenBtn").addEventListener("click", () => {
    let modal = document.getElementById("ownerLoginModal");
    if (!modal) {
      modal = document.createElement("div");
      modal.id = "ownerLoginModal";
      modal.className = "modal-overlay";
      document.body.appendChild(modal);
      modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
    }
    modal.innerHTML = `
      <div class="modal-box" style="max-width:340px;">
        <h2>Owner login</h2>
        <p class="desc">Log in to unlock Admin. First time here? Logging in with the owner email creates the account automatically.</p>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
          <input type="email" id="ownerLoginEmail" placeholder="Email" style="width:100%;" />
          <input type="password" id="ownerLoginPassword" placeholder="Password" style="width:100%;" />
          <div class="err" id="ownerLoginErr" style="min-height:16px;"></div>
          <button class="btn" id="ownerLoginSubmit">Log in</button>
          <button class="btn ghost small" id="ownerLoginClose">Cancel</button>
        </div>
      </div>`;
    modal.style.display = "flex";
    document.getElementById("ownerLoginClose").addEventListener("click", () => { modal.style.display = "none"; });
    document.getElementById("ownerLoginSubmit").addEventListener("click", async () => {
      const email = document.getElementById("ownerLoginEmail").value.trim();
      const password = document.getElementById("ownerLoginPassword").value;
      const errEl = document.getElementById("ownerLoginErr");
      errEl.textContent = "";
      if (!email || !password) { errEl.textContent = "Enter both email and password."; return; }
      try {
        const { error: signInErr } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (signInErr) {
          // First-time setup: only the designated owner email is allowed to self-register.
          if (email.toLowerCase() !== OWNER_EMAIL.toLowerCase()) {
            errEl.textContent = "Invalid login.";
            return;
          }
          const { error: signUpErr } = await supabaseClient.auth.signUp({ email, password });
          if (signUpErr) { errEl.textContent = signUpErr.message; return; }
        }
        await ensureAuthSession();
        modal.style.display = "none";
        renderOwnerLoginUI();
        toast(IS_OWNER ? "Logged in as owner" : "Logged in");
      } catch (err) {
        errEl.textContent = err.message || "Login failed";
      }
    });
  });
}

// App entry point: establish (or restore) a session before anything else
// runs, since every data call needs USER_ID / the session's access token.
(async function boot() {
  try {
    await ensureAuthSession();
  } catch (err) {
    content.innerHTML = `
      <div class="empty">
        <div class="big">Couldn't start a session</div>
        <p class="desc">${esc(err.message || String(err))}</p>
        <p class="desc">If you're the owner: make sure "Anonymous sign-ins" is enabled in your Supabase project's Authentication settings.</p>
      </div>`;
    return;
  }
  renderOwnerLoginUI();
  loadCommander();
  loadBuffCategories().then(render);
})();
</script>
