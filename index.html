        </div>
        <button class="btn ghost small" data-heropiecemax="${esc(troop)}|${esc(piece)}" style="width:60px;">Max</button>
      </div>
      <div style="border-top:1px solid var(--line); padding-top:10px;">
        ${GEAR_LEVELING_TABLES.map(
          (t) => `
        <div style="padding:6px 0;">
          <div class="meta" style="font-size:12px; margin-bottom:4px;">${esc(HERO_GEAR_TRACK_LABELS[t])}</div>
          <div style="display:flex; gap:6px;">
            <select data-troop="${esc(troop)}" data-piece="${esc(piece)}" data-track="${esc(t)}" data-role="from" style="flex:1;">${optsByTrack[t]}</select>
            <select data-troop="${esc(troop)}" data-piece="${esc(piece)}" data-track="${esc(t)}" data-role="to" style="flex:1;">${optsByTrack[t]}</select>
          </div>
        </div>`
        ).join("")}
      </div>
    </div>`;

  tracksEl.innerHTML = HERO_GEAR_TROOPS.map(
    (troop) => `
    <div style="padding:14px 0; border-top:1px solid var(--line);">
      <div class="name" style="font-size:14px; margin-bottom:10px;">${esc(troop)}</div>
      <div class="grid g4" style="gap:16px;">
        ${HERO_GEAR_PIECE_NAMES.map((piece) => pieceCard(troop, piece)).join("")}
      </div>
    </div>`
  ).join("");

  tracksEl.querySelectorAll("[data-heropiecemax]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const [troop, piece] = btn.dataset.heropiecemax.split("|");
      const maxIdxByTrack = {};
      GEAR_LEVELING_TABLES.forEach((t) => {
        maxIdxByTrack[t] = Math.max(0, (HERO_GEAR_TABLES_CACHE[t] || []).length - 1);
      });
      const bothMaxed = GEAR_LEVELING_TABLES.every((t) => {
        const st = activeState[troop][piece][t];
        return st.from >= maxIdxByTrack[t] && st.to >= maxIdxByTrack[t];
      });
      const currentZeroTargetMaxed = GEAR_LEVELING_TABLES.every((t) => {
        const st = activeState[troop][piece][t];
        return st.from <= 0 && st.to >= maxIdxByTrack[t];
      });
      const bothZero = GEAR_LEVELING_TABLES.every((t) => {
        const st = activeState[troop][piece][t];
        return st.from <= 0 && st.to <= 0;
      });
      // Cycle: (0,0) -> (max,max) -> (0,max) -> (0,0) -> ...
      let mode;
      if (bothZero) mode = "max";
      else if (bothMaxed) mode = "half";
      else if (currentZeroTargetMaxed) mode = "zero";
      else mode = "max";
      GEAR_LEVELING_TABLES.forEach((t) => {
        const st = activeState[troop][piece][t];
        if (mode === "max") {
          st.from = maxIdxByTrack[t];
          st.to = maxIdxByTrack[t];
        } else if (mode === "half") {
          st.from = 0;
          st.to = maxIdxByTrack[t];
        } else {
          st.from = 0;
          st.to = 0;
        }
      });
      saveCalcState(activeStorageKey, activeState);
      renderGearLevelingGroup(target);
    });
  });

  tracksEl.querySelectorAll("select[data-troop]").forEach((sel) => {
    const { troop, piece, track, role } = sel.dataset;
    sel.value = String(activeState[troop][piece][track][role]);
    sel.addEventListener("change", () => {
      activeState[troop][piece][track][role] = Number(sel.value);
      saveCalcState(activeStorageKey, activeState);
      updateHeroGearTotals();
    });
  });

  updateHeroGearTotals();
}

// Sums materials (XP/Mithril/Mythic Gear/Essence Stones) needed
// across all 12 gear-piece/track selections into one totals grid.
// Shared "how much do I own" bar shown above a calculator's materials
// totals. calcKey scopes persistence per calculator (charm/chief_gear/
// hero_gear) since the same material name could mean different things
// in different contexts. Returns the rendered HTML string; also wires
// up the input change handlers once inserted into the DOM.
const MATERIAL_OWNED_CACHE = {};
async function ensureMaterialOwnedCache(calcKey) {
  if (!MATERIAL_OWNED_CACHE[calcKey]) {
    MATERIAL_OWNED_CACHE[calcKey] = (await loadCalcState(`material_owned_${calcKey}`)) || {};
  }
  return MATERIAL_OWNED_CACHE[calcKey];
}
async function renderMaterialsOwnedBar(containerId, matTotals, calcKey, allMaterialNames, refreshFn) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const names = allMaterialNames && allMaterialNames.length ? allMaterialNames : Object.keys(matTotals);
  if (!names.length) {
    el.innerHTML = "";
    return;
  }
  const matEntries = names.map((name) => [name, matTotals[name] || 0]);
  const owned = await ensureMaterialOwnedCache(calcKey);

  const cardHtml = matEntries
    .map(([name, needed]) => {
      const lower = name.toLowerCase();
      const iconKey = Object.keys(MATERIAL_ICONS).find((k) => lower.includes(k));
      const icon = iconKey
        ? `<img src="${MATERIAL_ICONS[iconKey]}" alt="" style="width:40px; height:40px; object-fit:contain; flex-shrink:0;" loading="lazy" />`
        : "";
      const haveQty = owned[name] || 0;
      const stillNeed = Math.max(0, needed - haveQty);
      const surplus = Math.max(0, haveQty - needed);
      const statusColor = needed === 0 ? "var(--muted)" : stillNeed > 0 ? "var(--danger)" : "var(--good)";
      const statusText =
        needed === 0
          ? "Not needed yet"
          : stillNeed > 0
          ? `${stillNeed.toLocaleString()} still needed`
          : surplus > 0
          ? `\u2713 ${surplus.toLocaleString()} extra`
          : "\u2713 Have enough";
      return `<div class="metric">
        <div style="display:flex; align-items:center; gap:10px;">
          ${icon}
          <div class="label" style="text-align:left;">${esc(name)}</div>
        </div>
        <div class="meta" style="font-size:10.5px; margin-top:8px;">Needed: ${needed.toLocaleString()}</div>
        <div style="display:flex; align-items:center; gap:4px; justify-content:center; margin-top:4px;">
          <span class="meta" style="font-size:10.5px;">Own:</span>
          <input type="text" inputmode="numeric" data-ownedmat="${esc(name)}" value="${haveQty}" style="width:110px; padding:6px 8px; font-size:14px;" />
        </div>
        <div class="val" style="font-size:13px; margin-top:4px; color:${statusColor};">${statusText}</div>
      </div>`;
    })
    .join("");

  el.innerHTML = `<div class="grid" style="grid-template-columns:repeat(${Math.min(matEntries.length, 6)}, 1fr);">${cardHtml}</div>`;

  el.querySelectorAll("[data-ownedmat]").forEach((input) => {
    input.addEventListener("change", async () => {
      let val = Number(input.value);
      if (Number.isNaN(val) || val < 0) val = 0;
      input.value = val;
      owned[input.dataset.ownedmat] = val;
      await saveCalcState(`material_owned_${calcKey}`, owned);
      if (refreshFn) refreshFn();
    });
  });
}

async function updateHeroGearTotals() {
  if (!HERO_GEAR_TABLES_CACHE) return;
  const HERO_GEAR_MATERIAL_COLS = [
    ["mithril", "Mithril"],
    ["mythic_gear", "Mythic Gear"],
    ["xp_component", "XP Component"],
    ["essence_stones", "Essence Stones"],
  ];

  // One real inventory covers all 3 loadouts (owned amounts are shared
  // under a single key), while needed / still-needed reflects only the
  // set currently selected on the page.
  const matTotals = {};
  const setState = HERO_GEAR_SETS[heroGearActiveSet];
  HERO_GEAR_TROOPS.forEach((troop) => {
    HERO_GEAR_PIECE_NAMES.forEach((piece) => {
      GEAR_LEVELING_TABLES.forEach((t) => {
        const rows = HERO_GEAR_TABLES_CACHE[t];
        if (!rows.length) return;
        const st = setState[troop][piece][t];
        const fromIdx = Math.min(st.from, st.to);
        const toIdx = Math.max(st.from, st.to);
        for (let i = fromIdx + 1; i <= toIdx; i++) {
          HERO_GEAR_MATERIAL_COLS.forEach(([col, label]) => {
            const v = Number(rows[i][col]) || 0;
            if (v) matTotals[label] = (matTotals[label] || 0) + v;
          });
        }
      });
    });
  });

  renderChiefGearResourcesBar("heroGearOwned", matTotals, ["XP Component", "Essence Stones", "Mithril", "Mythic Gear"], updateHeroGearTotals, "hero_gear");

  updateHeroGearCurrentStats();
}

// Computes current Attack/Defense/Lethality/Health bonus per troop
// type: Mastery Forging contributes Lethality+Health only; Mithril
// milestones crossed on the Enhance track contribute all 4 stats.
// Pure computation, reusable by both this page and the Stats dashboard.
// stateObj must have the same shape as HERO_GEAR_STATE.
function computeHeroGearStats(stateObj) {
  if (!HERO_GEAR_TABLES_CACHE) return {};
  const mfRows = HERO_GEAR_TABLES_CACHE["Hero Gear Mastery Forging"];
  const enhRows = HERO_GEAR_TABLES_CACHE["Enhance Combined"];
  if (!mfRows || !mfRows.length) return {};

  const out = {};
  HERO_GEAR_TROOPS.forEach((troop) => {
    const statTotals = { Attack: 0, Defense: 0, Health: 0, Lethality: 0 };
    const continuousMax = { Health: 0, Lethality: 0 };
    HERO_GEAR_PIECE_NAMES.forEach((piece) => {
      const mfIdx = stateObj[troop][piece]["Hero Gear Mastery Forging"].from;
      const mfStat = parseStatPct(mfRows[mfIdx]?.stat) || 0;
      HERO_GEAR_MASTERY_STATS[piece].forEach((stat) => {
        statTotals[stat] += mfStat;
      });
      if (enhRows && enhRows.length) {
        const enhIdx = stateObj[troop][piece]["Enhance Combined"].from;
        const continuousStat = parseStatPct(enhRows[enhIdx]?.stat) || 0;
        HERO_GEAR_ENHANCE_CONTINUOUS_STATS[piece].forEach((stat) => {
          continuousMax[stat] += continuousStat;
        });
        let milestoneStat = 0;
        for (let i = 0; i <= enhIdx; i++) {
          const v = parseStatPct(enhRows[i].stat2);
          if (v != null) milestoneStat += v;
        }
        HERO_GEAR_ENHANCE_MILESTONE_STATS[piece].forEach((stat) => {
          statTotals[stat] += milestoneStat;
        });
      }
    });
    statTotals.Health += continuousMax.Health;
    statTotals.Lethality += continuousMax.Lethality;
    out[troop] = statTotals;
  });
  return out;
}

// Builds a synthetic "everything at max level" state, same shape as
// HERO_GEAR_STATE, for computing the Max Possible ceiling.
function maxedHeroGearState() {
  const out = {};
  HERO_GEAR_TROOPS.forEach((troop) => {
    out[troop] = {};
    HERO_GEAR_PIECE_NAMES.forEach((piece) => {
      out[troop][piece] = {};
      GEAR_LEVELING_TABLES.forEach((t) => {
        out[troop][piece][t] = { from: Math.max(0, (HERO_GEAR_TABLES_CACHE[t] || []).length - 1) };
      });
    });
  });
  return out;
}

function updateHeroGearCurrentStats() {
  const el = document.getElementById("heroGearCurrentStats");
  if (!el || !HERO_GEAR_TABLES_CACHE) return;
  const statsByTroop = computeHeroGearStats(HERO_GEAR_SETS[heroGearActiveSet]);
  const maxByTroop = computeHeroGearStats(maxedHeroGearState());
  const results = HERO_GEAR_TROOPS.map((troop) => ({ troop, statTotals: statsByTroop[troop], maxTotals: maxByTroop[troop] }));

  el.innerHTML =
    `<div class="grid g3" style="gap:12px;">` +
    results
      .map(
        (r, idx) => `
    <div style="${idx > 0 ? "border-left:1px solid var(--line); padding-left:12px;" : ""}">
      <div class="meta" style="margin-bottom:8px; font-weight:600; color:var(--frost);">${esc(r.troop)}</div>
      <div class="grid g2" style="gap:8px;">
        <div class="metric" style="padding:8px;"><div class="label" style="font-size:10px;">Total Attack</div><div class="val" style="font-size:16px; margin-top:3px;">+${r.statTotals.Attack.toFixed(1)}%</div><div class="meta" style="font-size:9.5px; margin-top:2px;">of max +${r.maxTotals.Attack.toFixed(1)}%</div></div>
        <div class="metric" style="padding:8px;"><div class="label" style="font-size:10px;">Total Defense</div><div class="val" style="font-size:16px; margin-top:3px;">+${r.statTotals.Defense.toFixed(1)}%</div><div class="meta" style="font-size:9.5px; margin-top:2px;">of max +${r.maxTotals.Defense.toFixed(1)}%</div></div>
        <div class="metric" style="padding:8px;"><div class="label" style="font-size:10px;">Total Lethality</div><div class="val" style="font-size:16px; margin-top:3px;">+${r.statTotals.Lethality.toFixed(1)}%</div><div class="meta" style="font-size:9.5px; margin-top:2px;">of max +${r.maxTotals.Lethality.toFixed(1)}%</div></div>
        <div class="metric" style="padding:8px;"><div class="label" style="font-size:10px;">Total Health</div><div class="val" style="font-size:16px; margin-top:3px;">+${r.statTotals.Health.toFixed(1)}%</div><div class="meta" style="font-size:9.5px; margin-top:2px;">of max +${r.maxTotals.Health.toFixed(1)}%</div></div>
      </div>
    </div>`
      )
      .join("") +
    `</div>`;
}

// ============================================================
// GENERIC BUFF CATEGORY SYSTEM
// A single shared "master" matrix table (buff_tables/columns/rows/
// cells) backs every dynamic nav category (Facility, Research,
// Chief, Charm, Pets, VIP Tier, War Acd., etc). Each category is a
// column; each row is a named stat line (e.g. "Infantry ATT").
// Categories can be grouped into sub-nav (see CATEGORY_GROUPS) or
// nested under Heroes/Extra Buff.
// ============================================================
// Fetches (or lazily creates) the one shared buff matrix table.
async function ensureBuffTable() {
  if (BUFF_TABLE_ID) return BUFF_TABLE_ID;
  const existing = await sb(`buff_tables?select=id&user_id=eq.${USER_ID}&order=created_at.asc&limit=1`);
  if (existing && existing.length) {
    BUFF_TABLE_ID = existing[0].id;
  } else {
    const [created] = await sb(`buff_tables`, {
      method: "POST",
      body: JSON.stringify({ user_id: USER_ID, name: "Buffs", sort_order: 0 }),
    });
    BUFF_TABLE_ID = created.id;
  }
  return BUFF_TABLE_ID;
}

// Rebuilds the sidebar's dynamic category buttons from the buff
// matrix's columns, excluding any pulled into Heroes/Extra Buff/
// grouped sub-nav so they don't appear twice.
async function loadBuffCategories() {
  await ensureBuffTable();
  const columns = await sb(`buff_columns?table_id=eq.${BUFF_TABLE_ID}&select=id,name,category&order=sort_order.asc`);
  const grouped = [];
  const seen = new Map();
  for (const c of columns) {
    const key = c.category || c.name;
    if (!seen.has(key)) {
      seen.set(key, { name: key, columns: [] });
      grouped.push(seen.get(key));
    }
    seen.get(key).columns.push(c);
  }
  BUFF_CATEGORIES = grouped;

  const HERO_SUBCATS = new Set(["Jero", "Natalia", "Hero Gears"]);
  const GROUPED_CHILDREN = new Set(Object.values(CATEGORY_GROUPS).flat());
  const EXTRA_BUFF_SET = new Set(EXTRA_BUFF_SUBCATS);
  const HIDDEN_BUFF_CATS = new Set(["Chief Bonus", "Charm", "Chief", "Extra Buff", "Buff", "Skins", "Islands", "War Acd.", "Research", "Pets", "Expert", "Exp. Research"]);
  const holder = document.getElementById("dynamicTabs");
  if (holder) {
    holder.innerHTML = BUFF_CATEGORIES.filter(
      (c) => !HERO_SUBCATS.has(c.name) && !GROUPED_CHILDREN.has(c.name) && !EXTRA_BUFF_SET.has(c.name) && !HIDDEN_BUFF_CATS.has(c.name)
    )
      .map((c) => `<button data-tab="buffcat:${esc(c.name)}"><span class="ic">&#9670;</span>${esc(EXTRA_BUFF_LABELS[c.name] || c.name)}</button>`)
      .join("");
  }
  document.querySelectorAll("#tabs button[data-tab]").forEach((b) => {
    b.classList.toggle("active", b.dataset.tab === TAB);
  });
}

// Top-level wrapper for a single buff category page.
async function renderCategoryPage(categoryName) {
  await renderCategoryInto(content, categoryName, renderCategoryPage);
}

// Renders one category's row list (name + value) into any target
// element, with inline add/update controls. Reused by top-level
// category pages, Heroes sub-nav, and grouped sub-nav pages.
async function renderCategoryInto(target, categoryName, rerenderFn) {
  await ensureBuffTable();
  const cat = BUFF_CATEGORIES.find((c) => c.name === categoryName);
  if (!cat) {
    target.innerHTML = `<div class="empty">Category not found.</div>`;
    return;
  }
  const refresh = rerenderFn || ((name) => renderCategoryInto(target, name, rerenderFn));
  const rows = await sb(`buff_rows?table_id=eq.${BUFF_TABLE_ID}&select=id,name,sort_order,buff_cells(value,column_id)&order=sort_order.asc`);

  target.innerHTML = `
    <div class="panel">
      <h2>${esc(categoryName)}</h2>
      <p class="desc">Values tracked for this category.</p>
      <div id="catRows-${esc(categoryName)}"></div>
      <form class="inline" id="addRowForm-${esc(categoryName)}" style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">
        <input class="flex1" name="rowName" placeholder="Add a stat line, e.g. Infantry ATT" />
        <input class="field-num" name="rowValue" type="number" step="any" placeholder="Value" />
        <button class="btn small" type="submit">Add</button>
      </form>
      <div class="err" id="addRowErr-${esc(categoryName)}"></div>
    </div>
  `;

  const rowsEl = target.querySelector(`#catRows-${CSS.escape(categoryName)}`);
  const colIds = cat.columns.map((c) => c.id);
  const rowsHtml = rows
    .map((r) => {
      const cellsByCol = Object.fromEntries(r.buff_cells.map((c) => [c.column_id, c.value]));
      const v = colIds.map((id) => cellsByCol[id]).find((x) => x != null);
      return `<div class="row">
        <div class="name">${esc(r.name)}</div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="meta mono">${v != null ? Number(v).toLocaleString() : "\u2014"}</div>
          <button class="btn small ghost" data-row="${r.id}" data-val="${v ?? ""}">Update</button>
        </div>
      </div>`;
    })
    .join("");
  rowsEl.innerHTML = rowsHtml || `<div class="empty"><div class="big">No stat lines yet.</div>Add one below.</div>`;

  rowsEl.querySelectorAll("button[data-row]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const val = prompt("Value:", btn.dataset.val);
      if (val === null) return;
      const num = Number(val);
      if (Number.isNaN(num)) { toast("Enter a valid number", true); return; }
      try {
        await sb(`buff_cells`, {
          method: "POST",
          headers: { Prefer: "resolution=merge-duplicates,return=representation" },
          body: JSON.stringify({ row_id: btn.dataset.row, column_id: cat.columns[0].id, value: num }),
        });
        toast("Updated");
        refresh(categoryName);
      } catch (err) {
        toast("Couldn't update value", true);
      }
    });
  });

  target.querySelector(`#addRowForm-${CSS.escape(categoryName)}`).addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = target.querySelector(`#addRowErr-${CSS.escape(categoryName)}`);
    errEl.textContent = "";
    const name = f.rowName.value.trim();
    if (!name) { errEl.textContent = "Enter a stat line name first"; return; }
    const valueRaw = f.rowValue.value.trim();
    try {
      const [rowRow] = await sb(`buff_rows`, {
        method: "POST",
        body: JSON.stringify({ table_id: BUFF_TABLE_ID, name, sort_order: rows.length }),
      });
      if (valueRaw !== "") {
        await sb(`buff_cells`, {
          method: "POST",
          body: JSON.stringify({ row_id: rowRow.id, column_id: cat.columns[0].id, value: Number(valueRaw) }),
        });
      }
      toast("Stat line added");
      refresh(categoryName);
    } catch (err) {
      errEl.textContent = "Couldn't add stat line \u2014 name may already exist";
    }
  });
}

// Generic "parent category with sub-tab children" page, e.g.
// War Acd. -> T11/T12. Driven by CATEGORY_GROUPS.
async function renderGroupPage(parentName) {
  const children = CATEGORY_GROUPS[parentName];
  const subtabs = [parentName, ...children];
  const current = GROUP_SUBTAB[parentName] || parentName;

  content.innerHTML = `

        )
        .join("")}

// Renders a comma-separated materials string with inline icons.
function renderMaterialsWithIcons(materials) {
  if (!materials) return "\u2014";
  return materials
    .split(",")
    .map((part) => {
      const trimmed = part.trim();
      const lower = trimmed.toLowerCase();
      const iconKey = Object.keys(MATERIAL_ICONS).find((k) => lower.includes(k));
      const icon = iconKey
        ? `<img src="${MATERIAL_ICONS[iconKey]}" alt="" style="width:15px; height:15px; object-fit:contain; vertical-align:-3px; margin-right:3px;" loading="lazy" />`
        : "";
      return `<span style="display:inline-flex; align-items:center; margin-right:8px;">${icon}${esc(trimmed)}</span>`;
    })
    .join("");
}

// Builds a human-readable label for a progression row, e.g.
// "Legendary T5 \u26053.2" or "Lv.42" (drops a lone ".0" stage suffix).
const CHIEF_GEAR_TIER_SHORT = {
  Common: "Green",
  Rare: "Blue",
  Epic: "Purple",
  "Epic T1": "Purple T1",
  Mythic: "Gold",
  "Mythic T1": "Gold T1",
  "Mythic T2": "Gold T2",
  Legendary: "Red",
  "Legendary T1": "Red T1",
  "Legendary T2": "Red T2",
  "Legendary T3": "Red T3",
  "Legendary T4": "Red T4",
  "Legendary T5": "Red T5",
  "Legendary T6": "Red T6",
};
function rowLabel(r) {
  if (r.display_label) return r.display_label;
  if (r.tier) return `${r.tier}${r.stars != null ? " \u2605" + r.stars : ""}${r.stage != null && r.stage !== "0" ? "." + r.stage : ""}`;
  return `Lv.${r.level}${r.stage && r.stage !== "0" ? "." + r.stage : ""}`;
}
function chiefGearRowLabel(r) {
  if (r.display_label) return r.display_label;
  if (r.tier) return `${CHIEF_GEAR_TIER_SHORT[r.tier] || r.tier}${r.stars != null ? " \u2605" + r.stars : ""}${r.stage != null && r.stage !== "0" ? "." + r.stage : ""}`;
  return rowLabel(r);
}
// Parses "1500 Hardened Alloy, 15 Polishing Solution" into
// [{qty, name}, ...] for totals aggregation.
function parseMaterials(materials) {
  if (!materials) return [];
  return materials
    .split(",")
    .map((part) => {
      const m = part.trim().match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
      return m ? { qty: Number(m[1]), name: m[2].trim() } : null;
    })
    .filter(Boolean);
}
// Extracts the numeric percentage from a stat string like "+9.35%".
function parseStatPct(stat) {
  if (!stat) return null;
  const m = String(stat).match(/-?\d+(\.\d+)?/);
  return m ? Number(m[0]) : null;
}

// Renders a progression table with an optional current\u2192target
// "upgrade calculator" (materials/stat/power gained for the range)
// plus the full reference table below it.
async function renderProgressionInto(target, tableName) {
  let [table] = await sb(`progression_tables?name=eq.${encodeURIComponent(tableName)}&user_id=eq.${PROGRESSION_OWNER_ID}&select=id,name`);
  if (!table) {
    const [created] = await sb(`progression_tables`, {
      method: "POST",
      body: JSON.stringify({ user_id: PROGRESSION_OWNER_ID, name: tableName, sort_order: 0 }),
    });
    table = created;
  }
  const rows = await sb(`progression_rows?table_id=eq.${table.id}&select=id,level,tier,stars,stage,materials,stat,power&order=sort_order.asc`);
  const hasTier = rows.some((r) => r.tier);
  const canCalc = rows.length > 1;

  target.innerHTML = `
    ${
      canCalc
        ? `<div class="panel">
      <h2>Upgrade calculator</h2>
      <p class="desc">Pick your current and target step to see materials, stat gain, and power gain between them.</p>
      <div class="row" style="align-items:center;">
        <div class="meta">From</div>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="calcFrom" style="width:160px;"></select>
          <span class="meta">to</span>
          <select id="calcTo" style="width:160px;"></select>
        </div>
      </div>
      <div id="calcResult" style="margin-top:12px;"></div>
    </div>`
        : ""
    }
    <div class="panel">
      <h2>${esc(tableName)}</h2>
      <p class="desc">${hasTier ? "Tier, stars, materials, stat bonus, and power total." : "Level, materials needed, and power gained per level."}</p>
      <div class="matrix-wrap">
        <table class="matrix">
          <thead><tr>${hasTier ? "<th>Tier</th><th>Stars</th><th>Stage</th>" : "<th>Level</th>"}<th>Materials</th>${hasTier ? "<th>Stat</th>" : ""}<th>Power</th><th></th></tr></thead>
          <tbody id="progRows"></tbody>
        </table>
      </div>
      ${
        !hasTier
          ? `<form class="inline" id="progAddForm" style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">
        <input class="field-num" name="level" type="number" placeholder="Level" required style="width:80px;" />
        <input class="flex1" name="materials" placeholder="Materials, e.g. 100 XP Component" />
        <input class="field-num" name="power" type="number" step="any" placeholder="Power" style="width:120px;" />
        <button class="btn small" type="submit">Add row</button>
      </form>
      <div class="err" id="progErr"></div>`
          : ""
      }
    </div>
  `;

  if (canCalc) {
    const fromSel = target.querySelector("#calcFrom");
    const toSel = target.querySelector("#calcTo");
    const opts = rows.map((r, i) => `<option value="${i}">${esc(rowLabel(r))}</option>`).join("");
    fromSel.innerHTML = opts;
    toSel.innerHTML = opts;
    toSel.value = String(rows.length - 1);

    function updateCalc() {
      let fromIdx = Number(fromSel.value);
      let toIdx = Number(toSel.value);
      if (toIdx < fromIdx) { toIdx = fromIdx; toSel.value = String(fromIdx); }
      const resultEl = target.querySelector("#calcResult");
      const matTotals = {};
      for (let i = fromIdx + 1; i <= toIdx; i++) {
        for (const m of parseMaterials(rows[i].materials)) {
          matTotals[m.name] = (matTotals[m.name] || 0) + m.qty;
        }
      }
      const statFrom = parseStatPct(rows[fromIdx].stat);
      const statTo = parseStatPct(rows[toIdx].stat);
      const powerFrom = rows[fromIdx].power != null ? Number(rows[fromIdx].power) : null;
      const powerTo = rows[toIdx].power != null ? Number(rows[toIdx].power) : null;

      const matHtml = Object.entries(matTotals)
        .map(([name, qty]) => {
          const lower = name.toLowerCase();
          const iconKey = Object.keys(MATERIAL_ICONS).find((k) => lower.includes(k));
          const icon = iconKey ? `<img src="${MATERIAL_ICONS[iconKey]}" alt="" style="width:16px; height:16px; object-fit:contain; vertical-align:-3px; margin-right:4px;" loading="lazy" />` : "";
          return `<div class="row"><div class="name">${icon}${esc(name)}</div><div class="meta mono">${qty.toLocaleString()}</div></div>`;
        })
        .join("");

      resultEl.innerHTML = `
        <div class="grid g2" style="margin-bottom:10px;">
          ${statTo != null ? `<div class="metric"><div class="label">Stat gain</div><div class="val">+${(statTo - (statFrom || 0)).toFixed(2)}%</div></div>` : ""}
          ${powerTo != null ? `<div class="metric"><div class="label">Power gain</div><div class="val">${(powerTo - (powerFrom || 0)).toLocaleString()}</div></div>` : ""}
        </div>
        ${matHtml || `<div class="empty" style="padding:10px 0;">No materials needed for this range.</div>`}
      `;
    }
    fromSel.addEventListener("change", updateCalc);
    toSel.addEventListener("change", updateCalc);
    updateCalc();
  }

  const tbody = target.querySelector("#progRows");
  tbody.innerHTML = rows.length
    ? rows
        .map((r) =>
          hasTier
            ? `<tr>
                <td style="text-align:left;">${esc(r.tier || "")}</td>
                <td>${r.stars ?? "\u2014"}</td>
                <td>${r.stage ?? "\u2014"}</td>
                <td style="text-align:left;">${renderMaterialsWithIcons(r.materials)}</td>
                <td>${esc(r.stat || "\u2014")}</td>

// 18 charms total (6 gear pieces x 3 charm slots each), levels
// 1-18 with sub-levels from level 4 onward (75 steps total).

// Cost table and per-level stat curve sourced from the community

// Charm level data (levels, per-step material costs, cumulative Lethality/
// Health %) now lives in the `charm_levels` table (Admin-editable), not
// hardcoded. Loaded once via ensureCharmLevelsData().
let CHARM_LEVELS = [];
let CHARM_STEP_COST = {};
let CHARM_CUMULATIVE = {};
let CHARM_CUMULATIVE_STAT = {};
let CHARM_LEVELS_LOADED = false;
async function ensureCharmLevelsData() {
  if (CHARM_LEVELS_LOADED) return;
  CHARM_LEVELS_LOADED = true;
  const rows = await sb(`charm_levels?select=level_label,sort_order,guides_cost,designs_cost,secrets_cost,cumulative_pct&order=sort_order.asc`);
  CHARM_LEVELS = rows.map((r) => r.level_label);
  CHARM_STEP_COST = {};
  CHARM_CUMULATIVE = {};
  CHARM_CUMULATIVE_STAT = {};
  let g = 0, d = 0, s = 0;
  rows.forEach((r) => {
    if (r.level_label !== "0") {
      CHARM_STEP_COST[r.level_label] = [Number(r.guides_cost), Number(r.designs_cost), Number(r.secrets_cost)];
      g += Number(r.guides_cost); d += Number(r.designs_cost); s += Number(r.secrets_cost);
    }
    CHARM_CUMULATIVE[r.level_label] = [g, d, s];
    CHARM_CUMULATIVE_STAT[r.level_label] = Number(r.cumulative_pct);
  });
}

// ---- Shared "one troop at a time, swipe to switch" helper ----
// Renders a single-row tab header for Infantry/Lancer/Marksman (or any
// small set of troops) and wires horizontal swipe gestures on the content
// area below it to move to the next/previous troop, so every troop's full
// content gets the whole screen width instead of being squeezed 3-across.
function renderTroopTabs(containerEl, troops, current, colors, onSelect) {
  containerEl.innerHTML = `
    <div class="cat-tabs" style="margin-bottom:14px;">
      ${troops.map((t) => `<button data-troop="${esc(t)}" class="${t === current ? "active" : ""}" style="${t === current && colors && colors[t] ? `border-color:${colors[t]}; color:${colors[t]};` : ""}">${esc(t)}</button>`).join("")}
    </div>
  `;
  containerEl.querySelectorAll("button[data-troop]").forEach((btn) => {
    btn.addEventListener("click", () => onSelect(btn.dataset.troop));
  });
}
function wireTroopSwipe(el, troops, current, onSelect) {
  const idx = troops.indexOf(current);
  let startX = null, startY = null;
  el.ontouchstart = (e) => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; };
  el.ontouchend = (e) => {
    if (startX == null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      const next = dx < 0 ? idx + 1 : idx - 1;
      if (next >= 0 && next < troops.length) onSelect(troops[next]);
    }
  };
}

// Sums Guides/Designs/Secrets across all 18 charm slots.
async function updateCharmTotals() {
  let totalG = 0, totalD = 0, totalS = 0;
  CHARM_PIECES.forEach((p) => {
    CHARM_CALC_STATE[p.key].forEach((slot) => {
      const from = CHARM_CUMULATIVE[slot.current] || [0, 0, 0];
      const to = CHARM_CUMULATIVE[slot.target] || [0, 0, 0];
      totalG += Math.max(0, to[0] - from[0]);
      totalD += Math.max(0, to[1] - from[1]);
      totalS += Math.max(0, to[2] - from[2]);
    });
  });

  renderChiefGearResourcesBar("charmOwned", { "Charm Guides": totalG, "Charm Designs": totalD, "Jewel Secrets": totalS }, ["Charm Guides", "Charm Designs", "Jewel Secrets"], updateCharmTotals, "charm");

  updateCharmCurrentStats();
}

// Pure computation, reusable by both this page and the Stats dashboard.
function computeCharmStats(stateObj) {
  const troopTypes = ["Lancer", "Infantry", "Marksman"];
  const out = {};
  troopTypes.forEach((troop) => {
    const pieces = CHARM_PIECES.filter((p) => p.troop === troop);
    let sumStat = 0;
    for (const p of pieces) {
      for (const slot of stateObj[p.key]) {
        sumStat += CHARM_CUMULATIVE_STAT[slot.current] || 0;
      }
    }
    out[troop] = sumStat;
  });
  return out;
}
function maxedCharmState() {
  const out = {};
  CHARM_PIECES.forEach((p) => {
    out[p.key] = [0, 1, 2].map(() => ({ current: "18" }));
  });
  return out;
}

// Sums each troop type's current Lethality/Health from its 6
// charms (2 pieces x 3 slots), matching the Skin Gallery card style.
function updateCharmCurrentStats() {
  const el = document.getElementById("charmCurrentStats");
  if (!el) return;
  const statByTroop = computeCharmStats(CHARM_CALC_STATE);
  const maxByTroop = computeCharmStats(maxedCharmState());
  const rows = Object.entries(statByTroop).map(([troop, avg]) => ({ troop, avg, max: maxByTroop[troop] || 0 }));
  el.innerHTML =
    `<div class="grid g3" style="gap:12px;">` +
    rows
      .map(
        (r, idx) => `
    <div style="${idx > 0 ? "border-left:1px solid var(--line); padding-left:12px;" : ""}">
      <div class="meta" style="margin-bottom:8px; font-weight:600; color:var(--frost);">${esc(r.troop)}</div>

    </div>`
      )
      .join("") +
    `</div>`;
}

    rowsEl.querySelectorAll("select[data-piece]").forEach((sel) => {
      const piece = sel.dataset.piece;
      const role = sel.dataset.role;
      sel.value = String(CHIEF_GEAR_STATE[piece][role]);
      sel.addEventListener("change", () => {
        CHIEF_GEAR_STATE[piece][role] = Number(sel.value);
        saveCalcState("chief_gear", CHIEF_GEAR_STATE);
        updateChiefGearTotals();
      });
    });
  }

  renderPieces();
  updateChiefGearTotals();
}

// Sums materials needed across all 6 gear pieces' selected ranges.
// matTotals may be a single {name: qty} object, OR an array of
// { label, totals } groups (e.g. one per Hero Gear set) - in which case a
// separate needed/still-needed row is rendered per group, all measured
// against the same shared owned amounts.
async function renderChiefGearResourcesBar(containerId, matTotals, allMaterialNames, refreshFn, calcKey) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const groups = Array.isArray(matTotals) ? matTotals : [{ label: null, totals: matTotals }];
  const mergedNames = new Set();
  groups.forEach((g) => Object.keys(g.totals || {}).forEach((n) => mergedNames.add(n)));
  const names = allMaterialNames && allMaterialNames.length ? allMaterialNames : [...mergedNames];
  if (!names.length) {
    el.innerHTML = "";
    return;
  }
  const matEntries = names.map((name) => [name, 0]);
  const owned = await ensureMaterialOwnedCache(calcKey || "chief_gear");
  const rowsId = `${containerId}_rows`;

  const barHtml = matEntries
    .map(([name]) => {
      const lower = name.toLowerCase();
      const iconKey = Object.keys(MATERIAL_ICONS).find((k) => lower.includes(k));
      const icon = iconKey ? `<img src="${MATERIAL_ICONS[iconKey]}" alt="" style="width:16px; height:16px; object-fit:contain; flex-shrink:0;" loading="lazy" />` : "";
      const haveQty = owned[name] || 0;
      return `<div style="flex:1; min-width:0;">
        <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
          ${icon}
          <span class="meta" style="font-size:11px; font-weight:600; letter-spacing:0.3px;">${esc(name)}</span>
        </div>
        <input type="text" inputmode="numeric" data-ownedmat="${esc(name)}" value="${haveQty}" style="width:100%; padding:8px 10px; font-size:14px;" />
      </div>`;
    })
    .join("");

  function rowsHtml() {
    return groups
      .map((g) => {
        const cells = names
          .map((name) => {
            const needed = Number((g.totals || {})[name]) || 0;
            const haveQty = owned[name] || 0;
            const stillNeed = Math.max(0, needed - haveQty);
            const surplus = Math.max(0, haveQty - needed);
            const statusColor = needed === 0 ? "var(--muted)" : stillNeed > 0 ? "var(--danger)" : "var(--good)";
            const statusText = needed === 0 ? "Not needed yet" : stillNeed > 0 ? `${stillNeed.toLocaleString()} still needed` : surplus > 0 ? `\u2713 ${surplus.toLocaleString()} extra` : "\u2713 Have enough";
            return `<div style="flex:1; min-width:0;">
              <div class="meta" style="font-size:10.5px;">${esc(name)} needed: <strong style="color:var(--frost);">${needed.toLocaleString()}</strong></div>
              <div style="font-size:12px; margin-top:2px; color:${statusColor};">${statusText}</div>
            </div>`;
          })
          .join("");
        const heading = g.label ? `<div style="flex-basis:100%; font-size:11px; font-weight:700; letter-spacing:0.4px; color:var(--frost); margin-bottom:2px;">${esc(g.label)}</div>` : "";
        return `<div style="display:flex; gap:16px; flex-wrap:wrap; flex-basis:100%;">${heading}${cells}</div>`;
      })
      .join(`<div style="flex-basis:100%; height:0; border-top:1px dashed var(--line); margin:6px 0;"></div>`);
  }

  el.innerHTML = `
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
      <span style="font-size:12px; font-weight:700; letter-spacing:0.5px; color:var(--frost);">AVAILABLE RESOURCES</span>
    </div>
    <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px;">${barHtml}</div>
    <div id="${rowsId}" style="display:flex; gap:16px; flex-wrap:wrap; padding-top:12px; border-top:1px solid var(--line);">${rowsHtml()}</div>
  `;

  el.querySelectorAll("[data-ownedmat]").forEach((input) => {
    input.addEventListener("change", async () => {
      let val = Number(input.value);
      if (Number.isNaN(val) || val < 0) val = 0;
      input.value = val;
      owned[input.dataset.ownedmat] = val;
      await saveCalcState(`material_owned_${calcKey || "chief_gear"}`, owned);
      // Only the "still needed" status text depends on owned amounts, so
      // update just that in place rather than tearing down the whole bar
      // (which would steal focus if the user clicks straight into another
      // field before this one's blur/change finishes).
      const rowsEl = document.getElementById(rowsId);
      if (rowsEl) rowsEl.innerHTML = rowsHtml();
    });
  });
}

async function updateChiefGearTotals() {
  if (!CHIEF_GEAR_ROWS) return;
  const rows = CHIEF_GEAR_ROWS;
  const CHIEF_GEAR_MATERIAL_COLS = [
    ["hardened_alloy", "Hardened Alloy"],
    ["polishing_solution", "Polishing Solution"],
    ["design_plan", "Design Plan"],
    ["amber", "Amber"],
  ];

  const matTotals = {};
  let totalPower = 0;
  CHIEF_GEAR_PIECES.forEach((p) => {
    const st = CHIEF_GEAR_STATE[p.key];
    const fromIdx = Math.min(st.from, st.to);
    const toIdx = Math.max(st.from, st.to);
    for (let i = fromIdx + 1; i <= toIdx; i++) {
      CHIEF_GEAR_MATERIAL_COLS.forEach(([col, label]) => {
        const v = Number(rows[i][col]) || 0;
        if (v) matTotals[label] = (matTotals[label] || 0) + v;
      });
    }
    const powerFrom = rows[fromIdx].power != null ? Number(rows[fromIdx].power) : 0;
    const powerTo = rows[toIdx].power != null ? Number(rows[toIdx].power) : 0;
    totalPower += powerTo - powerFrom;
  });

  renderChiefGearResourcesBar("gearOwned", matTotals, ["Hardened Alloy", "Polishing Solution", "Design Plan", "Amber"], updateChiefGearTotals, "chief_gear");

  updateChiefGearCurrentStats();
}

// Sums current Attack/Defense per troop type from its 2 pieces'
// current tier (each piece's stat applies to both Attack & Defense).
// Pure computation, reusable by both this page and the Stats dashboard.
// 3-piece (Defense, all troops) and 6-piece (Attack, all troops) set
// bonuses for equipping matching-tier gear. Confirmed player-provided
// values; the 6-piece table uses the same percentages as the 3-piece
// table, just requiring all 6 pieces (not just 3) to match tier.
let CHIEF_GEAR_SET_BONUS = {};
let CHIEF_GEAR_TIER_ORDER = [];
let CHIEF_GEAR_SET_BONUS_LOADED = false;
async function ensureChiefGearSetBonusData() {
  if (CHIEF_GEAR_SET_BONUS_LOADED) return;
  CHIEF_GEAR_SET_BONUS_LOADED = true;
  const rows = await sb(`chief_gear_set_bonus?select=tier,bonus_pct&order=sort_order.asc`);
  CHIEF_GEAR_SET_BONUS = {};
  CHIEF_GEAR_TIER_ORDER = [];
  rows.forEach((r) => {
    CHIEF_GEAR_SET_BONUS[r.tier] = Number(r.bonus_pct);
    CHIEF_GEAR_TIER_ORDER.push(r.tier);
  });
}

// Looks at all 6 pieces' current tier and returns which set bonuses
// are active. A piece counts toward a tier's requirement if it's at
// that tier OR HIGHER (a piece above the threshold still qualifies).
// 3-piece bonus needs >=3 pieces at/above some tier; 6-piece needs all 6.
function computeChiefGearSetBonus(stateObj) {
  if (!CHIEF_GEAR_ROWS) return { threeTier: null, threeBonus: 0, sixTier: null, sixBonus: 0 };
  const pieceTierIdx = CHIEF_GEAR_PIECES.map((p) => {
    const idx = stateObj[p.key].from;
    const tier = CHIEF_GEAR_ROWS[idx]?.tier;
    return tier ? CHIEF_GEAR_TIER_ORDER.indexOf(tier) : -1;
  });
  let threeTier = null, sixTier = null;
  // walk tiers from highest to lowest; first (highest) tier that enough pieces qualify for wins
  for (let ti = CHIEF_GEAR_TIER_ORDER.length - 1; ti >= 0; ti--) {
    const qualifying = pieceTierIdx.filter((idx) => idx >= ti).length;
    if (threeTier === null && qualifying >= 3) threeTier = CHIEF_GEAR_TIER_ORDER[ti];
    if (sixTier === null && qualifying >= 6) sixTier = CHIEF_GEAR_TIER_ORDER[ti];
    if (threeTier !== null && sixTier !== null) break;
  }
  return {
    threeTier,
    threeBonus: threeTier ? CHIEF_GEAR_SET_BONUS[threeTier] || 0 : 0,
    sixTier,
    sixBonus: sixTier ? CHIEF_GEAR_SET_BONUS[sixTier] || 0 : 0,
  };
}

// Returns {Lancer: {Attack, Defense}, Infantry: {...}, Marksman: {...}}.
// Per-piece stat boosts both Attack and Defense for its own troop type;
// the 3-piece bonus adds to Defense for ALL troops, the 6-piece bonus
// adds to Attack for ALL troops (per the in-game set bonus mechanic).
// Raw per-piece gear stat only, no set bonus baked in - used by the
// dashboard's "Chief" source since "Chief Bonus" tracks the set bonus
// as its own separate line (computeChiefGearStats bakes both together,
// which is right for the Chief Gear page's own display, but would
// double-count the bonus if reused for the dashboard breakdown).
function computeChiefGearRawStat(stateObj) {
  if (!CHIEF_GEAR_ROWS) return {};
  const rows = CHIEF_GEAR_ROWS;
  const troopTypes = ["Lancer", "Infantry", "Marksman"];
  const out = {};
  troopTypes.forEach((troop) => {
    const pieces = CHIEF_GEAR_PIECES.filter((p) => p.troop === troop);
    let sumStat = 0;
    for (const p of pieces) {
      const idx = stateObj[p.key].from;
      sumStat += parseStatPct(rows[idx]?.stat) || 0;
    }
    out[troop] = { Attack: sumStat, Defense: sumStat };
  });
  return out;
}
function computeChiefGearStats(stateObj) {
  if (!CHIEF_GEAR_ROWS) return {};
  const rows = CHIEF_GEAR_ROWS;
  const troopTypes = ["Lancer", "Infantry", "Marksman"];
  const { threeBonus, sixBonus } = computeChiefGearSetBonus(stateObj);
  const out = {};
  troopTypes.forEach((troop) => {
    const pieces = CHIEF_GEAR_PIECES.filter((p) => p.troop === troop);
    let sumStat = 0;
    for (const p of pieces) {
      const idx = stateObj[p.key].from;
      sumStat += parseStatPct(rows[idx]?.stat) || 0;
    }
    out[troop] = { Attack: sumStat + sixBonus, Defense: sumStat + threeBonus };
  });
  return out;
}
function maxedChiefGearState() {
  const out = {};
  CHIEF_GEAR_PIECES.forEach((p) => {
    out[p.key] = { from: Math.max(0, (CHIEF_GEAR_ROWS || []).length - 1) };
  });
  return out;
}

function updateChiefGearCurrentStats() {
  const el = document.getElementById("gearCurrentStats");
  if (!el || !CHIEF_GEAR_ROWS) return;
  const statByTroop = computeChiefGearRawStat(CHIEF_GEAR_STATE);
  const maxByTroop = computeChiefGearRawStat(maxedChiefGearState());
  const { threeTier, threeBonus, sixTier, sixBonus } = computeChiefGearSetBonus(CHIEF_GEAR_STATE);
  const results = Object.entries(statByTroop).map(([troop, stats]) => ({ troop, stats, max: maxByTroop[troop] }));

  const setBonusHtml = `
    <div class="grid g2" style="margin-bottom:14px;">
      <div class="metric">
        <div class="label">3-piece bonus (Defense, all troops)</div>
        <div class="val" style="color:${threeBonus ? "var(--good)" : "var(--muted)"};">${threeBonus ? `+${threeBonus}%` : "Not active"}</div>
      </div>
      <div class="metric">
        <div class="label">6-piece bonus (Attack, all troops)</div>
        <div class="val" style="color:${sixBonus ? "var(--good)" : "var(--muted)"};">${sixBonus ? `+${sixBonus}%` : "Not active"}</div>
      </div>
    </div>
  `;

  el.innerHTML =
    setBonusHtml +
    `<div class="grid g3" style="gap:12px;">` +
    results
      .map(
        (r, idx) => `
    <div style="${idx > 0 ? "border-left:1px solid var(--line); padding-left:12px;" : ""}">
      <div class="meta" style="margin-bottom:8px; font-weight:600; color:var(--frost);">${esc(r.troop)}</div>
      <div class="metric" style="padding:8px;"><div class="label" style="font-size:10px;">Total Attack &amp; Defense</div><div class="val" style="font-size:16px; margin-top:3px;">+${r.stats.Attack.toFixed(2)}%</div><div class="meta" style="font-size:9.5px; margin-top:2px;">of max +${r.max.Attack.toFixed(2)}%</div></div>
    </div>`
      )
      .join("") +
    `</div>`;
}

// Renders a "menu button + scrollable tab row" category switcher into
// containerEl. Only one category is shown at a time (matching the game's
// own menu pattern), selected via either the tabs or the "..." dropdown.
function renderCategorySwitcher(containerEl, categories, current, onSelect) {
  containerEl.innerHTML = `
    <div class="cat-switcher">
      <div style="position:relative;">
        <button class="cat-menu-btn" type="button" id="${containerEl.id}MenuBtn" title="All categories">&#9776;</button>
        <div class="cat-menu-panel" id="${containerEl.id}MenuPanel">
          ${categories.map((c) => `<button data-cat="${esc(c)}" class="${c === current ? "active" : ""}">${esc(c)} ${c === current ? "&#10003;" : ""}</button>`).join("")}
        </div>
      </div>
      <div class="cat-tabs" id="${containerEl.id}Tabs">
        ${categories.map((c) => `<button data-cat="${esc(c)}" class="${c === current ? "active" : ""}">${esc(c)}</button>`).join("")}
      </div>
    </div>
  `;
  const menuBtn = document.getElementById(`${containerEl.id}MenuBtn`);
  const menuPanel = document.getElementById(`${containerEl.id}MenuPanel`);
  menuBtn.addEventListener("click", (e) => {

    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      onSelect(btn.dataset.cat);

}

// Opens the tap-to-edit detail modal for a skin or island card. For plain
// skins this is just an Owned toggle (+ Count in max, when applicable);
// for islands (isIsland=true) it's a level dropdown, and owned is derived
// automatically from level > 0.
// Opens the tap-to-edit detail modal for a skin or island, as position
// `index` within `list` (the currently filtered/visible cards). Swiping the
// card left/right moves to the next/previous item without closing the
// modal - matching how the in-game gallery browses items.
function openGalleryDetailModal(list, index, { isIsland = false, onSave }) {
  const item = list[index];
  let modal = document.getElementById("galleryDetailModal");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "galleryDetailModal";
    modal.className = "modal-overlay";
    document.body.appendChild(modal);
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
  }
  const maxLvl = item.max_level ?? 10;
  const lvl = item.current_level ?? 0;
  const goTo = (newIndex) => {
    if (newIndex < 0 || newIndex >= list.length) return;
    openGalleryDetailModal(list, newIndex, { isIsland, onSave });
  };
  modal.innerHTML = `
    <div class="modal-box" id="galleryModalBox" style="max-width:320px; text-align:center; touch-action:pan-y;">
      ${!isIsland ? `<div class="meta" style="font-size:11px; margin-bottom:10px;">${index + 1} / ${list.length} &nbsp;\u2022&nbsp; swipe to browse</div>` : ""}
      <div class="thumb" style="width:140px; height:140px; margin:0 auto 14px; border-radius:12px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; overflow:hidden; padding:6%;">
        ${item.image_url ? `<img src="${esc(item.image_url)}" alt="" style="width:100%; height:100%; object-fit:contain;" />` : `<div class="ph" style="font-size:32px; color:var(--muted); font-weight:600;">${esc(item.name[0])}</div>`}
      </div>
      <h2 style="margin-bottom:4px;">${esc(item.name)}</h2>
      <p class="desc" style="margin-bottom:16px;">${esc(item.category || "")}</p>
      ${isIsland
        ? `<div class="field" style="text-align:left;">
             <label>Current level</label>
             <select id="galleryModalLevel" style="width:100%;">
               ${Array.from({ length: maxLvl + 1 }, (_, i) => `<option value="${i}" ${i === lvl ? "selected" : ""}>${i === 0 ? "0 (not built)" : `Lv. ${i}`}</option>`).join("")}
             </select>
           </div>
           <label style="display:flex; align-items:center; gap:6px; justify-content:center; cursor:pointer; margin-bottom:4px;">
             <input type="checkbox" id="galleryModalIslandOwned" ${item.owned ? "checked" : ""} />
             <span class="meta" style="font-size:12px;">Owned</span>
           </label>`
        : `<button class="btn" id="galleryModalOwnedBtn" style="width:100%; margin-bottom:${item.show_count_toggle ? "10px" : "0"};">${item.owned ? "\u2713 Owned \u2014 tap to unown" : "Mark as owned"}</button>
           ${item.show_count_toggle ? `<label style="display:flex; align-items:center; gap:6px; justify-content:center; cursor:pointer;">
             <input type="checkbox" id="galleryModalCountInMax" ${item.count_in_max !== false ? "checked" : ""} />
             <span class="meta" style="font-size:12px;">Count toward max totals</span>
           </label>` : ""}`
      }
      ${isIsland
        ? `<button class="btn ghost small" id="galleryModalClose" style="width:100%; margin-top:16px;">Close</button>`
        : `<div style="display:flex; gap:8px; margin-top:16px;">
             <button class="btn ghost small" id="galleryModalPrev" style="flex:1;" ${index === 0 ? "disabled" : ""}>&#8592; Prev</button>
             <button class="btn ghost small" id="galleryModalClose" style="flex:1;">Close</button>
             <button class="btn ghost small" id="galleryModalNext" style="flex:1;" ${index === list.length - 1 ? "disabled" : ""}>Next &#8594;</button>
           </div>`
      }
    </div>`;
  modal.style.display = "flex";
  document.getElementById("galleryModalClose").addEventListener("click", () => { modal.style.display = "none"; });

  if (!isIsland) {
    document.getElementById("galleryModalPrev").addEventListener("click", () => goTo(index - 1));
    document.getElementById("galleryModalNext").addEventListener("click", () => goTo(index + 1));

    // Swipe left/right on the card to move between items (skins only -
    // islands are edited one at a time with no browsing). Touch-only;
    // vertical scrolling still works normally via touch-action:pan-y above.
    const box = document.getElementById("galleryModalBox");
    let touchStartX = null, touchStartY = null;
    box.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    box.addEventListener("touchend", (e) => {
      if (touchStartX == null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      touchStartX = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx < 0) goTo(index + 1);
        else goTo(index - 1);
      }
    }, { passive: true });
  }

  if (isIsland) {
    document.getElementById("galleryModalLevel").addEventListener("change", async (e) => {
      const newLvl = Number(e.target.value);
      await onSave(item, { current_level: newLvl });
      item.current_level = newLvl;
    });
    document.getElementById("galleryModalIslandOwned").addEventListener("change", async (e) => {
      await onSave(item, { owned: e.target.checked });
      item.owned = e.target.checked;
    });
  } else {
    document.getElementById("galleryModalOwnedBtn").addEventListener("click", async () => {
      await onSave(item, { owned: !item.owned });
      item.owned = !item.owned;
      goTo(index);
    });
    const cim = document.getElementById("galleryModalCountInMax");
    if (cim) {
      cim.addEventListener("change", async () => {
        await onSave(item, { count_in_max: cim.checked });
        item.count_in_max = cim.checked;
      });
    }
  }
}

  content.innerHTML = `

  if (SKIN_FILTER.category === "all" || !categories.includes(SKIN_FILTER.category)) {

  function onSkinCatSelect(cat) {

  const globeLevelSelect = document.getElementById("globeLevelSelect");
  globeLevelSelect.value = globeLevelSaved.level;
  const GLOBE_LEVEL_ROMAN = { 1: "I", 2: "II", 3: "III", 4: "IV", 5: "V", 6: "VI" };
  // Extra skins auto-owned at specific globe levels, beyond the matching Frost Sphere.
  const GLOBE_LEVEL_EXTRA_SKINS = {
    2: ["Fireborn Expeditioner"],
    3: ["Gate of Time"],
    5: ["Star Radiance"],
  };
  function namesForGlobeLevel(level) {
    if (!level) return [];
    const roman = GLOBE_LEVEL_ROMAN[level];
    return [`Frost Sphere ${roman}`, ...(GLOBE_LEVEL_EXTRA_SKINS[level] || [])];
  }
  // Every skin tied to the Globe Level selector, across all 6 levels (Frost
  // Sphere I-VI plus the extra per-level unlocks). These are excluded from
  // totals entirely until a globe level is picked, and only the currently
  // selected level's items count afterward (not a theoretical ceiling).
  const ALL_GLOBE_WIRED_NAMES = new Set([
    ...Object.values(GLOBE_LEVEL_ROMAN).map((roman) => `Frost Sphere ${roman}`),
    ...Object.values(GLOBE_LEVEL_EXTRA_SKINS).flat(),
  ]);
  // Regardless of the dropdown, if the user has manually toggled one or more
  // Frost Sphere cards owned directly, the HIGHEST owned tier is what
  // actually counts toward current/max - not necessarily the dropdown value.
  function deriveEffectiveGlobeLevel() {
    let highest = 0;
    for (let level = 1; level <= 6; level++) {
      const roman = GLOBE_LEVEL_ROMAN[level];
      const skin = skins.find((s) => s.name === `Frost Sphere ${roman}`);
      if (skin && skin.owned) highest = level;
    }
    return highest || globeLevelSaved.level;
  }
  globeLevelSelect.addEventListener("change", async (e) => {
    const level = Number(e.target.value);
    const prevLevel = globeLevelSaved.level;
    await saveCalcState("skin_globe_level", { level });
    globeLevelSaved.level = level;

    const changed = [];
    // Un-own whatever the previous level auto-owned.
    if (prevLevel !== level) {
      for (const name of namesForGlobeLevel(prevLevel)) {
        const matchingSkin = skins.find((s) => s.name === name);
        if (matchingSkin && matchingSkin.owned) {
          try {
            await sb(`skins?id=eq.${matchingSkin.id}`, { method: "PATCH", body: JSON.stringify({ owned: false }) });
            matchingSkin.owned = false;
            changed.push(`-${name}`);
          } catch (err) {
            toast(`Couldn't update ${name}`, true);
          }
        }
      }
    }
    // Own whatever the new level auto-owns.
    for (const name of namesForGlobeLevel(level)) {
      const matchingSkin = skins.find((s) => s.name === name);
      if (matchingSkin && !matchingSkin.owned) {
        try {
          await sb(`skins?id=eq.${matchingSkin.id}`, { method: "PATCH", body: JSON.stringify({ owned: true }) });
          matchingSkin.owned = true;
          changed.push(name);
        } catch (err) {
          toast(`Couldn't update ${name}`, true);
        }
      }
    }
    if (changed.length) {
      toast(`Updated: ${changed.join(", ")}`);
      computeAndRender();
    }
  });

  function computeAndRender() {
    const filtered = skins.filter((s) => {
      if (SKIN_FILTER.category !== "all" && s.category !== SKIN_FILTER.category) return false;
      if (SKIN_FILTER.ownedFilter === "owned" && !s.owned) return false;
      if (SKIN_FILTER.ownedFilter === "not" && s.owned) return false;
      if (SKIN_FILTER.search && !s.name.toLowerCase().includes(SKIN_FILTER.search.toLowerCase())) return false;
      return true;
    });

    const ownedCount = skins.filter((s) => s.owned).length;
    document.getElementById("skinSummaryLine").textContent =
      `${ownedCount} / ${skins.length} skins owned \u00b7 tap any skin to view details`;

    // totals by bonus_type: current (owned only) vs max (everything, as if fully owned).
    // Skins sharing a display_group (e.g. Frost Sphere I-VI) are mutually
    // exclusive tiers of the same item, so max only counts the single
    // highest tier per group/stat, not the sum of every tier.
    const STAT_SLOTS = [
      ["bonus_type", "bonus_value"],
      ["bonus_type2", "bonus_value2"],
      ["bonus_type3", "bonus_value3"],
      ["bonus_type4", "bonus_value4"],
    ];
    const totalsByType = {};
    const maxByType = {};
    const maxByGroupType = {}; // { "Frost Sphere|Troops Attack": highestValueSoFar }
    const currentGlobeNames = new Set(namesForGlobeLevel(deriveEffectiveGlobeLevel()));
    for (const s of skins) {
      // Globe-wired skins (Frost Sphere tiers + per-level extras) don't count
      // toward totals at all until a globe level is picked, and only the
      // currently selected level's items count afterward - not every tier.
      if (ALL_GLOBE_WIRED_NAMES.has(s.name) && !currentGlobeNames.has(s.name)) continue;
      const includeInMax = s.count_in_max !== false;
      STAT_SLOTS.forEach(([tk, vk]) => {
        if (s[vk] == null) return;
        const key = s[tk] || "Other";
        const val = Number(s[vk]);
        if (includeInMax) {
          if (s.display_group) {
            const groupKey = `${s.display_group}|${key}`;
            const prevMax = maxByGroupType[groupKey] || 0;
            if (val > prevMax) {
              maxByType[key] = (maxByType[key] || 0) - prevMax + val;
              maxByGroupType[groupKey] = val;
            }
          } else {
            maxByType[key] = (maxByType[key] || 0) + val;
          }
        }
        if (s.owned) totalsByType[key] = (totalsByType[key] || 0) + val;
      });
    }
    const STAT_ORDER = ["Attack", "Defense", "Lethality", "Health"];
    function statOrderIndex(label) {
      const bare = label.replace(/^Troops?\s+/i, "");
      return STAT_ORDER.indexOf(bare);
    }
    const totalEntries = Object.entries(maxByType).sort((a, b) => {
      const ia = statOrderIndex(a[0]);
      const ib = statOrderIndex(b[0]);
      if (ia === -1 && ib === -1) return a[0].localeCompare(b[0]);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
    document.getElementById("skinTotals").innerHTML = totalEntries.length
      ? totalEntries
          .map(([type, maxVal]) => {
            const bare = type.replace(/^Troops?\s+/i, "");
            const label = STAT_ORDER.includes(bare) ? `Troop ${bare}` : type;
            return `<div class="metric"><div class="label">Total ${esc(label)}</div><div class="val">+${(totalsByType[type] || 0).toFixed(1)}%</div><div class="meta" style="font-size:11px; margin-top:2px;">of max +${maxVal.toFixed(1)}%</div></div>`;
          })
          .join("")
      : `<div class="metric" style="grid-column:1/-1;"><div class="label">Total bonus</div><div class="val">+0%</div><div class="meta" style="font-size:11px; margin-top:2px;">Mark skins as owned to see totals</div></div>`;


    const sections = document.getElementById("skinSections");
    // filtered is already scoped to the one selected category (plus search/
    // owned filters), so this renders a single flat grid - no more
    // per-category panels stacked on top of each other.
    const ordered = [
      ...filtered.filter((s) => !s.show_count_toggle),
      ...filtered.filter((s) => s.show_count_toggle),
    ];
    if (!ordered.length) {
      sections.innerHTML = `<div class="panel"><div class="empty"><div class="big">No skins match your filters.</div></div></div>`;
      return;
    }
    sections.innerHTML = `
      <div class="gallery-grid">
        ${ordered
          .map((s, idx) => {
            const isLastGlobe = s.display_group === "Frost Sphere" && ordered[idx + 1]?.display_group !== "Frost Sphere";
            const isLastNonToggle = !s.show_count_toggle && ordered[idx + 1]?.show_count_toggle;
            return `
          <div class="gallery-card ${s.owned ? "owned" : ""}" data-skin="${s.id}">
            <div class="thumb">
              ${s.image_url ? `<img src="${esc(s.image_url)}" alt="" loading="lazy" />` : `<div class="ph">${esc(s.name[0])}</div>`}
            </div>
            <div class="badge">${esc(s.name)}</div>
          </div>${isLastGlobe || isLastNonToggle ? `<div style="grid-column:1/-1; height:1px; background:var(--line); margin:2px 0;"></div>` : ""}`;
          })
          .join("")}
      </div>
    `;

    sections.querySelectorAll("[data-skin]").forEach((el) => {
      el.addEventListener("click", () => {
        const idx = ordered.findIndex((s) => s.id === el.dataset.skin);
        openGalleryDetailModal(ordered, idx, {
          isIsland: false,
          onSave: async (skin, patch) => {
            try {
              await sb(`skins?id=eq.${skin.id}`, { method: "PATCH", body: JSON.stringify(patch) });
              Object.assign(skin, patch);
              computeAndRender();
            } catch (err) {
              toast("Couldn't update skin", true);
            }
          },
        });
      });
    });
    }

  document.getElementById("skinSearch").addEventListener("input", (e) => {
    SKIN_FILTER.search = e.target.value;
    computeAndRender();
  });
  document.getElementById("ownedSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-owned]");
    if (!btn) return;
    SKIN_FILTER.ownedFilter = btn.dataset.owned;
    document.querySelectorAll("#ownedSeg button").forEach((b) => b.classList.toggle("active", b === btn));
    computeAndRender();
  });

  computeAndRender();
}

    const ia = BONUS_ORDER.indexOf(a);

  if (ISLAND_FILTER.bonusType === "all" || !bonusTypes.includes(ISLAND_FILTER.bonusType)) {
    ISLAND_FILTER.bonusType = bonusTypes[0] || "all";
  }
  function onIslandCatSelect(cat) {
    ISLAND_FILTER.bonusType = cat;
    renderCategorySwitcher(document.getElementById("islandCatSwitcher"), bonusTypes, ISLAND_FILTER.bonusType, onIslandCatSelect);
    computeAndRender();
  }
  renderCategorySwitcher(document.getElementById("islandCatSwitcher"), bonusTypes, ISLAND_FILTER.bonusType, onIslandCatSelect);

  function computeAndRender() {
    const filtered = islands.filter((s) => {
      const groups = groupsFor(s);
      if (ISLAND_FILTER.bonusType !== "all" && !groups.includes(ISLAND_FILTER.bonusType)) return false;
      if (ISLAND_FILTER.ownedFilter === "owned" && !s.owned) return false;
      if (ISLAND_FILTER.ownedFilter === "not" && s.owned) return false;
      if (ISLAND_FILTER.search && !s.name.toLowerCase().includes(ISLAND_FILTER.search.toLowerCase())) return false;
      return true;

    const ownedCount = islands.filter((s) => s.owned).length;
    document.getElementById("islandSummaryLine").textContent =
      `${ownedCount} / ${islands.length} islands owned \u00b7 tap any island to set its level`;

    // Total Attack/Defense/Lethality/Health per troop: raw-stat islands count
    // toward every troop (they buff all troops equally); display_group
    // islands (MVP, Lighthouses) count toward every troop too, since their
    // stats are still real Attack/Defense/Lethality/Health values.
    // Row 1: general (troop-agnostic) totals from islands with a plain
    // Attack/Defense/Lethality/Health stat (these buff every troop equally).
    // Row 2: totals from islands whose stat is already troop-specific
    // (Infantry Attack, Lancers Defense, etc. - the Island Guide buildings).
    const generalTotals = {}; // stat -> {cur, max}
    const specificTotals = {}; // "Troop Stat" -> {cur, max}
    for (const s of islands) {
      const lvl = s.current_level ?? 0;
      const maxLvl = s.max_level ?? 10;
      STAT_SLOTS.forEach(([typeKey, valKey, levelKey]) => {
        const stat = s[typeKey];
        if (s[valKey] == null || !stat) return;
        const unlockLvl = s[levelKey];

        if (RAW_STATS.includes(stat)) {
          generalTotals[stat] = generalTotals[stat] || { cur: 0, max: 0 };
          generalTotals[stat].max += Number(s[valKey]);
          generalTotals[stat].cur += effective;
        } else {
          const isTroopStat = TROOPS.some((t) => stat.startsWith(t));
          if (!isTroopStat) return;
          specificTotals[stat] = specificTotals[stat] || { cur: 0, max: 0 };
          specificTotals[stat].max += Number(s[valKey]);
          specificTotals[stat].cur += effective;
        }
      });
    }
    const row1 = RAW_STATS.map((stat) => {
      const t = generalTotals[stat] || { cur: 0, max: 0 };
      return `<div class="metric"><div class="label">Troops ${esc(stat)}</div><div class="val">+${t.cur.toFixed(1)}%</div><div class="meta" style="font-size:11px; margin-top:2px;">of max +${t.max.toFixed(1)}%</div></div>`;

    const row2Order = ["Infantry Attack", "Infantry Defense", "Lancers Attack", "Lancers Defense", "Marksman Attack", "Marksman Defense"];
    const row2 = row2Order.map((label) => {
      const t = specificTotals[label] || { cur: 0, max: 0 };
      return `<div class="metric"><div class="label">${esc(label)}</div><div class="val">+${t.cur.toFixed(1)}%</div><div class="meta" style="font-size:11px; margin-top:2px;">of max +${t.max.toFixed(1)}%</div></div>`;
    }).join("");
    document.getElementById("islandTroopTotals").innerHTML = row1 + row2;

    const sections = document.getElementById("islandSections");
    // filtered is already scoped to the one selected category, so render a
    // single flat grid instead of stacked per-category panels.
    if (!filtered.length) {
      sections.innerHTML = `<div class="panel"><div class="empty"><div class="big">No islands match your filters.</div></div></div>`;
      return;
    }
    sections.innerHTML = `
      <div class="gallery-grid">
        ${filtered
          .map((s) => `
          <div class="gallery-card ${s.owned ? "owned" : ""}" data-island="${s.id}">
            <div class="thumb island-thumb">
              ${s.image_url ? `<img src="${esc(s.image_url)}" alt="" loading="lazy" />` : `<div class="ph">${esc(s.name[0])}</div>`}
            </div>
            <div class="badge">${esc(s.name)} &middot; Lv${s.current_level ?? 0}</div>
          </div>`)
          .join("")}
      </div>
    `;

    sections.querySelectorAll("[data-island]").forEach((el) => {
      el.addEventListener("click", () => {
        const idx = filtered.findIndex((s) => s.id === el.dataset.island);
        openGalleryDetailModal(filtered, idx, {
          isIsland: true,
          onSave: async (island, patch) => {
            try {
              await sb(`skins?id=eq.${island.id}`, { method: "PATCH", body: JSON.stringify(patch) });
              Object.assign(island, patch);
              computeAndRender();
            } catch (err) {
              toast("Couldn't update island", true);
            }
          },
        });
      });
    });
  }

  document.getElementById("islandSearch").addEventListener("input", (e) => {
    ISLAND_FILTER.search = e.target.value;
    computeAndRender();
  });
  document.getElementById("islandOwnedSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-owned]");
    if (!btn) return;
    ISLAND_FILTER.ownedFilter = btn.dataset.owned;
    document.querySelectorAll("#islandOwnedSeg button").forEach((b) => b.classList.toggle("active", b === btn));
    computeAndRender();
  });

  computeAndRender();
}

// VIP 9-12 tier selector + full ATTACK/DEFENSE/LETHALITY/HEALTH
// reference table, using its own dedicated buff_table (not the
// shared master matrix, since it needed a distinct column set).
let VIP_ROWS_CACHE = null; // [{ name, Attack, Defense, Lethality, Health }, ...]
let VIP_SELECTED_INDEX = null;
let EXPERTS_STATE_GLOBAL = null;
// Hero star ascension shard costs: each star has 6 sub-levels (T1..T6).
// Per-star totals 10 / 40 / 115 / 300 / 600 = 1,065 to fully max a hero.
const HERO_SHARD_CHART = {
  1: [1, 1, 2, 2, 2, 2],
  2: [5, 5, 5, 5, 5, 15],
  3: [15, 15, 15, 15, 15, 40],
  4: [40, 40, 40, 40, 40, 100],
  5: [100, 100, 100, 100, 100, 100],
};
// current = { star: 0-5, sub: 0-6 } -> shards to finish the next star, and to 5★ max.
function heroShardsNeeded(star, sub) {
  let toNext = 0, toMax = 0;
  for (let st = 1; st <= 5; st++) {
    const steps = HERO_SHARD_CHART[st];
    for (let i = 0; i < steps.length; i++) {
      const done = st < star + 1 ? true : st === star + 1 ? i < sub : false;
      if (done) continue;
      toMax += steps[i];
      if (st === star + 1) toNext += steps[i];
    }
  }
  return { toNext, toMax };
}

let GLOBE_LEVEL_GLOBAL = 0;
const GLOBE_LEVEL_ROMAN_GLOBAL = { 1: "I", 2: "II", 3: "III", 4: "IV", 5: "V", 6: "VI" };
const GLOBE_LEVEL_EXTRA_SKINS_GLOBAL = {
  2: ["Fireborn Expeditioner"],
  3: ["Gate of Time"],
  5: ["Star Radiance"],
};
const ALL_GLOBE_WIRED_NAMES_GLOBAL = new Set([
  ...Object.values(GLOBE_LEVEL_ROMAN_GLOBAL).map((roman) => `Frost Sphere ${roman}`),
  ...Object.values(GLOBE_LEVEL_EXTRA_SKINS_GLOBAL).flat(),
]);
function namesForGlobeLevelGlobal(level) {
  if (!level) return [];
  const roman = GLOBE_LEVEL_ROMAN_GLOBAL[level];
  return [`Frost Sphere ${roman}`, ...(GLOBE_LEVEL_EXTRA_SKINS_GLOBAL[level] || [])];

async function ensureGlobeLevelData(allSkinsData) {
  const saved = await loadCalcState("skin_globe_level");
  const savedLevel = (saved && typeof saved.level === "number") ? saved.level : 0;
  // Regardless of the saved dropdown value, if one or more Frost Sphere
  // skins are actually marked owned, the HIGHEST owned tier wins.
  // Reuses the already-fetched allSkins list instead of a second query.
  let highest = 0;
  for (let level = 1; level <= 6; level++) {
    const roman = GLOBE_LEVEL_ROMAN_GLOBAL[level];
    const skin = allSkinsData.find((s) => s.name === `Frost Sphere ${roman}`);
    if (skin && skin.owned) highest = level;
  }
  GLOBE_LEVEL_GLOBAL = highest || savedLevel;
}

let EXPERT_MAIN_STAT_GLOBAL_MAP = {}; // {key: "ATK"|"DEF"|"DMG"|"HP"}
let EXPERT_MAIN_STAT_TROOP_GLOBAL_MAP = {}; // {key: "Lancers"|"Infantry"} only for restricted experts
let EXPERTS_ROSTER_LOADED = false;
async function ensureExpertsRosterGlobal() {
  if (EXPERTS_ROSTER_LOADED) return;
  EXPERTS_ROSTER_LOADED = true;
  const rows = await sb(`experts?select=key,img,skill1,skill2,skill3,skill4,main_stat,main_stat_troop,sort_order&order=sort_order.asc`);
  EXPERTS_IN_ORDER_GLOBAL = rows.map((r) => r.key);
  EXPERT_MAIN_STAT_GLOBAL_MAP = {};
  EXPERT_MAIN_STAT_TROOP_GLOBAL_MAP = {};
  EXPERTS_LIST = [];
  rows.forEach((r) => {
    EXPERT_MAIN_STAT_GLOBAL_MAP[r.key] = r.main_stat;
    if (r.main_stat_troop) EXPERT_MAIN_STAT_TROOP_GLOBAL_MAP[r.key] = r.main_stat_troop;
    const skills = [r.skill1, r.skill2, r.skill3, r.skill4].filter(Boolean);
    if (r.img && skills.length === 4) {
      EXPERTS_LIST.push({ key: r.key, img: r.img, skills });
    }
  });
}

async function ensureExpertsTroopStatsData() {
  if (EXPERTS_STATE_GLOBAL) return;
  await ensureExpertsRosterGlobal();
  EXPERTS_STATE_GLOBAL = (await loadCalcState("experts")) || {};
  EXPERTS_UNLOCKED_GLOBAL = (await loadCalcState("experts_unlocked")) || {};
  const affinityRows = await sb(`expert_affinity_nodes?select=expert,level,stat_type,stat_value&order=sort_order`);
  EXPERT_AFFINITY_CACHE_GLOBAL = {};
  affinityRows.forEach((r) => {
    if (!EXPERT_AFFINITY_CACHE_GLOBAL[r.expert]) EXPERT_AFFINITY_CACHE_GLOBAL[r.expert] = [];
    EXPERT_AFFINITY_CACHE_GLOBAL[r.expert].push(r);
  });
  const skillRows = await sb(
    `expert_skill_nodes?select=expert,skill,level,stat_type,stat_value&expert=in.(Romulus,Gareth)&stat_type=not.is.null&order=sort_order`
  );
  EXPERT_TROOP_SKILL_CACHE_GLOBAL = {};
  skillRows.forEach((r) => {
    const key = `${r.expert}|${r.skill}`;
    if (!EXPERT_TROOP_SKILL_CACHE_GLOBAL[key]) EXPERT_TROOP_SKILL_CACHE_GLOBAL[key] = [];
    EXPERT_TROOP_SKILL_CACHE_GLOBAL[key].push(r);
  });
}
// Same logic as the Experts page's computeBaseTroopStats(): all 10 experts'
// level-based base stats, plus Romulus's Last Line & Spirit of Aeetis and
// Gareth's Porcupine & Undefeated Will skills. Troop-agnostic (same bonus
// applies to all troop types).
function computeExpertsTroopStatsGlobal(useMax) {
  const totals = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
  const ALL_EXPERTS = EXPERTS_LIST.map((e) => e.key);
  ALL_EXPERTS.forEach((hero) => {
    if (EXPERTS_UNLOCKED_GLOBAL && EXPERTS_UNLOCKED_GLOBAL[hero] === false) return;
    const rows = (EXPERT_AFFINITY_CACHE_GLOBAL && EXPERT_AFFINITY_CACHE_GLOBAL[hero]) || [];
    if (!rows.length) return;
    let row;
    if (useMax) {
      row = rows[rows.length - 1];
    } else {
      const lvl = EXPERTS_STATE_GLOBAL[hero] ? EXPERTS_STATE_GLOBAL[hero].current : 0;
      row = rows.find((r) => r.level === lvl);
    }
    if (row && row.stat_type) {
      row.stat_type.split(",").forEach((statName) => {
        if (totals[statName] != null) totals[statName] += Number(row.stat_value) || 0;
      });
    }
  });
  [
    ["Romulus", "Last Line"],
    ["Romulus", "Spirit of Aeetis"],
    ["Gareth", "Porcupine"],
    ["Gareth", "Undefeated Will"],
  ].forEach(([hero, skill]) => {
    if (EXPERTS_UNLOCKED_GLOBAL && EXPERTS_UNLOCKED_GLOBAL[hero] === false) return;
    const rows = (EXPERT_TROOP_SKILL_CACHE_GLOBAL && EXPERT_TROOP_SKILL_CACHE_GLOBAL[`${hero}|${skill}`]) || [];
    if (!rows.length) return;
    let row;
    if (useMax) {
      row = rows[rows.length - 1];
    } else {
      const st = EXPERTS_STATE_GLOBAL[hero] && EXPERTS_STATE_GLOBAL[hero].skills && EXPERTS_STATE_GLOBAL[hero].skills[skill];
      const cur = st ? st.current : 0;
      let match = null;
      rows.forEach((r) => {
        if (r.level <= cur) match = r;
      });
      row = match;
    }
    if (row && row.stat_type) {
      row.stat_type.split(",").forEach((statName) => {
        if (totals[statName] != null) totals[statName] += Number(row.stat_value) || 0;
      });
    }
  });
  return totals;
}

// ---- Experts Research (Dashboard wiring) ----
// Mirrors the logic in renderExpertsResearchPage(): general experts'
// rotation+main stat apply to all 3 troop types; Gareth's main stat is
// Lancers-only, Justus's is Infantry-only. Marksman gets general only.
let EXPERTS_RESEARCH_NODES_GLOBAL = null; // { expert: { pathNum: [rows] } }
let EXPERTS_RESEARCH_STATE_GLOBAL = null; // saved current/desired per expert/path
let EXPERTS_RESEARCH_UNLOCKED_GLOBAL = null;
async function ensureExpertsResearchDataGlobal() {
  if (EXPERTS_RESEARCH_NODES_GLOBAL) return;
  await ensureExpertsRosterGlobal();
  const rows = await sb(`expert_research_nodes?select=expert,path_number,level,stat_type,stat_value&order=sort_order`);
  EXPERTS_RESEARCH_NODES_GLOBAL = {};
  rows.forEach((r) => {
    if (!EXPERTS_RESEARCH_NODES_GLOBAL[r.expert]) EXPERTS_RESEARCH_NODES_GLOBAL[r.expert] = {};
    if (!EXPERTS_RESEARCH_NODES_GLOBAL[r.expert][r.path_number]) EXPERTS_RESEARCH_NODES_GLOBAL[r.expert][r.path_number] = [];
    EXPERTS_RESEARCH_NODES_GLOBAL[r.expert][r.path_number].push(r);
  });
  EXPERTS_RESEARCH_STATE_GLOBAL = (await loadCalcState("experts_research")) || {};
  EXPERTS_RESEARCH_UNLOCKED_GLOBAL = (await loadCalcState("experts_research_unlocked")) || {};
}
function expertsResearchPathNumbersGlobal(expert) {
  return Object.keys((EXPERTS_RESEARCH_NODES_GLOBAL && EXPERTS_RESEARCH_NODES_GLOBAL[expert]) || {})
    .map(Number)
    .sort((a, b) => a - b);
}
function expertsResearchPathCostGlobal(expert, pathNum, fromLevel, toLevel) {
  const pathRows = ((EXPERTS_RESEARCH_NODES_GLOBAL && EXPERTS_RESEARCH_NODES_GLOBAL[expert]) || {})[pathNum] || [];
  const stats = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
  pathRows.forEach((r) => {
    if (r.level > fromLevel && r.level <= toLevel) {
      if (stats[r.stat_type] != null) stats[r.stat_type] += Number(r.stat_value) || 0;
    }
  });
  const mainStat = EXPERT_MAIN_STAT_GLOBAL_MAP[expert];
  if (mainStat && stats[mainStat] != null) {
    const clampedFrom = Math.max(0, Math.min(200, fromLevel));
    const clampedTo = Math.max(0, Math.min(200, toLevel));
    const levelsCrossed = Math.max(0, clampedTo - clampedFrom);
    let rate = 0.01;
    if (expert === "Gareth" || expert === "Justus") {
      rate = pathNum <= 3 ? 0.03 : 0.05;
    }
    stats[mainStat] += levelsCrossed * rate;
  }
  return stats;
}
function expertsResearchIsUnlockedGlobal(expert) {
  return EXPERTS_RESEARCH_UNLOCKED_GLOBAL && EXPERTS_RESEARCH_UNLOCKED_GLOBAL[expert] === false ? false : true;
}
// calcTroop: "Infantry" | "Lancer" | "Marksman". Returns {ATK,DEF,DMG,HP}.
function computeExpertsResearchTroopStatsGlobal(calcTroop, useMax) {
  const totals = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
  if (!EXPERTS_RESEARCH_NODES_GLOBAL) return totals;
  const includeExperts = new Set(EXPERTS_IN_ORDER_GLOBAL.filter((e) => e !== "Gareth" && e !== "Justus"));
  if (calcTroop === "Infantry") includeExperts.add("Justus");
  if (calcTroop === "Lancer") includeExperts.add("Gareth");
  includeExperts.forEach((expert) => {
    if (!expertsResearchIsUnlockedGlobal(expert)) return;
    expertsResearchPathNumbersGlobal(expert).forEach((p) => {
      if (useMax) {
        const stats = expertsResearchPathCostGlobal(expert, p, 0, 200);
        Object.keys(stats).forEach((k) => (totals[k] += stats[k]));
      } else {
        const st = (EXPERTS_RESEARCH_STATE_GLOBAL[expert] || {})[p] || { current: 0 };
        const stats = expertsResearchPathCostGlobal(expert, p, 0, st.current);
        Object.keys(stats).forEach((k) => (totals[k] += stats[k]));
      }
    });
  });
  return totals;
}

async function ensureVipData() {
  if (!VIP_ROWS_CACHE) {
    let [table] = await sb(`buff_tables?name=eq.VIP Tier&user_id=eq.${USER_ID}&select=id`);
    if (!table) {
      VIP_ROWS_CACHE = [];
    } else {
      const [columns, rows] = await Promise.all([
        sb(`buff_columns?table_id=eq.${table.id}&select=id,name&order=sort_order.asc`),
        sb(`buff_rows?table_id=eq.${table.id}&select=id,name,sort_order,buff_cells(value,column_id)&order=sort_order.asc`),
      ]);
      const colNameById = Object.fromEntries(columns.map((c) => [c.id, c.name]));
      VIP_ROWS_CACHE = rows.map((r) => {
        const entry = { name: r.name };
        r.buff_cells.forEach((c) => {
          if (c.value == null) return;
          entry[colNameById[c.column_id]] = Number(c.value);
        });
        return entry;
      });
    }
  }
  // Always re-read the saved tier (not just once) so switching VIP tier on
  // its own page is reflected the next time the dashboard renders.
  if (VIP_ROWS_CACHE.length) {
    const saved = await loadCalcState("vip_tier");
    VIP_SELECTED_INDEX = VIP_ROWS_CACHE.length - 1;
    if (saved) {
      const byName = VIP_ROWS_CACHE.findIndex((r) => r.name === saved.name);
      if (byName !== -1) VIP_SELECTED_INDEX = byName;
      else if (typeof saved.index === "number" && saved.index >= 0 && saved.index < VIP_ROWS_CACHE.length) VIP_SELECTED_INDEX = saved.index;
    }
  }
}
