// ---- Progression Tables editor (Chief Gear, Hero Gear Mastery Forging/Enhancement/Empowerment) ----
async function renderAdminProgression(body, nameFilter) {
  let tables = await sb(`progression_tables?select=id,name&order=name.asc`);
  if (nameFilter) tables = tables.filter((t) => nameFilter.includes(t.name));
  if (!ADMIN_ACTIVE_PROGRESSION || !tables.find((t) => t.id === ADMIN_ACTIVE_PROGRESSION)) {
    ADMIN_ACTIVE_PROGRESSION = tables[0] ? tables[0].id : null;
  }
  const activeTableName = tables.find((t) => t.id === ADMIN_ACTIVE_PROGRESSION)?.name || "";
  const isChiefGear = activeTableName === "Chief Gear";
  const isHeroGear = activeTableName.startsWith("Hero Gear");
  const materialCols = isChiefGear
    ? [
        { key: "hardened_alloy", label: "Hardened Alloy", type: "number" },
        { key: "polishing_solution", label: "Polishing Solution", type: "number" },
        { key: "design_plan", label: "Design Plan", type: "number" },
        { key: "amber", label: "Amber", type: "number" },
      ]
    : isHeroGear
    ? [
        { key: "mithril", label: "Mithril", type: "number" },
        { key: "mythic_gear", label: "Mythic Gear", type: "number" },
        { key: "xp_component", label: "XP Component", type: "number" },
        { key: "essence_stones", label: "Essence Stones", type: "number" },
      ]
    : [{ key: "materials", label: "Materials", type: "text" }];
  const cols = [
    { key: "sort_order", label: "Order", type: "number" },
    // Tier / Stars are Chief Gear's (Gold ★2.3); Hero Gear rows go by Level.Stage.
    ...(isHeroGear ? [] : [{ key: "tier", label: "Tier", type: "text" }, { key: "stars", label: "Stars", type: "number" }]),
    { key: "level", label: "Level", type: "number" },
    { key: "stage", label: "Stage", type: "text" },
    { key: "stat", label: "Stat", type: "text" },
    ...(isChiefGear ? [] : [{ key: "stat2", label: "Stat 2", type: "text" }]),
    ...materialCols,
    { key: "power", label: "Power", type: "number" },
    { key: "display_label", label: "Dropdown text (override)", type: "text" },
  ];

  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Pick a table</h2>
      <select id="adminProgPicker" style="width:260px;">
        ${tables.map((t) => `<option value="${t.id}" ${t.id === ADMIN_ACTIVE_PROGRESSION ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
      </select>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>Add a row</h2>
      <form class="inline" id="adminProgAddForm">
        ${cols.map((c) => `<input class="field-num" name="${c.key}" placeholder="${esc(c.label)}" ${c.key === "sort_order" ? 'type="hidden"' : c.type === "number" ? 'type="number" step="any"' : ""} style="width:100px;" />`).join("")}
        <button class="btn" type="submit">Add row</button>
      </form>
      <div class="err" id="adminProgAddErr"></div>
    </div>
    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;">
        <h2 id="adminProgHeading" style="margin:0;">Rows</h2>
        <button class="btn small" id="adminProgSaveAll">Save all</button>
      </div>
      <div id="adminProgWrap" class="adm-scroll"></div>
    </div>
  `;

  document.getElementById("adminProgSaveAll").addEventListener("click", () => saveAllProgRows());

  document.getElementById("adminProgPicker").addEventListener("change", (e) => {
    ADMIN_ACTIVE_PROGRESSION = e.target.value;
    renderAdminProgression(body, nameFilter);
  });

  function invalidateCaches() {
    CHIEF_GEAR_ROWS = null;
    HERO_GEAR_TABLES_CACHE = null;
  }

  let currentProgRows = [];
  const saveProgRow = async (id) => {
    const wrap = document.getElementById("adminProgWrap");
    const tr = wrap.querySelector(`tr[data-progrow="${id}"]`);
    const patch = {};
    tr.querySelectorAll("[data-f]").forEach((el) => {
      const c = cols.find((c) => c.key === el.dataset.f);
      let v = el.value;
      if (c.type === "number") v = v === "" ? null : Number(v);
      else if (v.trim() === "") v = null;
      patch[el.dataset.f] = v;
    });
    await sb(`progression_rows?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });
  };
  const saveAllProgRows = async () => {
    const btn = document.getElementById("adminProgSaveAll");
    btn.disabled = true;
    btn.textContent = "Saving\u2026";
    try {
      await Promise.all(currentProgRows.map((r) => saveProgRow(r.id)));
      invalidateCaches();
      toast(`Saved ${currentProgRows.length} row${currentProgRows.length === 1 ? "" : "s"}`);

                  const star = Math.floor((step - 1) / 6) + 1, shard = ((step - 1) % 6) + 1;
                  return `<tr data-starstep="${step}">
                    <td style="padding:3px 8px;">${step}</td>
                    <td style="padding:3px 8px;" class="meta">${star}\u2605 ${shard}/6</td>
                    <td style="padding:3px;"><input data-sf="atk_pct" type="number" step="any" value="${r.atk_pct ?? ""}" style="width:100px;" /></td>
                    <td style="padding:3px;"><input data-sf="shards" type="number" value="${r.shards ?? ""}" style="width:64px;" /></td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
          <div class="adm-scroll">
            <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
              <thead><tr>${["Widget Lv", "LETH & HP %"].map(th).join("")}</tr></thead>
              <tbody>
                ${Array.from({ length: 10 }, (_, i) => i + 1).map((lvl) => {
                  const r = widgetBy[lvl] || {};
                  return `<tr data-widgetlvl="${lvl}">
                    <td style="padding:3px 8px;">${lvl}</td>
                    <td style="padding:3px;"><input data-wf="leth_pct" type="number" step="any" value="${r.leth_pct ?? ""}" style="width:100px;" /></td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      </div>`;

    // Standard per-shard curve is defined globally (STAR_CURVE, near HERO_SHARD_CHART).
    statsWrap.querySelector("#adminGenGenerate").addEventListener("click", () => {
      const maxAtk = Number(statsWrap.querySelector("#adminGenMaxAtk").value);
      const maxW = Number(statsWrap.querySelector("#adminGenMaxWidget").value);
      if (maxAtk > 0) statsWrap.querySelectorAll("tr[data-starstep]").forEach((tr) => {
        const step = Number(tr.dataset.starstep);
        tr.querySelector('[data-sf="atk_pct"]').value = (maxAtk * STAR_CURVE[step - 1]).toFixed(2);
        const shIn = tr.querySelector('[data-sf="shards"]');
        if (!shIn.value) shIn.value = HERO_SHARD_CHART[Math.floor((step - 1) / 6) + 1][(step - 1) % 6];
      });
      if (maxW > 0) statsWrap.querySelectorAll("tr[data-widgetlvl]").forEach((tr) => {
        tr.querySelector('[data-wf="leth_pct"]').value = (maxW * Number(tr.dataset.widgetlvl) / 10).toFixed(2);
      });
      toast("Filled \u2014 review, then Save all");
    });
    statsWrap.querySelector("#adminGenStatsSave").addEventListener("click", async () => {
      const num = (v) => (v === "" || v == null ? null : Number(v));
      const starPayload = [], widgetPayload = [];
      statsWrap.querySelectorAll("tr[data-starstep]").forEach((tr) => {
        const g = (f) => num(tr.querySelector(`[data-sf="${f}"]`).value);
        const atk = g("atk_pct"), sh = g("shards");
        if (atk != null || sh != null) starPayload.push({ generation: selectedGen, step: Number(tr.dataset.starstep), atk_pct: atk, def_pct: atk, shards: sh });
      });
      statsWrap.querySelectorAll("tr[data-widgetlvl]").forEach((tr) => {
        const g = (f) => num(tr.querySelector(`[data-wf="${f}"]`).value);
        const le = g("leth_pct");
        if (le != null) widgetPayload.push({ generation: selectedGen, level: Number(tr.dataset.widgetlvl), leth_pct: le, hp_pct: le });
      });
      try {
        if (starPayload.length) await sb(`hero_gen_star_stats`, { method: "POST", body: JSON.stringify(starPayload), prefer: "resolution=merge-duplicates,return=minimal" });
        if (widgetPayload.length) await sb(`hero_gen_widget_stats`, { method: "POST", body: JSON.stringify(widgetPayload), prefer: "resolution=merge-duplicates,return=minimal" });
        // keep hero max fields in sync with the 5★ / level-10 rows
        const maxStar = starPayload.find((p) => p.step === 30), maxW = widgetPayload.find((p) => p.level === 10);
        const heroPatch = {};
        if (maxStar) { heroPatch.exp_attack = maxStar.atk_pct; heroPatch.exp_defense = maxStar.def_pct; }
        if (maxW) { heroPatch.widget_lethality = maxW.leth_pct; heroPatch.widget_health = maxW.hp_pct; }
        if (Object.keys(heroPatch).length) await sb(`heroes?generation=eq.${selectedGen}`, { method: "PATCH", body: JSON.stringify(heroPatch), prefer: "return=minimal" });
        toast(`Gen ${selectedGen} stats saved`);
      } catch (err) {
        toast("Couldn't save stats", true);
      }
    });
  }
  fillHeroPick();
}

// Reorderable category button row, shared by Skin Gallery and Islands admin
// tabs. cats is the full [{id,category,sort_order}] list in current order.
function adminCategoryPickerHtml(cats, activeCat) {
  return cats
    .map(
      (c, idx) => `
    <div style="display:inline-flex; align-items:center; gap:2px;">
      <button class="btn ${c.category === activeCat ? "" : "ghost"} small" data-catselect="${esc(c.category)}">${esc(c.category)}</button>
      <button class="btn ghost small" data-catmoveup="${c.id}" ${idx === 0 ? "disabled" : ""} title="Move left" style="padding:4px 6px;">&#8592;</button>
      <button class="btn ghost small" data-catmovedown="${c.id}" ${idx === cats.length - 1 ? "disabled" : ""} title="Move right" style="padding:4px 6px;">&#8594;</button>
    </div>`
    )
    .join("");
}
function wireAdminCategoryReorder(container, page, cats, onChange) {
  container.querySelectorAll("[data-catmoveup]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const idx = cats.findIndex((c) => c.id === btn.dataset.catmoveup);
      if (idx <= 0) return;
      const a = cats[idx], b = cats[idx - 1];
      await Promise.all([
        sb(`skin_page_categories?id=eq.${a.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: b.sort_order }) }),
        sb(`skin_page_categories?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: a.sort_order }) }),
      ]);
      onChange();
    });
  });
  container.querySelectorAll("[data-catmovedown]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const idx = cats.findIndex((c) => c.id === btn.dataset.catmovedown);
      if (idx === -1 || idx >= cats.length - 1) return;
      const a = cats[idx], b = cats[idx + 1];
      await Promise.all([
        sb(`skin_page_categories?id=eq.${a.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: b.sort_order }) }),
        sb(`skin_page_categories?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: a.sort_order }) }),
      ]);
      onChange();
    });
  });
}

  let currentRefineRows = [];
  const saveAllRefineRows = async () => {
    const btn = document.getElementById("adminPetRefineSaveAll");
    btn.disabled = true;
    btn.textContent = "Saving\u2026";
    try {
      const wrap = document.getElementById("adminPetRefineRowsWrap");

        const tr = wrap.querySelector(`tr[data-petrefinerow="${r.id}"]`);

        tr.querySelectorAll("[data-f]").forEach((el) => {
          const c = refineCols.find((c) => c.key === el.dataset.f);

          patch[el.dataset.f] = v;

        await sb(`pet_refine_nodes?id=eq.${r.id}`, { method: "PATCH", body: JSON.stringify(patch) });
      }));
      PET_REFINE_CACHE = null;
      toast(`Saved ${currentRefineRows.length} row${currentRefineRows.length === 1 ? "" : "s"}`);
    } catch (err) {
      toast("Couldn't save all", true);
    }

    btn.textContent = "Save all";
  };

  async function loadRefineRows() {
    const cols = ["id", ...refineCols.map((c) => c.key)].join(",");
    const rows = await sb(`pet_refine_nodes?select=${cols}&pet=eq.${encodeURIComponent(ADMIN_ACTIVE_PET_REFINE)}&order=sort_order`);
    currentRefineRows = rows;
    document.getElementById("adminPetRefineRowsHeading").textContent = `Rows for ${ADMIN_ACTIVE_PET_REFINE} (${rows.length})`;
    const wrap = document.getElementById("adminPetRefineRowsWrap");
    wrap.innerHTML = `
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <thead><tr>
          ${adminColHeadHtml(refineCols, true)}
          <th></th>
        </tr></thead>
        <tbody>
          ${rows
            .map(
              (r, idx) => `
            <tr data-petrefinerow="${r.id}">

              ${refineCols.map((c) => adminColCellHtml(c, r, "90px")).join("")}

                <button class="btn small ghost" data-petrefinesave="${r.id}">Save</button>
                <button class="btn small ghost" data-petrefinedel="${r.id}" style="color:var(--danger);">Delete</button>
              </td>
            </tr>`
                )
            .join("")}
        </tbody>
      </table>
    `;

    wireAdminReorder(wrap, "data-petrefinerow", async (orderedIds) => {
      try { await saveAdminRowOrder("pet_refine_nodes", rows, orderedIds); PET_REFINE_CACHE = null; loadRefineRows(); }
      catch (err) { toast("Couldn't reorder", true); }
    });
    wrap.querySelectorAll("[data-petrefinesave]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const id = btn.dataset.petrefinesave;
        const tr = wrap.querySelector(`tr[data-petrefinerow="${id}"]`);
        const patch = {};
        tr.querySelectorAll("[data-f]").forEach((el) => {
          const c = refineCols.find((c) => c.key === el.dataset.f);

          else if (v.trim() === "") v = null;
          patch[el.dataset.f] = v;
        });
        try {
          await sb(`pet_refine_nodes?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });

}

          <span style="min-width:60px; font-weight:600; color:${colors[sg]};">${sg}</span>

    </div>`;
  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Marks calculation</h2>
      <p class="desc">Two sets of "Common Marks per 1%" rates. Visitors always use the left set. Tick the switch below to try the right set yourself on the Pets Refine page (and in your Dashboard, packs and budgets) without changing what visitors see; when you're happy, copy it over to visitors.</p>
      <label style="display:flex; align-items:center; gap:8px; font-size:13px; cursor:pointer; padding:10px 12px; border:1px solid ${st.testMode ? "#e0a030" : "var(--line)"}; border-radius:8px; max-width:520px;">
        <input type="checkbox" id="mTestMode" ${st.testMode ? "checked" : ""} />
        <span><b>Use my test rates on the site (only me)</b><br><span class="meta" style="font-size:11px;">${st.testMode ? "On: you see the test rates everywhere; visitors keep the published ones." : "Off: you see the same rates as visitors."}</span></span>
      </label>
    </div>
    <div style="display:flex; gap:16px; flex-wrap:wrap; align-items:stretch;">
      ${col("Visitors (published)", "published")}
      ${col("My test rates", "testRates")}
    </div>
    <div class="panel" style="margin-top:16px;">
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn small" id="mPublish" type="button">Copy my test rates \u2192 visitors</button>
        <button class="btn small ghost" id="mCopyDown" type="button">Copy visitors \u2192 my test rates</button>
        <button class="btn small ghost" id="mDefaults" type="button">Reset my test rates to the built-in defaults</button>

      <p class="desc" style="margin-top:8px;">Grey/Green/Blue rates are an average over all stats; Purple/Orange/Red are per 1% of one stat. The Adjustment % on the Refine page is separate and per person.</p>
    </div>`;
  const read = (key) => { const out = {}; STAGES.forEach((sg) => { const v = Number(String(body.querySelector(`[data-mrate="${key}|${sg}"]`).value).replace(/[^0-9.]/g, "")); out[sg] = Number.isFinite(v) ? Math.max(0, v) : st[key][sg]; }); return out; };
  const persist = async () => {
    await saveCalcState("pet_refine_marks", { adjust: st.adjust, packGems: st.packGems, testMode: st.testMode, testRates: st.testRates });

// Clears any text/number input's value when it's focused while showing a
// bare zero (0, 0.00, etc) so the user can start typing immediately instead
// of having to manually delete the placeholder zero first. Applies to every
// input across the whole app via event delegation, so it works uniformly
// without needing to be wired into each individual field.
document.addEventListener(
  "focusin",
  (e) => {
    const el = e.target;
    if (!el || el.tagName !== "INPUT") return;
    const type = (el.type || "text").toLowerCase();
    if (type !== "text" && type !== "number") return;
    if (/^0(\.0+)?$/.test(el.value.trim())) {
      el.value = "";
    }
  },
  true
);

// ---- Image upload to Supabase Storage (skin-images bucket) ----
// Any admin image input can get a "⬆ Upload" button beside it (rendered by
// uploadBtnHtml). Clicking opens a file picker; the file is uploaded and the
// public URL is written into the adjacent input.
async function uploadImageToStorage(file) {
  const ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "") || "png";
  const path = `${crypto.randomUUID()}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/skin-images/${path}`, {
    method: "POST",
    // The bucket only lets the owner write, so this must carry the owner's
    // session token (the bare anon key is rejected with 403).
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${(CURRENT_SESSION && CURRENT_SESSION.access_token) || SUPABASE_KEY}`, "Content-Type": file.type || "application/octet-stream", "x-upsert": "true" },
    body: file,
  });
  if (!res.ok) {
    let detail = "";
    try { detail = (await res.json()).message || ""; } catch (_) {}
    throw new Error(`Upload failed (${res.status}${detail ? ": " + detail : ""})`);
  }
  return `${SUPABASE_URL}/storage/v1/object/public/skin-images/${path}`;
}
function uploadBtnHtml() {
  return `<button type="button" class="btn ghost small" data-imgupload title="Upload image" style="padding:4px 8px; white-space:nowrap;">&#8679; Upload</button>`;
}
let IMG_UPLOAD_PICKER = null;
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-imgupload]");
  if (!btn) return;
  e.preventDefault();
  const input = btn.previousElementSibling && btn.previousElementSibling.tagName === "INPUT" ? btn.previousElementSibling : null;
  if (!input) return;
  if (!IMG_UPLOAD_PICKER) {
    IMG_UPLOAD_PICKER = document.createElement("input");
    IMG_UPLOAD_PICKER.type = "file";
    IMG_UPLOAD_PICKER.accept = "image/*";
    IMG_UPLOAD_PICKER.style.display = "none";
    document.body.appendChild(IMG_UPLOAD_PICKER);
  }
  IMG_UPLOAD_PICKER.onchange = async () => {
    const file = IMG_UPLOAD_PICKER.files && IMG_UPLOAD_PICKER.files[0];
    IMG_UPLOAD_PICKER.value = "";
    if (!file) return;
    const orig = btn.innerHTML;
    btn.innerHTML = "Uploading\u2026";
    btn.disabled = true;
    try {
      const url = await uploadImageToStorage(file);
      input.value = url;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.dispatchEvent(new Event("change", { bubbles: true }));
      toast("Image uploaded \u2014 remember to Save");
    } catch (err) {
      toast(err && err.message ? err.message : "Upload failed", true);
    } finally {
      btn.innerHTML = orig;
      btn.disabled = false;
    }
  };
  IMG_UPLOAD_PICKER.click();
});

// Small login control in the sidebar: lets the owner log in with a real
// email/password to unlock Admin. Everyone else stays on their automatic
// anonymous session and never sees anything beyond a "Owner login" link.
function renderOwnerLoginUI() {
  const el = document.getElementById("ownerLoginArea");
  document.getElementById("adminNavGroup").style.display = IS_OWNER ? "block" : "none";
  // Backpack and Budgets are owner-only pages.
  document.querySelectorAll("[data-ownertab]").forEach((b) => { b.style.display = IS_OWNER ? "" : "none"; });
  applyPageVisibility();

  const user = CURRENT_SESSION && CURRENT_SESSION.user;
  const signedIn = !!(user && user.email && !user.is_anonymous);
  if (signedIn) {
    el.innerHTML = `
      <div class="meta" style="font-size:11px; color:var(--good); margin-bottom:6px; word-break:break-all;">&#10003; ${IS_OWNER ? esc(t("logged_in_owner")) : `${esc(t("signed_in_as"))} ${esc(user.email)}`}</div>
      ${user.email_confirmed_at || user.confirmed_at ? "" : `<div class="meta" style="font-size:10.5px; color:var(--amber); margin-bottom:6px;">${esc(t("confirm_email_hint"))}</div>`}
      <button class="btn ghost small" id="ownerLogoutBtn" style="width:100%;">${esc(t("log_out"))}</button>
    `;
    document.getElementById("ownerLogoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      // Every cached calculator state belongs to the account that just left:
      // reload so the fresh (anonymous) session starts clean.
      location.hash = "";
      location.reload();
    });
    return;
  }

  el.innerHTML = `
    <div class="meta" style="font-size:10.5px; margin-bottom:6px;">${esc(t("account_pitch"))}</div>

// Sign in / create account for everyone. Creating an account upgrades the
// visitor's anonymous session in place (same user id), so everything they
// saved in this browser carries over. The owner email unlocks Admin.
function openAccountModal(mode) {
  let modal = document.getElementById("ownerLoginModal");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "ownerLoginModal";
    modal.className = "modal-overlay";
    document.body.appendChild(modal);
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
  }
  const isCreate = mode === "create";
  const tabBtn = (m, label) => `<button type="button" class="btn small ${m === mode ? "" : "ghost"}" data-accmode="${m}" style="flex:1;">${esc(label)}</button>`;
  modal.innerHTML = `
    <div class="modal-box" style="max-width:360px;">
      <div style="display:flex; gap:6px; margin-bottom:10px;">${tabBtn("signin", t("log_in"))}${tabBtn("create", t("create_account"))}</div>
      <p class="desc" style="margin:0 0 10px;">${esc(t(isCreate ? "create_account_desc" : "sign_in_desc"))}</p>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <input type="email" id="ownerLoginEmail" placeholder="${esc(t("email_placeholder"))}" autocomplete="email" style="width:100%;" />
        <input type="password" id="ownerLoginPassword" placeholder="${esc(t("password_placeholder"))}" autocomplete="${isCreate ? "new-password" : "current-password"}" style="width:100%;" />
        <div class="err" id="ownerLoginErr" style="min-height:16px;"></div>
        <button class="btn" id="ownerLoginSubmit">${esc(t(isCreate ? "create_account" : "log_in"))}</button>
        ${isCreate ? "" : `<button type="button" class="btn ghost small" id="ownerForgotBtn">${esc(t("forgot_password"))}</button>`}
        <button class="btn ghost small" id="ownerLoginClose">${esc(t("cancel"))}</button>
      </div>
    </div>`;
  modal.style.display = "flex";
  modal.querySelectorAll("[data-accmode]").forEach((b) => b.addEventListener("click", () => openAccountModal(b.dataset.accmode)));
  document.getElementById("ownerLoginClose").addEventListener("click", () => { modal.style.display = "none"; });
  const errEl = document.getElementById("ownerLoginErr");
  const emailEl = document.getElementById("ownerLoginEmail");
  const forgot = document.getElementById("ownerForgotBtn");
  if (forgot) forgot.addEventListener("click", async () => {
    const email = emailEl.value.trim();
    if (!email) { errEl.textContent = t("enter_email_first"); return; }
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] });
    errEl.style.color = error ? "" : "var(--good)";
    errEl.textContent = error ? error.message : t("reset_sent");
  });
  document.getElementById("ownerLoginSubmit").addEventListener("click", async () => {
    const email = emailEl.value.trim();
    const password = document.getElementById("ownerLoginPassword").value;
    errEl.style.color = "";
    errEl.textContent = "";
    if (!email || !password) { errEl.textContent = t("enter_both"); return; }
    if (isCreate && password.length < 6) { errEl.textContent = t("password_short"); return; }
    try {
      if (isCreate) {
        const anon = CURRENT_SESSION && CURRENT_SESSION.user && CURRENT_SESSION.user.is_anonymous;
        if (anon) {
          // Upgrade the anonymous account: same user id, all saved progress kept.
          const { data, error } = await supabaseClient.auth.updateUser({ email, password });
          if (error) { errEl.textContent = friendlyAuthError(error); return; }
          const pending = data && data.user && (data.user.new_email || !data.user.email_confirmed_at);
          if (pending) { errEl.style.color = "var(--good)"; errEl.textContent = t("confirm_email_sent"); return; }
        } else {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) { errEl.textContent = friendlyAuthError(error); return; }
          if (!data.session) { errEl.style.color = "var(--good)"; errEl.textContent = t("confirm_email_sent"); return; }
        }
      } else {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) { errEl.textContent = friendlyAuthError(error); return; }
      }
      // Reload so every page reads the account's own saved progress.
      location.hash = "";
      location.reload();
    } catch (err) {
      errEl.textContent = err.message || t("login_failed");
    }
  });
}
function friendlyAuthError(error) {
  const m = String(error && error.message || "");
  if (/invalid login|invalid credentials/i.test(m)) return t("invalid_login");
  if (/already registered|already exists|already been registered/i.test(m)) return t("email_taken");
  if (/email not confirmed/i.test(m)) return t("email_not_confirmed");
  if (/rate limit/i.test(m)) return t("rate_limited");
  return m || t("login_failed");
}
// Password reset links land back on the site with a recovery session:
// ask for the new password once, then reload into the account.
supabaseClient.auth.onAuthStateChange((event) => {
  if (event !== "PASSWORD_RECOVERY") return;
  const pw = prompt(t("new_password_prompt"));
  if (!pw) return;
  supabaseClient.auth.updateUser({ password: pw }).then(({ error }) => {
    toast(error ? friendlyAuthError(error) : t("password_updated"), !!error);
    if (!error) { location.hash = ""; location.reload(); }
  });
});

// App entry point: establish (or restore) a session before anything else
// runs, since every data call needs USER_ID / the session's access token.
// Installable app: the service worker (pwa/sw.js) caches the page and icons
// so the site opens from the home screen and survives a dropped connection.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
(async function boot() {
  try {
    await ensureAuthSession();
  } catch (err) {
    content.innerHTML = `
      <div class="empty">
        <div class="big">Couldn't start a session</div>
        <p class="desc">${esc(err.message || String(err))}</p>
        <p class="desc">If you're the owner: make sure "Anonymous sign-ins" is enabled in your Supabase project's Authentication settings.</p>
      </div>`;
    return;
  }
  await Promise.all([ensureUiVisibility(), ensureSiteConfig()]);
  renderOwnerLoginUI();
  document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
  document.documentElement.lang = LANG;
  applyNavLanguage();
  renderLanguageSwitcher();
  // Speed: start downloading every saved calculator state right away, in
  // parallel with everything else below.
  preloadCalcStates();
  loadCommander();
  document.querySelectorAll("button[data-tab]").forEach((x) => {
    x.classList.toggle("active", x.dataset.tab === TAB);
  });
  history.replaceState({ tab: TAB }, "", location.pathname + location.search);
  const categoriesLoaded = loadBuffCategories();
  if (TAB === "overview") {
    // The Dashboard loads what it needs itself, so it doesn't have to wait
    // for the category list first.
    categoriesLoaded.catch(() => {});
    render();
  } else {
    categoriesLoaded.then(render);
  }
})();
</script>
</body>
</html>
