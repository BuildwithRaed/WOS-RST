  const totalsEl = document.getElementById("expertsTotals");
  function renderTotals() {
    let totalExp = 0, totalBook = 0, totalAffinity = 0, totalSigil = 0;
    let maxExp = 0, maxBook = 0, maxAffinity = 0, maxSigil = 0;
    const sigilNeededByExpert = {};
    EXPERTS_LIST.forEach((e) => {
      if (!isExpertUnlocked(e.key)) return;
      e.skills.forEach((sk) => {
        const st = saved[e.key].skills[sk];
        const { exp, book } = skillCost(e.key, sk, st.current, st.desired);
        totalExp += exp;
        totalBook += book;
        const skillMax = skillMaxLevel(e.key, sk);
        const { exp: mExp, book: mBook } = skillCost(e.key, sk, 0, skillMax);
        maxExp += mExp;
        maxBook += mBook;
      });
      const hs = saved[e.key];
      const { affinity, sigil } = heroCost(e.key, hs.current, hs.desired);
      totalAffinity += affinity;
      totalSigil += sigil;
      sigilNeededByExpert[e.key] = sigil;
      const heroMaxLvl = (AFFINITY_CACHE[e.key] || []).length || EXPERT_HERO_MAX_LEVEL;
      const { affinity: mAff, sigil: mSig } = heroCost(e.key, 0, heroMaxLvl);
      maxAffinity += mAff;
      maxSigil += mSig;
    });

    // Offset against Your Inventory: Books/Affinity subtract directly;
    // Sigils use each expert's own sigils first, General Sigils cover the rest;
    // Time subtracts owned Speedup minutes.
    const stillBook = Math.max(0, totalBook - (Number(invSaved["Books of Knowledge"]) || 0));
    const stillAffinity = Math.max(0, totalAffinity - (Number(invSaved["Affinity"]) || 0));
    let sigilShortfall = 0;
    EXPERTS_LIST.forEach((e) => {
      const owned = Number(invSaved[`${e.key} Sigils`]) || 0;
      sigilShortfall += Math.max(0, (sigilNeededByExpert[e.key] || 0) - owned);
    });
    const stillSigil = Math.max(0, sigilShortfall - (Number(invSaved["General Sigils"]) || 0));
    const totalTimeHours = totalExp / 3600;
    const ownedSpeedupHours = (Number(invSaved["Speedups (minutes)"]) || 0) / 60;
    const stillTimeHours = Math.max(0, totalTimeHours - ownedSpeedupHours);

    totalsEl.innerHTML = `
      <div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">Time</div><div class="val" style="font-size:13px;">${formatTimeDHM(totalTimeHours)}</div><div class="meta" style="font-size:9px; margin-top:2px; color:${stillTimeHours > 0 ? "#e0a030" : "var(--good)"};">${stillTimeHours > 0 ? formatTimeDHM(stillTimeHours) + " needed" : "\u2713 Have enough"}</div></div>
      <div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">Books</div><div class="val" style="font-size:13px;">${Math.round(totalBook).toLocaleString()}</div><div class="meta" style="font-size:9px; margin-top:2px; color:${stillBook > 0 ? "#e0a030" : "var(--good)"};">${stillBook > 0 ? Math.round(stillBook).toLocaleString() + " needed" : "\u2713 Have enough"}</div></div>
      <div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">Affinity</div><div class="val" style="font-size:13px;">${Math.round(totalAffinity).toLocaleString()}</div><div class="meta" style="font-size:9px; margin-top:2px; color:${stillAffinity > 0 ? "#e0a030" : "var(--good)"};">${stillAffinity > 0 ? Math.round(stillAffinity).toLocaleString() + " needed" : "\u2713 Have enough"}</div></div>
      <div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">Sigils</div><div class="val" style="font-size:13px;">${Math.round(totalSigil).toLocaleString()}</div><div class="meta" style="font-size:9px; margin-top:2px; color:${stillSigil > 0 ? "#e0a030" : "var(--good)"};">${stillSigil > 0 ? Math.round(stillSigil).toLocaleString() + " needed" : "\u2713 Have enough"}</div></div>
    `;
  }

  const gridEl = document.getElementById("expertsGrid");
  function levelOpts(max, selected) {
    return Array.from({ length: max + 1 }, (_, i) => i)
      .map((n) => `<option value="${n}" ${n === selected ? "selected" : ""}>${n}</option>`)
      .join("");
  }
  function levelStatLine(hero, level) {
    const rows = AFFINITY_CACHE[hero];
    if (!rows) return "";
    const row = rows.find((r) => r.level === level);
    if (!row) return "";
    // Only Affinity (stat_type) - this is the always-on hero-level stat.
    // stat_type2 is that expert's Talent, which only applies during their
    // specific event (Foundry/SvS/Frostfire/Tundra), so it's shown only
    // under those matching headers, not here.
    if (!row.stat_type) return "";
    return `<div class="meta" style="font-size:10px; margin-top:3px; color:var(--ice);">+${Number(row.stat_value).toFixed(2)}% ${row.stat_type.split(",").join("/")}</div>`;
  }

  const expertsCounterEl = document.getElementById("expertsSwipeCounter");
  let activeExpertIdx = 0;
  function renderGrid() {
    renderSwipeCounter(expertsCounterEl, EXPERTS_LIST.length, activeExpertIdx);
    const e = EXPERTS_LIST[activeExpertIdx];
    const s = saved[e.key];
    const unlocked = isExpertUnlocked(e.key);
    gridEl.innerHTML = `
      <div class="panel" style="${unlocked ? "" : "opacity:0.5;"} text-align:center;">
        <div style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-bottom:10px;">
          <input type="checkbox" data-expunlock="${esc(e.key)}" ${unlocked ? "checked" : ""} style="width:16px; height:16px; cursor:pointer; justify-self:start;" />
          <div style="text-align:center;">
            <img src="${e.img}" alt="${esc(e.key)}" style="width:72px; height:72px; object-fit:cover; margin-bottom:6px;" loading="lazy" />
            <div class="name" style="font-size:16px; font-weight:700;">${esc(e.key)}</div>
          </div>
          <button class="btn ghost small" data-expmax="${esc(e.key)}" style="width:60px; justify-self:end;">Max</button>
        </div>
        <div style="display:flex; justify-content:center; gap:10px; width:100%; max-width:320px; margin:0 auto 12px; text-align:left;">
          <div style="flex:1;">
            <div class="meta" style="font-size:10px; margin-bottom:2px;">Current</div>
            <select data-expcur="${esc(e.key)}" style="width:100%;">${levelOpts(EXPERT_HERO_MAX_LEVEL, s.current)}</select>
            ${levelStatLine(e.key, s.current)}
          </div>
          <div style="flex:1;">
            <div class="meta" style="font-size:10px; margin-bottom:2px;">Target</div>
            <select data-expdes="${esc(e.key)}" style="width:100%;">${levelOpts(EXPERT_HERO_MAX_LEVEL, s.desired)}</select>
            ${levelStatLine(e.key, s.desired)}
          </div>
        </div>
        <div style="border-top:1px solid var(--line); padding-top:10px; text-align:left;">
          ${e.skills
            .map((sk) => {
              const max = skillMaxLevel(e.key, sk);
              const st = s.skills[sk];
              const { exp, book } = skillCost(e.key, sk, st.current, st.desired);
              const skillRows = SKILL_CACHE[`${e.key}|${sk}`];
              let curRow = null, desRow = null;
              if (skillRows) {
                skillRows.forEach((r) => {
                  if (r.level <= st.current) curRow = r;
                  if (r.level <= st.desired) desRow = r;
                });
              }
              const fmtStat = (r) => (r && r.stat_type ? `+${Number(r.stat_value).toFixed(2)}% ${r.stat_type.split(",").join("/")}` : null);
              const SKILL_STAT_WHITELIST = new Set([
                "Romulus|Last Line", "Romulus|Spirit of Aeetis",
                "Gareth|Porcupine", "Gareth|Undefeated Will",
                "Fabian|Heightened Firepower",
                "Valeria|Battle Concerto",
              ]);
              const showSkillStat = SKILL_STAT_WHITELIST.has(`${e.key}|${sk}`);
              const curStat = showSkillStat ? fmtStat(curRow) : null;
              const desStat = showSkillStat ? fmtStat(desRow) : null;
              return `
          <div style="padding:6px 0;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:nowrap;">
              <span class="meta" style="font-size:12px; min-width:0; flex-shrink:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(sk)}</span>
              <div style="display:flex; gap:6px; flex-shrink:0; flex-wrap:nowrap;">
                <select data-expskillcur="${esc(e.key)}|${esc(sk)}" style="width:62px; flex-shrink:0;">${levelOpts(max, Math.min(st.current, max))}</select>
                <select data-expskilldes="${esc(e.key)}|${esc(sk)}" style="width:62px; flex-shrink:0;">${levelOpts(max, Math.min(st.desired, max))}</select>
              </div>
            </div>
            ${
              curStat || desStat
                ? `<div class="meta" style="font-size:10px; text-align:right; margin-top:2px; color:var(--ice);">${curStat || "\u2014"} \u00b7 ${desStat || "\u2014"}</div>`
                : ""
            }
            ${
              exp || book
                ? `<div class="meta" style="font-size:10px; text-align:right; margin-top:2px;">${Math.round(exp).toLocaleString()} EXP \u00b7 ${Math.round(book).toLocaleString()} Books</div>`
                : ""
            }
          </div>`;
            })
            .join("")}
        </div>
      </div>`;
    wireIndexSwipe(gridEl, EXPERTS_LIST.length, activeExpertIdx, (next) => { activeExpertIdx = next; renderGrid(); });

    gridEl.querySelectorAll("select[data-expcur]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        saved[sel.dataset.expcur].current = Number(sel.value);
        await saveCalcState("experts", saved);
        renderStatHeader();
        renderFoundryHeader();
        renderSvsHeader();
        renderFrostfireHeader();
        renderTundraHeader();
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("select[data-expdes]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        saved[sel.dataset.expdes].desired = Number(sel.value);
        await saveCalcState("experts", saved);
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("input[data-expunlock]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const expert = cb.dataset.expunlock;
        unlockedState[expert] = cb.checked;
        await saveCalcState("experts_unlocked", unlockedState);
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("[data-expmax]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const hero = btn.dataset.expmax;
        const s = saved[hero];
        const heroMaxLvl = (AFFINITY_CACHE[hero] || []).length || EXPERT_HERO_MAX_LEVEL;
        const heroExpert = EXPERTS_LIST.find((e) => e.key === hero);
        const heroAlreadyMaxed = s.current >= heroMaxLvl;
        const skillsAlreadyMaxed = heroExpert.skills.every((sk) => {
          const max = skillMaxLevel(hero, sk);
          return s.skills[sk].current >= max;
        });
        const allMaxed = heroAlreadyMaxed && skillsAlreadyMaxed;
        if (allMaxed) {
          s.current = 0;
          heroExpert.skills.forEach((sk) => {
            s.skills[sk].current = 0;
          });
        } else {
          s.current = heroMaxLvl;
          heroExpert.skills.forEach((sk) => {
            const max = skillMaxLevel(hero, sk);
            s.skills[sk].current = max;
          });
        }
        await saveCalcState("experts", saved);
        renderStatHeader();
        renderFoundryHeader();
        renderSvsHeader();
        renderFrostfireHeader();
        renderTundraHeader();
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("select[data-expskillcur]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const [hero, skill] = sel.dataset.expskillcur.split("|");
        saved[hero].skills[skill].current = Number(sel.value);
        await saveCalcState("experts", saved);
        renderStatHeader();
        renderFoundryHeader();
        renderSvsHeader();
        renderFrostfireHeader();
        renderTundraHeader();
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("select[data-expskilldes]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const [hero, skill] = sel.dataset.expskilldes.split("|");
        saved[hero].skills[skill].desired = Number(sel.value);
        await saveCalcState("experts", saved);
        renderTotals();
        renderGrid();
      });
    });
  }

  const invEl = document.getElementById("expertsInventory");
  function renderInventory() {
    const pairs = [];
    for (let i = 0; i < EXPERT_INVENTORY_FIELDS.length; i += 2) {
      pairs.push(EXPERT_INVENTORY_FIELDS.slice(i, i + 2));
    }
    const fieldRow = (f) => `
      <div style="display:flex; align-items:center; gap:6px; flex-wrap:nowrap;">
        <img src="${EXPERT_INVENTORY_ICONS[f]}" alt="" style="width:20px; height:20px; object-fit:contain; flex-shrink:0;" loading="lazy" />
        <div style="flex:1; min-width:0;">
          <div class="meta" style="font-size:9px; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(f)}</div>
          <input type="text" inputmode="numeric" data-expinv="${esc(f)}" value="${invSaved[f] || 0}" style="width:100%; min-width:0; padding:4px 6px; box-sizing:border-box;" />
        </div>
      </div>`;
    invEl.innerHTML = pairs
      .map(
        (pair) => `
      <div style="display:flex; flex-direction:column; gap:10px; flex:0 0 150px; min-width:150px;">
        ${pair.map(fieldRow).join("")}
      </div>`
      )
      .join("");

    invEl.querySelectorAll("input[data-expinv]").forEach((input) => {
      input.addEventListener("change", async () => {
        let val = parseInt(input.value, 10);
        if (Number.isNaN(val) || val < 0) val = 0;
        input.value = val;
        invSaved[input.dataset.expinv] = val;
        await saveCalcState("experts_inventory", invSaved);
        renderTotals();
      });
    });
  }

  renderStatHeader();
  renderFoundryHeader();
  renderSvsHeader();
  renderFrostfireHeader();
  renderTundraHeader();
  renderTotals();
  renderGrid();
  renderInventory();
}

async function renderRefinePage() {
  await ensurePetsData(); // loads PET_REFINE_CACHE too
  const PET_TABLE_ORDER = [
    "Cave Hyena", "Arctic Wolf", "Musk Ox", "Giant Tapir", "Titan Roc",
    "Giant Elk", "Snow Leopard", "Cave Lion", "Snow Ape", "Iron Rhino",
    "Sabertooth Tiger", "Mammoth", "Frost Gorilla", "Frostscale Chameleon", "Abyssal Shelldragon",
  ];
  const petNames = Object.keys(PET_REFINE_CACHE).sort((a, b) => {
    const ia = PET_TABLE_ORDER.indexOf(a);
    const ib = PET_TABLE_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  if (!PET_REFINE_TYPED_STATE) {
    const saved = await loadCalcState("pet_refine_typed");
    PET_REFINE_TYPED_STATE = saved || {};
  }

  // Converts a stored 0-1 fraction to a clean 1-decimal percentage.
  // Plain `x * 100` on values like 0.581 gives 58.099999999999994 in JS
  // floating point, which then rejected a typed "58.1" as "over the cap".
  const pct1 = (raw) => Math.round(Number(raw) * 10000) / 100;

  const STAGE_COLORS = {
    Grey: "#9aa5b1",
    Green: "#5bc98a",
    Blue: "#6fd3f2",
    Purple: "#b98ae0",
    Orange: "#e8a23c",
    Red: "#e0645f",
  };
  // Finds which stage bracket a typed value currently sits in for one pet+stat:
  // the first stage whose own threshold hasn't been fully reached yet (i.e. the
  // stage you're currently progressing within). Once you go above a stage's max,
  // the color immediately switches to the next stage, rather than waiting until
  // that next stage's own max is reached.
  function stageForValue(pet, maxKey, val) {
    const rows = PET_REFINE_CACHE[pet];
    for (const r of rows) {
      if (pct1(r[maxKey]) >= val - 0.0001) return { stage: r.stage, color: STAGE_COLORS[r.stage] || "var(--ice)" };
    }
    const last = rows[rows.length - 1];
    return { stage: last.stage, color: STAGE_COLORS[last.stage] || "var(--ice)" };
  }

  const STAT_KEYS = [
    { key: "il", label: "Infantry Lethality", maxKey: "infantry_lethality_pct" },
    { key: "ih", label: "Infantry Health", maxKey: "infantry_health_pct" },
    { key: "ll", label: "Lancer Lethality", maxKey: "lancer_lethality_pct" },
    { key: "lh", label: "Lancer Health", maxKey: "lancer_health_pct" },
    { key: "ml", label: "Marksman Lethality", maxKey: "marksman_lethality_pct" },
    { key: "mh", label: "Marksman Health", maxKey: "marksman_health_pct" },
  ];

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>Pets Refine</h2>
              </div>
    </div>
    <div id="refineTotals" style="margin-bottom:16px;"></div>
    <div id="refineSwipeCounter" style="text-align:center; margin-bottom:10px;"></div>
    <div id="refineList"></div>
  `;

  function maxRow(pet) {
    const rows = PET_REFINE_CACHE[pet];
    return rows[rows.length - 1];
  }
  function petState(pet) {
    if (!PET_REFINE_TYPED_STATE[pet] || typeof PET_REFINE_TYPED_STATE[pet] !== "object") {
      PET_REFINE_TYPED_STATE[pet] = { il: 0, ih: 0, ll: 0, lh: 0, ml: 0, mh: 0 };
    }
    return PET_REFINE_TYPED_STATE[pet];
  }

  function renderTotals() {
    const grand = { il: 0, ih: 0, ll: 0, lh: 0, ml: 0, mh: 0 };
    const grandMax = { il: 0, ih: 0, ll: 0, lh: 0, ml: 0, mh: 0 };
    petNames.forEach((pet) => {
      if (!isPetUnlocked(pet)) return;
      const s = petState(pet);
      const m = maxRow(pet);
      STAT_KEYS.forEach(({ key, maxKey }) => {
        const cap = pct1(m[maxKey]);
        grand[key] += Math.min(Number(s[key]) || 0, cap);
        grandMax[key] += cap;
      });
    });
    const STAT_ABBR_MAP = { "Infantry Lethality": "Inf LETH", "Infantry Health": "Inf HP", "Lancer Lethality": "Lan LETH", "Lancer Health": "Lan HP", "Marksman Lethality": "Mark LETH", "Marksman Health": "Mark HP" };
    document.getElementById("refineTotals").innerHTML = `
      <div class="panel">
        <h2>Total refine bonus</h2>
        <p class="desc">Summed across all 15 pets, based on what you've typed in.</p>
        <div class="stats-row-scroll sr-3col">
          ${STAT_KEYS.map(({ key, label }) => `<div class="metric" style="padding:8px; min-width:90px;"><div class="label" style="font-size:9px;">${esc(STAT_ABBR_MAP[label] || label)}</div><div class="val" style="font-size:13px;">+${grand[key].toFixed(2)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">of max +${grandMax[key].toFixed(2)}%</div></div>`).join("")}
        </div>
      </div>
    `;
  }

  const TIER_ORDER = ["First", "N", "R", "SR", "SRR", "UR"];
  const listEl = document.getElementById("refineList");
  // Updates one pet+stat row's bar width/color and remaining-text in place,
  // without touching any input elements (avoids stealing focus from a field
  // the user just clicked into while another field's blur was still settling).
  function updateStatRow(pet, statKey) {
    const row = listEl.querySelector(`[data-refinerowfor="${CSS.escape(pet)}|${CSS.escape(statKey)}"]`);
    if (!row) return;
    const statDef = STAT_KEYS.find((s) => s.key === statKey);
    const s = petState(pet);
    const m = maxRow(pet);
    const maxVal = pct1(m[statDef.maxKey]);
    const curVal = Math.min(Number(s[statKey]) || 0, maxVal);
    const pct = maxVal > 0 ? Math.min(100, (curVal / maxVal) * 100) : 0;
    const remaining = Math.max(0, maxVal - curVal);
    const isMaxed = remaining <= 0.005;
    const { color } = stageForValue(pet, statDef.maxKey, curVal);

    const barFill = row.querySelector("[data-refinebar] > div");
    if (barFill) {
      barFill.style.width = `${pct}%`;
      barFill.style.background = color;
    }
    const remainingEl = row.querySelector("[data-refineremaining]");
    if (remainingEl) {
      remainingEl.textContent = isMaxed ? "" : `-${remaining.toFixed(2)}%`;
      remainingEl.style.color = color;
      remainingEl.style.width = isMaxed ? "0" : "";
      remainingEl.style.overflow = isMaxed ? "hidden" : "";
    }
  }
  const refineCounterEl = document.getElementById("refineSwipeCounter");
  let activeRefineIdx = 0;
  function renderList() {
    renderSwipeCounter(refineCounterEl, petNames.length, activeRefineIdx);
    const idx = activeRefineIdx;
    const pet = petNames[idx];
    const m = maxRow(pet);
    const s = petState(pet);
    const tier = m.category || "Other";
    const color = PET_TROOP_COLORS_CYCLE[idx % PET_TROOP_COLORS_CYCLE.length];
    const unlocked = isPetUnlocked(pet);
    listEl.innerHTML = `
        <div class="panel" style="${unlocked ? "" : "opacity:0.5;"} text-align:left;">
          <div class="meta" style="font-size:10.5px; margin-bottom:8px;">${esc(tier)} tier</div>
          <div style="display:flex; align-items:center; justify-content:flex-start; gap:8px; margin-bottom:12px; flex-wrap:nowrap;">
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer; min-width:0; flex-wrap:nowrap;">
              <input type="checkbox" data-petunlockrefine="${esc(pet)}" ${unlocked ? "checked" : ""} style="width:14px; height:14px; cursor:pointer; flex-shrink:0;" />
              <div class="name" style="font-size:12.5px; font-weight:700; color:${color}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(pet)}</div>
            </label>
            <button class="btn ghost small" data-refinemaxpet="${esc(pet)}" style="flex-shrink:0; margin-left:auto;">Max</button>
          </div>
          ${STAT_KEYS.map(
            ({ key, label, maxKey }) => {
              const maxVal = pct1(m[maxKey]);
              const curVal = Math.min(Number(s[key]) || 0, maxVal);
              const pct = maxVal > 0 ? Math.min(100, (curVal / maxVal) * 100) : 0;
              const remaining = Math.max(0, maxVal - curVal);
              const isMaxed = remaining <= 0.005;
              const { color: barColor } = stageForValue(pet, maxKey, curVal);
              return `
          <div data-refinerowfor="${esc(pet)}|${key}" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 0; border-top:1px solid var(--line);">
            <span class="meta" style="font-size:12px; flex:0 0 110px; min-width:85px;">${esc(label)}</span>
            <input type="text" inputmode="decimal" data-refinepet="${esc(pet)}" data-refinestat="${key}" value="${curVal}" style="width:60px; flex-shrink:0; padding:5px 6px;" />
            <div style="flex:1; min-width:90px; display:flex; align-items:center; gap:6px;">
              <div data-refinebar style="flex:1; height:7px; border-radius:4px; background:var(--panel-2); overflow:hidden; min-width:35px;">
                <div style="width:${pct}%; height:100%; background:${barColor}; border-radius:4px; transition:width 0.2s;"></div>
              </div>
              <span data-refineremaining class="meta" style="font-size:10px; color:${barColor}; flex-shrink:0; white-space:nowrap; ${isMaxed ? "width:0; overflow:hidden;" : ""}">${isMaxed ? "" : `-${remaining.toFixed(2)}%`}</span>
            </div>
            <span class="meta" style="font-size:10px; flex-shrink:0; white-space:nowrap;">of max ${maxVal.toFixed(2)}%</span>
          </div>`;
            }
          ).join("")}
        </div>`;
    wireIndexSwipe(listEl, petNames.length, activeRefineIdx, (next) => { activeRefineIdx = next; renderList(); });

    listEl.querySelectorAll("input[data-petunlockrefine]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const pet = cb.dataset.petunlockrefine;
        PETS_UNLOCKED[pet] = cb.checked;
        await saveCalcState("pets_unlocked", PETS_UNLOCKED);
        renderTotals();
        renderList();
      });
    });

    listEl.querySelectorAll("input[data-refinepet]").forEach((input) => {
      input.addEventListener("change", async () => {
        let val = parseFloat(input.value);
        if (Number.isNaN(val) || val < 0) val = 0;
        const pet = input.dataset.refinepet;
        const statKey = input.dataset.refinestat;
        const statDef = STAT_KEYS.find((s) => s.key === statKey);
        const cap = pct1(maxRow(pet)[statDef.maxKey]);
        if (val > cap) val = cap;
        input.value = val;
        petState(pet)[statKey] = val;
        await saveCalcState("pet_refine_typed", PET_REFINE_TYPED_STATE);
        renderTotals();
        updateStatRow(pet, statKey);
      });
    });

    listEl.querySelectorAll("[data-refinemaxpet]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const pet = btn.dataset.refinemaxpet;
        const m = maxRow(pet);
        const s = petState(pet);
        const allMaxed = STAT_KEYS.every(({ key, maxKey }) => (Number(s[key]) || 0) >= pct1(m[maxKey]) - 0.001);
        STAT_KEYS.forEach(({ key, maxKey }) => {
          s[key] = allMaxed ? 0 : pct1(m[maxKey]);
          const input = listEl.querySelector(`input[data-refinepet="${CSS.escape(pet)}"][data-refinestat="${CSS.escape(key)}"]`);
          if (input) input.value = s[key];
          updateStatRow(pet, key);
        });
        await saveCalcState("pet_refine_typed", PET_REFINE_TYPED_STATE);
        renderTotals();
      });
    });
  }

  renderTotals();
  renderList();
}

async function renderPetsDataPage() {
  await ensurePetsData();
  const petNames = Object.keys(PETS_NODES_CACHE);

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>Pets Level</h2>
              </div>
      <button class="btn" id="petsMaxAllBtn">Max everything</button>
    </div>

    <div id="petsSwipeCounter" style="text-align:center; margin-bottom:10px;"></div>
    <div id="petsList"></div>
  `;

  function getState(pet) {
    const s = PETS_STATE[pet];
    if (s && typeof s === "object") return s;
    // migrate old single-index state (or default) to {from, to}
    const maxIdx = PETS_NODES_CACHE[pet].length - 1;
    return { from: -1, to: maxIdx };
  }

  function computeNeeded(pet) {
    const levels = PETS_NODES_CACHE[pet];
    const { from, to } = getState(pet);
    const totals = { food: 0, manual: 0, potion: 0, serum: 0 };
    levels.forEach((r, i) => {
      if (i <= from || i > to) return;
      totals.food += Number(r.food) || 0;
      totals.manual += Number(r.manual) || 0;
      totals.potion += Number(r.potion) || 0;
      totals.serum += Number(r.serum) || 0;
    });
    return totals;
  }
  function currentAtkDef(pet) {
    const levels = PETS_NODES_CACHE[pet];
    const { from } = getState(pet);
    if (from < 0) return 0;
    const v = levels[from].atk_def_pct;
    return v == null ? 0 : Number(v) * 100;
  }
  function maxAtkDef(pet) {
    const levels = PETS_NODES_CACHE[pet];
    for (let i = levels.length - 1; i >= 0; i--) {
      if (levels[i].atk_def_pct != null) return Number(levels[i].atk_def_pct) * 100;
    }
    return 0;
  }

  function renderTotals() {
    const grand = { food: 0, manual: 0, potion: 0, serum: 0 };
    let grandAtk = 0, grandAtkMax = 0;
    petNames.forEach((pet) => {
      if (!isPetUnlocked(pet)) return;
      const n = computeNeeded(pet);
      grand.food += n.food;
      grand.manual += n.manual;
      grand.potion += n.potion;
      grand.serum += n.serum;
      grandAtk += currentAtkDef(pet);
      grandAtkMax += maxAtkDef(pet);
    });
    document.getElementById("petsTotals").innerHTML = `
      <div class="panel">
        <h2>Troops Stats</h2>
        <p class="desc">Summed across all 15 pets, based on current levels.</p>
        <div class="stats-row-scroll">
          <div class="metric" style="padding:6px; min-width:80px;">
            <div class="label" style="font-size:9px;">Troops Attack</div>
            <div class="val" style="font-size:13px;">${grandAtk.toFixed(1)}%</div>
            <div class="meta" style="font-size:8.5px; margin-top:2px;">of max ${grandAtkMax.toFixed(1)}%</div>
          </div>
          <div class="metric" style="padding:6px; min-width:80px;">
            <div class="label" style="font-size:9px;">Troops Defense</div>
            <div class="val" style="font-size:13px;">${grandAtk.toFixed(1)}%</div>
            <div class="meta" style="font-size:8.5px; margin-top:2px;">of max ${grandAtkMax.toFixed(1)}%</div>
          </div>
        </div>
      </div>
      <div class="panel">
        <h2>Backpack</h2>
        <p class="desc">Enter what you own \u2014 the rest shows what's still needed, across all 15 pets.</p>
        <div id="petsMaterialsBar"></div>
      </div>
    `;
    renderChiefGearResourcesBar(
      "petsMaterialsBar",
      { Food: grand.food, Manual: grand.manual, Potion: grand.potion, Serum: grand.serum },
      ["Food", "Manual", "Potion", "Serum"],
      renderTotals,
      "pets"
    );
  }

  const listEl = document.getElementById("petsList");
  const petsCounterEl = document.getElementById("petsSwipeCounter");
  let activePetIdx = 0;
  function renderList() {
    renderSwipeCounter(petsCounterEl, petNames.length, activePetIdx);
    const idx = activePetIdx;
    const pet = petNames[idx];
    const levels = PETS_NODES_CACHE[pet];
    const { from, to } = getState(pet);
    const needed = computeNeeded(pet);
    const cur = currentAtkDef(pet);
    const max = maxAtkDef(pet);
    const color = PET_TROOP_COLORS_CYCLE[idx % PET_TROOP_COLORS_CYCLE.length];
    const unlocked = isPetUnlocked(pet);
    const levelOpts = (selected) =>
      levels.map((r, i) => `<option value="${i}" ${i === selected ? "selected" : ""}>Lv. ${r.level_label}${i === levels.length - 1 ? " (Max)" : ""}</option>`).join("");
    const fromOpts = `<option value="-1" ${from === -1 ? "selected" : ""}>Not started</option>` + levelOpts(from);

    listEl.innerHTML = `
        <div class="panel" style="${unlocked ? "" : "opacity:0.5;"} text-align:left;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:14px; justify-content:flex-start; flex-wrap:nowrap;">
            <input type="checkbox" data-petunlock="${esc(pet)}" ${unlocked ? "checked" : ""} style="width:16px; height:16px; cursor:pointer; flex-shrink:0;" />
            <div class="name" style="font-size:16px; font-weight:700; color:${color};">${esc(pet)}</div>
          </label>
          <div class="stats-row-scroll pet-level-row" style="margin-bottom:16px;">
            <div class="metric" style="padding:8px; min-width:110px; flex:1 1 110px;">
              <div class="label" style="font-size:9px;">Troops Stats</div>

            </div>
            <div style="min-width:110px; flex:1 1 110px;">
              <div class="meta" style="font-size:9px; margin-bottom:4px;">Current</div>
              <select data-petfrom="${esc(pet)}" style="width:100%;">${fromOpts}</select>
            </div>
            <div style="min-width:110px; flex:1 1 110px;">
              <div class="meta" style="font-size:9px; margin-bottom:4px;">Target</div>

            ${smallResourceCard(PET_MATERIAL_ICONS.manual, "Manual", Math.round(needed.manual).toLocaleString())}
            ${smallResourceCard(PET_MATERIAL_ICONS.potion, "Potion", Math.round(needed.potion).toLocaleString())}
            ${smallResourceCard(PET_MATERIAL_ICONS.serum, "Serum", Math.round(needed.serum).toLocaleString())}
          </div>
        </div>`;
    wireIndexSwipe(listEl, petNames.length, activePetIdx, (next) => { activePetIdx = next; renderList(); });

    listEl.querySelectorAll("input[data-petunlock]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const pet = cb.dataset.petunlock;
        PETS_UNLOCKED[pet] = cb.checked;
        await saveCalcState("pets_unlocked", PETS_UNLOCKED);
        renderTotals();
        renderList();
      });
    });

    listEl.querySelectorAll("select[data-petfrom]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const pet = sel.dataset.petfrom;
        const s = getState(pet);
        s.from = Number(sel.value);
        PETS_STATE[pet] = s;
        await saveCalcState("pets_data", PETS_STATE);
        renderTotals();
        renderList();
      });
    });
    listEl.querySelectorAll("select[data-petto]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const pet = sel.dataset.petto;
        const s = getState(pet);
        s.to = Number(sel.value);
        PETS_STATE[pet] = s;
        await saveCalcState("pets_data", PETS_STATE);

        renderList();

      PETS_STATE[pet] = allMaxed ? { from: -1, to: maxIdx } : { from: maxIdx, to: maxIdx };

    renderList();

  renderTotals();
  renderList();

async function renderResearchCenterPage() {

    <div id="rcGroups"></div>
  `;
  wireResearchSpeedInput(() => {
    renderTotals();
    renderGroups();
  });

  document.getElementById("rcMaxAllBtn").addEventListener("click", async () => {
    const tracks = Object.keys(RC_NODES_CACHE);
    const allMaxed = tracks.every((track) => (RC_STATE[track] || 0) >= RC_NODES_CACHE[track].length);
    tracks.forEach((track) => {
      RC_STATE[track] = allMaxed ? 0 : RC_NODES_CACHE[track].length;
    });
    await saveCalcState("research_center", RC_STATE);
    renderTotals();
    renderGroups();
  });

  function computeNeeded(trackName) {
    const levels = RC_NODES_CACHE[trackName] || [];
    const cur = RC_STATE[trackName] || 0;
    const totals = { meat: 0, wood: 0, coal: 0, iron: 0, steel: 0, time_hours: 0 };
    levels.forEach((r) => {
      if (r.level <= cur) return;
      totals.meat += Number(r.meat) || 0;
      totals.wood += Number(r.wood) || 0;
      totals.coal += Number(r.coal) || 0;
      totals.iron += Number(r.iron) || 0;
      totals.steel += Number(r.steel) || 0;
      totals.time_hours += Number(r.time_hours) || 0;
    });
    return totals;
  }

  function computeStats(baseNames) {
    const stats = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
    baseNames.forEach((base) => {
      RC_TIERS.forEach((tier) => {
        const trackName = `${base} ${tier}`;
        const levels = RC_NODES_CACHE[trackName] || [];
        const cur = RC_STATE[trackName] || 0;
        levels.forEach((r) => {
          if (r.level > cur || !r.stat) return;
          stats[r.stat] += Number(r.stat_pct) || 0;
        });
      });
    });
    return stats;
  }

  function renderTotals() {
    const allTracks = Object.keys(RC_NODES_CACHE);
    const grand = { meat: 0, wood: 0, coal: 0, iron: 0, steel: 0, time_hours: 0 };
    allTracks.forEach((t) => {
      const n = computeNeeded(t);
      Object.keys(grand).forEach((k) => (grand[k] += n[k]));
    });
    const matTotals = {
      Meat: Math.round(grand.meat),
      Wood: Math.round(grand.wood),
      Coal: Math.round(grand.coal),
      Iron: Math.round(grand.iron),
      Steel: Math.round(grand.steel),
    };
    document.getElementById("rcTotals").innerHTML = `

        <h2>Backpack</h2>
        <p class="desc">Across all 102 research tracks, from current levels to max.</p>

        <div class="metric"><div class="label">Research Time</div><div class="val">${t12FormatTime(applyResearchSpeed(grand.time_hours))}</div></div>
      </div>
    `;
    renderChiefGearResourcesBar("rcResourcesBar", matTotals, Object.keys(matTotals), () => { renderTotals(); renderGroups(); }, "research_center");
  }

  const groupsEl = document.getElementById("rcGroups");
  function renderGroups() {
    groupsEl.innerHTML = Object.entries(RC_BASE_CATEGORIES)

        const stats = computeStats(baseNames);
        return `
      <div class="panel">
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <h2 style="margin:0;">${esc(groupName)}</h2>
          <button class="btn ghost small" data-rcmaxgroup="${esc(groupName)}">Max this section</button>
        </div>
        <div class="stats-row-scroll" style="margin:10px 0 14px;">
          <div class="metric" style="padding:6px; min-width:65px;"><div class="label" style="font-size:9px;">ATK</div><div class="val" style="font-size:13px;">+${stats.Attack.toFixed(1)}%</div></div>
          <div class="metric" style="padding:6px; min-width:65px;"><div class="label" style="font-size:9px;">DEF</div><div class="val" style="font-size:13px;">+${stats.Defense.toFixed(1)}%</div></div>
          <div class="metric" style="padding:6px; min-width:65px;"><div class="label" style="font-size:9px;">LETH</div><div class="val" style="font-size:13px;">+${stats.Lethality.toFixed(1)}%</div></div>
          <div class="metric" style="padding:6px; min-width:65px;"><div class="label" style="font-size:9px;">HP</div><div class="val" style="font-size:13px;">+${stats.Health.toFixed(1)}%</div></div>
        </div>
        ${baseNames
          .map((base) => {
            return `
          <div style="padding:10px 0; border-top:1px solid var(--line);">
            <div class="meta" style="margin-bottom:8px; font-weight:600; color:var(--frost);">${esc(base)}</div>
            <div class="rc-tier-grid" style="display:grid; grid-template-columns:repeat(6, 1fr); gap:10px;">
              ${RC_TIERS.map((tier) => {
                const trackName = `${base} ${tier}`;
                const levels = RC_NODES_CACHE[trackName];
                if (!levels) return `<div><div class="meta" style="font-size:10.5px; margin-bottom:4px;">${esc(tier)}</div><span class="meta" style="font-size:10.5px;">\u2014</span></div>`;
                const maxLvl = levels.length;
                const cur = RC_STATE[trackName] || 0;
                const opts = Array.from({ length: maxLvl + 1 }, (_, i) => `<option value="${i}" ${i === cur ? "selected" : ""}>${i === 0 ? "0" : i}${i === maxLvl ? " (Max)" : ""}</option>`).join("");
                return `
                <div>
                  <div class="meta" style="font-size:10.5px; margin-bottom:4px;">${esc(tier)}</div>
                  <select data-rctrack="${esc(trackName)}" style="width:100%; padding:5px 8px;">${opts}</select>
                </div>`;
              }).join("")}
            </div>
          </div>`;
          })
          .join("")}
      </div>`;
      })
      .join("");

    groupsEl.querySelectorAll("[data-rcmaxgroup]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const groupName = btn.dataset.rcmaxgroup;
        const baseNames = RC_BASE_CATEGORIES[groupName] || [];
        const groupTracks = [];
        baseNames.forEach((base) => {
          RC_TIERS.forEach((tier) => {
            const trackName = `${base} ${tier}`;
            if (RC_NODES_CACHE[trackName]) groupTracks.push(trackName);
          });
        });
        const allMaxed = groupTracks.every((t) => (RC_STATE[t] || 0) >= RC_NODES_CACHE[t].length);

        renderTotals();
        renderGroups();
      });
    });

    groupsEl.querySelectorAll("select[data-rctrack]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        RC_STATE[sel.dataset.rctrack] = Number(sel.value);
        await saveCalcState("research_center", RC_STATE);
        renderTotals();
        renderGroups();
      });
    });
  }

  renderTotals();
  renderGroups();
}

  renderTotals();
  renderTroopPanels();

async function renderFacilityPage() {
  const buildings = await sb(`skins?user_id=eq.${USER_ID}&category=eq.Facility&select=id,name,bonus_type,bonus_value,owned,image_url&order=sort_order.asc`);

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>Facility</h2>
        <div class="sub" id="facilitySummaryLine"></div>
      </div>
    </div>
    <div class="stats-row-scroll" id="facilityTotals" style="margin-bottom:16px;"></div>
    <div class="panel">
      <h2>Facility</h2>
      <p class="desc">Click a building to mark it owned/not owned.</p>
      <div class="stats-row-scroll facility-cards" id="facilityCards" style="align-items:stretch;"></div>
    </div>
  `;

  function render() {
    const ownedCount = buildings.filter((b) => b.owned).length;
    document.getElementById("facilitySummaryLine").textContent = `${ownedCount} / ${buildings.length} buildings owned`;

    const totalsByType = {};
    const maxByType = {};
    buildings.forEach((b) => {
      if (b.bonus_value == null) return;
      const key = b.bonus_type || "Other";
      maxByType[key] = (maxByType[key] || 0) + Number(b.bonus_value);
      if (b.owned) totalsByType[key] = (totalsByType[key] || 0) + Number(b.bonus_value);
    });
    document.getElementById("facilityTotals").innerHTML = Object.entries(maxByType).length
      ? Object.entries(maxByType)
          .map(
            ([type, maxVal]) =>
              `<div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">Total ${esc(type)}</div><div class="val" style="font-size:13px;">+${(totalsByType[type] || 0).toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">of max +${maxVal.toFixed(1)}%</div></div>`
          )
          .join("")
      : `<div class="metric"><div class="label">Total bonus</div><div class="val">+0%</div></div>`;



    const cardsEl = document.getElementById("facilityCards");
    cardsEl.innerHTML = buildings
      .map(
        (b) => `
      <div class="skin-card ${b.owned ? "owned" : ""}" data-facility="${b.id}" style="flex:0 0 140px; width:140px;">
        <div class="thumb island-thumb">
          ${b.image_url ? `<img src="${esc(b.image_url)}" alt="" loading="lazy" />` : `<div class="ph">${esc(b.name[0])}</div>`}
        </div>
        <div class="info">
          <div class="sname">${esc(b.name)}</div>
          <div class="sbonus">${b.bonus_value != null ? `+${Number(b.bonus_value)}% ${esc(b.bonus_type || "")}` : "Bonus unknown"}</div>
          <div class="sowned">${b.owned ? "\u2713 Owned" : "Not owned"}</div>
        </div>
      </div>`
      )
      .join("");

    cardsEl.querySelectorAll("[data-facility]").forEach((card) => {
      card.addEventListener("click", async (e) => {
        const b = buildings.find((x) => x.id === card.dataset.facility);
        const newOwned = !b.owned;
        try {
          await sb(`skins?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ owned: newOwned }) });
          b.owned = newOwned;
          render();
        } catch (err) {
          toast("Couldn't update building", true);
        }
      });
    });
  }

  render();
}

async function renderAdminRoster(body) {

    ["DEF", "Defense"],
    ["DMG", "Lethality"],

  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Add a new expert</h2>
      <p class="desc">After adding, go to Expert Affinity / Skills / Research below to add their stat data.</p>
      <form class="inline" id="adminAddExpertForm">
        <input class="flex1" name="key" placeholder="Expert name" required />
        <span style="display:inline-flex; gap:4px; align-items:center; flex:1;"><input class="flex1" name="img" placeholder="Portrait image URL (optional)" style="flex:1;" />${uploadBtnHtml()}</span>

      </form>

    </div>
    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;">
        <h2 style="margin:0;">Roster (${rows.length})</h2>
        <button class="btn small" id="adminRosterSaveAll">Save all</button>
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <thead><tr>
            ${["Name", "Image URL", "Skill 1", "Skill 2", "Skill 3", "Skill 4", "Main stat", "Troop restriction", "Order", ""]
              .map((h) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${h}</th>`)
              .join("")}
          </tr></thead>
          <tbody>
            ${rows
              .map(
                (r) => `
              <tr data-rosterrow="${r.id}">
                <td style="padding:4px;"><input data-f="key" value="${esc(r.key)}" style="width:100px;" /></td>
                <td style="padding:4px;"><span style="display:inline-flex; gap:4px; align-items:center;"><input data-f="img" value="${esc(r.img || "")}" style="width:160px;" />${uploadBtnHtml()}</span></td>
                <td style="padding:4px;"><input data-f="skill1" value="${esc(r.skill1 || "")}" style="width:110px;" /></td>
                <td style="padding:4px;"><input data-f="skill2" value="${esc(r.skill2 || "")}" style="width:110px;" /></td>
                <td style="padding:4px;"><input data-f="skill3" value="${esc(r.skill3 || "")}" style="width:110px;" /></td>
                <td style="padding:4px;"><input data-f="skill4" value="${esc(r.skill4 || "")}" style="width:110px;" /></td>
                <td style="padding:4px;">
                  <select data-f="main_stat">${STAT_OPTS.map(([v, l]) => `<option value="${v}" ${v === r.main_stat ? "selected" : ""}>${l}</option>`).join("")}</select>
                </td>
                <td style="padding:4px;">
                  <select data-f="main_stat_troop">
                    <option value="" ${!r.main_stat_troop ? "selected" : ""}>All troops</option>
                    <option value="Lancers" ${r.main_stat_troop === "Lancers" ? "selected" : ""}>Lancers only</option>
                    <option value="Infantry" ${r.main_stat_troop === "Infantry" ? "selected" : ""}>Infantry only</option>
                    <option value="Marksman" ${r.main_stat_troop === "Marksman" ? "selected" : ""}>Marksman only</option>
                  </select>
                </td>
                <td style="padding:4px;"><input data-f="sort_order" type="number" value="${r.sort_order}" style="width:56px;" /></td>
                <td style="padding:4px; white-space:nowrap;">
                  <button class="btn small ghost" data-rostersave="${r.id}">Save</button>
                  <button class="btn small ghost" data-rosterdel="${r.id}" style="color:var(--danger);">Delete</button>
                </td>
              </tr>`
              )
              .join("")}
          </tbody>
        </table>
      </div>

  document.getElementById("adminAddExpertForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminAddExpertErr");
    errEl.textContent = "";
    const key = f.key.value.trim();
    if (!key) { errEl.textContent = "Enter a name"; return; }
    try {
      const maxOrder = rows.reduce((m, r) => Math.max(m, r.sort_order || 0), 0);
      await sb(`experts`, {
        method: "POST",
        body: JSON.stringify({
          key,
          img: f.img.value.trim() || null,
          main_stat: f.main_stat.value,
          main_stat_troop: f.main_stat_troop.value || null,
          sort_order: maxOrder + 1,
        }),
      });
      EXPERTS_ROSTER_LOADED = false; // force re-fetch everywhere

      renderAdminPage();

      errEl.textContent = "Couldn't add expert (name might already exist)";

    const tr = body.querySelector(`tr[data-rosterrow="${id}"]`);

    tr.querySelectorAll("[data-f]").forEach((el) => {
      let v = el.value;
      if (el.dataset.f === "sort_order") v = Number(v) || 0;
      if ((el.dataset.f === "img" || el.dataset.f.startsWith("skill") || el.dataset.f === "main_stat_troop") && v.trim() === "") v = null;
      body_[el.dataset.f] = v;

    await sb(`experts?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(body_) });
  };

    btn.addEventListener("click", async () => {
      try {
        await saveRosterRow(btn.dataset.rostersave);
        EXPERTS_ROSTER_LOADED = false;
        toast("Saved");
      } catch (err) {
        toast("Couldn't save", true);
      }
    });
  });
  const rosterSaveAllBtn = document.getElementById("adminRosterSaveAll");
  if (rosterSaveAllBtn) {
    rosterSaveAllBtn.addEventListener("click", async () => {
      rosterSaveAllBtn.disabled = true;
      rosterSaveAllBtn.textContent = "Saving\u2026";
      try {
        await Promise.all(rows.map((r) => saveRosterRow(r.id)));
        EXPERTS_ROSTER_LOADED = false;
        toast(`Saved ${rows.length} row${rows.length === 1 ? "" : "s"}`);
      } catch (err) {
        toast("Couldn't save all", true);
      }
      rosterSaveAllBtn.disabled = false;
      rosterSaveAllBtn.textContent = "Save all";
    });
  }

  body.querySelectorAll("[data-rosterdel]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this expert from the roster? Their affinity/skill/research data rows will remain but become orphaned.")) return;
      try {
        await sb(`experts?id=eq.${btn.dataset.rosterdel}`, { method: "DELETE" });
        EXPERTS_ROSTER_LOADED = false;
        toast("Deleted");
        renderAdminPage();
      } catch (err) {
        toast("Couldn't delete", true);
      }
    });
  });
}

                )

                )

        </tbody>

    `;

    wrap.querySelectorAll("[data-exprowsave]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try {

        }
      });
    });
    wrap.querySelectorAll("[data-exprowdel]").forEach((btn) => {

          loadRows();
        } catch (err) {

      else if (v.trim() === "") v = null;
      payload[c.key] = v;
    });
    try {
      await sb(`${cfg.table}`, { method: "POST", body: JSON.stringify(payload) });
      toast("Row added");
      f.reset();
      loadRows();
    } catch (err) {
      errEl.textContent = "Couldn't add row";
    }
  });

  await loadRows();
}

    if (pets.includes(pet)) { errEl.textContent = "That pet already exists"; return; }
    try {
      await sb(`pets_nodes`, {
        method: "POST",
        body: JSON.stringify({ pet, level_label: "1", food: 0, manual: 0, potion: 0, serum: 0, atk_def_pct: 0, sort_order: 0 }),
      });
      PETS_NODES_CACHE = null;
      toast("Pet added");
      ADMIN_ACTIVE_PET = pet;
      renderAdminPets(body);
    } catch (err) {
      errEl.textContent = "Couldn't add pet";
    }
  });

  if (!ADMIN_ACTIVE_PET) {
    document.getElementById("adminPetRowsHeading").textContent = "No pets yet \u2014 add one above";

  document.getElementById("adminPetPicker").addEventListener("change", (e) => {
    ADMIN_ACTIVE_PET = e.target.value;
    renderAdminPets(body);

    { key: "food", label: "Food", type: "number" },

    { key: "potion", label: "Potion", type: "number" },
    { key: "serum", label: "Serum", type: "number" },
    { key: "atk_def_pct", label: "ATK/DEF %", type: "number" },

      toast(`Saved ${currentPetRows.length} row${currentPetRows.length === 1 ? "" : "s"}`);

          <th></th>
        </tr></thead>
        <tbody>
          ${rows
            .map(
              (r) => `
            <tr data-petrow="${r.id}">
              ${petCols
                .map(
                  (c) =>
                    `<td style="padding:4px;"><input data-f="${c.key}" ${c.type === "number" ? 'type="number" step="any"' : ""} value="${esc(r[c.key] ?? "")}" style="width:90px;" /></td>`
                )
                .join("")}
              <td style="padding:4px; white-space:nowrap;">
                <button class="btn small ghost" data-petrowsave="${r.id}">Save</button>
                <button class="btn small ghost" data-petrowdel="${r.id}" style="color:var(--danger);">Delete</button>
              </td>
            </tr>`
                )
            .join("")}
        </tbody>
      </table>
    `;

    const savePetRow = async (id) => {
      const tr = wrap.querySelector(`tr[data-petrow="${id}"]`);
      const patch = {};
      tr.querySelectorAll("[data-f]").forEach((el) => {
        const c = petCols.find((c) => c.key === el.dataset.f);
        let v = el.value;
        if (c.type === "number") v = v === "" ? null : Number(v);
        patch[el.dataset.f] = v;
      });
      await sb(`pets_nodes?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });
      PETS_NODES_CACHE = null;
    };
    currentPetRows = rows;
    wrap.querySelectorAll("[data-petrowsave]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try {
          await savePetRow(btn.dataset.petrowsave);

    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminAddPetRowErr");
    errEl.textContent = "";
    try {
      const existing = await sb(`pets_nodes?pet=eq.${encodeURIComponent(ADMIN_ACTIVE_PET)}&select=sort_order&order=sort_order.desc&limit=1`);
      const nextOrder = existing.length ? (existing[0].sort_order || 0) + 1 : 0;
      const payload = { pet: ADMIN_ACTIVE_PET, sort_order: nextOrder };
      petCols.forEach((c) => {
        if (c.key === "sort_order") return;
        let v = f[c.key] ? f[c.key].value : "";
        if (c.type === "number") v = v === "" ? 0 : Number(v);
        payload[c.key] = v;
      });
      await sb(`pets_nodes`, { method: "POST", body: JSON.stringify(payload) });
      PETS_NODES_CACHE = null;
      toast("Row added");
      f.reset();
      loadPetRows();
    } catch (err) {
      errEl.textContent = "Couldn't add row";
    }
  });

  await loadPetRows();
}

// ---- Generic flat-table editor (small tables, no expert/pet grouping) ----
// Used for Chief Charm levels, Tundra Album tiers, Collection Gallery tiers.
async function renderAdminFlatLevels(body, cfg) {
  const cols = ["id", ...cfg.cols.map((c) => c.key)].join(",");
  const rows = await sb(`${cfg.table}?select=${cols}&order=${cfg.orderCol}.asc`);
  const canReorder = cfg.orderCol === "sort_order";

  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Add a row</h2>
      <form class="inline" id="adminFlatAddForm">
        ${cfg.cols.map((c) => `<input class="field-num" name="${c.key}" placeholder="${esc(c.label)}" ${c.type === "number" ? 'type="number" step="any"' : ""} style="width:130px;" />`).join("")}
        <button class="btn" type="submit">Add row</button>
      </form>
      <div class="err" id="adminFlatAddErr"></div>
    </div>
    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;">
        <h2 style="margin:0;">${esc(cfg.title)} (${rows.length})</h2>
        <button class="btn small" id="adminFlatSaveAll">Save all</button>
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <thead><tr>
            ${canReorder ? `<th></th>` : ""}
            ${cfg.cols.map((c) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${esc(c.label)}</th>`).join("")}
            <th></th>
          </tr></thead>
          <tbody>
            ${rows
              .map(
                (r, idx) => `
              <tr data-flatrow="${r.id}">
                ${canReorder ? `
                <td style="padding:4px; white-space:nowrap;">
                  <button class="btn small ghost" data-flatup="${r.id}" ${idx === 0 ? "disabled" : ""} title="Move up">&#9650;</button>
                  <button class="btn small ghost" data-flatdown="${r.id}" ${idx === rows.length - 1 ? "disabled" : ""} title="Move down">&#9660;</button>
                </td>` : ""}
                ${cfg.cols
                  .map(
                    (c) =>
                      `<td style="padding:4px;"><input data-f="${c.key}" ${c.type === "number" ? 'type="number" step="any"' : ""} value="${esc(r[c.key] ?? "")}" style="width:110px;" /></td>`
                  )
                  .join("")}
                <td style="padding:4px; white-space:nowrap;">
                  <button class="btn small ghost" data-flatsave="${r.id}">Save</button>
                  <button class="btn small ghost" data-flatdel="${r.id}" style="color:var(--danger);">Delete</button>
                </td>
              </tr>`
              )
              .join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const saveRow = async (id) => {
    const tr = body.querySelector(`tr[data-flatrow="${id}"]`);
    const patch = {};
    tr.querySelectorAll("[data-f]").forEach((el) => {
      const c = cfg.cols.find((c) => c.key === el.dataset.f);
      let v = el.value;
      if (c.type === "number") v = v === "" ? null : Number(v);
      patch[el.dataset.f] = v;
    });
    await sb(`${cfg.table}?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });
  };
  body.querySelectorAll("[data-flatsave]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await saveRow(btn.dataset.flatsave);
        if (cfg.onSave) cfg.onSave();
        toast("Saved");
      } catch (err) {
        toast("Couldn't save", true);
      }
    });
  });
  const saveAllBtn = document.getElementById("adminFlatSaveAll");
  if (saveAllBtn) {
    saveAllBtn.addEventListener("click", async () => {
      saveAllBtn.disabled = true;
      saveAllBtn.textContent = "Saving\u2026";
      try {
        await Promise.all(rows.map((r) => saveRow(r.id)));
        if (cfg.onSave) cfg.onSave();
        toast(`Saved ${rows.length} row${rows.length === 1 ? "" : "s"}`);
      } catch (err) {
        toast("Couldn't save all", true);
      }
      saveAllBtn.disabled = false;
      saveAllBtn.textContent = "Save all";
    });
  }
  if (canReorder) {
    const swapOrder = async (id, dir) => {
      const idx = rows.findIndex((r) => r.id === id);
      const otherIdx = idx + dir;
      if (otherIdx < 0 || otherIdx >= rows.length) return;
      const a = rows[idx], b = rows[otherIdx];
      const aOrder = a.sort_order, bOrder = b.sort_order;
      try {
        await Promise.all([
          sb(`${cfg.table}?id=eq.${a.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: bOrder }) }),
          sb(`${cfg.table}?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: aOrder }) }),
        ]);
        if (cfg.onSave) cfg.onSave();
        renderAdminFlatLevels(body, cfg);
      } catch (err) {
        toast("Couldn't reorder", true);
      }
    };
    body.querySelectorAll("[data-flatup]").forEach((btn) => {
      btn.addEventListener("click", () => swapOrder(btn.dataset.flatup, -1));
    });
    body.querySelectorAll("[data-flatdown]").forEach((btn) => {
      btn.addEventListener("click", () => swapOrder(btn.dataset.flatdown, 1));
    });
  }
  body.querySelectorAll("[data-flatdel]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this row?")) return;
      try {
        await sb(`${cfg.table}?id=eq.${btn.dataset.flatdel}`, { method: "DELETE" });
        if (cfg.onSave) cfg.onSave();
        toast("Deleted");
        renderAdminFlatLevels(body, cfg);
      } catch (err) {
        toast("Couldn't delete", true);
      }
    });
  });

  document.getElementById("adminFlatAddForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminFlatAddErr");
    errEl.textContent = "";
    const payload = {};
    cfg.cols.forEach((c) => {
      let v = f[c.key].value;
      if (c.key === "sort_order" && v === "") {
        const maxOrder = rows.reduce((m, r) => Math.max(m, r.sort_order || 0), -1);
        v = maxOrder + 1;
      } else if (c.type === "number") {
        v = v === "" ? 0 : Number(v);
      }
      payload[c.key] = v;
    });
    try {
      await sb(`${cfg.table}`, { method: "POST", body: JSON.stringify(payload) });
      if (cfg.onSave) cfg.onSave();
      toast("Row added");
      renderAdminFlatLevels(body, cfg);
    } catch (err) {
      errEl.textContent = "Couldn't add row";
    }
  });
}

// ---- VIP editor (buff matrix: rows = tiers, columns = Attack/Defense/Lethality/Health) ----
async function renderAdminVip(body) {
  let [table] = await sb(`buff_tables?name=eq.VIP Tier&user_id=eq.${USER_ID}&select=id`);
  if (!table) {
    const [created] = await sb(`buff_tables`, { method: "POST", body: JSON.stringify({ user_id: USER_ID, name: "VIP Tier", sort_order: 0 }) });
    table = created;
  }
  let columns = await sb(`buff_columns?table_id=eq.${table.id}&select=id,name&order=sort_order.asc`);
  const STAT_NAMES = ["Attack", "Defense", "Lethality", "Health"];
  // Auto-create the 4 stat columns if missing.
  for (const statName of STAT_NAMES) {
    if (!columns.find((c) => c.name === statName)) {
      const [created] = await sb(`buff_columns`, { method: "POST", body: JSON.stringify({ table_id: table.id, name: statName, category: statName, sort_order: STAT_NAMES.indexOf(statName) }) });
      columns.push(created);
    }
  }
  const colByName = Object.fromEntries(columns.map((c) => [c.name, c.id]));
  const rows = await sb(`buff_rows?table_id=eq.${table.id}&select=id,name,sort_order,buff_cells(id,value,column_id)&order=sort_order.asc`);

  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Add a VIP tier</h2>
      <form class="inline" id="adminVipAddForm">
        <input class="flex1" name="name" placeholder="Tier name (e.g. VIP 12)" required />
        <button class="btn" type="submit">Add tier</button>
      </form>
      <div class="err" id="adminVipAddErr"></div>
    </div>
    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;">
        <h2 style="margin:0;">VIP tiers (${rows.length})</h2>
        <button class="btn small" id="adminVipSaveAll">Save all</button>
      </div>
      <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <thead><tr>
            <th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">Tier</th>
            ${STAT_NAMES.map((s) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${s} %</th>`).join("")}
            <th></th>
          </tr></thead>
          <tbody>
            ${rows
              .map((r) => {
                const cellByCol = Object.fromEntries(r.buff_cells.map((c) => [c.column_id, c.value]));
                return `
              <tr data-viprow="${r.id}">
                <td style="padding:4px;"><input data-vipname value="${esc(r.name)}" style="width:100px;" /></td>
                ${STAT_NAMES.map((s) => `<td style="padding:4px;"><input data-vipstat="${esc(s)}" type="number" step="any" value="${cellByCol[colByName[s]] ?? ""}" style="width:90px;" /></td>`).join("")}
                <td style="padding:4px; white-space:nowrap;">
                  <button class="btn small ghost" data-vipsave="${r.id}">Save</button>
                  <button class="btn small ghost" data-vipdel="${r.id}" style="color:var(--danger);">Delete</button>
                </td>
              </tr>`;
              })
              .join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const saveVipRow = async (id) => {
    const tr = body.querySelector(`tr[data-viprow="${id}"]`);
    const name = tr.querySelector("[data-vipname]").value.trim();
    await sb(`buff_rows?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ name }) });
    for (const s of STAT_NAMES) {
      const v = tr.querySelector(`[data-vipstat="${s}"]`).value;
      const colId = colByName[s];
      const existing = await sb(`buff_cells?row_id=eq.${id}&column_id=eq.${colId}&select=id`);
      if (existing.length) {
        await sb(`buff_cells?id=eq.${existing[0].id}`, { method: "PATCH", body: JSON.stringify({ value: v === "" ? null : Number(v) }) });
      } else if (v !== "") {
        await sb(`buff_cells`, { method: "POST", body: JSON.stringify({ row_id: id, column_id: colId, value: Number(v) }) });
      }
    }
    VIP_ROWS_CACHE = null;
  };
  body.querySelectorAll("[data-vipsave]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await saveVipRow(btn.dataset.vipsave);
        toast("Saved");
      } catch (err) {
        toast("Couldn't save", true);
      }
    });
  });
  document.getElementById("adminVipSaveAll").addEventListener("click", async () => {
    const btn = document.getElementById("adminVipSaveAll");
    btn.disabled = true;
    btn.textContent = "Saving\u2026";
    try {
      await Promise.all(rows.map((r) => saveVipRow(r.id)));
      toast(`Saved ${rows.length} row${rows.length === 1 ? "" : "s"}`);
    } catch (err) {
      toast("Couldn't save all", true);
    }
    btn.disabled = false;
    btn.textContent = "Save all";
  });
  body.querySelectorAll("[data-vipdel]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this VIP tier?")) return;
      try {
        await sb(`buff_rows?id=eq.${btn.dataset.vipdel}`, { method: "DELETE" });
        VIP_ROWS_CACHE = null;
        toast("Deleted");
        renderAdminVip(body);
      } catch (err) {
        toast("Couldn't delete", true);
      }
    });
  });

  document.getElementById("adminVipAddForm").addEventListener("submit", async (e) => {
    e.preventDefault();

      <p class="desc">"Has count trigger" shows a "Count in max" checkbox on that item's card and moves it below the divider line (used on Frame for unverified items).</p>

            ${["Name", "Image URL", "Bonus stat", "Bonus %", "Current lvl", "Max lvl", "Owned", "Has count trigger", "Order", ""]

            ${rows
              .map(
                (r) => `
              <tr data-skinrow="${r.id}">
                <td style="padding:4px;"><input data-f="name" value="${esc(r.name)}" style="width:110px;" /></td>
                <td style="padding:4px;"><span style="display:inline-flex; gap:4px; align-items:center;"><input data-f="image_url" value="${esc(r.image_url || "")}" style="width:150px;" />${uploadBtnHtml()}</span></td>

                <td style="padding:4px;"><input data-f="bonus_value" type="number" step="any" value="${r.bonus_value ?? ""}" style="width:70px;" /></td>

                <td style="padding:4px;"><input data-f="max_level" type="number" value="${r.max_level ?? ""}" style="width:70px;" /></td>
                <td style="padding:4px;"><input data-f="owned" type="checkbox" ${r.owned ? "checked" : ""} /></td>

                  <button class="btn small ghost" data-skinmoveup="${r.id}" title="Move up" style="padding:4px 8px;">&#8593;</button>
                  <button class="btn small ghost" data-skinmovedown="${r.id}" title="Move down" style="padding:4px 8px;">&#8595;</button>
                  <button class="btn small ghost" data-skinsave="${r.id}">Save</button>

              )
              .join("")}
          </tbody>
        </table>
      </div>

  body.querySelectorAll("[data-skinmoveup]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const idx = rows.findIndex((r) => r.id === btn.dataset.skinmoveup);
      if (idx <= 0) return;
      const a = rows[idx], b = rows[idx - 1];
      await Promise.all([
        sb(`skins?id=eq.${a.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: b.sort_order }) }),
        sb(`skins?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: a.sort_order }) }),
      ]);
      renderAdminSkinsCategory(body, category);
    });
  });
  body.querySelectorAll("[data-skinmovedown]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const idx = rows.findIndex((r) => r.id === btn.dataset.skinmovedown);
      if (idx === -1 || idx >= rows.length - 1) return;
      const a = rows[idx], b = rows[idx + 1];
      await Promise.all([
        sb(`skins?id=eq.${a.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: b.sort_order }) }),
        sb(`skins?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: a.sort_order }) }),
      ]);
      renderAdminSkinsCategory(body, category);
    });
  });

  const saveSkinRow = async (id) => {
    const tr = body.querySelector(`tr[data-skinrow="${id}"]`);
    const patch = {};
    tr.querySelectorAll("[data-f]").forEach((el) => {
      const f = el.dataset.f;
      if (f === "owned" || f === "show_count_toggle") { patch[f] = el.checked; return; }
      let v = el.value;
      if (["bonus_value", "current_level", "max_level", "sort_order"].includes(f)) v = v === "" ? null : Number(v);
      else if (v.trim() === "") v = null;
      patch[f] = v;
    });
    await sb(`skins?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });
  };
  body.querySelectorAll("[data-skinsave]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await saveSkinRow(btn.dataset.skinsave);
        toast("Saved");
      } catch (err) {
        toast("Couldn't save", true);
      }
    });
  });
  document.getElementById("adminSkinsCatSaveAll").addEventListener("click", async () => {
    const btn = document.getElementById("adminSkinsCatSaveAll");
    btn.disabled = true;
    btn.textContent = "Saving\u2026";
    try {
      await Promise.all(rows.map((r) => saveSkinRow(r.id)));
      toast(`Saved ${rows.length} row${rows.length === 1 ? "" : "s"}`);
    } catch (err) {
      toast("Couldn't save all", true);
    }
    btn.disabled = false;
    btn.textContent = "Save all";
  });
  body.querySelectorAll("[data-skindel]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this item?")) return;
      try {
        await sb(`skins?id=eq.${btn.dataset.skindel}`, { method: "DELETE" });
        toast("Deleted");
        renderAdminSkinsCategory(body, category);
      } catch (err) {
        toast("Couldn't delete", true);
      }
    });
  });

  document.getElementById("adminSkinsAddForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminSkinsAddErr");
    errEl.textContent = "";
    const name = f.name.value.trim();
    if (!name) { errEl.textContent = "Enter a name"; return; }
    try {
      const maxOrder = rows.reduce((m, r) => Math.max(m, r.sort_order || 0), 0);
      await sb(`skins`, {
        method: "POST",
        body: JSON.stringify({
          user_id: USER_ID,
          category,
          name,
          image_url: f.image_url.value.trim() || null,
          bonus_type: f.bonus_type.value.trim() || null,
          bonus_value: f.bonus_value.value === "" ? null : Number(f.bonus_value.value),
          max_level: f.max_level.value === "" ? null : Number(f.max_level.value),
          current_level: 0,
          owned: false,
          sort_order: maxOrder + 1,
        }),
      });
      toast("Item added");
      renderAdminSkinsCategory(body, category);
    } catch (err) {
      errEl.textContent = "Couldn't add item";
    }
  });
}

async function renderAdminProgression(body, nameFilter) {
  let tables = await sb(`progression_tables?select=id,name&order=name.asc`);
  if (nameFilter) tables = tables.filter((t) => nameFilter.includes(t.name));
  if (!ADMIN_ACTIVE_PROGRESSION || !tables.find((t) => t.id === ADMIN_ACTIVE_PROGRESSION)) {
    ADMIN_ACTIVE_PROGRESSION = tables[0] ? tables[0].id : null;
  }
  const activeTableName = tables.find((t) => t.id === ADMIN_ACTIVE_PROGRESSION)?.name || "";
  const isChiefGear = activeTableName === "Chief Gear";
  const isHeroGear = activeTableName.startsWith("Hero Gear");
  const materialCols = isChiefGear
    ? [
        { key: "hardened_alloy", label: "Hardened Alloy", type: "number" },
        { key: "polishing_solution", label: "Polishing Solution", type: "number" },
        { key: "design_plan", label: "Design Plan", type: "number" },
        { key: "amber", label: "Amber", type: "number" },
      ]
    : isHeroGear
    ? [
        { key: "mithril", label: "Mithril", type: "number" },
        { key: "mythic_gear", label: "Mythic Gear", type: "number" },
        { key: "xp_component", label: "XP Component", type: "number" },
        { key: "essence_stones", label: "Essence Stones", type: "number" },
      ]
    : [{ key: "materials", label: "Materials", type: "text" }];
  const cols = [
    { key: "sort_order", label: "Order", type: "number" },
    { key: "tier", label: "Tier", type: "text" },
    { key: "stars", label: "Stars", type: "number" },
    { key: "level", label: "Level", type: "number" },
    { key: "stage", label: "Stage", type: "text" },
    { key: "stat", label: "Stat", type: "text" },
    ...(isChiefGear ? [] : [{ key: "stat2", label: "Stat 2", type: "text" }]),
    ...materialCols,
    { key: "power", label: "Power", type: "number" },
    { key: "display_label", label: "Dropdown text (override)", type: "text" },
  ];

  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Pick a table</h2>
      <select id="adminProgPicker" style="width:260px;">
        ${tables.map((t) => `<option value="${t.id}" ${t.id === ADMIN_ACTIVE_PROGRESSION ? "selected" : ""}>${esc(t.name)}</option>`).join("")}
      </select>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>Add a row</h2>
      <form class="inline" id="adminProgAddForm">
        ${cols.map((c) => `<input class="field-num" name="${c.key}" placeholder="${esc(c.label)}" ${c.type === "number" ? 'type="number" step="any"' : ""} style="width:100px;" />`).join("")}
        <button class="btn" type="submit">Add row</button>
      </form>
      <div class="err" id="adminProgAddErr"></div>
    </div>
    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;">
        <h2 id="adminProgHeading" style="margin:0;">Rows</h2>
        <button class="btn small" id="adminProgSaveAll">Save all</button>
      </div>
      <div id="adminProgWrap" style="overflow-x:auto;"></div>
    </div>
  `;

  document.getElementById("adminProgSaveAll").addEventListener("click", () => saveAllProgRows());

  document.getElementById("adminProgPicker").addEventListener("change", (e) => {
    ADMIN_ACTIVE_PROGRESSION = e.target.value;
    renderAdminProgression(body, nameFilter);
  });

  function invalidateCaches() {
    CHIEF_GEAR_ROWS = null;
    HERO_GEAR_TABLES_CACHE = null;
  }

  let currentProgRows = [];
  const saveProgRow = async (id) => {
    const wrap = document.getElementById("adminProgWrap");
    const tr = wrap.querySelector(`tr[data-progrow="${id}"]`);
    const patch = {};
    tr.querySelectorAll("[data-f]").forEach((el) => {
      const c = cols.find((c) => c.key === el.dataset.f);
      let v = el.value;
      if (c.type === "number") v = v === "" ? null : Number(v);
      else if (v.trim() === "") v = null;
      patch[el.dataset.f] = v;
    });
    await sb(`progression_rows?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });
  };
  const saveAllProgRows = async () => {
    const btn = document.getElementById("adminProgSaveAll");
    btn.disabled = true;
    btn.textContent = "Saving\u2026";
    try {
      await Promise.all(currentProgRows.map((r) => saveProgRow(r.id)));
      invalidateCaches();
      toast(`Saved ${currentProgRows.length} row${currentProgRows.length === 1 ? "" : "s"}`);
    } catch (err) {
      toast("Couldn't save all", true);
    }
    btn.disabled = false;
    btn.textContent = "Save all";
  };

  async function loadRows() {
    const selectCols = ["id", ...cols.map((c) => c.key)].join(",");
    const rows = await sb(`progression_rows?table_id=eq.${ADMIN_ACTIVE_PROGRESSION}&select=${selectCols}&order=sort_order.asc`);
    currentProgRows = rows;
    document.getElementById("adminProgHeading").textContent = `Rows (${rows.length})`;
    const wrap = document.getElementById("adminProgWrap");
    wrap.innerHTML = `
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <thead><tr>
          ${cols.map((c) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${esc(c.label)}</th>`).join("")}
          <th></th>
        </tr></thead>
        <tbody>
          ${rows
            .map(
              (r) => `
            <tr data-progrow="${r.id}">
              ${cols
                .map(
                  (c) =>
                    `<td style="padding:4px;"><input data-f="${c.key}" ${c.type === "number" ? 'type="number" step="any"' : ""} value="${esc(r[c.key] ?? "")}" style="width:${c.key === "materials" ? "220px" : "90px"};" /></td>`
                )
                .join("")}
              <td style="padding:4px; white-space:nowrap;">
                <button class="btn small ghost" data-progsave="${r.id}">Save</button>
                <button class="btn small ghost" data-progdel="${r.id}" style="color:var(--danger);">Delete</button>
              </td>
            </tr>`
                )
            .join("")}
        </tbody>
      </table>
    `;

    wrap.querySelectorAll("[data-progsave]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try {
          await saveProgRow(btn.dataset.progsave);
          invalidateCaches();
          toast("Saved");
        } catch (err) {
          toast("Couldn't save", true);
        }
      });
    });
    wrap.querySelectorAll("[data-progdel]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this row?")) return;
        try {
          await sb(`progression_rows?id=eq.${btn.dataset.progdel}`, { method: "DELETE" });
          invalidateCaches();
          toast("Deleted");
          loadRows();
        } catch (err) {
          toast("Couldn't delete", true);
        }
      });
    });
  }

  document.getElementById("adminProgAddForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminProgAddErr");
    errEl.textContent = "";
    const payload = { table_id: ADMIN_ACTIVE_PROGRESSION };
    cols.forEach((c) => {
      let v = f[c.key].value;
      if (c.key === "sort_order" && v === "") {
        v = null;
      } else if (c.type === "number") {
        v = v === "" ? null : Number(v);
      } else if (v.trim() === "") {
        v = null;
      }
      payload[c.key] = v;
    });
    try {
      if (payload.sort_order == null) {
        const existing = await sb(`progression_rows?table_id=eq.${ADMIN_ACTIVE_PROGRESSION}&select=sort_order&order=sort_order.desc&limit=1`);
        payload.sort_order = existing.length ? (existing[0].sort_order || 0) + 1 : 0;
      }
      await sb(`progression_rows`, { method: "POST", body: JSON.stringify(payload) });
      invalidateCaches();
      toast("Row added");
      f.reset();
      loadRows();
    } catch (err) {
      errEl.textContent = "Couldn't add row";
    }
  });

  await loadRows();
}
