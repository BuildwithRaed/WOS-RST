// FACILITY PAGE (under Extra Bonus)
// A reference table of every known facility building (like VIP's
// full reference), plus clickable owned/not-owned cards (like the
// Islands page) backed by the same `skins` table, category='Facility'.
// ============================================================
// ============================================================
// ALLIANCE TECH PAGE (under Extra Bonus)
// 16 research items (Infantry/Lancers/Marksman/Troops x Attack/
// Defense/Lethality/Health), each leveled 0-5 at 1% per level.
// Backed by the `skins` table, category='Alliance Tech'.
// ============================================================
// ============================================================
// HEROES PAGE (under Extra Bonus) - Jero and Natalia, both shown
// together as stacked star-level sections (0-5 stars per stat,
// scaled linearly from each stat's max value). Star selections are
// persisted via calc_state, separate from the static max reference
// stored in buff_cells.
// ============================================================
async function renderHeroStarSection(heroName, displayName, imageUrl, containerId) {
  await ensureBuffTable();
  if (!BUFF_CATEGORIES.some((c) => c.name === heroName)) await loadBuffCategories();
  const cat = BUFF_CATEGORIES.find((c) => c.name === heroName);
  const el = document.getElementById(containerId);
  if (!cat) {
    el.innerHTML = `<div class="panel"><div class="empty">${esc(displayName)} category not found.</div></div>`;
    return;
  }
  const rows = await sb(`buff_rows?table_id=eq.${BUFF_TABLE_ID}&select=id,name,sort_order,buff_cells(value,column_id)&order=sort_order.asc`);
  const STAT_LABELS = { ATT: "Attack", DEF: "Defense", DMG: "Lethality", HP: "Health" };
  const seenStats = new Set();
  const statRows = rows
    .map((r) => {
      const cell = r.buff_cells.find((c) => c.column_id === cat.columns[0].id);
      const statKey = r.name.split(" ").pop(); // ATT/DEF/DMG/HP
      return { id: r.id, statKey, max: cell && cell.value != null ? Number(cell.value) : null };
    })
    .filter((r) => r.max != null)
    .filter((r) => {
      // collapse Infantry/Lancers/Marksman duplicates of the same stat into one "Troops X" row
      if (seenStats.has(r.statKey)) return false;
      seenStats.add(r.statKey);
      return true;
    })
    .map((r) => ({ id: r.id, name: `Troops ${STAT_LABELS[r.statKey] || r.statKey}`, max: r.max }));

  const saved = (await loadCalcState(`hero_stars_${heroName.toLowerCase()}`)) || {};
  const sharedKey = "__shared__";
  const stars = saved[sharedKey] ?? 5;

  el.innerHTML = `
    <div class="panel">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:4px;">
        ${imageUrl ? `<img src="${esc(imageUrl)}" alt="" style="width:48px; height:48px; object-fit:cover; border-radius:8px; border:1px solid var(--line);" loading="lazy" />` : ""}
        <h2 style="margin:0;">${esc(displayName)}</h2>
      </div>
      <p class="desc">Click a star to set your current level (0\u20135).</p>
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
        <div id="heroStarRow-${esc(heroName)}" style="display:flex; gap:3px;">
          ${[1, 2, 3, 4, 5]
            .map(
              (n) =>
                `<span data-starbtn="${n}" style="cursor:pointer; font-size:24px; color:${n <= stars ? "var(--ice)" : "var(--line)"};">&#9733;</span>`
            )
            .join("")}
        </div>
        <span class="meta" style="font-size:12px;">${stars} / 5 stars</span>
      </div>
      <div class="grid g2" id="heroStatCards-${esc(heroName)}"></div>
    </div>
  `;

  const starRow = document.getElementById(`heroStarRow-${heroName}`);
  const cardsEl = document.getElementById(`heroStatCards-${heroName}`);

  function renderCards(curStars) {
    cardsEl.innerHTML = statRows
      .map((r) => {
        const cur = (r.max / 5) * curStars;
        const needed = r.max - cur;
        return `<div class="metric"><div class="label">${esc(r.name)}</div><div class="val">+${cur.toFixed(1)}%</div><div class="meta" style="font-size:11px; margin-top:2px;">${needed > 0 ? `+${needed.toFixed(1)}% needed for max` : "Maxed"}</div></div>`;
      })
      .join("");
  }
  renderCards(stars);

  starRow.querySelectorAll("[data-starbtn]").forEach((star) => {
    star.addEventListener("click", async () => {
      const n = Number(star.dataset.starbtn);
      const current = saved[sharedKey] ?? 5;
      const newStars = current === n ? n - 1 : n;
      starRow.querySelectorAll("[data-starbtn]").forEach((s) => {
        s.style.color = Number(s.dataset.starbtn) <= newStars ? "var(--ice)" : "var(--line)";
      });
      starRow.nextElementSibling.textContent = `${newStars} / 5 stars`;
      renderCards(newStars);
      saved[sharedKey] = newStars;
      await saveCalcState(`hero_stars_${heroName.toLowerCase()}`, saved);
    });
  });
}

let RESEARCH_SPEED_PCT = 0;
let RESEARCH_SPEEDUP_MINUTES = 0;
async function ensureResearchSpeedData() {
  const saved = await loadCalcState("research_speed");
  RESEARCH_SPEED_PCT = (saved && typeof saved.pct === "number") ? saved.pct : 0;
  const savedSpeedup = await loadCalcState("research_speedup_minutes");
  RESEARCH_SPEEDUP_MINUTES = (savedSpeedup && typeof savedSpeedup.minutes === "number") ? savedSpeedup.minutes : 0;
}
// Applies both the % speed buff and a banked speedup-item time deduction.
function applyResearchSpeed(rawHours) {
  const afterPct = rawHours / (1 + RESEARCH_SPEED_PCT / 100);
  return Math.max(0, afterPct - RESEARCH_SPEEDUP_MINUTES / 60);
}
// Renders "Research Speed %" and "Speedups" inputs together; reused
// identically on the T11 Helios, T12 Research, and Research Center pages
// since they're the same real buffs/items applied everywhere.

function t12FormatTime(hours) {
  if (!hours) return "0h";
  const d = Math.floor(hours / 24);
  const h = Math.round(hours % 24);
  return d > 0 ? `${d}d ${h}h` : `${h}h`;
}
function formatTimeDHM(hours) {
  if (!hours || hours <= 0) return "0m";
  const totalMinutes = Math.round(hours * 60);
  const d = Math.floor(totalMinutes / 1440);
  const h = Math.floor((totalMinutes % 1440) / 60);
  const m = totalMinutes % 60;
  const parts = [];
  if (d > 0) parts.push(`${d}d`);
  if (h > 0 || d > 0) parts.push(`${h}h`);
  parts.push(`${m}m`);
  return parts.join(" ");
}

async function ensureT12StateData() {
  if (T12_STATE) return;
  const saved = await loadCalcState("t12_research");
  T12_STATE = saved || {};
  T12_TROOPS.forEach((troop) => {
    if (!T12_STATE[troop]) T12_STATE[troop] = {};
    T12_ITEM_DEFS.forEach((def) => {
      if (typeof T12_STATE[troop][def.key] !== "number") T12_STATE[troop][def.key] = 0;
    });
  });
}

function computeT12Stats(troopState) {
  const stats = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
  T12_ITEM_DEFS.forEach((def) => {
    if (!def.stat) return;
    const pct = def.pct || 1;
    stats[def.stat] += (troopState[def.key] || 0) * pct;
  });
  return stats;
}

async function ensureT11StateData() {
  if (!T11_NODES_CACHE) {
    const rows = await sb(`t11_helios_nodes?select=track,troop,level,meat,wood,coal,iron,steel,refined_fc,fc_shard,time_hours,stat,stat_pct&order=troop,sort_order`);
    T11_NODES_CACHE = {};
    rows.forEach((r) => {
      if (!T11_NODES_CACHE[r.troop]) T11_NODES_CACHE[r.troop] = {};
      if (!T11_NODES_CACHE[r.troop][r.track]) T11_NODES_CACHE[r.troop][r.track] = [];
      T11_NODES_CACHE[r.troop][r.track].push(r);
    });
  }
  if (T11_STATE) return;
  const saved = await loadCalcState("t11_helios");
  T11_STATE = saved || {};
  T11_TROOPS.forEach((troop) => {
    if (!T11_STATE[troop]) T11_STATE[troop] = {};
  });
}

// Pure stat computation, reusable by both the T11 page and the Dashboard.
function computeT11Stats(troop, useMax) {
  const tracks = (T11_NODES_CACHE && T11_NODES_CACHE[troop]) || {};
  const stats = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
  Object.entries(tracks).forEach(([track, levels]) => {
    const cur = useMax ? Infinity : ((T11_STATE && T11_STATE[troop] && T11_STATE[troop][track]) || 0);
    levels.forEach((r) => {
      if (r.level > cur || !r.stat) return;
      stats[r.stat] += Number(r.stat_pct) || 0;
    });
  });
  return stats;
}

        render();

    });

  renderGrandTotal();

const EXPERT_RESEARCH_STAT_LABEL = { ATK: "Attack", DEF: "Defense", DMG: "Lethality", HP: "Health" };
async function renderExpertsResearchPage() {
  await ensureExpertsRosterGlobal();
  const saved = (await loadCalcState("experts_research")) || {};
  const rows = await sb(`expert_research_nodes?select=expert,path_number,path_name,level,stat_type,stat_value,sigil_cost,stat_type2,stat_value2&order=sort_order`);
  const RESEARCH_CACHE = {}; // { "Cyrille": { 1: [rows...], 2: [...], 3: [...] } }
  const PATH_NAMES = {}; // { "Cyrille": { 1: "Hunting Skill - Proficient", ... } }
  rows.forEach((r) => {
    if (!RESEARCH_CACHE[r.expert]) RESEARCH_CACHE[r.expert] = {};

      PATH_NAMES[r.expert][r.path_number] = r.path_name;
    }
  });
  const EXPERTS_IN_ORDER = EXPERTS_IN_ORDER_GLOBAL;
  function pathNumbersFor(expert) {
    return Object.keys(RESEARCH_CACHE[expert] || {})
      .map(Number)
      .sort((a, b) => a - b);
  }

  EXPERTS_IN_ORDER.forEach((expert) => {
    if (!saved[expert]) saved[expert] = {};
    pathNumbersFor(expert).forEach((p) => {
      if (typeof saved[expert][p] !== "object") saved[expert][p] = { current: 0, desired: 0 };
    });
  });

  const unlockedState = (await loadCalcState("experts_research_unlocked")) || {};
  function isResearchUnlocked(expert) {
    return unlockedState[expert] === false ? false : true;
  }

  // Main stat per expert: scales continuously every level (1-200), unlike the
  // rotating stat which only changes at the 10 milestone levels (20,40,...200).
  // Rate confirmed from source data: 0.01% per level per path.
  const EXPERT_MAIN_STAT = EXPERT_MAIN_STAT_GLOBAL_MAP;
  // Gareth's and Justus's main stat only applies to a specific troop type
  // (Lancers / Infantry respectively), unlike every other expert's main
  // stat which applies to all troops.
  const EXPERT_MAIN_STAT_TROOP = EXPERT_MAIN_STAT_TROOP_GLOBAL_MAP;
  // Rate per level so the main stat reaches 54% at level 200 (54/200) for
  // the 9 confirmed experts; Gareth/Justus keep the original 0.01%/level
  // rate until their target max is confirmed too.
  const MAIN_STAT_RATE_DEFAULT = 0.01; // % per level

  function pathCost(expert, pathNum, fromLevel, toLevel) {
    const pathRows = (RESEARCH_CACHE[expert] || {})[pathNum] || [];
    let sigil = 0;
    const stats = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
    pathRows.forEach((r) => {
      if (r.level > fromLevel && r.level <= toLevel) {
        sigil += Number(r.sigil_cost) || 0;
        if (stats[r.stat_type] != null) stats[r.stat_type] += Number(r.stat_value) || 0;
      }
    });
    // Main stat accumulates continuously per level, independent of milestone rows.
    // Gareth/Justus use a different rate per page: 0.3%/level on page 1
    // (paths 1-3, max 60% at level 200), 0.5%/level on page 2 (paths 4-6,
    // max 100% at level 200).
    const mainStat = EXPERT_MAIN_STAT[expert];
    if (mainStat && stats[mainStat] != null) {
      const clampedFrom = Math.max(0, Math.min(200, fromLevel));
      const clampedTo = Math.max(0, Math.min(200, toLevel));
      const levelsCrossed = Math.max(0, clampedTo - clampedFrom);
      let rate = MAIN_STAT_RATE_DEFAULT;
      if (expert === "Gareth") {
        rate = pathNum <= 3 ? 0.03 : 0.05; // 6% max page 1, 10% max page 2
      } else if (expert === "Justus") {
        rate = pathNum <= 3 ? 0.03 : 0.05; // 6% max page 1, 10% max page 2 (48% total)
      }
      stats[mainStat] += levelsCrossed * rate;
    }
    return { sigil, stats };
  }
  // Rotation stat only (excludes the main stat), for the per-path breakdown display
  function pathRotationOnly(expert, pathNum, fromLevel, toLevel) {

    let sigil = 0;

    pathRows.forEach((r) => {
      if (r.level > fromLevel && r.level <= toLevel) {
        sigil += Number(r.sigil_cost) || 0;

  content.innerHTML = `

  function statTotalsHtml(totals, maxTotals) {

            const pathName = (PATH_NAMES[expert] || {})[p] || `Path ${p}`;
            const { sigil, stats } = pathRotationOnly(expert, p, st.current, st.desired);
            const statParts = Object.entries(stats)
              .filter(([, v]) => v > 0)
              .map(([k, v]) => `+${v.toFixed(1)}% ${EXPERT_RESEARCH_STAT_LABEL[k]}`)
              .join(", ");
            const isPage2Start = p === 4;
            return `
          ${isPage2Start ? '<div class="meta" style="font-size:10px; font-weight:700; margin:10px 0 4px; color:var(--frost);">Page 2</div>' : ""}
          <div style="padding:8px 0; ${idx < pathNums.length - 1 ? "border-bottom:1px solid var(--line);" : ""}">
            <div class="meta" style="font-size:12px; margin-bottom:4px;">${esc(pathName)}</div>
            <div style="display:flex; gap:6px; margin-bottom:4px;">
              <div style="flex:1;">
                <div class="meta" style="font-size:10px;">Current</div>
                <select data-expresearchcur="${esc(expert)}|${p}" style="width:100%;">${pathLevelOpts(expert, p, st.current)}</select>
              </div>
              <div style="flex:1;">
                <div class="meta" style="font-size:10px;">Target</div>
                <select data-expresearchdes="${esc(expert)}|${p}" style="width:100%;">${pathLevelOpts(expert, p, st.desired)}</select>
              </div>
            </div>
            <div class="meta" style="font-size:10px; text-align:right; color:var(--ice);">${Math.round(sigil).toLocaleString()} Sigils${statParts ? " \u00b7 " + statParts : ""}</div>
          </div>`;
          })
          .join("")}
      </div>`;
  }

  function renderGrid() {
    const SIX_PATH_EXPERTS = new Set(["Gareth", "Justus"]);
    const normalExperts = EXPERTS_IN_ORDER.filter((e) => !SIX_PATH_EXPERTS.has(e));
    const sixPathExperts = EXPERTS_IN_ORDER.filter((e) => SIX_PATH_EXPERTS.has(e));
    gridEl.innerHTML = normalExperts.map(expertCardHtml).join("");
    grid6El.innerHTML = sixPathExperts.map(expertCardHtml).join("");

    [gridEl, grid6El].forEach((container) => {
      container.querySelectorAll("input[data-expresearchunlock]").forEach((cb) => {
        cb.addEventListener("change", async () => {
          const expert = cb.dataset.expresearchunlock;
          unlockedState[expert] = cb.checked;
          await saveCalcState("experts_research_unlocked", unlockedState);
          renderTotals();
          renderGrid();
        });
      });
      container.querySelectorAll("[data-expresearchmax]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const expert = btn.dataset.expresearchmax;
          const paths = pathNumbersFor(expert);
          const bothMaxed = paths.every((p) => saved[expert][p].current >= 200 && saved[expert][p].desired >= 200);
          const currentZeroTargetMaxed = paths.every((p) => saved[expert][p].current <= 0 && saved[expert][p].desired >= 200);
          const bothZero = paths.every((p) => saved[expert][p].current <= 0 && saved[expert][p].desired <= 0);
          // Cycle: (0,0) -> (200,200) -> (0,200) -> (0,0) -> ...
          let nextCurrent, nextTarget;
          if (bothZero) {
            nextCurrent = 200;
            nextTarget = 200;
          } else if (bothMaxed) {
            nextCurrent = 0;
            nextTarget = 200;
          } else if (currentZeroTargetMaxed) {
            nextCurrent = 0;
            nextTarget = 0;
          } else {
            // mixed/partial state: snap to fully maxed first
            nextCurrent = 200;
            nextTarget = 200;
          }
          paths.forEach((p) => {
            saved[expert][p].current = nextCurrent;
            saved[expert][p].desired = nextTarget;
          });
          await saveCalcState("experts_research", saved);
          renderTotals();
          renderGrid();
        });
      });
      container.querySelectorAll("select[data-expresearchcur]").forEach((sel) => {
        sel.addEventListener("change", async () => {
          const [expert, p] = sel.dataset.expresearchcur.split("|");
          const newCurrent = Number(sel.value);
          saved[expert][p].current = newCurrent;
          if (newCurrent > 0 && saved[expert][p].desired <= 0) {
            saved[expert][p].desired = newCurrent;
          }
          await saveCalcState("experts_research", saved);
          renderTotals();
          renderGrid();
        });
      });
      container.querySelectorAll("select[data-expresearchdes]").forEach((sel) => {
        sel.addEventListener("change", async () => {
          const [expert, p] = sel.dataset.expresearchdes.split("|");
          saved[expert][p].desired = Number(sel.value);
          await saveCalcState("experts_research", saved);
          renderTotals();
          renderGrid();
        });
      });
    });
  }

  renderTotals();
  renderGrid();
}

    EXPERTS_LIST.forEach((e) => {

      e.skills.forEach((sk) => {
        const st = saved[e.key].skills[sk];
        const { exp, book } = skillCost(e.key, sk, st.current, st.desired);

            <div class="meta" style="font-size:10px; margin-bottom:2px;">Target</div>
            <select data-expdes="${esc(e.key)}" style="width:100%;">${levelOpts(EXPERT_HERO_MAX_LEVEL, s.desired)}</select>
            ${levelStatLine(e.key, s.desired)}
          </div>
        </div>
        <div style="border-top:1px solid var(--line); padding-top:10px;">
          ${e.skills
            .map((sk) => {
              const max = skillMaxLevel(e.key, sk);
              const st = s.skills[sk];
              const { exp, book } = skillCost(e.key, sk, st.current, st.desired);
              const skillRows = SKILL_CACHE[`${e.key}|${sk}`];
              let curRow = null, desRow = null;
              if (skillRows) {
                skillRows.forEach((r) => {
                  if (r.level <= st.current) curRow = r;
                  if (r.level <= st.desired) desRow = r;
                });
              }
              const fmtStat = (r) => (r && r.stat_type ? `+${Number(r.stat_value).toFixed(2)}% ${r.stat_type.split(",").join("/")}` : null);
              const SKILL_STAT_WHITELIST = new Set([
                "Romulus|Last Line", "Romulus|Spirit of Aeetis",
                "Gareth|Porcupine", "Gareth|Undefeated Will",
                "Fabian|Heightened Firepower",
                "Valeria|Battle Concerto",
              ]);
              const showSkillStat = SKILL_STAT_WHITELIST.has(`${e.key}|${sk}`);
              const curStat = showSkillStat ? fmtStat(curRow) : null;
              const desStat = showSkillStat ? fmtStat(desRow) : null;
              return `
          <div style="padding:6px 0;">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
              <span class="meta" style="font-size:12px;">${esc(sk)}</span>
              <div style="display:flex; gap:6px;">
                <select data-expskillcur="${esc(e.key)}|${esc(sk)}" style="width:60px;">${levelOpts(max, Math.min(st.current, max))}</select>
                <select data-expskilldes="${esc(e.key)}|${esc(sk)}" style="width:60px;">${levelOpts(max, Math.min(st.desired, max))}</select>
              </div>
            </div>
            ${
              curStat || desStat
                ? `<div class="meta" style="font-size:10px; text-align:right; margin-top:2px; color:var(--ice);">${curStat || "\u2014"} \u00b7 ${desStat || "\u2014"}</div>`
                : ""
            }
            ${
              exp || book
                ? `<div class="meta" style="font-size:10px; text-align:right; margin-top:2px;">${Math.round(exp).toLocaleString()} EXP \u00b7 ${Math.round(book).toLocaleString()} Books</div>`
                : ""
            }
          </div>`;
            })
            .join("")}
        </div>
      </div>`;
    }).join("");

    gridEl.querySelectorAll("select[data-expcur]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        saved[sel.dataset.expcur].current = Number(sel.value);
        await saveCalcState("experts", saved);
        renderStatHeader();
        renderFoundryHeader();
        renderSvsHeader();
        renderFrostfireHeader();
        renderTundraHeader();
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("select[data-expdes]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        saved[sel.dataset.expdes].desired = Number(sel.value);
        await saveCalcState("experts", saved);
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("input[data-expunlock]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const expert = cb.dataset.expunlock;
        unlockedState[expert] = cb.checked;
        await saveCalcState("experts_unlocked", unlockedState);
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("[data-expmax]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const hero = btn.dataset.expmax;
        const s = saved[hero];
        const heroMaxLvl = (AFFINITY_CACHE[hero] || []).length || EXPERT_HERO_MAX_LEVEL;
        const heroExpert = EXPERTS_LIST.find((e) => e.key === hero);
        const heroAlreadyMaxed = s.current >= heroMaxLvl;
        const skillsAlreadyMaxed = heroExpert.skills.every((sk) => {
          const max = skillMaxLevel(hero, sk);
          return s.skills[sk].current >= max;
        });
        const allMaxed = heroAlreadyMaxed && skillsAlreadyMaxed;
        if (allMaxed) {
          s.current = 0;
          heroExpert.skills.forEach((sk) => {
            s.skills[sk].current = 0;
          });
        } else {
          s.current = heroMaxLvl;
          heroExpert.skills.forEach((sk) => {
            const max = skillMaxLevel(hero, sk);
            s.skills[sk].current = max;
          });
        }
        await saveCalcState("experts", saved);
        renderStatHeader();
        renderFoundryHeader();
        renderSvsHeader();
        renderFrostfireHeader();
        renderTundraHeader();
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("select[data-expskillcur]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const [hero, skill] = sel.dataset.expskillcur.split("|");
        saved[hero].skills[skill].current = Number(sel.value);
        await saveCalcState("experts", saved);
        renderStatHeader();
        renderFoundryHeader();
        renderSvsHeader();
        renderFrostfireHeader();
        renderTundraHeader();
        renderTotals();
        renderGrid();
      });
    });
    gridEl.querySelectorAll("select[data-expskilldes]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const [hero, skill] = sel.dataset.expskilldes.split("|");
        saved[hero].skills[skill].desired = Number(sel.value);
        await saveCalcState("experts", saved);
        renderTotals();
        renderGrid();
      });
    });
  }

  const invEl = document.getElementById("expertsInventory");
  function renderInventory() {
    invEl.innerHTML = EXPERT_INVENTORY_FIELDS.map(
      (f) => `
      <div style="display:flex; align-items:center; gap:8px;">
        <img src="${EXPERT_INVENTORY_ICONS[f]}" alt="" style="width:40px; height:40px; object-fit:contain; flex-shrink:0;" loading="lazy" />
        <div style="flex:1;">
          <div class="meta" style="font-size:11px; margin-bottom:4px;">${esc(f)}</div>
          <input type="text" inputmode="numeric" data-expinv="${esc(f)}" value="${invSaved[f] || 0}" style="width:100%; padding:6px 8px;" />
        </div>
      </div>`
    ).join("");

    invEl.querySelectorAll("input[data-expinv]").forEach((input) => {
      input.addEventListener("change", async () => {
        let val = parseInt(input.value, 10);
        if (Number.isNaN(val) || val < 0) val = 0;
        input.value = val;
        invSaved[input.dataset.expinv] = val;
        await saveCalcState("experts_inventory", invSaved);
        renderTotals();
      });
    });
  }

  renderStatHeader();
  renderFoundryHeader();
  renderSvsHeader();
  renderFrostfireHeader();
  renderTundraHeader();
  renderTotals();
  renderGrid();
  renderInventory();
}

async function renderRefinePage() {
  await ensurePetsData(); // loads PET_REFINE_CACHE too
  const PET_TABLE_ORDER = [
    "Cave Hyena", "Arctic Wolf", "Musk Ox", "Giant Tapir", "Titan Roc",
    "Giant Elk", "Snow Leopard", "Cave Lion", "Snow Ape", "Iron Rhino",
    "Sabertooth Tiger", "Mammoth", "Frost Gorilla", "Frostscale Chameleon", "Abyssal Shelldragon",
  ];
  const petNames = Object.keys(PET_REFINE_CACHE).sort((a, b) => {
    const ia = PET_TABLE_ORDER.indexOf(a);
    const ib = PET_TABLE_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  if (!PET_REFINE_TYPED_STATE) {
    const saved = await loadCalcState("pet_refine_typed");
    PET_REFINE_TYPED_STATE = saved || {};
  }

  const STAGE_COLORS = {
    Grey: "#9aa5b1",
    Green: "#5bc98a",
    Blue: "#6fd3f2",
    Purple: "#b98ae0",
    Orange: "#e8a23c",
    Red: "#e0645f",
  };
  // Finds which stage bracket a typed value currently sits in for one pet+stat:
  // the first stage whose own threshold hasn't been fully reached yet (i.e. the
  // stage you're currently progressing within). Once you go above a stage's max,
  // the color immediately switches to the next stage, rather than waiting until
  // that next stage's own max is reached.
  function stageForValue(pet, maxKey, val) {
    const rows = PET_REFINE_CACHE[pet];
    for (const r of rows) {
      if (Number(r[maxKey]) * 100 >= val - 0.0001) return { stage: r.stage, color: STAGE_COLORS[r.stage] || "var(--ice)" };
    }
    const last = rows[rows.length - 1];
    return { stage: last.stage, color: STAGE_COLORS[last.stage] || "var(--ice)" };
  }

  const STAT_KEYS = [
    { key: "il", label: "Infantry Lethality", maxKey: "infantry_lethality_pct" },
    { key: "ih", label: "Infantry Health", maxKey: "infantry_health_pct" },
    { key: "ll", label: "Lancer Lethality", maxKey: "lancer_lethality_pct" },
    { key: "lh", label: "Lancer Health", maxKey: "lancer_health_pct" },
    { key: "ml", label: "Marksman Lethality", maxKey: "marksman_lethality_pct" },
    { key: "mh", label: "Marksman Health", maxKey: "marksman_health_pct" },
  ];

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>Pets Refine</h2>
        <div class="sub">Type each pet's current refine % per stat \u2014 refine upgrades vary (0.01%\u20131% each), so there's no fixed level to pick from.</div>
      </div>
    </div>
    <div id="refineTotals" style="margin-bottom:16px;"></div>
    <div id="refineList"></div>
  `;

  function maxRow(pet) {
    const rows = PET_REFINE_CACHE[pet];
    return rows[rows.length - 1];
  }
  function petState(pet) {
    if (!PET_REFINE_TYPED_STATE[pet] || typeof PET_REFINE_TYPED_STATE[pet] !== "object") {
      PET_REFINE_TYPED_STATE[pet] = { il: 0, ih: 0, ll: 0, lh: 0, ml: 0, mh: 0 };
    }
    return PET_REFINE_TYPED_STATE[pet];
  }

  function renderTotals() {
    const grand = { il: 0, ih: 0, ll: 0, lh: 0, ml: 0, mh: 0 };
    const grandMax = { il: 0, ih: 0, ll: 0, lh: 0, ml: 0, mh: 0 };
    petNames.forEach((pet) => {
      if (!isPetUnlocked(pet)) return;
      const s = petState(pet);
      const m = maxRow(pet);
      STAT_KEYS.forEach(({ key, maxKey }) => {
        grand[key] += Number(s[key]) || 0;
        grandMax[key] += Number(m[maxKey]) * 100;
      });
    });
    document.getElementById("refineTotals").innerHTML = `
      <div class="panel">
        <h2>Total refine bonus</h2>
        <p class="desc">Summed across all 15 pets, based on what you've typed in.</p>
        <div class="grid g3">
          ${STAT_KEYS.map(({ key, label }) => `<div class="metric"><div class="label">${esc(label)}</div><div class="val">+${grand[key].toFixed(2)}%</div><div class="meta" style="font-size:11px; margin-top:2px;">of max +${grandMax[key].toFixed(2)}%</div></div>`).join("")}
        </div>
      </div>
    `;
  }

  const TIER_ORDER = ["First", "N", "R", "SR", "SRR", "UR"];
  const listEl = document.getElementById("refineList");
  // Updates one pet+stat row's bar width/color and remaining-text in place,
  // without touching any input elements (avoids stealing focus from a field
  // the user just clicked into while another field's blur was still settling).
  function updateStatRow(pet, statKey) {
    const row = listEl.querySelector(`[data-refinerowfor="${CSS.escape(pet)}|${CSS.escape(statKey)}"]`);
    if (!row) return;
    const statDef = STAT_KEYS.find((s) => s.key === statKey);
    const s = petState(pet);
    const m = maxRow(pet);
    const curVal = Number(s[statKey]) || 0;
    const maxVal = Number(m[statDef.maxKey]) * 100;
    const pct = maxVal > 0 ? Math.min(100, (curVal / maxVal) * 100) : 0;
    const remaining = Math.max(0, maxVal - curVal);
    const isMaxed = remaining <= 0.005;
    const { color } = stageForValue(pet, statDef.maxKey, curVal);

    const barFill = row.querySelector("[data-refinebar] > div");
    if (barFill) {
      barFill.style.width = `${pct}%`;
      barFill.style.background = color;
    }
    const remainingEl = row.querySelector("[data-refineremaining]");
    if (remainingEl) {
      remainingEl.textContent = isMaxed ? "" : `-${remaining.toFixed(2)}%`;
      remainingEl.style.color = color;
      remainingEl.style.width = isMaxed ? "0" : "";
      remainingEl.style.overflow = isMaxed ? "hidden" : "";
    }
  }
  function renderList() {
    // group pets by their own rarity category (First/N/R/SR/SRR/UR)
    const groups = {};
    petNames.forEach((pet) => {
      const tier = maxRow(pet).category || "Other";
      if (!groups[tier]) groups[tier] = [];
      groups[tier].push(pet);
    });
    const tiersInUse = [...TIER_ORDER.filter((t) => groups[t]), ...Object.keys(groups).filter((t) => !TIER_ORDER.includes(t))];

    listEl.innerHTML = tiersInUse
      .map((tier) => {
        const pets = groups[tier];
        return `
        <div class="panel">
          <h2 style="margin-bottom:12px;">${esc(tier)} tier</h2>
          <div style="display:grid; grid-template-columns:repeat(${pets.length >= 2 ? 2 : 1}, 1fr); gap:16px;">
            ${pets
              .map((pet) => {
                const idx = petNames.indexOf(pet);
                const m = maxRow(pet);
                const s = petState(pet);
                const color = PET_TROOP_COLORS_CYCLE[idx % PET_TROOP_COLORS_CYCLE.length];
                const unlocked = isPetUnlocked(pet);
                return `
            <div style="padding:12px; border:1px solid var(--line); border-radius:8px; ${unlocked ? "" : "opacity:0.5;"}">
              <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                  <input type="checkbox" data-petunlockrefine="${esc(pet)}" ${unlocked ? "checked" : ""} style="width:16px; height:16px; cursor:pointer;" />
                  <div class="name" style="font-size:15px; font-weight:700; color:${color};">${esc(pet)}</div>
                </label>
                <button class="btn ghost small" data-refinemaxpet="${esc(pet)}">Max</button>
              </div>
              ${STAT_KEYS.map(
                ({ key, label, maxKey }) => {
                  const curVal = Number(s[key]) || 0;
                  const maxVal = Number(m[maxKey]) * 100;
                  const pct = maxVal > 0 ? Math.min(100, (curVal / maxVal) * 100) : 0;
                  const remaining = Math.max(0, maxVal - curVal);
                  const isMaxed = remaining <= 0.005;
                  const { color } = stageForValue(pet, maxKey, curVal);
                  return `
              <div data-refinerowfor="${esc(pet)}|${key}" style="display:grid; grid-template-columns:150px 80px 1fr 70px; align-items:center; gap:8px; padding:6px 0;">
                <span class="meta" style="font-size:12px;">${esc(label)}</span>
                <input type="text" inputmode="decimal" data-refinepet="${esc(pet)}" data-refinestat="${key}" value="${s[key]}" style="width:70px; padding:4px 6px;" />
                <div style="display:flex; align-items:center; gap:6px; min-width:0;">
                  <div data-refinebar style="flex:1; height:8px; border-radius:4px; background:var(--panel-2); overflow:hidden;">
                    <div style="width:${pct}%; height:100%; background:${color}; border-radius:4px; transition:width 0.2s;"></div>
                  </div>
                  <span data-refineremaining class="meta" style="font-size:10.5px; color:${color}; flex-shrink:0; ${isMaxed ? "width:0; overflow:hidden;" : ""}">${isMaxed ? "" : `-${remaining.toFixed(2)}%`}</span>
                </div>
                <span class="meta" style="font-size:10.5px;">of max ${maxVal.toFixed(2)}%</span>
              </div>`;
                }
              ).join("")}
            </div>`;
              })
              .join("")}
          </div>
        </div>`;
      })
      .join("");

    listEl.querySelectorAll("input[data-petunlockrefine]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const pet = cb.dataset.petunlockrefine;
        PETS_UNLOCKED[pet] = cb.checked;
        await saveCalcState("pets_unlocked", PETS_UNLOCKED);
        renderTotals();
        renderList();
      });
    });

    listEl.querySelectorAll("input[data-refinepet]").forEach((input) => {
      input.addEventListener("change", async () => {
        let val = parseFloat(input.value);
        if (Number.isNaN(val) || val < 0) val = 0;
        const pet = input.dataset.refinepet;
        const statKey = input.dataset.refinestat;
        const statDef = STAT_KEYS.find((s) => s.key === statKey);
        const cap = maxRow(pet)[statDef.maxKey] * 100;
        if (val > cap) val = cap;
        input.value = val;
        petState(pet)[statKey] = val;
        await saveCalcState("pet_refine_typed", PET_REFINE_TYPED_STATE);
        renderTotals();
        updateStatRow(pet, statKey);
      });
    });

    listEl.querySelectorAll("[data-refinemaxpet]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const pet = btn.dataset.refinemaxpet;
        const m = maxRow(pet);
        const s = petState(pet);
        const allMaxed = STAT_KEYS.every(({ key, maxKey }) => (Number(s[key]) || 0) >= m[maxKey] * 100 - 0.001);
        STAT_KEYS.forEach(({ key, maxKey }) => {
          s[key] = allMaxed ? 0 : Number((m[maxKey] * 100).toFixed(4));
          const input = listEl.querySelector(`input[data-refinepet="${CSS.escape(pet)}"][data-refinestat="${CSS.escape(key)}"]`);
          if (input) input.value = s[key];
          updateStatRow(pet, key);
        });
        await saveCalcState("pet_refine_typed", PET_REFINE_TYPED_STATE);
        renderTotals();
      });
    });
  }

  renderTotals();
  renderList();
}

async function renderPetsDataPage() {
  await ensurePetsData();
  const petNames = Object.keys(PETS_NODES_CACHE);

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>Pets Level</h2>
        <div class="sub">Set each pet's current level \u2014 totals show what's left to reach max.</div>
      </div>
      <button class="btn" id="petsMaxAllBtn">Max everything</button>
    </div>
    <div id="petsTotals" style="margin-bottom:16px;"></div>
    <div id="petsList"></div>
  `;

  function getState(pet) {
    const s = PETS_STATE[pet];
    if (s && typeof s === "object") return s;
    // migrate old single-index state (or default) to {from, to}
    const maxIdx = PETS_NODES_CACHE[pet].length - 1;
    return { from: -1, to: maxIdx };
  }

  function computeNeeded(pet) {
    const levels = PETS_NODES_CACHE[pet];
    const { from, to } = getState(pet);
    const totals = { food: 0, manual: 0, potion: 0, serum: 0 };
    levels.forEach((r, i) => {
      if (i <= from || i > to) return;
      totals.food += Number(r.food) || 0;
      totals.manual += Number(r.manual) || 0;
      totals.potion += Number(r.potion) || 0;
      totals.serum += Number(r.serum) || 0;
    });
    return totals;
  }
  function currentAtkDef(pet) {
    const levels = PETS_NODES_CACHE[pet];
    const { from } = getState(pet);
    if (from < 0) return 0;
    const v = levels[from].atk_def_pct;
    return v == null ? 0 : Number(v) * 100;
  }
  function maxAtkDef(pet) {
    const levels = PETS_NODES_CACHE[pet];
    for (let i = levels.length - 1; i >= 0; i--) {
      if (levels[i].atk_def_pct != null) return Number(levels[i].atk_def_pct) * 100;
    }
    return 0;
  }

  function renderTotals() {
    const grand = { food: 0, manual: 0, potion: 0, serum: 0 };
    let grandAtk = 0, grandAtkMax = 0;
    petNames.forEach((pet) => {
      if (!isPetUnlocked(pet)) return;
      const n = computeNeeded(pet);
      grand.food += n.food;
      grand.manual += n.manual;
      grand.potion += n.potion;
      grand.serum += n.serum;
      grandAtk += currentAtkDef(pet);
      grandAtkMax += maxAtkDef(pet);
    });
    document.getElementById("petsTotals").innerHTML = `
      <div class="panel">
        <h2>Troops Stats</h2>
        <p class="desc">Summed across all 15 pets, based on current levels.</p>
        <div class="grid g2" style="max-width:460px;">
          <div class="metric">
            <div class="label">Troops Attack</div>
            <div class="val">${grandAtk.toFixed(2)}%</div>
            <div class="meta" style="font-size:11px; margin-top:2px;">of max ${grandAtkMax.toFixed(2)}%</div>
          </div>
          <div class="metric">
            <div class="label">Troops Defense</div>
            <div class="val">${grandAtk.toFixed(2)}%</div>
            <div class="meta" style="font-size:11px; margin-top:2px;">of max ${grandAtkMax.toFixed(2)}%</div>
          </div>
        </div>
      </div>
      <div class="panel">
        <h2>Materials</h2>
        <p class="desc">Needed across all 15 pets, from current levels to max \u2014 enter your owned quantity for each.</p>
        <div id="petsMaterialsBar"></div>
      </div>
    `;
    renderChiefGearResourcesBar(
      "petsMaterialsBar",
      { Food: grand.food, Manual: grand.manual, Potion: grand.potion, Serum: grand.serum },
      ["Food", "Manual", "Potion", "Serum"],
      renderTotals,
      "pets"
    );
  }

  const listEl = document.getElementById("petsList");
  function renderList() {
    listEl.innerHTML = petNames
      .map((pet, idx) => {
        const levels = PETS_NODES_CACHE[pet];
        const { from, to } = getState(pet);
        const needed = computeNeeded(pet);
        const cur = currentAtkDef(pet);
        const max = maxAtkDef(pet);
        const color = PET_TROOP_COLORS_CYCLE[idx % PET_TROOP_COLORS_CYCLE.length];
        const unlocked = isPetUnlocked(pet);
        const levelOpts = (selected) =>
          levels.map((r, i) => `<option value="${i}" ${i === selected ? "selected" : ""}>Lv. ${r.level_label}${i === levels.length - 1 ? " (Max)" : ""}</option>`).join("");
        const fromOpts = `<option value="-1" ${from === -1 ? "selected" : ""}>Not started</option>` + levelOpts(from);

        return `
        <div class="panel" style="${unlocked ? "" : "opacity:0.5;"}">
          <div style="display:flex; gap:16px; flex-wrap:wrap; margin-bottom:14px; align-items:stretch;">
            <div style="flex:0 0 auto; min-width:170px;">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:10px;">
                <input type="checkbox" data-petunlock="${esc(pet)}" ${unlocked ? "checked" : ""} style="width:16px; height:16px; cursor:pointer;" />
                <div class="name" style="font-size:15px; font-weight:700; color:${color};">${esc(pet)}</div>
              </label>
              <div class="metric" style="width:110px; padding:8px 10px;">

async function renderResearchCenterPage() {
  await ensureRCData();
  await ensureResearchSpeedData();

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>Research Center</h2>
        <div class="sub">Set your current level for each research \u2014 totals show what's left to reach max.</div>
      </div>
      <button class="btn" id="rcMaxAllBtn">Max everything</button>
    </div>
    ${researchSpeedInputHtml()}
    <div id="rcTotals" style="margin-bottom:16px;"></div>
    <div id="rcGroups"></div>
  `;
  wireResearchSpeedInput(() => {
    renderTotals();
    renderGroups();
  });

  document.getElementById("rcMaxAllBtn").addEventListener("click", async () => {
    const tracks = Object.keys(RC_NODES_CACHE);
    const allMaxed = tracks.every((track) => (RC_STATE[track] || 0) >= RC_NODES_CACHE[track].length);
    tracks.forEach((track) => {
      RC_STATE[track] = allMaxed ? 0 : RC_NODES_CACHE[track].length;
    });
    await saveCalcState("research_center", RC_STATE);
    renderTotals();
    renderGroups();
  });

  function computeNeeded(trackName) {
    const levels = RC_NODES_CACHE[trackName] || [];
    const cur = RC_STATE[trackName] || 0;
    const totals = { meat: 0, wood: 0, coal: 0, iron: 0, steel: 0, time_hours: 0 };
    levels.forEach((r) => {
      if (r.level <= cur) return;
      totals.meat += Number(r.meat) || 0;
      totals.wood += Number(r.wood) || 0;
      totals.coal += Number(r.coal) || 0;
      totals.iron += Number(r.iron) || 0;
      totals.steel += Number(r.steel) || 0;
      totals.time_hours += Number(r.time_hours) || 0;
    });
    return totals;
  }

  function computeStats(baseNames) {
    const stats = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
    baseNames.forEach((base) => {
      RC_TIERS.forEach((tier) => {
        const trackName = `${base} ${tier}`;
        const levels = RC_NODES_CACHE[trackName] || [];
        const cur = RC_STATE[trackName] || 0;
        levels.forEach((r) => {
          if (r.level > cur || !r.stat) return;
          stats[r.stat] += Number(r.stat_pct) || 0;
        });
      });
    });
    return stats;
  }

  function renderTotals() {
    const allTracks = Object.keys(RC_NODES_CACHE);
    const grand = { meat: 0, wood: 0, coal: 0, iron: 0, steel: 0, time_hours: 0 };
    allTracks.forEach((t) => {
      const n = computeNeeded(t);
      Object.keys(grand).forEach((k) => (grand[k] += n[k]));
    });
    const matTotals = {
      Meat: Math.round(grand.meat),
      Wood: Math.round(grand.wood),
      Coal: Math.round(grand.coal),
      Iron: Math.round(grand.iron),
      Steel: Math.round(grand.steel),
    };
    document.getElementById("rcTotals").innerHTML = `
      <div class="panel">
        <h2>Total resources needed</h2>
        <p class="desc">Across all 102 research tracks, from current levels to max.</p>
        <div id="rcResourcesBar" style="margin-bottom:12px;"></div>
        <div class="metric"><div class="label">Research Time</div><div class="val">${t12FormatTime(applyResearchSpeed(grand.time_hours))}</div></div>
      </div>
    `;
    renderChiefGearResourcesBar("rcResourcesBar", matTotals, Object.keys(matTotals), () => { renderTotals(); renderGroups(); }, "research_center");
  }

  const groupsEl = document.getElementById("rcGroups");
  function renderGroups() {
    groupsEl.innerHTML = Object.entries(RC_BASE_CATEGORIES)
      .map(([groupName, baseNames]) => {
        const stats = computeStats(baseNames);
        return `
      <div class="panel">
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <h2 style="margin:0;">${esc(groupName)}</h2>
          <button class="btn ghost small" data-rcmaxgroup="${esc(groupName)}">Max this section</button>
        </div>
        <div class="grid g4" style="margin:10px 0 14px;">
          <div class="metric"><div class="label">Attack</div><div class="val">+${stats.Attack.toFixed(2)}%</div></div>
          <div class="metric"><div class="label">Defense</div><div class="val">+${stats.Defense.toFixed(2)}%</div></div>
          <div class="metric"><div class="label">Lethality</div><div class="val">+${stats.Lethality.toFixed(2)}%</div></div>
          <div class="metric"><div class="label">Health</div><div class="val">+${stats.Health.toFixed(2)}%</div></div>
        </div>
        ${baseNames
          .map((base) => {
            return `
          <div style="padding:10px 0; border-top:1px solid var(--line);">
            <div class="meta" style="margin-bottom:8px; font-weight:600; color:var(--frost);">${esc(base)}</div>
            <div style="display:grid; grid-template-columns:repeat(6, 1fr); gap:10px;">
              ${RC_TIERS.map((tier) => {
                const trackName = `${base} ${tier}`;
                const levels = RC_NODES_CACHE[trackName];
                if (!levels) return `<div><div class="meta" style="font-size:10.5px; margin-bottom:4px;">${esc(tier)}</div><span class="meta" style="font-size:10.5px;">\u2014</span></div>`;
                const maxLvl = levels.length;
                const cur = RC_STATE[trackName] || 0;
                const opts = Array.from({ length: maxLvl + 1 }, (_, i) => `<option value="${i}" ${i === cur ? "selected" : ""}>${i === 0 ? "0" : i}${i === maxLvl ? " (Max)" : ""}</option>`).join("");
                return `
                <div>
                  <div class="meta" style="font-size:10.5px; margin-bottom:4px;">${esc(tier)}</div>
                  <select data-rctrack="${esc(trackName)}" style="width:100%;">${opts}</select>
                </div>`;
              }).join("")}
            </div>
          </div>`;
          })
          .join("")}
      </div>`;
      })
      .join("");

    groupsEl.querySelectorAll("[data-rcmaxgroup]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const groupName = btn.dataset.rcmaxgroup;
        const baseNames = RC_BASE_CATEGORIES[groupName] || [];
        const groupTracks = [];
        baseNames.forEach((base) => {
          RC_TIERS.forEach((tier) => {
            const trackName = `${base} ${tier}`;
            if (RC_NODES_CACHE[trackName]) groupTracks.push(trackName);
          });
        });
        const allMaxed = groupTracks.every((t) => (RC_STATE[t] || 0) >= RC_NODES_CACHE[t].length);
        groupTracks.forEach((t) => {
          RC_STATE[t] = allMaxed ? 0 : RC_NODES_CACHE[t].length;
        });
        await saveCalcState("research_center", RC_STATE);
        renderTotals();
        renderGroups();
      });
    });

    groupsEl.querySelectorAll("select[data-rctrack]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        RC_STATE[sel.dataset.rctrack] = Number(sel.value);
        await saveCalcState("research_center", RC_STATE);
        renderTotals();
        renderGroups();
      });
    });
  }

  renderTotals();
  renderGroups();
}

async function renderT12ResearchPage() {
  if (!T12_NODES_CACHE) {
    const rows = await sb(`t12_nodes?select=tier,level,steel,refined_fc,fc_shard,meat_wood,coal,iron,time_hours&order=tier,level`);
    T12_NODES_CACHE = {};
    rows.forEach((r) => {
      if (!T12_NODES_CACHE[r.tier]) T12_NODES_CACHE[r.tier] = {};
      T12_NODES_CACHE[r.tier][r.level] = r;
    });
  }
  if (!T12_STATE) {
    const saved = await loadCalcState("t12_research");
    T12_STATE = saved || {};
    T12_TROOPS.forEach((troop) => {
      if (!T12_STATE[troop]) T12_STATE[troop] = {};
      T12_ITEM_DEFS.forEach((def) => {
        if (typeof T12_STATE[troop][def.key] !== "number") T12_STATE[troop][def.key] = 0;
      });
    });

  await ensureResearchPageCountedData();

          <span class="meta" style="font-size:11px;">Count toward Dashboard</span>

  });

  document.getElementById("t12MaxAllBtn").addEventListener("click", async () => {
    const allMaxed = T12_TROOPS.every((troop) => T12_ITEM_DEFS.every((def) => (T12_STATE[troop][def.key] || 0) >= def.max));
    T12_TROOPS.forEach((troop) => {

  }

    const totals = { steel: 0, refined_fc: 0, fc_shard: 0, meat_wood: 0, coal: 0, iron: 0, time_hours: 0 };
    T12_ITEM_DEFS.forEach((def) => {
      const cur = troopState[def.key] || 0;
      const tierRows = T12_NODES_CACHE[def.tier] || {};

        const r = tierRows[lv];

        totals.refined_fc += Number(r.refined_fc) || 0;
        totals.fc_shard += Number(r.fc_shard) || 0;
        totals.meat_wood += Number(r.meat_wood) || 0;
        totals.coal += Number(r.coal) || 0;
        totals.iron += Number(r.iron) || 0;

    const grand = { steel: 0, refined_fc: 0, fc_shard: 0, meat_wood: 0, coal: 0, iron: 0, time_hours: 0 };
    T12_TROOPS.forEach((troop) => {
      const t = computeNeeded(T12_STATE[troop]);
      Object.keys(grand).forEach((k) => (grand[k] += t[k]));
    });
    const matTotals = {
      Steel: Math.round(grand.steel),
      "Refined FC": Math.round(grand.refined_fc),
      "FC Shard": Math.round(grand.fc_shard),
      "Meat/Wood": Math.round(grand.meat_wood),
      Coal: Math.round(grand.coal),
      Iron: Math.round(grand.iron),
    };
    document.getElementById("t12Totals").innerHTML = `
      <div class="panel">
        <h2>Total resources needed</h2>
        <p class="desc">Across all 3 troop types, from current levels to max.</p>
        <div id="t12ResourcesBar" style="margin-bottom:12px;"></div>
        <div class="metric"><div class="label">Research Time</div><div class="val">${t12FormatTime(applyResearchSpeed(grand.time_hours))}</div></div>
      </div>

      const needed = computeNeeded(T12_STATE[troop]);
      const stats = computeT12Stats(T12_STATE[troop]);

      <div class="panel">
        <h2>${esc(troop)}</h2>
        <div class="grid g4" style="margin-bottom:10px;">
          <div class="metric"><div class="label">Attack</div><div class="val">+${stats.Attack}%</div><div class="meta" style="font-size:11px; margin-top:2px;">of max +${statMax.Attack}%</div></div>
          <div class="metric"><div class="label">Defense</div><div class="val">+${stats.Defense}%</div><div class="meta" style="font-size:11px; margin-top:2px;">of max +${statMax.Defense}%</div></div>
          <div class="metric"><div class="label">Lethality</div><div class="val">+${stats.Lethality}%</div><div class="meta" style="font-size:11px; margin-top:2px;">of max +${statMax.Lethality}%</div></div>
          <div class="metric"><div class="label">Health</div><div class="val">+${stats.Health}%</div><div class="meta" style="font-size:11px; margin-top:2px;">of max +${statMax.Health}%</div></div>

        <div class="grid g4" style="margin-bottom:14px;">
          ${t12ResourceCard(T12_RESOURCE_ICONS.steel, "Steel", Math.round(needed.steel).toLocaleString())}
          ${t12ResourceCard(T12_RESOURCE_ICONS.refined_fc, "Refined FC", Math.round(needed.refined_fc).toLocaleString())}
          ${t12ResourceCard(T12_RESOURCE_ICONS.fc_shard, "FC Shard", Math.round(needed.fc_shard).toLocaleString())}
          ${t12ResourceCard(null, "Time", t12FormatTime(applyResearchSpeed(needed.time_hours)))}
        </div>
        ${groups
          .map((group) => {
            const defs = T12_ITEM_DEFS.filter((d) => d.group === group);
            const isSingle = defs.length === 1;
            return `
          <div style="padding:10px 0; border-top:1px solid var(--line);">
            <div class="meta" style="margin-bottom:8px; font-weight:600; color:var(--frost); ${isSingle ? "text-align:center;" : ""}">${esc(group)}</div>
            <div style="display:${isSingle ? "flex" : "grid"}; ${isSingle ? "justify-content:center;" : `grid-template-columns:repeat(${defs.length}, 1fr);`} gap:12px;">
              ${defs

                <div style="${isSingle ? "width:200px; text-align:center;" : ""}">

                  ${levelSelectHtml(def, T12_STATE[troop][def.key] || 0)}

            </div>

          })
          .join("")}
      </div>`;
    }).join("");

    troopsEl.querySelectorAll("select[data-t12item]").forEach((sel, idx) => {

  renderTotals();
  renderTroopPanels();

async function renderFacilityPage() {
  const buildings = await sb(`skins?user_id=eq.${USER_ID}&category=eq.Facility&select=id,name,bonus_type,bonus_value,owned,image_url&order=sort_order.asc`);

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>Facility</h2>
        <div class="sub" id="facilitySummaryLine"></div>
      </div>
    </div>
    <div class="grid g4" id="facilityTotals" style="margin-bottom:16px;"></div>
    <div class="panel">
      <h2>Facility</h2>
      <p class="desc">Click a building to mark it owned/not owned.</p>
      <div class="skin-grid" id="facilityCards"></div>
    </div>
  `;

  function render() {
    const ownedCount = buildings.filter((b) => b.owned).length;
    document.getElementById("facilitySummaryLine").textContent = `${ownedCount} / ${buildings.length} buildings owned`;

    const totalsByType = {};
    const maxByType = {};
    buildings.forEach((b) => {
      if (b.bonus_value == null) return;
      const key = b.bonus_type || "Other";
      maxByType[key] = (maxByType[key] || 0) + Number(b.bonus_value);
      if (b.owned) totalsByType[key] = (totalsByType[key] || 0) + Number(b.bonus_value);
    });
    document.getElementById("facilityTotals").innerHTML = Object.entries(maxByType).length
      ? Object.entries(maxByType)
          .map(
            ([type, maxVal]) =>
              `<div class="metric"><div class="label">Total ${esc(type)}</div><div class="val">+${(totalsByType[type] || 0).toFixed(1)}%</div><div class="meta" style="font-size:11px; margin-top:2px;">of max +${maxVal.toFixed(1)}%</div></div>`
          )
          .join("")
      : `<div class="metric" style="grid-column:1/-1;"><div class="label">Total bonus</div><div class="val">+0%</div></div>`;



    const cardsEl = document.getElementById("facilityCards");
    cardsEl.innerHTML = buildings
      .map(
        (b) => `
      <div class="skin-card ${b.owned ? "owned" : ""}" data-facility="${b.id}">
        <div class="thumb island-thumb">
          ${b.image_url ? `<img src="${esc(b.image_url)}" alt="" loading="lazy" />` : `<div class="ph">${esc(b.name[0])}</div>`}
        </div>
        <div class="info">
          <div class="sname">${esc(b.name)}</div>
          <div class="sbonus">${b.bonus_value != null ? `+${Number(b.bonus_value)}% ${esc(b.bonus_type || "")}` : "Bonus unknown"}</div>
          <div class="sowned">${b.owned ? "\u2713 Owned" : "Not owned"}</div>
        </div>
      </div>`
      )
      .join("");

    cardsEl.querySelectorAll("[data-facility]").forEach((card) => {
      card.addEventListener("click", async (e) => {
        const b = buildings.find((x) => x.id === card.dataset.facility);
        const newOwned = !b.owned;
        try {
          await sb(`skins?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ owned: newOwned }) });
          b.owned = newOwned;
          render();
        } catch (err) {
          toast("Couldn't update building", true);
        }
      });
    });
  }

  render();
}

          <thead><tr>

              .map((h) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${h}</th>`)

                <td style="padding:4px;"><span style="display:inline-flex; gap:4px; align-items:center;"><input data-f="img" value="${esc(r.img || "")}" style="width:160px;" />${uploadBtnHtml()}</span></td>
                <td style="padding:4px;"><input data-f="skill1" value="${esc(r.skill1 || "")}" style="width:110px;" /></td>
                <td style="padding:4px;"><input data-f="skill2" value="${esc(r.skill2 || "")}" style="width:110px;" /></td>
                <td style="padding:4px;"><input data-f="skill3" value="${esc(r.skill3 || "")}" style="width:110px;" /></td>
                <td style="padding:4px;"><input data-f="skill4" value="${esc(r.skill4 || "")}" style="width:110px;" /></td>
                <td style="padding:4px;">
                  <select data-f="main_stat">${STAT_OPTS.map(([v, l]) => `<option value="${v}" ${v === r.main_stat ? "selected" : ""}>${l}</option>`).join("")}</select>
                </td>
                <td style="padding:4px;">
                  <select data-f="main_stat_troop">
                    <option value="" ${!r.main_stat_troop ? "selected" : ""}>All troops</option>
                    <option value="Lancers" ${r.main_stat_troop === "Lancers" ? "selected" : ""}>Lancers only</option>
                    <option value="Infantry" ${r.main_stat_troop === "Infantry" ? "selected" : ""}>Infantry only</option>
                    <option value="Marksman" ${r.main_stat_troop === "Marksman" ? "selected" : ""}>Marksman only</option>
                  </select>
                </td>
                <td style="padding:4px;"><input data-f="sort_order" type="number" value="${r.sort_order}" style="width:56px;" /></td>

                </td>
              </tr>`
              )
              .join("")}

        </table>

    const key = f.key.value.trim();
    if (!key) { errEl.textContent = "Enter a name"; return; }

        method: "POST",
        body: JSON.stringify({
          key,
          img: f.img.value.trim() || null,
          main_stat: f.main_stat.value,
          main_stat_troop: f.main_stat_troop.value || null,
          sort_order: maxOrder + 1,

      errEl.textContent = "Couldn't add expert (name might already exist)";

      const tr = body.querySelector(`tr[data-rosterrow="${id}"]`);

      tr.querySelectorAll("[data-f]").forEach((el) => {
        let v = el.value;
        if (el.dataset.f === "sort_order") v = Number(v) || 0;
        if ((el.dataset.f === "img" || el.dataset.f.startsWith("skill") || el.dataset.f === "main_stat_troop") && v.trim() === "") v = null;
        body_[el.dataset.f] = v;
      });

        await sb(`experts?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(body_) });

        toast("Saved");
      } catch (err) {
        toast("Couldn't save", true);
      }
    });
  });

  body.querySelectorAll("[data-rosterdel]").forEach((btn) => {
    btn.addEventListener("click", async () => {

      try {
        await sb(`experts?id=eq.${btn.dataset.rosterdel}`, { method: "DELETE" });
        EXPERTS_ROSTER_LOADED = false;
        toast("Deleted");
        renderAdminPage();
      } catch (err) {
        toast("Couldn't delete", true);
      }
    });
  });
}
