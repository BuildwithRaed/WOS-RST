              renderRoster();
            });
          });
          modal.style.display = "flex";
        });
      });
      rosterEl.querySelectorAll("select[data-rosterwidget]").forEach((sel) => {
        sel.addEventListener("change", async () => {
          const cur = entryFor(sel.dataset.rosterwidget);
          roster[sel.dataset.rosterwidget] = { heroId: cur.heroId, widget: Number(sel.value) || 0, used: cur.used };
          await save();
          renderRoster();
        });
      });
    };
    renderRoster();
  }

  const sections = document.getElementById("troopSections");
  sections.innerHTML = TROOP_TYPES.map(
    (t) => `
    <div class="troop-head">
      <div class="dot">${t.icon}</div>
      <h3>${esc(t.key)}</h3>
      <div class="count">4 stats tracked</div>
    </div>
    <div class="grid g4">
      ${STATS.map((s) => {
        const { total, sources } = statFor(t.key, s.key);
        const maxTotal = maxStatFor(t.key, s.key);
        const pct = maxTotal > 0 ? Math.min(100, Math.round((total / maxTotal) * 100)) : 0;
        const diff = Math.max(0, maxTotal - total);
        return `<div class="stat-card" data-drilldown="${esc(t.key)}|${esc(s.key)}" style="cursor:pointer; position:relative;">
          ${diff > 0 ? `<div style="position:absolute; top:10px; right:12px; font-size:12px; font-weight:600; color:#e0b030; white-space:nowrap;">+${diff.toFixed(1)}%</div>` : ""}
          <div class="label" style="padding-right:${diff > 0 ? "56px" : "0"};"><span class="stat-key">${esc(s.key)} &middot; </span>${esc(s.label).toUpperCase()}</div>
          <div class="val">${total.toFixed(1)}%</div>
          <div class="stat-bar-track"><div class="stat-bar-fill" style="width:${pct}%"></div></div>
          <div class="metric" style="margin-top:8px; padding:8px 10px;">
            <div class="label" style="font-size:10.5px;">Max possible</div>
            <div class="val" style="font-size:16px;">${maxTotal.toFixed(1)}%</div>
          </div>
          ${sources.length ? `<div class="meta" style="font-size:10.5px; margin-top:4px; color:var(--ice);">Click for full breakdown</div>` : ""}
        </div>`;
      }).join("")}
    </div>
  `
  ).join("");
  statPassMemo = null; // first paint done - recompute fresh from here on

  sections.querySelectorAll("[data-drilldown]").forEach((card) => {
    card.addEventListener("click", () => {
      try {
        const [troop, statKey] = card.dataset.drilldown.split("|");
        const statMeta = STATS.find((s) => s.key === statKey);
        // recompute the full (non-truncated) source lists for this troop+stat,
        // including every live-wired page (Charm/Chief/Hero Gears/Islands/
        // Skins/Facility/Gallery/T11/T12/Research Center/Jero/Natalia/
        // Pets Level/Pets Refine/VIP). Re-runnable so the modal can switch
        // between the 3 Hero Gear sets.
        const computeBreakdown = () => {
          const { total } = statFor(troop, statKey);
          const maxTotal = maxStatFor(troop, statKey);
          const row = rows.find((r) => r.name.toLowerCase() === `${troop} ${statKey}`.toLowerCase());
          const bySourceCur = {};
          const bySourceMax = {};
          if (row) {
            for (const c of row.buff_cells) {
              if (c.value == null) continue;
              const src = colById[c.column_id] || "Other";
              if (!ALLOWED_STAT_CATEGORIES.has(src)) continue;
              bySourceCur[src] = (bySourceCur[src] || 0) + Number(c.value);
              bySourceMax[src] = (bySourceMax[src] || 0) + Number(c.value);
            }
          }
          const { islandsMax, skinsMax } = liveMaxFor(troop, statKey);
          if ("Islands" in bySourceMax || islandsMax) bySourceMax["Islands"] = islandsMax;
          if ("Skins" in bySourceMax || skinsMax) bySourceMax["Skins"] = skinsMax;
          const { islandsCur, skinsCur } = liveCurrentFor(troop, statKey);
          if ("Islands" in bySourceCur || islandsCur) bySourceCur["Islands"] = islandsCur;
          if ("Skins" in bySourceCur || skinsCur) bySourceCur["Skins"] = skinsCur;
          LIVE_CALC_KEYS.forEach((calcKey) => {
            try {
              const vCur = liveCalcValue(calcKey, troop, statKey, false);
              if (vCur != null && (calcKey in bySourceCur || vCur)) bySourceCur[calcKey] = vCur;
              const vMax = liveCalcValue(calcKey, troop, statKey, true);
              if (vMax != null && (calcKey in bySourceMax || vMax)) bySourceMax[calcKey] = vMax;
            } catch (innerErr) {
              console.error("liveCalcValue failed for", calcKey, innerErr);
            }
          });
          const allNames = [...new Set([...Object.keys(bySourceCur), ...Object.keys(bySourceMax)])];
          const combined = sortBySourceOrder(allNames.map((name) => [name, bySourceMax[name] || 0])).map(
            ([name]) => ({ name, cur: bySourceCur[name] || 0, max: bySourceMax[name] || 0 })
          );
          return { total, maxTotal, combined };
        };
        BREAKDOWN_HERO_GEAR_SET = "Set 1";
        const first = computeBreakdown();
        openDrilldownModal(`${troop} ${statMeta.label}`, first.total, first.maxTotal, first.combined, computeBreakdown);
      } catch (err) {
        console.error("Drilldown modal failed to open", err);
      }
    });
  });
}

function openDrilldownModal(title, total, maxTotal, sources, recompute) {
  let modal = document.getElementById("drilldownModal");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "drilldownModal";
    modal.className = "modal-overlay";
    modal.style.display = "none";
    document.body.appendChild(modal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) {
        modal.style.display = "none";
        BREAKDOWN_HERO_GEAR_SET = "Set 1";
      }
    });
  }
  const setTabsHtml = recompute
    ? `<div class="seg" id="drilldownSetTabs" style="margin-top:10px;">
        ${HERO_GEAR_SET_NAMES.map((n) => `<button data-bdset="${esc(n)}" class="${n === BREAKDOWN_HERO_GEAR_SET ? "active" : ""}">${esc(n)}</button>`).join("")}
      </div>
      <p class="meta" style="font-size:10.5px; margin-top:4px;">Switches which Hero Gears loadout is counted \u2014 everything else stays the same.</p>`
    : "";
  modal.innerHTML = `
    <div class="modal-box" style="max-width:480px; max-height:80vh; overflow-y:auto;">
      <h2>${esc(title)}</h2>
      ${setTabsHtml}
      <div class="desc" style="display:flex; flex-wrap:wrap; gap:6px 16px; margin:0 0 16px;">
        <span>Current: <strong style="color:var(--frost); white-space:nowrap;">${total.toFixed(1)}%</strong></span>
        <span>Max possible: <strong style="color:var(--ice); white-space:nowrap;">${maxTotal.toFixed(1)}%</strong></span>
        <span>Difference: <strong style="color:var(--warn, #e0a030); white-space:nowrap;">+${(maxTotal - total).toFixed(1)}%</strong></span>
      </div>
      <div style="display:grid; grid-template-columns:1fr auto auto auto; gap:4px 12px; margin-top:12px; align-items:center;">
        <div class="meta" style="font-size:10.5px;"></div>
        <div class="meta" style="font-size:10.5px; text-align:right;">Current</div>
        <div class="meta" style="font-size:10.5px; text-align:right;">Max</div>
        <div class="meta" style="font-size:10.5px; text-align:right;">Diff</div>
        ${
          sources.length
            ? sources
                .map((s) => {
                  const diff = s.max - s.cur;
                  return `<div class="src-name" style="padding:6px 0; border-bottom:1px solid var(--line); white-space:nowrap; font-size:12.5px;">${esc(displaySourceName(s.name))}</div><div class="src-val" style="padding:6px 0; border-bottom:1px solid var(--line); text-align:right;">+${s.cur.toFixed(1)}%</div><div class="src-val" style="padding:6px 0; border-bottom:1px solid var(--line); text-align:right; color:var(--ice);">+${s.max.toFixed(1)}%</div><div class="src-val" style="padding:6px 0; border-bottom:1px solid var(--line); text-align:right; color:${diff > 0 ? "#e0a030" : "var(--muted)"};">${diff > 0 ? "+" + diff.toFixed(1) + "%" : "\u2014"}</div>`;
                })
                .join("")
            : `<div class="src-name" style="grid-column:1/-1;">No sources yet</div>`
        }
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="drilldownClose">Close</button>
      </div>
    </div>
  `;
  document.getElementById("drilldownClose").addEventListener("click", () => {
    modal.style.display = "none";
    BREAKDOWN_HERO_GEAR_SET = "Set 1";
  });
  if (recompute) {
    modal.querySelectorAll("[data-bdset]").forEach((btn) => {
      btn.addEventListener("click", () => {
        BREAKDOWN_HERO_GEAR_SET = btn.dataset.bdset;
        const next = recompute();
        openDrilldownModal(title, next.total, next.maxTotal, next.combined, recompute);
      });
    });
  }
  modal.style.display = "flex";
}

// HERO GEAR CALCULATOR (under Calculators nav)
// Two tracks per gear piece: Mastery Forging (1-20, Lethality/
// Health stat curve) and a combined Enhance track (0-200) where
// levels 101-200 are the "Red Gear"/Mithril milestones, which
// grant Attack/Defense/Lethality/Health at levels 120/160/200.
// 3 troop types x 4 pieces (Goggles/Gloves/Belt/Boots) = 12 sets,
// each independently tracked in HERO_GEAR_STATE.
// ============================================================
const GEAR_LEVELING_TABLES = ["Hero Gear Mastery Forging", "Enhance Combined"];
const HERO_GEAR_TRACK_LABELS = {
  "Hero Gear Mastery Forging": "Mastery Forging",
  "Enhance Combined": "Enhance (0\u2013200)",
};
const HERO_GEAR_PIECE_NAMES = ["Goggles", "Gloves", "Belt", "Boots"];
const HERO_GEAR_MASTERY_STATS = {
  Goggles: ["Lethality"],
  Boots: ["Lethality"],
  Gloves: ["Health"],
  Belt: ["Health"],
};
const HERO_GEAR_ENHANCE_CONTINUOUS_STATS = {
  Goggles: ["Lethality"],
  Boots: ["Lethality"],
  Gloves: ["Health"],
  Belt: ["Health"],
};
const HERO_GEAR_ENHANCE_MILESTONE_STATS = {
  Goggles: ["Attack"],
  Boots: ["Attack"],
  Gloves: ["Defense"],
  Belt: ["Defense"],
};
const HERO_GEAR_TROOPS = ["Infantry", "Lancer", "Marksman"];
function makeEmptyHeroGearState() {
  const state = {};
  HERO_GEAR_TROOPS.forEach((troop) => {
    state[troop] = {};
    HERO_GEAR_PIECE_NAMES.forEach((piece) => {
      state[troop][piece] = {};
      GEAR_LEVELING_TABLES.forEach((t) => (state[troop][piece][t] = { from: 0, to: null }));
    });
  });
  return state;
}
// Set 1 is the only set that feeds the Dashboard's aggregate stats.
const HERO_GEAR_STATE = makeEmptyHeroGearState();
const HERO_GEAR_STATE_SET2 = makeEmptyHeroGearState();
const HERO_GEAR_STATE_SET3 = makeEmptyHeroGearState();
const HERO_GEAR_SET_NAMES = ["Set 1", "Set 2", "Set 3"];
const HERO_GEAR_SETS = { "Set 1": HERO_GEAR_STATE, "Set 2": HERO_GEAR_STATE_SET2, "Set 3": HERO_GEAR_STATE_SET3 };
const HERO_GEAR_STORAGE_KEYS = { "Set 1": "hero_gear", "Set 2": "hero_gear_set2", "Set 3": "hero_gear_set3" };
let heroGearActiveSet = "Set 1";
let heroGearActiveTroop = "Infantry";
// Which hero gear set the Dashboard breakdown modal is currently showing.
let BREAKDOWN_HERO_GEAR_SET = "Set 1";
let HERO_GEAR_TABLES_CACHE = null;

// Renders the Quick Select + per-piece calculator + totals + stats.
// Loads + caches Hero Gear progression tables and any saved selections.
// Safe to call from anywhere (Hero Gear Calc page or the Dashboard) since
// it's a no-op once HERO_GEAR_TABLES_CACHE is populated.
async function ensureHeroGearData() {
  if (HERO_GEAR_TABLES_CACHE) return;
  const results = await Promise.all(
    ["Hero Gear Mastery Forging", "Hero Gear Enhancement", "Hero Gear Empowerment"].map(async (name) => {
      const [table] = await sb(`progression_tables?name=eq.${encodeURIComponent(name)}&user_id=eq.${PROGRESSION_OWNER_ID}&select=id`);
      if (!table) return { name, rows: [] };
      const rows = await sb(`progression_rows?table_id=eq.${table.id}&select=id,level,stage,materials,stat,stat2,power,display_label,mithril,mythic_gear,xp_component,essence_stones&order=sort_order.asc`);
      return { name, rows };
    })
  );
  const rawCache = Object.fromEntries(results.map((r) => [r.name, r.rows]));
  const enhanceRows = (rawCache["Hero Gear Enhancement"] || []).map((r) => ({ ...r, level: r.level }));
  const empowerRows = (rawCache["Hero Gear Empowerment"] || []).map((r) => ({ ...r, level: r.level + 100 }));
  rawCache["Enhance Combined"] = [...enhanceRows, ...empowerRows];
  HERO_GEAR_TABLES_CACHE = rawCache;

  for (const setName of HERO_GEAR_SET_NAMES) {
    const state = HERO_GEAR_SETS[setName];
    HERO_GEAR_TROOPS.forEach((troop) => {
      HERO_GEAR_PIECE_NAMES.forEach((piece) => {
        GEAR_LEVELING_TABLES.forEach((t) => {
          const st = state[troop][piece][t];
          if (st.to === null) st.to = Math.max(0, HERO_GEAR_TABLES_CACHE[t].length - 1);
        });
      });
    });

    const saved = await loadCalcState(HERO_GEAR_STORAGE_KEYS[setName]);
    if (saved) {
      HERO_GEAR_TROOPS.forEach((troop) => {
        HERO_GEAR_PIECE_NAMES.forEach((piece) => {
          GEAR_LEVELING_TABLES.forEach((t) => {
            const savedVal = saved?.[troop]?.[piece]?.[t]?.from;
            if (typeof savedVal === "number") state[troop][piece][t].from = savedVal;
          });
        });
      });
    }
  }
}


// Renders the Quick Select + per-piece calculator + totals + stats.

  target.innerHTML = `

      <div style="display:flex; gap:8px; margin-bottom:4px;">
        ${HERO_GEAR_SET_NAMES.map(

        ).join("")}
      </div>
    </div>
    <div class="panel">
      <h2>Backpack</h2>
      <div id="heroGearOwned"></div>
    </div>
    <div class="panel">
      <h2>Heroes Gears calculator</h2>
      <div id="heroGearTroopDots" style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px;"></div>
      <div id="heroGearTracks"></div>
    </div>
    <div class="panel">
      <h2>Troops Stats</h2>
      <p class="desc">Mastery Forging &amp; Enhance boost Lethality/Health; Mithril milestones boost Attack/Defense.</p>

  target.querySelectorAll("[data-herogearset]").forEach((btn) => {

    });
  });

  const activeState = HERO_GEAR_SETS[heroGearActiveSet];
  const activeStorageKey = HERO_GEAR_STORAGE_KEYS[heroGearActiveSet];

  const optsByTrack = {};
  GEAR_LEVELING_TABLES.forEach((t) => {
    optsByTrack[t] = HERO_GEAR_TABLES_CACHE[t].map((r, i) => `<option value="${i}">${esc(rowLabel(r))}</option>`).join("");
  });

  const tracksEl = document.getElementById("heroGearTracks");
  const HERO_GEAR_ICONS = {
    Goggles: "https://wostools.net/images/hero-gear/goggles.webp",
    Gloves: "https://wostools.net/images/hero-gear/gloves.webp",
    Belt: "https://wostools.net/images/hero-gear/belt.webp",
    Boots: "https://wostools.net/images/hero-gear/boots.webp",
  };
  const pieceCard = (troop, piece) => `
    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <div style="width:60px;"></div>
        <div style="text-align:center;">
          <img src="${HERO_GEAR_ICONS[piece]}" alt="${esc(piece)}" style="width:56px; height:56px; object-fit:contain; margin-bottom:6px;" loading="lazy" />
          <div class="name" style="font-size:15px; font-weight:700;">${esc(piece)}</div>
        </div>
        <button class="btn ghost small" data-heropiecemax="${esc(troop)}|${esc(piece)}" style="width:60px;">Max</button>
      </div>
      <div style="border-top:1px solid var(--line); padding-top:10px;">
        ${GEAR_LEVELING_TABLES.map(
          (t) => `
        <div style="padding:6px 0;">
          <div class="meta" style="font-size:12px; margin-bottom:4px;">${esc(HERO_GEAR_TRACK_LABELS[t])}</div>
          <div style="display:flex; gap:6px;">
            <select data-troop="${esc(troop)}" data-piece="${esc(piece)}" data-track="${esc(t)}" data-role="from" style="flex:1;">${optsByTrack[t]}</select>
            <select data-troop="${esc(troop)}" data-piece="${esc(piece)}" data-track="${esc(t)}" data-role="to" style="flex:1;">${optsByTrack[t]}</select>
          </div>
        </div>`
        ).join("")}
      </div>
    </div>`;

  const HERO_GEAR_TROOP_COLORS = { Infantry: "#7ee6a8", Lancer: "var(--ice)", Marksman: "#f0a3c4" };
  const heroGearDotsEl = document.getElementById("heroGearTroopDots");
  function renderTracks() {
    renderSwipeDots(heroGearDotsEl, HERO_GEAR_TROOPS, heroGearActiveTroop, HERO_GEAR_TROOP_COLORS);
    const troop = heroGearActiveTroop;
    tracksEl.innerHTML = `
    <div>
      <div class="name" style="font-size:14px; margin-bottom:10px; color:${HERO_GEAR_TROOP_COLORS[troop]};">${esc(troop)}</div>
      <div class="grid" style="grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:16px;">
        ${HERO_GEAR_PIECE_NAMES.map((piece) => pieceCard(troop, piece)).join("")}
      </div>
    </div>`;
    wireTroopSwipe(tracksEl, HERO_GEAR_TROOPS, heroGearActiveTroop, (t) => { heroGearActiveTroop = t; renderTracks(); });

    tracksEl.querySelectorAll("[data-heropiecemax]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const [troop, piece] = btn.dataset.heropiecemax.split("|");
        const maxIdxByTrack = {};
        GEAR_LEVELING_TABLES.forEach((t) => {
          maxIdxByTrack[t] = Math.max(0, (HERO_GEAR_TABLES_CACHE[t] || []).length - 1);
        });
        const bothMaxed = GEAR_LEVELING_TABLES.every((t) => {
          const st = activeState[troop][piece][t];
          return st.from >= maxIdxByTrack[t] && st.to >= maxIdxByTrack[t];
        });
        const currentZeroTargetMaxed = GEAR_LEVELING_TABLES.every((t) => {
          const st = activeState[troop][piece][t];
          return st.from <= 0 && st.to >= maxIdxByTrack[t];
        });
        const bothZero = GEAR_LEVELING_TABLES.every((t) => {
          const st = activeState[troop][piece][t];
          return st.from <= 0 && st.to <= 0;
        });
        // Cycle: (0,0) -> (max,max) -> (0,max) -> (0,0) -> ...
        let mode;
        if (bothZero) mode = "max";
        else if (bothMaxed) mode = "half";
        else if (currentZeroTargetMaxed) mode = "zero";
        else mode = "max";
        GEAR_LEVELING_TABLES.forEach((t) => {
          const st = activeState[troop][piece][t];
          if (mode === "max") {
            st.from = maxIdxByTrack[t];
            st.to = maxIdxByTrack[t];
          } else if (mode === "half") {
            st.from = 0;
            st.to = maxIdxByTrack[t];
          } else {
            st.from = 0;
            st.to = 0;
          }
        });
        saveCalcState(activeStorageKey, activeState);
        renderGearLevelingGroup(target);
      });
    });

    tracksEl.querySelectorAll("select[data-troop]").forEach((sel) => {
      const { troop, piece, track, role } = sel.dataset;
      sel.value = String(activeState[troop][piece][track][role]);
      sel.addEventListener("change", () => {
        activeState[troop][piece][track][role] = Number(sel.value);
        saveCalcState(activeStorageKey, activeState);
        updateHeroGearTotals();
      });
    });
  }
  renderTracks();

  updateHeroGearTotals();
}

// Sums materials (XP/Mithril/Mythic Gear/Essence Stones) needed
// across all 12 gear-piece/track selections into one totals grid.
// Shared "how much do I own" bar shown above a calculator's materials
// totals. calcKey scopes persistence per calculator (charm/chief_gear/
// hero_gear) since the same material name could mean different things
// in different contexts. Returns the rendered HTML string; also wires
// up the input change handlers once inserted into the DOM.
const MATERIAL_OWNED_CACHE = {};
async function ensureMaterialOwnedCache(calcKey) {
  if (!MATERIAL_OWNED_CACHE[calcKey]) {
    MATERIAL_OWNED_CACHE[calcKey] = (await loadCalcState(`material_owned_${calcKey}`)) || {};
  }
  return MATERIAL_OWNED_CACHE[calcKey];
}
async function renderMaterialsOwnedBar(containerId, matTotals, calcKey, allMaterialNames, refreshFn) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const names = allMaterialNames && allMaterialNames.length ? allMaterialNames : Object.keys(matTotals);
  if (!names.length) {
    el.innerHTML = "";
    return;
  }
  const matEntries = names.map((name) => [name, matTotals[name] || 0]);
  const owned = await ensureMaterialOwnedCache(calcKey);

  const cardHtml = matEntries
    .map(([name, needed]) => {
      const lower = name.toLowerCase();
      const iconKey = Object.keys(MATERIAL_ICONS).find((k) => lower.includes(k));
      const icon = iconKey
        ? `<img src="${MATERIAL_ICONS[iconKey]}" alt="" style="width:40px; height:40px; object-fit:contain; flex-shrink:0;" loading="lazy" />`
        : "";
      const haveQty = owned[name] || 0;
      const stillNeed = Math.max(0, needed - haveQty);
      const surplus = Math.max(0, haveQty - needed);
      const statusColor = needed === 0 ? "var(--muted)" : stillNeed > 0 ? "var(--danger)" : "var(--good)";
      const statusText =
        needed === 0
          ? "Not needed yet"
          : stillNeed > 0
          ? `${stillNeed.toLocaleString()} still needed`
          : surplus > 0
          ? `\u2713 ${surplus.toLocaleString()} extra`
          : "\u2713 Have enough";
      return `<div class="metric">
        <div style="display:flex; align-items:center; gap:10px;">
          ${icon}
          <div class="label" style="text-align:left;">${esc(name)}</div>
        </div>
        <div class="meta" style="font-size:10.5px; margin-top:8px;">Needed: ${needed.toLocaleString()}</div>
        <div style="display:flex; align-items:center; gap:4px; justify-content:center; margin-top:4px;">
          <span class="meta" style="font-size:10.5px;">Own:</span>
          <input type="text" inputmode="numeric" data-ownedmat="${esc(name)}" value="${haveQty}" style="width:110px; padding:6px 8px; font-size:14px;" />
        </div>
        <div class="val" style="font-size:13px; margin-top:4px; color:${statusColor};">${statusText}</div>
      </div>`;
    })
    .join("");

  el.innerHTML = `<div class="grid" style="grid-template-columns:repeat(${Math.min(matEntries.length, 6)}, 1fr);">${cardHtml}</div>`;

  el.querySelectorAll("[data-ownedmat]").forEach((input) => {
    input.addEventListener("change", async () => {
      let val = Number(input.value);
      if (Number.isNaN(val) || val < 0) val = 0;
      input.value = val;
      owned[input.dataset.ownedmat] = val;
      await saveCalcState(`material_owned_${calcKey}`, owned);
      if (refreshFn) refreshFn();
    });
  });
}

async function updateHeroGearTotals() {
  if (!HERO_GEAR_TABLES_CACHE) return;
  const HERO_GEAR_MATERIAL_COLS = [
    ["mithril", "Mithril"],
    ["mythic_gear", "Mythic Gear"],
    ["xp_component", "XP Component"],
    ["essence_stones", "Essence Stones"],
  ];

  // One real inventory covers all 3 loadouts (owned amounts are shared
  // under a single key), while needed / still-needed reflects only the
  // set currently selected on the page.
  const matTotals = {};
  const setState = HERO_GEAR_SETS[heroGearActiveSet];
  HERO_GEAR_TROOPS.forEach((troop) => {
    HERO_GEAR_PIECE_NAMES.forEach((piece) => {
      GEAR_LEVELING_TABLES.forEach((t) => {
        const rows = HERO_GEAR_TABLES_CACHE[t];
        if (!rows.length) return;
        const st = setState[troop][piece][t];
        const fromIdx = Math.min(st.from, st.to);
        const toIdx = Math.max(st.from, st.to);
        for (let i = fromIdx + 1; i <= toIdx; i++) {
          HERO_GEAR_MATERIAL_COLS.forEach(([col, label]) => {
            const v = Number(rows[i][col]) || 0;
            if (v) matTotals[label] = (matTotals[label] || 0) + v;
          });
        }
      });
    });
  });

  renderChiefGearResourcesBar("heroGearOwned", matTotals, ["XP Component", "Essence Stones", "Mithril", "Mythic Gear"], updateHeroGearTotals, "hero_gear");

  updateHeroGearCurrentStats();
}

// Computes current Attack/Defense/Lethality/Health bonus per troop
// type: Mastery Forging contributes Lethality+Health only; Mithril
// milestones crossed on the Enhance track contribute all 4 stats.
// Pure computation, reusable by both this page and the Stats dashboard.
// stateObj must have the same shape as HERO_GEAR_STATE.
function computeHeroGearStats(stateObj) {
  if (!HERO_GEAR_TABLES_CACHE) return {};
  const mfRows = HERO_GEAR_TABLES_CACHE["Hero Gear Mastery Forging"];
  const enhRows = HERO_GEAR_TABLES_CACHE["Enhance Combined"];
  if (!mfRows || !mfRows.length) return {};

  const out = {};
  HERO_GEAR_TROOPS.forEach((troop) => {
    const statTotals = { Attack: 0, Defense: 0, Health: 0, Lethality: 0 };
    const continuousMax = { Health: 0, Lethality: 0 };
    HERO_GEAR_PIECE_NAMES.forEach((piece) => {
      const mfIdx = stateObj[troop][piece]["Hero Gear Mastery Forging"].from;
      const mfStat = parseStatPct(mfRows[mfIdx]?.stat) || 0;
      HERO_GEAR_MASTERY_STATS[piece].forEach((stat) => {
        statTotals[stat] += mfStat;
      });
      if (enhRows && enhRows.length) {
        const enhIdx = stateObj[troop][piece]["Enhance Combined"].from;
        const continuousStat = parseStatPct(enhRows[enhIdx]?.stat) || 0;
        HERO_GEAR_ENHANCE_CONTINUOUS_STATS[piece].forEach((stat) => {
          continuousMax[stat] += continuousStat;
        });
        let milestoneStat = 0;
        for (let i = 0; i <= enhIdx; i++) {
          const v = parseStatPct(enhRows[i].stat2);
          if (v != null) milestoneStat += v;
        }
        HERO_GEAR_ENHANCE_MILESTONE_STATS[piece].forEach((stat) => {
          statTotals[stat] += milestoneStat;
        });
      }
    });
    statTotals.Health += continuousMax.Health;
    statTotals.Lethality += continuousMax.Lethality;
    out[troop] = statTotals;
  });
  return out;
}

// Builds a synthetic "everything at max level" state, same shape as
// HERO_GEAR_STATE, for computing the Max Possible ceiling.
function maxedHeroGearState() {
  const out = {};
  HERO_GEAR_TROOPS.forEach((troop) => {
    out[troop] = {};
    HERO_GEAR_PIECE_NAMES.forEach((piece) => {
      out[troop][piece] = {};
      GEAR_LEVELING_TABLES.forEach((t) => {
        out[troop][piece][t] = { from: Math.max(0, (HERO_GEAR_TABLES_CACHE[t] || []).length - 1) };
      });
    });
  });
  return out;
}

function updateHeroGearCurrentStats() {
  const el = document.getElementById("heroGearCurrentStats");
  if (!el || !HERO_GEAR_TABLES_CACHE) return;
  const statsByTroop = computeHeroGearStats(HERO_GEAR_SETS[heroGearActiveSet]);

  const HG_STAT_ABBR = { Attack: "ATK", Defense: "DEF", Lethality: "LETH", Health: "HP" };
  el.innerHTML = results

// ============================================================
// GENERIC BUFF CATEGORY SYSTEM
// A single shared "master" matrix table (buff_tables/columns/rows/
// cells) backs every dynamic nav category (Facility, Research,
// Chief, Charm, Pets, VIP Tier, War Acd., etc). Each category is a
// column; each row is a named stat line (e.g. "Infantry ATT").
// Categories can be grouped into sub-nav (see CATEGORY_GROUPS) or
// nested under Heroes/Extra Buff.
// ============================================================
// Fetches (or lazily creates) the one shared buff matrix table.
let BUFF_TABLE_PROMISE = null;
function ensureBuffTable() {
  if (BUFF_TABLE_ID) return Promise.resolve(BUFF_TABLE_ID);
  // Callers running at the same time share one lookup (and can never both
  // create a table).
  if (!BUFF_TABLE_PROMISE) {
    BUFF_TABLE_PROMISE = ensureBuffTableOnce().catch((e) => { BUFF_TABLE_PROMISE = null; throw e; });
  }
  return BUFF_TABLE_PROMISE;
}
async function ensureBuffTableOnce() {
  if (BUFF_TABLE_ID) return BUFF_TABLE_ID;
  const existing = await sb(`buff_tables?select=id&user_id=eq.${USER_ID}&order=created_at.asc&limit=1`);
  if (existing && existing.length) {
    BUFF_TABLE_ID = existing[0].id;
  } else {
    const [created] = await sb(`buff_tables`, {
      method: "POST",
      body: JSON.stringify({ user_id: USER_ID, name: "Buffs", sort_order: 0 }),
    });
    BUFF_TABLE_ID = created.id;
  }
  return BUFF_TABLE_ID;
}

// Rebuilds the sidebar's dynamic category buttons from the buff
// matrix's columns, excluding any pulled into Heroes/Extra Buff/
// grouped sub-nav so they don't appear twice.
async function loadBuffCategories() {
  await ensureBuffTable();
  const columns = await sb(`buff_columns?table_id=eq.${BUFF_TABLE_ID}&select=id,name,category&order=sort_order.asc`);
  const grouped = [];
  const seen = new Map();
  for (const c of columns) {
    const key = c.category || c.name;
    if (!seen.has(key)) {
      seen.set(key, { name: key, columns: [] });
      grouped.push(seen.get(key));
    }
    seen.get(key).columns.push(c);
  }
  BUFF_CATEGORIES = grouped;

  const HERO_SUBCATS = new Set(["Jero", "Natalia", "Hero Gears"]);
  const GROUPED_CHILDREN = new Set(Object.values(CATEGORY_GROUPS).flat());
  const EXTRA_BUFF_SET = new Set(EXTRA_BUFF_SUBCATS);
  const HIDDEN_BUFF_CATS = new Set(["Chief Bonus", "Charm", "Chief", "Extra Buff", "Buff", "Skins", "Islands", "War Acd.", "Research", "Pets", "Expert", "Exp. Research"]);
  const holder = document.getElementById("dynamicTabs");
  if (holder) {
    holder.innerHTML = BUFF_CATEGORIES.filter(
      (c) => !HERO_SUBCATS.has(c.name) && !GROUPED_CHILDREN.has(c.name) && !EXTRA_BUFF_SET.has(c.name) && !HIDDEN_BUFF_CATS.has(c.name)
    )
      .map((c) => `<button data-tab="buffcat:${esc(c.name)}"><span class="ic">&#9670;</span>${esc(EXTRA_BUFF_LABELS[c.name] || c.name)}</button>`)
      .join("");
  }
  document.querySelectorAll("#tabs button[data-tab]").forEach((b) => {
    b.classList.toggle("active", b.dataset.tab === TAB);
  });
}

// Top-level wrapper for a single buff category page.
async function renderCategoryPage(categoryName) {
  await renderCategoryInto(content, categoryName, renderCategoryPage);
}

// Renders one category's row list (name + value) into any target
// element, with inline add/update controls. Reused by top-level
// category pages, Heroes sub-nav, and grouped sub-nav pages.
async function renderCategoryInto(target, categoryName, rerenderFn) {
  await ensureBuffTable();
  const cat = BUFF_CATEGORIES.find((c) => c.name === categoryName);
  if (!cat) {
    target.innerHTML = `<div class="empty">Category not found.</div>`;
    return;
  }
  const refresh = rerenderFn || ((name) => renderCategoryInto(target, name, rerenderFn));
  const rows = await sb(`buff_rows?table_id=eq.${BUFF_TABLE_ID}&select=id,name,sort_order,buff_cells(value,column_id)&order=sort_order.asc`);

  target.innerHTML = `
    <div class="panel">
      <h2>${esc(categoryName)}</h2>
      <p class="desc">Values tracked for this category.</p>
      <div id="catRows-${esc(categoryName)}"></div>
      <form class="inline" id="addRowForm-${esc(categoryName)}" style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">
        <input class="flex1" name="rowName" placeholder="Add a stat line, e.g. Infantry ATT" />
        <input class="field-num" name="rowValue" type="number" step="any" placeholder="Value" />
        <button class="btn small" type="submit">Add</button>
      </form>
      <div class="err" id="addRowErr-${esc(categoryName)}"></div>
    </div>
  `;

  const rowsEl = target.querySelector(`#catRows-${CSS.escape(categoryName)}`);
  const colIds = cat.columns.map((c) => c.id);
  const rowsHtml = rows
    .map((r) => {
      const cellsByCol = Object.fromEntries(r.buff_cells.map((c) => [c.column_id, c.value]));
      const v = colIds.map((id) => cellsByCol[id]).find((x) => x != null);
      return `<div class="row">
        <div class="name">${esc(r.name)}</div>
        <div style="display:flex; align-items:center; gap:10px;">
          <div class="meta mono">${v != null ? Number(v).toLocaleString() : "\u2014"}</div>
          <button class="btn small ghost" data-row="${r.id}" data-val="${v ?? ""}">Update</button>
        </div>
      </div>`;
    })
    .join("");
  rowsEl.innerHTML = rowsHtml || `<div class="empty"><div class="big">No stat lines yet.</div>Add one below.</div>`;

  rowsEl.querySelectorAll("button[data-row]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const val = prompt("Value:", btn.dataset.val);
      if (val === null) return;
      const num = Number(val);
      if (Number.isNaN(num)) { toast("Enter a valid number", true); return; }
      try {
        await sb(`buff_cells`, {
          method: "POST",
          headers: { Prefer: "resolution=merge-duplicates,return=representation" },
          body: JSON.stringify({ row_id: btn.dataset.row, column_id: cat.columns[0].id, value: num }),
        });
        toast("Updated");
        refresh(categoryName);
      } catch (err) {
        toast("Couldn't update value", true);
      }
    });
  });

  target.querySelector(`#addRowForm-${CSS.escape(categoryName)}`).addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = target.querySelector(`#addRowErr-${CSS.escape(categoryName)}`);
    errEl.textContent = "";
    const name = f.rowName.value.trim();
    if (!name) { errEl.textContent = "Enter a stat line name first"; return; }
    const valueRaw = f.rowValue.value.trim();
    try {
      const [rowRow] = await sb(`buff_rows`, {
        method: "POST",
        body: JSON.stringify({ table_id: BUFF_TABLE_ID, name, sort_order: rows.length }),
      });
      if (valueRaw !== "") {
        await sb(`buff_cells`, {
          method: "POST",
          body: JSON.stringify({ row_id: rowRow.id, column_id: cat.columns[0].id, value: Number(valueRaw) }),
        });
      }
      toast("Stat line added");
      refresh(categoryName);
    } catch (err) {
      errEl.textContent = "Couldn't add stat line \u2014 name may already exist";
    }
  });
}

// Generic "parent category with sub-tab children" page, e.g.
// War Acd. -> T11/T12. Driven by CATEGORY_GROUPS.
async function renderGroupPage(parentName) {
  const children = CATEGORY_GROUPS[parentName];
  const subtabs = [parentName, ...children];
  const current = GROUP_SUBTAB[parentName] || parentName;

  content.innerHTML = `
    <div style="display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;">
      ${subtabs
        .map(
          (s) =>
            `<button class="btn small ${current === s ? "" : "ghost"}" data-groupsub="${esc(s)}" style="${current === s ? "background:var(--ice-dim); border-color:var(--ice-dim);" : ""}">${esc(s)}</button>`
        )
        .join("")}
    </div>
    <div id="groupSubContent"></div>
  `;
  content.querySelectorAll("[data-groupsub]").forEach((btn) => {
    btn.addEventListener("click", () => {
      GROUP_SUBTAB[parentName] = btn.dataset.groupsub;
      renderGroupPage(parentName);
    });
  });

  await ensureBuffTable();
  if (!BUFF_CATEGORIES.some((c) => c.name === current)) {
    await loadBuffCategories();
  }
  const sub = document.getElementById("groupSubContent");
  await renderCategoryInto(sub, current, () => renderGroupPage(parentName));
}

// Renders a comma-separated materials string with inline icons.
function renderMaterialsWithIcons(materials) {
  if (!materials) return "\u2014";
  return materials
    .split(",")
    .map((part) => {
      const trimmed = part.trim();
      const lower = trimmed.toLowerCase();
      const iconKey = Object.keys(MATERIAL_ICONS).find((k) => lower.includes(k));
      const icon = iconKey
        ? `<img src="${MATERIAL_ICONS[iconKey]}" alt="" style="width:15px; height:15px; object-fit:contain; vertical-align:-3px; margin-right:3px;" loading="lazy" />`
        : "";
      return `<span style="display:inline-flex; align-items:center; margin-right:8px;">${icon}${esc(trimmed)}</span>`;
    })
    .join("");
}

// Builds a human-readable label for a progression row, e.g.
// "Legendary T5 \u26053.2" or "Lv.42" (drops a lone ".0" stage suffix).
const CHIEF_GEAR_TIER_SHORT = {
  Common: "Green",
  Rare: "Blue",
  Epic: "Purple",
  "Epic T1": "Purple T1",
  Mythic: "Gold",
  "Mythic T1": "Gold T1",
  "Mythic T2": "Gold T2",
  Legendary: "Red",
  "Legendary T1": "Red T1",
  "Legendary T2": "Red T2",
  "Legendary T3": "Red T3",
  "Legendary T4": "Red T4",
  "Legendary T5": "Red T5",
  "Legendary T6": "Red T6",
};
function rowLabel(r) {
  if (r.display_label) return r.display_label;
  if (r.tier) return `${r.tier}${r.stars != null ? " \u2605" + r.stars : ""}${r.stage != null && r.stage !== "0" ? "." + r.stage : ""}`;
  return `Lv.${r.level}${r.stage && r.stage !== "0" ? "." + r.stage : ""}`;
}
function chiefGearRowLabel(r) {
  if (r.display_label) return r.display_label;
  if (r.tier) return `${CHIEF_GEAR_TIER_SHORT[r.tier] || r.tier}${r.stars != null ? " \u2605" + r.stars : ""}${r.stage != null && r.stage !== "0" ? "." + r.stage : ""}`;
  return rowLabel(r);
}
// Parses "1500 Hardened Alloy, 15 Polishing Solution" into
// [{qty, name}, ...] for totals aggregation.
function parseMaterials(materials) {
  if (!materials) return [];
  return materials
    .split(",")
    .map((part) => {
      const m = part.trim().match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
      return m ? { qty: Number(m[1]), name: m[2].trim() } : null;
    })
    .filter(Boolean);
}
// Extracts the numeric percentage from a stat string like "+9.35%".
function parseStatPct(stat) {
  if (!stat) return null;
  const m = String(stat).match(/-?\d+(\.\d+)?/);
  return m ? Number(m[0]) : null;
}

// Renders a progression table with an optional current\u2192target
// "upgrade calculator" (materials/stat/power gained for the range)
// plus the full reference table below it.
async function renderProgressionInto(target, tableName) {
  let [table] = await sb(`progression_tables?name=eq.${encodeURIComponent(tableName)}&user_id=eq.${PROGRESSION_OWNER_ID}&select=id,name`);
  if (!table) {
    const [created] = await sb(`progression_tables`, {
      method: "POST",
      body: JSON.stringify({ user_id: PROGRESSION_OWNER_ID, name: tableName, sort_order: 0 }),
    });
    table = created;
  }
  const rows = await sb(`progression_rows?table_id=eq.${table.id}&select=id,level,tier,stars,stage,materials,stat,power&order=sort_order.asc`);
  const hasTier = rows.some((r) => r.tier);
  const canCalc = rows.length > 1;

  target.innerHTML = `
    ${
      canCalc
        ? `<div class="panel">
      <h2>Upgrade calculator</h2>
      <p class="desc">Pick your current and target step to see materials, stat gain, and power gain between them.</p>
      <div class="row" style="align-items:center;">
        <div class="meta">From</div>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="calcFrom" style="width:160px;"></select>
          <span class="meta">to</span>
          <select id="calcTo" style="width:160px;"></select>
        </div>
      </div>
      <div id="calcResult" style="margin-top:12px;"></div>
    </div>`
        : ""
    }
    <div class="panel">
      <h2>${esc(tableName)}</h2>
      <p class="desc">${hasTier ? "Tier, stars, materials, stat bonus, and power total." : "Level, materials needed, and power gained per level."}</p>
      <div class="matrix-wrap">
        <table class="matrix">
          <thead><tr>${hasTier ? "<th>Tier</th><th>Stars</th><th>Stage</th>" : "<th>Level</th>"}<th>Materials</th>${hasTier ? "<th>Stat</th>" : ""}<th>Power</th><th></th></tr></thead>
          <tbody id="progRows"></tbody>
        </table>
      </div>
      ${
        !hasTier
          ? `<form class="inline" id="progAddForm" style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">
        <input class="field-num" name="level" type="number" placeholder="Level" required style="width:80px;" />
        <input class="flex1" name="materials" placeholder="Materials, e.g. 100 XP Component" />
        <input class="field-num" name="power" type="number" step="any" placeholder="Power" style="width:120px;" />
        <button class="btn small" type="submit">Add row</button>
      </form>
      <div class="err" id="progErr"></div>`
          : ""
      }
    </div>
  `;

  if (canCalc) {
    const fromSel = target.querySelector("#calcFrom");
    const toSel = target.querySelector("#calcTo");
    const opts = rows.map((r, i) => `<option value="${i}">${esc(rowLabel(r))}</option>`).join("");
    fromSel.innerHTML = opts;
    toSel.innerHTML = opts;
    toSel.value = String(rows.length - 1);

    function updateCalc() {
      let fromIdx = Number(fromSel.value);
      let toIdx = Number(toSel.value);
      if (toIdx < fromIdx) { toIdx = fromIdx; toSel.value = String(fromIdx); }
      const resultEl = target.querySelector("#calcResult");
      const matTotals = {};
      for (let i = fromIdx + 1; i <= toIdx; i++) {
        for (const m of parseMaterials(rows[i].materials)) {
          matTotals[m.name] = (matTotals[m.name] || 0) + m.qty;
        }
      }
      const statFrom = parseStatPct(rows[fromIdx].stat);
      const statTo = parseStatPct(rows[toIdx].stat);
      const powerFrom = rows[fromIdx].power != null ? Number(rows[fromIdx].power) : null;
      const powerTo = rows[toIdx].power != null ? Number(rows[toIdx].power) : null;

      const matHtml = Object.entries(matTotals)
        .map(([name, qty]) => {
          const lower = name.toLowerCase();
          const iconKey = Object.keys(MATERIAL_ICONS).find((k) => lower.includes(k));
          const icon = iconKey ? `<img src="${MATERIAL_ICONS[iconKey]}" alt="" style="width:16px; height:16px; object-fit:contain; vertical-align:-3px; margin-right:4px;" loading="lazy" />` : "";
          return `<div class="row"><div class="name">${icon}${esc(name)}</div><div class="meta mono">${qty.toLocaleString()}</div></div>`;
        })
        .join("");

      resultEl.innerHTML = `
        <div class="grid g2" style="margin-bottom:10px;">
          ${statTo != null ? `<div class="metric"><div class="label">Stat gain</div><div class="val">+${(statTo - (statFrom || 0)).toFixed(2)}%</div></div>` : ""}
          ${powerTo != null ? `<div class="metric"><div class="label">Power gain</div><div class="val">${(powerTo - (powerFrom || 0)).toLocaleString()}</div></div>` : ""}
        </div>
        ${matHtml || `<div class="empty" style="padding:10px 0;">No materials needed for this range.</div>`}
      `;
    }
    fromSel.addEventListener("change", updateCalc);
    toSel.addEventListener("change", updateCalc);
    updateCalc();
  }

  const tbody = target.querySelector("#progRows");
  tbody.innerHTML = rows.length
    ? rows
        .map((r) =>
          hasTier
            ? `<tr>
                <td style="text-align:left;">${esc(r.tier || "")}</td>
                <td>${r.stars ?? "\u2014"}</td>
                <td>${r.stage ?? "\u2014"}</td>
                <td style="text-align:left;">${renderMaterialsWithIcons(r.materials)}</td>
                <td>${esc(r.stat || "\u2014")}</td>
                <td>${r.power != null ? Number(r.power).toLocaleString() : "\u2014"}</td>
                <td><button class="del" data-delrow="${r.id}" title="Delete row">&times;</button></td>
              </tr>`
            : `<tr>
                <td>${r.level}${r.stage && r.stage !== "0" ? "." + esc(r.stage) : ""}</td>
                <td style="text-align:left;">${renderMaterialsWithIcons(r.materials)}</td>
                <td>${r.power != null ? Number(r.power).toLocaleString() : "\u2014"}</td>
                <td><button class="del" data-delrow="${r.id}" title="Delete row">&times;</button></td>
              </tr>`
        )
        .join("")
    : `<tr><td colspan="${hasTier ? 7 : 4}"><div class="empty">No rows yet.</div></td></tr>`;

  tbody.querySelectorAll("[data-delrow]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await sb(`progression_rows?id=eq.${btn.dataset.delrow}`, { method: "DELETE" });
        toast("Row deleted");
        renderProgressionInto(target, tableName);
      } catch (err) {
        toast("Couldn't delete row", true);
      }
    });
  });

  const addForm = target.querySelector("#progAddForm");
  if (addForm) {
    addForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target;
      const errEl = target.querySelector("#progErr");
      errEl.textContent = "";
      const level = Number(f.level.value);
      if (!level) { errEl.textContent = "Enter a level first"; return; }
      try {
        await sb(`progression_rows`, {
          method: "POST",
          body: JSON.stringify({
            table_id: table.id,
            level,
            materials: f.materials.value.trim() || null,
            power: f.power.value.trim() === "" ? null : Number(f.power.value),
            sort_order: rows.length,
          }),
        });
        toast("Row added");
        renderProgressionInto(target, tableName);
      } catch (err) {
        errEl.textContent = "Couldn't add row";
      }
    });
  }
}

// ============================================================
// CHIEF CHARMS CALCULATOR
// 18 charms total (6 gear pieces x 3 charm slots each), levels
// 1-18 with sub-levels from level 4 onward (75 steps total).
// Each charm boosts both Lethality and Health for its troop type.
// Cost table and per-level stat curve sourced from the community
// wiki (wostools.net); CHARM_LEVELS defines the exact step order.
// ============================================================
const CHARM_MATERIAL_ICONS = {
  guides: "https://gom-s3-user-avatar.s3.us-west-2.amazonaws.com/wp-content/uploads/2023/05/charm-guide.png",
  designs: "https://gom-s3-user-avatar.s3.us-west-2.amazonaws.com/wp-content/uploads/2023/05/charm-design.png",
  secrets: "https://gom-s3-user-avatar.s3.us-west-2.amazonaws.com/wp-content/uploads/2025/03/item_icon_600026.png",
};
// Charm level data (levels, per-step material costs, cumulative Lethality/
// Health %) now lives in the `charm_levels` table (Admin-editable), not
// hardcoded. Loaded once via ensureCharmLevelsData().
let CHARM_LEVELS = [];
let CHARM_STEP_COST = {};
let CHARM_CUMULATIVE = {};
let CHARM_CUMULATIVE_STAT = {};
let CHARM_LEVELS_LOADED = false;
let CHARM_LEVELS_PROMISE = null;
async function ensureCharmLevelsData() {
  // Callers running at the same time share one in-flight download.
  if (CHARM_LEVELS_LOADED) return CHARM_LEVELS_PROMISE;
  CHARM_LEVELS_LOADED = true;
  CHARM_LEVELS_PROMISE = (async () => {
  const rows = await sb(`charm_levels?select=level_label,sort_order,guides_cost,designs_cost,secrets_cost,cumulative_pct&order=sort_order.asc`);
  CHARM_LEVELS = rows.map((r) => r.level_label);
  CHARM_STEP_COST = {};
  CHARM_CUMULATIVE = {};
  CHARM_CUMULATIVE_STAT = {};
  let g = 0, d = 0, s = 0;
  rows.forEach((r) => {
    if (r.level_label !== "0") {
      CHARM_STEP_COST[r.level_label] = [Number(r.guides_cost), Number(r.designs_cost), Number(r.secrets_cost)];
      g += Number(r.guides_cost); d += Number(r.designs_cost); s += Number(r.secrets_cost);
    }
    CHARM_CUMULATIVE[r.level_label] = [g, d, s];
    CHARM_CUMULATIVE_STAT[r.level_label] = Number(r.cumulative_pct);
  });
  })().catch((e) => { CHARM_LEVELS_LOADED = false; throw e; });
  return CHARM_LEVELS_PROMISE;
}
// The 6 gear pieces, grouped by which troop type they buff.
const CHARM_PIECES = [
  { key: "helmet", name: "Helmet", troop: "Lancer" },
  { key: "watch", name: "Watch", troop: "Lancer" },
  { key: "jacket", name: "Jacket", troop: "Infantry" },
  { key: "pants", name: "Pants", troop: "Infantry" },
  { key: "ring", name: "Ring", troop: "Marksman" },
  { key: "cane", name: "Cane", troop: "Marksman" },
];
const CHARM_CALC_STATE = {};
CHARM_PIECES.forEach((p) => (CHARM_CALC_STATE[p.key] = [0, 1, 2].map(() => ({ current: "0", target: "18" }))));

// Builds <option> tags for a charm/gear level <select>.
function levelOptions(selected) {
  return CHARM_LEVELS.map((l) => `<option value="${l}" ${l === selected ? "selected" : ""}>${l === "0" ? "0 (none)" : l}</option>`).join("");
}

// Renders the 3-troop-type x 2-piece x 3-charm-slot calculator,
// each slot with its own current\u2192target level pair.
let CHARM_STATE_LOADED = false;
// Loads any saved Charm selections into CHARM_CALC_STATE. Safe to call
// from anywhere; only fetches once per session.
async function ensureCharmData() {
  if (CHARM_STATE_LOADED) return;
  CHARM_STATE_LOADED = true;
  await ensureCharmLevelsData();
  const saved = await loadCalcState("charm");
  if (saved) {
    CHARM_PIECES.forEach((p) => {
      if (Array.isArray(saved[p.key])) {
        saved[p.key].forEach((slot, i) => {
          if (CHARM_CALC_STATE[p.key][i] && slot) {
            if (slot.current) CHARM_CALC_STATE[p.key][i].current = slot.current;
            if (slot.target) CHARM_CALC_STATE[p.key][i].target = slot.target;
          }
        });
      }
    });
  }
}

// ---- Shared "one troop at a time, swipe to switch" helper ----
// Renders a single-row tab header for Infantry/Lancer/Marksman (or any
// small set of troops) and wires horizontal swipe gestures on the content
// area below it to move to the next/previous troop, so every troop's full
// content gets the whole screen width instead of being squeezed 3-across.
function renderTroopTabs(containerEl, troops, current, colors, onSelect) {
  containerEl.innerHTML = `
    <div class="cat-tabs" style="margin-bottom:14px;">
      ${troops.map((t) => `<button data-troop="${esc(t)}" class="${t === current ? "active" : ""}" style="${t === current && colors && colors[t] ? `border-color:${colors[t]}; color:${colors[t]};` : ""}">${esc(t)}</button>`).join("")}
    </div>
  `;
  containerEl.querySelectorAll("button[data-troop]").forEach((btn) => {
    btn.addEventListener("click", () => onSelect(btn.dataset.troop));
  });
}
function wireTroopSwipe(el, troops, current, onSelect) {
  const idx = troops.indexOf(current);
  let startX = null, startY = null;
  el.ontouchstart = (e) => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; };
  el.ontouchend = (e) => {
    if (startX == null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      const next = dx < 0 ? idx + 1 : idx - 1;
      if (next >= 0 && next < troops.length) onSelect(troops[next]);
    }
  };
}
// Position dots only (no tap targets, no text hint) - used where the whole
// switch is meant to be swipe-only.
function renderSwipeDots(containerEl, items, current, colors) {
  containerEl.innerHTML = items
    .map((t) => `<span style="width:7px; height:7px; border-radius:50%; background:${t === current ? ((colors && colors[t]) || "var(--ice)") : "var(--line)"}; display:inline-block;"></span>`)
    .join("");
}
// For longer lists (pets, experts) a "3 / 10" counter reads better than a
// row of 10 dots. Renders the counter and wires the swipe on the content
// container in one call.
function renderSwipeCounter(containerEl, count, activeIndex) {
  containerEl.innerHTML = `<span class="meta" style="font-size:12px;">${activeIndex + 1} / ${count} &nbsp;\u2022&nbsp; swipe to browse</span>`;
}
function wireIndexSwipe(el, count, activeIndex, onNavigate) {
  let startX = null, startY = null;
  el.ontouchstart = (e) => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; };
  el.ontouchend = (e) => {
    if (startX == null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      const next = dx < 0 ? activeIndex + 1 : activeIndex - 1;
      if (next >= 0 && next < count) onNavigate(next);
    }
  };
}

// Sums Guides/Designs/Secrets across all 18 charm slots.
async function updateCharmTotals() {
  let totalG = 0, totalD = 0, totalS = 0;
  CHARM_PIECES.forEach((p) => {
    CHARM_CALC_STATE[p.key].forEach((slot) => {
      const from = CHARM_CUMULATIVE[slot.current] || [0, 0, 0];
      const to = CHARM_CUMULATIVE[slot.target] || [0, 0, 0];
      totalG += Math.max(0, to[0] - from[0]);
      totalD += Math.max(0, to[1] - from[1]);
      totalS += Math.max(0, to[2] - from[2]);
    });
  });

  renderChiefGearResourcesBar("charmOwned", { "Charm Guides": totalG, "Charm Designs": totalD, "Jewel Secrets": totalS }, ["Charm Guides", "Charm Designs", "Jewel Secrets"], updateCharmTotals, "charm");

  updateCharmCurrentStats();
}

// Pure computation, reusable by both this page and the Stats dashboard.
function computeCharmStats(stateObj) {
  const troopTypes = ["Lancer", "Infantry", "Marksman"];
  const out = {};
  troopTypes.forEach((troop) => {
    const pieces = CHARM_PIECES.filter((p) => p.troop === troop);
    let sumStat = 0;
    for (const p of pieces) {
      for (const slot of stateObj[p.key]) {
        sumStat += CHARM_CUMULATIVE_STAT[slot.current] || 0;
      }
    }
    out[troop] = sumStat;
  });
  return out;
}
function maxedCharmState() {
  const out = {};
  CHARM_PIECES.forEach((p) => {
    out[p.key] = [0, 1, 2].map(() => ({ current: "18" }));
  });
  return out;
}

// Sums each troop type's current Lethality/Health from its 6
// charms (2 pieces x 3 slots), matching the Skin Gallery card style.
function updateCharmCurrentStats() {
  const el = document.getElementById("charmCurrentStats");
  if (!el) return;
  const statByTroop = computeCharmStats(CHARM_CALC_STATE);
  const maxByTroop = computeCharmStats(maxedCharmState());
  const rows = Object.entries(statByTroop).map(([troop, avg]) => ({ troop, avg, max: maxByTroop[troop] || 0 }));
  el.innerHTML =
    `<div class="stats-row-scroll">` +
    rows
      .map(
        (r, idx) => `
    <div style="${idx > 0 ? "border-left:1px solid var(--line); padding-left:12px;" : ""} display:flex; flex-direction:column; align-items:center; text-align:center;">
      <div class="meta" style="margin-bottom:8px; font-weight:600; color:var(--frost);">${esc(r.troop)}</div>
      <div class="metric" style="padding:8px;"><div class="label" style="font-size:9px;">LETH &amp; HP</div><div class="val" style="font-size:13px; margin-top:3px;">+${r.avg.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">of max +${r.max.toFixed(1)}%</div></div>
    </div>`
      )
      .join("") +
    `</div>`;
}

const CHIEF_GEAR_PIECES = [

// Lazily fetches and caches the 150-row Chief Gear progression.
async function loadChiefGearRows() {
  const setBonusPromise = ensureChiefGearSetBonusData();
  if (CHIEF_GEAR_ROWS) { await setBonusPromise; return CHIEF_GEAR_ROWS; }
  let [[table]] = await Promise.all([
    sb(`progression_tables?name=eq.Chief Gear&user_id=eq.${PROGRESSION_OWNER_ID}&select=id`),
    setBonusPromise,
  ]);
  if (!table) {
    CHIEF_GEAR_ROWS = [];
    return CHIEF_GEAR_ROWS;
  }
  CHIEF_GEAR_ROWS = await sb(`progression_rows?table_id=eq.${table.id}&select=id,tier,stars,stage,materials,stat,power,display_label,hardened_alloy,polishing_solution,design_plan,amber&order=sort_order.asc`);
  CHIEF_GEAR_PIECES.forEach((p) => {
    if (CHIEF_GEAR_STATE[p.key].to === null) CHIEF_GEAR_STATE[p.key].to = CHIEF_GEAR_ROWS.length - 1;
  });
  const saved = await loadCalcState("chief_gear");
  if (saved) {
    CHIEF_GEAR_PIECES.forEach((p) => {
      if (typeof saved[p.key]?.from === "number") CHIEF_GEAR_STATE[p.key].from = saved[p.key].from;
      if (typeof saved[p.key]?.to === "number") CHIEF_GEAR_STATE[p.key].to = saved[p.key].to;
    });
  }
  return CHIEF_GEAR_ROWS;
}

// Sums materials needed across all 6 gear pieces' selected ranges.
// matTotals may be a single {name: qty} object, OR an array of
// { label, totals } groups (e.g. one per Hero Gear set) - in which case a
// separate needed/still-needed row is rendered per group, all measured
// against the same shared owned amounts.
// Full material names are too long to fit "AVAILABLE BACKPACK" in one row
// on most screens - shorten just for display here (data keys stay the same).
const MATERIAL_NAME_SHORT = {
  "Hardened Alloy": "Alloy",
  "Polishing Solution": "Polish",
  "Design Plan": "Design",
};
async function renderChiefGearResourcesBar(containerId, matTotals, allMaterialNames, refreshFn, calcKey) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const groups = Array.isArray(matTotals) ? matTotals : [{ label: null, totals: matTotals }];
  const mergedNames = new Set();
  groups.forEach((g) => Object.keys(g.totals || {}).forEach((n) => mergedNames.add(n)));
  const names = allMaterialNames && allMaterialNames.length ? allMaterialNames : [...mergedNames];
  if (!names.length) {
    el.innerHTML = "";
    return;
  }
  const matEntries = names.map((name) => [name, 0]);
  const owned = await ensureMaterialOwnedCache(calcKey || "chief_gear");
  const rowsId = `${containerId}_rows`;

  function statusFor(name, needed) {
    const haveQty = owned[name] || 0;
    const stillNeed = Math.max(0, needed - haveQty);
    const surplus = Math.max(0, haveQty - needed);
    const statusColor = needed === 0 ? "var(--muted)" : stillNeed > 0 ? "var(--danger)" : "var(--good)";
    // Per-material status: just the number (still needed / extra), no
    // wording - color alone conveys which case it is. Only the two "no
    // number" states (nothing needed yet / exactly enough) keep a short word.
    const statusText = needed === 0 ? "\u2014" : stillNeed > 0 ? `${stillNeed.toLocaleString()}` : surplus > 0 ? `\u2713 ${surplus.toLocaleString()}` : "\u2713";
    return { statusColor, statusText };
  }

  function materialCellHtml([name]) {
    const lower = name.toLowerCase();
    const iconKey = Object.keys(MATERIAL_ICONS).find((k) => lower.includes(k));
    const icon = iconKey ? `<img src="${MATERIAL_ICONS[iconKey]}" alt="" style="width:22px; height:22px; object-fit:contain; flex-shrink:0; order:0;" loading="lazy" />` : "";
    const haveQty = owned[name] || 0;
    const shortName = MATERIAL_NAME_SHORT[name] || name;
    const groupStatusHtml = groups
      .map((g) => {
        const needed = Number((g.totals || {})[name]) || 0;
        const { statusColor, statusText } = statusFor(name, needed);
        return `<div data-neededstatus="${esc(name)}|${esc(g.label || "")}" style="font-size:11px; margin-top:4px;">
          ${g.label ? `<span class="meta" style="font-size:9px;">${esc(g.label)}: </span>` : ""}
          <span style="color:${statusColor};">${statusText}</span>
        </div>`;
      })
      .join("");
    return `<div style="min-width:0;">
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:nowrap;">
        ${icon}
        <span class="meta mat-name" style="font-size:11px; font-weight:600; letter-spacing:0.3px; order:1;">${esc(shortName)}</span>
      </div>
      <input type="text" inputmode="numeric" data-ownedmat="${esc(name)}" value="${haveQty}" style="width:100%; padding:8px 10px; font-size:14px;" />
      ${groupStatusHtml}
    </div>`;
  }

  el.innerHTML = `
    <div id="${rowsId}" class="mat-row">${matEntries.map(materialCellHtml).join("")}</div>
  `;

  el.querySelectorAll("[data-ownedmat]").forEach((input) => {
    input.addEventListener("change", async () => {
      let val = Number(input.value);
      if (Number.isNaN(val) || val < 0) val = 0;
      input.value = val;
      const name = input.dataset.ownedmat;
      owned[name] = val;
      await saveCalcState(`material_owned_${calcKey || "chief_gear"}`, owned);
      // Only this material's status text depends on its owned amount, so
      // update just those spans in place rather than touching the input
      // elements (which would steal focus if the user tabs straight into
      // another field before this one's change event finishes).
      groups.forEach((g) => {
        const needed = Number((g.totals || {})[name]) || 0;
        const { statusColor, statusText } = statusFor(name, needed);
        const statusDiv = el.querySelector(`[data-neededstatus="${CSS.escape(name)}|${CSS.escape(g.label || "")}"] span:last-child`);
        if (statusDiv) {
          statusDiv.style.color = statusColor;
          statusDiv.textContent = statusText;
        }
      });
    });
  });
}

async function updateChiefGearTotals() {
  if (!CHIEF_GEAR_ROWS) return;
  const rows = CHIEF_GEAR_ROWS;
  const CHIEF_GEAR_MATERIAL_COLS = [
    ["hardened_alloy", "Hardened Alloy"],
    ["polishing_solution", "Polishing Solution"],
    ["design_plan", "Design Plan"],
    ["amber", "Amber"],
  ];

  const matTotals = {};
  let totalPower = 0;
  CHIEF_GEAR_PIECES.forEach((p) => {
    const st = CHIEF_GEAR_STATE[p.key];
    const fromIdx = Math.min(st.from, st.to);
    const toIdx = Math.max(st.from, st.to);
    for (let i = fromIdx + 1; i <= toIdx; i++) {
      CHIEF_GEAR_MATERIAL_COLS.forEach(([col, label]) => {
        const v = Number(rows[i][col]) || 0;
        if (v) matTotals[label] = (matTotals[label] || 0) + v;
      });
    }
    const powerFrom = rows[fromIdx].power != null ? Number(rows[fromIdx].power) : 0;
    const powerTo = rows[toIdx].power != null ? Number(rows[toIdx].power) : 0;
    totalPower += powerTo - powerFrom;
  });

  renderChiefGearResourcesBar("gearOwned", matTotals, ["Hardened Alloy", "Polishing Solution", "Design Plan", "Amber"], updateChiefGearTotals, "chief_gear");

  updateChiefGearCurrentStats();
}

// Sums current Attack/Defense per troop type from its 2 pieces'
// current tier (each piece's stat applies to both Attack & Defense).
// Pure computation, reusable by both this page and the Stats dashboard.
// 3-piece (Defense, all troops) and 6-piece (Attack, all troops) set
// bonuses for equipping matching-tier gear. Confirmed player-provided
// values; the 6-piece table uses the same percentages as the 3-piece
// table, just requiring all 6 pieces (not just 3) to match tier.
let CHIEF_GEAR_SET_BONUS = {};
let CHIEF_GEAR_TIER_ORDER = [];
let CHIEF_GEAR_SET_BONUS_LOADED = false;
let CHIEF_GEAR_SET_BONUS_PROMISE = null;
async function ensureChiefGearSetBonusData() {
  // Callers running at the same time share one in-flight download.
  if (CHIEF_GEAR_SET_BONUS_LOADED) return CHIEF_GEAR_SET_BONUS_PROMISE;
  CHIEF_GEAR_SET_BONUS_LOADED = true;
  CHIEF_GEAR_SET_BONUS_PROMISE = (async () => {
  const rows = await sb(`chief_gear_set_bonus?select=tier,bonus_pct&order=sort_order.asc`);
  CHIEF_GEAR_SET_BONUS = {};
  CHIEF_GEAR_TIER_ORDER = [];
  rows.forEach((r) => {
    CHIEF_GEAR_SET_BONUS[r.tier] = Number(r.bonus_pct);
    CHIEF_GEAR_TIER_ORDER.push(r.tier);
  });
  })().catch((e) => { CHIEF_GEAR_SET_BONUS_LOADED = false; throw e; });
  return CHIEF_GEAR_SET_BONUS_PROMISE;
}

// Looks at all 6 pieces' current tier and returns which set bonuses
// are active. A piece counts toward a tier's requirement if it's at
// that tier OR HIGHER (a piece above the threshold still qualifies).
// 3-piece bonus needs >=3 pieces at/above some tier; 6-piece needs all 6.
function computeChiefGearSetBonus(stateObj) {
  if (!CHIEF_GEAR_ROWS) return { threeTier: null, threeBonus: 0, sixTier: null, sixBonus: 0 };
  const pieceTierIdx = CHIEF_GEAR_PIECES.map((p) => {
    const idx = stateObj[p.key].from;
    const tier = CHIEF_GEAR_ROWS[idx]?.tier;
    return tier ? CHIEF_GEAR_TIER_ORDER.indexOf(tier) : -1;
  });
  let threeTier = null, sixTier = null;
  // walk tiers from highest to lowest; first (highest) tier that enough pieces qualify for wins
  for (let ti = CHIEF_GEAR_TIER_ORDER.length - 1; ti >= 0; ti--) {
    const qualifying = pieceTierIdx.filter((idx) => idx >= ti).length;
    if (threeTier === null && qualifying >= 3) threeTier = CHIEF_GEAR_TIER_ORDER[ti];
    if (sixTier === null && qualifying >= 6) sixTier = CHIEF_GEAR_TIER_ORDER[ti];
    if (threeTier !== null && sixTier !== null) break;
  }
  return {
    threeTier,
    threeBonus: threeTier ? CHIEF_GEAR_SET_BONUS[threeTier] || 0 : 0,
    sixTier,
    sixBonus: sixTier ? CHIEF_GEAR_SET_BONUS[sixTier] || 0 : 0,
  };
}

// Returns {Lancer: {Attack, Defense}, Infantry: {...}, Marksman: {...}}.
// Per-piece stat boosts both Attack and Defense for its own troop type;
// the 3-piece bonus adds to Defense for ALL troops, the 6-piece bonus
// adds to Attack for ALL troops (per the in-game set bonus mechanic).
// Raw per-piece gear stat only, no set bonus baked in - used by the
// dashboard's "Chief" source since "Chief Bonus" tracks the set bonus
// as its own separate line (computeChiefGearStats bakes both together,
// which is right for the Chief Gear page's own display, but would
// double-count the bonus if reused for the dashboard breakdown).
function computeChiefGearRawStat(stateObj) {
  if (!CHIEF_GEAR_ROWS) return {};
  const rows = CHIEF_GEAR_ROWS;
  const troopTypes = ["Lancer", "Infantry", "Marksman"];
  const out = {};
  troopTypes.forEach((troop) => {
    const pieces = CHIEF_GEAR_PIECES.filter((p) => p.troop === troop);
    let sumStat = 0;
    for (const p of pieces) {
      const idx = stateObj[p.key].from;
      sumStat += parseStatPct(rows[idx]?.stat) || 0;
    }
    out[troop] = { Attack: sumStat, Defense: sumStat };
  });
  return out;
}
function computeChiefGearStats(stateObj) {
  if (!CHIEF_GEAR_ROWS) return {};
  const rows = CHIEF_GEAR_ROWS;
  const troopTypes = ["Lancer", "Infantry", "Marksman"];
  const { threeBonus, sixBonus } = computeChiefGearSetBonus(stateObj);
  const out = {};
  troopTypes.forEach((troop) => {
    const pieces = CHIEF_GEAR_PIECES.filter((p) => p.troop === troop);
    let sumStat = 0;
    for (const p of pieces) {
      const idx = stateObj[p.key].from;
      sumStat += parseStatPct(rows[idx]?.stat) || 0;
    }
    out[troop] = { Attack: sumStat + sixBonus, Defense: sumStat + threeBonus };
  });
  return out;
}
function maxedChiefGearState() {
  const out = {};
  CHIEF_GEAR_PIECES.forEach((p) => {
    out[p.key] = { from: Math.max(0, (CHIEF_GEAR_ROWS || []).length - 1) };
  });
  return out;
}

function updateChiefGearCurrentStats() {
  const el = document.getElementById("gearCurrentStats");
  if (!el || !CHIEF_GEAR_ROWS) return;
  const statByTroop = computeChiefGearRawStat(CHIEF_GEAR_STATE);
  const maxByTroop = computeChiefGearRawStat(maxedChiefGearState());
  const { threeTier, threeBonus, sixTier, sixBonus } = computeChiefGearSetBonus(CHIEF_GEAR_STATE);
  const results = Object.entries(statByTroop).map(([troop, stats]) => ({ troop, stats, max: maxByTroop[troop] }));

  const setBonusHtml = `
    <div class="stats-row-scroll" style="margin-bottom:14px;">
      <div class="metric">
        <div class="label">3-piece (DEF, all troops)</div>
        <div class="val" style="color:${threeBonus ? "var(--good)" : "var(--muted)"};">${threeBonus ? `+${threeBonus}%` : "Not active"}</div>
      </div>
      <div class="metric">
        <div class="label">6-piece (ATK, all troops)</div>
        <div class="val" style="color:${sixBonus ? "var(--good)" : "var(--muted)"};">${sixBonus ? `+${sixBonus}%` : "Not active"}</div>
      </div>
    </div>
  `;

  el.innerHTML =
    setBonusHtml +
    `<div class="stats-row-scroll">` +
    results
      .map(
        (r, idx) => `
    <div style="${idx > 0 ? "border-left:1px solid var(--line); padding-left:12px;" : ""} display:flex; flex-direction:column; align-items:center; text-align:center;">
      <div class="meta" style="margin-bottom:8px; font-weight:600; color:var(--frost);">${esc(r.troop)}</div>
      <div class="metric" style="padding:8px;"><div class="label" style="font-size:9px;">ATK &amp; DEF</div><div class="val" style="font-size:13px; margin-top:3px;">+${r.stats.Attack.toFixed(2)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">of max +${r.max.Attack.toFixed(2)}%</div></div>

      .join("") +

}

// Renders a "menu button + scrollable tab row" category switcher into

  containerEl.innerHTML = `
    <div class="cat-switcher">
      <div style="position:relative;">
        <button class="cat-menu-btn" type="button" id="${containerEl.id}MenuBtn" title="All categories">&#9776;</button>
