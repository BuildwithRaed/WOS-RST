          ${cfg.cols.map((c) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${esc(c.label)}</th>`).join("")}
          <th></th>
        </tr></thead>
        <tbody>
          ${rows
            .map(
              (r) => `
            <tr data-resrow="${r.id}">
              ${cfg.cols
                .map(
                  (c) =>
                    `<td style="padding:4px;"><input data-f="${c.key}" ${c.type === "number" ? 'type="number" step="any"' : ""} value="${esc(r[c.key] ?? "")}" style="width:${c.key === "buff_text" ? "180px" : "90px"};" /></td>`
                )
                .join("")}
              <td style="padding:4px; white-space:nowrap;">
                <button class="btn small ghost" data-ressave="${r.id}">Save</button>
                <button class="btn small ghost" data-resdel="${r.id}" style="color:var(--danger);">Delete</button>
              </td>
            </tr>`
                )
            .join("")}
        </tbody>
      </table>
    `;

    wrap.querySelectorAll("[data-ressave]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        try {
          await saveResRow(btn.dataset.ressave);
          cfg.invalidate();
          toast("Saved");
        } catch (err) {
          toast("Couldn't save", true);
        }
      });
    });
    wrap.querySelectorAll("[data-resdel]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        if (!confirm("Delete this row?")) return;
        try {
          await sb(`${cfg.table}?id=eq.${btn.dataset.resdel}`, { method: "DELETE" });
          cfg.invalidate();
          toast("Deleted");
          loadRows();
        } catch (err) {
          toast("Couldn't delete", true);
        }
      });
    });
  }

  document.getElementById("adminResearchAddForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminResearchAddErr");
    errEl.textContent = "";
    const payload = {};
    cfg.cols.forEach((c) => {
      let v = f[c.key].value;
      if (c.key === "sort_order" && v === "") {
        v = null;
      } else if (c.type === "number") {
        v = v === "" ? null : Number(v);
      } else if (v.trim() === "") {
        v = null;
      }
      payload[c.key] = v;
    });
    try {
      if (payload.sort_order == null) {
        const existing = await sb(`${cfg.table}?select=sort_order&order=sort_order.desc&limit=1`);
        payload.sort_order = existing.length ? (existing[0].sort_order || 0) + 1 : 0;
      }
      await sb(`${cfg.table}`, { method: "POST", body: JSON.stringify(payload) });
      cfg.invalidate();
      toast("Row added");
      f.reset();
      loadRows();
    } catch (err) {
      errEl.textContent = "Couldn't add row";
    }
  });

  await loadRows();
}

        <label class="meta" style="font-size:11px;">Generation</label>

  const heroRowHtml = (r) => `

              .map((h) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${h}</th>`)
              .join("")}
          </tr></thead>
          <tbody>
              <tr data-herorow="${r.id}">
                <td style="padding:4px;"><input data-f="name" value="${esc(r.name)}" style="width:130px;" /></td>
                <td style="padding:4px;"><input data-f="generation" type="number" value="${r.generation ?? ""}" style="width:56px;" /></td>
                <td style="padding:4px;">${troopSelect(r.troop_type, 'data-f="troop_type"')}</td>
                <td style="padding:4px;">${raritySelect(r.rarity, 'data-f="rarity"')}</td>
                <td style="padding:4px;"><span style="display:inline-flex; gap:4px; align-items:center;"><input data-f="image_url" value="${esc(r.image_url || "")}" style="width:180px;" />${uploadBtnHtml()}</span></td>
                <td style="padding:4px;"><input data-f="exp_attack" type="number" step="any" value="${r.exp_attack ?? ""}" style="width:90px;" /></td>
                <td style="padding:4px;"><input data-f="widget_lethality" type="number" step="any" value="${r.widget_lethality ?? ""}" style="width:90px;" /></td>
                <td style="padding:4px;"><input data-f="max_level" type="number" value="${r.max_level ?? ""}" style="width:80px;" /></td>

          </tbody>
        </table>
      </div>`;
  function fillHeroPick() {

  }
  function renderHeroEditor() {
    const r = rows.find((x) => x.id === heroSel.value);
    editorEl.innerHTML = r ? heroRowHtml(r) : `<p class="desc">No heroes in this generation.</p>`;
    wireHeroRowButtons();
    if (typeof renderGenStats === "function") { selectedGen = Number(genSel.value); renderGenStats(); }
  }
  genSel.addEventListener("change", fillHeroPick);
  heroSel.addEventListener("change", renderHeroEditor);

  function wireHeroRowButtons() {
  body.querySelectorAll("[data-herosave]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const id = btn.dataset.herosave;
      const tr = body.querySelector(`tr[data-herorow="${id}"]`);
      const patch = {};
      tr.querySelectorAll("[data-f]").forEach((el) => {
        let v = el.value;
        if (["max_level", "max_stars", "generation", "exp_attack", "exp_defense", "widget_lethality", "widget_health"].includes(el.dataset.f)) v = v === "" ? null : Number(v);
        else if (v.trim() === "") v = null;
        patch[el.dataset.f] = v;
      });
      // ATK/DEF and widget LETH/HP are always equal - mirror the single inputs.
      if ("exp_attack" in patch) patch.exp_defense = patch.exp_attack;
      if ("widget_lethality" in patch) patch.widget_health = patch.widget_lethality;
      try {
        await sb(`heroes?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });
        toast("Saved");
      } catch (err) {
        toast("Couldn't save", true);
      }
    });
  });
  body.querySelectorAll("[data-herodel]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this hero from the catalog?")) return;
      try {
        await sb(`heroes?id=eq.${btn.dataset.herodel}`, { method: "DELETE" });
        toast("Deleted");
        renderAdminHeroes(body);
      } catch (err) {
        toast("Couldn't delete", true);
      }
    });
  });

  }

  document.getElementById("adminAddHeroForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminAddHeroErr");
    errEl.textContent = "";
    const name = f.name.value.trim();
    if (!name) { errEl.textContent = "Enter a hero name"; return; }
    try {
      await sb(`heroes`, {
        method: "POST",
        body: JSON.stringify({
          name,
          troop_type: f.troop_type.value || null,
          generation: f.generation.value === "" ? null : Number(f.generation.value),
          image_url: f.image_url.value.trim() || null,
          max_level: Number(f.max_level.value) || 80,
          max_stars: Number(f.max_stars.value) || 5,
        }),
      });
      toast("Hero added");
      renderAdminHeroes(body);
    } catch (err) {
      errEl.textContent = "Couldn't add hero \u2014 name may already exist";
    }
  });

  // ---- Per-generation star-shard stats & widget-level stats editors ----
  // Stats are identical for every hero in a generation, so these are edited
  // once per generation and apply to all heroes of that generation.
  const gens = [...new Set(rows.map((r) => r.generation).filter((g) => g != null))].sort((a, b) => b - a);
  const statsWrap = document.createElement("div");
  body.appendChild(statsWrap);

  async function renderGenStats() {
    const [starRows, widgetRows] = await Promise.all([
      sb(`hero_gen_star_stats?generation=eq.${selectedGen}&select=step,atk_pct,def_pct,shards&order=step`),
      sb(`hero_gen_widget_stats?generation=eq.${selectedGen}&select=level,leth_pct,hp_pct&order=level`),
    ]);
    const starBy = {}; starRows.forEach((r) => (starBy[r.step] = r));
    const widgetBy = {}; widgetRows.forEach((r) => (widgetBy[r.level] = r));
    const th = (h) => `<th style="text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${h}</th>`;
    const genHeroes = rows.filter((r) => r.generation === selectedGen).map((r) => r.name).join(", ");
    statsWrap.innerHTML = `
      <div class="panel" style="margin-top:16px;">
        <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:6px;">
          <h2 style="margin:0;">Star shard & widget stats</h2>
          <span class="meta" style="font-size:12px; font-weight:600; color:var(--frost);">Gen ${selectedGen}</span>
          <button class="btn small" id="adminGenStatsSave">Save all</button>
          <span style="display:inline-flex; align-items:center; gap:6px; margin-left:auto;">
            <span class="meta" style="font-size:11px;">Max ATK&amp;DEF %</span>
            <input id="adminGenMaxAtk" type="number" step="any" style="width:90px;" placeholder="e.g. 1621.3" />
            <span class="meta" style="font-size:11px;">Max widget %</span>
            <input id="adminGenMaxWidget" type="number" step="any" style="width:80px;" placeholder="e.g. 482" />
            <button class="btn small ghost" id="adminGenGenerate" title="Fills all 30 shard steps and 10 widget levels from the max values using the standard curve">Generate from max</button>
          </span>
        </div>
        <p class="desc">Applies to every hero of this generation: ${esc(genHeroes) || "\u2014"}. Star steps 1\u201330 = 5 stars \u00d7 6 shards (step 6 = 1\u2605, 12 = 2\u2605, \u2026 30 = 5\u2605).</p>
        <div class="grid g2" style="gap:16px;">
          <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
              <thead><tr>${["Step", "Star", "ATK & DEF %", "Shards"].map(th).join("")}</tr></thead>
              <tbody>
                ${Array.from({ length: 30 }, (_, i) => i + 1).map((step) => {
                  const r = starBy[step] || {};
                  const star = Math.floor((step - 1) / 6) + 1, shard = ((step - 1) % 6) + 1;
                  return `<tr data-starstep="${step}">
                    <td style="padding:3px 8px;">${step}</td>
                    <td style="padding:3px 8px;" class="meta">${star}\u2605 ${shard}/6</td>
                    <td style="padding:3px;"><input data-sf="atk_pct" type="number" step="any" value="${r.atk_pct ?? ""}" style="width:100px;" /></td>
                    <td style="padding:3px;"><input data-sf="shards" type="number" value="${r.shards ?? ""}" style="width:64px;" /></td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
          <div style="overflow-x:auto;">
            <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
              <thead><tr>${["Widget Lv", "LETH & HP %"].map(th).join("")}</tr></thead>
              <tbody>
                ${Array.from({ length: 10 }, (_, i) => i + 1).map((lvl) => {
                  const r = widgetBy[lvl] || {};
                  return `<tr data-widgetlvl="${lvl}">
                    <td style="padding:3px 8px;">${lvl}</td>
                    <td style="padding:3px;"><input data-wf="leth_pct" type="number" step="any" value="${r.leth_pct ?? ""}" style="width:100px;" /></td>
                  </tr>`;
                }).join("")}
              </tbody>
            </table>
          </div>
        </div>
      </div>`;

    // Standard per-shard curve is defined globally (STAR_CURVE, near HERO_SHARD_CHART).
    statsWrap.querySelector("#adminGenGenerate").addEventListener("click", () => {
      const maxAtk = Number(statsWrap.querySelector("#adminGenMaxAtk").value);
      const maxW = Number(statsWrap.querySelector("#adminGenMaxWidget").value);
      if (maxAtk > 0) statsWrap.querySelectorAll("tr[data-starstep]").forEach((tr) => {
        const step = Number(tr.dataset.starstep);
        tr.querySelector('[data-sf="atk_pct"]').value = (maxAtk * STAR_CURVE[step - 1]).toFixed(2);
        const shIn = tr.querySelector('[data-sf="shards"]');
        if (!shIn.value) shIn.value = HERO_SHARD_CHART[Math.floor((step - 1) / 6) + 1][(step - 1) % 6];
      });
      if (maxW > 0) statsWrap.querySelectorAll("tr[data-widgetlvl]").forEach((tr) => {
        tr.querySelector('[data-wf="leth_pct"]').value = (maxW * Number(tr.dataset.widgetlvl) / 10).toFixed(2);
      });
      toast("Filled \u2014 review, then Save all");
    });
    statsWrap.querySelector("#adminGenStatsSave").addEventListener("click", async () => {
      const num = (v) => (v === "" || v == null ? null : Number(v));
      const starPayload = [], widgetPayload = [];
      statsWrap.querySelectorAll("tr[data-starstep]").forEach((tr) => {
        const g = (f) => num(tr.querySelector(`[data-sf="${f}"]`).value);
        const atk = g("atk_pct"), sh = g("shards");
        if (atk != null || sh != null) starPayload.push({ generation: selectedGen, step: Number(tr.dataset.starstep), atk_pct: atk, def_pct: atk, shards: sh });
      });
      statsWrap.querySelectorAll("tr[data-widgetlvl]").forEach((tr) => {
        const g = (f) => num(tr.querySelector(`[data-wf="${f}"]`).value);
        const le = g("leth_pct");
        if (le != null) widgetPayload.push({ generation: selectedGen, level: Number(tr.dataset.widgetlvl), leth_pct: le, hp_pct: le });
      });
      try {
        if (starPayload.length) await sb(`hero_gen_star_stats`, { method: "POST", body: JSON.stringify(starPayload), prefer: "resolution=merge-duplicates,return=minimal" });
        if (widgetPayload.length) await sb(`hero_gen_widget_stats`, { method: "POST", body: JSON.stringify(widgetPayload), prefer: "resolution=merge-duplicates,return=minimal" });
        // keep hero max fields in sync with the 5★ / level-10 rows
        const maxStar = starPayload.find((p) => p.step === 30), maxW = widgetPayload.find((p) => p.level === 10);
        const heroPatch = {};
        if (maxStar) { heroPatch.exp_attack = maxStar.atk_pct; heroPatch.exp_defense = maxStar.def_pct; }
        if (maxW) { heroPatch.widget_lethality = maxW.leth_pct; heroPatch.widget_health = maxW.hp_pct; }
        if (Object.keys(heroPatch).length) await sb(`heroes?generation=eq.${selectedGen}`, { method: "PATCH", body: JSON.stringify(heroPatch), prefer: "return=minimal" });
        toast(`Gen ${selectedGen} stats saved`);
      } catch (err) {
        toast("Couldn't save stats", true);
      }
    });
  }
  fillHeroPick();
}

// Reorderable category button row, shared by Skin Gallery and Islands admin
// tabs. cats is the full [{id,category,sort_order}] list in current order.
function adminCategoryPickerHtml(cats, activeCat) {
  return cats
    .map(
      (c, idx) => `
    <div style="display:inline-flex; align-items:center; gap:2px;">
      <button class="btn ${c.category === activeCat ? "" : "ghost"} small" data-catselect="${esc(c.category)}">${esc(c.category)}</button>
      <button class="btn ghost small" data-catmoveup="${c.id}" ${idx === 0 ? "disabled" : ""} title="Move left" style="padding:4px 6px;">&#8592;</button>
      <button class="btn ghost small" data-catmovedown="${c.id}" ${idx === cats.length - 1 ? "disabled" : ""} title="Move right" style="padding:4px 6px;">&#8594;</button>
    </div>`
    )
    .join("");
}
function wireAdminCategoryReorder(container, page, cats, onChange) {
  container.querySelectorAll("[data-catmoveup]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const idx = cats.findIndex((c) => c.id === btn.dataset.catmoveup);
      if (idx <= 0) return;
      const a = cats[idx], b = cats[idx - 1];
      await Promise.all([
        sb(`skin_page_categories?id=eq.${a.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: b.sort_order }) }),
        sb(`skin_page_categories?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: a.sort_order }) }),
      ]);
      onChange();
    });
  });
  container.querySelectorAll("[data-catmovedown]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const idx = cats.findIndex((c) => c.id === btn.dataset.catmovedown);
      if (idx === -1 || idx >= cats.length - 1) return;
      const a = cats[idx], b = cats[idx + 1];
      await Promise.all([
        sb(`skin_page_categories?id=eq.${a.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: b.sort_order }) }),
        sb(`skin_page_categories?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ sort_order: a.sort_order }) }),
      ]);
      onChange();
    });
  });
}

        stage: f.stage.value.trim() || null,
        infantry_lethality_pct: allPct,
        infantry_health_pct: allPct,
        lancer_lethality_pct: allPct,
        lancer_health_pct: allPct,
        marksman_lethality_pct: allPct,
        marksman_health_pct: allPct,
        sort_order: nextOrder,
      };
      await sb(`pet_refine_nodes`, { method: "POST", body: JSON.stringify(payload) });

      f.reset();
      loadRefineRows();
    } catch (err) {
      errEl.textContent = "Couldn't add row";
    }
  });

  await loadRefineRows();
}

// Clears any text/number input's value when it's focused while showing a
// bare zero (0, 0.00, etc) so the user can start typing immediately instead
// of having to manually delete the placeholder zero first. Applies to every
// input across the whole app via event delegation, so it works uniformly
// without needing to be wired into each individual field.
document.addEventListener(
  "focusin",
  (e) => {
    const el = e.target;
    if (!el || el.tagName !== "INPUT") return;
    const type = (el.type || "text").toLowerCase();
    if (type !== "text" && type !== "number") return;
    if (/^0(\.0+)?$/.test(el.value.trim())) {
      el.value = "";
    }
  },
  true
);

// ---- Image upload to Supabase Storage (skin-images bucket) ----
// Any admin image input can get a "⬆ Upload" button beside it (rendered by
// uploadBtnHtml). Clicking opens a file picker; the file is uploaded and the
// public URL is written into the adjacent input.
async function uploadImageToStorage(file) {
  const ext = (file.name.split(".").pop() || "png").toLowerCase().replace(/[^a-z0-9]/g, "") || "png";
  const path = `${crypto.randomUUID()}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/skin-images/${path}`, {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": file.type || "application/octet-stream", "x-upsert": "true" },
    body: file,
  });
  if (!res.ok) throw new Error(`Upload failed (${res.status})`);
  return `${SUPABASE_URL}/storage/v1/object/public/skin-images/${path}`;
}
function uploadBtnHtml() {
  return `<button type="button" class="btn ghost small" data-imgupload title="Upload image" style="padding:4px 8px; white-space:nowrap;">&#8679; Upload</button>`;
}
let IMG_UPLOAD_PICKER = null;
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-imgupload]");
  if (!btn) return;
  e.preventDefault();
  const input = btn.previousElementSibling && btn.previousElementSibling.tagName === "INPUT" ? btn.previousElementSibling : null;
  if (!input) return;
  if (!IMG_UPLOAD_PICKER) {
    IMG_UPLOAD_PICKER = document.createElement("input");
    IMG_UPLOAD_PICKER.type = "file";
    IMG_UPLOAD_PICKER.accept = "image/*";
    IMG_UPLOAD_PICKER.style.display = "none";
    document.body.appendChild(IMG_UPLOAD_PICKER);
  }
  IMG_UPLOAD_PICKER.onchange = async () => {
    const file = IMG_UPLOAD_PICKER.files && IMG_UPLOAD_PICKER.files[0];
    IMG_UPLOAD_PICKER.value = "";
    if (!file) return;
    const orig = btn.innerHTML;
    btn.innerHTML = "Uploading\u2026";
    btn.disabled = true;
    try {
      const url = await uploadImageToStorage(file);
      input.value = url;
      input.dispatchEvent(new Event("input", { bubbles: true }));
      input.dispatchEvent(new Event("change", { bubbles: true }));
      toast("Image uploaded \u2014 remember to Save");
    } catch (err) {
      toast("Upload failed", true);
    } finally {
      btn.innerHTML = orig;
      btn.disabled = false;
    }
  };
  IMG_UPLOAD_PICKER.click();
});

// Small login control in the sidebar: lets the owner log in with a real
// email/password to unlock Admin. Everyone else stays on their automatic
// anonymous session and never sees anything beyond a "Owner login" link.
function renderOwnerLoginUI() {
  const el = document.getElementById("ownerLoginArea");
  document.getElementById("adminNavGroup").style.display = IS_OWNER ? "block" : "none";

  if (IS_OWNER) {
    el.innerHTML = `
      <div class="meta" style="font-size:11px; color:var(--good); margin-bottom:6px;">&#10003; Logged in as owner</div>
      <button class="btn ghost small" id="ownerLogoutBtn" style="width:100%;">Log out</button>
    `;
    document.getElementById("ownerLogoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      await ensureAuthSession();
      renderOwnerLoginUI();
      if (TAB === "adminpage") { TAB = "overview"; document.querySelector('#tabs button[data-tab="overview"]').click(); }
    });
    return;
  }

  el.innerHTML = `<button class="btn ghost small" id="ownerLoginOpenBtn" style="width:100%;">Owner login</button>`;
  document.getElementById("ownerLoginOpenBtn").addEventListener("click", () => {
    let modal = document.getElementById("ownerLoginModal");
    if (!modal) {
      modal = document.createElement("div");
      modal.id = "ownerLoginModal";
      modal.className = "modal-overlay";
      document.body.appendChild(modal);
      modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
    }
    modal.innerHTML = `
      <div class="modal-box" style="max-width:340px;">
        <h2>Owner login</h2>
        <p class="desc">Log in to unlock Admin. First time here? Logging in with the owner email creates the account automatically.</p>
        <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">
          <input type="email" id="ownerLoginEmail" placeholder="Email" style="width:100%;" />
          <input type="password" id="ownerLoginPassword" placeholder="Password" style="width:100%;" />
          <div class="err" id="ownerLoginErr" style="min-height:16px;"></div>
          <button class="btn" id="ownerLoginSubmit">Log in</button>
          <button class="btn ghost small" id="ownerLoginClose">Cancel</button>
        </div>
      </div>`;
    modal.style.display = "flex";
    document.getElementById("ownerLoginClose").addEventListener("click", () => { modal.style.display = "none"; });
    document.getElementById("ownerLoginSubmit").addEventListener("click", async () => {
      const email = document.getElementById("ownerLoginEmail").value.trim();
      const password = document.getElementById("ownerLoginPassword").value;
      const errEl = document.getElementById("ownerLoginErr");
      errEl.textContent = "";
      if (!email || !password) { errEl.textContent = "Enter both email and password."; return; }
      try {
        const { error: signInErr } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (signInErr) {
          // First-time setup: only the designated owner email is allowed to self-register.
          if (email.toLowerCase() !== OWNER_EMAIL.toLowerCase()) {
            errEl.textContent = "Invalid login.";
            return;
          }
          const { error: signUpErr } = await supabaseClient.auth.signUp({ email, password });
          if (signUpErr) { errEl.textContent = signUpErr.message; return; }
        }
        await ensureAuthSession();
        modal.style.display = "none";
        renderOwnerLoginUI();
        toast(IS_OWNER ? "Logged in as owner" : "Logged in");
      } catch (err) {
        errEl.textContent = err.message || "Login failed";
      }
    });
  });
}

// App entry point: establish (or restore) a session before anything else
// runs, since every data call needs USER_ID / the session's access token.
(async function boot() {
  try {
    await ensureAuthSession();
  } catch (err) {
    content.innerHTML = `
      <div class="empty">
        <div class="big">Couldn't start a session</div>
        <p class="desc">${esc(err.message || String(err))}</p>
        <p class="desc">If you're the owner: make sure "Anonymous sign-ins" is enabled in your Supabase project's Authentication settings.</p>
      </div>`;
    return;
  }
  renderOwnerLoginUI();
  // Speed: start downloading every saved calculator state right away, in
  // parallel with everything else below.
  preloadCalcStates();
  loadCommander();
  document.querySelectorAll("button[data-tab]").forEach((x) => {
    x.classList.toggle("active", x.dataset.tab === TAB);
  });
  const categoriesLoaded = loadBuffCategories();
  if (TAB === "overview") {
    // The Dashboard loads what it needs itself, so it doesn't have to wait
    // for the category list first.
    categoriesLoaded.catch(() => {});
    render();
  } else {
    categoriesLoaded.then(render);
  }
})();
</script>
