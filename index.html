<script>
// Phones: text 2 px smaller and small boxes 4 px smaller. Later the same day the owner asked for
// the text 2 px bigger again on every page but the Dashboard: the smaller text now
// applies inside the Dashboard (.dash-fit) only, the smaller boxes still everywhere.
// Built once from the page's own CSS, so
// every rule follows by itself, also ones added later: on screens up to 700 px each
// font size set in px is 2 px smaller (not under 10 px; calc / clamp sizes too) and
// each height / min-height from 24 to 100 px is 4 px smaller (square widths with it),
// pictures excepted. The new rules keep the old ones' order and importance, so the
// same rule still wins. Sizes typed on elements (style="font-size:13px") follow too.
(function phoneCompact() {
  try {
    // The two sheets are kept in this browser, keyed by everything they're made
    // from (the page's CSS, this script, the browser), so later loads skip the
    // ~3,900-rule walk (~150 ms on a slow phone). Any change builds them again.
    const CACHE = "css_compact_v1";
    const hash = (str) => {
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < str.length; i++) { const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (h2 >>> 0).toString(36) + (h1 >>> 0).toString(36);
    };
    let key = null, hit = null;
    try {
      // Only inline sheets, versioned links (app.css?v=…) or ones the walk can't read are cached.
      let src = String(phoneCompact), ok = true;
      // app.css didn't load (offline, error page): build from what is there but
      // don't save or reuse, so a later good load isn't given the empty sheets.
      const goodLink = (sh) => { try { return !!sh.cssRules && sh.cssRules.length >= 500; } catch (e) { return false; } };
      const appLink = document.querySelector('link[rel="stylesheet"][href*="app.min.css"]');
      if (appLink && !(appLink.sheet && goodLink(appLink.sheet))) ok = false;
      for (const sh of ok ? document.styleSheets : []) {
        const o = sh.ownerNode;
        if (o && o.tagName === "STYLE") { src += "\u0000S" + o.textContent; continue; }
        // app.css?v=<hash>: the link names its contents, so the link is the key.
        if (o && o.tagName === "LINK" && /[?&]v=[0-9a-f]+/.test(sh.href || "")) { if (!goodLink(sh)) { ok = false; break; } src += "\u0000V" + sh.href; continue; }
        let readable = false; try { readable = !!sh.cssRules; } catch (e) { readable = false; }
        if (readable) { ok = false; break; }
        src += "\u0000L" + (sh.href || "");
      }
      if (ok) {
        key = `${navigator.userAgent}|${src.length}|${hash(src)}`;
        const c = JSON.parse(localStorage.getItem(CACHE) || "null");
        if (c && c.k === key && typeof c.pc === "string" && typeof c.big === "string") hit = c;
      }
    } catch (e) { hit = null; }
    if (hit) {
      for (const [id, text] of [["phoneCompact", hit.pc], ["pcBigger", hit.big]]) { const st = document.createElement("style"); st.id = id; st.textContent = text; document.head.appendChild(st); }
      return;
    }
    const FONT = 2, BOX = 4, MIN_FONT = 10;
    const NO_BOX = /img|svg|icon|(^|[\s.#>~+-])(ic|pic|ring|logo|thumb|avatar|photo|portrait|emoji)([\s.:#>~+,\-\]]|$)|::?(before|after)|scrollbar/i;
    const pxOf = (v) => { const m = /^(-?\d+(?:\.\d+)?)px$/.exec(String(v || "").trim()); return m ? Number(m[1]) : null; };
    const fontOf = (v) => {
      const n = pxOf(v);
      if (n != null) return n > MIN_FONT ? `${Math.max(MIN_FONT, Math.round((n - FONT) * 100) / 100)}px` : null;
      if (/px/.test(v) && /^(calc|clamp|max|min)\(/.test(String(v).trim())) return `max(${MIN_FONT}px, calc(${v} - ${FONT}px))`;
      return null;
    };
    const boxOf = (v) => { const n = pxOf(v); return n != null && n >= 24 && n <= 100 ? `${n - BOX}px` : null; };
    const never = (cond) => { const m = /min-width:\s*(\d+)px/.exec(cond || ""); return !!m && Number(m[1]) > 700; };
    // A selector list, each part scoped to the Dashboard (commas inside (), [] or quotes kept).
    const DASH = ".dash-fit";
    const splitSel = (sel) => {
      const out = []; let depth = 0, q = null, cur = "";
      for (const ch of sel) {
        if (q) { if (ch === q) q = null; cur += ch; continue; }
        if (ch === '"' || ch === "'") { q = ch; cur += ch; continue; }
        if (ch === "(" || ch === "[") depth++;
        else if (ch === ")" || ch === "]") depth--;
        if (ch === "," && depth === 0) { out.push(cur.trim()); cur = ""; } else cur += ch;
      }
      if (cur.trim()) out.push(cur.trim());
      return out;
    };
    const onDash = (sel) => splitSel(sel).map((x) => (x.includes(DASH) ? x : /^(html|body|:root)\b/i.test(x) ? null : `${DASH} ${x}`)).filter(Boolean).join(", ");
    const blocks = []; // [{ conds: [..], rules: [..] }] in the original order
    const push = (conds, text) => {
      const last = blocks[blocks.length - 1], key = conds.join("|");
      if (last && last.key === key) last.rules.push(text); else blocks.push({ key, conds, rules: [text] });
    };
    const walk = (rules, conds) => {
      for (const r of rules) {
        if (r.type === 1) {
          const st = r.style, d = [];
          const imp = (k) => (st.getPropertyPriority(k) ? " !important" : "");
          const f = fontOf(st.getPropertyValue("font-size"));
          if (f) { const ds = onDash(r.selectorText); if (ds) push(conds, `${ds}{font-size:${f}${imp("font-size")}}`); }
          if (!NO_BOX.test(r.selectorText)) {
            const hv = st.getPropertyValue("height"), h = boxOf(hv), mh = boxOf(st.getPropertyValue("min-height"));
            if (h) d.push(`height:${h}${imp("height")}`);
            if (mh) d.push(`min-height:${mh}${imp("min-height")}`);
            if (h && pxOf(st.getPropertyValue("width")) === pxOf(hv)) d.push(`width:${h}${imp("width")}`);
            if (h && pxOf(st.getPropertyValue("min-width")) === pxOf(hv)) d.push(`min-width:${h}${imp("min-width")}`);
          }
          if (d.length) push(conds, `${r.selectorText}{${d.join(";")}}`);
        } else if (r.type === 4) {
          if (!never(r.conditionText)) walk(r.cssRules, conds.concat(`@media ${r.conditionText}`));
        } else if (r.type === 12) {
          walk(r.cssRules, conds.concat(`@supports ${r.conditionText}`));
        }
      }
    };
    for (const sh of document.styleSheets) { let rs = null; try { rs = sh.cssRules; } catch (e) { rs = null; } if (rs) walk(rs, []); }
    // sizes typed on elements
    const inl = [];
    for (let n = 12; n <= 28; n += 0.5) {
      const v = String(n);
      inl.push(`${DASH} [style*="font-size:${v}px"],${DASH} [style*="font-size: ${v}px"]{font-size:${Math.max(MIN_FONT, n - FONT)}px !important}`);
    }
    const css = blocks.map((b) => b.conds.reduceRight((inner, c) => `${c}{${inner}}`, b.rules.join("\n"))).join("\n") + "\n" + inl.join("\n");
    const el = document.createElement("style");
    el.id = "phoneCompact";
    el.textContent = `@media (max-width: 700px){\n${DASH}{font-size:14px}\n${css}\n}`;
    document.head.appendChild(el);

    // Wider screens (PC, tablets): text 2 px bigger on every page but the Dashboard.
    // Every rule that sets a font size gets a copy under
    // html:not(.on-dash) (render() sets .on-dash on the Dashboard): px sizes + 2,
    // other values unchanged, so the rules still win in the same order as before.
    const PC = "html:not(.on-dash)";
    const phoneOnly = (cond) => { const m = /max-width:\s*(\d+)px/.exec(cond || ""); return !!m && Number(m[1]) <= 700; };
    const onPc = (sel) => splitSel(sel).map((x) => (/^html\b/i.test(x) ? x.replace(/^html/i, PC) : /^:root\b/.test(x) ? x.replace(/^:root/, PC) : `${PC} ${x}`)).join(", ");
    const bigOf = (v) => {
      const n = pxOf(v);
      if (n != null) return `${Math.round((n + FONT) * 100) / 100}px`;
      if (/px/.test(v) && /^(calc|clamp|max|min)\(/.test(String(v).trim())) return `calc(${v} + ${FONT}px)`;
      return v;
    };
    const pcBlocks = [];
    const pcPush = (conds, text) => {
      const last = pcBlocks[pcBlocks.length - 1], key = conds.join("|");
      if (last && last.key === key) last.rules.push(text); else pcBlocks.push({ key, conds, rules: [text] });
    };
    const pcWalk = (rules, conds) => {
      for (const r of rules) {
        if (r.type === 1) {
          const v = r.style.getPropertyValue("font-size");
          if (v) pcPush(conds, `${onPc(r.selectorText)}{font-size:${bigOf(v)}${r.style.getPropertyPriority("font-size") ? " !important" : ""}}`);
        } else if (r.type === 4) {
          if (!phoneOnly(r.conditionText)) pcWalk(r.cssRules, conds.concat(`@media ${r.conditionText}`));
        } else if (r.type === 12) {
          pcWalk(r.cssRules, conds.concat(`@supports ${r.conditionText}`));
        }
      }
    };
    for (const sh of document.styleSheets) { if (sh.ownerNode === el) continue; let rs = null; try { rs = sh.cssRules; } catch (e) { rs = null; } if (rs) pcWalk(rs, []); }
    const pcInl = [];
    for (let n = 9; n <= 28; n += 0.5) pcInl.push(`${PC} [style*="font-size:${n}px"],${PC} [style*="font-size: ${n}px"]{font-size:${n + FONT}px !important}`);
    const pcEl = document.createElement("style");
    pcEl.id = "pcBigger";
    pcEl.textContent = `@media (min-width: 701px){\n${pcBlocks.map((b) => b.conds.reduceRight((inner, c) => `${c}{${inner}}`, b.rules.join("\n"))).join("\n")}\n${pcInl.join("\n")}\n}`;
    document.head.appendChild(pcEl);
    if (key) { try { localStorage.setItem(CACHE, JSON.stringify({ k: key, pc: el.textContent, big: pcEl.textContent })); } catch (e) { /* storage full / blocked: built again next time */ } }
  } catch (e) { /* the page still works at the old sizes */ }
})();
</script>
<style id="fitFix">
  /* Fit fixes for every screen. This sheet
     sits after the phoneCompact script on purpose: phoneCompact / pcBigger
     don't copy it (so these sizes are final), and it comes after their
     sheets, so it wins at the same specificity. */
  /* The top menu is the same size on every page (pcBigger made it 2 px bigger
     off the Dashboard, so it ran onto a second line at 1024 / 1280 px). */
  @media (min-width:761px){
    nav.topnav .topnav-group-btn{ font-size:12.5px; }
  }
  @media (min-width:761px) and (max-width:1199px){
    nav.topnav .topnav-group-btn{ padding:8px 6px; gap:4px; font-size:12px; }
    nav.topnav .brand{ margin-inline-end:6px; }
  }
  @media (min-width:761px) and (max-width:1060px){
    nav.topnav .brand h1{ display:none; }
  }
  /* Right-to-left: an English pack name in a calendar bar or the pack window's
     title box is cut at its end (with "…"), not at its first letters. */
  html[dir="rtl"] .pcl-bb, html[dir="rtl"] .pk-ed-bar input{ unicode-bidi:plaintext; }
  /* Calendar bars: a block box, so a long name ends in "…" (a flex box can't show it). */
  .pcl-bb{ display:block; line-height:24px; }
  @media (max-width:700px){
    /* Tap targets at least 32 px (the 4 px phone trim left these at 24 - 29). */
    .g1-fold, .sa-btn, .btn.small, .btn.ghost, .t12x-maxall, .b3-a, .bp-chests, .pur-seg button, .rl-lnk, .t12x-step select, details > summary.meta{ min-height:32px !important; }
    .rfa-x{ width:32px; height:32px; }

    .pks-i{ position:relative; }
    .pks-i::after{ content:""; position:absolute; inset:-9px; }
    .site-footer a{ display:inline-block; padding:8px 2px; }
    .pcl-bb{ line-height:20px; }
    /* Dashboard: no text under 11 px (its own 2 px trim stopped at 10). */
    .dash-fit .qk-chip span, .dash-fit .sa-s, .dash-fit .sa-chip, .dash-fit .rc-mini-sh, .dash-fit .rc-mini-w, .dash-fit .sa-card .btn.small, .dash-fit .roster-pick .meta{ font-size:11px !important; }
  }
</style>
