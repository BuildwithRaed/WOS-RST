// Opens the tap-to-edit detail modal for a skin or island card. For plain
// skins this is just an Owned toggle (+ Count in max, when applicable);
// for islands (isIsland=true) it's a level dropdown, and owned is derived
// automatically from level > 0.
// Opens the tap-to-edit detail modal for a skin or island, as position
// `index` within `list` (the currently filtered/visible cards). Swiping the
// card left/right moves to the next/previous item without closing the
// modal - matching how the in-game gallery browses items.
function openGalleryDetailModal(list, index, { isIsland = false, onSave }) {
  const item = list[index];
  let modal = document.getElementById("galleryDetailModal");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "galleryDetailModal";
    modal.className = "modal-overlay";
    document.body.appendChild(modal);
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
  }
  const maxLvl = item.max_level ?? 10;
  const lvl = item.current_level ?? 0;
  const goTo = (newIndex) => {
    if (newIndex < 0 || newIndex >= list.length) return;
    openGalleryDetailModal(list, newIndex, { isIsland, onSave });
  };
  modal.innerHTML = `
    <div class="modal-box" id="galleryModalBox" style="max-width:300px; text-align:center; touch-action:pan-y; padding:18px;">
      ${!isIsland ? `<div class="meta" style="font-size:11px; margin-bottom:8px;">${index + 1} / ${list.length} &nbsp;\u2022&nbsp; swipe to browse</div>` : ""}
      ${isIsland ? "" : `<div class="thumb" style="width:140px; height:140px; margin:0 auto 10px; border-radius:10px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; overflow:hidden; padding:6%;">
        ${item.image_url ? `<img src="${esc(item.image_url)}" alt="" style="width:100%; height:100%; object-fit:contain;" />` : `<div class="ph" style="font-size:28px; color:var(--muted); font-weight:600;">${esc(item.name[0])}</div>`}
      </div>`}
      <h2 style="margin-bottom:${isIsland ? "14px" : "4px"}; font-size:${isIsland ? "15px" : "16px"};">${esc(item.name)}</h2>
      ${isIsland ? "" : `<p class="desc" style="margin-bottom:16px;">${esc(item.category || "")}</p>`}
      ${isIsland
        ? `<div style="display:flex; align-items:center; gap:10px; text-align:left;">
             <div style="flex:1;">
               <label style="font-size:11px; display:block; margin-bottom:4px;">Level</label>
               <select id="galleryModalLevel" style="width:100%;">
                 ${Array.from({ length: maxLvl + 1 }, (_, i) => `<option value="${i}" ${i === lvl ? "selected" : ""}>${i === 0 ? "0 (not built)" : `Lv. ${i}`}</option>`).join("")}
               </select>
             </div>
             <label style="display:flex; align-items:center; gap:6px; cursor:pointer; padding-top:18px; flex-wrap:nowrap;">
               <input type="checkbox" id="galleryModalIslandOwned" ${item.owned ? "checked" : ""} />
               <span class="meta" style="font-size:12px;">Owned</span>
             </label>
           </div>`
        : `<button class="btn" id="galleryModalOwnedBtn" style="width:100%; margin-bottom:${item.show_count_toggle ? "10px" : "0"};">${item.owned ? "\u2713 Owned \u2014 tap to unown" : "Mark as owned"}</button>
           ${item.show_count_toggle ? `<label style="display:flex; align-items:center; gap:6px; justify-content:center; cursor:pointer; flex-wrap:nowrap;">
             <input type="checkbox" id="galleryModalCountInMax" ${item.count_in_max !== false ? "checked" : ""} />
             <span class="meta" style="font-size:12px;">Count toward max totals</span>
           </label>` : ""}`
      }
      ${isIsland
        ? `<button class="btn ghost small" id="galleryModalClose" style="width:100%; margin-top:14px;">Close</button>`
        : `<div style="display:flex; gap:8px; margin-top:16px;">
             <button class="btn ghost small" id="galleryModalPrev" style="flex:1;" ${index === 0 ? "disabled" : ""}>&#8592; Prev</button>
             <button class="btn ghost small" id="galleryModalClose" style="flex:1;">Close</button>
             <button class="btn ghost small" id="galleryModalNext" style="flex:1;" ${index === list.length - 1 ? "disabled" : ""}>Next &#8594;</button>
           </div>`
      }
    </div>`;
  modal.style.display = "flex";
  document.getElementById("galleryModalClose").addEventListener("click", () => { modal.style.display = "none"; });

  if (!isIsland) {
    document.getElementById("galleryModalPrev").addEventListener("click", () => goTo(index - 1));
    document.getElementById("galleryModalNext").addEventListener("click", () => goTo(index + 1));

    // Swipe left/right on the card to move between items (skins only -
    // islands are edited one at a time with no browsing). Touch-only;
    // vertical scrolling still works normally via touch-action:pan-y above.
    const box = document.getElementById("galleryModalBox");
    let touchStartX = null, touchStartY = null;
    box.addEventListener("touchstart", (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    box.addEventListener("touchend", (e) => {
      if (touchStartX == null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      touchStartX = null;
      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
        if (dx < 0) goTo(index + 1);
        else goTo(index - 1);
      }
    }, { passive: true });
  }

  if (isIsland) {
    document.getElementById("galleryModalLevel").addEventListener("change", async (e) => {
      const newLvl = Number(e.target.value);
      await onSave(item, { current_level: newLvl });
      item.current_level = newLvl;
    });
    document.getElementById("galleryModalIslandOwned").addEventListener("change", async (e) => {
      await onSave(item, { owned: e.target.checked });
      item.owned = e.target.checked;
    });
  } else {
    document.getElementById("galleryModalOwnedBtn").addEventListener("click", async () => {
      await onSave(item, { owned: !item.owned });
      item.owned = !item.owned;
      goTo(index);
    });
    const cim = document.getElementById("galleryModalCountInMax");
    if (cim) {
      cim.addEventListener("change", async () => {
        await onSave(item, { count_in_max: cim.checked });
        item.count_in_max = cim.checked;
      });
    }
  }
}

let SKIN_FILTER = { search: "", category: "all", ownedFilter: "all" };

// Renders totals-by-bonus-type, filter bar, and the category
// sections of skin cards (click a card to toggle owned status).
async function renderSkinGallery() {
  const [ISLAND_CATEGORIES, allSkinsRaw] = await Promise.all([
    ensureIslandCategories(),
    sb(`skins?user_id=eq.${USER_ID}&select=id,category,name,image_url,bonus_type,bonus_value,bonus_type2,bonus_value2,bonus_type3,bonus_value3,bonus_type4,bonus_value4,owned,display_group,count_in_max,show_count_toggle&order=sort_order.asc`),
  ]);
  const skins = allSkinsRaw.filter(
    (s) => !ISLAND_CATEGORIES.has(s.category) && s.category !== "Facility" && s.category !== "Alliance Tech"
  );
  const CATEGORY_ORDER = ["City Skin", "Frame", "Teleport Skin", "Name Card", "Private Chat", "Chief Profile", "Rally"];
  const categories = [...new Set(skins.map((s) => s.category))].sort((a, b) => {
    const ia = CATEGORY_ORDER.indexOf(a);
    const ib = CATEGORY_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>Skin gallery</h2>
        <div class="sub" id="skinSummaryLine"></div>
      </div>
    </div>
    <div class="stats-row-scroll" id="skinTotals" style="margin-bottom:16px;"></div>
    <div id="skinCatSwitcher"></div>
    <div class="filter-bar" style="margin-bottom:12px;">
      <input id="skinSearch" placeholder="Search skins..." style="flex:1; min-width:160px;" />
      <div class="seg" id="ownedSeg">
        <button data-owned="all" class="active">All</button>
        <button data-owned="owned">Owned</button>
        <button data-owned="not">Not owned</button>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px; margin:0 0 16px;">
      <span class="meta" style="font-size:11px;">GLOBE LEVEL</span>
      <select id="globeLevelSelect" style="width:130px;">
        <option value="0">No Globe</option>
        ${[1, 2, 3, 4, 5, 6].map((n) => `<option value="${n}">${n}</option>`).join("")}
      </select>
    </div>
    <div id="skinSections"></div>
  `;

  if (SKIN_FILTER.category === "all" || !categories.includes(SKIN_FILTER.category)) {
    SKIN_FILTER.category = categories[0] || "all";
  }
  function onSkinCatSelect(cat) {
    SKIN_FILTER.category = cat;
    renderCategorySwitcher(document.getElementById("skinCatSwitcher"), categories, SKIN_FILTER.category, onSkinCatSelect);
    computeAndRender();
  }
  renderCategorySwitcher(document.getElementById("skinCatSwitcher"), categories, SKIN_FILTER.category, onSkinCatSelect);

  const globeLevelSaved = (await loadCalcState("skin_globe_level")) || { level: 0 };
  const globeLevelSelect = document.getElementById("globeLevelSelect");
  globeLevelSelect.value = globeLevelSaved.level;
  const GLOBE_LEVEL_ROMAN = { 1: "I", 2: "II", 3: "III", 4: "IV", 5: "V", 6: "VI" };
  // Extra skins auto-owned at specific globe levels, beyond the matching Frost Sphere.
  const GLOBE_LEVEL_EXTRA_SKINS = {
    2: ["Fireborn Expeditioner"],
    3: ["Gate of Time"],
    5: ["Star Radiance"],
  };
  function namesForGlobeLevel(level) {
    if (!level) return [];
    const roman = GLOBE_LEVEL_ROMAN[level];
    return [`Frost Sphere ${roman}`, ...(GLOBE_LEVEL_EXTRA_SKINS[level] || [])];
  }
  // Every skin tied to the Globe Level selector, across all 6 levels (Frost
  // Sphere I-VI plus the extra per-level unlocks). These are excluded from
  // totals entirely until a globe level is picked, and only the currently
  // selected level's items count afterward (not a theoretical ceiling).
  const ALL_GLOBE_WIRED_NAMES = new Set([
    ...Object.values(GLOBE_LEVEL_ROMAN).map((roman) => `Frost Sphere ${roman}`),
    ...Object.values(GLOBE_LEVEL_EXTRA_SKINS).flat(),
  ]);
  // Regardless of the dropdown, if the user has manually toggled one or more
  // Frost Sphere cards owned directly, the HIGHEST owned tier is what
  // actually counts toward current/max - not necessarily the dropdown value.
  function deriveEffectiveGlobeLevel() {
    let highest = 0;
    for (let level = 1; level <= 6; level++) {
      const roman = GLOBE_LEVEL_ROMAN[level];
      const skin = skins.find((s) => s.name === `Frost Sphere ${roman}`);
      if (skin && skin.owned) highest = level;
    }
    return highest || globeLevelSaved.level;
  }
  globeLevelSelect.addEventListener("change", async (e) => {
    const level = Number(e.target.value);
    const prevLevel = globeLevelSaved.level;
    await saveCalcState("skin_globe_level", { level });
    globeLevelSaved.level = level;

    const changed = [];
    // Un-own whatever the previous level auto-owned.
    if (prevLevel !== level) {
      for (const name of namesForGlobeLevel(prevLevel)) {
        const matchingSkin = skins.find((s) => s.name === name);
        if (matchingSkin && matchingSkin.owned) {
          try {
            await sb(`skins?id=eq.${matchingSkin.id}`, { method: "PATCH", body: JSON.stringify({ owned: false }) });
            matchingSkin.owned = false;
            changed.push(`-${name}`);
          } catch (err) {
            toast(`Couldn't update ${name}`, true);
          }
        }
      }
    }
    // Own whatever the new level auto-owns.
    for (const name of namesForGlobeLevel(level)) {
      const matchingSkin = skins.find((s) => s.name === name);
      if (matchingSkin && !matchingSkin.owned) {
        try {
          await sb(`skins?id=eq.${matchingSkin.id}`, { method: "PATCH", body: JSON.stringify({ owned: true }) });
          matchingSkin.owned = true;
          changed.push(name);
        } catch (err) {
          toast(`Couldn't update ${name}`, true);
        }
      }
    }
    if (changed.length) {
      toast(`Updated: ${changed.join(", ")}`);
      computeAndRender();
    }
  });

  function computeAndRender() {
    const filtered = skins.filter((s) => {
      if (SKIN_FILTER.category !== "all" && s.category !== SKIN_FILTER.category) return false;
      if (SKIN_FILTER.ownedFilter === "owned" && !s.owned) return false;
      if (SKIN_FILTER.ownedFilter === "not" && s.owned) return false;
      if (SKIN_FILTER.search && !s.name.toLowerCase().includes(SKIN_FILTER.search.toLowerCase())) return false;
      return true;
    });

    const ownedCount = skins.filter((s) => s.owned).length;
    document.getElementById("skinSummaryLine").textContent =
      `${ownedCount} / ${skins.length} skins owned \u00b7 tap any skin to view details`;

    // totals by bonus_type: current (owned only) vs max (everything, as if fully owned).
    // Skins sharing a display_group (e.g. Frost Sphere I-VI) are mutually
    // exclusive tiers of the same item, so max only counts the single
    // highest tier per group/stat, not the sum of every tier.
    const STAT_SLOTS = [
      ["bonus_type", "bonus_value"],
      ["bonus_type2", "bonus_value2"],
      ["bonus_type3", "bonus_value3"],
      ["bonus_type4", "bonus_value4"],
    ];
    const totalsByType = {};
    const maxByType = {};
    const maxByGroupType = {}; // { "Frost Sphere|Troops Attack": highestValueSoFar }
    const currentGlobeNames = new Set(namesForGlobeLevel(deriveEffectiveGlobeLevel()));
    for (const s of skins) {
      // Globe-wired skins (Frost Sphere tiers + per-level extras) don't count
      // toward totals at all until a globe level is picked, and only the
      // currently selected level's items count afterward - not every tier.
      if (ALL_GLOBE_WIRED_NAMES.has(s.name) && !currentGlobeNames.has(s.name)) continue;
      const includeInMax = s.count_in_max !== false;
      STAT_SLOTS.forEach(([tk, vk]) => {
        if (s[vk] == null) return;
        const key = s[tk] || "Other";
        const val = Number(s[vk]);
        if (includeInMax) {
          if (s.display_group) {
            const groupKey = `${s.display_group}|${key}`;
            const prevMax = maxByGroupType[groupKey] || 0;
            if (val > prevMax) {
              maxByType[key] = (maxByType[key] || 0) - prevMax + val;
              maxByGroupType[groupKey] = val;
            }
          } else {
            maxByType[key] = (maxByType[key] || 0) + val;
          }
        }
        if (s.owned) totalsByType[key] = (totalsByType[key] || 0) + val;
      });
    }
    const STAT_ORDER = ["Attack", "Defense", "Lethality", "Health"];
    function statOrderIndex(label) {
      const bare = label.replace(/^Troops?\s+/i, "");
      return STAT_ORDER.indexOf(bare);
    }
    const totalEntries = Object.entries(maxByType).sort((a, b) => {
      const ia = statOrderIndex(a[0]);
      const ib = statOrderIndex(b[0]);
      if (ia === -1 && ib === -1) return a[0].localeCompare(b[0]);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
    document.getElementById("skinTotals").innerHTML = totalEntries.length
      ? totalEntries
          .map(([type, maxVal]) => {
            const bare = type.replace(/^Troops?\s+/i, "");
            const label = STAT_ORDER.includes(bare) ? `Troop ${bare}` : type;
            return `<div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">Total ${esc(label)}</div><div class="val" style="font-size:13px;">+${(totalsByType[type] || 0).toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">of max +${maxVal.toFixed(1)}%</div></div>`;
          })
          .join("")
      : `<div class="metric" style="grid-column:1/-1;"><div class="label">Total bonus</div><div class="val">+0%</div><div class="meta" style="font-size:11px; margin-top:2px;">Mark skins as owned to see totals</div></div>`;


    const sections = document.getElementById("skinSections");
    // filtered is already scoped to the one selected category (plus search/
    // owned filters), so this renders a single flat grid - no more
    // per-category panels stacked on top of each other.
    const ordered = [
      ...filtered.filter((s) => !s.show_count_toggle),
      ...filtered.filter((s) => s.show_count_toggle),
    ];
    if (!ordered.length) {
      sections.innerHTML = `<div class="panel"><div class="empty"><div class="big">No skins match your filters.</div></div></div>`;
      return;
    }
    sections.innerHTML = `
      <div class="gallery-grid">
        ${ordered
          .map((s, idx) => {
            const isLastGlobe = s.display_group === "Frost Sphere" && ordered[idx + 1]?.display_group !== "Frost Sphere";
            const isLastNonToggle = !s.show_count_toggle && ordered[idx + 1]?.show_count_toggle;
            return `
          <div class="gallery-card ${s.owned ? "owned" : ""}" data-skin="${s.id}">
            <div class="thumb">
              ${s.image_url ? `<img src="${esc(s.image_url)}" alt="" loading="lazy" />` : `<div class="ph">${esc(s.name[0])}</div>`}
            </div>
            <div class="badge">${esc(s.name)}</div>
            ${s.show_count_toggle ? `<label style="display:flex; align-items:center; justify-content:center; gap:4px; padding:4px 6px; background:var(--panel-2); flex-wrap:nowrap;" onclick="event.stopPropagation()">
              <input type="checkbox" data-countinmax="${s.id}" ${s.count_in_max !== false ? "checked" : ""} style="width:12px; height:12px;" />
              <span class="meta" style="font-size:8.5px;">Count in max</span>
            </label>` : ""}
          </div>${isLastGlobe || isLastNonToggle ? `<div style="grid-column:1/-1; height:1px; background:var(--line); margin:2px 0;"></div>` : ""}`;
          })
          .join("")}
      </div>
    `;

    sections.querySelectorAll("[data-skin]").forEach((el) => {
      el.addEventListener("click", async () => {
        const skin = skins.find((s) => s.id === el.dataset.skin);
        const newOwned = !skin.owned;
        try {
          await sb(`skins?id=eq.${skin.id}`, { method: "PATCH", body: JSON.stringify({ owned: newOwned }) });
          skin.owned = newOwned;
          computeAndRender();
        } catch (err) {
          toast("Couldn't update skin", true);
        }
      });
    });
    sections.querySelectorAll("[data-countinmax]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const skin = skins.find((s) => s.id === cb.dataset.countinmax);
        const newVal = cb.checked;
        try {
          await sb(`skins?id=eq.${skin.id}`, { method: "PATCH", body: JSON.stringify({ count_in_max: newVal }) });
          skin.count_in_max = newVal;
          computeAndRender();
        } catch (err) {
          toast("Couldn't update count in max", true);
        }
      });
    });
    }

  document.getElementById("skinSearch").addEventListener("input", (e) => {
    SKIN_FILTER.search = e.target.value;
    computeAndRender();
  });
  document.getElementById("ownedSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-owned]");
    if (!btn) return;
    SKIN_FILTER.ownedFilter = btn.dataset.owned;
    document.querySelectorAll("#ownedSeg button").forEach((b) => b.classList.toggle("active", b === btn));
    computeAndRender();
  });

  computeAndRender();
}

// VIP 9-12 tier selector + full ATTACK/DEFENSE/LETHALITY/HEALTH
// reference table, using its own dedicated buff_table (not the
// shared master matrix, since it needed a distinct column set).
let VIP_ROWS_CACHE = null; // [{ name, Attack, Defense, Lethality, Health }, ...]
let VIP_SELECTED_INDEX = null;
let EXPERTS_STATE_GLOBAL = null;
// Hero star ascension shard costs: each star has 6 sub-levels (T1..T6).
// Per-star totals 10 / 40 / 115 / 300 / 600 = 1,065 to fully max a hero.
// Star-step curve (fraction of the 5★ max) applied to every generation's 30-step
// Expedition ATK/DEF% ladder. Fit directly against real stored data across many
// generations — this is the more accurate of two curves tested; see the archived
// "precise ratio" derivation (1.0931 / 1.6130 / 1.5319 / 1.4864 / 1.4580 / 1.3544×)
// in the WOS Star Curve Archive spreadsheet for why that alternative was dropped.
const STAR_CURVE = [0.13789, 0.14963, 0.16137, 0.17311, 0.18485, 0.20598, 0.22242, 0.23886, 0.25530, 0.27174, 0.28818, 0.31775, 0.34073, 0.36376, 0.38679, 0.40977, 0.43280, 0.47422, 0.50645, 0.53862, 0.57085, 0.60307, 0.63529, 0.69330, 0.73836, 0.78347, 0.82858, 0.87370, 0.91881, 1];
const HERO_SHARD_CHART = {
  1: [1, 1, 2, 2, 2, 2],
  2: [5, 5, 5, 5, 5, 15],
  3: [15, 15, 15, 15, 15, 40],
  4: [40, 40, 40, 40, 40, 100],
  5: [100, 100, 100, 100, 100, 100],
};
// current = { star: 0-5, sub: 0-6 } -> shards to finish the next star, and to 5★ max.
function heroShardsNeeded(star, sub) {
  let toNext = 0, toMax = 0;
  for (let st = 1; st <= 5; st++) {
    const steps = HERO_SHARD_CHART[st];
    for (let i = 0; i < steps.length; i++) {
      const done = st < star + 1 ? true : st === star + 1 ? i < sub : false;
      if (done) continue;
      toMax += steps[i];
      if (st === star + 1) toNext += steps[i];
    }
  }
  return { toNext, toMax };
}

  return EXPERTS_ROSTER_PROMISE;
}
async function loadExpertsRosterGlobal() {
  const rows = await sb(`experts?select=key,img,skill1,skill2,skill3,skill4,main_stat,main_stat_troop,sort_order&order=sort_order.asc`);
  EXPERTS_IN_ORDER_GLOBAL = rows.map((r) => r.key);
  EXPERT_MAIN_STAT_GLOBAL_MAP = {};
  EXPERT_MAIN_STAT_TROOP_GLOBAL_MAP = {};
  EXPERTS_LIST = [];
  rows.forEach((r) => {
    EXPERT_MAIN_STAT_GLOBAL_MAP[r.key] = r.main_stat;
    if (r.main_stat_troop) EXPERT_MAIN_STAT_TROOP_GLOBAL_MAP[r.key] = r.main_stat_troop;
    const skills = [r.skill1, r.skill2, r.skill3, r.skill4].filter(Boolean);
    if (r.img && skills.length === 4) {
      EXPERTS_LIST.push({ key: r.key, img: r.img, skills });
    }
  });
}

  if (EXPERTS_STATE_GLOBAL) return;
  const [, savedExperts, savedUnlocked, affinityRows, skillRows] = await Promise.all([

    sb(`expert_skill_nodes?select=expert,skill,level,stat_type,stat_value&expert=in.(Romulus,Gareth)&stat_type=not.is.null&order=sort_order`),
  ]);
  EXPERTS_STATE_GLOBAL = savedExperts || {};
  EXPERTS_UNLOCKED_GLOBAL = savedUnlocked || {};
  EXPERT_AFFINITY_CACHE_GLOBAL = {};
  affinityRows.forEach((r) => {
    if (!EXPERT_AFFINITY_CACHE_GLOBAL[r.expert]) EXPERT_AFFINITY_CACHE_GLOBAL[r.expert] = [];
    EXPERT_AFFINITY_CACHE_GLOBAL[r.expert].push(r);
  });
  EXPERT_TROOP_SKILL_CACHE_GLOBAL = {};
  skillRows.forEach((r) => {
    const key = `${r.expert}|${r.skill}`;
    if (!EXPERT_TROOP_SKILL_CACHE_GLOBAL[key]) EXPERT_TROOP_SKILL_CACHE_GLOBAL[key] = [];
    EXPERT_TROOP_SKILL_CACHE_GLOBAL[key].push(r);
  });
}
// Same logic as the Experts page's computeBaseTroopStats(): all 10 experts'
// level-based base stats, plus Romulus's Last Line & Spirit of Aeetis and
// Gareth's Porcupine & Undefeated Will skills. Troop-agnostic (same bonus
// applies to all troop types).
function computeExpertsTroopStatsGlobal(useMax) {
  const totals = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
  const ALL_EXPERTS = EXPERTS_LIST.map((e) => e.key);
  ALL_EXPERTS.forEach((hero) => {
    if (EXPERTS_UNLOCKED_GLOBAL && EXPERTS_UNLOCKED_GLOBAL[hero] === false) return;
    const rows = (EXPERT_AFFINITY_CACHE_GLOBAL && EXPERT_AFFINITY_CACHE_GLOBAL[hero]) || [];
    if (!rows.length) return;
    let row;
    if (useMax) {
      row = rows[rows.length - 1];
    } else {
      const lvl = EXPERTS_STATE_GLOBAL[hero] ? EXPERTS_STATE_GLOBAL[hero].current : 0;
      row = rows.find((r) => r.level === lvl);
    }
    if (row && row.stat_type) {
      row.stat_type.split(",").forEach((statName) => {
        if (totals[statName] != null) totals[statName] += Number(row.stat_value) || 0;
      });
    }
  });
  [
    ["Romulus", "Last Line"],
    ["Romulus", "Spirit of Aeetis"],
    ["Gareth", "Porcupine"],
    ["Gareth", "Undefeated Will"],
  ].forEach(([hero, skill]) => {
    if (EXPERTS_UNLOCKED_GLOBAL && EXPERTS_UNLOCKED_GLOBAL[hero] === false) return;
    const rows = (EXPERT_TROOP_SKILL_CACHE_GLOBAL && EXPERT_TROOP_SKILL_CACHE_GLOBAL[`${hero}|${skill}`]) || [];
    if (!rows.length) return;
    let row;
    if (useMax) {
      row = rows[rows.length - 1];
    } else {
      const st = EXPERTS_STATE_GLOBAL[hero] && EXPERTS_STATE_GLOBAL[hero].skills && EXPERTS_STATE_GLOBAL[hero].skills[skill];
      const cur = st ? st.current : 0;
      let match = null;
      rows.forEach((r) => {
        if (r.level <= cur) match = r;
      });
      row = match;
    }
    if (row && row.stat_type) {
      row.stat_type.split(",").forEach((statName) => {
        if (totals[statName] != null) totals[statName] += Number(row.stat_value) || 0;
      });
    }
  });
  return totals;
}

// ---- Experts Research (Dashboard wiring) ----
// Mirrors the logic in renderExpertsResearchPage(): general experts'
// rotation+main stat apply to all 3 troop types; Gareth's main stat is
// Lancers-only, Justus's is Infantry-only. Marksman gets general only.
let EXPERTS_RESEARCH_NODES_GLOBAL = null; // { expert: { pathNum: [rows] } }
let EXPERTS_RESEARCH_STATE_GLOBAL = null; // saved current/desired per expert/path
let EXPERTS_RESEARCH_UNLOCKED_GLOBAL = null;
async function ensureExpertsResearchDataGlobal() {
  if (EXPERTS_RESEARCH_NODES_GLOBAL) return;
  const [, rows, savedResearch, savedResearchUnlocked] = await Promise.all([
    ensureExpertsRosterGlobal(),
    sb(`expert_research_nodes?select=expert,path_number,level,stat_type,stat_value&order=sort_order`),
    loadCalcState("experts_research"),
    loadCalcState("experts_research_unlocked"),
  ]);
  EXPERTS_RESEARCH_NODES_GLOBAL = {};
  rows.forEach((r) => {
    if (!EXPERTS_RESEARCH_NODES_GLOBAL[r.expert]) EXPERTS_RESEARCH_NODES_GLOBAL[r.expert] = {};
    if (!EXPERTS_RESEARCH_NODES_GLOBAL[r.expert][r.path_number]) EXPERTS_RESEARCH_NODES_GLOBAL[r.expert][r.path_number] = [];
    EXPERTS_RESEARCH_NODES_GLOBAL[r.expert][r.path_number].push(r);
  });
  EXPERTS_RESEARCH_STATE_GLOBAL = savedResearch || {};
  EXPERTS_RESEARCH_UNLOCKED_GLOBAL = savedResearchUnlocked || {};
}
function expertsResearchPathNumbersGlobal(expert) {
  return Object.keys((EXPERTS_RESEARCH_NODES_GLOBAL && EXPERTS_RESEARCH_NODES_GLOBAL[expert]) || {})
    .map(Number)
    .sort((a, b) => a - b);
}
function expertsResearchPathCostGlobal(expert, pathNum, fromLevel, toLevel) {
  const pathRows = ((EXPERTS_RESEARCH_NODES_GLOBAL && EXPERTS_RESEARCH_NODES_GLOBAL[expert]) || {})[pathNum] || [];
  const stats = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
  pathRows.forEach((r) => {
    if (r.level > fromLevel && r.level <= toLevel) {
      if (stats[r.stat_type] != null) stats[r.stat_type] += Number(r.stat_value) || 0;
    }
  });
  const mainStat = EXPERT_MAIN_STAT_GLOBAL_MAP[expert];
  if (mainStat && stats[mainStat] != null) {
    const clampedFrom = Math.max(0, Math.min(200, fromLevel));
    const clampedTo = Math.max(0, Math.min(200, toLevel));
    const levelsCrossed = Math.max(0, clampedTo - clampedFrom);
    let rate = 0.01;
    if (expert === "Gareth" || expert === "Justus") {
      rate = pathNum <= 3 ? 0.03 : 0.05;
    }
    stats[mainStat] += levelsCrossed * rate;
  }
  return stats;
}
function expertsResearchIsUnlockedGlobal(expert) {
  return EXPERTS_RESEARCH_UNLOCKED_GLOBAL && EXPERTS_RESEARCH_UNLOCKED_GLOBAL[expert] === false ? false : true;
}
// calcTroop: "Infantry" | "Lancer" | "Marksman". Returns {ATK,DEF,DMG,HP}.
function computeExpertsResearchTroopStatsGlobal(calcTroop, useMax) {
  const totals = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
  if (!EXPERTS_RESEARCH_NODES_GLOBAL) return totals;
  const includeExperts = new Set(EXPERTS_IN_ORDER_GLOBAL.filter((e) => e !== "Gareth" && e !== "Justus"));
  if (calcTroop === "Infantry") includeExperts.add("Justus");
  if (calcTroop === "Lancer") includeExperts.add("Gareth");
  includeExperts.forEach((expert) => {
    if (!expertsResearchIsUnlockedGlobal(expert)) return;
    expertsResearchPathNumbersGlobal(expert).forEach((p) => {
      if (useMax) {
        const stats = expertsResearchPathCostGlobal(expert, p, 0, 200);
        Object.keys(stats).forEach((k) => (totals[k] += stats[k]));
      } else {
        const st = (EXPERTS_RESEARCH_STATE_GLOBAL[expert] || {})[p] || { current: 0 };
        const stats = expertsResearchPathCostGlobal(expert, p, 0, st.current);
        Object.keys(stats).forEach((k) => (totals[k] += stats[k]));
      }
    });
  });
  return totals;
}

async function ensureVipData() {
  if (!VIP_ROWS_CACHE) {
    let [table] = await sb(`buff_tables?name=eq.VIP Tier&user_id=eq.${USER_ID}&select=id`);
    if (!table) {
      VIP_ROWS_CACHE = [];
    } else {
      const [columns, rows] = await Promise.all([
        sb(`buff_columns?table_id=eq.${table.id}&select=id,name&order=sort_order.asc`),
        sb(`buff_rows?table_id=eq.${table.id}&select=id,name,sort_order,buff_cells(value,column_id)&order=sort_order.asc`),
      ]);
      const colNameById = Object.fromEntries(columns.map((c) => [c.id, c.name]));
      VIP_ROWS_CACHE = rows.map((r) => {
        const entry = { name: r.name };
        r.buff_cells.forEach((c) => {
          if (c.value == null) return;
          entry[colNameById[c.column_id]] = Number(c.value);
        });
        return entry;
      });
    }
  }
  // Always re-read the saved tier (not just once) so switching VIP tier on
  // its own page is reflected the next time the dashboard renders.
  if (VIP_ROWS_CACHE.length) {
    const saved = await loadCalcState("vip_tier");
    VIP_SELECTED_INDEX = VIP_ROWS_CACHE.length - 1;
    if (saved) {
      const byName = VIP_ROWS_CACHE.findIndex((r) => r.name === saved.name);
      if (byName !== -1) VIP_SELECTED_INDEX = byName;
      else if (typeof saved.index === "number" && saved.index >= 0 && saved.index < VIP_ROWS_CACHE.length) VIP_SELECTED_INDEX = saved.index;
    }
  }
}

// FACILITY PAGE (under Extra Bonus)
// A reference table of every known facility building (like VIP's
// full reference), plus clickable owned/not-owned cards (like the
// Islands page) backed by the same `skins` table, category='Facility'.
// ============================================================
// ============================================================
// ALLIANCE TECH PAGE (under Extra Bonus)
// 16 research items (Infantry/Lancers/Marksman/Troops x Attack/
// Defense/Lethality/Health), each leveled 0-5 at 1% per level.
// Backed by the `skins` table, category='Alliance Tech'.
// ============================================================
// ============================================================
// HEROES PAGE (under Extra Bonus) - Jero and Natalia, both shown
// together as stacked star-level sections (0-5 stars per stat,
// scaled linearly from each stat's max value). Star selections are
// persisted via calc_state, separate from the static max reference
// stored in buff_cells.
// ============================================================
async function renderHeroStarSection(heroName, displayName, imageUrl, containerId) {
  await ensureBuffTable();
  if (!BUFF_CATEGORIES.some((c) => c.name === heroName)) await loadBuffCategories();
  const cat = BUFF_CATEGORIES.find((c) => c.name === heroName);
  const el = document.getElementById(containerId);
  if (!cat) {
    el.innerHTML = `<div class="panel"><div class="empty">${esc(displayName)} category not found.</div></div>`;
    return;
  }
  const rows = await sb(`buff_rows?table_id=eq.${BUFF_TABLE_ID}&select=id,name,sort_order,buff_cells(value,column_id)&order=sort_order.asc`);
  const STAT_LABELS = { ATT: "Attack", DEF: "Defense", DMG: "Lethality", HP: "Health" };
  const seenStats = new Set();
  const statRows = rows
    .map((r) => {
      const cell = r.buff_cells.find((c) => c.column_id === cat.columns[0].id);
      const statKey = r.name.split(" ").pop(); // ATT/DEF/DMG/HP
      return { id: r.id, statKey, max: cell && cell.value != null ? Number(cell.value) : null };
    })
    .filter((r) => r.max != null)
    .filter((r) => {
      // collapse Infantry/Lancers/Marksman duplicates of the same stat into one "Troops X" row
      if (seenStats.has(r.statKey)) return false;
      seenStats.add(r.statKey);
      return true;
    })
    .map((r) => ({ id: r.id, name: `Troops ${STAT_LABELS[r.statKey] || r.statKey}`, max: r.max }));

  const saved = (await loadCalcState(`hero_stars_${heroName.toLowerCase()}`)) || {};
  const sharedKey = "__shared__";
  const stars = saved[sharedKey] ?? 5;

  el.innerHTML = `
    <div class="panel">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:4px;">
        ${imageUrl ? `<img src="${esc(imageUrl)}" alt="" style="width:48px; height:48px; object-fit:cover; border-radius:8px; border:1px solid var(--line);" loading="lazy" />` : ""}
        <h2 style="margin:0;">${esc(displayName)}</h2>
      </div>
      <p class="desc">Click a star to set your current level (0\u20135).</p>
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
        <div id="heroStarRow-${esc(heroName)}" style="display:flex; gap:3px;">
          ${[1, 2, 3, 4, 5]
            .map(
              (n) =>
                `<span data-starbtn="${n}" style="cursor:pointer; font-size:24px; color:${n <= stars ? "var(--ice)" : "var(--line)"};">&#9733;</span>`
            )
            .join("")}
        </div>
        <span class="meta" style="font-size:12px;">${stars} / 5 stars</span>
      </div>
      <div class="stats-row-scroll" id="heroStatCards-${esc(heroName)}"></div>
    </div>
  `;

  const starRow = document.getElementById(`heroStarRow-${heroName}`);
  const cardsEl = document.getElementById(`heroStatCards-${heroName}`);

  function renderCards(curStars) {
    cardsEl.innerHTML = statRows
      .map((r) => {
        const cur = (r.max / 5) * curStars;
        const needed = r.max - cur;
        return `<div class="metric"><div class="label">${esc(r.name)}</div><div class="val">+${cur.toFixed(1)}%</div><div class="meta" style="font-size:11px; margin-top:2px;">${needed > 0 ? `+${needed.toFixed(1)}% needed for max` : "Maxed"}</div></div>`;
      })
      .join("");
  }
  renderCards(stars);

  starRow.querySelectorAll("[data-starbtn]").forEach((star) => {
    star.addEventListener("click", async () => {
      const n = Number(star.dataset.starbtn);
      const current = saved[sharedKey] ?? 5;
      const newStars = current === n ? n - 1 : n;
      starRow.querySelectorAll("[data-starbtn]").forEach((s) => {
        s.style.color = Number(s.dataset.starbtn) <= newStars ? "var(--ice)" : "var(--line)";
      });
      starRow.nextElementSibling.textContent = `${newStars} / 5 stars`;
      renderCards(newStars);
      saved[sharedKey] = newStars;
      await saveCalcState(`hero_stars_${heroName.toLowerCase()}`, saved);
    });
  });
}

let RESEARCH_SPEED_PCT = 0;
let RESEARCH_SPEEDUP_MINUTES = 0;
async function ensureResearchSpeedData() {
  const saved = await loadCalcState("research_speed");
  RESEARCH_SPEED_PCT = (saved && typeof saved.pct === "number") ? saved.pct : 0;
  const savedSpeedup = await loadCalcState("research_speedup_minutes");
  RESEARCH_SPEEDUP_MINUTES = (savedSpeedup && typeof savedSpeedup.minutes === "number") ? savedSpeedup.minutes : 0;
}
// Applies both the % speed buff and a banked speedup-item time deduction.
function applyResearchSpeed(rawHours) {
  const afterPct = rawHours / (1 + RESEARCH_SPEED_PCT / 100);
  return Math.max(0, afterPct - RESEARCH_SPEEDUP_MINUTES / 60);
}
// Renders "Research Speed %" and "Speedups" inputs together; reused
// identically on the T11 Helios, T12 Research, and Research Center pages
// since they're the same real buffs/items applied everywhere.

function t12FormatTime(hours) {
  if (!hours) return "0h";
  const d = Math.floor(hours / 24);
  const h = Math.round(hours % 24);
  return d > 0 ? `${d}d ${h}h` : `${h}h`;
}
function formatTimeDHM(hours) {
  if (!hours || hours <= 0) return "0m";
  const totalMinutes = Math.round(hours * 60);
  const d = Math.floor(totalMinutes / 1440);
  const h = Math.floor((totalMinutes % 1440) / 60);
  const m = totalMinutes % 60;
  const parts = [];
  if (d > 0) parts.push(`${d}d`);
  if (h > 0 || d > 0) parts.push(`${h}h`);
  parts.push(`${m}m`);
  return parts.join(" ");
}

async function ensureT12StateData() {
  if (T12_STATE) return;
  const saved = await loadCalcState("t12_research");
  T12_STATE = saved || {};
  T12_TROOPS.forEach((troop) => {
    if (!T12_STATE[troop]) T12_STATE[troop] = {};
    T12_ITEM_DEFS.forEach((def) => {
      if (typeof T12_STATE[troop][def.key] !== "number") T12_STATE[troop][def.key] = 0;
    });
  });
}

function computeT12Stats(troopState) {
  const stats = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
  T12_ITEM_DEFS.forEach((def) => {
    if (!def.stat) return;
    const pct = def.pct || 1;
    stats[def.stat] += (troopState[def.key] || 0) * pct;
  });
  return stats;
}

async function ensureT11StateData() {
  if (!T11_NODES_CACHE) {
    const rows = await sb(`t11_helios_nodes?select=track,troop,level,meat,wood,coal,iron,steel,refined_fc,fc_shard,time_hours,stat,stat_pct&order=troop,sort_order`);
    T11_NODES_CACHE = {};
    rows.forEach((r) => {
      if (!T11_NODES_CACHE[r.troop]) T11_NODES_CACHE[r.troop] = {};
      if (!T11_NODES_CACHE[r.troop][r.track]) T11_NODES_CACHE[r.troop][r.track] = [];
      T11_NODES_CACHE[r.troop][r.track].push(r);
    });
  }
  if (T11_STATE) return;
  const saved = await loadCalcState("t11_helios");
  T11_STATE = saved || {};
  T11_TROOPS.forEach((troop) => {
    if (!T11_STATE[troop]) T11_STATE[troop] = {};
  });
}

// Pure stat computation, reusable by both the T11 page and the Dashboard.
function computeT11Stats(troop, useMax) {
  const tracks = (T11_NODES_CACHE && T11_NODES_CACHE[troop]) || {};
  const stats = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
  Object.entries(tracks).forEach(([track, levels]) => {
    const cur = useMax ? Infinity : ((T11_STATE && T11_STATE[troop] && T11_STATE[troop][track]) || 0);
    levels.forEach((r) => {
      if (r.level > cur || !r.stat) return;
      stats[r.stat] += Number(r.stat_pct) || 0;
    });
  });
  return stats;
}

const EXPERT_RESEARCH_STAT_LABEL = { ATK: "Attack", DEF: "Defense", DMG: "Lethality", HP: "Health" };
async function renderExpertsResearchPage() {
  await ensureExpertsRosterGlobal();
  const saved = (await loadCalcState("experts_research")) || {};
  // Shared with Experts Level's "Your Inventory" - same sigil pool covers
  // both hero leveling and research paths.
  const invSaved = (await loadCalcState("experts_inventory")) || {};
  const rows = await sb(`expert_research_nodes?select=expert,path_number,path_name,level,stat_type,stat_value,sigil_cost,stat_type2,stat_value2&order=sort_order`);
  const RESEARCH_CACHE = {}; // { "Cyrille": { 1: [rows...], 2: [...], 3: [...] } }
  const PATH_NAMES = {}; // { "Cyrille": { 1: "Hunting Skill - Proficient", ... } }
  rows.forEach((r) => {
    if (!RESEARCH_CACHE[r.expert]) RESEARCH_CACHE[r.expert] = {};
    if (!RESEARCH_CACHE[r.expert][r.path_number]) RESEARCH_CACHE[r.expert][r.path_number] = [];
    RESEARCH_CACHE[r.expert][r.path_number].push(r);
    if (r.path_name) {
      if (!PATH_NAMES[r.expert]) PATH_NAMES[r.expert] = {};
      PATH_NAMES[r.expert][r.path_number] = r.path_name;
    }
  });
  const EXPERTS_IN_ORDER = EXPERTS_IN_ORDER_GLOBAL;
  function pathNumbersFor(expert) {
    return Object.keys(RESEARCH_CACHE[expert] || {})
      .map(Number)
      .sort((a, b) => a - b);
  }

  EXPERTS_IN_ORDER.forEach((expert) => {
    if (!saved[expert]) saved[expert] = {};
    pathNumbersFor(expert).forEach((p) => {
      if (typeof saved[expert][p] !== "object") saved[expert][p] = { current: 0, desired: 0 };
    });
  });

  const unlockedState = (await loadCalcState("experts_research_unlocked")) || {};
  function isResearchUnlocked(expert) {
    return unlockedState[expert] === false ? false : true;
  }

  // Main stat per expert: scales continuously every level (1-200), unlike the
  // rotating stat which only changes at the 10 milestone levels (20,40,...200).
  // Rate confirmed from source data: 0.01% per level per path.
  const EXPERT_MAIN_STAT = EXPERT_MAIN_STAT_GLOBAL_MAP;
  // Gareth's and Justus's main stat only applies to a specific troop type
  // (Lancers / Infantry respectively), unlike every other expert's main
  // stat which applies to all troops.
  const EXPERT_MAIN_STAT_TROOP = EXPERT_MAIN_STAT_TROOP_GLOBAL_MAP;
  // Rate per level so the main stat reaches 54% at level 200 (54/200) for
  // the 9 confirmed experts; Gareth/Justus keep the original 0.01%/level
  // rate until their target max is confirmed too.
  const MAIN_STAT_RATE_DEFAULT = 0.01; // % per level

  function pathCost(expert, pathNum, fromLevel, toLevel) {
    const pathRows = (RESEARCH_CACHE[expert] || {})[pathNum] || [];
    let sigil = 0;
    const stats = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
    pathRows.forEach((r) => {
      if (r.level > fromLevel && r.level <= toLevel) {
        sigil += Number(r.sigil_cost) || 0;
        if (stats[r.stat_type] != null) stats[r.stat_type] += Number(r.stat_value) || 0;
      }
    });
    // Main stat accumulates continuously per level, independent of milestone rows.
    // Gareth/Justus use a different rate per page: 0.3%/level on page 1
    // (paths 1-3, max 60% at level 200), 0.5%/level on page 2 (paths 4-6,
    // max 100% at level 200).
    const mainStat = EXPERT_MAIN_STAT[expert];
    if (mainStat && stats[mainStat] != null) {
      const clampedFrom = Math.max(0, Math.min(200, fromLevel));
      const clampedTo = Math.max(0, Math.min(200, toLevel));
      const levelsCrossed = Math.max(0, clampedTo - clampedFrom);
      let rate = MAIN_STAT_RATE_DEFAULT;
      if (expert === "Gareth") {
        rate = pathNum <= 3 ? 0.03 : 0.05; // 6% max page 1, 10% max page 2
      } else if (expert === "Justus") {
        rate = pathNum <= 3 ? 0.03 : 0.05; // 6% max page 1, 10% max page 2 (48% total)
      }
      stats[mainStat] += levelsCrossed * rate;
    }
    return { sigil, stats };
  }
  // Rotation stat only (excludes the main stat), for the per-path breakdown display
  function pathRotationOnly(expert, pathNum, fromLevel, toLevel) {
    const pathRows = (RESEARCH_CACHE[expert] || {})[pathNum] || [];
    let sigil = 0;
    const stats = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
    pathRows.forEach((r) => {
      if (r.level > fromLevel && r.level <= toLevel) {
        sigil += Number(r.sigil_cost) || 0;
        if (stats[r.stat_type] != null) stats[r.stat_type] += Number(r.stat_value) || 0;
      }
    });
    return { sigil, stats };
  }

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>Experts Research</h2>
              </div>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>Troops Stats</h2>
      <p class="desc">Attack/Defense/Lethality/Health from Expert Research. Excludes Gareth and Justus (troop-specific, see below).</p>
      <div class="stats-row-scroll" id="expResearchTotals"></div>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <div id="expResearchTroopDots" style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:10px;"></div>
      <h2 style="display:flex; align-items:baseline; gap:6px;"><span id="expResearchTroopTitle"></span><span class="meta" id="expResearchTroopExpert" style="font-size:11px; font-weight:400;"></span></h2>
      <div class="stats-row-scroll" id="expResearchTroopStats" style="margin-top:10px;"></div>
    </div>
    <div id="expResearchSwipeCounter" style="text-align:center; margin-bottom:10px;"></div>
    <div id="expResearchGrid"></div>
    <div class="panel" style="margin-top:16px;">
      <h2>Total Sigils Needed</h2>
      <p class="desc">Across all unlocked experts' paths, current to target.</p>
      <div class="stats-row-scroll" id="expResearchSigils"></div>
    </div>
  `;

  const sigilsEl = document.getElementById("expResearchSigils");
  const totalsEl = document.getElementById("expResearchTotals");
  const TROOP_STAT_COLORS = { Infantry: "#7ee6a8", Lancer: "var(--ice)", Marksman: "#f0a3c4" };
  const TROOP_STAT_ORDER = ["Infantry", "Lancer", "Marksman"];
  const TROOP_STAT_EXPERT = {
    Infantry: "Justus",
    Lancer: "Gareth",
    Marksman: null,
  };
  let expResearchActiveTroop = TROOP_STAT_ORDER[0];
  const troopDotsEl = document.getElementById("expResearchTroopDots");
  const troopTitleEl = document.getElementById("expResearchTroopTitle");
  const troopExpertEl = document.getElementById("expResearchTroopExpert");
  const troopStatsEl = document.getElementById("expResearchTroopStats");
  function computeStatTotals(includeExperts) {
    const totals = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
    const maxTotals = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
    EXPERTS_IN_ORDER.forEach((expert) => {
      if (!includeExperts.has(expert)) return;
      if (!isResearchUnlocked(expert)) return;
      pathNumbersFor(expert).forEach((p) => {
        const st = saved[expert][p];
        const { stats } = pathCost(expert, p, 0, st.current);
        Object.keys(stats).forEach((k) => (totals[k] += stats[k]));
        const { stats: mStats } = pathCost(expert, p, 0, 200);
        Object.keys(mStats).forEach((k) => (maxTotals[k] += mStats[k]));
      });
    });
    return { totals, maxTotals };
  }
  function statTotalsHtml(totals, maxTotals) {
    return `
      <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">ATK</div><div class="val" style="font-size:13px;">+${totals.ATK.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">of max +${maxTotals.ATK.toFixed(1)}%</div></div>
      <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">DEF</div><div class="val" style="font-size:13px;">+${totals.DEF.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">of max +${maxTotals.DEF.toFixed(1)}%</div></div>
      <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">LETH</div><div class="val" style="font-size:13px;">+${totals.DMG.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">of max +${maxTotals.DMG.toFixed(1)}%</div></div>
      <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">HP</div><div class="val" style="font-size:13px;">+${totals.HP.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">of max +${maxTotals.HP.toFixed(1)}%</div></div>
    `;
  }
  const GENERAL_EXPERTS = new Set(EXPERTS_IN_ORDER.filter((e) => e !== "Gareth" && e !== "Justus"));
  function renderTotals() {
    let totalSigil = 0;
    let maxSigil = 0;
    const sigilNeededByExpert = {};
    EXPERTS_IN_ORDER.forEach((expert) => {
      if (!isResearchUnlocked(expert)) return;
      let expertSigil = 0;
      pathNumbersFor(expert).forEach((p) => {
        const st = saved[expert][p];
        const { sigil } = pathCost(expert, p, st.current, st.desired);
        totalSigil += sigil;
        expertSigil += sigil;
        const { sigil: mSigil } = pathCost(expert, p, 0, 200);
        maxSigil += mSigil;
      });
      sigilNeededByExpert[expert] = expertSigil;
    });

    // Offset against Your Inventory (Experts Level page, same shared pool):
    // each expert's own sigils apply first, General Sigils cover the rest.
    let sigilShortfall = 0;
    EXPERTS_IN_ORDER.forEach((expert) => {
      const owned = Number(invSaved[`${expert} Sigils`]) || 0;
      sigilShortfall += Math.max(0, (sigilNeededByExpert[expert] || 0) - owned);
    });
    const stillSigil = Math.max(0, sigilShortfall - (Number(invSaved["General Sigils"]) || 0));

    sigilsEl.innerHTML = `
      <div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">Total Sigils</div><div class="val" style="font-size:13px;">${Math.round(totalSigil).toLocaleString()}</div><div class="meta" style="font-size:8.5px; margin-top:2px; color:${stillSigil > 0 ? "#e0a030" : "var(--good)"};">${stillSigil > 0 ? Math.round(stillSigil).toLocaleString() + " needed" : "\u2713 Have enough"}</div></div>
    `;

    // General stat totals: everyone except Gareth/Justus (troop-restricted)
    const general = computeStatTotals(GENERAL_EXPERTS);
    totalsEl.innerHTML = statTotalsHtml(general.totals, general.maxTotals);

    // Infantry: general + Justus's Health; Lancer: general + Gareth's Lethality; Marksman: general only
    const troopData = {
      Infantry: computeStatTotals(new Set([...GENERAL_EXPERTS, "Justus"])),
      Lancer: computeStatTotals(new Set([...GENERAL_EXPERTS, "Gareth"])),
      Marksman: { totals: { ATK: 0, DEF: 0, DMG: 0, HP: 0 }, maxTotals: { ATK: 0, DEF: 0, DMG: 0, HP: 0 } },
    };
    function renderActiveTroopStats() {
      renderSwipeDots(troopDotsEl, TROOP_STAT_ORDER, expResearchActiveTroop, TROOP_STAT_COLORS);
      troopTitleEl.textContent = expResearchActiveTroop;
      troopTitleEl.style.color = TROOP_STAT_COLORS[expResearchActiveTroop];
      troopExpertEl.textContent = TROOP_STAT_EXPERT[expResearchActiveTroop] ? `(${TROOP_STAT_EXPERT[expResearchActiveTroop]})` : "";
      const d = troopData[expResearchActiveTroop];

      wireTroopSwipe(troopStatsEl.closest(".panel"), TROOP_STAT_ORDER, expResearchActiveTroop, (t) => {
        expResearchActiveTroop = t;
        renderActiveTroopStats();
      });
    }
    renderActiveTroopStats();
  }

  const gridEl = document.getElementById("expResearchGrid");
  function pathLevelOpts(expert, pathNum, selected) {
    const opts = [];
    for (let n = 0; n <= 200; n++) {
      opts.push(`<option value="${n}" ${n === selected ? "selected" : ""}>${n}</option>`);
    }
    return opts.join("");
  }

  const EXPERT_RESEARCH_IMG = Object.fromEntries(EXPERTS_LIST.map((e) => [e.key, e.img]));
  function mainStatCurrentTotal(expert) {
    const mainStat = EXPERT_MAIN_STAT[expert];
    if (!mainStat) return 0;
    let total = 0;
    pathNumbersFor(expert).forEach((p) => {
      const st = saved[expert][p];
      const levels = Math.max(0, Math.min(200, st.current));
      let rate = MAIN_STAT_RATE_DEFAULT;
      if (expert === "Gareth" || expert === "Justus") {
        rate = p <= 3 ? 0.03 : 0.05;
      }
      total += levels * rate;
    });
    return total;
  }
  function expertCardHtml(expert, page) {
    const pathNums = pathNumbersFor(expert);
    const pages = [];
    for (let i = 0; i < pathNums.length; i += 3) pages.push(pathNums.slice(i, i + 3));
    const safePage = Math.min(page || 0, pages.length - 1);
    const pageEntries = pages[safePage] || [];
    const unlocked = isResearchUnlocked(expert);
    const img = EXPERT_RESEARCH_IMG[expert];
    const mainStatLabel = EXPERT_RESEARCH_STAT_LABEL[EXPERT_MAIN_STAT[expert]];
    const mainStatTotal = mainStatCurrentTotal(expert);
    return `
      <div class="panel" style="${unlocked ? "" : "opacity:0.5;"} text-align:center;">
        <div style="display:grid; grid-template-columns:1fr auto 1fr; align-items:center; margin-bottom:4px;">
          <input type="checkbox" data-expresearchunlock="${esc(expert)}" ${unlocked ? "checked" : ""} style="width:16px; height:16px; cursor:pointer; justify-self:start;" />
          <div style="min-width:0; text-align:center;">
            ${img ? `<img src="${img}" alt="${esc(expert)}" style="width:52px; height:52px; border-radius:8px; object-fit:cover; margin-bottom:4px;" loading="lazy" />` : ""}
            <div class="name" style="font-size:16px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${esc(expert)}</div>
            <div class="meta" style="font-size:10px; color:var(--frost);">${mainStatLabel} +${mainStatTotal.toFixed(2)}%</div>
            ${EXPERT_MAIN_STAT_TROOP[expert] ? `<div class="meta" style="font-size:9px; color:var(--muted);">${esc(EXPERT_MAIN_STAT_TROOP[expert])} only</div>` : ""}
          </div>
          <button class="btn ghost small" data-expresearchmax="${esc(expert)}" style="justify-self:end;">Max</button>
        </div>
        ${
          EXPERT_MAIN_STAT_TROOP[expert]
            ? `<div class="meta" style="font-size:10px; margin-bottom:8px; color:var(--frost);">Max 6% page 1, max 10% page 2 (per path)</div>`
            : ""
        }
        ${
          pages.length > 1
            ? `<div id="expResearchPageDots" style="display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:8px;">
                ${pages.map((_, i) => `<span style="width:6px; height:6px; border-radius:50%; background:${i === safePage ? "var(--ice)" : "var(--line)"};"></span>`).join("")}
               </div>`
            : ""
        }
        <div style="text-align:left;" id="expResearchPathsList">
        ${pageEntries
          .map((p, idx) => {
            const st = saved[expert][p];
            const pathName = (PATH_NAMES[expert] || {})[p] || `Path ${p}`;
            const { sigil, stats } = pathRotationOnly(expert, p, st.current, st.desired);
            const statParts = Object.entries(stats)
              .filter(([, v]) => v > 0)
              .map(([k, v]) => `+${v.toFixed(1)}% ${EXPERT_RESEARCH_STAT_LABEL[k]}`)
              .join(", ");
            return `
          <div style="padding:8px 0; ${idx < pageEntries.length - 1 ? "border-bottom:1px solid var(--line);" : ""}">
            <div class="meta" style="font-size:12px; margin-bottom:4px;">${esc(pathName)}</div>
            <div style="display:flex; gap:6px; margin-bottom:4px;">
              <div style="flex:1;">
                <div class="meta" style="font-size:10px;">Current</div>
                <select data-expresearchcur="${esc(expert)}|${p}" style="width:100%;">${pathLevelOpts(expert, p, st.current)}</select>
              </div>
              <div style="flex:1;">
                <div class="meta" style="font-size:10px;">Target</div>
                <select data-expresearchdes="${esc(expert)}|${p}" style="width:100%;">${pathLevelOpts(expert, p, st.desired)}</select>
              </div>
            </div>
            <div class="meta" style="font-size:10px; text-align:right; color:var(--ice);">${Math.round(sigil).toLocaleString()} Sigils${statParts ? " \u00b7 " + statParts : ""}</div>
          </div>`;
          })
          .join("")}
        </div>
      </div>`;
  }

  const expResearchCounterEl = document.getElementById("expResearchSwipeCounter");
  let activeResearchIdx = 0;
  let activeResearchPage = 0;
  function renderGrid() {
    renderSwipeCounter(expResearchCounterEl, EXPERTS_IN_ORDER.length, activeResearchIdx);
    const expert = EXPERTS_IN_ORDER[activeResearchIdx];
    gridEl.innerHTML = expertCardHtml(expert, activeResearchPage);
    wireIndexSwipe(gridEl, EXPERTS_IN_ORDER.length, activeResearchIdx, (next) => {
      activeResearchIdx = next;
      activeResearchPage = 0;
      renderGrid();
    });

    // Inner swipe for path pages (1, 2, ...) within the same expert - scoped
    // to just the paths list so it doesn't also trigger the outer
    // expert-to-expert swipe above. stopPropagation prevents both firing
    // from the same gesture.
    const pathsListEl = document.getElementById("expResearchPathsList");
    if (pathsListEl) {
      const pathNums = pathNumbersFor(expert);
      const pageCount = Math.ceil(pathNums.length / 3);
      let pageTouchX = null, pageTouchY = null;
      pathsListEl.addEventListener("touchstart", (e) => {
        e.stopPropagation();
        pageTouchX = e.touches[0].clientX;
        pageTouchY = e.touches[0].clientY;
      }, { passive: true });
      pathsListEl.addEventListener("touchend", (e) => {
        e.stopPropagation();
        if (pageTouchX == null) return;
        const dx = e.changedTouches[0].clientX - pageTouchX;
        const dy = e.changedTouches[0].clientY - pageTouchY;
        pageTouchX = null;
        if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          const next = dx < 0 ? activeResearchPage + 1 : activeResearchPage - 1;
          if (next >= 0 && next < pageCount) {
            activeResearchPage = next;
            renderGrid();
          }
        }
      }, { passive: true });
    }

    const container = gridEl;
    {
      container.querySelectorAll("input[data-expresearchunlock]").forEach((cb) => {
        cb.addEventListener("change", async () => {
          const expert = cb.dataset.expresearchunlock;
          unlockedState[expert] = cb.checked;
          await saveCalcState("experts_research_unlocked", unlockedState);
          renderTotals();
          renderGrid();
        });
      });
      container.querySelectorAll("[data-expresearchmax]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const expert = btn.dataset.expresearchmax;
          const paths = pathNumbersFor(expert);
          const bothMaxed = paths.every((p) => saved[expert][p].current >= 200 && saved[expert][p].desired >= 200);
          const currentZeroTargetMaxed = paths.every((p) => saved[expert][p].current <= 0 && saved[expert][p].desired >= 200);
          const bothZero = paths.every((p) => saved[expert][p].current <= 0 && saved[expert][p].desired <= 0);
          // Cycle: (0,0) -> (200,200) -> (0,200) -> (0,0) -> ...
          let nextCurrent, nextTarget;
          if (bothZero) {
            nextCurrent = 200;
            nextTarget = 200;
          } else if (bothMaxed) {
            nextCurrent = 0;
            nextTarget = 200;
          } else if (currentZeroTargetMaxed) {
            nextCurrent = 0;
            nextTarget = 0;
          } else {
            // mixed/partial state: snap to fully maxed first
            nextCurrent = 200;
            nextTarget = 200;
          }
          paths.forEach((p) => {
            saved[expert][p].current = nextCurrent;
            saved[expert][p].desired = nextTarget;
          });
          await saveCalcState("experts_research", saved);
          renderTotals();
          renderGrid();
        });
      });
      container.querySelectorAll("select[data-expresearchcur]").forEach((sel) => {
        sel.addEventListener("change", async () => {
          const [expert, p] = sel.dataset.expresearchcur.split("|");
          const newCurrent = Number(sel.value);
          saved[expert][p].current = newCurrent;
          if (newCurrent > 0 && saved[expert][p].desired <= 0) {
            saved[expert][p].desired = newCurrent;
          }
          await saveCalcState("experts_research", saved);
          renderTotals();
          renderGrid();
        });
      });
      container.querySelectorAll("select[data-expresearchdes]").forEach((sel) => {
        sel.addEventListener("change", async () => {
          const [expert, p] = sel.dataset.expresearchdes.split("|");
          saved[expert][p].desired = Number(sel.value);
          await saveCalcState("experts_research", saved);
          renderTotals();
          renderGrid();
        });
      });
    }
  }

  renderTotals();
  renderGrid();
}

async function renderExpertsPage() {
  await ensureExpertsRosterGlobal();
  const saved = (await loadCalcState("experts")) || {};
  const unlockedState = (await loadCalcState("experts_unlocked")) || {};
  function isExpertUnlocked(expert) {
    return unlockedState[expert] === false ? false : true;
  }
  const invSaved = (await loadCalcState("experts_inventory")) || {};
  const skillRows = await sb(`expert_skill_nodes?select=expert,skill,level,exp_cost,book_cost,stat_type,stat_value&order=sort_order`);
  const affinityRows = await sb(`expert_affinity_nodes?select=expert,level,affinity_cost,sigil_cost,stat_type,stat_value,stat_type2,stat_value2&order=sort_order`);
  const SKILL_CACHE = {}; // { "Cyrille|Entrapment": [ {level,exp_cost,book_cost}, ... ] }
  skillRows.forEach((r) => {
    const key = `${r.expert}|${r.skill}`;
    if (!SKILL_CACHE[key]) SKILL_CACHE[key] = [];
    SKILL_CACHE[key].push(r);
  });
  const AFFINITY_CACHE = {}; // { "Cyrille": [ {level,affinity_cost,sigil_cost}, ... ] }
  affinityRows.forEach((r) => {
    if (!AFFINITY_CACHE[r.expert]) AFFINITY_CACHE[r.expert] = [];
    AFFINITY_CACHE[r.expert].push(r);
  });
  function skillMaxLevel(hero, skill) {
    const rows = SKILL_CACHE[`${hero}|${skill}`];
    return rows ? rows.length : EXPERT_SKILL_MAX_LEVEL;
  }
  function skillCost(hero, skill, fromLevel, toLevel) {
    const rows = SKILL_CACHE[`${hero}|${skill}`];
    if (!rows) return { exp: 0, book: 0 };
    let exp = 0, book = 0;
    rows.forEach((r) => {
      if (r.level > fromLevel && r.level <= toLevel) {
        exp += Number(r.exp_cost) || 0;
        book += Number(r.book_cost) || 0;
      }
    });
    return { exp, book };
  }
  function heroCost(hero, fromLevel, toLevel) {
    const rows = AFFINITY_CACHE[hero];
    if (!rows) return { affinity: 0, sigil: 0 };
    let affinity = 0, sigil = 0;
    rows.forEach((r) => {
      if (r.level > fromLevel && r.level <= toLevel) {
        affinity += Number(r.affinity_cost) || 0;
        sigil += Number(r.sigil_cost) || 0;
      }
    });
    return { affinity, sigil };
  }

  EXPERTS_LIST.forEach((e) => {
    if (!saved[e.key]) saved[e.key] = { current: 0, desired: 1, skills: {} };
    e.skills.forEach((s) => {
      const max = skillMaxLevel(e.key, s);
      if (!saved[e.key].skills[s]) saved[e.key].skills[s] = { current: 0, desired: max };
    });
  });

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>Experts Level</h2>
      </div>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>Troops Stats</h2>
      <p class="desc">Base stats for all 10 experts, plus select main-stat skills.</p>
      <div class="stats-row-scroll" id="expertsStatHeader"></div>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>Backpack</h2>
      <div class="stats-row-scroll" id="expertsInventory"></div>
    </div>
    <div class="panel" style="margin-bottom:16px;">
      <h2>Resources needed</h2>
      <div class="stats-row-scroll sr-2col" id="expertsTotals"></div>
    </div>
    <div id="expertsSwipeCounter" style="text-align:center; margin-bottom:10px;"></div>
    <div id="expertsGrid"></div>
    <div class="grid g2" style="margin-bottom:16px; gap:16px; margin-top:16px;">
      <div class="panel">
        <h2>Foundry</h2>
        <p class="desc">Troop Stats + Fabian's Heightened Firepower, for Foundry Battle.</p>
        <div class="stats-row-scroll sr-4" id="expertsFoundryHeader"></div>
      </div>
      <div class="panel">
        <h2>SvS</h2>
        <p class="desc">Troop Stats + Valeria's Battle Concerto, for SvS Battle Phase.</p>
        <div class="stats-row-scroll sr-4" id="expertsSvsHeader"></div>
      </div>
    </div>
    <div class="grid g2" style="gap:16px;">
      <div class="panel">
        <h2>Frostfire Mine</h2>
        <p class="desc">Troop Stats + Kathy's Child of Frost talent, for Frostfire Mine.</p>
        <div class="stats-row-scroll sr-4" id="expertsFrostfireHeader"></div>
      </div>
      <div class="panel">
        <h2>Tundra Trade Routes</h2>
        <p class="desc">Troop Stats + Ronne's Trade Dominion talent, for the Tundra Trade Route.</p>
        <div class="stats-row-scroll sr-4" id="expertsTundraHeader"></div>
      </div>
    </div>
  `;

  const statHeaderEl = document.getElementById("expertsStatHeader");
  const TROOP_STAT_HEROES = new Set(["Romulus", "Gareth"]);
  function addLevelBaseToTotals(totals, hero, includeTalent) {
    const rows = AFFINITY_CACHE[hero] || [];
    const lvl = saved[hero] ? saved[hero].current : 0;
    const row = rows.find((r) => r.level === lvl);
    if (!row) return;
    if (row.stat_type) {
      row.stat_type.split(",").forEach((statName) => {
        if (totals[statName] != null) totals[statName] += Number(row.stat_value) || 0;
      });
    }
    if (includeTalent && row.stat_type2) {
      row.stat_type2.split(",").forEach((statName) => {
        if (totals[statName] != null) totals[statName] += Number(row.stat_value2) || 0;
      });
    }
  }
  function computeBaseTroopStats() {
    const totals = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
    // All 10 experts' level-based base stats, confirmed exact from uploaded Experts_Data.xlsx
    const ALL_EXPERTS_LEVEL_BASE = EXPERTS_LIST.map((e) => e.key);
    ALL_EXPERTS_LEVEL_BASE.forEach((hero) => addLevelBaseToTotals(totals, hero));
    // Romulus's Last Line + Spirit of Aeetis, Gareth's Porcupine + Undefeated Will
    addSkillStatsToTotals(totals, "Romulus", "Last Line");
    addSkillStatsToTotals(totals, "Romulus", "Spirit of Aeetis");
    addSkillStatsToTotals(totals, "Gareth", "Porcupine");
    addSkillStatsToTotals(totals, "Gareth", "Undefeated Will");
    return totals;
  }
  function computeBaseTroopStatsMax() {
    const totals = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
    ["Cyrille", "Agnes", "Holger", "Romulus", "Baldur", "Fabian", "Valeria", "Ronne", "Kathy", "Gareth"].forEach((hero) => {
      const rows = AFFINITY_CACHE[hero] || [];
      if (!rows.length) return;
      // Use the true peak value across all levels, not just the last row -
      // some experts' curves dip at level 100 due to a relationship-tier
      // reset, so the last row isn't always the highest one.
      const peak = rows.reduce((best, r) => (Number(r.stat_value) > Number(best.stat_value) ? r : best), rows[0]);
      if (peak.stat_type) {
        peak.stat_type.split(",").forEach((statName) => {
          if (totals[statName] != null) totals[statName] += Number(peak.stat_value) || 0;
        });
      }
    });
    // Romulus's + Gareth's confirmed skills, at their own max levels
    addSkillMaxToTotals(totals, "Romulus", "Last Line");
    addSkillMaxToTotals(totals, "Romulus", "Spirit of Aeetis");
    addSkillMaxToTotals(totals, "Gareth", "Porcupine");
    addSkillMaxToTotals(totals, "Gareth", "Undefeated Will");
    return totals;
  }
  function statHeaderHtml(totals, maxTotals) {
    const rows = [
      ["ATK", "Attack"],
      ["DEF", "Defense"],
      ["LETH", "Lethality"],
      ["HP", "Health"],

    return rows
      .map(

          `<div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">${label}</div><div class="val" style="font-size:13px;">+${totals[key].toFixed(1)}%</div>${

      .join("");

  function addSkillStatsToTotals(totals, hero, skill) {

    // rows are cumulative per level; find the row at (or below) the current level

    rows.forEach((r) => {
      if (r.level <= st.current) match = r;
    });
    if (!match || !match.stat_type) return;
    match.stat_type.split(",").forEach((statName) => {
      if (totals[statName] != null) totals[statName] += Number(match.stat_value) || 0;
    });
  }
  function addSkillMaxToTotals(totals, hero, skill) {
    const rows = SKILL_CACHE[`${hero}|${skill}`];
    if (!rows || !rows.length) return;

    last.stat_type.split(",").forEach((statName) => {

      });
    }
  }
  function addTalentMaxToTotals(totals, hero) {

    const last = rows[rows.length - 1];

        if (totals[statName] != null) totals[statName] += Number(last.stat_value2) || 0;
      });
    }
  }
  function renderFoundryHeader() {

    addTalentMaxToTotals(maxTotals, "Fabian");

  const svsEl = document.getElementById("expertsSvsHeader");

  const frostfireEl = document.getElementById("expertsFrostfireHeader");

  const tundraEl = document.getElementById("expertsTundraHeader");
