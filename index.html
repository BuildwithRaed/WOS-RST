// Builds a human-readable label for a progression row, e.g.
// "Legendary T5 \u26053.2" or "Lv.42" (drops a lone ".0" stage suffix).
const CHIEF_GEAR_TIER_SHORT = {
  Common: "Green",
  Rare: "Blue",
  Epic: "Purple",
  "Epic T1": "Purple T1",
  Mythic: "Gold",
  "Mythic T1": "Gold T1",
  "Mythic T2": "Gold T2",
  Legendary: "Red",
  "Legendary T1": "Red T1",
  "Legendary T2": "Red T2",
  "Legendary T3": "Red T3",
  "Legendary T4": "Red T4",
  "Legendary T5": "Red T5",
  "Legendary T6": "Red T6",
};
function rowLabel(r) {
  if (r.display_label) return r.display_label;
  if (r.tier) return `${r.tier}${r.stars != null ? " \u2605" + r.stars : ""}${r.stage != null && r.stage !== "0" ? "." + r.stage : ""}`;
  return `Lv.${r.level}${r.stage && r.stage !== "0" ? "." + r.stage : ""}`;
}
function chiefGearRowLabel(r) {
  if (r.display_label) return r.display_label;
  if (r.tier) return `${CHIEF_GEAR_TIER_SHORT[r.tier] || r.tier}${r.stars != null ? " \u2605" + r.stars : ""}${r.stage != null && r.stage !== "0" ? "." + r.stage : ""}`;
  return rowLabel(r);
}
// Parses "1500 Hardened Alloy, 15 Polishing Solution" into
// [{qty, name}, ...] for totals aggregation.
function parseMaterials(materials) {
  if (!materials) return [];
  return materials
    .split(",")
    .map((part) => {
      const m = part.trim().match(/^(\d+(?:\.\d+)?)\s+(.+)$/);
      return m ? { qty: Number(m[1]), name: m[2].trim() } : null;
    })
    .filter(Boolean);
}
// Extracts the numeric percentage from a stat string like "+9.35%".
function parseStatPct(stat) {
  if (!stat) return null;
  const m = String(stat).match(/-?\d+(\.\d+)?/);
  return m ? Number(m[0]) : null;
}

// Renders a progression table with an optional current\u2192target
// "upgrade calculator" (materials/stat/power gained for the range)
// plus the full reference table below it.
async function renderProgressionInto(target, tableName) {
  let [table] = await sb(`progression_tables?name=eq.${encodeURIComponent(tableName)}&user_id=eq.${PROGRESSION_OWNER_ID}&select=id,name`);
  if (!table) {
    const [created] = await sb(`progression_tables`, {
      method: "POST",
      body: JSON.stringify({ user_id: PROGRESSION_OWNER_ID, name: tableName, sort_order: 0 }),
    });
    table = created;
  }
  const rows = await sb(`progression_rows?table_id=eq.${table.id}&select=id,level,tier,stars,stage,materials,stat,power&order=sort_order.asc`);
  const hasTier = rows.some((r) => r.tier);
  const canCalc = rows.length > 1;

  target.innerHTML = `
    ${
      canCalc
        ? `<div class="panel">
      <h2>Upgrade calculator</h2>
      <p class="desc">Pick your current and target step to see materials, stat gain, and power gain between them.</p>
      <div class="row" style="align-items:center;">
        <div class="meta">From</div>
        <div style="display:flex; gap:8px; align-items:center;">
          <select id="calcFrom" style="width:160px;"></select>
          <span class="meta">to</span>
          <select id="calcTo" style="width:160px;"></select>
        </div>
      </div>
      <div id="calcResult" style="margin-top:12px;"></div>
    </div>`
        : ""
    }
    <div class="panel">
      <h2>${esc(tableName)}</h2>
      <p class="desc">${hasTier ? "Tier, stars, materials, stat bonus, and power total." : "Level, materials needed, and power gained per level."}</p>
      <div class="matrix-wrap">
        <table class="matrix">
          <thead><tr>${hasTier ? "<th>Tier</th><th>Stars</th><th>Stage</th>" : "<th>Level</th>"}<th>Materials</th>${hasTier ? "<th>Stat</th>" : ""}<th>Power</th><th></th></tr></thead>
          <tbody id="progRows"></tbody>
        </table>
      </div>
      ${
        !hasTier
          ? `<form class="inline" id="progAddForm" style="margin-top:14px; border-top:1px solid var(--line); padding-top:14px;">
        <input class="field-num" name="level" type="number" placeholder="Level" required style="width:80px;" />
        <input class="flex1" name="materials" placeholder="Materials, e.g. 100 XP Component" />
        <input class="field-num" name="power" type="number" step="any" placeholder="Power" style="width:120px;" />
        <button class="btn small" type="submit">Add row</button>
      </form>
      <div class="err" id="progErr"></div>`
          : ""
      }
    </div>
  `;

  if (canCalc) {
    const fromSel = target.querySelector("#calcFrom");
    const toSel = target.querySelector("#calcTo");
    const opts = rows.map((r, i) => `<option value="${i}">${esc(rowLabel(r))}</option>`).join("");
    fromSel.innerHTML = opts;
    toSel.innerHTML = opts;
    toSel.value = String(rows.length - 1);

    function updateCalc() {
      let fromIdx = Number(fromSel.value);
      let toIdx = Number(toSel.value);
      if (toIdx < fromIdx) { toIdx = fromIdx; toSel.value = String(fromIdx); }
      const resultEl = target.querySelector("#calcResult");
      const matTotals = {};
      for (let i = fromIdx + 1; i <= toIdx; i++) {
        for (const m of parseMaterials(rows[i].materials)) {
          matTotals[m.name] = (matTotals[m.name] || 0) + m.qty;
        }
      }
      const statFrom = parseStatPct(rows[fromIdx].stat);
      const statTo = parseStatPct(rows[toIdx].stat);
      const powerFrom = rows[fromIdx].power != null ? Number(rows[fromIdx].power) : null;
      const powerTo = rows[toIdx].power != null ? Number(rows[toIdx].power) : null;

      const matHtml = Object.entries(matTotals)
        .map(([name, qty]) => {
          const lower = name.toLowerCase();
          const iconKey = Object.keys(MATERIAL_ICONS).find((k) => lower.includes(k));
          const icon = iconKey ? `<img src="${MATERIAL_ICONS[iconKey]}" alt="" style="width:16px; height:16px; object-fit:contain; vertical-align:-3px; margin-right:4px;" loading="lazy" />` : "";
          return `<div class="row"><div class="name">${icon}${esc(name)}</div><div class="meta mono">${qty.toLocaleString()}</div></div>`;
        })
        .join("");

      resultEl.innerHTML = `
        <div class="grid g2" style="margin-bottom:10px;">
          ${statTo != null ? `<div class="metric"><div class="label">Stat gain</div><div class="val">+${(statTo - (statFrom || 0)).toFixed(2)}%</div></div>` : ""}
          ${powerTo != null ? `<div class="metric"><div class="label">Power gain</div><div class="val">${(powerTo - (powerFrom || 0)).toLocaleString()}</div></div>` : ""}
        </div>
        ${matHtml || `<div class="empty" style="padding:10px 0;">No materials needed for this range.</div>`}
      `;
    }
    fromSel.addEventListener("change", updateCalc);
    toSel.addEventListener("change", updateCalc);
    updateCalc();
  }

  const tbody = target.querySelector("#progRows");
  tbody.innerHTML = rows.length
    ? rows
        .map((r) =>
          hasTier
            ? `<tr>
                <td style="text-align:start;">${esc(r.tier || "")}</td>
                <td>${r.stars ?? "\u2014"}</td>
                <td>${r.stage ?? "\u2014"}</td>
                <td style="text-align:start;">${renderMaterialsWithIcons(r.materials)}</td>
                <td>${esc(r.stat || "\u2014")}</td>
                <td>${r.power != null ? Number(r.power).toLocaleString() : "\u2014"}</td>
                <td><button class="del" data-delrow="${r.id}" title="Delete row">&times;</button></td>
              </tr>`
            : `<tr>
                <td>${r.level}${r.stage && r.stage !== "0" ? "." + esc(r.stage) : ""}</td>
                <td style="text-align:start;">${renderMaterialsWithIcons(r.materials)}</td>
                <td>${r.power != null ? Number(r.power).toLocaleString() : "\u2014"}</td>
                <td><button class="del" data-delrow="${r.id}" title="Delete row">&times;</button></td>
              </tr>`
        )
        .join("")
    : `<tr><td colspan="${hasTier ? 7 : 4}"><div class="empty">No rows yet.</div></td></tr>`;

  tbody.querySelectorAll("[data-delrow]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await sb(`progression_rows?id=eq.${btn.dataset.delrow}`, { method: "DELETE" });
        toast("Row deleted");
        renderProgressionInto(target, tableName);
      } catch (err) {
        toast("Couldn't delete row", true);
      }
    });
  });

  const addForm = target.querySelector("#progAddForm");
  if (addForm) {
    addForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const f = e.target;
      const errEl = target.querySelector("#progErr");
      errEl.textContent = "";
      const level = Number(f.level.value);
      if (!level) { errEl.textContent = "Enter a level first"; return; }
      try {
        await sb(`progression_rows`, {
          method: "POST",
          body: JSON.stringify({
            table_id: table.id,
            level,
            materials: f.materials.value.trim() || null,
            power: f.power.value.trim() === "" ? null : Number(f.power.value),
            sort_order: rows.length,
          }),
        });
        toast("Row added");
        renderProgressionInto(target, tableName);
      } catch (err) {
        errEl.textContent = "Couldn't add row";
      }
    });
  }
}

// Charm level data (levels, per-step material costs, cumulative Lethality/

let CHARM_LEVELS = [];

let CHARM_CUMULATIVE = {};
let CHARM_CUMULATIVE_STAT = {};
let CHARM_LEVELS_LOADED = false;
let CHARM_LEVELS_PROMISE = null;
async function ensureCharmLevelsData() {

}

// ============================================================
// PACKS -> CALCULATOR PAGES
// A pack table can be pointed at one or more calculator pages, and each of
// its columns labelled with the resource it grants (plus which column holds
// the price). Those pages then show what the packs would cost to cover what
// they still need. The links live in calc_state, so no database change is
// needed and they follow the user across devices.
// ============================================================
// "Used for" checkboxes: one tick can cover several pages (Pets, Experts,
// Research), each stored as its own page key so the pages keep working
// independently.
const PACK_PAGE_GROUPS = [
  { key: "chief_gear", pages: ["chief_gear"] },
  { key: "charm", pages: ["charm"] },
  { key: "hero_gear", pages: ["hero_gear"] },
  { key: "pets", pages: ["pets"] },
  { key: "pets_refine", pages: ["pets_refine"] },
  { key: "experts_group", group: "Experts", pages: ["experts", "experts_research"] },
  { key: "research_group", group: "Research", pages: ["research_center", "t11_helios", "t12_research"] },
];
function packGroupLabel(g) {
  if (g.group) { const e = NAV_GROUP_LABELS[g.group]; return e ? (e[LANG] || e.en) : g.group; }
  return packPageLabel(g.pages[0]);
}
// A table ticked for a group (e.g. "Pets") counts for every page in that
// group, even if it was ticked before a page joined the group.
function packTableServesPage(tb, calcKey) {
  const servedBy = (pages) => {
    if (pages.includes(calcKey)) return true;
    const g = packGroupOf(calcKey);
    return !!g && g.pages.some((k) => pages.includes(k));
  };
  const link = packLinkFor(tb.id);
  if (servedBy(link.pages)) return true;
  // A table linked as "same pack" follows its partners onto their pages.
  if (link.linkSet) return packLinkSetMembers(link.linkSet).some((x) => x.id !== tb.id && servedBy(packLinkFor(x.id).pages));
  return false;
}
let PACK_TABLES_ALL = null; // every table, for "same pack" lookups (Packs page keeps it fresh)
function packLinkSetMembers(setId) {
  return (PACK_TABLES_CACHE || PACK_TABLES_ALL || []).filter((x) => packLinkFor(x.id).linkSet === setId);
}
// Short tag telling linked tables apart ("Classic" / "Sublime"): the part
// of the title that isn't shared with the others.
function packLinkSetTags(tbs) {
  const titles = tbs.map((x) => String(x.title || "").trim());
  const words = titles.map((x) => x.split(/[\s:·\-()"']+/).filter(Boolean));
  const norm = (w) => w.toLowerCase().replace(/s$/, "");
  // A word every title shares (Chief, Gear/Gears, Artisan's, Trove...) says
  // nothing about which option this is, so it goes; what's left is the tag.
  const shared = new Set((words[0] || []).map(norm).filter((n) => words.every((w) => w.some((x) => norm(x) === n))));
  return words.map((w, i) => {
    const own = w.filter((x) => !shared.has(norm(x)));
    return (own.length ? own.join(" ") : titles[i] || `#${i + 1}`).slice(0, 12);
  });
}
function packGroupsChecked(pages) {
  return PACK_PAGE_GROUPS.filter((g) => g.pages.some((k) => (pages || []).includes(k))).length;
}
function packGroupOf(pageKey) {
  return PACK_PAGE_GROUPS.find((g) => g.pages.includes(pageKey));
}
// Pages that have a Backpack box the pack costs can appear under.

// Plan rows grouped per pack: one line per pack (runs, cost, cadence) and

// per option sequence.
function packPlanRowsHtml(plan, resetText) {
  const qty = (v) => Math.round(v).toLocaleString();
  const byPack = [];
  plan.rows.forEach((r) => {
    let g = byPack.find((x) => x.title === r.title);
    if (!g) { g = { title: r.title, count: 0, subtotal: 0, currency: r.currency, reset: r.reset, resetDay: r.resetDay, cycles: r.cycles, perCycle: r.perCycle, lines: [] }; byPack.push(g); }
    g.count += r.count; g.subtotal += r.subtotal; g.cycles = Math.max(g.cycles, r.cycles);
    g.lines.push(r);
  });
  return byPack.map((g) => `
    <div style="padding:6px 0; border-top:1px solid var(--line);">
      <div style="display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;">

        <span style="font-size:11px; color:var(--ice);">&times; ${qty(g.count)}</span>
        ${typeof g.reset === "number" ? `<span class="meta" style="font-size:10px;">${esc(resetText(g.reset, g.resetDay))} · ${g.cycles} ${esc(t("pack_resets"))}</span>` : ""}
        <span style="margin-inline-start:auto; font-size:12px; font-weight:700;">${packFmtMoney(g.subtotal, g.currency)}</span>
      </div>
      <div style="margin-top:3px; padding-inline-start:10px; font-size:10.5px; line-height:1.55;">
        ${g.lines.sort((a, b) => b.count - a.count).map((r) => `<div style="display:flex; gap:6px; align-items:baseline;"><span style="color:var(--ice); min-width:34px; text-align:end;">${qty(r.count)}&times;</span><span>${esc(r.label)}</span><span class="meta" style="margin-inline-start:auto;">${packFmtMoney(r.subtotal, r.currency)}</span></div>`).join("")}
      </div>
    </div>`).join("");

// Among several plans, the cheapest - but a plan that finishes sooner wins
// when it costs no more than 2% extra (saving pennies over many extra
// weeks isn't "cheapest" in any useful sense).
function packPickCheapest(plans) {
  let best = null;
  plans.filter(Boolean).forEach((p) => {
    if (!best || p.total < best.total * 0.98 || (p.total <= best.total * 1.02 && p.days < best.days) || (p.total < best.total && p.days <= best.days)) best = p;
  });
  return best;
}

function packFmtMoney(n, currency, whole) {
  const code = currency || "USD";
  const digits = whole ? 0 : 2;
  try {
    return new Intl.NumberFormat(LANG === "en" ? undefined : LANG, { style: "currency", currency: code, minimumFractionDigits: digits, maximumFractionDigits: digits }).format(n);
  } catch (e) {
    return packCurrencySymbol(code) + n.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
}

// Creates the preset tables that don't exist yet. Returns how many were added.
async function packAddPresets(existingTables) {

  let added = 0, order = existingTables.length;
  for (const p of PACK_PRESET_TABLES) {
    const key = `${p.group.toLowerCase()}|${p.title.toLowerCase()}|${p.columns.join(",").toLowerCase()}`;
    if (have.has(key)) continue;
    const payload = { title: p.title, columns: p.columns.slice(), rows: p.rows.map((r) => ({ ...r, cells: r.cells.slice() })), sort_order: order++, scale_enabled: false, updated_at: new Date().toISOString() };
    let saved;
    try { [saved] = await sb(`pack_tables`, { method: "POST", body: JSON.stringify({ user_id: USER_ID, ...payload }) }); }
    catch (err) { toast("Couldn't add preset tables", true); break; }
    PACK_LINKS[String(saved.id)] = { pages: p.link.pages || [], priceCol: 0, cols: {}, sequential: !!p.link.sequential, option: !!p.link.option, colOptions: !!p.link.colOptions, choice: false, reset: p.link.reset, group: p.group, currency: "USD", buys: 1 };
    have.add(key); added++;

  PACK_TABLES_CACHE = null;

//  - the first attempt of each day is half price (one per day, any tier)
// ============================================================
const RFC_LAB_TIERS = [
  { tier: 1, cost: 20, returns: [[1, 0.65], [2, 0.25], [3, 0.10]] },
  { tier: 2, cost: 50, returns: [[2, 0.85], [3, 0.15]] },
  { tier: 3, cost: 100, returns: [[3, 0.85], [4, 0.125], [5, 0.02], [6, 0.005]] },
  { tier: 4, cost: 130, returns: [[3, 0.75], [4, 0.15], [5, 0.05], [6, 0.03], [7, 0.01], [8, 0.005], [9, 0.005]] },
  { tier: 5, cost: 160, returns: [[3, 0.70], [4, 0.12], [5, 0.09], [6, 0.04], [7, 0.015], [8, 0.01], [9, 0.01], [10, 0.005], [11, 0.005], [12, 0.005]] },

const RFC_LAB_MAX_PER_TIER = 20;

function rfcExpected(t) { return t.returns.reduce((s, [n, p]) => s + n * p, 0); }
// Cost of `n` attempts of tier `k` in one week when the lower tiers were

// it every day it's used; a higher tier only from day 2 on (day 1's
// discount went to tier 1).
function rfcTierCost(k, n) {

// A weekly plan: full 20 attempts on tiers 1..top-1 (unlocking), then `n`

// description like the sheet's ("20 T1/T2 day 1 + 6 T3").
function rfcPlan(top, n) {

  // Lower tiers are all done on day 1 to unlock the next: tier 1 gets that
  // day's one discount, the others pay full price.
  for (let k = 1; k < top; k++) {

    cost += k === 1 ? c / 2 + (RFC_LAB_MAX_PER_TIER - 1) * c : RFC_LAB_MAX_PER_TIER * c;

  cost += rfcTierCost(top, n); rfc += n * rfcExpected(RFC_LAB_TIERS[top - 1]);

  const extra = n - perDay;

  if (top === 1) {
    text = extra > 0 ? `1 T1 (${t("rfc_days")} 1-${RFC_LAB_DAYS}) + ${extra} T1 (${t("rfc_day")} ${RFC_LAB_DAYS})` : `1 T1 (${t("rfc_days")} 1-${n})`;
  } else {

      : `${lower} (${t("rfc_day")} 1) + 1 T${top} (${t("rfc_days")} 2-${perDay + 1})`;

const TRADE_TARGET_PRIORITY = {

function calcKeyOfRates(rates) {

// A rough worth for each material (in the cheapest base unit) so that,
// when several spare items could cover a shortfall, the one that wastes
// the least value is traded first. Derived from the rates themselves:
// worth(A) = max over A->B trades of worth(B) * get / give.
function tradeWorth(rates) {
  const names = new Set(); rates.forEach((r) => { names.add(r.from); names.add(r.to); });

}
// Turns spare items into missing ones. `need` and `owned` are per

// Trades happen in whole lots (give×k -> get×k), never over-trading a
// spare below what the plan itself needs.
function applyTrades(rates, need, owned, weeks) {

  const after = {};        // still short

  names.forEach((n) => {
    const have = Number(owned[n]) || 0, req = Number(need[n]) || 0;

  const trades = [];

  // Design Plans, so plans are reserved for it before anything else);
  // after that, items with the fewest ways to get them.
  const priority = TRADE_TARGET_PRIORITY[calcKeyOfRates(rates)] || [];
  const sourcesOf = (n) => rates.filter((r) => r.to === n).length;
  const shortNames = Object.keys(after).filter((n) => after[n] > 0).sort((a, b) => {
    const pa = priority.indexOf(a), pb = priority.indexOf(b);
    if (pa !== -1 || pb !== -1) return (pa === -1 ? 99 : pa) - (pb === -1 ? 99 : pb);
    return sourcesOf(a) - sourcesOf(b);

  shortNames.forEach((to) => {
    // Cheapest (least value lost) sources first.
    const options = rates.filter((r) => r.to === to && spare[r.from] > 0)

      spare[r.from] -= lots * r.give;

    // a finger swipe, which is shorter and sloppier on a small screen.
    const minX = pointerType === "mouse" ? 40 : 60;
    if (Math.abs(dx) > minX && Math.abs(dx) > Math.abs(dy) * 1.5) onSwipe(dx < 0 ? 1 : -1);
  };
  el.onpointercancel = () => { dragging = false; startX = null; };
  // Stops a mouse drag across the card from highlighting all its text.
  el.ondragstart = (e) => { if (dragging && !(e.target.closest && e.target.closest(INTERACTIVE))) e.preventDefault(); };
}
function wireTroopSwipe(el, troops, current, onSelect) {
  const idx = troops.indexOf(current);
  wireSwipeGesture(el, (dir) => {
    const next = idx + dir;
    if (next >= 0 && next < troops.length) onSelect(troops[next]);
  });
}
// Shared prev/next arrows used by both the dots and the counter, so every
// swipeable card can also be changed by clicking - swiping with a mouse is
// awkward on a PC, and a trackpad drag often scrolls the page instead.
function swipeArrowsHtml(atStart, atEnd) {
  return {
    prev: `<button type="button" class="swipe-arrow" data-swipenav="prev" aria-label="${esc(t("prev_label"))}" ${atStart ? "disabled" : ""}>&#8249;</button>`,
    next: `<button type="button" class="swipe-arrow" data-swipenav="next" aria-label="${esc(t("next_label"))}" ${atEnd ? "disabled" : ""}>&#8250;</button>`,
  };
}
function wireSwipeNav(containerEl, index, count, onNavigate) {
  if (!onNavigate) return;
  containerEl.querySelectorAll("[data-swipenav]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const to = btn.dataset.swipenav === "prev" ? index - 1
        : btn.dataset.swipenav === "next" ? index + 1
        : Number(btn.dataset.swipenav);
      if (to >= 0 && to < count && to !== index) onNavigate(to);
    });
  });
}
// A dot per item, with arrows either side. Dots are real buttons, so any
// card can be reached in one tap/click instead of several swipes.
// onSelect is optional (older callers pass nothing and stay swipe-only).
function renderSwipeDots(containerEl, items, current, colors, onSelect) {
  const index = items.indexOf(current);
  const arrows = swipeArrowsHtml(index <= 0, index >= items.length - 1);
  containerEl.innerHTML = `
    <div class="swipe-nav">
      ${onSelect ? arrows.prev : ""}
      <div class="swipe-dots">
        ${items.map((it, i) => {
          const on = it === current;
          const color = on ? ((colors && colors[it]) || "var(--ice)") : "var(--line)";
          // Troop dots are labelled with the troop's name in the chosen
          // language; numeric page dots just get "1", "2", ...
          const label = typeof it === "number" ? String(it + 1) : troopDisplayName(it);
          return onSelect
            ? `<button type="button" class="swipe-dot" data-swipenav="${i}" title="${esc(String(label))}" aria-label="${esc(String(label))}" aria-current="${on}"><i style="background:${color};"></i></button>`
            : `<span style="width:7px; height:7px; border-radius:50%; background:${color}; display:inline-block;"></span>`;
        }).join("")}
      </div>
      ${onSelect ? arrows.next : ""}
    </div>`;
  if (onSelect) wireSwipeNav(containerEl, index, items.length, (i) => onSelect(items[i]));
}
// For longer lists (pets, experts) a "3 / 10" counter reads better than a
// row of 10 dots. Arrows either side step through them one at a time.
function renderSwipeCounter(containerEl, count, activeIndex, onNavigate) {
  const arrows = swipeArrowsHtml(activeIndex <= 0, activeIndex >= count - 1);
  containerEl.innerHTML = `
    <div class="swipe-nav">
      ${onNavigate ? arrows.prev : ""}
      <span class="swipe-count">${activeIndex + 1} / ${count}${onNavigate ? "" : ` &nbsp;\u2022&nbsp; ${esc(t("swipe_to_browse"))}`}</span>
      ${onNavigate ? arrows.next : ""}
    </div>`;
  if (onNavigate) wireSwipeNav(containerEl, activeIndex, count, onNavigate);
}
function wireIndexSwipe(el, count, activeIndex, onNavigate) {
  wireSwipeGesture(el, (dir) => {
    const next = activeIndex + dir;
    if (next >= 0 && next < count) onNavigate(next);
  });
}

// Sums Guides/Designs/Secrets across all 18 charm slots.
async function updateCharmTotals() {
  let totalG = 0, totalD = 0, totalS = 0;
  CHARM_PIECES.forEach((p) => {
    CHARM_CALC_STATE[p.key].forEach((slot) => {
      const from = CHARM_CUMULATIVE[slot.current] || [0, 0, 0];
      const to = CHARM_CUMULATIVE[slot.target] || [0, 0, 0];
      totalG += Math.max(0, to[0] - from[0]);
      totalD += Math.max(0, to[1] - from[1]);
      totalS += Math.max(0, to[2] - from[2]);
    });
  });

  renderChiefGearResourcesBar("charmOwned", { "Charm Guides": totalG, "Charm Designs": totalD, "Jewel Secrets": totalS }, ["Charm Guides", "Charm Designs", "Jewel Secrets"], updateCharmTotals, "charm");

  updateCharmCurrentStats();
}

// Pure computation, reusable by both this page and the Stats dashboard.
function computeCharmStats(stateObj) {
  const troopTypes = ["Lancer", "Infantry", "Marksman"];
  const out = {};
  troopTypes.forEach((troop) => {
    const pieces = CHARM_PIECES.filter((p) => p.troop === troop);
    let sumStat = 0;
    for (const p of pieces) {
      for (const slot of stateObj[p.key]) {
        sumStat += CHARM_CUMULATIVE_STAT[slot.current] || 0;
      }
    }
    out[troop] = sumStat;
  });
  return out;
}
function maxedCharmState() {
  const out = {};
  CHARM_PIECES.forEach((p) => {
    out[p.key] = [0, 1, 2].map(() => ({ current: "18" }));
  });
  return out;
}

// Sums materials needed across all 6 gear pieces' selected ranges.
// matTotals may be a single {name: qty} object, OR an array of
// { label, totals } groups (e.g. one per Hero Gear set) - in which case a
// separate needed/still-needed row is rendered per group, all measured
// against the same shared owned amounts.
// Full material names are too long to fit "AVAILABLE BACKPACK" in one row
// on most screens - shorten just for display here (data keys stay the same).
const MATERIAL_NAME_SHORT = {
  "Hardened Alloy": "Alloy",
  "Polishing Solution": "Polish",
  "Design Plan": "Design",
};
async function renderChiefGearResourcesBar(containerId, matTotals, allMaterialNames, refreshFn, calcKey) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const groups = Array.isArray(matTotals) ? matTotals : [{ label: null, totals: matTotals }];
  const mergedNames = new Set();
  groups.forEach((g) => Object.keys(g.totals || {}).forEach((n) => mergedNames.add(n)));
  const names = allMaterialNames && allMaterialNames.length ? allMaterialNames : [...mergedNames];
  if (!names.length) {
    el.innerHTML = "";
    return;
  }
  const matEntries = names.map((name) => [name, 0]);
  const owned = await ensureMaterialOwnedCache(calcKey || "chief_gear");
  const rowsId = `${containerId}_rows`;

  // Items that open into other items (Pet Chest -> Manual/Potion/Serum,
  // Advanced Marks / Gems -> Common Marks) are the page's hidden trade
  // rules. Turn what you own of them into whichever target is short, so
  // the red "still needed" numbers count them - for every visitor, not
  // just in the owner-only Pack cost block.
  await ensureTradeRates();
  // Hidden rules always apply; unlimited visible trades (Fire Crystal → FC
  // Shard) apply too unless "use spare items" is switched off for the page.
  // Weekly-capped trades (Charm, Chief Gear) stay in the Trade block only.
  const hiddenRates = tradeRatesFor(calcKey || "chief_gear").filter((r) => r.hidden || (!(r.max > 0) && TRADE_APPLY[calcKey || "chief_gear"] !== false));
  hiddenRates.__calcKey = calcKey || "chief_gear";
  let effOwned = { ...owned };
  let hiddenTrades = []; // what owned chests/convertibles were turned into
  function recomputeEffOwned() {
    effOwned = { ...owned };
    hiddenTrades = [];
    if (!hiddenRates.length) return;
    const totalNeed = {};
    groups.forEach((g) => Object.entries(g.totals || {}).forEach(([n, q]) => { totalNeed[n] = (totalNeed[n] || 0) + (Number(q) || 0); }));
    hiddenTrades = applyTrades(hiddenRates, totalNeed, owned, 1).trades;
    hiddenTrades.forEach((tr) => { effOwned[tr.to] = (effOwned[tr.to] || 0) + tr.getQty; });
  }
  recomputeEffOwned();

  function statusFor(name, needed) {
    const haveQty = effOwned[name] || 0;
    const stillNeed = Math.max(0, needed - haveQty);
    const surplus = Math.max(0, haveQty - needed);
    // A chest / convertible item (Pet Chest, Advanced Marks...) isn't needed
    // itself: show what the ones you own are covering instead of a dash.
    if (needed === 0) {
      const used = hiddenTrades.filter((tr) => tr.from === name);
      if (used.length) {
        return {
          statusColor: "var(--good)",
          statusText: used.map((tr) => `\u2192 ${Math.round(tr.getQty).toLocaleString()} ${materialDisplayName(MATERIAL_NAME_SHORT[tr.to] || tr.to)}`).join(" \u00b7 "),
        };
      }
      if (hiddenRates.some((r) => r.from === name) && (Number(owned[name]) || 0) > 0) return { statusColor: "var(--muted)", statusText: t("chest_not_needed") };
    }
    const statusColor = needed === 0 ? "var(--muted)" : stillNeed > 0 ? "var(--danger)" : "var(--good)";
    // Per-material status: just the number (still needed / extra), no
    // wording - color alone conveys which case it is. Only the two "no
    // number" states (nothing needed yet / exactly enough) keep a short word.
    const statusText = needed === 0 ? "\u2014" : stillNeed > 0 ? `${stillNeed.toLocaleString()}` : surplus > 0 ? `\u2713 ${surplus.toLocaleString()}` : "\u2713";
    return { statusColor, statusText };
  }

  function materialCellHtml([name]) {
    const lower = name.toLowerCase();
    const custom = packCustomResource(name);
    const iconKey = Object.keys(MATERIAL_ICONS).find((k) => lower.includes(k));
    const iconSrc = custom && custom.icon ? custom.icon : iconKey ? MATERIAL_ICONS[iconKey] : "";
    const icon = iconSrc ? `<img src="${esc(iconSrc)}" alt="" style="width:22px; height:22px; object-fit:contain; flex-shrink:0; order:0;" loading="lazy" />` : "";
    const haveQty = owned[name] || 0;
    const shortName = materialDisplayName(MATERIAL_NAME_SHORT[name] || name);
    const groupStatusHtml = groups
      .map((g) => {
        const needed = Number((g.totals || {})[name]) || 0;
        const { statusColor, statusText } = statusFor(name, needed);
        return `<div data-neededstatus="${esc(name)}|${esc(g.label || "")}" style="font-size:11px; margin-top:4px;">
          ${g.label ? `<span class="meta" style="font-size:9px;">${esc(g.label)}: </span>` : ""}
          <span style="color:${statusColor};">${statusText}</span>
        </div>`;
      })
      .join("");
    return `<div style="min-width:0;">
      <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:nowrap;">
        ${icon}
        <span class="meta mat-name" style="font-size:11px; font-weight:600; letter-spacing:0.3px; order:1;">${esc(shortName)}</span>
      </div>
      <input type="text" inputmode="numeric" data-ownedmat="${esc(name)}" value="${haveQty}" style="width:100%; padding:8px 10px; font-size:14px;" />
      ${groupStatusHtml}
    </div>`;
  }

  el.innerHTML = `
    <div id="${rowsId}" class="mat-row">${matEntries.map(materialCellHtml).join("")}</div>
    <div id="${rowsId}_trades"></div>
    <div id="${rowsId}_packs"></div>
  `;
  const packBox = document.getElementById(`${rowsId}_packs`);
  const tradeBox = document.getElementById(`${rowsId}_trades`);
  const refreshPacks = () => renderPackCostBlock(document.getElementById(`${rowsId}_packs`), calcKey || "chief_gear", groups, owned);
  renderTradeBlock(tradeBox, calcKey || "chief_gear", groups, owned, refreshPacks);
  renderPackCostBlock(packBox, calcKey || "chief_gear", groups, owned);
  recordBudgetNeeds(calcKey || "chief_gear", groups);

  el.querySelectorAll("[data-ownedmat]").forEach((input) => {
    input.addEventListener("change", async () => {
      let val = Number(input.value);
      if (Number.isNaN(val) || val < 0) val = 0;
      input.value = val;
      const name = input.dataset.ownedmat;
      owned[name] = val;
      budgetInvalidate();
      await saveCalcState(`material_owned_${calcKey || "chief_gear"}`, owned);
      // Only this material's status text depends on its owned amount, so
      // update just those spans in place rather than touching the input
      // elements (which would steal focus if the user tabs straight into
      // another field before this one's change event finishes).
      // A chest / convertible item changes other materials' status too, so
      // refresh every status span (never the inputs, which would steal focus).
      recomputeEffOwned();
      names.forEach((n) => groups.forEach((g) => {
        const needed = Number((g.totals || {})[n]) || 0;
        const { statusColor, statusText } = statusFor(n, needed);
        const statusDiv = el.querySelector(`[data-neededstatus="${CSS.escape(n)}|${CSS.escape(g.label || "")}"] span:last-child`);
        if (statusDiv) {
          statusDiv.style.color = statusColor;
          statusDiv.textContent = statusText;
        }
      }));
      renderTradeBlock(document.getElementById(`${rowsId}_trades`), calcKey || "chief_gear", groups, owned, refreshPacks);
      renderPackCostBlock(document.getElementById(`${rowsId}_packs`), calcKey || "chief_gear", groups, owned);
    });
  });
}

async function updateChiefGearTotals() {
  if (!CHIEF_GEAR_ROWS) return;
  const rows = CHIEF_GEAR_ROWS;
  const CHIEF_GEAR_MATERIAL_COLS = [
    ["hardened_alloy", "Hardened Alloy"],
    ["polishing_solution", "Polishing Solution"],
    ["design_plan", "Design Plan"],
    ["amber", "Amber"],
  ];

  const matTotals = {};
  let totalPower = 0;
  CHIEF_GEAR_PIECES.forEach((p) => {
    const st = CHIEF_GEAR_STATE[p.key];
    const fromIdx = Math.min(st.from, st.to);
    const toIdx = Math.max(st.from, st.to);
    for (let i = fromIdx + 1; i <= toIdx; i++) {
      CHIEF_GEAR_MATERIAL_COLS.forEach(([col, label]) => {
        const v = Number(rows[i][col]) || 0;
        if (v) matTotals[label] = (matTotals[label] || 0) + v;
      });
    }
    const powerFrom = rows[fromIdx].power != null ? Number(rows[fromIdx].power) : 0;
    const powerTo = rows[toIdx].power != null ? Number(rows[toIdx].power) : 0;
    totalPower += powerTo - powerFrom;
  });

  renderChiefGearResourcesBar("gearOwned", matTotals, ["Hardened Alloy", "Polishing Solution", "Design Plan", "Amber"], updateChiefGearTotals, "chief_gear");

  updateChiefGearCurrentStats();
}

// Sums current Attack/Defense per troop type from its 2 pieces'
// current tier (each piece's stat applies to both Attack & Defense).
// Pure computation, reusable by both this page and the Stats dashboard.
// 3-piece (Defense, all troops) and 6-piece (Attack, all troops) set
// bonuses for equipping matching-tier gear. Confirmed player-provided
// values; the 6-piece table uses the same percentages as the 3-piece
// table, just requiring all 6 pieces (not just 3) to match tier.
let CHIEF_GEAR_SET_BONUS = {};
let CHIEF_GEAR_TIER_ORDER = [];
let CHIEF_GEAR_SET_BONUS_LOADED = false;
let CHIEF_GEAR_SET_BONUS_PROMISE = null;
async function ensureChiefGearSetBonusData() {
  // Callers running at the same time share one in-flight download.
  if (CHIEF_GEAR_SET_BONUS_LOADED) return CHIEF_GEAR_SET_BONUS_PROMISE;
  CHIEF_GEAR_SET_BONUS_LOADED = true;
  CHIEF_GEAR_SET_BONUS_PROMISE = (async () => {
  const rows = await sb(`chief_gear_set_bonus?select=tier,bonus_pct&order=sort_order.asc`);
  CHIEF_GEAR_SET_BONUS = {};
  CHIEF_GEAR_TIER_ORDER = [];
  rows.forEach((r) => {
    CHIEF_GEAR_SET_BONUS[r.tier] = Number(r.bonus_pct);
    CHIEF_GEAR_TIER_ORDER.push(r.tier);
  });
  })().catch((e) => { CHIEF_GEAR_SET_BONUS_LOADED = false; throw e; });
  return CHIEF_GEAR_SET_BONUS_PROMISE;
}

// Looks at all 6 pieces' current tier and returns which set bonuses
// are active. A piece counts toward a tier's requirement if it's at
// that tier OR HIGHER (a piece above the threshold still qualifies).
// 3-piece bonus needs >=3 pieces at/above some tier; 6-piece needs all 6.
function computeChiefGearSetBonus(stateObj) {
  if (!CHIEF_GEAR_ROWS) return { threeTier: null, threeBonus: 0, sixTier: null, sixBonus: 0 };
  const pieceTierIdx = CHIEF_GEAR_PIECES.map((p) => {
    const idx = stateObj[p.key].from;
    const tier = CHIEF_GEAR_ROWS[idx]?.tier;
    return tier ? CHIEF_GEAR_TIER_ORDER.indexOf(tier) : -1;
  });
  let threeTier = null, sixTier = null;
  // walk tiers from highest to lowest; first (highest) tier that enough pieces qualify for wins
  for (let ti = CHIEF_GEAR_TIER_ORDER.length - 1; ti >= 0; ti--) {
    const qualifying = pieceTierIdx.filter((idx) => idx >= ti).length;
    if (threeTier === null && qualifying >= 3) threeTier = CHIEF_GEAR_TIER_ORDER[ti];
    if (sixTier === null && qualifying >= 6) sixTier = CHIEF_GEAR_TIER_ORDER[ti];
    if (threeTier !== null && sixTier !== null) break;
  }
  return {
    threeTier,
    threeBonus: threeTier ? CHIEF_GEAR_SET_BONUS[threeTier] || 0 : 0,
    sixTier,
    sixBonus: sixTier ? CHIEF_GEAR_SET_BONUS[sixTier] || 0 : 0,
  };
}

// Returns {Lancer: {Attack, Defense}, Infantry: {...}, Marksman: {...}}.
// Per-piece stat boosts both Attack and Defense for its own troop type;
// the 3-piece bonus adds to Defense for ALL troops, the 6-piece bonus
// adds to Attack for ALL troops (per the in-game set bonus mechanic).
// Raw per-piece gear stat only, no set bonus baked in - used by the
// dashboard's "Chief" source since "Chief Bonus" tracks the set bonus
// as its own separate line (computeChiefGearStats bakes both together,
// which is right for the Chief Gear page's own display, but would
// double-count the bonus if reused for the dashboard breakdown).
function computeChiefGearRawStat(stateObj) {
  if (!CHIEF_GEAR_ROWS) return {};
  const rows = CHIEF_GEAR_ROWS;
  const troopTypes = ["Lancer", "Infantry", "Marksman"];
  const out = {};
  troopTypes.forEach((troop) => {
    const pieces = CHIEF_GEAR_PIECES.filter((p) => p.troop === troop);
    let sumStat = 0;
    for (const p of pieces) {
      const idx = stateObj[p.key].from;
      sumStat += parseStatPct(rows[idx]?.stat) || 0;
    }
    out[troop] = { Attack: sumStat, Defense: sumStat };
  });
  return out;
}
function computeChiefGearStats(stateObj) {
  if (!CHIEF_GEAR_ROWS) return {};
  const rows = CHIEF_GEAR_ROWS;
  const troopTypes = ["Lancer", "Infantry", "Marksman"];
  const { threeBonus, sixBonus } = computeChiefGearSetBonus(stateObj);
  const out = {};
  troopTypes.forEach((troop) => {
    const pieces = CHIEF_GEAR_PIECES.filter((p) => p.troop === troop);
    let sumStat = 0;
    for (const p of pieces) {
      const idx = stateObj[p.key].from;
      sumStat += parseStatPct(rows[idx]?.stat) || 0;
    }
    out[troop] = { Attack: sumStat + sixBonus, Defense: sumStat + threeBonus };
  });
  return out;
}
function maxedChiefGearState() {
  const out = {};
  CHIEF_GEAR_PIECES.forEach((p) => {
    out[p.key] = { from: Math.max(0, (CHIEF_GEAR_ROWS || []).length - 1) };
  });
  return out;
}

function updateChiefGearCurrentStats() {
  const el = document.getElementById("gearCurrentStats");
  if (!el || !CHIEF_GEAR_ROWS) return;
  const statByTroop = computeChiefGearRawStat(CHIEF_GEAR_STATE);
  const maxByTroop = computeChiefGearRawStat(maxedChiefGearState());
  const { threeTier, threeBonus, sixTier, sixBonus } = computeChiefGearSetBonus(CHIEF_GEAR_STATE);
  const results = Object.entries(statByTroop).map(([troop, stats]) => ({ troop, stats, max: maxByTroop[troop] }));

  const setBonusHtml = `
    <div class="stats-row-scroll" style="margin-bottom:14px;">

        <div class="label">${esc(t("three_piece_def"))}</div>
        <div class="val" style="color:${threeBonus ? "var(--good)" : "var(--muted)"};">${threeBonus ? `+${threeBonus}%` : esc(t("not_active"))}</div>
      </div>

      </div>

  `;

  el.innerHTML =

    results
      .map(
        (r, idx) => `
    <div style="${idx > 0 ? "border-left:1px solid var(--line); padding-left:12px;" : ""} display:flex; flex-direction:column; align-items:center; text-align:center;">

    </div>`
      )
      .join("") +
    `</div>`;
}

// Renders a "menu button + scrollable tab row" category switcher into
// containerEl. Only one category is shown at a time (matching the game's
// own menu pattern), selected via either the tabs or the "..." dropdown.
function renderCategorySwitcher(containerEl, categories, current, onSelect) {
  containerEl.innerHTML = `
    <div class="cat-switcher">
      <div style="position:relative;">
        <button class="cat-menu-btn" type="button" id="${containerEl.id}MenuBtn" title="${esc(t("all_categories"))}">&#9776;</button>
        <div class="cat-menu-panel" id="${containerEl.id}MenuPanel">
          ${categories.map((c) => `<button data-cat="${esc(c)}" class="${c === current ? "active" : ""}">${esc(c)} ${c === current ? "&#10003;" : ""}</button>`).join("")}
        </div>
      </div>
      <div class="cat-tabs" id="${containerEl.id}Tabs">
        ${categories.map((c) => `<button data-cat="${esc(c)}" class="${c === current ? "active" : ""}">${esc(c)}</button>`).join("")}
      </div>
    </div>
  `;
  const menuBtn = document.getElementById(`${containerEl.id}MenuBtn`);
  const menuPanel = document.getElementById(`${containerEl.id}MenuPanel`);
  menuBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    menuPanel.classList.toggle("open");
  });
  document.addEventListener("click", () => menuPanel.classList.remove("open"), { once: true });
  containerEl.querySelectorAll("button[data-cat]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      onSelect(btn.dataset.cat);
    });
  });
}

// Opens the tap-to-edit detail modal for a skin or island card. For plain
// skins this is just an Owned toggle (+ Count in max, when applicable);
// for islands (isIsland=true) it's a level dropdown, and owned is derived
// automatically from level > 0.
// Opens the tap-to-edit detail modal for a skin or island, as position
// `index` within `list` (the currently filtered/visible cards). Swiping the
// card left/right moves to the next/previous item without closing the
// modal - matching how the in-game gallery browses items.
function openGalleryDetailModal(list, index, { isIsland = false, onSave }) {
  const item = list[index];
  let modal = document.getElementById("galleryDetailModal");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "galleryDetailModal";
    modal.className = "modal-overlay";
    document.body.appendChild(modal);
    modal.addEventListener("click", (e) => { if (e.target === modal) modal.style.display = "none"; });
  }
  const maxLvl = item.max_level ?? 10;
  const lvl = item.current_level ?? 0;
  const goTo = (newIndex) => {
    if (newIndex < 0 || newIndex >= list.length) return;
    openGalleryDetailModal(list, newIndex, { isIsland, onSave });
  };
  modal.innerHTML = `
    <div class="modal-box" id="galleryModalBox" style="max-width:300px; text-align:center; touch-action:pan-y; padding:18px;">
      ${!isIsland ? `<div class="meta" style="font-size:11px; margin-bottom:8px;">${index + 1} / ${list.length}</div>` : ""}
      ${isIsland ? "" : `<div class="thumb" style="width:140px; height:140px; margin:0 auto 10px; border-radius:10px; background:var(--panel-2); display:flex; align-items:center; justify-content:center; overflow:hidden; padding:6%;">
        ${item.image_url ? `<img src="${esc(item.image_url)}" alt="" style="width:100%; height:100%; object-fit:contain;" />` : `<div class="ph" style="font-size:28px; color:var(--muted); font-weight:600;">${esc(item.name[0])}</div>`}
      </div>`}
      <h2 style="margin-bottom:${isIsland ? "14px" : "4px"}; font-size:${isIsland ? "15px" : "16px"};">${esc(item.name)}</h2>
      ${isIsland ? "" : `<p class="desc" style="margin-bottom:16px;">${esc(item.category || "")}</p>`}
      ${isIsland
        ? `<div style="display:flex; align-items:center; gap:10px; text-align:start;">
             <div style="flex:1;">
               <label style="font-size:11px; display:block; margin-bottom:4px;">${esc(t("level_label"))}</label>
               <select id="galleryModalLevel" style="width:100%;">
                 ${Array.from({ length: maxLvl + 1 }, (_, i) => `<option value="${i}" ${i === lvl ? "selected" : ""}>${i === 0 ? esc(t("not_built")) : `${t("level_prefix")} ${i}`}</option>`).join("")}
               </select>
             </div>
             <label style="display:flex; align-items:center; gap:6px; cursor:pointer; padding-top:18px; flex-wrap:nowrap;">
               <input type="checkbox" id="galleryModalIslandOwned" ${item.owned ? "checked" : ""} />
               <span class="meta" style="font-size:12px;">${esc(t("owned_checkbox"))}</span>
             </label>
           </div>`
        : `<button class="btn" id="galleryModalOwnedBtn" style="width:100%; margin-bottom:${item.show_count_toggle ? "10px" : "0"};">${item.owned ? esc(t("owned_tap_unown")) : esc(t("mark_as_owned"))}</button>
           ${item.show_count_toggle ? `<label style="display:flex; align-items:center; gap:6px; justify-content:center; cursor:pointer; flex-wrap:nowrap;">
             <input type="checkbox" id="galleryModalCountInMax" ${item.count_in_max !== false ? "checked" : ""} />
             <span class="meta" style="font-size:12px;">${esc(t("count_toward_max"))}</span>
           </label>` : ""}`
      }
      ${isIsland
        ? `<button class="btn ghost small" id="galleryModalClose" style="width:100%; margin-top:14px;">${esc(t("close_button"))}</button>`
        : `<div style="display:flex; gap:8px; margin-top:16px;">
             <button class="btn ghost small" id="galleryModalPrev" style="flex:1;" ${index === 0 ? "disabled" : ""}>&#8592; ${esc(t("prev_label"))}</button>
             <button class="btn ghost small" id="galleryModalClose" style="flex:1;">${esc(t("close_button"))}</button>
             <button class="btn ghost small" id="galleryModalNext" style="flex:1;" ${index === list.length - 1 ? "disabled" : ""}>${esc(t("next_label"))} &#8594;</button>
           </div>`
      }
    </div>`;
  modal.style.display = "flex";
  document.getElementById("galleryModalClose").addEventListener("click", () => { modal.style.display = "none"; });

  if (!isIsland) {
    document.getElementById("galleryModalPrev").addEventListener("click", () => goTo(index - 1));
    document.getElementById("galleryModalNext").addEventListener("click", () => goTo(index + 1));

    // Swipe/drag left/right on the card to move between items (skins only -
    // islands are edited one at a time with no browsing). Works with touch,
    // mouse, or pen via wireSwipeGesture; vertical scrolling still works
    // normally via touch-action:pan-y above.
    const box = document.getElementById("galleryModalBox");
    wireSwipeGesture(box, (dir) => goTo(index + dir));
  }

  if (isIsland) {
    document.getElementById("galleryModalLevel").addEventListener("change", async (e) => {
      const newLvl = Number(e.target.value);
      await onSave(item, { current_level: newLvl });
      item.current_level = newLvl;
    });
    document.getElementById("galleryModalIslandOwned").addEventListener("change", async (e) => {
      await onSave(item, { owned: e.target.checked });
      item.owned = e.target.checked;
    });
  } else {
    document.getElementById("galleryModalOwnedBtn").addEventListener("click", async () => {
      await onSave(item, { owned: !item.owned });
      item.owned = !item.owned;
      goTo(index);
    });
    const cim = document.getElementById("galleryModalCountInMax");
    if (cim) {
      cim.addEventListener("change", async () => {
        await onSave(item, { count_in_max: cim.checked });
        item.count_in_max = cim.checked;
      });
    }
  }
}

    5: ["Star Radiance"],
  };
  function namesForGlobeLevel(level) {
    if (!level) return [];
    const roman = GLOBE_LEVEL_ROMAN[level];
    return [`Frost Sphere ${roman}`, ...(GLOBE_LEVEL_EXTRA_SKINS[level] || [])];
  }
  // Every skin tied to the Globe Level selector, across all 6 levels (Frost
  // Sphere I-VI plus the extra per-level unlocks). These are excluded from
  // totals entirely until a globe level is picked, and only the currently
  // selected level's items count afterward (not a theoretical ceiling).
  const ALL_GLOBE_WIRED_NAMES = new Set([
    ...Object.values(GLOBE_LEVEL_ROMAN).map((roman) => `Frost Sphere ${roman}`),
    ...Object.values(GLOBE_LEVEL_EXTRA_SKINS).flat(),
  ]);
  // Regardless of the dropdown, if the user has manually toggled one or more
  // Frost Sphere cards owned directly, the HIGHEST owned tier is what
  // actually counts toward current/max - not necessarily the dropdown value.
  function deriveEffectiveGlobeLevel() {
    let highest = 0;
    for (let level = 1; level <= 6; level++) {
      const roman = GLOBE_LEVEL_ROMAN[level];
      const skin = skins.find((s) => s.name === `Frost Sphere ${roman}`);
      if (skin && skin.owned) highest = level;
    }
    return highest || globeLevelSaved.level;
  }
  globeLevelSelect.addEventListener("change", async (e) => {
    const level = Number(e.target.value);
    const prevLevel = globeLevelSaved.level;
    await saveCalcState("skin_globe_level", { level });
    globeLevelSaved.level = level;

    const changed = [];
    // Un-own whatever the previous level auto-owned.
    if (prevLevel !== level) {
      for (const name of namesForGlobeLevel(prevLevel)) {
        const matchingSkin = skins.find((s) => s.name === name);
        if (matchingSkin && matchingSkin.owned) {
          try {
            await sb(`skins?id=eq.${matchingSkin.id}`, { method: "PATCH", body: JSON.stringify({ owned: false }) });
            matchingSkin.owned = false;
            changed.push(`-${name}`);
          } catch (err) {
            toast(`Couldn't update ${name}`, true);
          }
        }
      }
    }
    // Own whatever the new level auto-owns.
    for (const name of namesForGlobeLevel(level)) {
      const matchingSkin = skins.find((s) => s.name === name);
      if (matchingSkin && !matchingSkin.owned) {
        try {
          await sb(`skins?id=eq.${matchingSkin.id}`, { method: "PATCH", body: JSON.stringify({ owned: true }) });
          matchingSkin.owned = true;
          changed.push(name);
        } catch (err) {
          toast(`Couldn't update ${name}`, true);
        }
      }
    }
    if (changed.length) {
      toast(`Updated: ${changed.join(", ")}`);
      computeAndRender();
    }
  });

  function computeAndRender() {
    const filtered = skins.filter((s) => {
      if (SKIN_FILTER.category !== "all" && s.category !== SKIN_FILTER.category) return false;
      if (SKIN_FILTER.ownedFilter === "owned" && !s.owned) return false;
      if (SKIN_FILTER.ownedFilter === "not" && s.owned) return false;
      if (SKIN_FILTER.search && !s.name.toLowerCase().includes(SKIN_FILTER.search.toLowerCase())) return false;
      return true;
    });

    const ownedCount = skins.filter((s) => s.owned).length;
    document.getElementById("skinSummaryLine").textContent =
      `${ownedCount} / ${skins.length} ${t("skins_owned_summary")}`;

    // totals by bonus_type: current (owned only) vs max (everything, as if fully owned).
    // Skins sharing a display_group (e.g. Frost Sphere I-VI) are mutually
    // exclusive tiers of the same item, so max only counts the single
    // highest tier per group/stat, not the sum of every tier.
    const STAT_SLOTS = [
      ["bonus_type", "bonus_value"],
      ["bonus_type2", "bonus_value2"],
      ["bonus_type3", "bonus_value3"],
      ["bonus_type4", "bonus_value4"],
    ];
    const totalsByType = {};
    const maxByType = {};
    const maxByGroupType = {}; // { "Frost Sphere|Troops Attack": highestValueSoFar }
    const currentGlobeNames = new Set(namesForGlobeLevel(deriveEffectiveGlobeLevel()));
    for (const s of skins) {
      // Globe-wired skins (Frost Sphere tiers + per-level extras) don't count
      // toward totals at all until a globe level is picked, and only the
      // currently selected level's items count afterward - not every tier.
      if (ALL_GLOBE_WIRED_NAMES.has(s.name) && !currentGlobeNames.has(s.name)) continue;
      const includeInMax = s.count_in_max !== false;
      STAT_SLOTS.forEach(([tk, vk]) => {
        if (s[vk] == null) return;
        const key = s[tk] || "Other";
        const val = Number(s[vk]);
        if (includeInMax) {
          if (s.display_group) {
            const groupKey = `${s.display_group}|${key}`;
            const prevMax = maxByGroupType[groupKey] || 0;
            if (val > prevMax) {
              maxByType[key] = (maxByType[key] || 0) - prevMax + val;
              maxByGroupType[groupKey] = val;
            }
          } else {
            maxByType[key] = (maxByType[key] || 0) + val;
          }
        }
        if (s.owned) totalsByType[key] = (totalsByType[key] || 0) + val;
      });
    }
    const STAT_ORDER = ["Attack", "Defense", "Lethality", "Health"];
    function statOrderIndex(label) {
      const bare = label.replace(/^Troops?\s+/i, "");
      return STAT_ORDER.indexOf(bare);
    }
    const totalEntries = Object.entries(maxByType).sort((a, b) => {
      const ia = statOrderIndex(a[0]);
      const ib = statOrderIndex(b[0]);
      if (ia === -1 && ib === -1) return a[0].localeCompare(b[0]);
      if (ia === -1) return 1;
      if (ib === -1) return -1;
      return ia - ib;
    });
    document.getElementById("skinTotals").innerHTML = totalEntries.length
      ? totalEntries
          .map(([type, maxVal]) => {
            const bare = type.replace(/^Troops?\s+/i, "");
            const label = STAT_ORDER.includes(bare) ? `Troop ${bare}` : type;
            return `<div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">Total ${esc(label)}</div><div class="val" style="font-size:13px;">+${(totalsByType[type] || 0).toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${maxVal.toFixed(1)}%</div></div>`;
          })
          .join("")
      : `<div class="metric" style="grid-column:1/-1;"><div class="label">${esc(t("total_bonus"))}</div><div class="val">+0%</div><div class="meta" style="font-size:11px; margin-top:2px;">${esc(t("mark_skins_owned_hint"))}</div></div>`;


    const sections = document.getElementById("skinSections");
    // filtered is already scoped to the one selected category (plus search/
    // owned filters), so this renders a single flat grid - no more
    // per-category panels stacked on top of each other.
    const ordered = [
      ...filtered.filter((s) => !s.show_count_toggle),
      ...filtered.filter((s) => s.show_count_toggle),
    ];
    if (!ordered.length) {
      sections.innerHTML = `<div class="panel"><div class="empty"><div class="big">${esc(t("no_skins_match_filters"))}</div></div></div>`;
      return;
    }
    sections.innerHTML = `
      <div class="gallery-grid">
        ${ordered
          .map((s, idx) => {
            const isLastGlobe = s.display_group === "Frost Sphere" && ordered[idx + 1]?.display_group !== "Frost Sphere";
            const isLastNonToggle = !s.show_count_toggle && ordered[idx + 1]?.show_count_toggle;
            return `
          <div class="gallery-card ${s.owned ? "owned" : ""}" data-skin="${s.id}">
            <div class="thumb">
              ${s.image_url ? `<img src="${esc(s.image_url)}" alt="" loading="lazy" />` : `<div class="ph">${esc(s.name[0])}</div>`}
            </div>
            <div class="badge">${esc(s.name)}</div>
            ${s.show_count_toggle ? `<label style="display:flex; align-items:center; justify-content:center; gap:4px; padding:4px 6px; background:var(--panel-2); flex-wrap:nowrap;" onclick="event.stopPropagation()">
              <input type="checkbox" data-countinmax="${s.id}" ${s.count_in_max !== false ? "checked" : ""} style="width:12px; height:12px;" />
              <span class="meta" style="font-size:8.5px;">${esc(t("count_in_max"))}</span>
            </label>` : ""}
          </div>${isLastGlobe || isLastNonToggle ? `<div style="grid-column:1/-1; height:1px; background:var(--line); margin:2px 0;"></div>` : ""}`;
          })
          .join("")}
      </div>
    `;

    sections.querySelectorAll("[data-skin]").forEach((el) => {
      el.addEventListener("click", async () => {
        const skin = skins.find((s) => s.id === el.dataset.skin);
        const newOwned = !skin.owned;
        try {
          await sb(`skins?id=eq.${skin.id}`, { method: "PATCH", body: JSON.stringify({ owned: newOwned }) });
          skin.owned = newOwned;
          computeAndRender();
        } catch (err) {
          toast("Couldn't update skin", true);
        }
      });
    });
    sections.querySelectorAll("[data-countinmax]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const skin = skins.find((s) => s.id === cb.dataset.countinmax);
        const newVal = cb.checked;
        try {
          await sb(`skins?id=eq.${skin.id}`, { method: "PATCH", body: JSON.stringify({ count_in_max: newVal }) });
          skin.count_in_max = newVal;
          computeAndRender();
        } catch (err) {
          toast("Couldn't update count in max", true);
        }
      });
    });
    }

  document.getElementById("skinSearch").addEventListener("input", (e) => {
    SKIN_FILTER.search = e.target.value;
    computeAndRender();
  });
  document.getElementById("ownedSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-owned]");
    if (!btn) return;
    SKIN_FILTER.ownedFilter = btn.dataset.owned;
    document.querySelectorAll("#ownedSeg button").forEach((b) => b.classList.toggle("active", b === btn));
    computeAndRender();
  });

  computeAndRender();
}

let ISLAND_FILTER = { search: "", bonusType: "all", ownedFilter: "all" };

async function renderIslandGallery() {
  const islandCats = await sb(`skin_page_categories?page=eq.islands&select=category,sort_order&order=sort_order.asc`);
  const catList = islandCats.length ? islandCats.map((c) => c.category) : ["Island"];
  const islands = await sb(
    `skins?user_id=eq.${USER_ID}&category=in.(${catList.map((c) => encodeURIComponent(c)).join(",")})&select=id,category,name,image_url,bonus_type,bonus_value,bonus_level1,bonus_type2,bonus_value2,bonus_level2,bonus_type3,bonus_value3,bonus_level3,bonus_type4,bonus_value4,bonus_level4,display_group,owned,current_level,max_level&order=sort_order.asc`
  );
  const TROOPS = ["Infantry", "Lancers", "Marksman"];
  const RAW_STATS = ["Attack", "Defense", "Lethality", "Health"];
  const STAT_SLOTS = [
    ["bonus_type", "bonus_value", "bonus_level1"],
    ["bonus_type2", "bonus_value2", "bonus_level2"],
    ["bonus_type3", "bonus_value3", "bonus_level3"],
    ["bonus_type4", "bonus_value4", "bonus_level4"],
  ];
  // Group by the same categories Admin uses (Attack / Defense / Lighthouse /
  // MVP / Islands Guide), in the same order, so this page and the Islands
  // admin tab always show buildings identically.
  const BONUS_ORDER = catList;

  function groupsFor(s) {
    return [s.category || "Other"];
  }

  const bonusTypes = [...new Set(islands.flatMap(groupsFor))].sort((a, b) => {
    const ia = BONUS_ORDER.indexOf(a);
    const ib = BONUS_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>${esc(t("islandgallery_title"))}</h2>
        <div class="sub" id="islandSummaryLine"></div>
      </div>
    </div>
    <div class="stats-row-scroll" id="islandTroopTotals" style="margin-bottom:20px;"></div>
    <div id="islandCatSwitcher"></div>
    <div class="filter-bar" style="margin-bottom:12px;">
      <input id="islandSearch" placeholder="${esc(t("search_islands_placeholder"))}" style="flex:1; min-width:160px;" />
      <div class="seg" id="islandOwnedSeg">
        <button data-owned="all" class="active">${esc(t("all_label"))}</button>
        <button data-owned="owned">${esc(t("owned_label"))}</button>
        <button data-owned="not">${esc(t("not_owned_label"))}</button>
      </div>
    </div>
    <div id="islandSections"></div>
  `;

  if (ISLAND_FILTER.bonusType === "all" || !bonusTypes.includes(ISLAND_FILTER.bonusType)) {
    ISLAND_FILTER.bonusType = bonusTypes[0] || "all";
  }
  function onIslandCatSelect(cat) {
    ISLAND_FILTER.bonusType = cat;
    renderCategorySwitcher(document.getElementById("islandCatSwitcher"), bonusTypes, ISLAND_FILTER.bonusType, onIslandCatSelect);
    computeAndRender();
  }
  renderCategorySwitcher(document.getElementById("islandCatSwitcher"), bonusTypes, ISLAND_FILTER.bonusType, onIslandCatSelect);

  function computeAndRender() {
    const filtered = islands.filter((s) => {
      const groups = groupsFor(s);
      if (ISLAND_FILTER.bonusType !== "all" && !groups.includes(ISLAND_FILTER.bonusType)) return false;
      if (ISLAND_FILTER.ownedFilter === "owned" && !s.owned) return false;
      if (ISLAND_FILTER.ownedFilter === "not" && s.owned) return false;
      if (ISLAND_FILTER.search && !s.name.toLowerCase().includes(ISLAND_FILTER.search.toLowerCase())) return false;
      return true;
    });

    const ownedCount = islands.filter((s) => s.owned).length;
    document.getElementById("islandSummaryLine").textContent =
      `${ownedCount} / ${islands.length} ${t("islands_owned_summary")}`;

    // Total Attack/Defense/Lethality/Health per troop: raw-stat islands count
    // toward every troop (they buff all troops equally); display_group
    // islands (MVP, Lighthouses) count toward every troop too, since their
    // stats are still real Attack/Defense/Lethality/Health values.
    // Row 1: general (troop-agnostic) totals from islands with a plain
    // Attack/Defense/Lethality/Health stat (these buff every troop equally).
    // Row 2: totals from islands whose stat is already troop-specific
    // (Infantry Attack, Lancers Defense, etc. - the Island Guide buildings).
    const generalTotals = {}; // stat -> {cur, max}
    const specificTotals = {}; // "Troop Stat" -> {cur, max}
    for (const s of islands) {
      const lvl = s.current_level ?? 0;
      const maxLvl = s.max_level ?? 10;
      STAT_SLOTS.forEach(([typeKey, valKey, levelKey]) => {
        const stat = s[typeKey];
        if (s[valKey] == null || !stat) return;
        const unlockLvl = s[levelKey];
        const effective = !s.owned || !lvl || !maxLvl ? 0 : unlockLvl != null ? (lvl >= unlockLvl ? Number(s[valKey]) : 0) : (Number(s[valKey]) * lvl) / maxLvl;
        if (RAW_STATS.includes(stat)) {
          generalTotals[stat] = generalTotals[stat] || { cur: 0, max: 0 };
          generalTotals[stat].max += Number(s[valKey]);
          generalTotals[stat].cur += effective;
        } else {
          const isTroopStat = TROOPS.some((t) => stat.startsWith(t));
          if (!isTroopStat) return;
          specificTotals[stat] = specificTotals[stat] || { cur: 0, max: 0 };
          specificTotals[stat].max += Number(s[valKey]);
          specificTotals[stat].cur += effective;
        }
      });
    }
    const STAT_ABBR2 = { Attack: "ATK", Defense: "DEF", Lethality: "LETH", Health: "HP" };
    const row1 = RAW_STATS.map((stat) => {
      const tot = generalTotals[stat] || { cur: 0, max: 0 };
      return `<div class="metric" style="padding:6px; min-width:75px;"><div class="label" style="font-size:9px;">Troops ${esc(STAT_ABBR2[stat] || stat)}</div><div class="val" style="font-size:13px;">+${tot.cur.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${tot.max.toFixed(1)}%</div></div>`;
    }).join("");
    const row2Order = ["Infantry Attack", "Infantry Defense", "Lancers Attack", "Lancers Defense", "Marksman Attack", "Marksman Defense"];
    const row2Abbr = { "Infantry Attack": "Inf ATK", "Infantry Defense": "Inf DEF", "Lancers Attack": "Lan ATK", "Lancers Defense": "Lan DEF", "Marksman Attack": "Mark ATK", "Marksman Defense": "Mark DEF" };
    const row2 = row2Order.map((label) => {
      const tot = specificTotals[label] || { cur: 0, max: 0 };
      return `<div class="metric" style="padding:6px; min-width:75px;"><div class="label" style="font-size:9px;">${esc(row2Abbr[label] || label)}</div><div class="val" style="font-size:13px;">+${tot.cur.toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${tot.max.toFixed(1)}%</div></div>`;
    }).join("");
    document.getElementById("islandTroopTotals").innerHTML = row1 + row2;

    const sections = document.getElementById("islandSections");
    // filtered is already scoped to the one selected category, so render a
    // single flat grid instead of stacked per-category panels.
    if (!filtered.length) {
      sections.innerHTML = `<div class="panel"><div class="empty"><div class="big">No islands match your filters.</div></div></div>`;
      return;
    }
    sections.innerHTML = `
      <div class="gallery-grid">
        ${filtered
          .map((s) => `
          <div class="gallery-card ${s.owned ? "owned" : ""}" data-island="${s.id}">
            <div class="thumb island-thumb">
              ${s.image_url ? `<img src="${esc(s.image_url)}" alt="" loading="lazy" />` : `<div class="ph">${esc(s.name[0])}</div>`}
            </div>
            <div class="badge"><span class="badge-name">${esc(s.name)}</span><span class="badge-lvl">Lv${s.current_level ?? 0}</span></div>
          </div>`)
          .join("")}
      </div>
    `;

    sections.querySelectorAll("[data-island]").forEach((el) => {
      el.addEventListener("click", () => {
        const idx = filtered.findIndex((s) => s.id === el.dataset.island);
        openGalleryDetailModal(filtered, idx, {
          isIsland: true,
          onSave: async (island, patch) => {
            try {
              await sb(`skins?id=eq.${island.id}`, { method: "PATCH", body: JSON.stringify(patch) });
              Object.assign(island, patch);
              computeAndRender();
            } catch (err) {
              toast("Couldn't update island", true);
            }
          },
        });
      });
    });
  }

  document.getElementById("islandSearch").addEventListener("input", (e) => {
    ISLAND_FILTER.search = e.target.value;
    computeAndRender();
  });
  document.getElementById("islandOwnedSeg").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-owned]");
    if (!btn) return;
    ISLAND_FILTER.ownedFilter = btn.dataset.owned;
    document.querySelectorAll("#islandOwnedSeg button").forEach((b) => b.classList.toggle("active", b === btn));
    computeAndRender();
  });

  computeAndRender();
}

const GLOBE_LEVEL_EXTRA_SKINS_GLOBAL = {

// Same logic as the Experts page's computeBaseTroopStats(): all 10 experts'
// level-based base stats, plus Romulus's Last Line & Spirit of Aeetis and
// Gareth's Porcupine & Undefeated Will skills. Troop-agnostic (same bonus
// applies to all troop types).
function computeExpertsTroopStatsGlobal(useMax) {
  const totals = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
  const ALL_EXPERTS = EXPERTS_LIST.map((e) => e.key);
  ALL_EXPERTS.forEach((hero) => {
    if (!unlockedFor("experts", hero, EXPERTS_UNLOCKED_GLOBAL && EXPERTS_UNLOCKED_GLOBAL[hero])) return;
    const rows = (EXPERT_AFFINITY_CACHE_GLOBAL && EXPERT_AFFINITY_CACHE_GLOBAL[hero]) || [];
    if (!rows.length) return;
    let row;
    if (useMax) {
      row = rows[rows.length - 1];
    } else {
      const lvl = EXPERTS_STATE_GLOBAL[hero] ? EXPERTS_STATE_GLOBAL[hero].current : 0;
      row = rows.find((r) => r.level === lvl);
    }
    if (row && row.stat_type) {
      row.stat_type.split(",").forEach((statName) => {
        if (totals[statName] != null) totals[statName] += Number(row.stat_value) || 0;
      });
    }
  });
  [
    ["Romulus", "Last Line"],
    ["Romulus", "Spirit of Aeetis"],
    ["Gareth", "Porcupine"],
    ["Gareth", "Undefeated Will"],
  ].forEach(([hero, skill]) => {
    if (!unlockedFor("experts", hero, EXPERTS_UNLOCKED_GLOBAL && EXPERTS_UNLOCKED_GLOBAL[hero])) return;
    const rows = (EXPERT_TROOP_SKILL_CACHE_GLOBAL && EXPERT_TROOP_SKILL_CACHE_GLOBAL[`${hero}|${skill}`]) || [];
    if (!rows.length) return;
    let row;
    if (useMax) {
      row = rows[rows.length - 1];
    } else {
      const st = EXPERTS_STATE_GLOBAL[hero] && EXPERTS_STATE_GLOBAL[hero].skills && EXPERTS_STATE_GLOBAL[hero].skills[skill];
      const cur = st ? st.current : 0;
      let match = null;
      rows.forEach((r) => {
        if (r.level <= cur) match = r;
      });
      row = match;
    }
    if (row && row.stat_type) {
      row.stat_type.split(",").forEach((statName) => {
        if (totals[statName] != null) totals[statName] += Number(row.stat_value) || 0;
      });
    }
  });
  return totals;
}

// ---- Experts Research (Dashboard wiring) ----
// Mirrors the logic in renderExpertsResearchPage(): general experts'
// rotation+main stat apply to all 3 troop types; Gareth's main stat is
// Lancers-only, Justus's is Infantry-only. Marksman gets general only.
let EXPERTS_RESEARCH_NODES_GLOBAL = null; // { expert: { pathNum: [rows] } }
let EXPERTS_RESEARCH_STATE_GLOBAL = null; // saved current/desired per expert/path
let EXPERTS_RESEARCH_UNLOCKED_GLOBAL = null;
async function ensureExpertsResearchDataGlobal() {
  if (EXPERTS_RESEARCH_NODES_GLOBAL) return;
  const [, rows, savedResearch, savedResearchUnlocked] = await Promise.all([
    ensureExpertsRosterGlobal(),
    sb(`expert_research_nodes?select=expert,path_number,level,stat_type,stat_value&order=sort_order`),
    loadCalcState("experts_research"),
    loadCalcState("experts_research_unlocked"),
  ]);
  EXPERTS_RESEARCH_NODES_GLOBAL = {};
  rows.forEach((r) => {
    if (!EXPERTS_RESEARCH_NODES_GLOBAL[r.expert]) EXPERTS_RESEARCH_NODES_GLOBAL[r.expert] = {};
    if (!EXPERTS_RESEARCH_NODES_GLOBAL[r.expert][r.path_number]) EXPERTS_RESEARCH_NODES_GLOBAL[r.expert][r.path_number] = [];
    EXPERTS_RESEARCH_NODES_GLOBAL[r.expert][r.path_number].push(r);
  });
  EXPERTS_RESEARCH_STATE_GLOBAL = savedResearch || {};
  EXPERTS_RESEARCH_UNLOCKED_GLOBAL = savedResearchUnlocked || {};
}
function expertsResearchPathNumbersGlobal(expert) {
  return Object.keys((EXPERTS_RESEARCH_NODES_GLOBAL && EXPERTS_RESEARCH_NODES_GLOBAL[expert]) || {})
    .map(Number)
    .sort((a, b) => a - b);
}
function expertsResearchPathCostGlobal(expert, pathNum, fromLevel, toLevel) {
  const pathRows = ((EXPERTS_RESEARCH_NODES_GLOBAL && EXPERTS_RESEARCH_NODES_GLOBAL[expert]) || {})[pathNum] || [];
  const stats = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
  pathRows.forEach((r) => {
    if (r.level > fromLevel && r.level <= toLevel) {
      if (stats[r.stat_type] != null) stats[r.stat_type] += Number(r.stat_value) || 0;
    }
  });
  const mainStat = EXPERT_MAIN_STAT_GLOBAL_MAP[expert];
  if (mainStat && stats[mainStat] != null) {
    const clampedFrom = Math.max(0, Math.min(200, fromLevel));
    const clampedTo = Math.max(0, Math.min(200, toLevel));
    const levelsCrossed = Math.max(0, clampedTo - clampedFrom);
    let rate = 0.01;
    if (expert === "Gareth" || expert === "Justus") {
      rate = pathNum <= 3 ? 0.03 : 0.05;
    }
    stats[mainStat] += levelsCrossed * rate;
  }
  return stats;
}
function expertsResearchIsUnlockedGlobal(expert) {
  return unlockedFor("experts", expert, EXPERTS_RESEARCH_UNLOCKED_GLOBAL && EXPERTS_RESEARCH_UNLOCKED_GLOBAL[expert]);
}
// calcTroop: "Infantry" | "Lancer" | "Marksman". Returns {ATK,DEF,DMG,HP}.
function computeExpertsResearchTroopStatsGlobal(calcTroop, useMax) {
  const totals = { ATK: 0, DEF: 0, DMG: 0, HP: 0 };
  if (!EXPERTS_RESEARCH_NODES_GLOBAL) return totals;
  const includeExperts = new Set(EXPERTS_IN_ORDER_GLOBAL.filter((e) => e !== "Gareth" && e !== "Justus"));
  if (calcTroop === "Infantry") includeExperts.add("Justus");
  if (calcTroop === "Lancer") includeExperts.add("Gareth");
  includeExperts.forEach((expert) => {
    if (!expertsResearchIsUnlockedGlobal(expert)) return;
    expertsResearchPathNumbersGlobal(expert).forEach((p) => {
      if (useMax) {
        const stats = expertsResearchPathCostGlobal(expert, p, 0, 200);
        Object.keys(stats).forEach((k) => (totals[k] += stats[k]));
      } else {
        const st = (EXPERTS_RESEARCH_STATE_GLOBAL[expert] || {})[p] || { current: 0 };
        const stats = expertsResearchPathCostGlobal(expert, p, 0, st.current);
        Object.keys(stats).forEach((k) => (totals[k] += stats[k]));
      }
    });
  });
  return totals;
}

// together as stacked star-level sections (0-5 stars per stat,

// persisted via calc_state, separate from the static max reference
// stored in buff_cells.
// ============================================================
async function renderHeroStarSection(heroName, displayName, imageUrl, containerId) {
  await ensureBuffTable();
  if (!BUFF_CATEGORIES.some((c) => c.name === heroName)) await loadBuffCategories();
  const cat = BUFF_CATEGORIES.find((c) => c.name === heroName);
  const el = document.getElementById(containerId);
  if (!cat) {
    el.innerHTML = `<div class="panel"><div class="empty">${esc(dataName(displayName))} ${esc(t("category_not_found"))}</div></div>`;
    return;
  }
  const rows = await sb(`buff_rows?table_id=eq.${BUFF_TABLE_ID}&select=id,name,sort_order,buff_cells(value,column_id)&order=sort_order.asc`);
  const STAT_LABELS = { ATT: "Attack", DEF: "Defense", DMG: "Lethality", HP: "Health" };
  const seenStats = new Set();
  const statRows = rows
    .map((r) => {
      const cell = r.buff_cells.find((c) => c.column_id === cat.columns[0].id);
      const statKey = r.name.split(" ").pop(); // ATT/DEF/DMG/HP
      return { id: r.id, statKey, max: cell && cell.value != null ? Number(cell.value) : null };
    })
    .filter((r) => r.max != null)
    .filter((r) => {
      // collapse Infantry/Lancers/Marksman duplicates of the same stat into one "Troops X" row
      if (seenStats.has(r.statKey)) return false;
      seenStats.add(r.statKey);
      return true;
    })
    .map((r) => ({ id: r.id, name: `${t("troops_prefix")} ${tStatLabel(STAT_LABELS[r.statKey] || r.statKey)}`, max: r.max }));

  const saved = (await loadCalcState(`hero_stars_${heroName.toLowerCase()}`)) || {};
  const sharedKey = "__shared__";
  const stars = saved[sharedKey] ?? 0;

  el.innerHTML = `
    <div class="panel">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:4px;">
        ${imageUrl ? `<img src="${esc(imageUrl)}" alt="" style="width:48px; height:48px; object-fit:cover; border-radius:8px; border:1px solid var(--line);" loading="lazy" />` : ""}
        <h2 style="margin:0;">${esc(dataName(displayName))}</h2>
      </div>
      <p class="desc">${esc(t("click_star_desc"))}</p>
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
        <div id="heroStarRow-${esc(heroName)}" style="display:flex; gap:3px;">
          ${[1, 2, 3, 4, 5]
            .map(
              (n) =>
                `<span data-starbtn="${n}" style="cursor:pointer; font-size:24px; color:${n <= stars ? "var(--ice)" : "var(--line)"};">&#9733;</span>`
            )
            .join("")}
        </div>
        <span class="meta" style="font-size:12px;">${stars} ${esc(t("stars_of_5"))}</span>
      </div>
      <div class="stats-row-scroll" id="heroStatCards-${esc(heroName)}"></div>
    </div>
  `;

  const starRow = document.getElementById(`heroStarRow-${heroName}`);
  const cardsEl = document.getElementById(`heroStatCards-${heroName}`);

  function renderCards(curStars) {
    cardsEl.innerHTML = statRows
      .map((r) => {
        const cur = (r.max / 5) * curStars;
        const needed = r.max - cur;
        return `<div class="metric"><div class="label">${esc(r.name)}</div><div class="val">+${cur.toFixed(1)}%</div><div class="meta" style="font-size:11px; margin-top:2px;">${needed > 0 ? `+${needed.toFixed(1)}% ${esc(t("needed_for_max"))}` : esc(t("maxed_label"))}</div></div>`;
      })
      .join("");
  }
  renderCards(stars);

  starRow.querySelectorAll("[data-starbtn]").forEach((star) => {
    star.addEventListener("click", async () => {
      const n = Number(star.dataset.starbtn);
      const current = saved[sharedKey] ?? 0;
      const newStars = current === n ? n - 1 : n;
      starRow.querySelectorAll("[data-starbtn]").forEach((s) => {
        s.style.color = Number(s.dataset.starbtn) <= newStars ? "var(--ice)" : "var(--line)";
      });
      starRow.nextElementSibling.textContent = `${newStars} / 5 stars`;
      renderCards(newStars);
      saved[sharedKey] = newStars;
      await saveCalcState(`hero_stars_${heroName.toLowerCase()}`, saved);
    });
  });
}

let RESEARCH_SPEED_PCT = 0;

// General speedups (the plain 1m/5m/1h/3h/8h items) are ONE pool shared by
// every page that can spend them: the three research pages and Experts
// Level. It lives in the Experts inventory under "Speedups (minutes)"; the
// research pages' "General Speedups" box reads and writes that same value.
const GENERAL_SPEEDUP_KEY = "Speedups (minutes)";
async function loadGeneralSpeedupMinutes() {
  const inv = (await loadCalcState("experts_inventory")) || {};
  if (typeof inv[GENERAL_SPEEDUP_KEY] === "number") return inv[GENERAL_SPEEDUP_KEY];
  // One-time carry-over from the old research-only box.

  if (minutes > 0) { inv[GENERAL_SPEEDUP_KEY] = minutes; await saveCalcState("experts_inventory", inv); }
  return minutes;
}
async function saveGeneralSpeedupMinutes(minutes) {
  const inv = (await loadCalcState("experts_inventory")) || {};
  inv[GENERAL_SPEEDUP_KEY] = minutes;
  RESEARCH_SPEEDUP_MINUTES = minutes;
  budgetInvalidate();
  await saveCalcState("experts_inventory", inv);
}
async function ensureResearchSpeedData() {
  const saved = await loadCalcState("research_speed");
  RESEARCH_SPEED_PCT = (saved && typeof saved.pct === "number") ? saved.pct : 0;
  RESEARCH_SPEEDUP_MINUTES = await loadGeneralSpeedupMinutes();
}
// Applies both the % speed buff and the general speedups you hold. The
// speedups are taken off the PAGE total once (see applyResearchPct for the
// per-troop cards, which only get the % buff so the minutes aren't
// subtracted three times over).
function applyResearchSpeed(rawHours) {
  const afterPct = rawHours / (1 + RESEARCH_SPEED_PCT / 100);
  return Math.max(0, afterPct - RESEARCH_SPEEDUP_MINUTES / 60);
}
function applyResearchPct(rawHours) {
  return rawHours / (1 + RESEARCH_SPEED_PCT / 100);
}

function t12FormatTime(hours) {
  if (!hours) return "0h";
  const d = Math.floor(hours / 24);
  const h = Math.round(hours % 24);
  return d > 0 ? `${d}d ${h}h` : `${h}h`;
}
function formatTimeDHM(hours) {
  if (!hours || hours <= 0) return "0m";
  const totalMinutes = Math.round(hours * 60);
  const d = Math.floor(totalMinutes / 1440);
  const h = Math.floor((totalMinutes % 1440) / 60);
  const m = totalMinutes % 60;
  const parts = [];
  if (d > 0) parts.push(`${d}d`);
  if (h > 0 || d > 0) parts.push(`${h}h`);
  parts.push(`${m}m`);
  return parts.join(" ");
}

async function ensureT12StateData() {
  if (T12_STATE) return;
  const saved = await loadCalcState("t12_research");
  T12_STATE = saved || {};
  T12_TROOPS.forEach((troop) => {

    T12_ITEM_DEFS.forEach((def) => {
      if (typeof T12_STATE[troop][def.key] !== "number") T12_STATE[troop][def.key] = 0;
    });
  });
}

function computeT12Stats(troopState) {
  const stats = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
  T12_ITEM_DEFS.forEach((def) => {
    if (!def.stat) return;
    const pct = def.pct || 1;
    stats[def.stat] += (troopState[def.key] || 0) * pct;
  });
  return stats;
}
