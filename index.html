  const genSpeedEl = document.getElementById("expertsGeneralSpeedupInput");
  if (genSpeedEl) genSpeedEl.addEventListener("change", async () => {
    let val = parseFloat(genSpeedEl.value);
    if (Number.isNaN(val) || val < 0) val = 0;
    genSpeedEl.value = val;
    invSaved[GENERAL_SPEEDUP_KEY] = val;
    await saveGeneralSpeedupMinutes(val);
    renderTotals();
  });

  renderStatHeader();
  renderFoundryHeader();
  renderSvsHeader();
  renderFrostfireHeader();
  renderTundraHeader();
  renderTotals();
  renderGrid();
  renderInventory();
}

async function renderRefinePage() {
  await ensurePetsData(); // loads PET_REFINE_CACHE too
  const PET_TABLE_ORDER = [
    "Cave Hyena", "Arctic Wolf", "Musk Ox", "Giant Tapir", "Titan Roc",
    "Giant Elk", "Snow Leopard", "Cave Lion", "Snow Ape", "Iron Rhino",
    "Sabertooth Tiger", "Mammoth", "Frost Gorilla", "Frostscale Chameleon", "Abyssal Shelldragon",
  ];
  const petNames = Object.keys(PET_REFINE_CACHE).filter((p) => !hiddenForVisitor("pets", p)).sort((a, b) => {
    const ia = PET_TABLE_ORDER.indexOf(a);
    const ib = PET_TABLE_ORDER.indexOf(b);
    if (ia === -1 && ib === -1) return a.localeCompare(b);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  if (!PET_REFINE_TYPED_STATE) {
    const saved = await loadCalcState("pet_refine_typed");
    PET_REFINE_TYPED_STATE = saved || {};
  }
  // Marks formula: Common Marks per 1% of a stat, by the stage the value is
  // in. Refining is random, so this is the closest average we have - the
  // rates are editable and an overall +/- adjustment is applied on top.
  await ensurePetMarksState();

  // Converts a stored 0-1 fraction to a clean 1-decimal percentage.
  // Plain `x * 100` on values like 0.581 gives 58.099999999999994 in JS
  // floating point, which then rejected a typed "58.1" as "over the cap".
  const pct1 = (raw) => Math.round(Number(raw) * 10000) / 100;

  const STAGE_COLORS = {
    Grey: "#9aa5b1",
    Green: "#5bc98a",
    Blue: "#6fd3f2",
    Purple: "#b98ae0",
    Orange: "#e8a23c",
    Red: "#e0645f",
  };
  // Finds which stage bracket a typed value currently sits in for one pet+stat:
  // the first stage whose own threshold hasn't been fully reached yet (i.e. the
  // stage you're currently progressing within). Once you go above a stage's max,
  // the color immediately switches to the next stage, rather than waiting until
  // that next stage's own max is reached.
  function stageForValue(pet, maxKey, val) {
    const rows = PET_REFINE_CACHE[pet];
    for (const r of rows) {
      if (pct1(r[maxKey]) >= val - 0.0001) return { stage: r.stage, color: STAGE_COLORS[r.stage] || "var(--ice)" };
    }
    const last = rows[rows.length - 1];
    return { stage: last.stage, color: STAGE_COLORS[last.stage] || "var(--ice)" };
  }

  const STAT_KEYS = [
    { key: "il", label: `${t("troop_infantry")} ${tStatLabel("Lethality")}`, maxKey: "infantry_lethality_pct" },
    { key: "ih", label: `${t("troop_infantry")} ${tStatLabel("Health")}`, maxKey: "infantry_health_pct" },
    { key: "ll", label: `${t("troop_lancer_singular")} ${tStatLabel("Lethality")}`, maxKey: "lancer_lethality_pct" },
    { key: "lh", label: `${t("troop_lancer_singular")} ${tStatLabel("Health")}`, maxKey: "lancer_health_pct" },
    { key: "ml", label: `${t("troop_marksman")} ${tStatLabel("Lethality")}`, maxKey: "marksman_lethality_pct" },
    { key: "mh", label: `${t("troop_marksman")} ${tStatLabel("Health")}`, maxKey: "marksman_health_pct" },
  ];

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>${esc(t("pets_refine_title"))}</h2>
              </div>
    </div>
    <div id="refineTotals" style="margin-bottom:16px;"></div>
    <div id="refineSwipeCounter" style="text-align:center; margin-bottom:10px;"></div>
    <div id="refineList"></div>
  `;

  function maxRow(pet) {
    const rows = PET_REFINE_CACHE[pet];
    return rows[rows.length - 1];
  }
  function petState(pet) {
    if (!PET_REFINE_TYPED_STATE[pet] || typeof PET_REFINE_TYPED_STATE[pet] !== "object") {
      PET_REFINE_TYPED_STATE[pet] = { il: 0, ih: 0, ll: 0, lh: 0, ml: 0, mh: 0 };
    }
    return PET_REFINE_TYPED_STATE[pet];
  }

  function renderTotals() {
    const grand = { il: 0, ih: 0, ll: 0, lh: 0, ml: 0, mh: 0 };
    const grandMax = { il: 0, ih: 0, ll: 0, lh: 0, ml: 0, mh: 0 };
    petNames.forEach((pet) => {
      if (!isPetUnlocked(pet)) return;
      const s = petState(pet);
      const m = maxRow(pet);
      STAT_KEYS.forEach(({ key, maxKey }) => {
        const cap = pct1(m[maxKey]);
        grand[key] += Math.min(Number(s[key]) || 0, cap);
        grandMax[key] += cap;
      });
    });
    const STAT_ABBR_MAP = { il: "Inf LETH", ih: "Inf HP", ll: "Lan LETH", lh: "Lan HP", ml: "Mark LETH", mh: "Mark HP" };
    // ---- Common Marks needed to refine every unlocked pet to max ----
    // Each 1% still missing costs the rate of the stage bracket it falls in.
    const rates = PET_MARKS_STATE.rates;
    const marksForStat = (pet, maxKey, curVal) => {
      const rows = PET_REFINE_CACHE[pet];
      let marks = 0, prevMax = 0;
      rows.forEach((r) => {
        const stageMax = pct1(r[maxKey]);
        const lo = Math.max(prevMax, curVal), hi = stageMax;
        if (hi > lo) marks += (hi - lo) * (Number(rates[r.stage]) || 0);
        prevMax = Math.max(prevMax, stageMax);
      });
      return marks;
    };
    let marksRaw = 0;
    const perPet = {};
    petNames.forEach((pet) => {
      if (!isPetUnlocked(pet)) return;
      const s = petState(pet);
      const m = maxRow(pet);
      let petMarks = 0;
      STAT_KEYS.forEach(({ key, maxKey }) => {
        const cap = pct1(m[maxKey]);
        petMarks += marksForStat(pet, maxKey, Math.min(Number(s[key]) || 0, cap));
      });
      perPet[pet] = petMarks; marksRaw += petMarks;
    });
    const marksNeeded = Math.ceil(marksRaw * (1 + (PET_MARKS_STATE.adjust || 0) / 100));
    // Stages whose rate is 0 are not estimated at all (no tested formula
    // yet) - say so, so the total isn't taken as complete.
    const usedStages = new Set(); petNames.forEach((pet) => (PET_REFINE_CACHE[pet] || []).forEach((r) => usedStages.add(r.stage)));
    const noEstimate = ["Grey", "Green", "Blue", "Purple", "Orange", "Red"].filter((sg) => usedStages.has(sg) && !(Number(rates[sg]) > 0));
    const noEstimateHtml = noEstimate.length ? `<div style="margin-top:8px; padding:6px 10px; border:1px solid #e0a030; border-radius:8px; font-size:11px; color:#e0a030;">${esc(t("marks_no_estimate"))} ${noEstimate.map((sg) => `<b style="color:${STAGE_COLORS[sg] || "inherit"};">${esc(sg)}</b>`).join(", ")}</div>` : "";
    const stageBtn = (stage) => `<div style="display:flex; align-items:center; gap:4px;">
        <span style="font-size:11px; font-weight:600; color:${STAGE_COLORS[stage] || "var(--ice)"}; min-width:52px;">${esc(stage)}</span>
        <button class="btn small ghost" data-marksrate="${stage}" data-delta="-1" style="width:24px; padding:2px 0;">&minus;</button>
        <input type="text" inputmode="decimal" data-marksrateinput="${stage}" value="${rates[stage]}" style="width:58px; text-align:center; padding:3px 4px; font-size:12px;" />
        <button class="btn small ghost" data-marksrate="${stage}" data-delta="1" style="width:24px; padding:2px 0;">+</button>
      </div>`;
    document.getElementById("refineTotals").innerHTML = `
      <div class="panel">
        <h2>${esc(t("total_refine_bonus"))}</h2>
        <p class="desc">${esc(t("refine_summed_desc"))}</p>
        <div class="stats-row-scroll sr-3col">
          ${STAT_KEYS.map(({ key, label }) => `<div class="metric" style="padding:8px; min-width:90px;"><div class="label" style="font-size:9px;">${esc(STAT_ABBR_MAP[key] || label)}</div><div class="val" style="font-size:13px;">+${grand[key].toFixed(2)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${grandMax[key].toFixed(2)}%</div></div>`).join("")}
        </div>
      </div>
      <div class="panel" style="margin-top:16px;">
        <h2>${esc(t("marks_title"))}</h2>
        <p class="desc">${esc(t("marks_desc"))}</p>
        <div class="grid g2" style="align-items:start; gap:16px;">
          ${IS_OWNER ? `<div>
            <div class="meta" style="font-size:10.5px; font-weight:600; margin-bottom:6px;">${esc(t("marks_rates"))} <span style="font-weight:400;">(${esc(t("vis_hidden"))})</span></div>
            <div style="display:flex; flex-direction:column; gap:6px;">${["Grey", "Green", "Blue", "Purple", "Orange", "Red"].map(stageBtn).join("")}</div>
            <div class="meta" style="font-size:10px; margin-top:6px;">${esc(t("marks_rates_note"))}</div>
            <div class="meta" style="font-size:10.5px; margin-top:8px; color:${PET_MARKS_STATE.testMode ? "#e0a030" : "var(--muted)"};">${PET_MARKS_STATE.testMode ? "Editing your test rates (visitors unaffected) \u2014 Admin \u2192 Pets \u2192 Marks Calculation" : "Editing the rates visitors use \u2014 Admin \u2192 Pets \u2192 Marks Calculation to test privately"}</div>
          </div>` : ""}
          <div>
            <div class="meta" style="font-size:10.5px; font-weight:600; margin-bottom:6px;">${esc(t("marks_adjust"))}</div>
            <div style="display:flex; align-items:center; gap:6px;">
              <button class="btn small ghost" data-marksadjust="-5" style="width:28px; padding:2px 0;">&minus;</button>
              <span style="font-size:14px; font-weight:700; min-width:52px; text-align:center;">${PET_MARKS_STATE.adjust > 0 ? "+" : ""}${PET_MARKS_STATE.adjust}%</span>
              <button class="btn small ghost" data-marksadjust="5" style="width:28px; padding:2px 0;">+</button>
              <span class="meta" style="font-size:10.5px;">${esc(t("marks_adjust_note"))}</span>
            </div>
            ${noEstimateHtml}
            <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:12px;">
              <div class="metric" style="padding:8px 12px; min-width:140px;"><div class="label" style="font-size:9px;">${esc(t("marks_needed"))}</div><div class="val" style="font-size:18px;">${marksNeeded.toLocaleString()}</div><div class="meta" style="font-size:9px; margin-top:2px;">${Math.round(marksRaw).toLocaleString()} ${esc(t("marks_before_adjust"))}</div></div>
              <div class="metric" style="padding:8px 12px; min-width:140px;"><div class="label" style="font-size:9px;">${esc(t("marks_as_advanced"))}</div><div class="val" style="font-size:18px;">${Math.ceil(marksNeeded / ADVANCED_MARK_VALUE).toLocaleString()}</div><div class="meta" style="font-size:9px; margin-top:2px;">1 ${esc(materialDisplayName("Advanced Marks"))} = ${ADVANCED_MARK_VALUE} ${esc(materialDisplayName("Common Marks"))} · 500 ${esc(materialDisplayName("Gems"))} = 1</div></div>
            </div>
            <details style="margin-top:10px;"><summary class="meta" style="cursor:pointer; font-size:11px;">${esc(t("marks_per_pet"))}</summary>
              <div style="font-size:11px; margin-top:4px; line-height:1.6;">${Object.keys(perPet).filter((pt) => perPet[pt] > 0).sort((a, b) => perPet[b] - perPet[a]).map((pt) => `${esc(dataName(pt))}: <b>${Math.ceil(perPet[pt] * (1 + (PET_MARKS_STATE.adjust || 0) / 100)).toLocaleString()}</b>`).join("<br>") || `<span class="meta">${esc(t("marks_none"))}</span>`}</div>
            </details>
          </div>
        </div>
        <div style="margin-top:14px; border-top:1px solid var(--line); padding-top:10px;">
          <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;">
            <h2 style="font-size:13px; margin:0;">${esc(t("backpack_title"))}</h2>
            <label style="display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer;"><input type="checkbox" data-markspackgems ${PET_MARKS_STATE.packGems ? "checked" : ""} /><span>${esc(t("marks_pack_gems"))}</span></label>
          </div>
          <div id="refineMarksBar"></div>
        </div>
      </div>
    `;
    renderChiefGearResourcesBar("refineMarksBar", { "Common Marks": marksNeeded }, ["Common Marks", "Advanced Marks", "Gems"], renderTotals, "pets_refine");
    const totalsEl = document.getElementById("refineTotals");
    totalsEl.querySelectorAll("[data-marksrate]").forEach((b) => b.addEventListener("click", async () => {
      const st = b.dataset.marksrate;
      rates[st] = Math.max(0, Math.round(((Number(rates[st]) || 0) + Number(b.dataset.delta)) * 100) / 100);
      await savePetMarksRates();
      renderTotals();
    }));
    totalsEl.querySelectorAll("[data-marksrateinput]").forEach((inp) => inp.addEventListener("change", async () => {
      const v = Number(String(inp.value).replace(/[^0-9.]/g, ""));
      if (Number.isFinite(v)) rates[inp.dataset.marksrateinput] = Math.max(0, v);
      await savePetMarksRates();
      renderTotals();
    }));
    const pg = totalsEl.querySelector("[data-markspackgems]");
    if (pg) pg.addEventListener("change", async () => {
      PET_MARKS_STATE.packGems = pg.checked;
      PACK_PLAN_CACHE.clear();
      await saveCalcState("pet_refine_marks", PET_MARKS_STATE);
      renderTotals();
    });
    totalsEl.querySelectorAll("[data-marksadjust]").forEach((b) => b.addEventListener("click", async () => {
      PET_MARKS_STATE.adjust = Math.max(-90, Math.min(300, (PET_MARKS_STATE.adjust || 0) + Number(b.dataset.marksadjust)));
      await saveCalcState("pet_refine_marks", PET_MARKS_STATE);
      renderTotals();
    }));
  }

  const TIER_ORDER = ["First", "N", "R", "SR", "SRR", "UR"];
  const listEl = document.getElementById("refineList");
  // Updates one pet+stat row's bar width/color and remaining-text in place,
  // without touching any input elements (avoids stealing focus from a field
  // the user just clicked into while another field's blur was still settling).
  function updateStatRow(pet, statKey) {
    const row = listEl.querySelector(`[data-refinerowfor="${CSS.escape(pet)}|${CSS.escape(statKey)}"]`);
    if (!row) return;
    const statDef = STAT_KEYS.find((s) => s.key === statKey);
    const s = petState(pet);
    const m = maxRow(pet);
    const maxVal = pct1(m[statDef.maxKey]);
    const curVal = Math.min(Number(s[statKey]) || 0, maxVal);
    const pct = maxVal > 0 ? Math.min(100, (curVal / maxVal) * 100) : 0;
    const remaining = Math.max(0, maxVal - curVal);
    const isMaxed = remaining <= 0.005;
    const { color } = stageForValue(pet, statDef.maxKey, curVal);

    const barFill = row.querySelector("[data-refinebar] > div");
    if (barFill) {
      barFill.style.width = `${pct}%`;
      barFill.style.background = color;
    }
    const remainingEl = row.querySelector("[data-refineremaining]");
    if (remainingEl) {
      remainingEl.textContent = isMaxed ? "" : `-${remaining.toFixed(2)}%`;
      remainingEl.style.color = color;
      remainingEl.style.width = isMaxed ? "0" : "";
      remainingEl.style.overflow = isMaxed ? "hidden" : "";
    }
  }
  const refineCounterEl = document.getElementById("refineSwipeCounter");
  let activeRefineIdx = 0;
  function renderList() {
    renderSwipeCounter(refineCounterEl, petNames.length, activeRefineIdx, (next) => { activeRefineIdx = next; renderList(); });
    const idx = activeRefineIdx;
    const pet = petNames[idx];
    const m = maxRow(pet);
    const s = petState(pet);
    const tier = m.category || "Other";
    const color = PET_TROOP_COLORS_CYCLE[idx % PET_TROOP_COLORS_CYCLE.length];
    const unlocked = isPetUnlocked(pet);
    listEl.innerHTML = `
        <div class="panel" style="${unlocked ? "" : "opacity:0.5;"} text-align:start;">
          <div class="meta" style="font-size:10.5px; margin-bottom:8px;">${esc(refineTierDisplayName(tier))} ${esc(t("tier_suffix"))}</div>
          <div style="display:flex; align-items:center; justify-content:flex-start; gap:8px; margin-bottom:12px; flex-wrap:nowrap;">
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer; min-width:0; flex-wrap:nowrap;">
              ${IS_OWNER ? `<input type="checkbox" data-petunlockrefine="${esc(pet)}" ${unlocked ? "checked" : ""} style="width:14px; height:14px; cursor:pointer; flex-shrink:0;" />` : ""}
              <div class="name" style="font-size:12.5px; font-weight:700; color:${color}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(dataName(pet))}</div>
            </label>
            ${visibilityBtnHtml("pets", pet)}
            <button class="btn ghost small" data-refinemaxpet="${esc(pet)}" style="flex-shrink:0; margin-left:auto;">${esc(t("max_button"))}</button>
          </div>
          ${STAT_KEYS.map(
            ({ key, label, maxKey }) => {
              const maxVal = pct1(m[maxKey]);
              const curVal = Math.min(Number(s[key]) || 0, maxVal);
              const pct = maxVal > 0 ? Math.min(100, (curVal / maxVal) * 100) : 0;
              const remaining = Math.max(0, maxVal - curVal);
              const isMaxed = remaining <= 0.005;
              const { color: barColor } = stageForValue(pet, maxKey, curVal);
              return `
          <div data-refinerowfor="${esc(pet)}|${key}" style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:6px 0; border-top:1px solid var(--line);">
            <span class="meta" style="font-size:12px; flex:0 0 110px; min-width:85px;">${esc(label)}</span>
            <input type="text" inputmode="decimal" data-refinepet="${esc(pet)}" data-refinestat="${key}" value="${curVal}" style="width:60px; flex-shrink:0; padding:5px 6px;" />
            <div style="flex:1; min-width:90px; display:flex; align-items:center; gap:6px;">
              <div data-refinebar style="flex:1; height:7px; border-radius:4px; background:var(--panel-2); overflow:hidden; min-width:35px;">
                <div style="width:${pct}%; height:100%; background:${barColor}; border-radius:4px; transition:width 0.2s;"></div>
              </div>
              <span data-refineremaining class="meta" style="font-size:10px; color:${barColor}; flex-shrink:0; white-space:nowrap; ${isMaxed ? "width:0; overflow:hidden;" : ""}">${isMaxed ? "" : `-${remaining.toFixed(2)}%`}</span>
            </div>
            <span class="meta" style="font-size:10px; flex-shrink:0; white-space:nowrap;">${esc(t("of_max_prefix"))} ${maxVal.toFixed(2)}%</span>
          </div>`;
            }
          ).join("")}
        </div>`;
    wireIndexSwipe(listEl, petNames.length, activeRefineIdx, (next) => { activeRefineIdx = next; renderList(); });

    wireVisibilityBtns(listEl, () => { renderTotals(); renderList(); });
    listEl.querySelectorAll("input[data-petunlockrefine]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const pet = cb.dataset.petunlockrefine;
        PETS_UNLOCKED[pet] = cb.checked;
        await saveCalcState("pets_unlocked", PETS_UNLOCKED);
        renderTotals();
        renderList();
      });
    });

    listEl.querySelectorAll("input[data-refinepet]").forEach((input) => {
      input.addEventListener("change", async () => {
        let val = parseFloat(input.value);
        if (Number.isNaN(val) || val < 0) val = 0;
        const pet = input.dataset.refinepet;
        const statKey = input.dataset.refinestat;
        const statDef = STAT_KEYS.find((s) => s.key === statKey);
        const cap = pct1(maxRow(pet)[statDef.maxKey]);
        if (val > cap) val = cap;
        input.value = val;
        petState(pet)[statKey] = val;
        await saveCalcState("pet_refine_typed", PET_REFINE_TYPED_STATE);
        renderTotals();
        updateStatRow(pet, statKey);
      });
    });

    listEl.querySelectorAll("[data-refinemaxpet]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const pet = btn.dataset.refinemaxpet;
        const m = maxRow(pet);
        const s = petState(pet);
        const allMaxed = STAT_KEYS.every(({ key, maxKey }) => (Number(s[key]) || 0) >= pct1(m[maxKey]) - 0.001);
        STAT_KEYS.forEach(({ key, maxKey }) => {
          s[key] = allMaxed ? 0 : pct1(m[maxKey]);
          const input = listEl.querySelector(`input[data-refinepet="${CSS.escape(pet)}"][data-refinestat="${CSS.escape(key)}"]`);
          if (input) input.value = s[key];
          updateStatRow(pet, key);
        });
        await saveCalcState("pet_refine_typed", PET_REFINE_TYPED_STATE);
        renderTotals();
      });
    });
  }

  renderTotals();
  renderList();
}

async function renderPetsDataPage() {
  await ensurePetsData();
  const petNames = Object.keys(PETS_NODES_CACHE).filter((p) => !hiddenForVisitor("pets", p));

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>${esc(t("pets_level_title"))}</h2>
              </div>
      <button class="btn" id="petsMaxAllBtn">${esc(t("max_everything"))}</button>
    </div>
    <div id="petsTotals" style="margin-bottom:16px;"></div>
    <div id="petsSwipeCounter" style="text-align:center; margin-bottom:10px;"></div>
    <div id="petsList"></div>
  `;

  function getState(pet) {
    const s = PETS_STATE[pet];
    if (s && typeof s === "object") return s;
    // migrate old single-index state (or default) to {from, to}
    const maxIdx = PETS_NODES_CACHE[pet].length - 1;
    return { from: -1, to: maxIdx };
  }

  function computeNeeded(pet) {
    const levels = PETS_NODES_CACHE[pet];
    const { from, to } = getState(pet);
    const totals = { food: 0, manual: 0, potion: 0, serum: 0 };
    levels.forEach((r, i) => {
      if (i <= from || i > to) return;
      totals.food += Number(r.food) || 0;
      totals.manual += Number(r.manual) || 0;
      totals.potion += Number(r.potion) || 0;
      totals.serum += Number(r.serum) || 0;
    });
    return totals;
  }
  function currentAtkDef(pet) {
    const levels = PETS_NODES_CACHE[pet];
    const { from } = getState(pet);
    if (from < 0) return 0;
    const v = levels[from].atk_def_pct;
    return v == null ? 0 : Number(v) * 100;
  }
  function maxAtkDef(pet) {
    const levels = PETS_NODES_CACHE[pet];
    for (let i = levels.length - 1; i >= 0; i--) {
      if (levels[i].atk_def_pct != null) return Number(levels[i].atk_def_pct) * 100;
    }
    return 0;
  }

  function renderTotals() {
    const grand = { food: 0, manual: 0, potion: 0, serum: 0 };
    let grandAtk = 0, grandAtkMax = 0;
    petNames.forEach((pet) => {
      if (!isPetUnlocked(pet)) return;
      const n = computeNeeded(pet);
      grand.food += n.food;
      grand.manual += n.manual;
      grand.potion += n.potion;
      grand.serum += n.serum;
      grandAtk += currentAtkDef(pet);
      grandAtkMax += maxAtkDef(pet);
    });
    document.getElementById("petsTotals").innerHTML = `
      <div class="panel">
        <h2>${esc(t("troops_stats_title"))}</h2>
        <p class="desc">${esc(t("pets_summed_desc"))}</p>
        <div class="stats-row-scroll">
          <div class="metric" style="padding:6px; min-width:80px;">
            <div class="label" style="font-size:9px;">${esc(t("troops_attack"))}</div>
            <div class="val" style="font-size:13px;">${grandAtk.toFixed(1)}%</div>
            <div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} ${grandAtkMax.toFixed(1)}%</div>
          </div>
          <div class="metric" style="padding:6px; min-width:80px;">
            <div class="label" style="font-size:9px;">${esc(t("troops_defense"))}</div>
            <div class="val" style="font-size:13px;">${grandAtk.toFixed(1)}%</div>
            <div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} ${grandAtkMax.toFixed(1)}%</div>
          </div>
        </div>
      </div>
      <div class="panel">
        <h2>${esc(t("backpack_title"))}</h2>
        <p class="desc">${esc(t("backpack_desc_pets"))}</p>
        <div id="petsMaterialsBar"></div>
      </div>
    `;
    // Pet Chests you own open into Manual / Potion / Serum (your choice),
    // so they sit in the Backpack and reduce whichever of those is short.
    renderChiefGearResourcesBar(
      "petsMaterialsBar",
      { Food: grand.food, Manual: grand.manual, Potion: grand.potion, Serum: grand.serum },
      ["Food", "Manual", "Potion", "Serum", "Pet Chest"],
      renderTotals,
      "pets"
    );
  }

  const listEl = document.getElementById("petsList");
  const petsCounterEl = document.getElementById("petsSwipeCounter");
  let activePetIdx = 0;
  function renderList() {
    renderSwipeCounter(petsCounterEl, petNames.length, activePetIdx, (next) => { activePetIdx = next; renderList(); });
    const idx = activePetIdx;
    const pet = petNames[idx];
    const levels = PETS_NODES_CACHE[pet];
    const { from, to } = getState(pet);
    const needed = computeNeeded(pet);
    const cur = currentAtkDef(pet);
    const max = maxAtkDef(pet);
    const color = PET_TROOP_COLORS_CYCLE[idx % PET_TROOP_COLORS_CYCLE.length];
    const unlocked = isPetUnlocked(pet);
    const levelOpts = (selected) =>
      levels.map((r, i) => `<option value="${i}" ${i === selected ? "selected" : ""}>${esc(t("level_prefix"))} ${r.level_label}${i === levels.length - 1 ? esc(t("max_suffix")) : ""}</option>`).join("");
    const fromOpts = `<option value="-1" ${from === -1 ? "selected" : ""}>${esc(t("not_started"))}</option>` + levelOpts(from);

    listEl.innerHTML = `
        <div class="panel" style="${unlocked ? "" : "opacity:0.5;"} text-align:start;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:14px; justify-content:flex-start; flex-wrap:nowrap;">
            ${IS_OWNER ? `<input type="checkbox" data-petunlock="${esc(pet)}" ${unlocked ? "checked" : ""} style="width:16px; height:16px; cursor:pointer; flex-shrink:0;" />` : ""}
            <div class="name" style="font-size:16px; font-weight:700; color:${color};">${esc(dataName(pet))}</div>
          </label>
          ${IS_OWNER ? `<div style="margin:-8px 0 12px;">${visibilityBtnHtml("pets", pet)}</div>` : ""}
          <div class="stats-row-scroll pet-level-row" style="margin-bottom:16px;">
            <div class="metric" style="padding:8px; min-width:110px; flex:1 1 110px;">
              <div class="label" style="font-size:9px;">${esc(t("troops_stats_title"))}</div>
              <div class="val" style="font-size:13px; white-space:nowrap;">${cur.toFixed(1)}% <span style="font-size:9px; color:var(--muted); font-weight:400;">/ ${max.toFixed(1)}%</span></div>
            </div>
            <div style="min-width:110px; flex:1 1 110px;">
              <div class="meta" style="font-size:9px; margin-bottom:4px;">${esc(t("current_label"))}</div>
              <select data-petfrom="${esc(pet)}" style="width:100%;">${fromOpts}</select>
            </div>
            <div style="min-width:110px; flex:1 1 110px;">
              <div class="meta" style="font-size:9px; margin-bottom:4px;">${esc(t("target_label"))}</div>
              <select data-petto="${esc(pet)}" style="width:100%;">${levelOpts(to)}</select>
            </div>
          </div>
          <div class="stats-row-scroll">
            ${smallResourceCard(PET_MATERIAL_ICONS.food, t("material_food"), Math.round(needed.food).toLocaleString())}
            ${smallResourceCard(PET_MATERIAL_ICONS.manual, t("material_manual"), Math.round(needed.manual).toLocaleString())}
            ${smallResourceCard(PET_MATERIAL_ICONS.potion, t("material_potion"), Math.round(needed.potion).toLocaleString())}
            ${smallResourceCard(PET_MATERIAL_ICONS.serum, t("material_serum"), Math.round(needed.serum).toLocaleString())}
          </div>
        </div>`;
    wireIndexSwipe(listEl, petNames.length, activePetIdx, (next) => { activePetIdx = next; renderList(); });

    wireVisibilityBtns(listEl, () => { renderTotals(); renderList(); });
    listEl.querySelectorAll("input[data-petunlock]").forEach((cb) => {
      cb.addEventListener("change", async () => {
        const pet = cb.dataset.petunlock;
        PETS_UNLOCKED[pet] = cb.checked;
        await saveCalcState("pets_unlocked", PETS_UNLOCKED);
        renderTotals();
        renderList();
      });
    });

    listEl.querySelectorAll("select[data-petfrom]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const pet = sel.dataset.petfrom;
        const s = getState(pet);
        s.from = Number(sel.value);
        PETS_STATE[pet] = s;
        await saveCalcState("pets_data", PETS_STATE);
        renderTotals();
        renderList();
      });
    });
    listEl.querySelectorAll("select[data-petto]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const pet = sel.dataset.petto;
        const s = getState(pet);
        s.to = Number(sel.value);
        PETS_STATE[pet] = s;
        await saveCalcState("pets_data", PETS_STATE);
        renderTotals();
        renderList();
      });
    });
  }

  document.getElementById("petsMaxAllBtn").addEventListener("click", async () => {
    const allMaxed = petNames.every((pet) => getState(pet).from >= PETS_NODES_CACHE[pet].length - 1);
    petNames.forEach((pet) => {
      const maxIdx = PETS_NODES_CACHE[pet].length - 1;
      PETS_STATE[pet] = allMaxed ? { from: -1, to: maxIdx } : { from: maxIdx, to: maxIdx };
    });
    await saveCalcState("pets_data", PETS_STATE);
    renderTotals();
    renderList();
  });

  renderTotals();
  renderList();
}

async function renderResearchCenterPage() {
  await ensureRCData();
  await ensureResearchSpeedData();

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>${esc(t("research_center_title"))}</h2>
              </div>
      <button class="btn" id="rcMaxAllBtn">${esc(t("max_everything"))}</button>
    </div>
    ${researchSpeedInputHtml()}
    <div id="rcTotals" style="margin-bottom:16px;"></div>
    <div id="rcGroups"></div>
  `;
  wireResearchSpeedInput(() => {
    renderTotals();
    renderGroups();
  });

  document.getElementById("rcMaxAllBtn").addEventListener("click", async () => {
    const tracks = Object.keys(RC_NODES_CACHE);
    const allMaxed = tracks.every((track) => (RC_STATE[track] || 0) >= RC_NODES_CACHE[track].length);
    tracks.forEach((track) => {
      RC_STATE[track] = allMaxed ? 0 : RC_NODES_CACHE[track].length;
    });
    await saveCalcState("research_center", RC_STATE);
    renderTotals();
    renderGroups();
  });

  function computeNeeded(trackName) {
    const levels = RC_NODES_CACHE[trackName] || [];
    const cur = RC_STATE[trackName] || 0;
    const totals = { meat: 0, wood: 0, coal: 0, iron: 0, steel: 0, time_hours: 0 };
    levels.forEach((r) => {
      if (r.level <= cur) return;
      totals.meat += Number(r.meat) || 0;
      totals.wood += Number(r.wood) || 0;
      totals.coal += Number(r.coal) || 0;
      totals.iron += Number(r.iron) || 0;
      totals.steel += Number(r.steel) || 0;
      totals.time_hours += Number(r.time_hours) || 0;
    });
    return totals;
  }

  function computeStats(baseNames) {
    const stats = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
    baseNames.forEach((base) => {
      RC_TIERS.forEach((tier) => {
        const trackName = `${base} ${tier}`;
        const levels = RC_NODES_CACHE[trackName] || [];
        const cur = RC_STATE[trackName] || 0;
        levels.forEach((r) => {
          if (r.level > cur || !r.stat) return;
          stats[r.stat] += Number(r.stat_pct) || 0;
        });
      });
    });
    return stats;
  }

  function renderTotals() {
    const allTracks = Object.keys(RC_NODES_CACHE);
    const grand = { meat: 0, wood: 0, coal: 0, iron: 0, steel: 0, time_hours: 0 };
    allTracks.forEach((t) => {
      const n = computeNeeded(t);
      Object.keys(grand).forEach((k) => (grand[k] += n[k]));
    });
    const matTotals = {
      Meat: Math.round(grand.meat),
      Wood: Math.round(grand.wood),
      Coal: Math.round(grand.coal),
      Iron: Math.round(grand.iron),
      Steel: Math.round(grand.steel),
      "Research Speedups (minutes)": Math.round(applyResearchSpeed(grand.time_hours) * 60),
    };
    document.getElementById("rcTotals").innerHTML = `
      <div class="panel">
        <h2>${esc(t("backpack_title"))}</h2>
        <p class="desc">${esc(t("rc_desc"))}</p>
        <div id="rcResourcesBar" style="margin-bottom:12px;"></div>
        <div class="metric"><div class="label">${esc(t("research_time_label"))}</div><div class="val">${t12FormatTime(applyResearchSpeed(grand.time_hours))}</div></div>
      </div>
    `;
    renderChiefGearResourcesBar("rcResourcesBar", matTotals, Object.keys(matTotals), () => { renderTotals(); renderGroups(); }, "research_center");
  }

  const groupsEl = document.getElementById("rcGroups");
  function renderGroups() {
    groupsEl.innerHTML = Object.entries(RC_BASE_CATEGORIES)
      .map(([groupName, baseNames]) => {
        const stats = computeStats(baseNames);
        const groupLabel = groupName === "Shared" ? t("shared_label") : troopDisplayName(groupName);
        return `
      <div class="panel">
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
          <h2 style="margin:0;">${esc(groupLabel)}</h2>
          <button class="btn ghost small" data-rcmaxgroup="${esc(groupName)}">${esc(t("max_this_section"))}</button>
        </div>
        <div class="stats-row-scroll" style="margin:10px 0 14px;">
          <div class="metric" style="padding:6px; min-width:65px;"><div class="label" style="font-size:9px;">ATK</div><div class="val" style="font-size:13px;">+${stats.Attack.toFixed(1)}%</div></div>
          <div class="metric" style="padding:6px; min-width:65px;"><div class="label" style="font-size:9px;">DEF</div><div class="val" style="font-size:13px;">+${stats.Defense.toFixed(1)}%</div></div>
          <div class="metric" style="padding:6px; min-width:65px;"><div class="label" style="font-size:9px;">LETH</div><div class="val" style="font-size:13px;">+${stats.Lethality.toFixed(1)}%</div></div>
          <div class="metric" style="padding:6px; min-width:65px;"><div class="label" style="font-size:9px;">HP</div><div class="val" style="font-size:13px;">+${stats.Health.toFixed(1)}%</div></div>
        </div>
        ${baseNames
          .map((base) => {
            return `
          <div style="padding:10px 0; border-top:1px solid var(--line);">
            <div class="meta" style="margin-bottom:8px; font-weight:600; color:var(--frost);">${esc(dataName(base))}</div>
            <div class="rc-tier-grid" style="display:grid; grid-template-columns:repeat(6, 1fr); gap:10px;">
              ${RC_TIERS.map((tier) => {
                const trackName = `${base} ${tier}`;
                const levels = RC_NODES_CACHE[trackName];
                if (!levels) return `<div><div class="meta" style="font-size:10.5px; margin-bottom:4px;">${esc(tier)}</div><span class="meta" style="font-size:10.5px;">\u2014</span></div>`;
                const maxLvl = levels.length;
                const cur = RC_STATE[trackName] || 0;
                const opts = Array.from({ length: maxLvl + 1 }, (_, i) => `<option value="${i}" ${i === cur ? "selected" : ""}>${i === 0 ? "0" : i}${i === maxLvl ? esc(t("max_suffix")) : ""}</option>`).join("");
                return `
                <div>
                  <div class="meta" style="font-size:10.5px; margin-bottom:4px;">${esc(tier)}</div>
                  <select data-rctrack="${esc(trackName)}" style="width:100%; padding:5px 8px;">${opts}</select>
                </div>`;
              }).join("")}
            </div>
          </div>`;
          })
          .join("")}
      </div>`;
      })
      .join("");

    groupsEl.querySelectorAll("[data-rcmaxgroup]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const groupName = btn.dataset.rcmaxgroup;
        const baseNames = RC_BASE_CATEGORIES[groupName] || [];
        const groupTracks = [];
        baseNames.forEach((base) => {
          RC_TIERS.forEach((tier) => {
            const trackName = `${base} ${tier}`;
            if (RC_NODES_CACHE[trackName]) groupTracks.push(trackName);
          });
        });
        const allMaxed = groupTracks.every((t) => (RC_STATE[t] || 0) >= RC_NODES_CACHE[t].length);
        groupTracks.forEach((t) => {
          RC_STATE[t] = allMaxed ? 0 : RC_NODES_CACHE[t].length;
        });
        await saveCalcState("research_center", RC_STATE);
        renderTotals();
        renderGroups();
      });
    });

    groupsEl.querySelectorAll("select[data-rctrack]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        RC_STATE[sel.dataset.rctrack] = Number(sel.value);
        await saveCalcState("research_center", RC_STATE);
        renderTotals();
        renderGroups();
      });
    });
  }

  renderTotals();
  renderGroups();
}

async function renderT12ResearchPage() {
  if (!T12_NODES_CACHE) {
    const rows = await sb(`t12_nodes?select=tier,level,steel,refined_fc,fc_shard,meat_wood,coal,iron,time_hours&order=tier,level`);
    T12_NODES_CACHE = {};
    rows.forEach((r) => {
      if (!T12_NODES_CACHE[r.tier]) T12_NODES_CACHE[r.tier] = {};
      T12_NODES_CACHE[r.tier][r.level] = r;
    });
  }
  if (!T12_STATE) {
    const saved = await loadCalcState("t12_research");
    T12_STATE = saved || {};
    T12_TROOPS.forEach((troop) => {
      if (!T12_STATE[troop]) T12_STATE[troop] = {};
      T12_ITEM_DEFS.forEach((def) => {
        if (typeof T12_STATE[troop][def.key] !== "number") T12_STATE[troop][def.key] = 0;
      });
    });
  }
  if (!T12_TARGET) T12_TARGET = (await loadCalcState("t12_research_target")) || {};

  await ensureResearchSpeedData();
  await ensureResearchPageCountedData();

  content.innerHTML = `
    <div class="page-head">
      <div>
        <h2>${esc(t("t12_research_title"))}</h2>
              </div>
      <div style="display:flex; align-items:center; gap:14px;">
        ${IS_OWNER ? `<label style="display:flex; align-items:center; gap:6px; cursor:pointer; flex-wrap:nowrap;">
          <input type="checkbox" id="t12CountedToggle" ${RESEARCH_PAGE_COUNTED.t12 ? "checked" : ""} style="width:15px; height:15px; cursor:pointer;" />
          <span class="meta" style="font-size:11px;">${esc(t("count_toward_dashboard"))}</span>
        </label>` : ""}
        <button class="btn" id="t12MaxAllBtn">${esc(t("max_everything"))}</button>
      </div>
    </div>
    ${researchSpeedInputHtml()}
    <div id="t12Totals" style="margin-bottom:16px;"></div>
    <div id="t12TroopDots" style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:14px;"></div>
    <div id="t12Troops"></div>
  `;

  const t12Toggle = document.getElementById("t12CountedToggle");
  if (t12Toggle) t12Toggle.addEventListener("change", async (e) => {
    RESEARCH_PAGE_COUNTED.t12 = e.target.checked;
    await saveCalcState("research_page_counted", RESEARCH_PAGE_COUNTED);
  });

  document.getElementById("t12MaxAllBtn").addEventListener("click", async () => {
    const allMaxed = T12_TROOPS.every((troop) => T12_ITEM_DEFS.every((def) => (T12_STATE[troop][def.key] || 0) >= def.max));
    T12_TROOPS.forEach((troop) => {
      T12_ITEM_DEFS.forEach((def) => {
        T12_STATE[troop][def.key] = allMaxed ? 0 : def.max;
      });
    });
    await saveCalcState("t12_research", T12_STATE);
    renderTotals();
    renderTroopPanels();
  });
  wireResearchSpeedInput(() => {
    renderTotals();
    renderTroopPanels();
  });

  function levelSelectHtml(def, current, target) {
    const opts = (sel) => Array.from({ length: def.max + 1 }, (_, i) => `<option value="${i}" ${i === sel ? "selected" : ""}>${i === 0 ? "0" + t("none_suffix") : i}${i === def.max ? t("max_suffix") : ""}</option>`).join("");
    return `<div class="lvl-pair">
      <label class="lvl-cell"><span class="lvl-cap meta">${esc(t("research_current"))}</span><select data-t12item="${def.key}" title="${esc(t("research_current"))}" style="width:100%; min-width:0; padding:5px 6px;">${opts(current)}</select></label>
      <span class="lvl-arrow meta" style="font-size:11px;">→</span>
      <label class="lvl-cell"><span class="lvl-cap meta">${esc(t("research_target"))}</span><select data-t12target="${def.key}" title="${esc(t("research_target"))}" style="width:100%; min-width:0; padding:5px 6px; ${target < current ? "border-color:var(--danger);" : ""}">${opts(target)}</select></label>
    </div>`;
  }

  function computeNeeded(troopState, troop) {
    const totals = { steel: 0, refined_fc: 0, fc_shard: 0, meat_wood: 0, coal: 0, iron: 0, time_hours: 0 };
    T12_ITEM_DEFS.forEach((def) => {
      const cur = troopState[def.key] || 0;
      const target = troop ? t12TargetOf(troop, def) : def.max;
      const tierRows = T12_NODES_CACHE[def.tier] || {};
      for (let lv = cur + 1; lv <= target; lv++) {
        const r = tierRows[lv];
        if (!r) continue;
        totals.steel += Number(r.steel) || 0;
        totals.refined_fc += Number(r.refined_fc) || 0;
        totals.fc_shard += Number(r.fc_shard) || 0;
        totals.meat_wood += Number(r.meat_wood) || 0;
        totals.coal += Number(r.coal) || 0;
        totals.iron += Number(r.iron) || 0;
        totals.time_hours += Number(r.time_hours) || 0;
      }
    });
    return totals;
  }

  function renderTotals() {
    const grand = { steel: 0, refined_fc: 0, fc_shard: 0, meat_wood: 0, coal: 0, iron: 0, time_hours: 0 };
    T12_TROOPS.forEach((troop) => {
      const t = computeNeeded(T12_STATE[troop], troop);
      Object.keys(grand).forEach((k) => (grand[k] += t[k]));
    });
    const matTotals = {
      Steel: Math.round(grand.steel),
      "Refined FC": Math.round(grand.refined_fc),
      "FC Shard": Math.round(grand.fc_shard),
      Meat: Math.round(grand.meat_wood),
      Wood: Math.round(grand.meat_wood),
      Coal: Math.round(grand.coal),
      Iron: Math.round(grand.iron),
      "Research Speedups (minutes)": Math.round(applyResearchSpeed(grand.time_hours) * 60),
    };
    document.getElementById("t12Totals").innerHTML = `
      <div class="panel">
        <h2>${esc(t("backpack_title"))}</h2>
        <p class="desc">${esc(t("t12_3troops_desc"))}</p>
        <div id="t12ResourcesBar" style="margin-bottom:12px;"></div>
        <div class="metric"><div class="label">${esc(t("research_time_label"))}</div><div class="val">${t12FormatTime(applyResearchSpeed(grand.time_hours))}</div></div>
      </div>
    `;
    renderChiefGearResourcesBar("t12ResourcesBar", matTotals, ["Steel", "Fire Crystal", ...Object.keys(matTotals).filter((n) => n !== "Steel")], () => { renderTotals(); renderTroopPanels(); }, "t12_research");
  }

  const T12_TROOP_COLORS = { Infantry: "#7ee6a8", Lancer: "var(--ice)", Marksman: "#f0a3c4" };
  let t12ActiveTroop = T12_TROOPS[0];
  function renderTroopPanels() {
    const troopsEl = document.getElementById("t12Troops");
    const dotsEl = document.getElementById("t12TroopDots");
    renderSwipeDots(dotsEl, T12_TROOPS, t12ActiveTroop, T12_TROOP_COLORS, (tr) => { t12ActiveTroop = tr; renderTroopPanels(); });
    const groups = [...new Set(T12_ITEM_DEFS.map((d) => d.group))];
    const statMax = { Attack: 0, Defense: 0, Lethality: 0, Health: 0 };
    T12_ITEM_DEFS.forEach((def) => {
      if (def.stat) statMax[def.stat] += def.max * (def.pct || 1);
    });
    const troop = t12ActiveTroop;
    const needed = computeNeeded(T12_STATE[troop], troop);
    const stats = computeT12Stats(T12_STATE[troop]);
    troopsEl.innerHTML = `
      <div class="panel">
        <h2>${esc(troopDisplayName(troop))}</h2>
        <div class="stats-row-scroll" style="margin-bottom:10px;">
          <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">ATK</div><div class="val" style="font-size:13px;">+${stats.Attack}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${statMax.Attack}%</div></div>
          <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">DEF</div><div class="val" style="font-size:13px;">+${stats.Defense}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${statMax.Defense}%</div></div>
          <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">LETH</div><div class="val" style="font-size:13px;">+${stats.Lethality}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${statMax.Lethality}%</div></div>
          <div class="metric" style="padding:6px; min-width:70px;"><div class="label" style="font-size:9px;">HP</div><div class="val" style="font-size:13px;">+${stats.Health}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${statMax.Health}%</div></div>
        </div>
        <div class="stats-row-scroll sr-2col" style="margin-bottom:14px;">
          ${t12ResourceCard(T12_RESOURCE_ICONS.steel, t("resource_steel"), Math.round(needed.steel).toLocaleString())}
          ${t12ResourceCard(T12_RESOURCE_ICONS.refined_fc, t("resource_refined_fc"), Math.round(needed.refined_fc).toLocaleString())}
          ${t12ResourceCard(T12_RESOURCE_ICONS.fc_shard, t("resource_fc_shard"), Math.round(needed.fc_shard).toLocaleString())}
          ${t12ResourceCard(null, t("time_label"), t12FormatTime(applyResearchPct(needed.time_hours)))}
        </div>
        ${groups
          .map((group) => {
            const defs = T12_ITEM_DEFS.filter((d) => d.group === group);
            const isSingle = defs.length === 1;
            return `
          <div style="padding:10px 0; border-top:1px solid var(--line);">
            <div class="meta" style="margin-bottom:8px; font-weight:600; color:var(--frost); ${isSingle ? "text-align:center;" : ""}">${esc(tT12Group(group))}</div>
            <div class="${isSingle ? "" : `t12-grid t12-grid-${defs.length}`}" style="display:${isSingle ? "flex" : "grid"}; ${isSingle ? "justify-content:center;" : `grid-template-columns:repeat(${defs.length}, 1fr);`} gap:12px;">
              ${defs
                .map(
                  (def) => `
                <div style="${isSingle ? "width:260px; text-align:center;" : ""}">
                  <div class="meta" style="font-size:11px; margin-bottom:4px;">${esc(tT12Label(def.label))}</div>
                  ${levelSelectHtml(def, T12_STATE[troop][def.key] || 0, t12TargetOf(troop, def))}
                </div>`
                )
                .join("")}
            </div>
          </div>`;
          })
          .join("")}
      </div>`;
    wireTroopSwipe(troopsEl, T12_TROOPS, t12ActiveTroop, (t) => { t12ActiveTroop = t; renderTroopPanels(); });

    troopsEl.querySelectorAll("select[data-t12item]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        T12_STATE[troop][sel.dataset.t12item] = Number(sel.value);
        await saveCalcState("t12_research", T12_STATE);
        renderTotals();
        renderTroopPanels();
      });
    });
    troopsEl.querySelectorAll("select[data-t12target]").forEach((sel) => {
      sel.addEventListener("change", async () => {
        T12_TARGET[troop] = T12_TARGET[troop] || {};
        T12_TARGET[troop][sel.dataset.t12target] = Number(sel.value);
        await saveCalcState("t12_research_target", T12_TARGET);
        renderTotals();
        renderTroopPanels();
      });
    });
  }

  renderTotals();
  renderTroopPanels();
}

async function renderFacilityPage() {
  const buildings = await sb(`skins?user_id=eq.${USER_ID}&category=eq.Facility&select=id,name,bonus_type,bonus_value,owned,image_url&order=sort_order.asc`);

  content.innerHTML = `
    <div class="page-head">

        <div class="sub" id="facilitySummaryLine"></div>

      <div class="stats-row-scroll facility-cards" id="facilityCards" style="align-items:stretch;"></div>

  function render() {
    const ownedCount = buildings.filter((b) => b.owned).length;
    document.getElementById("facilitySummaryLine").textContent = `${ownedCount} / ${buildings.length} ${t("buildings_owned_summary")}`;

    });
    document.getElementById("facilityTotals").innerHTML = Object.entries(maxByType).length
      ? Object.entries(maxByType)
          .map(

              `<div class="metric" style="padding:6px; min-width:80px;"><div class="label" style="font-size:9px;">${esc(t("total_prefix"))} ${esc(tStatLabel(type))}</div><div class="val" style="font-size:13px;">+${(totalsByType[type] || 0).toFixed(1)}%</div><div class="meta" style="font-size:8.5px; margin-top:2px;">${esc(t("of_max_prefix"))} +${maxVal.toFixed(1)}%</div></div>`
          )
          .join("")
      : `<div class="metric"><div class="label">${esc(t("total_bonus"))}</div><div class="val">+0%</div></div>`;



    const cardsEl = document.getElementById("facilityCards");
    cardsEl.innerHTML = buildings
      .map(
        (b) => `
      <div class="skin-card ${b.owned ? "owned" : ""}" data-facility="${b.id}" style="flex:0 0 140px; width:140px;">
        <div class="thumb island-thumb">
          ${b.image_url ? `<img src="${esc(b.image_url)}" alt="" loading="lazy" />` : `<div class="ph">${esc(b.name[0])}</div>`}
        </div>
        <div class="info">
          <div class="sname">${esc(b.name)}</div>
          <div class="sbonus">${b.bonus_value != null ? `+${Number(b.bonus_value)}% ${esc(tStatLabel(b.bonus_type || ""))}` : esc(t("bonus_unknown"))}</div>
          <div class="sowned">${b.owned ? esc(t("checkmark_owned")) : esc(t("not_owned_label"))}</div>
        </div>
      </div>`
      )
      .join("");

    cardsEl.querySelectorAll("[data-facility]").forEach((card) => {
      card.addEventListener("click", async (e) => {
        const b = buildings.find((x) => x.id === card.dataset.facility);
        const newOwned = !b.owned;
        try {
          await sb(`skins?id=eq.${b.id}`, { method: "PATCH", body: JSON.stringify({ owned: newOwned }) });
          b.owned = newOwned;
          render();
        } catch (err) {
          toast("Couldn't update building", true);
        }
      });
    });
  }

  render();
}

// ---- Pack Resources: the Packs page column dropdown ----
// Built-in names can be hidden and ordered; custom names can be added with
// an icon and, optionally, what one of them opens into (so a custom chest
// counts toward the real materials in Pack cost).
async function renderAdminPackResources(body) {
  await ensureSiteConfig();
  const cfg = packResourceConfig();
  const custom = cfg.custom.map((x) => ({ name: x.name, icon: x.icon || "", contents: x.contents || {} }));
  const hidden = new Set(cfg.hidden.map((n) => String(n).toLowerCase()));
  const removedLower = new Set(cfg.removed.map((n) => String(n).toLowerCase()));
  const builtin = PACK_RESOURCE_NAMES.filter((n) => !PACK_RESOURCE_HIDDEN.has(n) && !removedLower.has(n.toLowerCase()));
  const all = [...builtin.map((n) => ({ name: n, builtin: true })), ...custom.map((c) => ({ ...c, builtin: false }))];
  const orderIdx = (n) => { const i = cfg.order.findIndex((o) => String(o).toLowerCase() === n.toLowerCase()); return i === -1 ? Infinity : i; };
  all.sort((a, b) => { const oa = orderIdx(a.name), ob = orderIdx(b.name); if (oa !== ob) return oa - ob; return materialDisplayName(a.name).localeCompare(materialDisplayName(b.name), undefined, { numeric: true, sensitivity: "base" }); });
  const contentsText = (c) => Object.entries(c || {}).map(([k, v]) => `${k}: ${v}`).join(", ");
  let resRowSeq = 0;
  const rowHtml = (r, i, n) => `
    <tr data-resrow="r${++resRowSeq}" ${r.builtin ? "" : `data-custom="1"`}>
      ${adminReorderCellHtml(`r${resRowSeq}`, i, n == null ? all.length : n)}
      <td style="padding:4px;">${r.builtin ? `<span style="font-weight:600;">${esc(materialDisplayName(r.name))}</span><input type="hidden" data-f="name" value="${esc(r.name)}" />` : `<input data-f="name" value="${esc(r.name)}" style="width:170px;" />`}</td>
      <td style="padding:4px;">${r.builtin ? `<span class="meta" style="font-size:11px;">built-in</span>` : `<span style="display:inline-flex; gap:4px; align-items:center;"><input data-f="icon" value="${esc(r.icon || "")}" placeholder="icons/…png" style="width:150px;" />${uploadBtnHtml()}</span>`}</td>
      <td style="padding:4px;"><input data-f="contents" value="${esc(contentsText(r.builtin ? (cfg.gives[r.name] || PACK_BUNDLES[r.name]) : r.contents))}" placeholder="${r.builtin ? "nothing (plain item)" : "e.g. Design Plan: 1, Polishing Solution: 4"}" style="width:260px;" /></td>
      <td style="padding:4px; text-align:center;"><input type="checkbox" data-f="hidden" ${hidden.has(r.name.toLowerCase()) ? "checked" : ""} /></td>
      <td style="padding:4px;"><button class="btn ghost small" data-resdel type="button" title="Remove from the dropdown">&#10005;</button></td>
    </tr>`;
  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Pack Resources</h2>
      <p class="desc">These are the names offered in the column dropdown on the Packs page. Drag a row (or use ▲▼) to sort the dropdown, then Save all; tick Hide to keep a name out of it, and add your own items below. "Gives" says what one of the item opens into, in real materials (e.g. Chief Gear Chest → Design Plan: 1, Polishing Solution: 4, Hardened Alloy: 400), so Pack cost can count it; leave it empty for a plain item. Built-in names can't be renamed; ✕ removes a name from the dropdown (built-in ones can be restored from the Removed list below).</p>
      <div class="adm-scroll">
        <table style="border-collapse:collapse; font-size:12.5px; width:100%;">
          <thead><tr>${["", "Name", "Icon", "Gives (per 1)", "Hide", ""].map((h) => `<th style="text-align:start; padding:6px 4px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${h}</th>`).join("")}</tr></thead>
          <tbody id="resRows">${all.map((r, i) => rowHtml(r, i, all.length)).join("")}</tbody>
        </table>
      </div>
      <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
        <button class="btn ghost small" id="resAdd" type="button">+ Add resource</button>
        <button class="btn small" id="resSave" type="button">Save all</button>
      </div>
      ${cfg.removed.length ? `<div style="margin-top:14px; border-top:1px solid var(--line); padding-top:10px;">
        <div class="meta" style="font-size:11px; font-weight:600; margin-bottom:6px;">Removed (not in the dropdown)</div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;">${cfg.removed.map((n) => `<button class="btn ghost small" data-resrestore="${esc(n)}" type="button" title="Restore">${esc(materialDisplayName(n))} &#8634;</button>`).join("")}</div>
      </div>` : ""}
    </div>`;
  let removedNow = cfg.removed.slice();
  body.querySelectorAll("[data-resrestore]").forEach((b) => b.addEventListener("click", async () => {
    removedNow = removedNow.filter((n) => n.toLowerCase() !== b.dataset.resrestore.toLowerCase());
    await saveSiteConfig("pack_resources", { ...siteConfig("pack_resources", {}), removed: removedNow });
    toast("Restored"); renderAdminPackResources(body);
  }));
  const rowsEl = body.querySelector("#resRows");
  wireAdminReorder(rowsEl, "data-resrow", null);
  body.querySelector("#resAdd").addEventListener("click", () => {
    rowsEl.insertAdjacentHTML("beforeend", rowHtml({ name: "", icon: "", contents: {}, builtin: false }, rowsEl.children.length, rowsEl.children.length + 1));
    rowsEl.lastElementChild.querySelector('[data-f="name"]').focus();
    // New row: its own move buttons / grip need wiring too.
    wireAdminReorder(rowsEl, "data-resrow", null);
  });
  rowsEl.addEventListener("click", (e) => {
    const b = e.target.closest("[data-resdel]"); if (!b) return;
    const tr = b.closest("tr");
    if (!tr.dataset.custom) { const n = tr.querySelector('[data-f="name"]').value; if (n && !removedNow.some((x) => x.toLowerCase() === n.toLowerCase())) removedNow.push(n); }
    tr.remove();
  });
  body.querySelector("#resSave").addEventListener("click", async () => {
    const rows = [...rowsEl.querySelectorAll("[data-resrow]")];
    const parseContents = (txt) => { const out = {}; String(txt || "").split(",").forEach((part) => { const m = part.split(":"); if (m.length < 2) return; const k = m[0].trim(), v = Number(String(m[1]).replace(/,/g, "").trim()); if (k && v > 0) out[k] = v; }); return out; };
    const items = rows.map((tr, i) => ({
      builtin: !tr.dataset.custom,
      order: i,
      name: tr.querySelector('[data-f="name"]').value.trim(),
      icon: (tr.querySelector('[data-f="icon"]') || {}).value || "",
      contents: parseContents((tr.querySelector('[data-f="contents"]') || {}).value),
      hidden: tr.querySelector('[data-f="hidden"]').checked,
    })).filter((x) => x.name);
    const dup = items.map((x) => x.name.toLowerCase()).find((n, i, a) => a.indexOf(n) !== i);
    if (dup) { toast(`Duplicate name: ${dup}`, true); return; }
    const same = (a, b) => JSON.stringify(a || {}) === JSON.stringify(b || {});
    const gives = {};
    items.filter((x) => x.builtin).forEach((x) => { if (!same(x.contents, PACK_BUNDLES[x.name] || {})) gives[x.name] = x.contents; });
    const value = {
      removed: removedNow,
      gives,
      custom: items.filter((x) => !x.builtin).map((x) => ({ name: x.name, icon: x.icon.trim(), contents: x.contents })),
      hidden: items.filter((x) => x.hidden).map((x) => x.name),
      order: items.slice().sort((a, b) => a.order - b.order).map((x) => x.name),
    };
    try { await saveSiteConfig("pack_resources", value); PACK_TABLES_CACHE = null; toast("Pack resources saved"); renderAdminPackResources(body); }
    catch (err) { toast(err.message || "Couldn't save", true); }
  });
}

async function renderAdminVisibility(body) {
  await ensureUiVisibility();
  await Promise.all([ensureExpertsRosterGlobal(), ensurePetsData()]);
  const pages = visitorPageList();
  const experts = EXPERTS_IN_ORDER_GLOBAL.slice();
  const pets = [...new Set([...Object.keys(PETS_NODES_CACHE || {}), ...Object.keys(PET_REFINE_CACHE || {})])];
  const row = (kind, name, label, sub) => `
    <label style="display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line); cursor:pointer; font-size:13px;">

      <span style="flex:1 1 0; min-width:0;">${esc(label)}${sub ? ` <span class="meta" style="font-size:11px;">· ${esc(sub)}</span>` : ""}</span>
      <span class="meta" data-visstate style="font-size:11px; color:${isHiddenFromVisitors(kind, name) ? "var(--amber)" : "var(--good)"};">${esc(isHiddenFromVisitors(kind, name) ? t("vis_hidden") : t("vis_visible"))}</span>
    </label>`;
  const section = (title, desc, rowsHtml) => `
    <div class="panel" style="margin-bottom:16px;">
      <h2 style="margin-bottom:4px;">${esc(title)}</h2>
      <p class="desc" style="margin:0 0 8px;">${esc(desc)}</p>
      ${rowsHtml || `<div class="meta">—</div>`}
    </div>`;
  body.innerHTML = `
    <p class="desc" style="margin:0 0 12px;">${esc(t("vis_admin_intro"))}</p>
    ${section(t("vis_pages"), t("vis_pages_desc"), pages.map((p) => row("page", p.tab, p.label, p.group)).join(""))}
    ${section(t("vis_experts"), t("vis_experts_desc"), experts.map((e) => row("experts", e, dataName(e))).join(""))}
    ${section(t("vis_pets"), t("vis_pets_desc"), pets.map((p) => row("pets", p, dataName(p))).join(""))}`;
  body.querySelectorAll("[data-visitem]").forEach((cb) => cb.addEventListener("change", async () => {
    const [kind, name] = cb.dataset.visitem.split("|");
    cb.disabled = true;
    try {
      await setHiddenFromVisitors(kind, name, !cb.checked);
      const st = cb.closest("label").querySelector("[data-visstate]");
      const hidden = !cb.checked;
      st.textContent = hidden ? t("vis_hidden") : t("vis_visible");
      st.style.color = hidden ? "var(--amber)" : "var(--good)";
      toast(hidden ? t("vis_now_hidden") : t("vis_now_visible"));
      applyPageVisibility();
    } catch (err) { toast(err.message || "Couldn't save", true); cb.checked = !cb.checked; }
    cb.disabled = false;
  }));
}
// Hides visitor-hidden pages from the menus (owner always sees everything).
function applyPageVisibility() {
  document.querySelectorAll("#topnavGroups .topnav-group").forEach((g) => {
    let visible = 0;
    g.querySelectorAll("button[data-tab]").forEach((b) => {
      if (b.hasAttribute("data-ownertab")) { if (b.style.display !== "none") visible++; return; }
      const hide = !IS_OWNER && isHiddenFromVisitors("page", b.dataset.tab);
      b.style.display = hide ? "none" : "";
      if (!hide) visible++;
    });
    if (g.id !== "adminNavGroup") g.style.display = visible ? "" : "none";
  });
}

      const stats = document.getElementById("qfStats").value.split(/[\s,;]+/).map((x) => x.trim().toUpperCase()).filter(Boolean);
      const values = document.getElementById("qfValues").value.split(/[\s,;]+/).map((x) => x.trim()).filter((x) => x !== "").map(Number).filter((n) => Number.isFinite(n));
      const sigils = Number(document.getElementById("qfSigils").value);
      const stat2 = document.getElementById("qfStat2").value.trim().toUpperCase() || null;
      const value2raw = document.getElementById("qfValue2").value;
      const value2 = value2raw === "" ? null : Number(value2raw);
      const name = document.getElementById("qfName").value.trim() || null;
      if (!stats.length) throw new Error("Enter at least one stat in the pattern");
      if (!values.length) throw new Error("Enter a value %");
      const out = [];
      for (let lvl = step, i = 0; lvl <= max; lvl += step, i++) {
        out.push({ level: lvl, stat_type: stats[i % stats.length], stat_value: values[Math.min(i, values.length - 1)], sigil_per_level: Number.isFinite(sigils) ? sigils : null, sigil_cost: null, stat_type2: stat2, stat_value2: stat2 ? value2 : null, path_name: name });
      }
      return out;
    };

// ---- Generic flat-table editor (small tables, no expert/pet grouping) ----
// Used for Chief Charm levels, Tundra Album tiers, Collection Gallery tiers.
// ---- Reorder rows by moving them (drag the grip, or ▲/▼ on touch) ----
// Every admin table with an order uses this instead of a typed number:
// the row is moved in place, then the caller gets the new id order and
// writes sort_order = position.
const ADMIN_TH = `<th style="text-align:start; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">`;
function adminReorderCellHtml(id, idx, n) {
  const sid = esc(String(id));
  return `<td style="padding:4px; white-space:nowrap;">
    <span draggable="true" data-grip="${sid}" title="Drag to move" style="cursor:grab; user-select:none; color:var(--muted); padding:0 4px; font-size:15px; display:inline-block; vertical-align:middle;">&#8942;&#8942;</span>
    <button type="button" class="btn small ghost" data-rowup="${sid}" ${idx === 0 ? "disabled" : ""} title="Move up" style="padding:2px 6px;">&#9650;</button>
    <button type="button" class="btn small ghost" data-rowdown="${sid}" ${idx === n - 1 ? "disabled" : ""} title="Move down" style="padding:2px 6px;">&#9660;</button>
  </td>`;
}
function wireAdminReorder(container, rowAttr, onReorder) {
  const rowsOf = () => [...container.querySelectorAll(`tr[${rowAttr}]`)];
  const idOf = (tr) => tr.getAttribute(rowAttr);
  const refreshButtons = () => {
    const list = rowsOf();
    list.forEach((tr, i) => {
      const up = tr.querySelector("[data-rowup]"), down = tr.querySelector("[data-rowdown]");
      if (up) up.disabled = i === 0;
      if (down) down.disabled = i === list.length - 1;
    });
  };
  const place = (id, toIdx) => {
    const list = rowsOf();
    const tr = list.find((x) => idOf(x) === id);
    if (!tr) return;
    const others = list.filter((x) => x !== tr);
    const ref = others[toIdx] || null;
    tr.parentNode.insertBefore(tr, ref);
    refreshButtons();
    if (onReorder) onReorder(rowsOf().map(idOf));
  };
  // Safe to call again after rows are added: already-wired elements are skipped.
  const fresh = (sel) => [...container.querySelectorAll(sel)].filter((el) => !el.dataset.rw && (el.dataset.rw = "1"));
  fresh("[data-rowup]").forEach((b) => b.addEventListener("click", () => {
    const i = rowsOf().findIndex((tr) => idOf(tr) === b.dataset.rowup);
    if (i > 0) place(b.dataset.rowup, i - 1);
  }));
  fresh("[data-rowdown]").forEach((b) => b.addEventListener("click", () => {
    const list = rowsOf(); const i = list.findIndex((tr) => idOf(tr) === b.dataset.rowdown);
    if (i !== -1 && i < list.length - 1) place(b.dataset.rowdown, i + 1);
  }));
  const dragId = container.__dragState || (container.__dragState = { id: null });
  fresh("[data-grip]").forEach((g) => {
    g.addEventListener("dragstart", (e) => {
      dragId.id = g.dataset.grip;
      e.dataTransfer.effectAllowed = "move";
      try { e.dataTransfer.setData("text/plain", dragId.id); } catch (_) {}
      g.closest("tr").style.opacity = "0.45";
    });
    g.addEventListener("dragend", () => { dragId.id = null; rowsOf().forEach((tr) => { tr.style.opacity = ""; tr.style.boxShadow = ""; }); });
  });
  fresh(`tr[${rowAttr}]`).forEach((tr) => {
    tr.addEventListener("dragover", (e) => {
      if (!dragId.id) return;
      e.preventDefault(); e.dataTransfer.dropEffect = "move";
      const r = tr.getBoundingClientRect();
      tr.style.boxShadow = e.clientY > r.top + r.height / 2 ? "inset 0 -2px 0 var(--ice)" : "inset 0 2px 0 var(--ice)";
    });
    tr.addEventListener("dragleave", () => { tr.style.boxShadow = ""; });
    tr.addEventListener("drop", (e) => {
      if (!dragId.id) return;
      e.preventDefault();
      const id = dragId.id; dragId.id = null;
      rowsOf().forEach((x) => { x.style.opacity = ""; x.style.boxShadow = ""; });
      const list = rowsOf().filter((x) => idOf(x) !== id);
      let to = list.indexOf(tr);
      if (to === -1) return;
      const r = tr.getBoundingClientRect();
      if (e.clientY > r.top + r.height / 2) to += 1;
      place(id, to);
    });
  });
}
// sort_order = position, written only for rows whose position changed.
async function saveAdminRowOrder(table, rows, orderedIds) {
  const byId = new Map(rows.map((r) => [String(r.id), r]));
  // Keep the table's existing numbers and just hand them out in the new
  // order (so only the rows that actually moved get written); fall back to
  // plain positions when the numbers aren't unique.
  const existing = rows.map((r) => Number(r.sort_order)).filter((v) => Number.isFinite(v)).sort((x, y) => x - y);
  const unique = existing.length === rows.length && existing.every((v, i) => i === 0 || v !== existing[i - 1]);
  const patches = [];
  orderedIds.forEach((id, idx) => {
    const r = byId.get(String(id));
    const val = unique ? existing[idx] : idx;
    if (r && Number(r.sort_order) !== val) patches.push(sb(`${table}?id=eq.${encodeURIComponent(id)}`, { method: "PATCH", body: JSON.stringify({ sort_order: val }) }));
  });
  await Promise.all(patches);
}
// Generic cell for a column: the order column becomes a hidden field
// (kept so Save still sends it), everything else a normal input.
function adminColCellHtml(c, r, width) {
  if (c.key === "sort_order") return `<input type="hidden" data-f="sort_order" value="${esc(r.sort_order ?? "")}" />`;
  return `<td style="padding:4px;"><input data-f="${c.key}" ${c.type === "number" ? 'type="number" step="any"' : ""} value="${esc(r[c.key] ?? "")}" style="width:${width};" /></td>`;
}
function adminColHeadHtml(cols, withReorder) {
  return (withReorder ? `<th></th>` : "") + cols.filter((c) => c.key !== "sort_order").map((c) => `${ADMIN_TH}${esc(c.label)}</th>`).join("");
}

        ${cfg.cols.map((c) => `<input class="field-num" name="${c.key}" placeholder="${esc(c.label)}" ${canReorder && c.key === "sort_order" ? 'type="hidden"' : c.type === "number" ? 'type="number" step="any"' : ""} style="width:130px;" />`).join("")}
        <button class="btn" type="submit">Add row</button>
      </form>
      <div class="err" id="adminFlatAddErr"></div>
    </div>
    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;">
        <h2 style="margin:0;">${esc(cfg.title)} (${rows.length})</h2>
        <button class="btn small" id="adminFlatSaveAll">Save all</button>
      </div>
      <div class="adm-scroll">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <thead><tr>
            ${canReorder ? adminColHeadHtml(cfg.cols, true) : cfg.cols.map((c) => `${ADMIN_TH}${esc(c.label)}</th>`).join("")}
            <th></th>
          </tr></thead>
          <tbody>
            ${rows
              .map(
                (r, idx) => `
              <tr data-flatrow="${r.id}">
                ${canReorder ? adminReorderCellHtml(r.id, idx, rows.length) : ""}
                ${cfg.cols
                  .map((c) => (canReorder ? adminColCellHtml(c, r, "110px") : `<td style="padding:4px;"><input data-f="${c.key}" ${c.type === "number" ? 'type="number" step="any"' : ""} value="${esc(r[c.key] ?? "")}" style="width:110px;" /></td>`))
                  .join("")}
                <td style="padding:4px; white-space:nowrap;">
                  <button class="btn small ghost" data-flatsave="${r.id}">Save</button>
                  <button class="btn small ghost" data-flatdel="${r.id}" style="color:var(--danger);">Delete</button>
                </td>
              </tr>`
              )
              .join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const saveRow = async (id) => {
    const tr = body.querySelector(`tr[data-flatrow="${id}"]`);
    const patch = {};
    tr.querySelectorAll("[data-f]").forEach((el) => {
      const c = cfg.cols.find((c) => c.key === el.dataset.f);
      let v = el.value;
      if (c.type === "number") v = v === "" ? null : Number(v);
      patch[el.dataset.f] = v;
    });
    await sb(`${cfg.table}?id=eq.${id}`, { method: "PATCH", body: JSON.stringify(patch) });
  };
  body.querySelectorAll("[data-flatsave]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await saveRow(btn.dataset.flatsave);
        if (cfg.onSave) cfg.onSave();
        toast("Saved");
      } catch (err) {
        toast("Couldn't save", true);
      }
    });
  });
  const saveAllBtn = document.getElementById("adminFlatSaveAll");
  if (saveAllBtn) {
    saveAllBtn.addEventListener("click", async () => {
      saveAllBtn.disabled = true;
      saveAllBtn.textContent = "Saving\u2026";
      try {
        await Promise.all(rows.map((r) => saveRow(r.id)));
        if (cfg.onSave) cfg.onSave();
        toast(`Saved ${rows.length} row${rows.length === 1 ? "" : "s"}`);
      } catch (err) {
        toast("Couldn't save all", true);
      }
      saveAllBtn.disabled = false;
      saveAllBtn.textContent = "Save all";
    });
  }
  if (canReorder) {
    wireAdminReorder(body, "data-flatrow", async (orderedIds) => {
      try {
        await saveAdminRowOrder(cfg.table, rows, orderedIds);
        if (cfg.onSave) cfg.onSave();
        renderAdminFlatLevels(body, cfg);
      } catch (err) {
        toast("Couldn't reorder", true);
      }
    });
  }
  body.querySelectorAll("[data-flatdel]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this row?")) return;
      try {
        await sb(`${cfg.table}?id=eq.${btn.dataset.flatdel}`, { method: "DELETE" });
        if (cfg.onSave) cfg.onSave();
        toast("Deleted");
        renderAdminFlatLevels(body, cfg);
      } catch (err) {
        toast("Couldn't delete", true);
      }
    });
  });

  document.getElementById("adminFlatAddForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminFlatAddErr");
    errEl.textContent = "";
    const payload = {};
    cfg.cols.forEach((c) => {
      let v = f[c.key].value;
      if (c.key === "sort_order" && v === "") {
        const maxOrder = rows.reduce((m, r) => Math.max(m, r.sort_order || 0), -1);
        v = maxOrder + 1;
      } else if (c.type === "number") {
        v = v === "" ? 0 : Number(v);
      }
      payload[c.key] = v;
    });
    try {
      await sb(`${cfg.table}`, { method: "POST", body: JSON.stringify(payload) });
      if (cfg.onSave) cfg.onSave();
      toast("Row added");
      renderAdminFlatLevels(body, cfg);
    } catch (err) {
      errEl.textContent = "Couldn't add row";
    }
  });
}

// ---- VIP editor (buff matrix: rows = tiers, columns = Attack/Defense/Lethality/Health) ----
async function renderAdminVip(body) {
  let [table] = await sb(`buff_tables?name=eq.VIP Tier&user_id=eq.${PROGRESSION_OWNER_ID}&select=id`);
  if (!table) {
    const [created] = await sb(`buff_tables`, { method: "POST", body: JSON.stringify({ user_id: USER_ID, name: "VIP Tier", sort_order: 0 }) });
    table = created;
  }
  let columns = await sb(`buff_columns?table_id=eq.${table.id}&select=id,name&order=sort_order.asc`);
  const STAT_NAMES = ["Attack", "Defense", "Lethality", "Health"];
  // Auto-create the 4 stat columns if missing.
  for (const statName of STAT_NAMES) {
    if (!columns.find((c) => c.name === statName)) {
      const [created] = await sb(`buff_columns`, { method: "POST", body: JSON.stringify({ table_id: table.id, name: statName, category: statName, sort_order: STAT_NAMES.indexOf(statName) }) });
      columns.push(created);
    }
  }
  const colByName = Object.fromEntries(columns.map((c) => [c.name, c.id]));
  const rows = await sb(`buff_rows?table_id=eq.${table.id}&select=id,name,sort_order,buff_cells(id,value,column_id)&order=sort_order.asc`);

  body.innerHTML = `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Add a VIP tier</h2>
      <form class="inline" id="adminVipAddForm">
        <input class="flex1" name="name" placeholder="Tier name (e.g. VIP 12)" required />
        <button class="btn" type="submit">Add tier</button>
      </form>
      <div class="err" id="adminVipAddErr"></div>
    </div>
    <div class="panel">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px;">
        <h2 style="margin:0;">VIP tiers (${rows.length})</h2>
        <button class="btn small" id="adminVipSaveAll">Save all</button>
      </div>
      <div class="adm-scroll">
        <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
          <thead><tr>
            <th></th>
            <th style="text-align:start; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">Tier</th>
            ${STAT_NAMES.map((s) => `<th style="text-align:start; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600;">${s} %</th>`).join("")}
            <th></th>
          </tr></thead>
          <tbody>
            ${rows
              .map((r, idx) => {
                const cellByCol = Object.fromEntries(r.buff_cells.map((c) => [c.column_id, c.value]));
                return `
              <tr data-viprow="${r.id}">
                ${adminReorderCellHtml(r.id, idx, rows.length)}
                <td style="padding:4px;"><input data-vipname value="${esc(r.name)}" style="width:100px;" /></td>
                ${STAT_NAMES.map((s) => `<td style="padding:4px;"><input data-vipstat="${esc(s)}" type="number" step="any" value="${cellByCol[colByName[s]] ?? ""}" style="width:90px;" /></td>`).join("")}
                <td style="padding:4px; white-space:nowrap;">
                  <button class="btn small ghost" data-vipsave="${r.id}">Save</button>
                  <button class="btn small ghost" data-vipdel="${r.id}" style="color:var(--danger);">Delete</button>
                </td>
              </tr>`;
              })
              .join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const saveVipRow = async (id) => {
    const tr = body.querySelector(`tr[data-viprow="${id}"]`);
    const name = tr.querySelector("[data-vipname]").value.trim();
    await sb(`buff_rows?id=eq.${id}`, { method: "PATCH", body: JSON.stringify({ name }) });
    for (const s of STAT_NAMES) {
      const v = tr.querySelector(`[data-vipstat="${s}"]`).value;
      const colId = colByName[s];
      const existing = await sb(`buff_cells?row_id=eq.${id}&column_id=eq.${colId}&select=id`);
      if (existing.length) {
        await sb(`buff_cells?id=eq.${existing[0].id}`, { method: "PATCH", body: JSON.stringify({ value: v === "" ? null : Number(v) }) });
      } else if (v !== "") {
        await sb(`buff_cells`, { method: "POST", body: JSON.stringify({ row_id: id, column_id: colId, value: Number(v) }) });
      }
    }
    VIP_ROWS_CACHE = null;
  };
  wireAdminReorder(body, "data-viprow", async (orderedIds) => {
    try { await saveAdminRowOrder("buff_rows", rows, orderedIds); VIP_ROWS_CACHE = null; renderAdminVip(body); }
    catch (err) { toast("Couldn't reorder", true); }
  });
  body.querySelectorAll("[data-vipsave]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      try {
        await saveVipRow(btn.dataset.vipsave);
        toast("Saved");
      } catch (err) {
        toast("Couldn't save", true);
      }
    });
  });
  document.getElementById("adminVipSaveAll").addEventListener("click", async () => {
    const btn = document.getElementById("adminVipSaveAll");
    btn.disabled = true;
    btn.textContent = "Saving\u2026";
    try {
      await Promise.all(rows.map((r) => saveVipRow(r.id)));
      toast(`Saved ${rows.length} row${rows.length === 1 ? "" : "s"}`);
    } catch (err) {
      toast("Couldn't save all", true);
    }
    btn.disabled = false;
    btn.textContent = "Save all";
  });
  body.querySelectorAll("[data-vipdel]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm("Delete this VIP tier?")) return;
      try {
        await sb(`buff_rows?id=eq.${btn.dataset.vipdel}`, { method: "DELETE" });
        VIP_ROWS_CACHE = null;
        toast("Deleted");
        renderAdminVip(body);
      } catch (err) {
        toast("Couldn't delete", true);
      }
    });
  });

  document.getElementById("adminVipAddForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target;
    const errEl = document.getElementById("adminVipAddErr");
    errEl.textContent = "";
    const name = f.name.value.trim();
    if (!name) { errEl.textContent = "Enter a tier name"; return; }
    try {
      const maxOrder = rows.reduce((m, r) => Math.max(m, r.sort_order || 0), 0);
      await sb(`buff_rows`, { method: "POST", body: JSON.stringify({ table_id: table.id, name, sort_order: maxOrder + 1 }) });
      VIP_ROWS_CACHE = null;
      toast("Tier added");
      renderAdminVip(body);
    } catch (err) {
      errEl.textContent = "Couldn't add tier";
    }
  });
}

          name,
          image_url: f.image_url.value.trim() || null,
